    canonical_id: IB/topology/sheet-2/qx02
    primary_solution: courses/IB/topology/sheets/sheet-2/qx02/solution.tex
    source_hashes:
      question.tex: e01c868b5dc18422da184a10fc6fc85d65aaea1b97aabd77859cc5d703012c39
      solution.tex: 06a3061c9732057fe7a12ae0dd8f20e0fbad5231eacec3bc66f809c6790aed8c
