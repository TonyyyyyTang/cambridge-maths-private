    fresh_derivation: '# Independent rework


      Every polynomial is bounded on $[0,1]$. The supremum on $I$ is nonnegative,
      absolutely homogeneous and subadditive by the pointwise inequalities, and vanishes
      only for the zero polynomial because a nonzero polynomial has finitely many
      roots. Choose $I=[0,1/3]$, $J=[2/3,1]$ and let $h$ be continuous, identically
      zero on $I$, identically one on $J$, and linear between them. By Weierstrass
      there are polynomials $p_n$ with $\sup_{[0,1]}|p_n-h|<1/n$. Thus $p_n\to0$ in
      $\|\cdot\|_I$ but $p_n\to1$ in $\|\cdot\|_J$, with distinct polynomial limits.


      Every admissible sequence norm among the three dominates each $|x_i|$. Any norm
      convergence implies coordinate convergence to the corresponding entries, so
      two limits cannot differ. On $C([0,1])$ the inequalities $\|f\|_1\le\|f\|_2\le\|f\|_\infty$
      follow by Cauchy–Schwarz and interval length one. Given any two of them, convergence
      in the stronger implies convergence to the same limit in the weaker. The weaker
      norm separates continuous functions, hence limits there are unique.

      '
