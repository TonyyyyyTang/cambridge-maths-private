      solution.tex: 7e24505abf68a76b6627b05a7c5c44d0e13ec917e423b21c1d2f5d4e615d57ba
    check_sha256: 1b3d18165ee63192e4b3094d797e8914cb2bf76e06299f6decb55fc4a47186f6
    check_result: Euclidean identity, fixed rays, opposite directions and norm dependence
      passed.
    exit_code: 0
    comparison: Testing the vector integral against itself gives the Euclidean inequality.
      Equality for every norm requires the Euclidean equality case, a single nonnegative
      ray including zeros. Positive homogeneity gives the converse for each norm.
    fresh_sha256: 2a3fc4480f2777681ae510a0b3f84885534ce5b4ed44cc5c6b24205f9d51dd98
    fresh_derivation: '# Independent rework


      Coordinatewise integration gives $v\cdot v=\sum_i v_i\int f_i=\int v\cdot f$.
      By Cauchy–Schwarz this is at most $\|v\|_2\int\|f\|_2$. Divide for $v\ne0$;
      for $v=0$ the desired inequality is immediate.


      Equality for every norm implies equality for the Euclidean norm. If $v=0$, this
      makes the integral of the continuous nonnegative $\|f\|_2$ zero, hence $f=0$
      everywhere. Otherwise set $u=v/\|v\|_2$. The continuous nonnegative defect $\|f(t)\|_2-u\cdot
      f(t)$ has integral zero, so it vanishes everywhere. Equality in Cauchy–Schwarz
      with this sign says $f(t)=a(t)u$ with $a(t)=\|f(t)\|_2\ge0$, allowing zeros.
      Conversely such an $f$ gives both sides equal to $\|u\|\int a$ by homogeneity
      of any norm. These and the zero function exhaust the possibilities.

      '
