      in the supremum norm. By the referenced lemma $T$ has a unique fixed point:
      the unique fixed point of $T^j$ is carried by $T$ to a fixed point of $T^j$,
      hence is fixed by $T$. The fundamental theorem identifies fixed points with
      solutions, including the initial condition.


