    fresh_sha256: 81e2a94374de6cdfc03a69638d95ff56eb9b840fa161f841dcf50dca8b2e24b7
    fresh_derivation: '# Independent rework


      The hypothesis gives strict decrease of distances for distinct points (and implies
      a nonexpansive, hence continuous, map). Two distinct fixed points would contradict
      this strict inequality. On the complete space $[0,\infty)$ with its usual distance
      let $f(x)=x+e^{-x}$. This maps the half-line into itself and has no fixed point.
      Its derivative is $1-e^{-x}$; the mean-value theorem gives a ratio strictly
      below one for every distinct pair. A positive $L<1$ can be chosen between that
      ratio and one. The ratios for pairs $(n,n+1)$ tend to one, so there is no single
      contraction constant.


      On a nonempty compact metric space the continuous function $h(x)=d(x,f(x))$
      attains its minimum at $z$. Sequential compactness suffices: take a sequence
      approaching the infimum and pass to a convergent subsequence. If $h(z)>0$, then
      $h(f(z))=d(f(z),f(f(z)))<h(z)$, impossible. This proves existence and the earlier
      inequality gives uniqueness.

