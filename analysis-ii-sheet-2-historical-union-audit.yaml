    comparison: Diagonal extraction produces a bounded pointwise limit. The standard
      coordinate unit vectors are pairwise a unit apart in sup norm and disprove the
      asserted norm compactness.
    fresh_sha256: 0a4b9f20f8a48e2c16658cecb6a58741cbc5287db4b7072a6c1b1aa1a9e5de73
    fresh_derivation: '# Independent rework


      Choose $M$ bounding all the supremum norms. Each coordinate of each vector then
      lies in $[-M,M]$. Starting with the full sequence of indices, extract an infinite
      increasing subsequence $I_1$ along which coordinate 1 converges by real Bolzano–Weierstrass.
      Inductively extract $I_{j+1}\subset I_j$ for convergence of coordinate $j+1$.
      Let $k_j$ be the $j$th index of $I_j$ in increasing order. Then $k_{j+1}>k_j$,
      and for each fixed $i$ the tail with $j\ge i$ lies in $I_i$. The selected vectors
      therefore converge in every coordinate to a sequence with entries bounded by
      $M$.


      Regarding vectors as functions on the positive integers, this is pointwise convergence.
      Norm convergence requires uniform convergence over all coordinates. For the
      successive coordinate unit vectors $e_j$ the pointwise limit is zero but $\|e_j\|_\infty=1$,
      and $\|e_j-e_k\|_\infty=1$ for different indices. This bounded sequence has
      no norm-Cauchy, hence no norm-convergent, subsequence.

      '
