  analysis-ii-q06-24bbc1ec3d69:
    canonical_id: IB/analysis-ii/sheet-2/q06
    primary_solution: courses/IB/analysis-ii/sheets/sheet-2/q06/history/2026-11-21-exact-24bbc1ec3d69/solution.tex
