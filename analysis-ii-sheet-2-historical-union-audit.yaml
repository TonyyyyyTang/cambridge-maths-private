      form an increasing cover of $X$, since no $q$ equals $c$. No $U_j$ covers $X$
      by density of the rationals near $c$, so no finite subcollection suffices. Although
      bounded, $X$ is not closed in $\mathbb R$ because it omits $c$. Heine–Borel
      in Euclidean space therefore gives no compactness here.

