    fresh_sha256: 3fa9105845217a95f004f9751550a021fb6f6394e89dccca822c2ac3fb639e58
    fresh_derivation: '# Independent rework


      The printed hypothesis sums over $j$ but writes $\|x_n\|$; the parenthetical
      identifies the intended condition as $\sum_n\|x_n\|<\infty$. Taken for fixed
      $n$, the printed sum of a constant is finite only for $x_n=0$, and does not
      express absolute convergence.


      Let $s_N$ be the partial sums. For $m>n$, $\|s_m-s_n\|\le\sum_{j=n+1}^m\|x_j\|$.
      The tails of the convergent real series tend to zero uniformly in $m>n$, so
      the partial sums are Cauchy and converge in a complete space.


      Conversely assume the series implication holds for every sequence. Given a Cauchy
      sequence $u_j$, choose strictly increasing indices $n_k$ with $\|u_i-u_j\|<2^{-k}$
      whenever $i,j\ge n_k$. Then $\sum_k (u_{n_{k+1}}-u_{n_k})$ converges by the
      hypothesis. Its partial sums telescope to $u_{n_{K+1}}-u_{n_1}$, so a subsequence
      converges to some $u\in V$. For any tolerance choose a tail with pairwise distances
      below half that tolerance and then choose a subsequence term in this tail within
      half of $u$. The triangle inequality puts the entire tail within the tolerance.

      '
