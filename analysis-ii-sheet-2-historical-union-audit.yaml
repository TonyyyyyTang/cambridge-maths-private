    comparison: The uniform estimates for the sum and for the product of two bounded
      limits agree. Choosing one factor 1/n and the other x gives a nonuniform product
      even with one bounded limit.
    fresh_sha256: 6b5709fc0f24e3dff66fe1bb2e6f8ca9dd4bc131dc663aafbeee4ced873fdaff
    fresh_derivation: '# Independent rework


      The supremum of the sum error is at most $\|f_n-f\|_\infty+\|g_n-g\|_\infty\to0$.
      If $f,g$ are bounded, $g_n$ are uniformly bounded on a tail, since $\|g_n-g\|_\infty\to0$.
      The product error decomposes as $(f_n-f)g_n+f(g_n-g)$, whose supremum on that
      tail is at most $\|f_n-f\|_\infty(\|g\|_\infty+1)+\|f\|_\infty\|g_n-g\|_\infty\to0$.
      Counterexample even with bounded $f$: on $\mathbb R$ let $f_n=1/n$, $f=0$ and
      $g_n(x)=g(x)=x$. Both convergences are uniform; the error $x/n$ is unbounded
      for every $n$. Thus the one-bounded case has no guarantee. Uniform product convergence
      can still occur there (take $f_n=f=0$).

      '
