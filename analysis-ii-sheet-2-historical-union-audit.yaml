    source_hashes:
      question.tex: 90858de02fdbab04409a11613c468f1a50e0986cbd2bdfc8bea533fc43e2cef5
      solution.tex: f20f8b45973b5f7adb51dc1ef82105bb8d78f0c916a63e6d34443b06c9da58cd
    check_sha256: 491362d93d5df1ad939be27a1dc51e746279be08df8f9a2db5e26f3cd51cd739
    check_result: Relative endpoint witnesses, singleton covers and discrete fibres
      passed.
    exit_code: 0
