    fresh_derivation: '# Independent rework


      Choose $x_n\in A_n$. For $m,n\ge N$ both points lie in $A_N$, so their distance
      is at most its diameter. This bound tends to zero, giving a Cauchy sequence
      with a limit $x$. Every $A_N$ is closed and contains a tail, so $x$ lies in
      the intersection. Two points there would have distance at most every diameter,
      hence would coincide.


      For the ball question let $X=\{1,2,\dots\}$ with $d(i,i)=0$ and $d(i,j)=1+1/\min(i,j)$
      for distinct indices. This is a metric: distances between distinct points lie
      in $(1,2]$, so the triangle inequality with three distinct points follows, and
      repeated points pose no issue. Cauchy sequences are eventually constant, hence
      $X$ is complete. The closed ball about $n$ of radius $1+1/n$ is exactly $\{n,n+1,\dots\}$.
      These nested balls have empty intersection.

      '
