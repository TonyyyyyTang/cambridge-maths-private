      On $[0,1/n]$ take a triangular tent of height $2n$ at $1/(2n)$ and zero at both
      endpoints; extend it by zero to $[-1,1]$. These are continuous. Every positive
      fixed $x$ is beyond the support eventually, and every $x\le0$ has value zero
      always, so the pointwise limit is zero. Each integral equals $(1/n)(2n)/2=1$.
      If all $|f_n|\le1$, the constant 1 is an integrable majorant on $[-1,1]$. Dominated
      convergence makes their Lebesgue integrals tend to zero, and each equals its
      Riemann integral by continuity. Hence the uniformly bounded variant is impossible.

      '
