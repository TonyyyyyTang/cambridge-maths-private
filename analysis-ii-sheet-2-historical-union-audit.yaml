      proofs test the endpoints in each space and use open singleton fibres for the
      discrete-metric additions in the longer version.
    fresh_sha256: 21d4a66fcb4550ebdcfb26caea5a4603de0b4ce840ab737367282b13af583202
    fresh_derivation: '# Independent rework


      Write $A=(1,2]$. Relative openness is tested by balls intersected with the ambient
      space. If 2 has points immediately to its right in that space, no ball about
      2 lies inside $A$. If 1 belongs to the ambient space, it is a missing limit
      point, witnessed by $1+1/n$. Thus in $\mathbb R$ the set is neither open nor
      closed. In $[0,2]$ it is open as $(1,3)\cap[0,2]$, and not closed. In $(1,3)$
      it is closed as $(-\infty,2]\cap(1,3)$, and not open. In itself it is both open
      and closed.


      For the discrete metric each singleton is an open ball of radius $1/2$. Every
      subset is a union of these, and its complement is too. The compact subsets are
      precisely the finite ones, which admit a finite subcover from any cover by choosing
      one open set per point. An infinite subset''s singleton cover has no finite
      subcover. Cauchy with tolerance $1/2$ means an eventually constant sequence,
      and that condition suffices. Every function out of $X$ is continuous because
      all inverse images are open. A function into $X$ is continuous exactly when
      each singleton fibre is open, equivalently when it is locally constant. Open
      fibres suffice since inverse images of arbitrary sets are unions of fibres.

      '
