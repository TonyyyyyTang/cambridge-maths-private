    exit_code: 0
    comparison: The complement of the diagonal is open exactly under Hausdorff separation.
      The inverse image of the diagonal is the closed equalizer. Density then implies
      equality everywhere.
    fresh_sha256: 0624595bbb961ffa84b41410ac526958476f7ae37ee376581cf8aac839c79882
    fresh_derivation: '# Independent rework


      If $Y$ is Hausdorff, for $y\ne z$ take disjoint open neighborhoods $U,V$; the
      open rectangle $U\times V$ misses the diagonal and contains $(y,z)$. This makes
      the diagonal complement open. Conversely if the complement is open, its product-basis
      rectangle about any distinct pair must have disjoint factors (a common point
      would give a diagonal point in it). Thus $Y$ is Hausdorff. The map $x\mapsto(f(x),g(x))$
      is continuous, since inverse images of basic rectangles are intersections of
      open inverse images. Its inverse image of the closed diagonal is the equalizer,
      hence closed. A closed equalizer containing a dense set contains its closure
      $X$, giving equality everywhere.

      '
