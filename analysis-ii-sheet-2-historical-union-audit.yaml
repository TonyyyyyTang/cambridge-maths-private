  analysis-ii-qx74-56ffa5369555:
    canonical_id: IB/analysis-ii/sheet-2/qx74
    primary_solution: courses/IB/analysis-ii/sheets/sheet-2/qx74/solution.tex
    source_hashes:
      question.tex: 56ffa53695553cf6dab32611443081f555690ea0c49c90201590fe3da30aebc0
      solution.tex: ae7920d29e8c83ca4f69fd33ac009bfb4c075f54887f8eb6af05e2d32abdd678
    check_sha256: f92ecbfb573efa5bc9ec0b9ec6dc571412ce002ae8efabb49a13dc875c4a738e
    check_result: Verified the supporting example and bounds for qx74.
    exit_code: 0
    comparison: The finite-dimensional coordinate expansion proves boundedness. Homogeneity
      and the triangle inequality give the operator norm; normalization gives the
      least Lipschitz constant or equality of sphere, ratio and ball suprema wherever
      requested by this printing.
    fresh_sha256: 9a666b6d1011f09a3f44de871c9fd4e29462277d44e5f290df711304a65e899c
    fresh_derivation: '# Independent rework


      In Euclidean coordinates, linearity of $A$ gives $\|Av\|\le\sum_i |v_i|\|Ae_i\|\le(\sum_i\|Ae_i\|^2)^{1/2}\|v\|_2$.
      This proves continuity, finiteness of the supremum over the unit ball, and a
      Lipschitz bound. The same conclusions hold for the other allowed standard norms
      by their finite-dimensional inequalities. Write $M$ for the supremum over the
      closed unit ball of the chosen norm. For nonzero $v$, apply the definition to
      $v/\|v\|$ to obtain $\|Av\|\le M\|v\|$. The inequality also holds at zero. Thus
      $M$ is a Lipschitz constant by linearity. Each Lipschitz constant bounds $\|Av\|$
      on the unit ball by comparing $v$ with zero and hence is at least $M$. This
      gives the advertised infimum when required.


      Absolute homogeneity follows from $\|(cA)v\|=|c|\|Av\|$. The triangle inequality
      follows by bounding $\|(A+B)v\|$ by the sum of the individual suprema for each
      unit-ball $v$. If $M=0$, the scaling bound shows that $Av=0$ for all $v$; conversely
      the zero map has $M=0$. Thus this is a norm. Normalizing each nonzero $v$ shows
      the supremum of $\|Av\|/\|v\|$ is the sphere supremum. The scaling inequality
      with the sphere supremum in place of $M$ bounds all values in the closed unit
      ball by the sphere supremum (including zero), while the sphere is contained
      in the ball. Thus the two suprema agree for positive domain dimension.

      '
