    fresh_sha256: c2b63f7a46469e626d017452bdc92e5b988e3a530615251f0469faec2897d53b
    fresh_derivation: '# Independent rework


      Summing the scalar inequalities $|x_i+y_i|\le |x_i|+|y_i|$ proves the triangle
      inequality. The sum of absolute values is nonnegative, zero precisely when all
      coordinates vanish, and scales by $|c|$ upon multiplication by $c$. For real
      vectors, $\sum_i|x_i|^2\le(\sum_i|x_i|)^2$ by expanding the square, while Cauchy–Schwarz
      against the all-ones vector gives $(\sum_i|x_i|)^2\le n\sum_i|x_i|^2$. Taking
      square roots yields $\|x\|_2\le\|x\|_1\le\sqrt n\|x\|_2$.

      '
