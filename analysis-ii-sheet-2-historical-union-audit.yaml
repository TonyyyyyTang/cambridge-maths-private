      solution.tex: 3037aeafe8ac47a413449c15c9fc5bdef6780217319c35007e3b273e6475928f
    check_sha256: e347627a25b0e77f8400944666880db0e023a503e9a3e9d88837e9813c8dc75b
    check_result: Verified norm comparison, the singleton Darboux error, ramp area
      and supremum oscillation bound.
    exit_code: 0
    comparison: The integral of the absolute value separates continuous functions
      but fails to detect a point mass in the space of pointwise-defined Riemann integrable
      functions. The examples, comparisons with the supremum norm and the uniform-limit
      or quotient arguments agree for the parts in this edition.
    fresh_sha256: cd4629a9b47a93e696180ad95a6bcab2b7a37fbf1d47249a2de460997f7f60bd
    fresh_derivation: '# Independent rework


      Continuity on the compact interval makes $|f|$ bounded and integrable. Its integral
      is nonnegative, absolutely homogeneous, and subadditive by integration of the
      scalar triangle inequality. If $f(t)\ne0$, continuity gives a relative interval
      of positive length on which $|f|>|f(t)|/2$, including when $t$ is an endpoint.
      Hence zero norm implies the zero function. Also $\|f\|_1\le\|f\|_\infty$. The
      continuous functions $x^n$ have supremum 1 and integral $1/(n+1)$, precluding
      any uniform reverse inequality.


      In the integral norm on continuous functions, let $h=\mathbf1_{(1/2,1]}$. Take
      continuous ramps $f_n$ equal to zero up to $1/2$, linear from 0 to 1 on $[1/2,1/2+1/(2n)]$,
      and equal to one thereafter. The integral of $|h-f_n|$ is $1/(4n)$, so $(f_n)$
      is Cauchy. A continuous limit in this norm would have integral distance zero
      from $h$ and thus would agree identically with 0 and 1 respectively on the two
      open halves by continuity and the positive-interval argument. This contradicts
      continuity at $1/2$.


      On pointwise-defined integrable functions the indicator of a singleton is nonzero
      and has integral of its absolute value zero, so the integral formula is only
      a seminorm.


      With the supremum norm the bounded Riemann-integrable functions form a normed
      space: supremum detects every nonzero point value, and the scalar inequalities
      give the other axioms. A supremum-Cauchy sequence has a pointwise real limit
      $f$ and converges uniformly to it by passing one index to infinity in the uniform
      Cauchy estimate. The limit is bounded. If $\|f-g\|_\infty<\varepsilon$ with
      $g$ a member of the sequence, choose a partition with Darboux gap for $g$ below
      $\varepsilon$. On each piece the oscillation of $f$ is at most that of $g$ plus
      $2\varepsilon$; the resulting Darboux gap for $f$ is below $3\varepsilon$. Thus
      $f$ is Riemann integrable, proving completeness.

      '
