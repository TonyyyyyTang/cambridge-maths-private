    fresh_derivation: '# Independent rework


      For $m\ge1$, let $F_m=\bigcap_n\{x:|f_n(x)|\le m\}$. The sets are relatively
      closed by continuity and cover $[0,1]$ because each pointwise convergent real
      sequence is bounded. Some $F_m$ has nonempty relative interior by Baire: otherwise,
      starting from $[0,1]$, successively choose nondegenerate closed subintervals
      of its interior, then of the previous interval''s interior, avoiding $F_j$ at
      stage $j$ (possible because the complement is open dense). Nesting in $[0,1]$
      gives a point outside every $F_j$, contradicting the cover. A nonempty relative
      open set contains a nondegenerate closed interval. On one in $F_m$ the pointwise
      limit satisfies $|f|\le m$.

      '
