      sup metric, complete as a closed subset of the space of continuous vector-valued
      functions. Define $Th(t)=y_0+\int_{t_0}^t\varphi(s,h(s))\,ds$. The speed bound
      gives $\|Th(t)-y_0\|\le R|t-t_0|/(b-a)\le R$, so $T$ maps $D$ into itself. Integrating
