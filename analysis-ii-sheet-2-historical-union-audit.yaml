    fresh_sha256: b6c79c6c9064bce4ff99451e97ea9324ffbfd284bc563f5d269e8257d6a2c3b5
    fresh_derivation: '# Independent rework


      (a) For a fixed norm, either $f=0$ or there is a real linear functional $L$
      of dual norm one satisfying $L(f(t))=\|f(t)\|$ for every $t$. Indeed, if $v=\int
      f$ is zero, equality forces $f=0$ by continuity. Otherwise use the finite-dimensional
      norming-functional theorem (or extend $L(cv)=c\|v\|$ by Hahn–Banach). The continuous
      nonnegative function $\|f(t)\|-L(f(t))$ then has integral zero under equality,
      so is identically zero. Conversely such an $L$ yields $\int\|f\|=L(v)\le\|v\|\le\int\|f\|$,
      where the last inequality follows by the triangle inequality on Riemann sums.
      For Euclidean norm the nonzero images must lie on a single nonnegative ray by
      equality in Cauchy–Schwarz. If equality is demanded for every norm, that ray
      condition is necessary and sufficient. For a general single norm a common ray
      is not necessary, e.g. $f(t)=(t,1-t)$ in the coordinate sum norm.


      (b) Write $p,q$ for the two norms. Bounds $c p\le q\le C p$, with $c,C>0$, give
      $B_{1/C}\subset B''_1\subset B_{1/c}$. Conversely $B_r\subset B''_1$ implies
      $q(x)\le p(x)/r$ by applying it to $x/\lambda$ for $\lambda>p(x)/r$ and taking
      a limit. Likewise $B''_1\subset B_R$ gives $p(x)\le Rq(x)$ by scaling with $\lambda>q(x)$.
      This includes zero.


      (c) Adding the seminorm $|\varphi(\cdot)|$ to $p$ gives a finite, definite,
      absolutely homogeneous, subadditive function. If it were bounded above by $Cp$,
      then $|\varphi(x)|\le Cp(x)$, making $\varphi$ Lipschitz by linearity, contrary
      to discontinuity. (d) For tolerance $\varepsilon$ take a Cauchy tail with mutual
      distances $<\varepsilon/2$, then take a subsequence member lying in that tail
      within $\varepsilon/2$ of $x$. Every point of the tail is within $\varepsilon$
      of $x$.

      '
