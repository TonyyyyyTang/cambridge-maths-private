independent_reworks:
  q01: '(a) No. Take every f_n to be the indicator of {0}, and x_n=1/(n+1). The uniform error is zero,
    all f_n are locally zero at x_n, but f(0)=1 and the values approaching from the right are zero.

    (b) No. For n>=2 use continuous triangular peaks of height one centered at 1-1/n with radius 1/(2n),
    namely the positive part of 1-2n|x-(1-1/n)|. They vanish at 1 and eventually vanish at every fixed
    x<1 and on each [-r,r]. Their supremum on the original closed interval is always one.

    (c) In 2025 yes. The union of the countably many countable discontinuity sets is countable, so choose
    x in its uncountable complement. Given epsilon, take a single N with sup|f-f_N|<epsilon/3. Continuity
    of f_N at x bounds its variation by epsilon/3 for nearby y, hence |f(y)-f(x)|<epsilon by the triangle
    inequality.

    (d) In 2025, or (c) in 2026, no. Let phi(t)=dist(t,Z), and T(x)=sum over k>=0 of 2^{-k}phi(2^k x).
    Each summand is continuous and bounded by 2^{-k-1}, so T is continuous. For each x choose nested level-m
    dyadic intervals in [0,1] containing x (for dyadic x consistently choose either available side). At
    their endpoints all terms with k>=m vanish. Each term with k<m is linear on the interval with slope
    +1 or -1: all its breakpoints lie on the dyadic grid of depth k+1. The secant slope at level m+1 is
    therefore the level-m slope plus or minus 1. These slopes cannot converge to a finite number. Differentiability
    at x, including a one-sided derivative at 0 or 1, would force convergence of the secant slopes: each
    endpoint has linearization error o(distance to x), and the endpoint distances sum to interval length.
    Thus T is nowhere differentiable. Uniform polynomial approximation on [0,1] gives differentiable f_n
    with uniform error <1/n. The 2026 edition omits the countable-discontinuity part.'
  q05: For arbitrary x_n->x, |f_n(x_n)-f(x)| <= sup|f_n-f| + |f(x_n)-f(x)|, which tends to zero by uniform
    convergence and continuity of f. Conversely, failure of uniform convergence provides epsilon>0 and
    increasing k_j, y_j in [a,b] with |f_{k_j}(y_j)-f(y_j)|>=epsilon. Extract and relabel a subsequence
    y_j->x in [a,b] by compactness; the corresponding indices remain increasing. Set x_{k_j}=y_j and x_n=x
    otherwise. The entire sequence tends to x. Along the bad indices |f_{k_j}(x_{k_j})-f(x)| >= epsilon-|f(y_j)-f(x)|
    >= epsilon/2 eventually. Therefore the function values do not converge to f(x).
  q07: At every x the finite sum differentiates term by term and the chain rule gives f_n'(x)=sum_{m=1}^n
    m a_m cos(mx) (one-sided values at the ends agree with the derivative of the extension). The absolute
    tail from index M is uniformly bounded by sum_{m>=M}|a_m|, tending to zero independently of x. Thus
    f is the uniform limit of continuous f_n and is continuous. For a_m=m^{-2}, the coefficient series
    is absolutely convergent but the putative derivative sum at x=0 is sum 1/m, divergent.
  q11: '(i) Bounded by 1 in absolute value, but not uniformly continuous: take x_n=sqrt(2pi n), y_n=sqrt(2pi
    n+pi/2). Their distance is (pi/2)/(x_n+y_n)->0 while the function values differ by one. (ii) The distance
    to the nonempty set of squares is 1-Lipschitz since |x-n^2|<=|x-y|+|y-n^2|, taking the infimum and
    interchanging x and y. It is unbounded, since the midpoints between n^2 and (n+1)^2 have distance
    n+1/2 from that set. (iii) Both. Absolute value <=1/(x+1), so it is bounded and tends to zero. Given
    epsilon, choose R with 2/(R+1)<epsilon. Continuous on the compact [0,R+1], it satisfies the uniform
    epsilon bound there with some delta<=1. For points within delta, if the smaller is <=R both lie in
    the compact interval; otherwise both are above R, so the sum of the two absolute values is <epsilon.'
