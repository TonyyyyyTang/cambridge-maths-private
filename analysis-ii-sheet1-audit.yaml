    comparison: All four baseline answers and all three retained 2026 answers agree. The audit used triangular
      endpoint peaks and a dyadic Takagi-function secant proof. The two stored derivations use polynomial
      peaks and a period-two geometric tent series, with sliding means or polynomial approximation. The
      density of common continuity points is more than required in 2025. Inward endpoint difference quotients
      rule out endpoint exceptions.
