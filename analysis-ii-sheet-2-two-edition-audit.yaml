    text_sha256: d975e396938bf076e8a214695a665b5b31c361db532b6bd5b8d03be4ce1b9ae2
    independent_rework_sha256: 9b392bf7547535f467fe29b266cba97627033e56691c0d7dfb742e9597e47738
    independent_rework: 'Choose $M$ with $\|x^{(n)}\|_\infty\le M$ for all $n$. From
      all indices choose an infinite increasing subsequence $S_1$ along which the
      first coordinate converges by Bolzano–Weierstrass in $[-M,M]$. Recursively extract
      $S_i$ from $S_{i-1}$ so that the $i$th coordinate converges along $S_i$. Earlier
      coordinate convergences persist. Let $n_j$ be the $j$th member of $S_j$. Since
      $S_{j+1}\subset S_j$, its $(j+1)$st member is larger than the $j$th member of
      $S_j$. For fixed $i$, all $n_j$ with $j\ge i$ lie in $S_i$, which proves convergence
      in that coordinate. Every coordinate of the resulting limit is bounded by $M$,
      so the limit defines an element of $\ell_\infty$.


      Norm convergence would require the coordinate errors to tend to zero uniformly
      in the coordinate. For the standard unit vectors $e_n$, every coordinate tends
      to zero and each vector has norm one. Distinct $e_n,e_m$ have distance one,
      so no subsequence is even Cauchy in the supremum norm.

      '
