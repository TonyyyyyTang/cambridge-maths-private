    text_sha256: 170ce56440b014cd95843a96930ce244d5c6df1b2061fe1bca628a2b27a2cb8c
    independent_rework_sha256: 1669c933ff68f235533c591dac842a21042229e83cae7a0f709cfd5030c95b2d
    independent_rework: '(i) For the coordinate minimum, if $n\ge2$, the origin and
      $(1,0,\ldots,0)$ have distance zero despite being distinct. For $n=1$ the usual
      real absolute-value metric results and the ball is $(x-\varepsilon,x+\varepsilon)$.


      (ii) For the function on $\mathbb Z$, take $0,1,4$. The printed positive exponent
      gives $d(0,4)=4$ while $d(0,1)=d(1,4)=1$, so the triangle inequality fails.


      (iii) For functions on $\mathbb N$ symmetry and positivity with equality only
      on the diagonal follow directly from the first differing index. If $f,h$ first
      disagree at $k$, then at least one of $(f,g),(g,h)$ disagrees by index $k$.
      Therefore $d(f,h)\le\max(d(f,g),d(g,h))$, also covering coincidences. The ball
      consists exactly of functions agreeing with $f$ at every index $k\in\mathbb
      N$ with $2^{-k}\ge\varepsilon$. Equality at a threshold requires agreement there
      because the ball is open.


      (iv) For the complex-plane distance, symmetry and definiteness follow from the
      two formulas. Always $d(z,w)\ge|z-w|$. For collinear endpoints this bound on
      the two intermediate legs implies the triangle inequality by the Euclidean inequality.
      If the endpoints lie on distinct lines and an intermediate point lies at the
      origin, equality holds. If it is nonzero and on the line of $z$, the sum of
      the legs is $|z-v|+|v|+|w|\ge |z|+|w|$. The line of $w$ works symmetrically.
      If it lies on neither line, the sum is $|z|+2|v|+|w|$. This proves the metric
      property. At zero the ball is the ordinary open disc of radius $\varepsilon$.
      For $z\ne0$ and $0<\varepsilon\le |z|$ it is the open interval of length $2\varepsilon$
      centred at $z$ along the real line through $0$ and $z$, since every point on
      another line has distance at least $|z|$.

      '
