    text_sha256: cd51173d08318b84de5d4dc2e9dea7f545e44494610b0d759894770d43ebaa37
    independent_rework_sha256: 2f360d9fd6b68d5d700631e23e4e1a5eb9c455ed30124219d132e64495fbc33f
    independent_rework: '(a) Write $M=\sup|f|$ and $D=\sup|f''|$, which are finite
      on the compact interval. Both are homogeneous and subadditive, as is $\sup_x(|f(x)|+|f''(x)|)$
      by pointwise inequalities followed by taking a supremum. Each of $\alpha,\beta,\gamma$
      dominates $M$ and hence separates points. The function $\delta$ vanishes on
      the nonzero constant $1$ and is only a seminorm on the full space. Since $\max(M,D)\le\beta\le
      M+D=\alpha\le 2\beta$, $\alpha$ and $\beta$ are Lipschitz equivalent. For $f_n(x)=x^n$,
      $M=1$ and $D=n$, which excludes any bound $\beta\le C\gamma$ and likewise $\alpha\le
      C\gamma$. Thus $\gamma$ is equivalent to neither.


      (b) The zero function qualifies. Any linear combination of two qualifying functions
      vanishes on the intersections of their respective endpoint neighborhoods, so
      the defining condition is preserved. If $\delta(f)=0$, then $f$ is constant
      and $f(0)=0$ forces $f=0$. Thus all four are norms here. From either endpoint,
      $|f(x)|\le\min(x,1-x)D$, so $M\le D/2$. Consequently $\delta\le\beta\le\alpha\le(3/2)\delta$.
      For a separating sequence take $\phi(y)=(1-y^2)^2$ for $|y|\le1$ and zero outside.
      Its derivative vanishes at the joining points, so $\phi$ is $C^1$. For integers
      $n>2$, $f_n(x)=\phi(n(x-1/2))$ vanishes near both endpoints and has $M=1$, $D=n\|\phi''\|_\infty$
      with $\|\phi''\|_\infty>0$. Thus $\gamma$ is not Lipschitz equivalent to any
      of the other three.

      '
