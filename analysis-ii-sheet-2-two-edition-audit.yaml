    text_sha256: 0b07178410d4a281b9850af48cfe60cf2620f38dcf6b787d80ea64003f37195c
    independent_rework_sha256: b8d82c9b4fecafd6704d14b0fbb2b521540f64148d5d117683004972ba7c6e5e
    independent_rework: 'On $C([0,1])$ let $L(f)=f(1/2)$ and $I(f)=\int_0^1 f$. The
      two sets are the kernels. Under the uniform norm, $|L(f)-L(g)|\le\|f-g\|_\infty$
      and $|I(f)-I(g)|\le\|f-g\|_\infty$, so both kernels are closed as inverse images
      of the closed singleton $\{0\}$.


      Under the integral norm, $|I(f)-I(g)|\le\int_0^1|f-g|$ still proves closedness
      for the integral kernel. For $n\ge2$ put $f_n(x)=\min(1,n|x-1/2|)$. Each is
      continuous and zero at $1/2$, but $\|f_n-1\|_1$ is the area of a triangle with
      height $1$ and base $2/n$, hence $1/n$. The constant-one limit is outside the
      evaluation kernel. Therefore that kernel is not closed for the integral norm.

      '
