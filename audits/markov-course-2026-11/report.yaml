- id: IB/markov-chains/sheet-2/q15
  stratum: sheet
  verdict: minor
  transcription: ok
  rework_file: rework/IB_markov-chains_sheet-2_q15.md
  check_script: rework/IB_markov-chains_sheet-2_q15_check.py
  check_exitcode: 0
  hashes:
    question.tex: 3341b8a29d526228b9422726989af37942303d05b97891f31dc480635cf8f12b
    solution.tex: a03f12ebbd647bad3a3d2706234c70a56a5c92c8b50284764a8e54d7d9c2ae68
    rework.md: bbe023d94fc9d6f0020e565becf552d5c532b885aa32ab8346bde6f55fa4d2ed
    rework_check.py: 727faba093e7ad0da1c2bcd70f908c6d440bb9177c29a1cc0bca146edd580df2
  details: 'The constructed distribution pi_i = w_i / sum_j w_j with w_i = prod_{j=0}^{i-1} (lambda_j
    / mu_{j+1}) and the detailed balance verification on nearest neighbours, self-loops, and boundary
    states are completely correct. However, the solution never checks irreducibility to prove that pi
    is the UNIQUE invariant distribution of the chain. Exact quoted step in solution.tex: ''Summing over
    the other state proves stationarity, and detailed balance proves reversibility in this equilibrium.''
    Problem: the question asks to show that the process is time-reversible ''in equilibrium'' (singular),
    and specifically gives 0 < lambda_i, mu_i < 1. Exhibiting one reversible invariant distribution without
    proving irreducibility (hence uniqueness of pi) leaves open whether another, non-reversible equilibrium
    could exist — an unchecked hypothesis a Cambridge supervisor would mark down.'
  suggested_fix: |-
    Since $0 < \lambda_i < 1$ and $0 < \mu_{i+1} < 1$ for all $0 \le i < b$, every state can reach every other state in finitely many steps along nearest-neighbour transitions; hence the chain is irreducible on the finite state space $\{0, 1, \ldots, b\}$ and therefore possesses a unique invariant distribution.

    Define $w_0 = 1$ and, for $1 \le i \le b$, $w_i = \prod_{j=0}^{i-1}(\lambda_j / \mu_{j+1}) > 0$. Set $\pi_i = w_i / \sum_{k=0}^b w_k$ for $0 \le i \le b$. Then $\pi$ is a probability distribution and, for each $0 \le i < b$,
    \[
    \pi_i p_{i,i+1} = \pi_i \lambda_i = \pi_{i+1} \mu_{i+1} = \pi_{i+1} p_{i+1,i}.
    \]
    For $i = j$ detailed balance holds trivially (including the boundary self-loops $p_{00} = 1 - \lambda_0$ and $p_{bb} = 1 - \mu_b$), and for $|i - j| \ge 2$ both sides are zero. Thus $\pi$ and $P$ satisfy detailed balance for all pairs. Summing $\pi_i p_{ij} = \pi_j p_{ji}$ over $i$ gives $(\pi P)_j = \pi_j$, so $\pi$ is the unique invariant distribution, and by the detailed-balance characterisation of reversibility the process is time-reversible in equilibrium.
