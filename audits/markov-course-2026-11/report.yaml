  hashes:
    question.tex: ab95eb55301e5847bd0de56afbcfdc2550993eeb43c04fb317b52ed7d73be2f2
    solution.tex: 82e2fdb20374acbeb057f6cd5617326b89395f5d7bba858ae0770b7532d53893
    rework.md: 76fba662a08306e6cd4e47d25ebb957072354eea9ef29391872e472f52d98e64
    rework_check.py: 314f639fe9696f24c53bda967366d1c8dce57bc259a5e7709a6910d2852fb8f0
  details: 'Final result (transient, return probability to R equal to 1/2 < 1) and overall truncation
    strategy are mathematically sound. However, this single-paragraph solution to a ''Show that...'' question
    skips multiple proof steps a Cambridge supervisor would expect to see justified. Exact quoted step
    in solution.tex: ''On \{0,\ldots,M\} the probability from one of hitting M before zero is (1-1/2)/(1-2^{-M}),
    obtained by solving the two-boundary difference equation with basis 1,2^{-k}. Letting M\to\infty gives
    probability 1/2 of never hitting zero. Indeed a path confined to a fixed finite interval exits it
    almost surely.'' Problems: (1) does not explicitly state or justify why D_n = d(X_n, R) is a Markov
    chain (lumpability: transition probabilities of D_{n+1} depend on X_n only through D_n) or that {X_n
    = R} = {D_n = 0}; (2) quotes the gambler''s ruin formula without writing down or solving the recurrence
    u_k = (2/3)u_{k+1} + (1/3)u_{k-1} with u_0 = 0, u_M = 1; (3) asserts without proof that a path confined
    to {1,...,M-1} exits almost surely (and omits the continuity-of-probability step relating the decreasing
    events {H_M < H_0} to {H_0 = \infty}).'
  suggested_fix: |-
    Let $D_n = d(X_n, R) \in \mathbb{Z}_{\ge0}$ be the graph distance from the root $R$. Because $T$ is a tree, every vertex $v \neq R$ has a unique parent at distance $d(v)-1$ and two children at distance $d(v)+1$, while $R$ has a single neighbour at distance $1$. Thus the distribution of $D_{n+1}$ given $(X_0,\ldots,X_n)$ depends only on $D_n$, so $(D_n)_{n\ge0}$ is a Markov chain on $\mathbb{Z}_{\ge0}$ with $q_{0,1} = 1$, $q_{k,k+1} = 2/3$ and $q_{k,k-1} = 1/3$ for $k \ge 1$. Moreover, $R$ is the unique vertex at distance $0$, so $\{X_n = R\} = \{D_n = 0\}$.

    Let $H_m = \inf\{n \ge 0 : D_n = m\}$ and $h_k = \mathbb{P}_k(H_0 < \infty)$. By the hitting-probability theorem, $(h_k)_{k\ge0}$ is the minimal non-negative solution to $h_0 = 1$ and $h_k = \frac{2}{3}h_{k+1} + \frac{1}{3}h_{k-1}$ for $k \ge 1$. Rewriting as $2(h_{k+1}-h_k) = h_k - h_{k-1}$ gives $h_{k+1} - h_k = 2^{-k}(h_1 - 1)$, whence $h_k = (1 - B) + B\cdot 2^{-k}$ with $B = 2(1 - h_1)$. Non-negativity for all $k \ge 0$ forces $1 - B \ge 0$, i.e. $B \le 1$, so $h_k = 2^{-k} + (1-B)(1-2^{-k}) \ge 2^{-k}$, with equality at $B = 1$. Hence the minimal non-negative solution is $h_k = 2^{-k}$.

    (Alternatively, via finite truncation: $u_k = \mathbb{P}_k(H_M < H_0)$ satisfies $u_0 = 0$, $u_M = 1$, and $u_k = \frac{2}{3}u_{k+1} + \frac{1}{3}u_{k-1}$ for $1 \le k < M$, whose unique solution is $u_k = (1 - 2^{-k})/(1 - 2^{-M})$. Since $\bigcap_{M\ge2}\{H_M < H_0\} \subseteq \{H_0 = \infty\}$ and $\{H_M < H_0\}$ decreases in $M$, continuity of probability gives $\mathbb{P}_1(H_0 = \infty) \ge \lim_{M\to\infty} u_1 = 1/2$, with equality since $\mathbb{P}_k(H_0 \wedge H_M > nM) \le (1 - (2/3)^M)^n \to 0$.)

    Starting from $R$, $D_1 = 1$ surely, so $\mathbb{P}_R(T_R < \infty) = h_1 = 1/2 < 1$, proving $R$ is transient. Since $T$ is connected, the random walk is irreducible, and transience is a class property; hence every vertex is transient.
