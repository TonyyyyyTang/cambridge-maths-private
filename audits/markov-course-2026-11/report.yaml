  rework_file: rework/IB_markov-chains_sheet-2_q11.md
  check_script: rework/IB_markov-chains_sheet-2_q11_check.py
  check_exitcode: 0
  hashes:
    question.tex: bf3eaf43a63fa0262a85f087e8b8f5baf03c2da08529c8dc012292c2b86c0c55
    solution.tex: 3a38af00ac07ac00a0ae22e3d262390769d7b1ad5e5625903a4d7a12f2987286
    rework.md: 1a18c9f9c03ecc58a1428de0defba8dbeebcf7a42b239c6d46e19ebe7989ca60
    rework_check.py: 84c68b55c918d5bf7232519cf43a5fb86a021df4b2d041ae40d83e664a8fb203
  details: 'Final answer (1/13) and verification of irreducibility, double stochasticity, and coprime
    return lengths (3 and 4, via 1+6+6=13 and 3+3+3+4=13) are correct. However, the question explicitly
    instructs ''quoting carefully any general theorems that you use''. Exact quoted step in solution.tex:
    ''The convergence theorem for finite irreducible aperiodic chains therefore gives \Pr(X_n\equiv0\pmod{13})\to1/13,
    starting at the initial sum zero.'' Problems a supervisor would mark down: (1) it never quotes the
    Convergence to Equilibrium Theorem (statement of hypotheses and conclusion p_{ij}^{(n)} -> pi_j for
    irreducible, aperiodic chains possessing an invariant distribution pi); (2) it asserts uniqueness
    of the uniform invariant distribution from column sums alone without citing irreducibility; (3) it
    checks gcd(3,4)=1 only at residue 0 without invoking the class property of periodicity (or translation
    invariance) to conclude aperiodicity of the chain.'
  suggested_fix: |-
    Let $Y_n = X_n \bmod 13 \in \{0, 1, \ldots, 12\}$ with $Y_0 = 0$. Since the die throws $D_1, D_2, \ldots$ are independent and uniform on $\{1, \ldots, 6\}$, $(Y_n)_{n\ge0}$ is a Markov chain with transition matrix $p_{ij} = 1/6$ if $(j - i) \bmod 13 \in \{1, \ldots, 6\}$ and $0$ otherwise.

    We apply the Convergence to Equilibrium Theorem: if a Markov chain with transition matrix $P$ is irreducible, aperiodic and possesses an invariant distribution $\pi$, then $\mathbb{P}(Y_n = j) \to \pi_j$ as $n \to \infty$ for every state $j$ and any initial distribution (in particular $p_{ij}^{(n)} \to \pi_j$).

    We check the three hypotheses: (i) $p_{i,(i+1)\bmod 13} = 1/6 > 0$ for all $i$, so every residue reaches every other residue and the chain is irreducible; (ii) $p_{00}^{(3)} > 0$ (from throws $1,6,6$, sum $13$) and $p_{00}^{(4)} > 0$ (from throws $3,3,3,4$, sum $13$), so state $0$ has period dividing $\gcd(3,4) = 1$, and by irreducibility (periodicity is a class property) the chain is aperiodic; (iii) each column of $P$ has six entries equal to $1/6$, so $P$ is doubly stochastic and the uniform distribution $\pi_i = 1/13$ satisfies $\pi P = \pi$ (and is unique by irreducibility).

    Hence $\lim_{n\to\infty}\mathbb{P}[X_n\text{ is a multiple of }13] = \lim_{n\to\infty} p_{00}^{(n)} = \pi_0 = 1/13$.
- id: IB/markov-chains/sheet-2/q07
  stratum: sheet
  verdict: minor
  transcription: ok
  rework_file: rework/IB_markov-chains_sheet-2_q07.md
  check_script: rework/IB_markov-chains_sheet-2_q07_check.py
