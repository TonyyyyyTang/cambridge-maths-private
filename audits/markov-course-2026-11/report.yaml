- id: IB/2016/P3/q9H
  stratum: tripos
  verdict: minor
  transcription: ok
  rework_file: rework/IB_2016_P3_q9H.md
  check_script: rework/IB_2016_P3_q9H_check.py
  check_exitcode: 0
  hashes:
    question.tex: bf61a6f3ac187195038aab328a5877ad81a2e552588b1e4ecb246b321c56f416
    solution.tex: 641e40f9a33577d74346397855dff3a8117ac07fe022a42d4df266709b7ada7e
    rework.md: 0a141106404a1d5b59a213f92f9ca51421e48341c36bd5b22815fe49a8c7bd5d
    rework_check.py: e436463bcb114a85053ad55cc6fa4f89d7933b92b469ff0085f56d36fa0c551d
  details: 'Final result and proof outline (via N = sum_{n>=0} 1_{X_n=i}, P_i(N >= k) = r^{k-1}, monotone
    convergence, and cases r < 1 including r = 0 vs r = 1) are correct. However, the question''s sole
    substance is proving the geometric visit identity from the strong Markov property, and the stored
    solution omits the stopping-time definition and verification. Exact quoted step in solution.tex: ''Given
    the kth visit when it occurs, the strong Markov property shows that the probability of another visit
    is r. Induction from the visit at zero therefore gives \mathbb P_i(N\ge k)=r^{k-1} for k\ge1.'' Problems
    a Cambridge supervisor would mark down: (1) never defines the kth visit/return time T_i^{(k)} nor
    checks that it is a stopping time (with X_{T_i^{(k)}} = i on {T_i^{(k)} < \infty}) before invoking
    the strong Markov property; (2) omits the inductive calculation P_i(T_i^{(k)} < \infty) = P_i(T_i^{(k)}
    < \infty | T_i^{(k-1)} < \infty) P_i(T_i^{(k-1)} < \infty) and leaves the zero-probability conditioning
    case r = 0 (and 0^0 convention at k=1) unaddressed.'
  suggested_fix: |-
    Define the successive visit times to $i$ inductively by $T_i^{(0)} = 0$ and $T_i^{(r+1)} = \inf\{n > T_i^{(r)} : X_n = i\}$ for $r \ge 0$ (with $\inf\emptyset = \infty$). For each $r \ge 1$ and $n \ge 0$, the event $\{T_i^{(r)} = n\} = \{X_n = i,\, \sum_{m=1}^{n-1}\mathbf{1}_{\{X_m=i\}} = r-1\}$ depends only on $(X_0, \ldots, X_n)$, so every $T_i^{(r)}$ is a stopping time, and on $\{T_i^{(r)} < \infty\}$ we have $X_{T_i^{(r)}} = i$.

    Let $f_i = \mathbb{P}_i(T_i^{(1)} < \infty)$. We prove by induction that $\mathbb{P}_i(T_i^{(r)} < \infty) = f_i^r$ for all $r \ge 1$ (and $\mathbb{P}_i(T_i^{(0)} < \infty) = 1$). The case $r = 1$ holds by definition. Assume the claim for $r \ge 1$. Since $\{T_i^{(r+1)} < \infty\} \subseteq \{T_i^{(r)} < \infty\}$, if $\mathbb{P}_i(T_i^{(r)} < \infty) = 0$ then $f_i = 0$ and $\mathbb{P}_i(T_i^{(r+1)} < \infty) = 0 = f_i^{r+1}$. Otherwise $\mathbb{P}_i(T_i^{(r)} < \infty) > 0$, and by the strong Markov property applied at $T_i^{(r)}$, conditional on $\{T_i^{(r)} < \infty\}$ the shifted chain $(X_{T_i^{(r)}+m})_{m\ge0}$ has the law of the chain started at $i$, so $\mathbb{P}_i(T_i^{(r+1)} < \infty \mid T_i^{(r)} < \infty) = f_i$ and hence $\mathbb{P}_i(T_i^{(r+1)} < \infty) = f_i \cdot f_i^r = f_i^{r+1}$.

    For every $n \ge 0$, $\{X_n = i\}$ is the disjoint union $\bigsqcup_{r=0}^{\infty}\{T_i^{(r)} = n\}$. By countable additivity and interchanging the sum of non-negative terms,
    \[
    \sum_{n=0}^{\infty}\mathbb{P}_i(X_n = i) = \sum_{r=0}^{\infty}\sum_{n=0}^{\infty}\mathbb{P}_i(T_i^{(r)} = n) = \sum_{r=0}^{\infty}\mathbb{P}_i(T_i^{(r)} < \infty) = 1 + \sum_{r=1}^{\infty} f_i^r.
    \]
    Since $\mathbb{P}_i(X_n \ne i\text{ for all }n \ge 1) = 1 - f_i$, if $0 \le f_i < 1$ this equals $1/(1 - f_i)$, while if $f_i = 1$ it equals $+\infty = 1/0$.
