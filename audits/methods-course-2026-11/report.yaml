    rework_check.py: dde7840702d050a00a46ae7afd3d02cd37ca547e05576cfecd5825d7a019463e
  details: 'Exact quoted step in solution.tex: ''Put $v_n=\langle v,\psi_n\rangle/\langle\psi_n,\psi_n\rangle$.
    Separation in this family turns the heat equation into $a_n''=-\kappa\lambda_n a_n$, and the wave
    equation into $b_n''''=-c^2\lambda_n b_n$. The data prescribe $a_n(0)=f_n$, $b_n(0)=g_n$, $b_n''(0)=h_n$.
    Consequently \[ \varphi_A=\sum_n f_ne^{-\kappa\lambda_nt}\psi_n,\qquad \varphi_B=\sum_n\left[g_n\cos(c\sqrt{\lambda_n}t)
    +h_n\frac{\sin(c\sqrt{\lambda_n}t)}{c\sqrt{\lambda_n}}\right]\psi_n . \]''. All results match the
    independent rework. Parts (i) and (ii) give a valid (though terse) proof of distinct-eigenvalue orthogonality
    and $\lambda_n>0$ via Green''s identity, plus Gram-Schmidt on finite-dimensional eigenspaces. However,
    in parts (iii) and (iv) the question explicitly asks "Using separation of variables, show that the
    solution to $(A)$ is given by ... where $\alpha_n = \frac{\int_\Omega f\psi_n\,dV}{\int_\Omega\psi_n^2\,dV}$"
    and "Solve $(B)$, again using separation of variables", yet the stored solution never performs separation
    of variables ($\varphi(\mathbf x,t)=X(\mathbf x)T(t)$, separating into the spatial Dirichlet eigenvalue
    problem and temporal ODE) and never derives the coefficient formula $\alpha_n$ using orthogonality
    (it simply defines $v_n=\langle v,\psi_n\rangle/\langle\psi_n,\psi_n\rangle$ and asserts $a_n(0)=f_n$,
    $b_n(0)=g_n$, $b_n''(0)=h_n$). In addition, part (iv) omits noting that $\lambda_n>0$ from (i) guarantees
    real $\sqrt{\lambda_n}>0$ (oscillatory solutions with no division by zero), skips displaying the even
    power series in $(-\Delta)^p$ for $\cos(ct\sqrt{-\Delta})$ and $\sin(ct\sqrt{-\Delta})/(c\sqrt{-\Delta})$,
    and omits all four part labels (i)-(iv).'
  suggested_fix: |-
    \begin{enumerate}
    \item[(i)] Write $\langle v,w\rangle=\int_\Omega vw\,dV$. By Green's first identity (the divergence theorem applied to $\psi_m\nabla\psi_n$) and the Dirichlet boundary condition $\psi_m=0$ on $\partial\Omega$,
    \[
    \lambda_n\langle\psi_m,\psi_n\rangle=-\int_\Omega\psi_m\Delta\psi_n\,dV=\int_\Omega\nabla\psi_m\cdot\nabla\psi_n\,dV.
    \]
    By symmetry in $m$ and $n$ (using $\psi_n=0$ on $\partial\Omega$), this also equals $\lambda_m\langle\psi_m,\psi_n\rangle$, so $(\lambda_n-\lambda_m)\langle\psi_m,\psi_n\rangle=0$; hence $\int_\Omega\psi_n\psi_m\,dV=0$ whenever $\lambda_n\ne\lambda_m$. Taking $m=n$ gives $\lambda_n=\int_\Omega|\nabla\psi_n|^2\,dV/\int_\Omega\psi_n^2\,dV\ge0$. If $\lambda_n=0$, then $\nabla\psi_n\equiv\mathbf 0$, so $\psi_n$ is constant on each connected component of the bounded domain $\Omega$; since $\psi_n=0$ on $\partial\Omega$, this forces $\psi_n\equiv0$, contradicting that $\psi_n$ is an eigenfunction. Thus $\lambda_n>0$ for each $n$.
    \item[(ii)] Each eigenspace $E_\lambda=\{\psi:-\Delta\psi=\lambda\psi\text{ in }\Omega,\;\psi=0\text{ on }\partial\Omega\}$ is a finite-dimensional real vector space by linearity and assumption (c). Applying Gram--Schmidt with respect to $\langle\cdot,\cdot\rangle$ within each $E_\lambda$ produces an orthogonal basis preserving (a)--(d). Combined with orthogonality between distinct eigenspaces from (i), we may assume without loss of generality that $\int_\Omega\psi_n\psi_m\,dV=0$ for all $n\ne m$.
    \item[(iii)] Seek separable solutions $\varphi(\mathbf x,t)=X(\mathbf x)T(t)$ of $\varphi_t=\kappa\Delta\varphi$. Dividing by $\kappa XT$ gives $T'/(\kappa T)=\Delta X/X=-\lambda$, where $\lambda$ is constant. The boundary condition $\varphi=0$ on $\partial\Omega$ forces $X=0$ on $\partial\Omega$, yielding $-\Delta X=\lambda X$ with eigenpairs $\{(\psi_n,\lambda_n)\}_{n=1}^\infty$. The temporal ODE $T_n'=-\lambda_n\kappa T_n$ gives $T_n(t)=\alpha_n e^{-\lambda_n\kappa t}$, so by superposition
    \[
    \varphi(\mathbf x,t)=\sum_{n=1}^\infty\alpha_n e^{-\lambda_n\kappa t}\psi_n(\mathbf x).
    \]
    Imposing $\varphi(\mathbf x,0)=f(\mathbf x)=\sum_{n=1}^\infty\alpha_n\psi_n(\mathbf x)$ (valid by completeness (d)), multiplying by $\psi_m$, integrating over $\Omega$, and using orthogonality from (ii) yields $\int_\Omega f\psi_m\,dV=\alpha_m\int_\Omega\psi_m^2\,dV$, hence $\alpha_n=\int_\Omega f\psi_n\,dV/\int_\Omega\psi_n^2\,dV$. Since $\Delta^p\psi_n=(-\lambda_n)^p\psi_n$, formally
    \[
    e^{\kappa t\Delta}\psi_n=\sum_{p=0}^\infty\frac{(\kappa t)^p}{p!}(-\lambda_n)^p\psi_n=e^{-\lambda_n\kappa t}\psi_n.
    \]
    Applying $e^{\kappa t\Delta}$ term-by-term to $\varphi(\mathbf x,0)=\sum_{n=1}^\infty\alpha_n\psi_n(\mathbf x)$ therefore recovers $\varphi(\mathbf x,t)$.
    \item[(iv)] Separating $\varphi(\mathbf x,t)=X(\mathbf x)T(t)$ in $\varphi_{tt}=c^2\Delta\varphi$ gives $T''/(c^2T)=\Delta X/X=-\lambda$, so again $X=\psi_n$ and $\lambda=\lambda_n>0$ by (i). Since $\sqrt{\lambda_n}>0$, the ODE $T_n''+c^2\lambda_n T_n=0$ has solution $T_n(t)=\beta_n\cos(ct\sqrt{\lambda_n})+\gamma_n\frac{\sin(ct\sqrt{\lambda_n})}{c\sqrt{\lambda_n}}$, giving
    \[
    \varphi(\mathbf x,t)=\sum_{n=1}^\infty\left[\gamma_n\frac{\sin(ct\sqrt{\lambda_n})}{c\sqrt{\lambda_n}}+\beta_n\cos(ct\sqrt{\lambda_n})\right]\psi_n(\mathbf x).
    \]
    At $t=0$, $\varphi(\mathbf x,0)=g=\sum_{n=1}^\infty\beta_n\psi_n$ and $\varphi_t(\mathbf x,0)=h=\sum_{n=1}^\infty\gamma_n\psi_n$, so orthogonality yields $\beta_n=\int_\Omega g\psi_n\,dV/\int_\Omega\psi_n^2\,dV$ and $\gamma_n=\int_\Omega h\psi_n\,dV/\int_\Omega\psi_n^2\,dV$. Expanding the even entire functions in powers of $(-\Delta)$,
    \[
    \cos(ct\sqrt{-\Delta})=\sum_{p=0}^\infty\frac{(-1)^p(ct)^{2p}}{(2p)!}(-\Delta)^p,\qquad
    \frac{\sin(ct\sqrt{-\Delta})}{c\sqrt{-\Delta}}=\sum_{p=0}^\infty\frac{(-1)^pc^{2p}t^{2p+1}}{(2p+1)!}(-\Delta)^p,
    \]
    and using $(-\Delta)^p\psi_n=\lambda_n^p\psi_n$ gives $\cos(ct\sqrt{-\Delta})\psi_n=\cos(ct\sqrt{\lambda_n})\psi_n$ and $\frac{\sin(ct\sqrt{-\Delta})}{c\sqrt{-\Delta}}\psi_n=\frac{\sin(ct\sqrt{\lambda_n})}{c\sqrt{\lambda_n}}\psi_n$. Applying these operators term-by-term to $\varphi(\mathbf x,0)=g$ and $\varphi_t(\mathbf x,0)=h$ reproduces the series solution of $(B)$.
    \end{enumerate}
