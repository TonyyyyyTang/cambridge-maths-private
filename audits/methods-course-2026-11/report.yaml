    For the functional $I = \int_{x_1}^{x_2} f(x, y, y')\,dx$ with fixed endpoints $y(x_1) = y_1$ and $y(x_2) = y_2$, the Euler--Lagrange equation is
    \[
    \frac{\partial f}{\partial y} - \frac{d}{dx}\!\left(\frac{\partial f}{\partial y'}\right) = 0.
    \]
    When $f = f(x, y')$ is independent of $y$, we have $\partial f/\partial y = 0$, so $\frac{d}{dx}(\partial f/\partial y') = 0$, giving the first integral
    \[
    \frac{\partial f}{\partial y'} = C
    \]
    for a constant $C$.

    For a light ray moving along $y = y(x)$ with positive speed $c(x)$, the arc length element is $ds = \sqrt{1 + y'^2}\,dx$, so the travel time is
    \[
    T = \int_{x_1}^{x_2} \frac{\sqrt{1 + y'^2}}{c(x)}\,dx.
    \]
    Since the integrand $f(x, y') = \sqrt{1 + y'^2}/c(x)$ is independent of $y$, the first integral yields
    \[
    \frac{\partial f}{\partial y'} = \frac{y'}{c(x)\sqrt{1 + y'^2}} = C.
    \]
    Because $c(x) > 0$ and $\sqrt{1 + y'^2} > 0$, $y'(x)$ has the same sign as $C$ throughout $(x_1, x_2)$. Since $x_2 > x_1$ and $y_2 > y_1$, neither $C = 0$ (which gives $y_2 = y_1$) nor $C < 0$ (which gives $y_2 < y_1$) is possible; hence $C > 0$ and $y' > 0$. Setting $C = 1/k$ with $k > 0$, we note that $c(x)/k = y'/\sqrt{1 + y'^2} < 1$, so $k > c(x)$ on $(x_1, x_2)$ (allowing $k = c(x_2)$ at an endpoint with an integrable vertical tangent). Squaring gives
    \[
    \frac{y'^2}{1 + y'^2} = \frac{c^2(x)}{k^2}
    \implies \bigl(k^2 - c^2(x)\bigr)y'^2 = c^2(x).
    \]
    Taking the positive square root (as $y' > 0$ and $c(x) > 0$) yields
    \[
    \frac{dy}{dx} = \frac{c(x)}{\sqrt{k^2 - c^2(x)}}.
    \]
    Integrating from $x_1$ to $x_2$ and using $y(x_1) = y_1$, $y(x_2) = y_2$ gives the integral relation
    \[
    y_2 - y_1 = \int_{x_1}^{x_2} \frac{c(x)}{\sqrt{k^2 - c^2(x)}}\,dx.
    \]

    When $c(x) = ax$ and $k = ax_2$, positivity of $c(x)$ and $k > c(x)$ on $(x_1, x_2)$ with $x_2 > x_1$ require $a > 0$ and $0 \le x_1 < x_2$. Substituting into the differential equation and cancelling $a > 0$ gives
    \[
    \frac{dy}{dx} = \frac{ax}{\sqrt{a^2 x_2^2 - a^2 x^2}} = \frac{x}{\sqrt{x_2^2 - x^2}}.
    \]
    Integrating from $x$ to $x_2$ (with $y(x_2) = y_2$),
    \[
    y_2 - y(x) = \int_x^{x_2} \frac{t}{\sqrt{x_2^2 - t^2}}\,dt
    = \Bigl[-\sqrt{x_2^2 - t^2}\Bigr]_x^{x_2}
    = \sqrt{x_2^2 - x^2}.
    \]
    Squaring both sides yields $(y_2 - y)^2 = x_2^2 - x^2$ (with compatible endpoints satisfying $(y_2 - y_1)^2 = x_2^2 - x_1^2$).
