    Since $\frac{d}{dx}\bigl((1-x^2)\frac{dy}{dx}\bigr) = (1-x^2)\frac{d^2y}{dx^2} - 2x\frac{dy}{dx}$, defining the linear differential operator
    \[
    Ly = -\frac{d}{dx}\!\left((1-x^2)\frac{dy}{dx}\right)
    \]
    writes the Legendre equation as the Sturm--Liouville eigenvalue equation
    \[
    Ly = \lambda y, \qquad \lambda = \lambda_n = n(n+1) \quad (n = 0, 1, 2, \dots),
    \]
    with $p(x) = 1-x^2$, $q(x) = 0$, and weight function $w(x) = 1$ on $[-1,1]$.

    We equip the space of functions on $[-1,1]$ that are regular at the singular endpoints $x = \pm 1$ (so that $u$, $v$ and $(1-x^2)u'$, $(1-x^2)v'$ remain bounded with $(1-x^2)u'(x), (1-x^2)v'(x) \to 0$ as $x \to \pm 1$) with the unweighted inner product
    \[
    \langle u, v \rangle = \int_{-1}^{1} \overline{u(x)}\,v(x)\,dx.
    \]
    Integrating by parts twice and using that $p(x) = 1-x^2$ is real, we obtain
    \[
    \begin{aligned}
    \langle u, Lv \rangle
    &= -\int_{-1}^{1} \overline{u}\,(pv')'\,dx
     = -\bigl[\overline{u}\,pv'\bigr]_{-1}^{1} + \int_{-1}^{1} p\,\overline{u'}\,v'\,dx \\
    &= \bigl[p(\overline{u'}v - \overline{u}v')\bigr]_{-1}^{1} - \int_{-1}^{1} (p\overline{u'})' v\,dx
     = \bigl[p(\overline{u'}v - \overline{u}v')\bigr]_{-1}^{1} + \langle Lu, v \rangle.
    \end{aligned}
    \]
    Since $p(\pm 1) = 0$ and $u, v$ are regular at $x = \pm 1$, the boundary term vanishes identically. Hence $\langle u, Lv \rangle = \langle Lu, v \rangle$, so $L$ is self-adjoint.

    Now let $y_m$ and $y_n$ be regular eigenfunctions corresponding to non-negative integers $m$ and $n$, so $Ly_m = \lambda_m y_m$ and $Ly_n = \lambda_n y_n$ with $\lambda_n = n(n+1) \in \mathbb{R}$. By self-adjointness,
    \[
    0 = \langle y_m, Ly_n \rangle - \langle Ly_m, y_n \rangle = (\lambda_n - \lambda_m)\langle y_m, y_n \rangle = (n-m)(n+m+1)\int_{-1}^{1} \overline{y_m(x)}\,y_n(x)\,dx.
    \]
    Since $m, n \ge 0$, we have $n + m + 1 \ge 1 > 0$, so $(n-m)(n+m+1) \neq 0$ whenever $m \neq n$. Thus the eigenfunctions satisfy the orthogonality relation
    \[
    \int_{-1}^{1} \overline{y_m(x)}\,y_n(x)\,dx = 0 \qquad (m \neq n)
    \]
    (or $\int_{-1}^{1} y_m(x)y_n(x)\,dx = 0$ for real eigenfunctions).

    For the standard real Legendre polynomials $P_n(x)$ normalised by $P_n(1) = 1$, Rodrigues' formula $P_n(x) = \frac{1}{2^n n!}\frac{d^n}{dx^n}\bigl((x^2-1)^n\bigr)$ gives leading coefficient $a_n = \frac{(2n)!}{2^n(n!)^2}$ and $P_n^{(n)}(x) = n!\,a_n$. Integrating by parts $n$ times (all boundary terms vanish because $(x^2-1)^n$ has zeros of order $n$ at $x = \pm 1$) yields
    \[
    \int_{-1}^{1} P_n(x)^2\,dx = \frac{(-1)^n}{2^n n!}\int_{-1}^{1} P_n^{(n)}(x)(x^2-1)^n\,dx = \frac{a_n}{2^n}\int_{-1}^{1}(1-x^2)^n\,dx.
    \]
    Setting $I_n = \int_{-1}^{1}(1-x^2)^n\,dx$, integration by parts gives $I_n = 2n\int_{-1}^{1}x^2(1-x^2)^{n-1}\,dx = 2n(I_{n-1}-I_n)$, so $I_n = \frac{2n}{2n+1}I_{n-1}$ with $I_0 = 2$, hence $I_n = \frac{2^{2n+1}(n!)^2}{(2n+1)!}$. Therefore
    \[
    \int_{-1}^{1} P_m(x)\,P_n(x)\,dx = \frac{2}{2n+1}\,\delta_{mn}.
    \]
