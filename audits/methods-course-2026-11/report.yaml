    \end{aligned}
    \]
    Taking positive square roots yields $|\mathbf{x}-\mathbf{x}_0^*| = \frac{a}{|\mathbf{x}_0|}|\mathbf{x}-\mathbf{x}_0|$ on $|\mathbf{x}|=a$, whence
    \[
    G(\mathbf{x};\mathbf{x}_0)
    = \frac{-1}{4\pi|\mathbf{x}-\mathbf{x}_0|} + \frac{a}{|\mathbf{x}_0|}\frac{1}{4\pi \frac{a}{|\mathbf{x}_0|}|\mathbf{x}-\mathbf{x}_0|} = 0
    \]
    on $|\mathbf{x}|=a$. At $\mathbf{x}_0=\mathbf{0}$, writing $|\mathbf{x}_0|\,|\mathbf{x}-\mathbf{x}_0^*|=\sqrt{|\mathbf{x}|^2|\mathbf{x}_0|^2 - 2a^2\mathbf{x}\cdot\mathbf{x}_0 + a^4}\to a^2$ gives the continuous limit $G(\mathbf{x};\mathbf{0}) = \frac{1}{4\pi}\bigl(\frac{1}{a}-\frac{1}{|\mathbf{x}|}\bigr)$. Uniqueness follows from Green's first identity (or the maximum principle) applied to the harmonic difference of any two solutions, which vanishes on $|\mathbf{x}|=a$.

    \item[ii)] Now take $|\mathbf{x}_0|>a$ in the exterior domain $|\mathbf{x}|>a$. We seek a single image of strength $q>0$ at $\mathbf{x}_0^*=\lambda\mathbf{x}_0$ inside the sphere ($0<\lambda|\mathbf{x}_0|<a$):
    \[
    G_{\mathrm{ext}}(\mathbf{x};\mathbf{x}_0) = \frac{-1}{4\pi|\mathbf{x}-\mathbf{x}_0|} + \frac{q}{4\pi|\mathbf{x}-\lambda\mathbf{x}_0|}.
    \]
    Imposing $G_{\mathrm{ext}}=0$ on $|\mathbf{x}|=a$ requires $|\mathbf{x}-\lambda\mathbf{x}_0|^2 = q^2|\mathbf{x}-\mathbf{x}_0|^2$ for all $|\mathbf{x}|=a$, i.e.
    \[
    a^2 - 2\lambda(\mathbf{x}\cdot\mathbf{x}_0) + \lambda^2|\mathbf{x}_0|^2
    = q^2\bigl(a^2 - 2(\mathbf{x}\cdot\mathbf{x}_0) + |\mathbf{x}_0|^2\bigr).
    \]
    Matching the coefficients of $\mathbf{x}\cdot\mathbf{x}_0$ and the constant terms gives $\lambda=q^2$ and $(\lambda-1)(\lambda|\mathbf{x}_0|^2-a^2)=0$. The root $\lambda=1$ puts the image at $\mathbf{x}_0$ (giving $G_{\mathrm{ext}}\equiv 0$), leaving the unique admissible root $\lambda = a^2/|\mathbf{x}_0|^2$, $q = a/|\mathbf{x}_0|$, and $\mathbf{x}_0^* = a^2\mathbf{x}_0/|\mathbf{x}_0|^2$.

