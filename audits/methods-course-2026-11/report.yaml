    = 2\int_0^1 P_n(u)\,du$.'
  suggested_fix: |-
    By translation invariance of $\nabla^2$, centre spherical polar coordinates at $\mathbf r'$ and write $s=|\mathbf r-\mathbf r'|>0$. Since $s^{-1}$ is purely radial,
    \[
    \nabla^2\!\left(\frac{1}{s}\right)=\frac{1}{s^2}\frac{d}{ds}\!\left(s^2\frac{d}{ds}(s^{-1})\right)=\frac{1}{s^2}\frac{d}{ds}(-1)=0
    \]
    whenever $\mathbf r\ne\mathbf r'$.

    Now consider a sphere of radius $R$ centred at the origin, with polar axis ($\theta=0$) through the centre of the $+V$ hemisphere, so $\varphi(R,\theta)=V\operatorname{sgn}(\cos\theta)$ for $\theta\ne\pi/2$. Rotational invariance of the domain and boundary data implies that the unique bounded harmonic solution inside $r<R$ is axisymmetric, $\varphi=\varphi(r,\theta)$. Separating variables in spherical polars with $u=\cos\theta$ yields the Legendre equation $((1-u^2)\Theta')'+\lambda\Theta=0$ (whose regular solutions on $[-1,1]$ are $P_n(u)$ with $\lambda=n(n+1)$, $n=0,1,2,\ldots$) and the radial equation $r^2\mathcal R''+2r\mathcal R'-n(n+1)\mathcal R=0$ with solutions $r^n,r^{-n-1}$. Boundedness at $r=0$ excludes $r^{-n-1}$, leaving
    \[
    \varphi(r,\theta)=\sum_{n=0}^\infty a_n\left(\frac{r}{R}\right)^n P_n(\cos\theta).
    \]
    Imposing $\varphi(R,\theta)=V\operatorname{sgn}(u)$ and applying $\int_{-1}^1 P_n(u)P_m(u)\,du=\frac{2}{2n+1}\delta_{nm}$ gives
    \[
    a_n=\frac{2n+1}{2}V\int_{-1}^1\operatorname{sgn}(u)P_n(u)\,du.
    \]
    Since $P_n(-u)=(-1)^nP_n(u)$ and $\operatorname{sgn}(u)$ is odd, $a_n=0$ for even $n$, while for odd $n=2k+1$ ($k=0,1,2,\ldots$),
    \[
    a_{2k+1}=(4k+3)V\int_0^1 P_{2k+1}(u)\,du.
    \]
    Using Rodrigues' formula $P_\ell(u)=\frac{1}{2^\ell\ell!}\frac{d^\ell}{du^\ell}((u^2-1)^\ell)$ for $\ell=2k+1$, the $(\ell-1)$-th derivative vanishes at $u=1$ (a root of order $\ell$), while at $u=0$ only the $u^{2k}$ term in $(u^2-1)^{2k+1}$ survives, giving
    \[
    \int_0^1 P_{2k+1}(u)\,du=-\frac{1}{2^{2k+1}(2k+1)!}(2k)!\binom{2k+1}{k}(-1)^{k+1}=\frac{(-1)^k(2k)!}{2^{2k+1}k!(k+1)!}.
    \]
    (Equivalently, integrating $(2n+1)P_n=P'_{n+1}-P'_{n-1}$ gives $a_{2k+1}=V[P_{2k}(0)-P_{2k+2}(0)]$.) Therefore, inside the sphere $r<R$,
    \[
    \varphi(r,\theta)=V\sum_{k=0}^\infty(-1)^k\frac{(4k+3)(2k)!}{2^{2k+1}k!(k+1)!}\left(\frac{r}{R}\right)^{2k+1}P_{2k+1}(\cos\theta)
    =V\left[\frac{3}{2}\frac{r}{R}P_1(\cos\theta)-\frac{7}{8}\left(\frac{r}{R}\right)^3P_3(\cos\theta)+\cdots\right].
    \]
