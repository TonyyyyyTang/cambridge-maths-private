    We work with the convention $\nabla_{\mathbf{x}}^2 G(\mathbf{x};\mathbf{x}_0)=\delta(\mathbf{x}-\mathbf{x}_0)$ corresponding to the singular term in part i), for which the free-space fundamental solution is $\Phi(\mathbf{x}-\mathbf{x}_0)=-1/(4\pi|\mathbf{x}-\mathbf{x}_0|)$ (harmonic away from $\mathbf{x}_0$, with unit outward flux through any small sphere centred at $\mathbf{x}_0$).

