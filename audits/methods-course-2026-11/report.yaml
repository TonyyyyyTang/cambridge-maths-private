  suggested_fix: |-
    For integers $m, n \ge 1$, direct integration gives the orthogonality relations on $(-T, T)$:
    \[
    \int_{-T}^{T} 1\,dt = 2T, \qquad \int_{-T}^{T}\cos\frac{n\pi t}{T}\,dt = \int_{-T}^{T}\sin\frac{n\pi t}{T}\,dt = \int_{-T}^{T}\cos\frac{m\pi t}{T}\sin\frac{n\pi t}{T}\,dt = 0,
    \]
    \[
    \int_{-T}^{T}\cos\frac{m\pi t}{T}\cos\frac{n\pi t}{T}\,dt = \int_{-T}^{T}\sin\frac{m\pi t}{T}\sin\frac{n\pi t}{T}\,dt = T\delta_{mn}.
    \]
    Consequently, the Fourier coefficients of $f(t)$ are
    \[
    a_0 = \frac{1}{T}\int_{-T}^{T} f(t)\,dt, \qquad
    a_n = \frac{1}{T}\int_{-T}^{T} f(t)\cos\frac{n\pi t}{T}\,dt, \qquad
    b_n = \frac{1}{T}\int_{-T}^{T} f(t)\sin\frac{n\pi t}{T}\,dt \quad (n \ge 1).
    \]

    \emph{Parseval's theorem.} If $f(t)$ is real and piecewise continuous (more generally, square-integrable) on $(-T, T)$ with Fourier coefficients $a_0, a_n, b_n$, then
    \[
    \frac{1}{T}\int_{-T}^{T} [f(t)]^2\,dt = \frac{a_0^2}{2} + \sum_{n=1}^{\infty}(a_n^2 + b_n^2).
    \]

    \emph{Proof.} Let $S_N(t) = \frac{a_0}{2} + \sum_{n=1}^{N}\left(a_n\cos\frac{n\pi t}{T} + b_n\sin\frac{n\pi t}{T}\right)$ be the $N$th partial sum. Using the coefficient formulae and orthogonality on the finite sums gives
    \[
    \int_{-T}^{T} f(t) S_N(t)\,dt = \int_{-T}^{T} [S_N(t)]^2\,dt = T\left(\frac{a_0^2}{2} + \sum_{n=1}^{N}(a_n^2 + b_n^2)\right).
    \]
    Expanding the mean-square error therefore yields
    \[
    \int_{-T}^{T} \bigl(f(t) - S_N(t)\bigr)^2\,dt = \int_{-T}^{T} [f(t)]^2\,dt - T\left(\frac{a_0^2}{2} + \sum_{n=1}^{N}(a_n^2 + b_n^2)\right).
    \]
    By completeness of the trigonometric system on $(-T, T)$, $S_N \to f$ in the mean-square sense, so $\int_{-T}^{T} (f(t) - S_N(t))^2\,dt \to 0$ as $N \to \infty$. Letting $N \to \infty$ and dividing by $T$ gives Parseval's identity:
    \[
    \frac{1}{T}\int_{-T}^{T} [f(t)]^2\,dt = \frac{a_0^2}{2} + \sum_{n=1}^{\infty}(a_n^2 + b_n^2).
    \]

    For the square wave $g(t)$ on $(-\pi, \pi)$ we have $T = \pi$, so
    \[
    a_0 = \frac{1}{\pi}\int_0^{\pi} 1\,dt = 1, \qquad
    a_n = \frac{1}{\pi}\int_0^{\pi} \cos(nt)\,dt = \frac{1}{\pi}\left[\frac{\sin(nt)}{n}\right]_0^{\pi} = 0 \quad (n \ge 1),
    \]
    \[
    b_n = \frac{1}{\pi}\int_0^{\pi} \sin(nt)\,dt = \frac{1}{\pi}\left[-\frac{\cos(nt)}{n}\right]_0^{\pi} = \frac{1 - (-1)^n}{n\pi} \quad (n \ge 1).
    \]
    Hence $b_{2k} = 0$ and $b_{2k+1} = \frac{2}{(2k+1)\pi}$ ($k \ge 0$), giving the Fourier series
    \[
    \frac{1}{2} + \frac{2}{\pi}\sum_{k=0}^{\infty}\frac{\sin\bigl((2k+1)t\bigr)}{2k+1}.
    \]

    Since $g$ is piecewise smooth on $[-\pi, \pi]$ and continuous at $t = \frac{\pi}{2}$ with $g(\pi/2) = 1$, Dirichlet's convergence theorem gives, using $\sin\bigl((2k+1)\frac{\pi}{2}\bigr) = (-1)^k$,
    \[
    1 = \frac{1}{2} + \frac{2}{\pi}\sum_{k=0}^{\infty}\frac{(-1)^k}{(2k+1)} \implies \sum_{k=0}^{\infty}\frac{(-1)^k}{(2k+1)} = \frac{\pi}{4}.
    \]
    Applying Parseval's theorem to $g$ with $T = \pi$ gives
    \[
    1 = \frac{1}{\pi}\int_0^{\pi} 1^2\,dt = \frac{1^2}{2} + \sum_{k=0}^{\infty}\left(\frac{2}{(2k+1)\pi}\right)^2 = \frac{1}{2} + \frac{4}{\pi^2}\sum_{k=0}^{\infty}\frac{1}{(2k+1)^2},
    \]
    whence $\sum_{k=0}^{\infty}\frac{1}{(2k+1)^2} = \frac{\pi^2}{8}$.

    At $t = 0$, every term $\sin((2k+1)\cdot 0) = 0$, so the Fourier series sums to $\frac{1}{2}$. This differs from the assigned value $g(0) = 0$ because $g$ has a jump discontinuity at $t = 0$ with $g(0^-) = 0$ and $g(0^+) = 1$: by Dirichlet's theorem the series converges to the midpoint $\frac{1}{2}(g(0^-) + g(0^+)) = \frac{1}{2}$, and the integral definitions of the Fourier coefficients are unaffected by the value assigned to $g$ at a single point.
