  details: 'Exact quoted step in solution.tex: ''Maximize $r^2=x^2+y^2$ on the ellipse. The identity $4=r^2+xy\ge
    r^2/2$ gives $r^2\le8$, with equality precisely at $y=-x$.''. All mathematical results match the rework
    (Parts 1-2 describe Lagrange multipliers and prove the determinant vanishes at both regular and singular
    stationary points; Part 3 finds the maximum distance $2\sqrt{2}$ attained at $(2, -2)$ and $(-2, 2)$).
    However, Part 3 has two presentation/justification flaws that a supervisor would mark down: (1) it
    mislabels the inequality $4 = r^2 + xy \ge r^2/2$ as an ''identity'' and omits the completing-the-square
    justification $x^2 + y^2 + xy = \frac{1}{2}(x^2 + y^2) + \frac{1}{2}(x + y)^2 \ge \frac{1}{2}r^2$
    needed to establish both the inequality and its equality condition $y = -x$; (2) in a question specifically
    setting up Lagrange multipliers and the determinant condition, it bypasses the course method entirely
    in Part 3 (contrary to STYLE.md §4, though the question does not say ''Hence''). Borderline with agree
    because the inequality shortcut is valid once $(x + y)^2 \ge 0$ is supplied and directly yields the
    global maximum.'
  suggested_fix: |-
    To find the stationary points of $f(x, y)$ subject to $g(x, y) = 0$, we introduce a Lagrange multiplier $\lambda$ and form $\mathcal{L}(x, y, \lambda) = f(x, y) - \lambda g(x, y)$. At any regular point of the constraint curve ($\nabla g \neq \mathbf{0}$), a constrained stationary point has zero directional derivative along the tangent to $g = 0$; since $\nabla g$ is normal to the curve, $\nabla f$ must be parallel to $\nabla g$, giving $\nabla f = \lambda \nabla g$. We solve the three equations $f_x = \lambda g_x$, $f_y = \lambda g_y$, and $g(x, y) = 0$ for $(x, y, \lambda)$, and check any singular points where $g = 0$ and $\nabla g = \mathbf{0}$ separately.

    At a regular stationary point $(a, b)$, $\nabla f(a, b) = \lambda \nabla g(a, b)$, so the first column of the determinant is $\lambda$ times the second:
    \[
    \begin{vmatrix}
    \dfrac{\partial f}{\partial x}(a, b) & \dfrac{\partial g}{\partial x}(a, b) \\[10pt]
    \dfrac{\partial f}{\partial y}(a, b) & \dfrac{\partial g}{\partial y}(a, b)
    \end{vmatrix}
    = \lambda g_x(a, b) g_y(a, b) - g_x(a, b)\bigl(\lambda g_y(a, b)\bigr) = 0.
    \]
    At a singular point, $\nabla g(a, b) = \mathbf{0}$, so the second column is zero and the determinant again vanishes.

    To maximise the distance $\sqrt{x^2 + y^2}$ from the origin on $g(x, y) = x^2 + y^2 + xy - 4 = 0$, we maximise $f(x, y) = x^2 + y^2$. Since $x^2 + y^2 + xy = \frac{1}{2}(x^2 + y^2) + \frac{1}{2}(x + y)^2 \ge \frac{1}{2}(x^2 + y^2)$, the curve is closed and bounded ($x^2 + y^2 \le 8$), so $f$ attains its global maximum on it. Moreover $\nabla g = (2x + y, x + 2y) = \mathbf{0}$ only at $(0, 0)$, which does not lie on $g = 0$, so every point is regular. The determinant condition gives
    \[
    0 = \begin{vmatrix} 2x & 2x + y \\ 2y & x + 2y \end{vmatrix}
    = 2x(x + 2y) - 2y(2x + y) = 2(x^2 - y^2),
    \]
    so $y = x$ or $y = -x$. If $y = x$, then $3x^2 = 4$, giving $x^2 + y^2 = 8/3$; if $y = -x$, then $x^2 = 4$, giving $(x, y) = (2, -2)$ or $(-2, 2)$ with $x^2 + y^2 = 8$. Comparing stationary values, the maximum distance from the origin is $\sqrt{8} = 2\sqrt{2}$.
