  details: 'Exact quoted step in solution.tex: ''The speed law bounds $|\dot u|\le\sqrt{g/2}$, so the
    zero-endpoint Wirtinger inequality applies, also for piecewise smooth tracks with isolated zero-depth
    points. If there is transverse motion the displayed equality becomes an upper bound. Set $K=\int_0^T\dot
    u^2dt$. By Cauchy-Schwarz and Wirtinger''s inequality $\int_0^T u^2dt\le(T/\pi)^2K$, we obtain \[
    l\le\int_0^T|\dot x|dt \le\frac{2T}{\pi}\sqrt{K(gT/2-K)} \le\frac{gT^2}{2\pi}. \]''. The minimum travel
    time $(2\pi l/g)^{1/2}$ and attaining cycloid $x=R(\theta-\sin\theta)$, $y=R(1-\cos\theta)$ with $R=l/(2\pi)$
    agree exactly with the rework, and the global lower-bound argument via $u=\sqrt{y}$, $|\dot{x}|\le
    2u\sqrt{g/2-\dot{u}^2}$, Cauchy-Schwarz, Wirtinger''s inequality, and AM-GM is mathematically valid
    and sharp (all inequalities and equality on the cycloid verified numerically to machine precision).
    However, a Cambridge IB supervisor would mark down citing Wirtinger''s inequality $\int_0^T u^2\,dt
    \le (T/\pi)^2\int_0^T \dot{u}^2\,dt$ as a black box without proof: it carries the entire variational
    weight of the lower bound, is not a standard quoted IB Methods lecture theorem (its constant depends
    on the boundary conditions), and can be proved directly in 3 lines using IB Methods Fourier sine series
    and Parseval''s identity. In addition, the solution bypasses the historical Calculus of Variations
    / Euler-Lagrange derivation of the cycloid (the section of 2001-02 Sheet 3 where this question sits)
    and omits several short algebraic derivations ($|\dot{x}|=2u\sqrt{g/2-\dot{u}^2}$, the AM-GM bound,
    the vertical tangent check, and the cycloid arc-length simplification). Flagged borderline with agree
    because the proof is fully valid once Wirtinger''s inequality is granted and genuinely proves global
    minimality.'
  suggested_fix: |-
    Measure depth $y\ge 0$ downwards from the level of $A=(0,0)$ and $B=(l,0)$, with $x$ horizontal along $AB$, and let $T$ be the travel time of an admissible piecewise-smooth path. Conservation of energy from rest at $y=0$ gives $\dot{x}^2+\dot{y}^2\le v^2=2gy$ (with equality for motion in the vertical plane). Setting $u(t)=\sqrt{y(t)}$, we have $u(0)=u(T)=0$ and, wherever $u>0$, $\dot{y}=2u\dot{u}$, so
    \[
    \dot{x}^2 + 4u^2\dot{u}^2 \le 2gu^2 \implies |\dot{u}|\le\sqrt{g/2}, \qquad |\dot{x}| \le 2u\sqrt{g/2-\dot{u}^2}.
    \]
    Since $|\dot{u}|$ is bounded, $u$ is continuous and piecewise $C^1$ on $[0,T]$ with $u(0)=u(T)=0$ (including when the path touches $y=0$ at isolated interior points). Expanding $u$ in a Fourier sine series $u(t)=\sum_{n=1}^{\infty} b_n \sin(n\pi t/T)$ on $[0,T]$ and integrating by parts (using $u(0)=u(T)=0$) gives $\dot{u}(t)\sim \sum_{n=1}^{\infty} (n\pi/T)b_n\cos(n\pi t/T)$. By Parseval's identity,
    \[
    K := \int_0^T \dot{u}^2\,\mathrm{d}t
    = \frac{T}{2}\sum_{n=1}^{\infty} \frac{n^2\pi^2}{T^2} b_n^2
    \ge \frac{\pi^2}{T^2}\cdot \frac{T}{2}\sum_{n=1}^{\infty} b_n^2
    = \frac{\pi^2}{T^2}\int_0^T u^2\,\mathrm{d}t,
    \]
    which is Wirtinger's inequality $\int_0^T u^2\,\mathrm{d}t \le (T/\pi)^2 K$. Applying Cauchy--Schwarz and AM--GM ($\sqrt{K(gT/2-K)}\le gT/4$ since $0\le K\le gT/2$) gives
    \[
    l = \int_0^T \dot{x}\,\mathrm{d}t
    \le \int_0^T |\dot{x}|\,\mathrm{d}t
    \le 2\left(\int_0^T u^2\,\mathrm{d}t\right)^{\!1/2}\left(\int_0^T \left(\frac{g}{2}-\dot{u}^2\right)\mathrm{d}t\right)^{\!1/2}
    \le \frac{2T}{\pi}\sqrt{K\left(\frac{gT}{2}-K\right)}
    \le \frac{gT^2}{2\pi},
    \]
    whence $T \ge (2\pi l/g)^{1/2}$ for every admissible path (including 3D paths and paths reversing horizontal direction).

    To show this lower bound is attained, set $R=l/(2\pi)$ and take the inverted cycloid
    \[
    x(\theta)=R(\theta-\sin\theta), \qquad y(\theta)=R(1-\cos\theta), \qquad 0\le\theta\le 2\pi.
    \]
    Its endpoints are $(0,0)$ at $\theta=0$ and $(2\pi R,0)=(l,0)$ at $\theta=2\pi$, and its slope $\mathrm{d}y/\mathrm{d}x = \sin\theta/(1-\cos\theta)=\cot(\theta/2)\to\pm\infty$ as $\theta\to 0^+, 2\pi^-$ (vertical tangents at $A$ and $B$). For $\theta\in(0,2\pi)$,
    \[
    \mathrm{d}s = R\sqrt{(1-\cos\theta)^2+\sin^2\theta}\,\mathrm{d}\theta = R\sqrt{2(1-\cos\theta)}\,\mathrm{d}\theta = 2R\sin\frac{\theta}{2}\,\mathrm{d}\theta,
    \qquad
    \sqrt{2gy} = 2\sqrt{gR}\sin\frac{\theta}{2},
    \]
    so the integrand $\mathrm{d}s/\sqrt{2gy}=\sqrt{R/g}\,\mathrm{d}\theta$ is constant and integrable up to the endpoints, giving
    \[
    T = \int_0^{2\pi}\sqrt{\frac{R}{g}}\,\mathrm{d}\theta = 2\pi\sqrt{\frac{R}{g}} = \left(\frac{2\pi l}{g}\right)^{\!\frac12}.
    \]
    Hence the minimum travel time is $(2\pi l/g)^{\frac12}$.
