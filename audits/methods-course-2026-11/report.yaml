    Take real boundary coefficients with $(A_1,A_2)\neq(0,0)$ and $(B_1,B_2)\neq(0,0)$, and consider the unweighted Hermitian inner product $\langle u,v\rangle=\int_a^b \overline{u}(x)v(x)\,dx$ on twice continuously differentiable functions satisfying the boundary conditions. Since $p,q,A_i,B_i$ are real, $\overline{u}$ satisfies the same boundary conditions as $u$. Integrating by parts twice gives
    \[
    \begin{aligned}
    \langle u,\mathcal Lv\rangle
    &=\int_a^b \overline{u}\bigl(-(pv')'+qv\bigr)\,dx \\
    &=-\bigl[p\overline{u}v'\bigr]_a^b+\int_a^b\bigl(p\overline{u'}v'+q\overline{u}v\bigr)\,dx \\
    &=\bigl[p(\overline{u'}v-\overline{u}v')\bigr]_a^b+\int_a^b\bigl(-(p\overline{u'})'+q\overline{u}\bigr)v\,dx \\
    &=\bigl[p(\overline{u'}v-\overline{u}v')\bigr]_a^b+\langle\mathcal Lu,v\rangle.
    \end{aligned}
    \]
    At $x=a$, both $(\overline{u}(a),\overline{u'}(a))$ and $(v(a),v'(a))$ are orthogonal to the non-zero vector $(A_1,A_2)$, so the $2\times 2$ determinant $\overline{u'}(a)v(a)-\overline{u}(a)v'(a)$ vanishes; similarly $\overline{u'}(b)v(b)-\overline{u}(b)v'(b)=0$. Thus the boundary term vanishes and $\langle u,\mathcal Lv\rangle=\langle\mathcal Lu,v\rangle$, so $\mathcal L$ is self-adjoint.

    For any eigenfunction $y\not\equiv 0$ with $\mathcal Ly=\lambda\omega y$, self-adjointness yields $\lambda\int_a^b\omega|y|^2\,dx=\langle y,\mathcal Ly\rangle=\langle\mathcal Ly,y\rangle=\overline\lambda\int_a^b\omega|y|^2\,dx$. Since $\omega>0$, $\int_a^b\omega|y|^2\,dx>0$, so $\lambda$ is real; because the operator and boundary conditions are real, we may take $y$ real-valued (taking real or imaginary parts). Multiplying $\mathcal Ly=\lambda\omega y$ by $y$ and integrating by parts once on $[a,b]$ gives
    \[
    \lambda\int_a^b\omega y^2\,dx
    =\int_a^b y\mathcal Ly\,dx
    =-\int_a^b y(py')'\,dx+\int_a^b qy^2\,dx
    =\int_a^b\bigl(p(y')^2+qy^2\bigr)\,dx-\bigl[pyy'\bigr]_a^b.
    \]
    Dividing by $\int_a^b\omega y^2\,dx>0$ yields
    \[
    \lambda=\frac{\int_a^b\bigl(p(y')^2+qy^2\bigr)\,dx-[pyy']_a^b}{\int_a^b\omega y^2\,dx}.
    \]

    In the special problem $p=\omega=1$, $q\geqslant 0$, $y(0)=0$, and $ky(\ell)+y'(\ell)=0$ ($k>0$), the boundary term is $-[yy']_0^\ell=-y(\ell)(-ky(\ell))+0=ky(\ell)^2$, so
    \[
    \lambda=\frac{\int_0^\ell\bigl((y')^2+qy^2\bigr)\,dx+ky(\ell)^2}{\int_0^\ell y^2\,dx}.
    \]
    Since $q\geqslant 0$ and $k>0$, each term in the numerator is non-negative and the denominator is strictly positive, so $\lambda\geqslant 0$. If $\lambda=0$, then $\int_0^\ell (y')^2\,dx=0$, forcing $y'\equiv 0$ by continuity, so $y$ is constant; the boundary condition $y(0)=0$ then forces $y\equiv 0$, contradicting that $y$ is an eigenfunction. Hence $\lambda>0$.

    When $q=0$, write $z=\ell\sqrt{\lambda}>0$. The ODE $-y''=\lambda y$ with $y(0)=0$ gives $y(x)=C\sin(zx/\ell)$ ($C\neq 0$), and the condition $ky(\ell)+y'(\ell)=0$ becomes $z\cos z+k\ell\sin z=0$. Neither $\cos z$ nor $\sin z$ can vanish at a root (since $k\ell>0$ and $z>0$), so $\tan z=-z/(k\ell)$. On each interval $((n-\frac12)\pi,n\pi)$ ($n\geqslant 1$), $\tan z$ increases strictly from $-\infty$ to $0$ while $-z/(k\ell)$ decreases strictly and remains negative, giving a unique intersection $z_n\in((n-\frac12)\pi,n\pi)$. There are no other positive roots since $\tan z\geqslant 0>-z/(k\ell)$ on $(0,\frac12\pi)$ and $[n\pi,(n+\frac12)\pi)$.
    \diagram{robin-roots}{Tangent branches and the descending line for a representative positive Robin constant}
    Hence there are infinitely many eigenvalues $0<\lambda_1<\lambda_2<\cdots$ with $\lambda_n=(z_n/\ell)^2$ and eigenfunctions $y_n(x)=C_n\sin(z_nx/\ell)$. Writing $s_n=(n-\frac12)\pi$ and $z_n=s_n+\delta_n$ with $0<\delta_n<\frac12\pi$, we have $-\cot\delta_n=\tan(s_n+\delta_n)=-z_n/(k\ell)$, so $\tan\delta_n=k\ell/z_n\to 0^+$. Expanding $\delta_n=\arctan\bigl(k\ell/(s_n+\delta_n)\bigr)$ gives $\delta_n=k\ell/s_n+O(s_n^{-3})$, and therefore
    \[
    \lambda_n=\frac{(s_n+\delta_n)^2}{\ell^2}=\frac{\left(n-\frac12\right)^2\pi^2}{\ell^2}+\frac{2k}{\ell}+O(n^{-2})\sim\frac{n^2\pi^2}{\ell^2}\qquad\text{as }n\to\infty.
    \]
