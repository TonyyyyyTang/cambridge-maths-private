    \begin{aligned}
    G(\mathbf{x}, t; \mathbf{y}, s)
    &= \frac{H(T)}{(2\pi)^3}\int_{\mathbb{R}^3} e^{i\mathbf{k}\cdot(\mathbf{x} - \mathbf{y})}\frac{\sin(kcT)}{kc}\,d^3k \\
    &= -\frac{i H(T)}{4\pi^2 c R}\int_{-\infty}^{\infty} e^{ikR}\sin(kcT)\,dk \\
    &= -\frac{H(T)}{8\pi^2 c R}\int_{-\infty}^{\infty} \bigl(e^{ik(R + cT)} - e^{ik(R - cT)}\bigr)\,dk.
    \end{aligned}
    \]
    Using $\int_{-\infty}^{\infty} e^{ikz}\,dk = 2\pi\delta(z)$, we obtain
    \[
    G(\mathbf{x}, t; \mathbf{y}, s)
    = \frac{H(T)}{4\pi c R}\bigl[\delta(R - cT) - \delta(R + cT)\bigr].
    \]
    Since $R > 0$ and $c > 0$, we have $R + cT > 0$ whenever $T \ge 0$ (and $H(T) = 0$ for $T < 0$), so $H(T)\delta(R + cT) = 0$. Using $\delta(R - cT) = \frac{1}{c}\delta(T - R/c)$, whose support at $T = R/c > 0$ automatically lies in $T > 0$ (where $H(T) = 1$), gives
    \[
    G(\mathbf{x}, t; \mathbf{y}, s)
    = \frac{H(T)}{4\pi c R}\,\delta(R - cT)
    = \frac{\delta(T - R/c)}{4\pi c^2 R},
    \qquad R = |\mathbf{x} - \mathbf{y}|,\ T = t - s.
    \]

    Now let $u$ solve $\partial_t^2 u - c^2\nabla^2 u = 0$ for $t > 0$ with $u(\mathbf{x}, 0) = 0$ and $\partial_t u(\mathbf{x}, 0) = f(\mathbf{x})$, and set $v(\mathbf{x}, t) = H(t)u(\mathbf{x}, t)$. Differentiating distributionally gives $\partial_t v = H(t)\partial_t u$ (since $u(\mathbf{x}, 0) = 0$) and $\partial_t^2 v = \delta(t)f(\mathbf{x}) + H(t)\partial_t^2 u$, so $(\partial_t^2 - c^2\nabla^2)v = f(\mathbf{x})\delta(t)$ with $v = 0$ for $t < 0$. Convolving with $G$ gives, for $t > 0$,
    \[
    u(\mathbf{x}, t)
    = \int_{-\infty}^{\infty} ds \int_{\mathbb{R}^3} d^3y\, G(\mathbf{x}, t; \mathbf{y}, s)\,f(\mathbf{y})\delta(s)
    = \int_{\mathbb{R}^3} \frac{\delta(|\mathbf{x} - \mathbf{y}| - ct)}{4\pi c|\mathbf{x} - \mathbf{y}|}\,f(\mathbf{y})\,d^3y.
    \]
    Setting $\mathbf{y} = \mathbf{x} + R\mathbf{n}$ with $|\mathbf{n}| = 1$ and $d^3y = R^2\,dR\,d\Omega$ (where $d\Omega$ is the solid angle element on the unit sphere $S^2$), we evaluate the radial integral at $R = ct > 0$:
    \[
    u(\mathbf{x}, t)
    = \frac{1}{4\pi c}\int_{S^2} d\Omega \int_0^{\infty} R\,\delta(R - ct)\,f(\mathbf{x} + R\mathbf{n})\,dR
    = \frac{t}{4\pi}\int_{S^2} f(\mathbf{x} + ct\mathbf{n})\,d\Omega.
    \]
    Since the sphere of radius $ct$ centred on $\mathbf{x}$ has area element $dS = (ct)^2\,d\Omega$ and total area $4\pi(ct)^2$, the average of $f$ over this sphere is $\langle f\rangle = \frac{1}{4\pi}\int_{S^2} f(\mathbf{x} + ct\mathbf{n})\,d\Omega$, so $u(\mathbf{x}, t) = \langle f\rangle\,t$.

    \emph{Interpretation.} The solution at $(\mathbf{x}, t)$ depends only on initial data on the spherical surface $|\mathbf{y} - \mathbf{x}| = ct$ of radius $ct$ centred on $\mathbf{x}$, and not on points outside or strictly inside this sphere. Thus disturbances in three spatial dimensions propagate with sharp wavefronts at exact speed $c$ and leave no trailing wake (Huygens' strong principle).
