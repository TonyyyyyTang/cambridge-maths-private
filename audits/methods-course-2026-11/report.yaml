  suggested_fix: |-
    Introduce characteristic coordinates $\xi = ct - x$ and $\eta = ct + x$ (assuming $c \neq 0$; the Jacobian is $\frac{\partial(\xi,\eta)}{\partial(x,t)} = -2c \neq 0$, so the change of variables is invertible). By the chain rule,
    \[
    \frac{1}{c}\frac{\partial}{\partial t} = \frac{\partial}{\partial \xi} + \frac{\partial}{\partial \eta}, \qquad
    \frac{\partial}{\partial x} = -\frac{\partial}{\partial \xi} + \frac{\partial}{\partial \eta}.
    \]
    For $y \in C^2$, mixed partial derivatives commute, so the wave equation becomes
    \[
    \left(\frac{1}{c^2}\frac{\partial^2}{\partial t^2} - \frac{\partial^2}{\partial x^2}\right)y
    = \left[\left(\frac{\partial}{\partial \xi} + \frac{\partial}{\partial \eta}\right)^2 - \left(-\frac{\partial}{\partial \xi} + \frac{\partial}{\partial \eta}\right)^2\right]y
    = 4\frac{\partial^2 y}{\partial \xi\,\partial \eta} = 0.
    \]
    Integrating first with respect to $\eta$ gives $\frac{\partial y}{\partial \xi} = h(\xi)$ for some arbitrary function $h$, and integrating with respect to $\xi$ gives $y = f(\xi) + g(\eta)$ where $f'(\xi) = h(\xi)$ and $g(\eta)$ is an arbitrary function of $\eta$. Hence the general solution is
    \[
    y(x,t) = f(ct - x) + g(ct + x).
    \]

    Imposing $y(0,t) = 0$ for all $t$ gives $f(ct) + g(ct) = 0$. Setting $u = ct$, we obtain
    \[
    f(u) = -g(u) \qquad \text{for all } u,
    \]
    so $y(x,t) = g(ct + x) - g(ct - x)$. Imposing $y(L,t) = 0$ for all $t$ then gives
    \[
    0 = f(ct - L) + g(ct + L) = -g(ct - L) + g(ct + L),
    \]
    so $g(u + L) = g(u - L)$ for all $u$. Setting $w = u - L$ yields $g(w + 2L) = g(w)$ for all $w$, and therefore also $f(w + 2L) = -g(w + 2L) = -g(w) = f(w)$. Thus both $f$ and $g$ are periodic with period $2L$.

    Differentiating $y(x,t) = g(ct + x) - g(ct - x)$ gives
    \[
    \frac{1}{c}\frac{\partial y}{\partial t} = g'(ct + x) - g'(ct - x), \qquad
    \frac{\partial y}{\partial x} = g'(ct + x) + g'(ct - x).
    \]
    Squaring and adding cancels the cross terms:
    \[
    \frac{1}{2}\left[\frac{1}{c^2}\left(\frac{\partial y}{\partial t}\right)^2 + \left(\frac{\partial y}{\partial x}\right)^2\right]
    = g'(ct + x)^2 + g'(ct - x)^2.
    \]
    Integrating over $0 \leqslant x \leqslant L$ and substituting $\tilde{x} = -x$ in the second term gives
    \[
    \begin{aligned}
    E(t) := \frac{1}{2}\int_0^L\left(\frac{1}{c^2}\left(\frac{\partial y}{\partial t}\right)^2 + \left(\frac{\partial y}{\partial x}\right)^2\right)\mathrm{d}x
    &= \int_0^L g'(ct + x)^2\,\mathrm{d}x + \int_0^L g'(ct - x)^2\,\mathrm{d}x \\
    &= \int_0^L g'(ct + x)^2\,\mathrm{d}x + \int_{-L}^0 g'(ct + \tilde{x})^2\,\mathrm{d}\tilde{x}
     = \int_{-L}^L g'(ct + x)^2\,\mathrm{d}x.
    \end{aligned}
    \]
    Finally, substituting $w = ct + x$ gives $E(t) = \int_{ct-L}^{ct+L} g'(w)^2\,\mathrm{d}w$. Differentiating $g(w+2L) = g(w)$ shows that $g'(w+2L) = g'(w)$ for all $w$, so differentiating with respect to $t$ yields
    \[
    \frac{\mathrm{d}E}{\mathrm{d}t} = c\bigl[g'(ct + L)^2 - g'(ct - L)^2\bigr] = 0.
    \]
    Hence the integral is constant, independent of $t$.
