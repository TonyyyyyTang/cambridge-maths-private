  details: 'Exact quoted step in solution.tex: ''The partial sum $S_N$ is the orthogonal projection onto
    the first modes. Orthogonality gives \[ T^{-1}\int_{-T}^T f^2=\|f-S_N\|^2+a_0^2/2+\sum_{n=1}^N(a_n^2+b_n^2).
    \] Trigonometric polynomials are dense in periodic $L^2$: continuous periodic functions are dense
