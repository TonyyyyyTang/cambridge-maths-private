  details: 'Exact quoted step in solution.tex: ''Under an orthogonal change $x''_i=R_{ij}x_j$ a second
    rank tensor transforms by $M''_{ij}=R_{ik}R_{jl}M_{kl}$. Contracting gives $M''_{ii}=\delta_{kl}M_{kl}=M_{ii}$,
    a scalar. In the plate $x_3=0$, so the two off-diagonal elements involving the third direction vanish
    and its eigenvalue is $M_\perp=\int_D(x^2+y^2)\rho\,dS$. The trace of the in-plane block equals the
    same integral and is also $M_1+M_2$.''. All final results agree with the blind rework: transformation
    law $M''_{ij}=R_{ik}R_{jl}M_{kl}$, scalar invariance $M''_{ii}=M_{ii}$, $z$-eigenvalue $M_\perp=\int_D(x^2+y^2)\rho\,dS$,
    perpendicular axis identity $M_\perp=M_1+M_2$, and uniform disc tensor $M=(\pi\rho a^4/4)\operatorname{diag}(1,1,2)$.
    However, for a 20-mark Section II question, every requested "show that" proof is compressed to a bare
    assertion in a way an IB supervisor would mark down: (1) In "Show from your definition that if $M_{ij}$
    is a second rank tensor then $M_{ii}$ is a scalar", the solution does not state the orthogonality
    identity $R_{ik}R_{il}=(R^T R)_{kl}=\delta_{kl}$ or write the intermediate contraction $M''_{ii}=R_{ik}R_{il}M_{kl}$,
    nor state what a scalar is (invariant under orthogonal changes of axes). (2) In "Show that the $z$-direction
    is an eigenvector of $M_{ij}$", it never evaluates $M_{ij}(\mathbf{e}_3)_j = M_{i3} = \int_D(x_k x_k\delta_{i3}-x_i
    x_3)\rho\,dS = \delta_{i3}\int_D(x^2+y^2)\rho\,dS$, and imprecisely refers to "the two off-diagonal
    elements involving the third direction" (there are four off-diagonal entries $M_{13}, M_{23}, M_{31},
    M_{32}$: two in the third column and two in the third row). (3) In "show that ... $M_\perp = M_1 +
    M_2$", it uses an "otherwise" trace-of-in-plane-block route without computing $M_{11}+M_{22}=\int_D
    y^2\rho\,dS+\int_D x^2\rho\,dS=\int_D(x^2+y^2)\rho\,dS$ or noting that symmetry ($M_{31}=M_{32}=0$)
    puts $M$ in block-diagonal form so $M_1, M_2$ are the eigenvalues of the $2\times 2$ in-plane block
    (equivalently, the intended "Hence" proof computes $M_{ii}=\int_D(3x_kx_k-x_ix_i)\rho\,dS=2M_\perp$
    and equates it to the principal-axis trace $M_1+M_2+M_\perp$ using symmetry of $M_{ij}$). (Historical
    curriculum note: Cartesian tensors was part of the 2006 IB Methods syllabus, so this is not an off-schedule
    solution method.)'
  suggested_fix: |-
    Under a change of orthonormal Cartesian axes $x'_i = R_{ij} x_j$, where $R$ is an orthogonal matrix ($R^T R = R R^T = I$, i.e. $R_{ik}R_{il} = \delta_{kl}$), a second rank tensor is a set of nine components $M_{ij}$ ($i, j \in \{1,2,3\}$) transforming by
    \[
    M'_{ij} = R_{ik} R_{jl} M_{kl}.
    \]
    A scalar is a quantity invariant under all such orthogonal transformations. Contracting $i$ with $j$ and using the orthogonality of $R$ gives
    \[
    M'_{ii} = R_{ik} R_{il} M_{kl} = \delta_{kl} M_{kl} = M_{kk} = M_{ii},
    \]
    so $M_{ii}$ is a scalar.

    Since the plate lies in the $(x,y)$-plane, $x_3 = 0$ identically on $D$, and $x_k x_k = x^2 + y^2$. Acting with $M_{ij}$ on the unit vector $\mathbf{e}_3 = (0,0,1)$ with components $(\mathbf{e}_3)_j = \delta_{j3}$ yields
    \[
    M_{ij}(\mathbf{e}_3)_j = M_{i3} = \int_D (x_k x_k \delta_{i3} - x_i x_3)\rho\,dS = \delta_{i3}\int_D (x^2+y^2)\rho\,dS = M_\perp (\mathbf{e}_3)_i,
    \]
    so the $z$-direction is an eigenvector of $M_{ij}$ with eigenvalue
    \[
    M_\perp = \int_D (x^2+y^2)\rho\,dS.
    \]

    Since $\delta_{ij}$ and $x_i x_j$ are symmetric, $M_{ij}$ is a real symmetric second rank tensor, so there exists an orthogonal frame of principal axes in which $M$ is diagonal with entries $M_1, M_2, M_\perp$. In this frame the trace is $M'_{ii} = M_1 + M_2 + M_\perp$. In the original frame, using $\delta_{ii} = 3$,
    \[
    M_{ii} = \int_D (x_k x_k \delta_{ii} - x_i x_i)\rho\,dS = 2\int_D x_k x_k\rho\,dS = 2M_\perp.
    \]
    Since $M_{ii}$ is a scalar, $M_1 + M_2 + M_\perp = 2M_\perp$, and hence $M_\perp = M_1 + M_2$.

    For a uniform circular disc of radius $a$ and areal density $\rho$ centred at the origin, $M_{13} = M_{31} = M_{23} = M_{32} = 0$ because $x_3 = 0$, and $M_{12} = M_{21} = -\rho\int_D xy\,dS = 0$ by reflection symmetry $x \mapsto -x$. Hence $M$ is diagonal in the $(x,y,z)$ frame, with $M_1 = M_{11}$ and $M_2 = M_{22}$. By rotational symmetry $M_{11} = M_{22}$, so $M_{11} = M_{22} = \frac{1}{2}M_\perp$. In plane polar coordinates,
    \[
    M_\perp = \rho\int_0^{2\pi} d\theta \int_0^a r^3\,dr = \frac{1}{2}\pi\rho a^4.
    \]
    Therefore
    \[
    M = \frac{\pi\rho a^4}{4}\begin{pmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 2 \end{pmatrix}.
    \]
