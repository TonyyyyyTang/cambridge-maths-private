    \le 0$ and non-real $\lambda$ properly excluded via $xu'' \to 0$ and the Rayleigh-quotient energy
    identity; Lommel identity, orthogonality, and normalisation $\frac{1}{2}[J_0''(j_n)]^2$; and inhomogeneous
    eigenfunction expansion $u(x) = \sum_{n\ge 1} \frac{2 J_0(j_n x)}{(\widetilde\lambda - j_n^2)J_0''(j_n)^2}\int_0^1
