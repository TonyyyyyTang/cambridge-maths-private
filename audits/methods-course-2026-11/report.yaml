  details: 'Exact quoted step in solution.tex: ''For fixed endpoints the Euler–Lagrange equation is $d(F_{y''})/dx=F_y$.
    With no explicit $x$-dependence, differentiating $F-y''F_{y''}$ gives $y''(F_y-dF_{y''}/dx)=0$.  Here
    $T=k^{-1}\int_0^{\pi/2}\sqrt{r''^2+r^2}\,r^{-2}\,d\theta$, and the circular road takes $\pi/(2ka)$.
    Put $u=1/r>0$. Then $kT=\int\sqrt{u''^2+u^2}\,d\theta$ is precisely the Euclidean length of the curve
    with polar coordinates $(u,\theta)$.''. Every mathematical result agrees with the independent rework
    (Euler–Lagrange equation and Beltrami first integral; $T = \frac{1}{k}\int_0^{\pi/2} \frac{\sqrt{r''^2+r^2}}{r^2}\,d\theta$;
    circular road $\frac{\pi}{2ka}$; optimal road $r(\theta) = a(\cos\theta+\sin\theta) = \sqrt{2}\,a\cos(\theta-\pi/4)$
    verified numerically identical; global minimum $\frac{\sqrt{2}}{ka}$), and the geometric inversion
    argument $u = 1/r$ is mathematically valid and even establishes global minimality. However, for a
    20-mark Section II question, key steps are noticeably skipped: (1) in "Show that a first integral
    of this equation is given by $F - y''\frac{\partial F}{\partial y''} = C$", the solution omits the
    chain/product-rule expansion $F_y y'' + F_{y''} y'''' - y'''' F_{y''} - y''\frac{d}{dx}F_{y''}$ (whose
    cancellation of $F_{y''} y''''$ is the proof) and never states the concluding constant-value identity
    $= C$; (2) in "obtain an integral expression for $T$" and "Calculate $T$ for the circular road $r=a$",
    it does not define $r'' = dr/d\theta$ or show $dt = ds/(kr^2)$, nor show the circular-road integral;
    (3) in the $u=1/r$ argument, it omits the differentiation $u'' = -r''/r^2$ showing $\sqrt{u''^2+u^2}
    = \sqrt{r''^2+r^2}/r^2$, omits limits on the $u$-integral, and does not justify why $u(\cos\theta+\sin\theta)=1/a$
    is admissible (namely $\cos\theta+\sin\theta \ge 1 > 0$ on $[0,\pi/2]$, so $r(\theta)>0$ is single-valued);
    (4) it completely bypasses the Beltrami first integral derived in part 1, contrary to the intended
    Calculus of Variations method and STYLE.md §4.'
  suggested_fix: |-
    For fixed endpoints, the Euler--Lagrange equation for extrema of $I = \int_a^b F(y, y')\,dx$ is
    \[
    \frac{d}{dx}\left(\frac{\partial F}{\partial y'}\right) - \frac{\partial F}{\partial y} = 0.
    \]
    Since $F = F(y, y')$ has no explicit dependence on $x$, the chain and product rules give
    \[
    \begin{aligned}
    \frac{d}{dx}\left(F - y'\frac{\partial F}{\partial y'}\right)
    &= \frac{\partial F}{\partial y}y' + \frac{\partial F}{\partial y'}y'' - y''\frac{\partial F}{\partial y'} - y'\frac{d}{dx}\left(\frac{\partial F}{\partial y'}\right) \\
    &= y'\left[\frac{\partial F}{\partial y} - \frac{d}{dx}\left(\frac{\partial F}{\partial y'}\right)\right] = 0
    \end{aligned}
    \]
    along any extremal. Integrating once yields the first integral $F - y'\frac{\partial F}{\partial y'} = C$ for a constant $C$.

    For a road $r = r(\theta) > 0$ with $r' = dr/d\theta$ joining $A = (a,0)$ to $B = (a,\pi/2)$ ($a > 0$), the arc-length element is $ds = \sqrt{r'^2 + r^2}\,d\theta$ and the speed is $kr^2$, so $dt = ds/(kr^2)$ and the total travel time is
    \[
    T = \frac{1}{k}\int_0^{\pi/2} \frac{\sqrt{r'^2 + r^2}}{r^2}\,d\theta.
    \]
    For the circular road $r(\theta) = a$, we have $r' = 0$, giving
    \[
    T_{\text{circ}} = \frac{1}{k}\int_0^{\pi/2} \frac{a}{a^2}\,d\theta = \frac{\pi}{2ka}.
    \]

    To minimise $T$, note that the integrand $F(r, r') = \frac{\sqrt{r'^2 + r^2}}{kr^2}$ has no explicit $\theta$-dependence, so the first integral gives
    \[
    F - r'\frac{\partial F}{\partial r'} = \frac{\sqrt{r'^2 + r^2}}{kr^2} - \frac{r'^2}{kr^2\sqrt{r'^2 + r^2}} = \frac{1}{k\sqrt{r'^2 + r^2}} = C.
    \]
    Necessarily $C > 0$; setting $R = 1/(kC) > 0$ yields $r'^2 + r^2 = R^2$. Differentiating gives $2r'(r'' + r) = 0$. The constant solution $r \equiv R$ does not satisfy the Euler--Lagrange equation (since $\frac{\partial F}{\partial r} = -\frac{1}{kr^2} \neq 0$ while $\frac{d}{d\theta}\frac{\partial F}{\partial r'} = 0$), so $r'' + r = 0$ and hence $r(\theta) = R\cos(\theta - \theta_0)$. Imposing $r(0) = a$ and $r(\pi/2) = a$ gives $R\cos\theta_0 = a$ and $R\sin\theta_0 = a$; requiring $r(\theta) > 0$ on $[0,\pi/2]$ fixes $\theta_0 = \frac{\pi}{4}$ and $R = \sqrt{2}\,a$. Thus the extremal road is
    \[
    r(\theta) = \sqrt{2}\,a\cos\left(\theta - \frac{\pi}{4}\right) = a(\cos\theta + \sin\theta), \qquad 0 \le \theta \le \frac{\pi}{2}.
    \]
    Along this curve $\sqrt{r'^2 + r^2} = R = \sqrt{2}\,a$, so
    \[
    T_{\min} = \frac{1}{kR}\int_0^{\pi/2} \sec^2\left(\theta - \frac{\pi}{4}\right)d\theta = \frac{1}{k\sqrt{2}\,a}\left[\tan\left(\theta - \frac{\pi}{4}\right)\right]_0^{\pi/2} = \frac{\sqrt{2}}{ka}.
    \]
    To verify that this is the global minimum, substitute $u(\theta) = 1/r(\theta) > 0$; then $u' = -r'/r^2$, so $\sqrt{u'^2 + u^2} = \sqrt{r'^2 + r^2}/r^2$, and $kT = \int_0^{\pi/2}\sqrt{u'^2 + u^2}\,d\theta$ is the Euclidean arc length of the curve with polar coordinates $(u,\theta)$ from Cartesian $(1/a,0)$ to $(0,1/a)$. Its length is at least the straight-line distance $\sqrt{2}/a$, attained uniquely by the segment $u(\cos\theta + \sin\theta) = 1/a$, which has $u(\theta) > 0$ on $[0,\pi/2]$ (as $\cos\theta + \sin\theta \ge 1$) and corresponds to $r(\theta) = a(\cos\theta + \sin\theta)$.
