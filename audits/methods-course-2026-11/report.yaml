    \[
    G_{\mathrm{ext}}(\mathbf{x};\mathbf{x}_0) = \frac{-1}{4\pi|\mathbf{x}-\mathbf{x}_0|} + \frac{a}{|\mathbf{x}_0|}\frac{1}{4\pi|\mathbf{x}-\mathbf{x}_0^*|}, \qquad \mathbf{x}_0^* = \frac{a^2\mathbf{x}_0}{|\mathbf{x}_0|^2}, \qquad (|\mathbf{x}|,|\mathbf{x}_0|>a).
