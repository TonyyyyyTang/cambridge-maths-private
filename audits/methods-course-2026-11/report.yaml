  suggested_fix: |-
    Under an orthogonal coordinate change $x'_i = R_{ip} x_p$ (where $R_{ip}R_{jp} = R_{pi}R_{pj} = \delta_{ij}$), an $n$th-rank Cartesian tensor $T_{ij\cdots k}$ transforms as
    \[
    T'_{ij\cdots k} = R_{ip} R_{jq} \cdots R_{kr} T_{pq\cdots r},
    \]
    with $n$ factors of $R$ and summation over the repeated indices $p, q, \dots, r$.

    A tensor is isotropic if its components are invariant under every orthogonal transformation $R$, i.e. $c'_{ijkl} = c_{ijkl}$. Since $R_{au}R_{bv}\delta_{uv} = R_{au}R_{bu} = \delta_{ab}$ and the scalars $\alpha, \beta, \gamma$ are invariant,
    \[
    \begin{aligned}
    c'_{ijkl} &= R_{ip} R_{jq} R_{kr} R_{ls}(\alpha\delta_{pq}\delta_{rs} + \beta\delta_{pr}\delta_{qs} + \gamma\delta_{ps}\delta_{qr}) \\
    &= \alpha(R_{ip}R_{jq}\delta_{pq})(R_{kr}R_{ls}\delta_{rs}) + \beta(R_{ip}R_{kr}\delta_{pr})(R_{jq}R_{ls}\delta_{qs}) + \gamma(R_{ip}R_{ls}\delta_{ps})(R_{jq}R_{kr}\delta_{qr}) \\
    &= \alpha\delta_{ij}\delta_{kl} + \beta\delta_{ik}\delta_{jl} + \gamma\delta_{il}\delta_{jk} = c_{ijkl}.
    \end{aligned}
    \]
    Hence $c_{ijkl}$ is isotropic for arbitrary scalars $\alpha, \beta, \gamma$.

    Since the medium is isotropic, the fourth-rank elasticity tensor $c_{ijkl}$ is isotropic and therefore takes the general isotropic form $c_{ijkl} = \alpha\delta_{ij}\delta_{kl} + \beta\delta_{ik}\delta_{jl} + \gamma\delta_{il}\delta_{jk}$. Contracting with $e_{kl}$ and using symmetry $e_{ji} = e_{ij}$ gives
    \[
    \sigma_{ij} = c_{ijkl} e_{kl} = \alpha e_{kk}\delta_{ij} + \beta e_{ij} + \gamma e_{ji} = \alpha e_{kk}\delta_{ij} + (\beta + \gamma)e_{ij}.
    \]
    Setting $\lambda = \alpha$ and $\mu = \frac{1}{2}(\beta + \gamma)$ yields $\sigma_{ij} = \lambda e_{kk}\delta_{ij} + 2\mu e_{ij}$.

    If $e_{ij} = p\delta_{ij} + d_{ij}$ with $d_{ii} = 0$, contracting $i$ and $j$ (using $\delta_{ii} = 3$ in $\mathbb{R}^3$) gives $e_{ii} = 3p$, so $p = \frac{1}{3}e_{kk}$ and $d_{ij} = e_{ij} - \frac{1}{3}e_{kk}\delta_{ij}$. Here $p$ is a scalar since $e'_{kk} = R_{kp}R_{kq}e_{pq} = \delta_{pq}e_{pq} = e_{pp}$, $d_{ij}$ is a symmetric second-rank tensor as a linear combination of $e_{ij}$ and $p\delta_{ij}$, and $d_{ii} = e_{ii} - \frac{1}{3}e_{kk}\delta_{ii} = 0$.

    Using $\delta_{ij}\delta_{ij} = 3$ and $d_{ij}\delta_{ij} = d_{ii} = 0$, we obtain
    \[
    e_{ij}e_{ij} = (p\delta_{ij} + d_{ij})(p\delta_{ij} + d_{ij}) = 3p^2 + 2pd_{ii} + d_{ij}d_{ij} = 3p^2 + d_{ij}d_{ij}.
    \]
    Since $e_{kk} = 3p$, the stored elastic energy density is
    \[
    E = \frac{1}{2}\sigma_{ij}e_{ij} = \frac{1}{2}\lambda(e_{kk})^2 + \mu e_{ij}e_{ij} = \frac{9}{2}\lambda p^2 + \mu(3p^2 + d_{ij}d_{ij}) = \frac{3}{2}(3\lambda + 2\mu)p^2 + \mu d_{ij}d_{ij}.
    \]
    Note that $p^2 \ge 0$ and $d_{ij}d_{ij} = \sum_{i,j=1}^3 d_{ij}^2 \ge 0$ for every real symmetric strain tensor.
    \begin{itemize}
    \item \emph{Sufficiency.} If $\mu \ge 0$ and $\lambda \ge -\frac{2}{3}\mu$, then $3\lambda + 2\mu \ge 0$ and $\mu \ge 0$, so $E \ge 0$ for every deformation.
    \item \emph{Necessity.} Suppose $E \ge 0$ for every deformation. Choosing a pure shear strain $e_{12} = e_{21} = 1$ with all other entries $0$ (realised by the displacement $\mathbf{u} = (x_2, x_1, 0)$) gives $p = 0$ and $d_{ij}d_{ij} = 2$, so $E = 2\mu \ge 0 \implies \mu \ge 0$. Choosing a pure isotropic dilation $e_{ij} = \delta_{ij}$ (realised by $\mathbf{u} = \mathbf{x}$) gives $p = 1$ and $d_{ij} = 0$, so $E = \frac{3}{2}(3\lambda + 2\mu) \ge 0 \implies \lambda \ge -\frac{2}{3}\mu$.
    \end{itemize}
