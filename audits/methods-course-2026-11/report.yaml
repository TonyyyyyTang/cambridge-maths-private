    eigenvalue $\frac{2}{3}Ma^2$ along $(1,1,1)^T$, eigenvalue $\frac{11}{3}Ma^2$ on the perpendicular
    plane spanned by $(1,-1,0)^T$ and $(1,1,-2)^T$). The logical skeleton is sound (making this borderline
    with `agree`), but for a 20-mark Section II question it skips calculations a Cambridge IB supervisor
    expects to see: (1) in "show that $I_{ij}(P) = I_{ij}(G) + M(X_k X_k\delta_{ij} - X_i X_j)$", it omits
    writing out the expansion of $(r_k-X_k)(r_k-X_k)\delta_{ij} - (r_i-X_i)(r_j-X_j)$ and the explicit
    centre-of-mass condition $\int r_k\,dm = 0$ and $\int dm = M$; (2) for the cube of uniform density
    and side $2a$, it never computes the integral $\frac{1}{2a}\int_{-a}^a x^2\,dx = a^2/3$ (just asserts
    the average), does not relate $M = 8\rho a^3$ to the uniform density $\rho$, and skips showing $|X|^2
    = 3a^2 \implies \frac{2}{3} + 3 = \frac{11}{3}$; (3) for the eigenproblem, it omits the one-line evaluations
    $I(P)e$ and $I(P)v$ ($e^T v = 0$) and does not explicitly state multiplicities $1$ and $2$.'
  suggested_fix: |-
    Let a mass element $dm$ have position $\mathbf{r}$ (components $x_i$) relative to the centre of mass $G$, so that $\int x_i\,dm = 0$ and $\int dm = M$. Since the vector $GP = \mathbf{X}$ has components $X_i$, the position of $dm$ relative to $P$ is $r'_i = x_i - X_i$. Expanding the definition of $I_{ij}(P)$ gives
    \[
    \begin{aligned}
    I_{ij}(P) &= \int \bigl[(x_k - X_k)(x_k - X_k)\delta_{ij} - (x_i - X_i)(x_j - X_j)\bigr]\,dm \\
    &= \int (x_k x_k \delta_{ij} - x_i x_j)\,dm
      - 2X_k\delta_{ij}\int x_k\,dm + X_j\int x_i\,dm + X_i\int x_j\,dm \\
    &\quad + (X_k X_k\delta_{ij} - X_i X_j)\int dm \\
    &= I_{ij}(G) + M(X_k X_k\delta_{ij} - X_i X_j),
    \end{aligned}
    \]
    where all three linear-in-$x$ integrals vanish by the centre-of-mass condition.

    Take the uniform cube of side $2a$ and constant density $\rho$ to occupy $[-a, a]^3$, with centre of mass at the origin $G = (0,0,0)$ and total mass $M = 8\rho a^3$. For $i \neq j$, the integrand $-x_i x_j$ is odd in $x_i$ on $[-a, a]$, so $I_{ij}(G) = 0$. By symmetry among the three coordinates,
    \[
    \rho \int_{-a}^{a}\int_{-a}^{a}\int_{-a}^{a} x_1^2\,dx_1\,dx_2\,dx_3 = \rho\left[\frac{x_1^3}{3}\right]_{-a}^{a}(2a)^2 = \frac{8}{3}\rho a^5 = \frac{1}{3} M a^2,
    \]
    so $I_{11}(G) = \rho\int_{[-a,a]^3}(x_2^2 + x_3^2)\,dV = \frac{2}{3} M a^2$, and likewise for $I_{22}(G)$ and $I_{33}(G)$. Thus
    \[
    I_{ij}(G) = \frac{2}{3} M a^2 \delta_{ij}.
    \]
    At the corner $P = (a, a, a)$, we have $\mathbf{X} = a\mathbf{e}$ with $\mathbf{e} = (1, 1, 1)^T$, so $X_k X_k = 3a^2$ and $X_i X_j = a^2 e_i e_j$. By the parallel-axis theorem,
    \[
    I_{ij}(P) = \frac{2}{3} M a^2 \delta_{ij} + M(3a^2\delta_{ij} - a^2 e_i e_j) = M a^2\left(\frac{11}{3}\delta_{ij} - e_i e_j\right),
    \]
    or in matrix form
    \[
    I(P) = \frac{M a^2}{3}\begin{pmatrix} 8 & -3 & -3 \\ -3 & 8 & -3 \\ -3 & -3 & 8 \end{pmatrix}.
    \]

    For any vector $\mathbf{v} \in \mathbb{R}^3$, $I(P)\mathbf{v} = Ma^2\left(\frac{11}{3}\mathbf{v} - (\mathbf{e}\cdot\mathbf{v})\mathbf{e}\right)$.
    \begin{itemize}
    \item Along the body diagonal $\mathbf{v} = \mathbf{e} = (1,1,1)^T$, we have $\mathbf{e}\cdot\mathbf{e} = 3$, so $I(P)\mathbf{e} = \left(\frac{11}{3} - 3\right)Ma^2\mathbf{e} = \frac{2}{3}Ma^2\mathbf{e}$. Hence $\lambda_1 = \frac{2}{3}Ma^2$ (multiplicity $1$) with eigenspace spanned by $(1,1,1)^T$.
    \item For any non-zero $\mathbf{v}$ perpendicular to $\mathbf{e}$ (i.e. $v_1 + v_2 + v_3 = 0$), $\mathbf{e}\cdot\mathbf{v} = 0$, so $I(P)\mathbf{v} = \frac{11}{3}Ma^2\mathbf{v}$. Hence $\lambda_2 = \lambda_3 = \frac{11}{3}Ma^2$ (multiplicity $2$) with eigenspace $\{(v_1, v_2, v_3)^T : v_1 + v_2 + v_3 = 0\}$, e.g. spanned by the orthogonal eigenvectors $(1,-1,0)^T$ and $(1,1,-2)^T$.
    \end{itemize}
    Since $1 + 2 = 3$, these orthogonal eigenspaces exhaust $\mathbb{R}^3$.
