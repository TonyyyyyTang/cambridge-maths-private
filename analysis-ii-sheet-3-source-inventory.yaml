numbering_observations:
- editions:
  - 2005-06
  - 2005-06-B
  page: 1
  finding: Both originals number the directional-derivative example 1, the cross-product
    exercise 1, and the next exercise 3. Preserve both printed instances of 1 in their
    original order.
- editions:
  - 2023-24
  page: 1
  finding: The heading explicitly says that question 3 duplicated a question on sheet
    2 and was removed without renumbering the remaining questions.
- editions:
  - 2002-03
  - 2003-04
  page: 1
  finding: For the normalized-vector derivative, 2002 Q6 prints orthogonality to h.
    The following year Q6 prints orthogonality to x. These conclusions require distinct
    exact wordings.
- editions:
  - 2024-25
  page: 1
  finding: The title gives an update date of 15 November 2024, with no printed term.
