      source_finding: The sign of dΦ/dt, ε glyph, motional term, order of the side-flux
        triple product and sign of the hint all agree.
    independent_rework: '# IB/2006/P4/q7G independent rework


      Use consistently oriented $S(t)$ and $C(t)=\partial S(t)$. For small $h>0$ the
      swept side of the tube closed by $S(t+h)-S(t)$ has outward oriented area element
      $d\mathbf r\times\mathbf v\,h$ to first order on $C(t)$. Its flux at time $t$
      is therefore $-h\oint_C \mathbf B\cdot(\mathbf v\times d\mathbf r)+o(h)$, as
      in the hint. Because $\nabla\cdot\mathbf B=0$, the net flux of the frozen field
      through the closed surface is zero. Hence the change from moving the surface
      at fixed field contributes $+\oint_C\mathbf B\cdot(\mathbf v\times d\mathbf
      r)$ per unit time. Varying the field contributes $\int_{S(t)}\partial_t\mathbf
      B\cdot d\mathbf S$. For smooth motions and fields these first-order contributions
      add. By Maxwell–Faraday and Stokes the latter equals $-\oint_C\mathbf E\cdot
      d\mathbf r$. The cyclic triple-product identity gives $\mathbf B\cdot(\mathbf
      v\times d\mathbf r)=-(\mathbf v\times\mathbf B)\cdot d\mathbf r$. Combining
      the two terms gives $d\Phi/dt=-\oint_C(\mathbf E+\mathbf v\times\mathbf B)\cdot
      d\mathbf r=-\varepsilon$. For $\mathbf v=0$ the fixed-surface flux rule follows
      directly.

      '
    main_comparison: The swept boundary ribbon contributes B⋅(v×dr) with the indicated
      orientation. The explicit time derivative uses Maxwell–Faraday and Stokes. The
      triple-product sign gives minus the moving-circuit electromotive force.
