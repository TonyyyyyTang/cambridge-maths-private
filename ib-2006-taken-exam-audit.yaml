      source_finding: The definition uses a finite set, the field is k, and both independence
        and spanning appear with the same wording and emphasis.
    independent_rework: '# IB/2006/P4/q1H independent rework


      Suppose $a_1,\dots,a_m$ are independent and $b_1,\dots,b_n$ span. Starting from
      the spanning list of $b$''s, replace one vector at a time by the next $a_j$.
      After $j-1$ replacements express $a_j$ using the current spanning list. Some
      coefficient of a remaining original $b$ must be nonzero, since otherwise $a_j$
      lies in the span of the preceding $a$''s, contradicting independence. Solving
      that expression for the selected $b$ shows that replacing it with $a_j$ preserves
      spanning. If $m>n$, all $b$''s would be exhausted after $n$ steps and the next
      $a$ would violate independence. Thus $m\le n$. For two bases we can interchange
      their roles and obtain $n\le m$, hence equality. The same argument includes
      an empty spanning list, which spans only zero.

      '
    main_comparison: The coefficient matrix pivot argument and successive exchange
      of spanning vectors both prove that an independent list cannot be longer than
      a spanning list. Applying the inequality in each direction proves equality,
      including dimension zero.
