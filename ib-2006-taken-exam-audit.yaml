      source_finding: Both parts, the term ‘column pivoting’, and all nine signed
        matrix entries match. The phrase for pivot selection has differing conventions,
        so both factorizations are furnished.
    independent_rework: "# IB/2006/P1/q6D independent rework\n\nSearching each active\
      \ **column** for the largest absolute pivot (partial pivoting), swap the first\
      \ two rows. The new pivot is 4. Eliminating with multipliers $1/2,-1/2$ leaves\
      \ active rows $(1/2,1),(5/2,1)$. Interchange these rows and their previously\
      \ recorded multipliers. The final multiplier is $(1/2)/(5/2)=1/5$ and final\
      \ pivot $1-1/5=4/5$. With $P$ taking rows in order $(2,3,1)$, $PA=LU$ where\n\
      \\[\n L=\\begin{pmatrix}1&0&0\\\\-1/2&1&0\\\\1/2&1/5&1\\end{pmatrix},\\qquad\n\
      \ U=\\begin{pmatrix}4&1&0\\\\0&5/2&1\\\\0&0&4/5\\end{pmatrix}.\n\\]\nTheir product\
      \ has rows $(4,1,0),(-2,2,1),(2,1,1)$.\n\nIf the terminology means physically\
      \ permuting **columns**, search the pivot row. The first pivot is 2, and row\
      \ elimination gives trailing rows $(-1,-2),(3,2)$. Swap columns 2 and 3 and\
      \ use multiplier $-1$. With $Q$ interchanging columns 2 and 3,\n\\[\n AQ=\\\
      begin{pmatrix}1&0&0\\\\2&1&0\\\\-1&-1&1\\end{pmatrix}\n \\begin{pmatrix}2&1&1\\\
      \\0&-2&-1\\\\0&0&2\\end{pmatrix}.\n\\]\nFor either convention, invertibility\
      \ persists under the permutation and elimination operations. After a nonzero\
      \ pivot, the determinant of the resulting active block equals that pivot times\
      \ the next trailing determinant, so the trailing block remains invertible. Its\
      \ first column (respectively row) contains a nonzero entry. Induct to the last\
      \ pivot, accumulating swaps and recording multipliers in the relabelled rows.\
      \ For column swaps the previous pivot columns are undisturbed.\n"
    main_comparison: Both row and column permutation conventions have complete verified
      products. Searching down the column gives row order (2,3,1) with pivots 4, 5/2,
      4/5. Permuting columns gives order (1,3,2) with pivots 2, -2, 2. Nonsingularity
      of each active Schur complement proves elimination can continue.
