      source_finding: The Fourier exponential has negative sign and no normalization,
        the tent is defined by convolution, the indicator includes both endpoints,
        and the final integral has exponent four and two infinite limits.
    independent_rework: "# IB/2006/P4/q15D independent rework\n\nTake $f,g\\in L^1(\\\
      mathbb R)$. The integral of $|f(t)g(x-t)|$ over $(t,x)$ equals $\\|f\\|_1\\\
      |g\\|_1$ by Tonelli and translation invariance. Fubini therefore allows interchange\
      \ of the Fourier and convolution integrals. Changing variable $u=x-t$ yields\n\
      \\[\n \\widehat {f*g}(\\lambda)=\\int f(t)e^{-i\\lambda t}dt\\int g(u)e^{-i\\\
      lambda u}du=\\hat f(\\lambda)\\hat g(\\lambda).\n\\]\nFor the unit-width indicator\
      \ the first transform is $2\\sin(\\lambda/2)/\\lambda$, continuously extended\
      \ by 1 at zero. The second is its square. In physical space $f_2(x)$ is the\
      \ overlap length of the two unit intervals, $(1-|x|)_+$. Thus $\\int |f_2|^2=2\\\
      int_0^1(1-x)^2dx=2/3$. Parseval in this convention gives\n\\[\n 2/3=(2\\pi)^{-1}\\\
      int_{\\mathbb R}|\\hat f_2(\\lambda)|^2\\,d\\lambda\n =\\pi^{-1}\\int_{\\mathbb\
      \ R}(\\sin y/y)^4\\,dy,\n\\]\nby $y=\\lambda/2$. The requested value is $2\\\
      pi/3$.\n"
    main_comparison: Absolute integrability justifies rearranging the convolution
      integral. Convolving the box with itself gives the triangular function of squared
      norm 2/3; Parseval and the change of scale give the sinc fourth-power integral
      2π/3.
