auditor_report: '# Independent audit of the 2006 Part IB mathematics sample


  I read the 13 supplied question fragments, their archive locators and the original
  public papers. I visually compared the fragments against the ten distinct printed
  pages (P1 pp. 3 and 7, P2 p. 2, P3 p. 4, P4 pp. 2, 3, 6, 7, 8 and 10). Each source
  record identifies the PDF, page and printed question, hashes the original PDF, question
  fragment and independent rework, and records what was checked.


  All 13 statements matched the printed question bodies. I found zero transcription
  discrepancies in 13. I solved all 13 independently without reading stored solutions,
  commentary or evidence. The coordinator must compare these frozen results with the
  stored derivations before calculating an observed solution-error rate.


  Interpretive details include the incompressibility and force assumptions in P1 5A,
  the two conventions for pivoting in P1 6D, n = 1 in P2 1E, jump orientation in P4
  5G, and the distinction between stationarity and global minimum in P4 16B. The square-root
  iteration gains at least one decimal order in one local step. The brachistochrone
  reaches the free vertical boundary at its first lowest point.

  '
main_resolution: The finite square-root iteration enters the contraction interval
  after its first update. The local quadratic error bound gives a further decimal
  place after one iteration once close enough. Two sharp estimates establish global
  optimality for the half-cycloid even if depth reverses along a competitor. Both
  interpretations of column pivoting give explicit, verifiable triangular factorizations.
  For the spherical transmission problem the sign convention is stated on both sides
  of the interface.
