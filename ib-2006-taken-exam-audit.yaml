      source_finding: The lower-closed unbounded interval, positivity of a and initial
        x, repeated average, and local question about one more decimal digit match.
    independent_rework: '# IB/2006/P4/q13F independent rework


      On a nonempty complete metric space, any self-map $G$ with $d(Gx,Gy)\le c d(x,y)$
      for a single $0\le c<1$ has a unique fixed point $p$ and every forward iteration
      converges to $p$. For $x_{n+1}=Gx_n$ one has $d(x_n,p)\le c^n d(x_0,x_1)/(1-c)$.


      Put $s=\sqrt a$ and $G(x)=(x+s^2/x)/2$ for $x>0$. Then $G(x)-s=(x-s)^2/(2x)\ge0$,
      so every iterate from the first update onward belongs to $[s,\infty)$, a closed
      complete subset of the line. There $0\le G''(x)=(1-s^2/x^2)/2\le1/2$. The mean
      value theorem gives a global contraction with $c=1/2$, and $G(s)=s$. The iteration
      converges for all positive starts.


      For $e_n=x_n-s\ge0$, $e_{n+1}=e_n^2/[2(s+e_n)]$. If $0<e_n\le s/4$ then $e_{n+1}/e_n\le1/10$:
      one step guarantees another decimal order of accuracy. In relative error $r=e_n/s$,
      the next error is $r^2/[2(1+r)]$, so near zero roughly twice as many digits
      are gained in total. At the exact fixed point no further step is needed. The
      uniform factor $1/2$ would give four steps as a coarser, global guarantee.

      '
    main_comparison: AM–GM or direct completion of a square puts the iterates in the
      complete interval after one step. The derivative gives contraction constant
      one half. The exact error recurrence shows one more step gains at least a decimal
      digit once close enough, with quadratic convergence in relative error.
