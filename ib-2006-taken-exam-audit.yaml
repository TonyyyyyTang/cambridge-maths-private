  IB/2006/P4/q16B:
    source_review:
      original_pdf: private/raw/tripos/IB/2006/P4.pdf
      original_pdf_sha256: 09adc26a49e6b0fa1671b8a7637f9eb4e90cc33f60c95a8af5010c67585458e1
      source_page: 8
      printed_label: 16B
      question_packet_sha256: a140611deba990ffad14e74d383336dfb2bf5d2f0d7e42e71f65e965c189bec9
      blind_rework_sha256: b5db3b095b4debb3dfe46e89969b77c10a30fcdcd4eb7c51ee299f9400f3863c
      transcription_discrepancies: []
      source_finding: The unrestricted upper endpoint, printed ϵ, endpoint evaluation,
        Beltrami quantity and bead locations including y(x₀) < 0 agree with the original.
        The question prints F as ‘some functional’.
    independent_rework: "# IB/2006/P4/q16B independent rework\n\nFor an admissible\
      \ variation, $\\eta(a)=0$ and $\\eta(b)$ is arbitrary. Under the differentiability\
      \ assumptions for the first variation, stationarity gives\n\\[\n 0=\\int_a^b(F_y\\\
      eta+F_{y'}\\eta')\\,dx=F_{y'}(b)\\eta(b)+\\int_a^b(F_y-\\tfrac d{dx}F_{y'})\\\
      eta\\,dx .\n\\]\nFirst choose compactly supported test variations to deduce\
      \ the Euler–Lagrange equation by the fundamental lemma. Then prescribe any end\
      \ value of the variation to deduce $F_{y'}(b)=0$. Along a smooth extremal, autonomy\
      \ of $F$ implies $(F-y'F_{y'})'=y'(F_y-(F_{y'})')=0$, giving the first integral.\n\
      \nReflect the horizontal coordinate if needed and set $X=|x_0|>0$, $h=-y$. Energy\
      \ conservation gives speed $\\sqrt{2gh}$, so the time integrand in the right-facing\
      \ coordinate is $F=\\sqrt{1+h'^2}/\\sqrt{2gh}$. The terminal height is free\
      \ at a strictly positive depth, so $F_{h'}(X)=0$ gives $h'(X)=0$. The first\
      \ integral yields\n\\[\n F-h'F_{h'}=[2gh(1+h'^2)]^{-1/2}=\\text{constant},\\\
      quad h(1+h'^2)=2a\n\\]\nwith $2a>0$. Choosing the initial descending branch\
      \ $h=a(1-\\cos\\theta)$ yields $dx/d\\theta=a(1-\\cos\\theta)$ and $x=a(\\theta-\\\
      sin\\theta)$. At the first horizontal tangent $\\theta=\\pi$, so $a=X/\\pi$,\
      \ $y(x_0)=-2X/\\pi$. In original coordinates the wire is $x=\\operatorname{sgn}(x_0)a(\\\
      theta-\\sin\\theta)$, $y=-a(1-\\cos\\theta)$ for $0\\le\\theta\\le\\pi$. The\
      \ initial vertical tangent is allowed by the improper finite travel-time integral.\
      \ Since $dt=\\sqrt{a/g}\\,d\\theta$, its time is $\\sqrt{\\pi X/g}$.\n\nTo check\
      \ global minimality even against a nonmonotone depth, parametrize an admissible\
      \ competitor by travel time $0\\le t\\le T$, and set $u=\\sqrt{2h/g}$. Where\
      \ $h>0$, $\\dot h=gu\\dot u$ and energy gives $|\\dot x|=gu\\sqrt{1-\\dot u^2}$,\
      \ $|\\dot u|\\le1$. The Lipschitz bound extends to the initial zero by continuity,\
      \ with the relation holding almost everywhere (on a zero set the velocity also\
      \ vanishes). Put $I=\\int_0^T\\dot u^2dt$. Since $u(0)=0$, the interval Poincaré\
      \ bound $\\int_0^T u^2dt\\le (2T/\\pi)^2 I$ follows by even reflection about\
      \ $T$ and the Dirichlet Wirtinger inequality on $[0,2T]$. Then Cauchy–Schwarz\
      \ gives\n\\[\n X\\le g\\int_0^T u\\sqrt{1-\\dot u^2}\\,dt\\le(2gT/\\pi)\\sqrt{I(T-I)}\\\
      le gT^2/\\pi.\n\\]\nThus the calculated wire attains the global lower bound.\
      \ Equality imposes the first sine mode for $u$, $I=T/2$ and a constant horizontal\
      \ sign, recovering that half-cycloid. The intended separated endpoints require\
      \ $x_0\\ne0$ for an admissible graph with $y(0)=0$ and $y(x_0)<0$.\n"
    main_comparison: Escalation resolved. The unconstrained terminal height forces
      a horizontal tangent. Both derivations give the first cycloid half-arc, depth
      2|x0|/π, and minimum time sqrt(π|x0|/g) for nonzero horizontal separation. I
      checked the reflected Dirichlet inequality in time and the alternative sharp
      spatial lower bound obtained by integrating through the maximum depth. Each
      is attained by this curve and excludes a shorter competitor with extra turns.
      At zero horizontal separation the stipulated graph endpoint conditions are inconsistent.
