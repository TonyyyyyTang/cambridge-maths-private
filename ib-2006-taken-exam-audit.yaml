      question_packet_sha256: 109316d935be9846c42236a8197f48d726e872b83d1e3c6f1b84bdba013ee3ab
      blind_rework_sha256: ebcfab4c91ffa45726bab5341edaa5bcd70379d726d03cb2891b181a2f0c90b1
      transcription_discrepancies: []
      source_finding: Both regions, finite-valued hypothesis, decay, radial jump,
        continuous trace and bracketed Legendre hint are printed. The paper gives
        the jump without specifying its orientation.
    independent_rework: "# IB/2006/P4/q5G independent rework\n\nUse $[\\partial_r\
      \ f]=\\partial_r f(1^+)-\\partial_r f(1^-)$. Regularity on the polar axis yields\
      \ the Legendre modes $P_\\ell(\\cos\\theta)$ in the usual separated axisymmetric\
      \ expansion. The radial powers are $r^\\ell$ and $r^{-\\ell-1}$, so finiteness\
      \ at zero excludes the second inside and decay excludes the first outside. Thus\
      \ write $\\sum_{\\ell\\ge0}a_\\ell r^\\ell P_\\ell$ inside and $\\sum_{\\ell\\\
      ge0}b_\\ell r^{-\\ell-1}P_\\ell$ outside. Orthogonality and continuity at 1\
      \ give $b_\\ell=a_\\ell$. The derivative difference is $\\sum_{\\ell\\ge0}-(2\\\
      ell+1)a_\\ell P_\\ell$. Using the hint, $A\\sin^2\\theta=(2A/3)(1-P_2)$. Equating\
      \ modes gives $a_0=-2A/3$, $a_2=2A/15$, all others zero. Consequently\n\\[\n\
      \ f_{\\rm in}=-2A/3+(2A/15)r^2P_2(\\cos\\theta),\\qquad\n f_{\\rm out}=-2A/(3r)+(2A/15)r^{-3}P_2(\\\
      cos\\theta).\n\\]\nThe trace at one agrees. Direct subtraction of the two radial\
      \ derivatives gives $2A(1-P_2)/3$ as required. If the derivative jump is defined\
      \ inside minus outside, reverse both signs. Homogeneous transmission data have\
      \ zero coefficients for each mode (including all azimuthal orders by the same\
      \ radial calculation), so the axisymmetric solution is unique with the stated\
      \ regularity.\n"
    main_comparison: Interior regularity and exterior decay select the two radial
      harmonics for each degree. Continuity and the specified derivative jump convention
      select coefficients −2A/3 and 2A/15 for degrees 0 and 2. Reversing the convention
      reverses both coefficients.
