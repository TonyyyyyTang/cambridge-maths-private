    independent_rework: '# IB/2006/P4/q3F independent rework


      If $x=0$, its maximum is zero. Otherwise choose $k$ with $|x_k|=c>0$. Take $N\ge
      k$ so that $|x_i|<c$ for $i>N$ by convergence to zero. The finite maximum among
      the first $N$ coordinates is then the maximum over all coordinates. Thus the
      formula is well defined. It is nonnegative, and vanishes precisely when every
      coordinate vanishes. Pulling $|a|$ out of each coordinate maximum shows absolute
      homogeneity, including $a=0$. For every $i$, $|x_i+y_i|\le |x_i|+|y_i|\le\|x\|+\|y\|$.
      Maximization yields the triangle inequality.


      Distinct unit vectors $e_m,e_n$ have difference with maximum absolute coordinate
      one. Hence the sequence fails the Cauchy condition with threshold $1/2$, and
      so cannot converge in this norm.

      '
    main_comparison: For a nonzero null sequence a finite initial segment attains
      the supremum; the zero sequence is immediate. The coordinatewise triangle inequality
      proves the norm property and the unit coordinate vectors remain pairwise at
      distance one.
