      question_packet_sha256: 1d8d1181c7bffe62244c7135cc21dde7ae9b5adaf9f13e09b84dbaa9fa2a6321
      blind_rework_sha256: cf27d1b7d3586b59fd73c113b14125d50cbaab7c8e3c39c1da7166cabe24aea1
      transcription_discrepancies: []
      source_finding: Both operator hats, the bold position operator and nabla, the
        scalar L-squared, and the order of both commutators match.
    independent_rework: "# IB/2006/P3/q7B independent rework\n\nOn smooth compactly\
      \ supported wavefunctions in position space $\\hat x_j$ multiplies by $x_j$,\
      \ $p_j=-i\\hbar\\partial_j$, and $L=x\\times p=-i\\hbar\\,x\\times\\nabla$,\
      \ with $L^2=\\sum_j L_j^2$. To compute the bracket, set $A_x=y\\partial_z-z\\\
      partial_y$, $A_y=z\\partial_x-x\\partial_z$, $A_z=x\\partial_y-y\\partial_x$.\
      \ In the commutator of these vector fields second derivatives cancel. The coefficients\
      \ of $[A_x,A_y]$ are $A_x(z)-A_y(0)=y$, $A_x(0)-A_y(-z)=-x$, $A_x(-x)-A_y(y)=0$.\
      \ Thus $[A_x,A_y]=-A_z$. Multiplying by $(-i\\hbar)^2$ and cycling gives $[L_i,L_j]=i\\\
      hbar\\sum_k\\varepsilon_{ijk}L_k$, including zero when $i=j$. Finally\n\\[\n\
      \ [L^2,L_i]=\\sum_j \\{L_j[L_j,L_i]+[L_j,L_i]L_j\\}\n =i\\hbar\\sum_{j,k}\\\
      varepsilon_{jik}(L_jL_k+L_kL_j)=0,\n\\]\nbecause the remaining factor is symmetric\
      \ in $j,k$.\n"
    main_comparison: The Cartesian product-rule commutator gives [Lx,Ly]=iℏLz and
      its cyclic permutations. Contraction of the symmetric anticommutator with the
      alternating tensor proves that the angular-momentum square commutes with every
      component.
