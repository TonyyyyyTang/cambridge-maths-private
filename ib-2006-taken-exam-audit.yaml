      question_packet_sha256: 9968619edfc3f4c9902b3ce1e346ba312bbb008415964413e24ff24171f4df1f
      blind_rework_sha256: ca2806ccd5a109d58353d56101cf1039a94779ba43f9e6a0d2df379bdf8030d2
      transcription_discrepancies: []
      source_finding: The displayed material derivative, vorticity stretching term,
        uniform nonzero initial vector, and t > 0 are all printed as transcribed.
        Additional fluid hypotheses for the displayed identity are interpretive.
    independent_rework: '# IB/2006/P1/q5A independent rework


      Assume a smooth homogeneous incompressible flow with conservative body force
      $-\nabla V$ as appropriate for the stated vorticity equation. With $\omega=\nabla\times
      u$, Euler and $(u\cdot\nabla)u=\nabla(|u|^2/2)-u\times\omega$ give $\partial_t\omega=\nabla\times(u\times\omega)$.
      Expanding this curl gives $u\,\nabla\cdot\omega-\omega\,\nabla\cdot u+(\omega\cdot\nabla)u-(u\cdot\nabla)\omega$.
      The first term vanishes by divergence of curl, the second by incompressibility.
      Hence $D\omega/Dt=(\omega\cdot\nabla)u$.


      The left side measures vorticity change following a parcel. The velocity gradient
      along a vortex line stretches it and can tilt it, changing the magnitude and
      direction of vorticity. Along each trajectory $\dot\omega=(\nabla u)\omega$
      is homogeneous linear, so uniqueness propagates zero initial vorticity. In a
      plane flow $u=(u_1(x,y),u_2(x,y),0)$, the vorticity is normal to the plane and
      $\partial_z u=0$, so $D\omega/Dt=0$. Every parcel carries its initial common
      value $\omega_0$ everywhere thereafter. Inviscid motion alone would allow dilatation
      or baroclinic generation without the assumed fluid hypotheses.

      '
    main_comparison: With constant density, incompressibility and conservative forcing,
      curling Euler gives stretching and tilting as the material change of vorticity.
      ODE uniqueness preserves zero initial vorticity. The stretching term vanishes
      for planar flow.
