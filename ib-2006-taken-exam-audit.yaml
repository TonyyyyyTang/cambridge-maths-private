      question_packet_sha256: bb1adfb503b528e1141a92e62c773179534dfd71da3a62657bbcad3fdaac59d1
      blind_rework_sha256: d2060e39620c2bf8d7481d271c0be2f7a97310c0758601aaef6556998b5174b1
      transcription_discrepancies: []
      source_finding: The printed subscript n ≥ 0 occurs three times. The sum begins
        at n = 0, uses the initial-state subscript on probability, and ends at infinity.
        Both requested claims are present.
    independent_rework: '# IB/2006/P1/q19C independent rework


      For the natural filtration $\mathcal F_n=\sigma(X_0,\ldots,X_n)$ a stopping
      time is an extended nonnegative integer $T$ with $\{T\le n\}\in\mathcal F_n$
      for every $n$. For a time-homogeneous chain, on $T<\infty$ the conditional law
      of the future path $(X_{T+k})_{k\ge0}$ given $\mathcal F_T$ is the law of the
      original chain started at $X_T$. Thus, conditional on $X_T$, that path is independent
      of pre-stop information on the finite-stop event.


      Under $\mathbb P_i$, put $T_0=0$ and successively $T_{j+1}=\inf\{n>T_j:X_n=i\}$,
      with value infinity if absent. These are stopping times, since the number of
      visits up through $n$ is determined by the path up through $n$. Write $r=\mathbb
      P_i(T_1<\infty)$. Applying the strong property at $T_j$ on $T_j<\infty$ gives
      $\mathbb P_i(T_{j+1}<\infty)=r\mathbb P_i(T_j<\infty)$, hence $\mathbb P_i(T_j<\infty)=r^j$.
      The decreasing intersection has probability $\lim_j r^j$, equal to zero for
      $0\le r<1$ and one for $r=1$.


      The number $N$ of visits including time zero is both $\sum_{n\ge0}1_{X_n=i}$
      and $\sum_{j\ge0}1_{T_j<\infty}$. By monotone convergence its mean is both the
      sum printed in the question and $\sum_{j\ge0}r^j$. Divergence forces $r=1$ and
      hence infinitely many visits almost surely. Infinite mean alone for a general
      count would not give this conclusion.

      '
    main_comparison: The strong Markov property restarts the chain at each return.
      The probability of at least k returns is the kth power of the first-return probability.
      Equating both sums for expected total visits gives recurrence exactly at divergence.
