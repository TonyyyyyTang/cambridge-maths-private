      source_finding: The printed real vector space, square of the sum, subtraction
        of the sum of squares, and both index limits match.
    independent_rework: '# IB/2006/P2/q1E independent rework


      Over the reals a quadratic form can be diagonalized by a change of basis to
      $p$ squares with coefficient $+1$, $q$ squares with coefficient $-1$, and $z$
      zeros. The triple $(p,q,z)$ is independent of the basis (Sylvester''s law).
      Let $e=(1,\ldots,1)^T$. The given matrix $ee^T-I$ has eigenvalue $n-1$ on $\mathbb
      Re$ and eigenvalue $-1$ on the $(n-1)$-dimensional orthogonal complement. For
      $n\ge2$ the inertia is $(1,n-1,0)$, rank $n$, signed signature $1-(n-1)=2-n$.
      For $n=1$ the quadratic form vanishes, with rank and signature zero (inertia
      $(0,0,1)$). If a zero-dimensional domain is admitted, its empty form likewise
      has rank and signature zero.

      '
    main_comparison: The symmetric matrix acts as n−1 on the constant vector and as
      −1 on its orthogonal complement, giving rank n and signature 2−n when n>1. In
      dimension one the form vanishes.
