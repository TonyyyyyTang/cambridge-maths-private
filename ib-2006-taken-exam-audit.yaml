      source_finding: Both group means and sizes, equality of variances, the two statistics,
        direction μX > μY, and size 1/100 match the print.
    independent_rework: "# IB/2006/P4/q19C independent rework\n\nLet the shared positive\
      \ variance be $\\sigma^2$. The mean is $\\bar X\\sim N(\\mu_X,\\sigma^2/m)$\
      \ and $S_{XX}/\\sigma^2\\sim\\chi^2_{m-1}$ independently. Indeed apply an orthogonal\
      \ transformation to the standardized normal sample with first row $(1,\\ldots,1)/\\\
      sqrt m$. The first standard normal coordinate is $\\sqrt m(\\bar X-\\mu_X)/\\\
      sigma$, while the squared sum of the remaining $m-1$ independent standard normals\
      \ is $S_{XX}/\\sigma^2$. The identical statement holds for the $Y$ sample, independent\
      \ of the entire $X$ sample.\n\nFor $m,n\\ge1$ with $\\nu=m+n-2>0$, the pooled\
      \ estimator is $s_p^2=(S_{XX}+S_{YY})/\\nu$. Independence gives $\\nu s_p^2/\\\
      sigma^2\\sim\\chi^2_\\nu$, independent of the difference of means. Under the\
      \ null, $Z=(\\bar X-\\bar Y)/(\\sigma\\sqrt{1/m+1/n})\\sim N(0,1)$. Therefore\n\
      \\[\n T=\\frac{\\bar X-\\bar Y}{s_p\\sqrt{1/m+1/n}}\n   =\\frac{Z}{\\sqrt{(\\\
      nu s_p^2/\\sigma^2)/\\nu}}\\sim t_\\nu .\n\\]\nCompute $T$ and reject when it\
      \ exceeds the 0.99 quantile of $t_\\nu$ (equivalently, the upper-tail probability\
      \ is below 0.01). Positive differences support the given alternative. The continuity\
      \ of the null law gives exact size $1/100$ for all common means and variances.\
      \ If both groups contain just one observation the pooled variance has zero degrees\
      \ of freedom, outside this test.\n"
    main_comparison: Orthogonal coordinates split the normal sample mean from independent
      residual sums of squares. The pooled variance gives a Student statistic with
      m+n−2 degrees of freedom and an upper one-percent rejection region.
