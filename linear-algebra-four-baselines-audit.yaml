    source_pdf_sha256: 550194903c7475cc8c25648af6b558d516cb7529c5a720bf84113a7d7845463e
    question_sha256: 8f49c8bc317c2b71b6a2659a5b59ccfbf231d4c5edac6b107edb813281ace296
    primary_solution_sha256: dac0c3865c6374cb825b63257bcdb553efcf6d938a8adc79ee1368d57209dd33
    second_solution_sha256: 563931a436044518f0c534d760d690071c344248180baa3ef4c39b59a2641b61
    blind_rework: |
      The real integral is symmetric bilinear, and a nonzero polynomial is nonzero on a subinterval by continuity and finitely many roots, so its square has positive integral. alpha(f)=((1-t^2)f')' has degree <=deg f. Integration by parts gives (g,alpha f)=-int(1-t^2)g'f', symmetric, boundary terms zero. A degree k leading term a t^k is sent to -k(k+1)a t^k plus lower terms, also valid as a coefficient formula for k=0. Thus a degree k eigenvector has lambda_k=-k(k+1). On P_{k-1} the triangular matrix of alpha-lambda_k I has nonzero diagonal lambda_j-lambda_k for j<k; unique lower-degree correction to t^k makes an eigenvector (for k=0 use 1). The kth derivative s_k of (1-t^2)^k has degree k and leading coefficient c_k=(-1)^k(2k)!/k!. For a polynomial h of degree <k integrate (h,s_k) by parts k times, boundary terms vanish as derivatives of orders <k of (1-t^2)^k vanish at both endpoints, and h^{(k)}=0. This proves pairwise orthogonality; distinct degrees with nonzero leading terms form a basis, and P_{k-1} orthogonal complement inside P_k is its line Rs_k. Self-adjointness and preservation of P_{k-1} and P_k imply preservation of that line, hence s_k eigen; k=0 directly. Gram-Schmidt without normalisation yields the unique monic orthogonal polynomial s_k/c_k; with unit norm it is sign(c_k)s_k/||s_k|| since the monic residual has positive leading term.
    comparison: Both source pages and both compiled pages checked. Orthogonality, leading coefficients,
      four requested steps and normalisation signs agree.
