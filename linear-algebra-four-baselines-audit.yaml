      A linear combination vanishes on every common zero. Conversely form F:V->K^n, x |-> (f_i(x)). If ker F is contained in ker g, define h(Fx)=g(x); differences in ker F ensure this is well-defined and it is linear. Extend h from im F to K^n by extending a basis and assigning 0 to extra basis vectors. Then g=hF=sum h(e_i) f_i. This argument uses only finiteness of the given list, hence works in infinite-dimensional V as well, including zero functionals.
