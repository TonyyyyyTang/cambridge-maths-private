source_limits:
- 2015 combined mirror contains the standalone first sheet on pages 1–2, the second on pages 3–4 and the third
  on pages 5–6.
- The copy headed Michaelmas 2006 with copyright 2007 is byte-distinct from the dated 2006 original. Its questions
  match the dated copy; its actual year of teaching remains unresolved.
- Michaelmas 2026 is the printed teaching year despite the retained 2025 copyright.
- None of the printed sheets assigns numerical marks or supplies a question figure.
