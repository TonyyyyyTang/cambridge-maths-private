    independent_rework: '# Independent rework · IB/2007/P3/q7B


      Use the normalized state and the conventional positive mass and oscillator frequency.
      By linearity of the expectation, the difference between E and the stated variance
      expression equals ⟨p⟩²/(2m)+mω²⟨x⟩²/2. Both terms are nonnegative since the
      observables have real means. The arithmetic-geometric mean inequality applied
      to the variance contributions gives E≥ω Δx Δp≥ℏω/2 by Heisenberg''s inequality
      for position and momentum. The inequalities apply whenever these second moments
      exist, including the given finite-energy stationary state. Equality requires
      zero means, Δp=mωΔx and saturation of the uncertainty product.

      '
    main_comparison: Splitting second moments into variances and squared means gives
      the first bound. Arithmetic–geometric mean followed by Heisenberg gives the
      lower energy ℏω/2 for a positive oscillator frequency.
