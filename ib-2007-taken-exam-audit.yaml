      blind_rework_sha256: 0f952c20f91e4a70a2fa51b77d28dc08ed6c2d1dfee3e3e2af0e057a24cdc268
      transcription_discrepancies: []
      source_finding: Confirmed absorbing endpoints, positivity only for interior
        h, initial-state restrictions and the symmetric probability 1/2 in both directions.
    independent_rework: '# Independent rework · IB/2007/P1/q19C


      Set h₀=1 and hᵣ=0. Absorption at 0 means that, even after a history ending at
      0, the event A is exactly equivalent to visiting 0 at or after the current time.
      The same equivalence holds for every history since a visit before the current
      time forces its endpoint to be 0. For a positive-probability history ending
      in i, the Markov property therefore gives conditional probabilities hᵢ for A
      and Pᵢⱼ hⱼ for {Xₙ₊₁=j}∩A. Conditioning on A (assuming its probability is positive)
      divides the latter by the former whenever the history has positive conditional
      probability. This depends only on i, and each row sums to one by the first-step
      formula hᵢ=∑Pᵢⱼ hⱼ. State 0 remains absorbing. State r is impossible after conditioning,
      and can be deleted or given any stochastic row. An original initial law π becomes
      πᵢhᵢ/∑πₖhₖ.


      For the symmetric nearest-neighbour walk let τ denote first absorption at either
      endpoint. It has finite mean since each block of r steps has conditional probability
      at least 2⁻ʳ of absorption if the walk is still in the interior. Harmonicity
      with endpoint values 1 and 0 gives hᵢ=(r−i)/r. Define vᵢ=Eᵢ[τ 1_A]; its boundary
      values are zero. First-step decomposition adds the contribution hᵢ from the
      first transition and the average of the two neighbouring v values. Thus vᵢ₊₁−2vᵢ+vᵢ₋₁=−2hᵢ.
      Set j=r−i. Since the centred second difference of j³ is 6j, vᵢ=(r²j−j³)/(3r)
      satisfies the recurrence and both boundary conditions. Any difference between
      solutions is affine and vanishes at both ends. Divide by hᵢ to obtain the conditional
      mean (r²−(r−i)²)/3=i(2r−i)/3. On A the time τ is precisely first arrival at
      0.

      '
    main_comparison: Conditioning a positive-probability history gives Pᵢⱼhⱼ/hᵢ on
      the reachable states, including absorption at zero. State r has conditioned
      probability zero. The numerator of the conditional mean solves the same inhomogeneous
      second-difference equation in both derivations, giving i(2r−i)/3.
