    independent_rework: '# Independent rework · IB/2007/P4/q13H


      On any nonempty complete metric space (X,d), a self-map T with d(Tx,Ty)≤q d(x,y)
      for a fixed 0≤q<1 has exactly one fixed point. For any x₀, define xₙ₊₁=Txₙ.
      Induction gives d(xₙ,xₙ₊₁)≤qⁿd(x₀,x₁); summing yields d(xₙ,xₘ)≤qⁿd(x₀,x₁)/(1−q)
      for m>n. Thus the iterates are Cauchy and converge to z∈X. Lipschitz continuity
      gives Tz=z. Two fixed points z,w must satisfy (1−q)d(z,w)≤0, so they coincide.


      Choose [a,b]=[−1/2,1/2]. The sup-norm space of continuous functions there is
      complete by the uniform limit theorem and completeness of the scalars. The integral
      maps it into continuously differentiable functions. For either sign of x, the
      absolute integral difference is bounded by 3‖f−g‖∞ times the integral of |t|
      over the interval with endpoints 0 and x. Thus ‖Tf−Tg‖∞≤(3/8)‖f−g‖∞. The unique
      fixed point has y(0)=1 and y′(x)=3xy(x) by the fundamental theorem of calculus.
      Conversely every solution on this interval satisfies the integral equation by
      integration. This proves existence and uniqueness there; direct substitution
      gives y=exp(3x²/2).

      '
    main_comparison: The contraction iteration has a geometric tail; completeness
      gives existence and contraction gives uniqueness. Both orientations of the integral
      give the factor 3x²/2, at most 3/8 on [−1/2,1/2]. Integration and differentiation
      identify the fixed point with the initial-value solution.
