    independent_rework: '# Independent rework · IB/2007/P4/q1G


      Write W* and V* for the complex-linear functionals on W and V. The dual map
      α*:W*→V* is composition on the right with α: (α*ℓ)(v)=ℓ(αv). It is linear in
      ℓ, and ℓ∘α is linear in v. Let αvⱼ=∑ᵢAᵢⱼwᵢ. If vʲ,wⁱ are the respective dual
      bases, then (α*wⁱ)(vⱼ)=wⁱ(αvⱼ)=Aᵢⱼ. Thus α*wⁱ=∑ⱼAᵢⱼvʲ, so its matrix has entry
      Aᵢⱼ in row j, column i. This is the ordinary transpose Aᵀ. No Hermitian inner
      product or conjugation enters the construction.

      '
    main_comparison: Evaluating the dual covectors on the original basis gives the
      ordinary transpose for the algebraic dual over the complex numbers. Both constructions
      reverse the direction of the map.
