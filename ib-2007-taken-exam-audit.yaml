        third derivative sup norm and equality example request.
    independent_rework: '# Independent rework · IB/2007/P4/q8F


      Let Lf=f′(0)−μ(f). Direct substitution on 1,x,x² gives L=0 in all three cases.
      By the order-three Peano representation, Lf=∫₀² f‴(t)K(t)dt, with K(t)=Lₓ[(x−t)₊²/2].
      The derivative at x=0 and the value at x=0 contribute zero for t≥0. Hence K(t)=(2−t)²/4−(1−t)₊².
      This is t−3t²/4 on [0,1] and (2−t)²/4 on [1,2], nonnegative on both. The integral
      of K is 1/4+1/12=1/3. Thus |Lf|≤‖f‴‖∞/3. With f(x)=x³/6 one has f‴=1 everywhere
      and Lf=1/3, so the bound is achieved and c=1/3 is least.

      '
    main_comparison: The derivative error annihilates quadratics. The piecewise quadratic
      Peano kernel is nonnegative on both pieces and integrates to 1/3. The example
      x³/6 attains that bound exactly.
