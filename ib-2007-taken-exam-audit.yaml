auditor_report: '# IB 2007 independent audit rework


  I compared 13 of 13 supplied question statements visually against the original archived
  examination page images, including the figures for P3/8C. The printed bodies, subparts,
  formulas and table entries agree in all 13 cases. Observed transcription discrepancy
  rate in this sample is 0/13. Each source record binds the original PDF, supplied
  question.tex and independent derivation by SHA-256. The table crops have individual
  hashes as well.


  I independently worked every question before any comparison with retained solutions.
  A solution error rate requires the subsequent comparison. No official mark scheme
  was supplied.


  ## Hypotheses and interpretation


  - P1/5D asks for boundedness of the family of streamlines. For equal parameters
  the entire diagonal consists of stationary points, each of which forms a point trajectory.

  - P1/19C requires a positive probability of conditioning. The row at the inaccessible
  state r is undetermined under the conditional law. The finite conditional mean follows
  from a geometric tail bound before conditioning.

  - P2/10G uses linearity in the first slot. P4/1G uses the algebraic dual over the
  complex numbers.

  - P3/17E uses the usual long-cylinder approximation and uniform gap permittivity.
  P3/6E uses regularity of the constraint; the ellipsoid has no singular points. P3/7B
  uses positive mass, frequency and finite second moments.

  - P3/8C specifies no test size or pooling rule. The full-table Pearson statistic
  is 104/27 and the exact conditional upper-tail probability is 0.158589. Pooling
  two and three defects gives a distinct test with an approximate p-value of 0.069
  and changes the 10% decision. Both tests retain the null at 5%. An expected count
  of four motivates stating the calibration.

  - P4/13H requires a nonempty complete metric space and a uniform contraction constant
  strictly below one. P4/15F uses integer n≥0 and the usual half-planes of Laplace
  convergence.

  - P4/16E uses positive endpoint radius and a global length argument for minimality;
  a stationary road alone would not establish a minimum. P4/8F checks the kernel sign
  and exhibits equality to prove optimality.

  '
main_resolution: The two goodness-of-fit tests use different multinomial cells and
  fitted parameters. Direct integer enumeration over all 3169 possible tables conditional
  on 192 defective bulbs gives a full-table upper-tail probability 0.158589, while
  the grouped test gives 0.069 asymptotically. Both fail to reject at 5%. For the
  conditioned absorbing walk the unreachable boundary row is immaterial. The change
  to reciprocal polar radius proves the road globally minimizes travel time.
