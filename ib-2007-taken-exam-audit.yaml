      original_pdf_sha256: 8fca0b212600a4d491d603566f24d7e0c5e20099ce42c4be8ff92d140b493b7f
      question_packet_sha256: 5ffbf28a4f98e3d74e19d5c5a3e1c675be58c4aec7d316da0340097790271a84
      blind_rework_sha256: 0683f907090a89fec93462ade96de4577cc891df2951d3db32bb80841afb943d
      transcription_discrepancies: []
      source_finding: Matched autonomous integrand, sign of the first integral, endpoints,
        speed proportional to the square of r, polar-length hint and both time requests.
    independent_rework: '# Independent rework · IB/2007/P4/q16E


      For a smooth extremal with fixed endpoints the Euler–Lagrange equation is F_y−d(F_{y′})/dx=0.
      Since F has no explicit x dependence, differentiating F−y′F_{y′} along the curve
      gives y′[F_y−d(F_{y′})/dx]=0. Hence F−y′F_{y′} is constant, including at points
      where y′ vanishes.


      Take a>0 and r>0 along a regular piecewise smooth road. Dividing the polar length
      element by the speed gives T=(1/k)∫₀^{π/2} √(r′²+r²)/r² dθ. With r=a this is
      π/(2ka).


      Set ρ=1/r. The integrand of kT becomes √(ρ′²+ρ²). It is the Euclidean speed
      of the planar curve (X,Y)=(ρ cos θ,ρ sin θ), with endpoints (1/a,0) and (0,1/a).
      Every such curve has length at least the endpoint distance √2/a by the triangle
      inequality, and equality holds for the straight segment traversed in one direction.
      The segment X+Y=1/a has ρ=1/[a(cos θ+sin θ)], which is finite and positive throughout
      the angular range. Consequently the attaining road is r=a(cos θ+sin θ), and
      T_min=√2/(ka). This also verifies the global minimum, including against variations
      not near the candidate. Passage through r=0 would have infinite time since |dr|/r²
      has divergent integral there.

      '
    main_comparison: The autonomous Euler–Lagrange integral is constant along an extremal.
      In reciprocal polar radius travel time becomes Euclidean length divided by k.
      The endpoint chord is admissible and gives a global minimum √2/(ka) and r=a(cos
      θ+sin θ).
