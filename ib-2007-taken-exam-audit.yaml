      source_finding: Matched the general level constraint and ellipsoid equation
        with three strictly positive semiaxes.
    independent_rework: '# Independent rework · IB/2007/P3/q6E


      For differentiable f and a smooth constraint g=c with nonzero gradient, the
      gradient of f at a constrained interior extremum annihilates every tangent direction.
      The tangent plane is perpendicular to ∇g, so ∇f=λ∇g. Solve these equations together
      with the constraint and compare candidates, checking singular and boundary points
      separately when present.


      Here the ellipsoid is compact, smooth and without boundary since a,b,c>0, so
      both extrema exist. The equations are y=2λx/a², x=2λy/b², 0=2λz/c². If λ=0,
      then x=y=0 and z=±c. Otherwise z=0 and x,y are nonzero by the constraint. Substitution
      gives 4λ²=a²b² and y=±bx/a with the sign of λ. Thus x=±a/√2, |y|=b/√2. Equal
      coordinate signs give the maximum ab/2 and opposite signs the minimum −ab/2.
      The poles give zero. The bound 2|xy|/(ab)≤x²/a²+y²/b²≤1 independently verifies
      both global extrema.

      '
    main_comparison: The ellipsoid is compact and has regular constraint gradient.
      Zero multiplier yields value zero at its poles. The remaining candidates have
      z=0 and signed products ±ab/2, and comparison gives both global extrema.
