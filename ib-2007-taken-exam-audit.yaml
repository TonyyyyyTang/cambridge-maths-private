      question_packet_sha256: 16bd153f89b8970879a8829aa10477d13a35c78c93272be5c4a004247cda5968
      blind_rework_sha256: a145e31d34384fa2b31e63f24225e0d52b1fefad6d93e40a9e910676e24f4d54
      transcription_discrepancies: []
      source_finding: Matched the three radii, the restriction on λ, the grounded
        conductors, the middle voltage, small-gap limit and extremum request.
    independent_rework: '# Independent rework · IB/2007/P3/q17E


      In the long-cylinder approximation neglect end effects and take the intervening
      material to have uniform permittivity ε (ε₀ in vacuum). Cylindrical symmetry
      and the charge-free field equation give (rφ′)′=0. Matching the endpoint potentials
      determines φ(r)=V log(r/a)/log λ for a≤r≤λa and φ(r)=V log(2a/r)/log(2/λ) for
      λa≤r≤2a.


      The outward normals from the middle conductor on its inner and outer faces are
      −eᵣ and +eᵣ. The surface charges are ε times the outward field, so multiplying
      −φ′ by the signed normal and circumference 2πλa gives a total charge per length
      2πεV[1/log λ+1/log(2/λ)]. Hence C is that coefficient of V. With λ=1+δ, log
      λ∼δ, while log(2/λ)→log 2. Thus C∼2πε/δ: the thin inner gap has the parallel-plate
      capacitance per unit length ε(2πa)/(aδ) to leading order.


      Put u=log λ, L=log 2. Then C=2πε L/[u(L−u)], with 0<u<L. The denominator has
      its unique maximum L²/4 at u=L/2. This gives the unique global minimum 8πε/log
      2 at λ=√2. C diverges at both ends.

      '
    main_comparison: The two radial logarithmic potentials give the sum of the two
      coaxial capacitances. The narrow gap contributes 2πε₀/δ to leading order. The
      product of the complementary log gaps is largest at λ=√2, where capacitance
      has its unique minimum.
