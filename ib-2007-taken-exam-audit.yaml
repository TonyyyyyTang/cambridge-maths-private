      blind_rework_sha256: 9a12e594273da5649785c4968c34c455cae24fe8d2ea2139c09ca1a3f9d77861
      transcription_discrepancies: []
      source_finding: Matched derivative notation, domain and codomain dimensions,
        the two chain rule requests and the qualifier on the partial derivatives.
    independent_rework: '# Independent rework · IB/2007/P1/q11H


      The derivative at p is a linear map A such that f(p+h)=f(p)+Ah+R(h), where R(0)=0
      and ‖R(h)‖/‖h‖→0 as h→0 through nonzero vectors. Such a map is unique by testing
      two proposed maps along h=tv for each v.


      If f is differentiable at p and g at q=f(p), then g∘f is differentiable at p
      with derivative BA, where B=Dg(q). In fact, set k=Ah+R(h). Then k→0 and ‖k‖≤(‖A‖+1)‖h‖
      for small h. Write g(q+k)−g(q)=Bk+S(k). Given ε>0, for small h, ‖S(k)‖≤ε‖k‖
      (including k=0). Subtract BAh from the increment of the composite. The error
      BR(h)+S(k) is o(‖h‖) by the bound on k and continuity of B.


      For x≠0, differentiation of the square root at the strictly positive value ∑xⱼ²
      gives ∂ᵢ‖x‖=xᵢ/‖x‖. At the origin the quotient |t|/t has different one-sided
      limits for every coordinate.

      '
    main_comparison: The increment of the inner map is O(‖h‖), so both remainders
      in the composition are o(‖h‖), including a zero inner increment. The Euclidean
      norm has partials xᵢ/‖x‖ away from zero and fails each two-sided coordinate
      test at zero.
