        both factors evaluated on the unit circle and all three tasks.
    independent_rework: '# Independent rework · IB/2007/P2/q10G


      Write f=∑aₙzⁿ, g=∑bₙzⁿ with finitely supported coefficient sequences. The normalized
      integral of exp(i(n−m)θ) is 1 when m=n and zero otherwise by direct integration
      over the period. Expanding the integrand therefore gives ⟨f,g⟩=∑aₙ conjugate(bₙ).
      This expression is linear in the first argument, conjugate-linear in the second
      and conjugate-symmetric. Its value at (f,f) is a sum of squares, strictly positive
      for a nonzero polynomial. The powers zⁿ for n≥0 span uniquely by definition
      of a polynomial and are orthonormal by the same integral. This is an algebraic
      basis, with finite expansions.


      In d variables evaluate both polynomials at (exp(iθ₁),…,exp(iθ_d)) and integrate
      their product with the second factor conjugated over [0,2π]^d with measure dθ₁⋯dθ_d/(2π)^d.
      For monomials with multi-indices α,β in the nonnegative integer lattice the
      integral factors into the product of Kronecker deltas δ_{αⱼβⱼ}. Consequently
      the monomials give an orthonormal basis, and the coefficient-sum formula proves
      positive definiteness and the Hermitian properties in any finite number of variables.

      '
    main_comparison: The first argument is linear. Integrating the monomials on the
      unit circle gives the Kronecker delta and the squared coefficient norm. Product
      measure on the torus makes the multivariable integrals factor, giving the monomial
      basis.
