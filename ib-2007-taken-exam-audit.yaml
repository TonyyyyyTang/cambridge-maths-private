    independent_rework: '# Independent rework · IB/2007/P3/q8C


      Under the null, packet counts in bins 0,1,2,3 have a multinomial distribution
      on 256 trials with probabilities pⱼ=binom(3,j)θʲ(1−θ)³⁻ʲ. There are 94+2·40+3·6=192
      defective bulbs out of 768. The likelihood as a function of θ is proportional
      to θ¹⁹²(1−θ)⁵⁷⁶ and has its maximum at 1/4. The expected frequencies are 108,108,36,4
      and the observed ones 116,94,40,6. The Pearson statistic is 64/108+196/108+16/36+4/4=104/27.
      With four categories, one total constraint and one fitted parameter its large-sample
      reference law is χ² with two degrees of freedom, giving p≈0.146 (below both
      supplied critical values in statistic units). The unpooled test gives insufficient
      evidence against the null at 5% or 10%.


      The last expectation is only four. An exact calibration for the same statistic
      conditions on the total of 192 defects. Each set of 192 positions has equal
      probability under the null, for any 0<θ<1. For counts (a,b,c,d) of packets with
      0,1,2,3 defects, the weight is [256!/(a!b!c!d!)]3^(b+c)/binom(768,192). This
      counts assignments of packet types and choices of defective positions in each
      type. Enumerate d=0,…,64 and c=0,…,floor((192−3d)/2), with b=192−3d−2c and a=256−b−c−d.
      Summing the weights for Pearson statistics at least 104/27 over this support
      gives p=0.158589 (3169 tables examined; all weights sum to one). This supports
      the same decision without relying on the small cell''s asymptotic approximation.
      The null at θ=0 or 1 cannot produce the observed total.


      Pooling 2 and 3 in advance defines a different legitimate test. For the grouped
      sample (116,94,46), the log likelihood is 536 log(1−θ)+186 log θ+46 log(3−2θ)
      plus a constant. The interior solution of 1536θ²−2630θ+558=0 is 0.248123; strict
      concavity and the divergent negative log terms at the endpoints certify the
      maximum. The expected grouped counts are 108.813,107.726,39.461. The statistic
      3.30734 on one degree of freedom gives p≈0.069. This grouped analysis fails
      to reject at 5% but rejects at 10%. Its difference from the full-table test
      illustrates why the grouping and level should be specified before using the
      data to choose a conclusion.

      '
    main_comparison: The full table has 192 defects among 768 bulbs, giving expected
      counts (108,108,36,4) and Pearson 104/27 on two degrees of freedom. Fitting
      the pooled counts gives 0.248123 and Pearson 3.307 on one degree of freedom.
      Both fail to reject at 5%, with different decisions at 10%. The fresh rework
      independently calibrated the sparse full table conditionally on the defect total
      and obtained 0.158589.
