      source_finding: Matched velocity components and signs, strict positivity of
        both constants and all four subparts including the equality case.
    independent_rework: '# Independent rework · IB/2007/P1/q5D


      The out-of-plane component of curl is ∂ₓuᵧ−∂ᵧuₓ=2β, and the other components
      are zero. The divergence is α−α=0. With the convention u=(ψᵧ,−ψₓ), integrate
      the first component in y, then match the second component, to obtain ψ=αxy−β(x²+y²)/2
      up to a constant. Along every trajectory dψ/dt=0.


      In coordinates s=(x+y)/√2, d=(x−y)/√2, one has 2ψ=(α−β)s²−(α+β)d². For α<β all
      nonzero trajectories lie on bounded ellipses and the origin is stationary. For
      α>β nonzero levels are hyperbolas. To see actual unbounded trajectories, the
      linear velocity matrix squares to (α²−β²)I and has real eigenvalues ±√(α²−β²).
      A nonzero trajectory grows without bound in at least one time direction by its
      expansion in these eigenvectors. For α=β, x−y=c stays constant, and the velocity
      is αc(1,1). For c≠0 each entire line x−y=c is a streamline. All points of x=y
      are individually stationary. Thus boundedness of all streamlines is equivalent
      to α<β; an individual stationary streamline can exist outside that range.

      '
    main_comparison: Rotating the coordinates diagonalizes the stream-function quadratic.
      For α<β the streamlines are bounded ellipses or the stationary origin. At equality
      each point of the diagonal is stationary and every other streamline is an unbounded
      straight line.
