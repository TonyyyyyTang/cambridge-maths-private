      source_finding: Matched all four subparts, poles, powers, ODE derivative orders
        and initial conditions, including the third derivative equal to 1.
    independent_rework: '# Independent rework · IB/2007/P4/q15F


      (i) Assume n is a nonnegative integer. For Re s>0 the integral I₀=1/s; integration
      by parts for n≥1 gives Iₙ=nIₙ₋₁/s since the endpoint terms vanish. Induction
      gives n!/sⁿ⁺¹. Replacing s by s−a in the integral gives n!/(s−a)ⁿ⁺¹ when Re(s−a)>0.


      (ii) For t≥0 start with (2πi)⁻¹ times the upward integral on Re s=γ>0 of eˢᵗ/[s²(s+1)²].
      Close counterclockwise by the left semicircle about γ, radius R. There |eˢᵗ|≤eᵞᵗ
      and the denominator has magnitude bounded below by a constant times R⁴ as R→∞,
      so the closing integral is O(R⁻³). At the double pole 0 the residue is the derivative
      of eˢᵗ/(s+1)² at 0, namely t−2. At −1 it is the derivative of eˢᵗ/s² at −1,
      namely e⁻ᵗ(t+2). The inverse is f(t)=t−2+(t+2)e⁻ᵗ, continuous with f(0)=0.


      (iii) Split F=(1/s²)/(s+1)². The time-domain factors are t and t e⁻ᵗ. Their
      convolution is ∫₀ᵗ (t−u)u e⁻ᵘ du. Integration by parts gives ∫₀ᵗ u e⁻ᵘ du=1−(t+1)e⁻ᵗ
      and ∫₀ᵗu² e⁻ᵘ du=2−(t²+2t+2)e⁻ᵗ. Combining produces the same expression.


      (iv) Write G for the transform of the ODE solution. The given initial values
      give (s⁴G−1)+2s³G+s²G=0. Thus G=F and inversion yields f(t) above. As a direct
      check f′=1−(t+1)e⁻ᵗ, f″=te⁻ᵗ, f‴=(1−t)e⁻ᵗ and f⁽⁴⁾=(t−2)e⁻ᵗ, satisfying the
      equation and the four initial values.

      '
    main_comparison: The two double-pole residues are t−2 and (t+2)exp(−t). The convolution
      and transformed fourth-order initial-value problem give the same inverse, including
      its initial derivatives.
