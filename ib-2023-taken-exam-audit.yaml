      # IB 2023, Paper 2, Question 14A

      (a) For a separated mode $R(r)\Theta(\theta)$ multiply Laplace's equation by $r^2/(R\Theta)$. The radial expression $r(rR')'/R$ equals the angular expression $-\Theta''/\Theta$, hence is a constant $\lambda$. The eigenfunctions of $-\partial_\theta^2$ with $2\pi$-periodicity are the constant ($\lambda=0$) and $\cos n\theta,\sin n\theta$ ($\lambda=n^2$, positive integer $n$). This follows by solving the constant-coefficient ODE: negative eigenvalues give no nonzero periodic exponential mode, the zero-eigenvalue linear term must vanish, and positive frequencies must be integers. Writing $s=\log r$ turns the radial equation into $R_{ss}=\lambda R$. The radial solutions are $1,\log r$ for $\lambda=0$ and $r^n,r^{-n}$ otherwise. Expanding in the angular Fourier basis on each circle and applying the same ODE to each coefficient gives the general expansion
      $$a_0+c_0\log r+\sum_{n\ge1}\left[(a_nr^n+c_nr^{-n})\cos n\theta+(b_nr^n+d_nr^{-n})\sin n\theta\right],$$
      with coefficient choices for which the series represents the solution on the region.

      At the origin, regularity requires $c_0=c_n=d_n=0$ ($n\ge1$ for the indexed modes). For an exterior solution regular at infinity, $c_0=a_n=b_n=0$, with $a_0$ permitted; boundedness of the angular coefficients excludes growing modes. In an annulus avoiding both endpoints there are no such forced zeros. If regularity in an exterior domain is interpreted only at finite points, the restriction at infinity is an additional condition.

      (b)(i) Set $s=\log r\in(0,2)$. The mean boundary values are $-1,+1$, giving the harmonic mean mode $s-1$. The amplitude of the $n$th cosine solves $u_n''=n^2u_n$ with $u_n(0)=u_n(2)=A_n$. Reflection about $s=1$, or direct solution, yields $u_n(s)=A_n\cosh(n(s-1))/\cosh n$. All sine amplitudes have zero endpoints and vanish. Thus
      $$\phi(r,\theta)=\log r-1+\sum_{n\ge1}A_n\frac{\cosh[n(\log r-1)]}{\cosh n}\cos n\theta.$$
      The radial multiplier is 1 on both circles and decays exponentially with $n$ on compact subannuli, giving harmonicity there for ordinary integrable Fourier data. The boundary traces are interpreted wherever the given Fourier expansion represents $f$. For continuous data the Dirichlet solution is unique by the maximum principle.

      (ii) The triangular wave is even under $\theta\mapsto2\pi-\theta$ and has mean zero; it has no sine or constant mode. For $n\ge1$, reflection and integration by parts give
      $$A_n=\frac2\pi\int_0^\pi(\pi/2-\theta)\cos(n\theta)d\theta
      =\frac{2[1-(-1)^n]}{\pi n^2}.$$
      The explicit solution is therefore
      $$\log r-1+\frac4\pi\sum_{j=0}^{\infty}
      \frac{\cosh[(2j+1)(\log r-1)]\cos((2j+1)\theta)}
      {(2j+1)^2\cosh(2j+1)}.$$
      The triangle wave is continuous at $\pi$ and periodically at zero. Its absolutely summable coefficients and the bounded radial multipliers give continuity up to both boundary circles.
