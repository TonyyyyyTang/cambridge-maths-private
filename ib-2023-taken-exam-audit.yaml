      # IB 2023, Paper 3, Question 16C

      (a) Euler's equation for the liquid of constant density $\rho$ is $\partial_t\mathbf u+(\mathbf u\cdot\nabla)\mathbf u=-\nabla p/\rho$. Use $(\mathbf u\cdot\nabla)\mathbf u=\nabla(|\mathbf u|^2/2)-\mathbf u\times(\nabla\times\mathbf u)$ and a velocity potential $\mathbf u=\nabla\phi$ to obtain
      $$\nabla\left(\partial_t\phi+\tfrac12|\nabla\phi|^2+p/\rho\right)=0.$$
      The bracket equals a function of time in the connected liquid, with the additive time-dependent gauge of $\phi$ free. Irrotationality gives a potential locally, and the radial velocity used below has a single-valued potential on the annulus.

      (b)(i) For radial flow, $\nabla\cdot\mathbf u=r^{-1}\partial_r(ru_r)=0$, so $u_r=A(t)/r$ and $\phi=A(t)\log(r/r_*)+C(t)$ for constant $r_*>0$. Both moving interfaces are material, giving $A=a\dot a=b\dot b$. Thus $b(t)=\sqrt{a(t)^2+b(t_*)^2-a(t_*)^2}$. The cross-sectional area $\pi(b^2-a^2)$, hence volume per unit axial length, is constant.

      (ii) At the outer material interface pressure equals $p_\infty$ under the assumed absence of surface tension. Subtract the two Bernoulli equations using the partial time derivative at fixed $r$ before evaluation at either face. This gives
      $$p(a,t)-p_\infty=\rho\left[\dot A\log(b/a)+\tfrac12 A^2(b^{-2}-a^{-2})\right],\qquad \dot A=\dot a^2+a\ddot a.$$

      (iii) Linearise around rest with radii $a_0,b_0$ obeying the same fixed area. For a smooth small-amplitude perturbation $a=a_0(1+\epsilon)$, $b=b_0+(a_0^2/b_0)\epsilon$ to first order. $A=a_0^2\dot\epsilon$ and $\dot A=a_0^2\ddot\epsilon$ to first order. The kinetic term is quadratic, and the first-order correction to the logarithm multiplies another first-order factor. Hence
      $$p(a,t)-p_\infty=\rho a_0^2\log(b_0/a_0)\ddot\epsilon$$
      at linear order.

      (iv) Continuity of pressure gives $p_0(t)=p(a,t)$; at rest its value is $p_\infty$. For a two-dimensional bubble $V$ is proportional to $a^2$ (unit axial length). Thus $p(a,t)=p_\infty a_0^2/a^2=p_\infty(1-2\epsilon)+O(\epsilon^2)$.

      (v) These relations give $\ddot\epsilon+\omega^2\epsilon=0$ with
      $$\omega=\left[\frac{2p_\infty}{\rho a_0^2\log(b_0/a_0)}\right]^{1/2}.$$
      For $p_\infty,\rho>0$ and $0<a_0<b_0$ this is real and positive, so the linear motion is a sum of a sine and cosine. The ordinary frequency is $\omega/(2\pi)$.
