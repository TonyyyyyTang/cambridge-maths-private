      # IB 2023, Paper 2, Question 10G

      Uniform convergence to $f:S\to\mathbb R$ means that for every $\eta>0$ there is $N$ such that $n\ge N$ and $s\in S$ imply $|f_n(s)-f(s)|<\eta$. Uniform continuity of $h:M\to N$ means that for every $\eta>0$ there is $\delta>0$ such that $d_M(x,y)<\delta$ implies $d_N(h(x),h(y))<\eta$ for all $x,y\in M$.

      For $f\in C_0$ choose $R$ so that $|f|<1$ outside the closed ball of radius $R$. On that ball $|f|$ attains a finite maximum by continuity and compactness. Thus $d_\infty(f,g)=\sup_x|f(x)-g(x)|$ is finite. Separation, symmetry and the triangle inequality follow pointwise (and then by taking suprema).

      For a uniformly Cauchy sequence $u_n$, each real sequence $u_n(x)$ is Cauchy, hence has a limit $u(x)$. Given $\eta>0$, choose $N$ so that $\|u_n-u_m\|_\infty<\eta/3$ for all $m,n\ge N$. At each $x$ let $m\to\infty$. This gives $\|u_n-u\|_\infty\le\eta/3$ for every $n\ge N$. At a fixed $x$, continuity of $u_N$ makes $|u_N(y)-u_N(x)|<\eta/3$ when $y$ is close to $x$. The triangle inequality gives $|u(y)-u(x)|<\eta$. Outside a sufficiently large ball $|u_N(y)|<\eta/3$, so $|u(y)|<2\eta/3$. Thus the uniform limit lies in $C_0$, proving completeness.

      Every $f\in C_0$ is uniformly continuous. Choose $R$ such that $|f(x)|<\eta/2$ for $\|x\|>R$. By compactness there is a single $\delta\le1$ giving oscillation $<\eta$ for distances $<\delta$ on the ball of radius $R+1$. If one of $x,y$ is in the ball of radius $R$, the other is in the larger ball. Otherwise both values have magnitude $<\eta/2$. These two cases cover all pairs at distance $<\delta$.

      For fixed $x$, continuity at zero gives $\varepsilon(x/n)\to0$, hence $f_n(x)\to |x|$. Uniform convergence need not hold. With $\varepsilon(t)=t^2$, the error $|x|(\sqrt{1+n^{-2}}-1)$ is unbounded on the real line for every finite $n$. With the additional linear bound, for $x\ne0$,
      $$0\le f_n(x)-|x|=\frac{\varepsilon(x/n)}{f_n(x)+|x|}\le\frac{M}{2n}.$$
      At $x=0$ the error is zero. This proves uniform (and still pointwise) convergence, including $M=0$.
