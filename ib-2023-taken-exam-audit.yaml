    blind_rework_utf8: |
      # IB 2023, Paper 4, Question 5D

      Let $k=1/(4\pi\epsilon_0)$, $r=|\mathbf r|$, $\mu=z/r$, and take zero potential at infinity. By superposition, away from the sources,
      $$\Phi=kQ\left(\frac N r-\frac1{|\mathbf r-d\mathbf e_z|}-\frac M{|\mathbf r+d\mathbf e_z|}\right).$$
      For $r>d$, expand $(1-2\mu u+u^2)^{-1/2}=\sum_{\ell\ge0}P_\ell(\mu)u^\ell$ with $u=\pm d/r$. The first three terms of the potential are
      $$kQ\left[\frac{N-1-M}{r}+\frac{(M-1)d\mu}{r^2}-\frac{(M+1)d^2(3\mu^2-1)}{2r^3}\right].$$
      These are respectively the monopole, dipole and quadrupole. For $\ell\ge1$ the general coefficient is $-kQ[1+M(-1)^\ell]d^\ell P_\ell(\mu)/r^{\ell+1}$.

      The monopole vanishes iff $N=M+1$, the dipole iff $M=1$ (for nonzero $Q,d$), and both iff $(N,M)=(2,1)$. With the monopole cancelled, hold the field point $\mathbf r\ne0$ fixed. If $Qd=D$ is fixed, the limit is $k(M-1)D\mu/r^2$, zero when $M=1$. If $Qd^2=K\ne0$ is fixed, the quadrupole stays finite and terms above it vanish. The dipole now scales as $k(M-1)K\mu/(d r^2)$. For $M\ne1$ no finite field-wide potential limit exists, though on the equatorial plane its dipole term vanishes. For $M=1$ the limit is the pure quadrupole $-kK(3\mu^2-1)/r^3$. The expansion remainder under either scaling tends to zero for fixed $r>0$, by convergence of the generating series near $d/r=0$.

      For $(N,M)=(2,1)$ and $x\ne0$, the transverse field components cancel at $(x,0,0)$. Coulomb's law gives the force on the specified charge,
      $$\mathbf F=2kQ^2 x\left[(x^2+d^2)^{-3/2}-|x|^{-3}\right]\mathbf e_x.$$
      The bracket is strictly negative for $d>0$, so the force points towards the origin for either sign of $x$. At $x=0$ the test particle would coincide with a source.
