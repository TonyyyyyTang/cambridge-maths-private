  frozen_transcription_utf8: |
    # Printed-page comparison for the twelve 2023 Part IB questions

    I compared each complete supplied question body with pixels rendered from its named original Cambridge PDF using pypdfium2 5.8.0 / PDFium 149.0.7825.0 at 1.6 pixels per PDF point. The paper and printed page numbers coincided with the supplied locators throughout. Each entire selected question starts and ends on its single named page. None prints an absolute mark allocation. Excluded page furniture includes the university crest, running paper/page labels, turn-over instructions, and headings for other questions. The number and course heading identify the question separately from its body. Line wrapping, display alignment and line-break hyphenation do not change the words or mathematical content.

    | Original and printed number | Visual comparison with the supplied body |
    |---|---|
    | P2 p6, 10G, Analysis and Topology | Both opening definitions and the arbitrary-set/metric-space qualifiers match. The second paragraph has the Euclidean norm, both strict inequalities and all three boundedness/completeness/continuity requests. The third has the nonnegative range, zero value, square root enclosing both terms, $x/n$, the quantifiers on $M,t$, and all convergence questions. Ends at “Justify your answers.” |
    | P1 p7, 12G, Complex Analysis OR Complex Methods | Parts (a)–(c) match. In particular the leading minus sign, $n=1$ lower limit, $1-z$, open disc, nonnegative-real cut, exponential with $-f(z)$, both open intervals for the argument, real logarithm of the modulus and the strict bounds on $\alpha$ are intact. The integral has numerator $x^\alpha$, denominator $(x+1)^2$, and limits zero and infinity. |
    | P4 p3, 5D, Electromagnetism | The introductory sentence has all three signed charges in their printed order and locations, including the positive-integer qualifiers. All (a)–(c) match, including the vector $\mathbf r$ versus scalar $r$, “and/or”, the two distinct fixed products $Qd,Qd^2$, and the negative test charge on the $x$ axis. |
    | P3 p9, 16C, Fluid Dynamics | The Euler/Bernoulli instruction and all five subparts under (b) match. Checked two-dimensional geometry, $0\le r<a(t)$, the strict liquid inequalities, the two exterior pressure statements, $a_0[1+\epsilon(t)]$, smallness qualifier, $p_0V=const$, and the final $\omega$. |
    | P2 p5, 8F, Linear Algebra | All introductory questions and the commutator derivation agree with the original. The ordering in both nested commutators, the product rule and the polynomial identities match. The last power is $2^k-1$, with only $k$ in the exponent of 2. |
    | P1 p2, 1F, Linear Algebra | All three successive dimension questions match. Checked real finite-dimensional spaces, both orderings of map spaces, the subspace signs for $A,B$ and the images, the intersection-preserving implications encoded by the two separate restrictions in $Y$, $V=S+T$, and both permissions to assume a vector subspace. |
    | P4 p4, 7H, Markov Chains | The printed lead-in, labels (a)–(c), $g(i)=\mathbb E_i[T_0]$ and both starting-state-1 questions match. Also inspected the supplied figure independently against this original: state 0 has a loop of 1, state 1 leads to 0 or 2, state 2 to 1 or 3, and state 3 to 2 or itself, all six nontrivial transitions labeled $1/2$. Arrowheads, loops and state labels agree. The TeX diagram caption describes the image; the original has no printed caption. |
    | P2 p8, 14A, Methods | All polar derivatives and factors $1/r$, $1/r^2$ match, as do both sums, their coefficients/powers, and the constant/logarithm. All three regularity regions and both problems under (b) are present. The cosine series starts at 1, the inner boundary has $f-1$, the outer boundary $f+1$ at $e^2$, and the two half-open triangular-wave intervals have the correct signs/endpoints. |
    | P3 p3, 5A, Methods | Both paragraphs and displays match, including $G(x;\xi)$, the positive delta source, the minus signs in both differential operators, the zero boundary values and decay at infinity, $x,\xi\in(0,\infty)$, and the source $e^{-2x}$. |
    | P4 p4, 6B, Numerical Analysis | The complete weighted inner product and its star identifier agree. The positivity condition uses the open interval, the continuous functions use the closed interval, and the projection formula, its upper and lower limits, last polynomial factor, and both squared norms in (b) match. |
    | P4 p3, 4D, Quantum Mechanics | Both parts agree, including the commutator order $[H,O]$, the factor $i/\hbar$, the explicit time derivative, the complex conjugate on the left of the integral, expectation subscripts, the factor $m$, negative force, and zero energy derivative. The comparison request closes the question. |
    | P4 p13, 17H, Statistics | The fixed nonnegative design, response counts, independent Poisson specification and all parts (a)–(d) match. Verified both estimator subscripts, the direction and values of the two hypotheses, size $0.05$ twice, “sum” versus “each” exposure in the separate normal approximations, and the full bracketed hint with $\mathcal N(\lambda,\lambda)$. |

    No missing word, formula, mathematical condition, part, mark, diagram transition or continuation was identified. These observations concern the supplied statements. The separately frozen derivations were produced without viewing any stored solution, comparison or course review.

