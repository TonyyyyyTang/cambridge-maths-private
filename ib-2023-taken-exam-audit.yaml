      # IB 2023, Paper 4, Question 17H

      Let $S_j=\sum_i x_i^j$ for $j=1,2,3$, and first suppose $S_1>0$, equivalently $S_2>0$. The all-zero design makes all $Y_i=0$ almost surely for every $\theta$, giving no information on the parameter. A zero exposure among otherwise positive exposures contributes a deterministic zero observation under the model.

      (a) Write $Y_i=\theta x_i+e_i$, with independent errors of mean zero and variances $\theta x_i$. The normal equation for minimising $\sum_i(y_i-tx_i)^2$ is $tS_2=\sum_i x_i y_i$. Since $S_2>0$ the minimizer is unique, and nonnegative for the given counts:
      $$\hat\theta_{LS}=\frac{\sum_i x_iY_i}{S_2},\qquad \mathbb E_\theta\hat\theta_{LS}=\theta.$$

      (b) On observations with positive model support, the $\theta$-dependent likelihood is $e^{-\theta S_1}\theta^{T}$, $T=\sum_iY_i$. For $T>0$ differentiation of $T\log\theta-\theta S_1$ gives the unique maximum at $T/S_1$. For $T=0$ the likelihood decreases, giving the endpoint $\theta=0$ on the natural parameter space $\theta\ge0$ (only a limiting supremum on a strictly positive parameter space). Independent Poisson addition gives $T\sim\operatorname{Poisson}(\theta S_1)$. Hence $\hat\theta_{MLE}=T/S_1$ is unbiased.

      (c) Independence and the mean-variance equality give
      $$\operatorname{Var}(\hat\theta_{LS})=\frac{\theta S_3}{S_2^2},\qquad
      \operatorname{Var}(\hat\theta_{MLE})=\frac{\theta}{S_1}.$$
      Cauchy–Schwarz applied to $(x_i^{1/2})_i$ and $(x_i^{3/2})_i$ gives $S_2^2\le S_1S_3$. Thus the MLE has at most the LS variance. For $\theta>0$ equality holds exactly when the positive exposures are all equal (zeros can be present); for $\theta=0$ both variances are zero.

      (d) Under $H_0$, $T$ has Poisson mean $S_1$, so for large $S_1$, $(T-S_1)/\sqrt{S_1}$ is approximately standard normal. Reject in favour of the larger parameter if $\sqrt{S_1}(\hat\theta_{MLE}-1)>z_{0.95}\simeq1.645$. Discrete rounding affects only the approximation to size. Under $H_0$, when each exposure is large, independently approximate $Y_i$ by $N(x_i,x_i)$. The resulting linear combination $\sum_i x_i(Y_i-x_i)$ is approximately $N(0,S_3)$, giving the LS test that rejects when $(S_2/\sqrt{S_3})(\hat\theta_{LS}-1)>z_{0.95}$. Both tests are upper-tailed because increasing $\theta$ increases their expected values.
