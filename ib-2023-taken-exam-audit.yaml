      # IB 2023, Paper 1, Question 12G

      (a) Interior differentiation of the power series gives $f'(z)=\sum_{n\ge1}(1-z)^{n-1}=1/z$. The derivative of $ze^{-f(z)}$ is $e^{-f(z)}(1-zf'(z))=0$. The disc is connected, and $f(1)=0$, so $ze^{-f(z)}=1$ everywhere on it. Thus $e^f=z$.

      For $a$ off the nonnegative real axis choose its argument $\theta_a\in(0,2\pi)$. On $|z-a|<|a|$ put $\ell(z)=\log|a|+i\theta_a+f(z/a)$. It is analytic and $e^{\ell(z)}=a(z/a)=z$. Continuity at $a$, where $\Im\ell=\theta_a$, allows the radius to be shrunk so that $0<\Im\ell<2\pi$ throughout. It may also be shrunk below the distance of $a$ from the cut.

      (b) Taking the modulus and argument of $e^\ell=z$, the real part equals $\log|z|$ and the imaginary part is the unique argument in $(0,2\pi)$. Thus the stated $L$ agrees locally everywhere with an analytic $\ell$, and $e^L=z$. A branch of the power is $e^{\alpha L(z)}$.

      (c) For a positively oriented simple closed piecewise smooth contour, a function analytic on and inside it except at finitely many isolated singularities strictly inside has integral $2\pi i$ times the sum of its enclosed residues. Here use $F(z)=e^{\alpha L(z)}/(1+z)^2$ on a positively oriented slit annulus of radii $\delta<1<R$. Take the radial edges at arguments $\eta$ and $2\pi-\eta$ and let $\eta\downarrow0$ first at fixed radii. Their sum tends to $(1-e^{2\pi i\alpha})\int_\delta^R x^\alpha(1+x)^{-2}dx$ since the upper bank runs outwards. The arc contributions tend to zero as $\delta\downarrow0$ and $R\to\infty$, bounded respectively by $2\pi\delta^{1+\alpha}/(1-\delta)^2$ and $2\pi R^{1+\alpha}/(R-1)^2$. The original integral converges at both ends since $-1<\alpha<1$.

      The double pole at $-1$ has residue $(e^{\alpha L})'(-1)=\alpha e^{i\pi\alpha}/(-1)=-\alpha e^{i\pi\alpha}$. Therefore $(1-e^{2\pi i\alpha})I=-2\pi i\alpha e^{i\pi\alpha}$. For $\alpha\ne0$ use $1-e^{2\pi i\alpha}=-2ie^{i\pi\alpha}\sin(\pi\alpha)$ to get $I=\pi\alpha/\sin(\pi\alpha)$. At $\alpha=0$ integrate $(1+x)^{-2}$ directly to get $1$, the continuous value of this formula.
