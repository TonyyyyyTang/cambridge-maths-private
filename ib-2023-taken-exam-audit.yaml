      # IB 2023, Paper 4, Question 7H

      The diagram has $0\to0$ with certainty; states 1 and 2 each move one place left or right with probability $1/2$ each; from 3 the two possibilities are 2 and 3, equiprobably. Starting from any positive state the probability of absorption within the next three steps is at least $1/8$ by consecutive left moves. Iteration gives $\Pr_i(T_0>3k)\le(7/8)^k$. Thus both the mean absorption times and the expected pre-absorption visit counts below are finite.

      (a) First-step conditioning with $g_0=0$ gives $g_1=1+g_2/2$, $g_2=1+(g_1+g_3)/2$, $g_3=1+(g_2+g_3)/2$. The last equation yields $g_3=g_2+2$, the middle then gives $g_2=g_1+4$, and the first gives
      $$g_1=6,\qquad g_2=10,\qquad g_3=12.$$

      (b) For the probability $h_i$ of hitting 3 before 0, the boundary values are $h_0=0$, $h_3=1$, and $2h_i=h_{i-1}+h_{i+1}$ for $i=1,2$. Its first differences are equal, so $h_i=i/3$ and the requested probability is $1/3$.

      (c) Count every time in state 3, including successive times under its self-loop. Let $v_i$ be the expectation of this count starting from $i$, with $v_0=0$. First-step conditioning gives $v_1=v_2/2$, $v_2=(v_1+v_3)/2$, $v_3=1+(v_2+v_3)/2$, with the reward of one in the last equation counting the present visit. Thus $v_3=v_2+2$, $v_2=v_1+2$, and $v_1=2$. As a check, $v_3=6$ and $h_1v_3=2$ by the strong Markov property at the first visit to 3.
