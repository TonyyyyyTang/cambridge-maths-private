      # IB 2023, Paper 1, Question 1F

      Write $v,w,a,b$ for the corresponding dimensions. Evaluating a linear map on an ordered basis of $V$ defines a linear bijection $\mathcal L(V,W)\to W^v$. Every tuple gives exactly one map by linear extension, so the dimension is $vw$.

      Choose a basis of $A$ and extend it to one of $V$. The $a$ images of the first basis vectors may be chosen freely in $B$; all other $v-a$ images may be chosen freely in $W$. This identifies $X$ linearly with $B^a\times W^{v-a}$ and gives
      $$\dim X=ab+(v-a)w.$$

      Put $I=S\cap T$, $s=\dim S$, $t=\dim T$, and $i=\dim I=s+t-v$ by the dimension formula and $S+T=V$. Extend a basis of $I$ independently to bases of $S$ and $T$. The combined lists (with the common basis taken just once) span $S+T$ and have $i+(s-i)+(t-i)=v$ elements, hence form a basis of $V$. For a member of $Y$, the common basis vectors must land in $I$, the $s-i$ additional vectors from $S$ in $S$, and the $t-i$ additional vectors from $T$ in $T$. Conversely these independent choices suffice by linear extension. Therefore
      $$\dim Y=(s+t-v)^2+(v-t)s+(v-s)t.$$
      The count also allows an empty common or complementary basis. For example $S=T=V$ gives $v^2$, and in a direct sum it gives $s^2+t^2$.
