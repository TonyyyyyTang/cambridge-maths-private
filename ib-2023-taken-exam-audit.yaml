      # IB 2023, Paper 4, Question 4D

      Take the complex Hilbert inner product conjugate-linear in the first slot, and a normalized Schrödinger solution with time derivative and operator products defined on a common suitable domain. For differential operators the self-adjoint Hamiltonian boundary conditions must justify transfer of $H$ in the inner product (for instance smooth rapidly decaying states on the line). Differentiating gives
      $$\frac{d}{dt}\langle\psi,O\psi\rangle
      =\langle\dot\psi,O\psi\rangle+\langle\psi,\partial_tO\,\psi\rangle+\langle\psi,O\dot\psi\rangle.$$
      Substitution of $\dot\psi=-iH\psi/\hbar$ and $\langle H\psi,O\psi\rangle=\langle\psi,HO\psi\rangle$ combines the first and third terms into $(i/\hbar)\langle\psi,(HO-OH)\psi\rangle$, giving the stated theorem.

      For $H=p^2/(2m)+U(x)$ and $p=-i\hbar\,d/dx$, the product rule yields $[p,x]=-i\hbar I$, $[p^2,x]=-2i\hbar p$, and $[U,p]=i\hbar U'$. Multiplication by $x$ commutes with $U$ and $p^2$ commutes with $p$. Neither $x$ nor $p$ depends explicitly on time. Thus
      $$m\frac{d}{dt}\langle x\rangle=\langle p\rangle,\qquad \frac{d}{dt}\langle p\rangle=-\langle U'(x)\rangle.$$
      For $O=H$, the commutator vanishes identically and the scalar potential here has no explicit time dependence, so $d\langle H\rangle/dt=0$.

      Classically $\dot x=p/m$, $\dot p=-U'(x)$ and the energy of a trajectory is conserved for a time-independent Hamiltonian. The quantum formula averages the force; in general $\langle U'(x)\rangle$ need not equal $U'(\langle x\rangle)$. They do agree for affine $U'$, for example in a harmonic potential.
