      # IB 2023, Paper 3, Question 5A

      For $x<\xi$, the homogeneous solution satisfying $G(0;\xi)=0$ is $A\sinh x$. For $x>\xi$, the decaying homogeneous solution is $Be^{-x}$. A discontinuity of $G$ would produce a derivative of the delta in $G''$, so $G$ is continuous. Integrating across $\xi$ gives $G'(\xi+)-G'(\xi-)=1$. Hence
      $$A\sinh\xi=Be^{-\xi},\qquad -Be^{-\xi}-A\cosh\xi=1.$$
      This yields $A=-e^{-\xi}$ and $B=-\sinh\xi$. Equivalently
      $$G(x;\xi)=-\sinh(\min(x,\xi))e^{-\max(x,\xi)}.$$
      It is symmetric and has the required decay. Uniqueness follows since no nonzero homogeneous solution of $u''-u=0$ satisfies both endpoint conditions.

      Integrating against the forcing and splitting at $\xi=x$ gives
      $$y(x)=-e^{-x}\int_0^x\sinh\xi\,e^{-2\xi}d\xi-\sinh x\int_x^\infty e^{-3\xi}d\xi.$$
      The first integral is $\tfrac13-\tfrac12e^{-x}+\tfrac16e^{-3x}$, and the second is $\tfrac13e^{-3x}$. On substitution the terms proportional to $e^{-4x}$ cancel, leaving
      $$y(x)=\tfrac13(e^{-2x}-e^{-x}).$$
      Both endpoint conditions hold. Applying $d^2/dx^2-1$ gives $e^{-2x}$ because the $e^{-x}$ term is homogeneous.
