    blind_rework_utf8: |
      # IB 2023, Paper 4, Question 6B

      In the usual orthogonal polynomial sequence, $\deg Q_k=k$, so $Q_0,\ldots,Q_n$ are a basis of $\mathcal P_n$. Their squared norms $h_k=\langle Q_k,Q_k\rangle$ are strictly positive, since a nonzero polynomial is nonzero on an open subinterval and $w$ is positive there. The question supplies a well-defined real inner product.

      For $p=\sum_{k=0}^n c_kQ_k$, put $b_k=\langle f,Q_k\rangle$. Orthogonality gives
      $$\|f-p\|^2=\|f\|^2-2\sum_k b_kc_k+\sum_k h_kc_k^2
      =\|f\|^2-\sum_k\frac{b_k^2}{h_k}+\sum_k h_k(c_k-b_k/h_k)^2.$$
      The expression has a unique minimum when $c_k=b_k/h_k$ for every $k$. This yields exactly $p_n^*(x)=\sum_{k=0}^n(\langle f,Q_k\rangle/\langle Q_k,Q_k\rangle)Q_k(x)$.

      For every $j\le n$ we have $\langle f-p_n^*,Q_j\rangle=b_j-(b_j/h_j)h_j=0$. By linearity the residual is orthogonal to $p_n^*$, so expanding the square of $f=(f-p_n^*)+p_n^*$ gives $\|f\|^2=\|f-p_n^*\|^2+\|p_n^*\|^2$. This includes $n=0$ and the zero-residual case.
