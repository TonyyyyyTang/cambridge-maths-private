    blind_rework_utf8: |
      # IB 2023, Paper 2, Question 8F

      Use the monic convention $\chi_A(t)=\det(tI-A)$ for an $n$ by $n$ matrix. Cayley–Hamilton states that $\chi_A(A)=0$. For a complex matrix there is a full invariant flag $0=V_0\subset V_1\subset\cdots\subset V_n=\mathbb C^n$. Indeed, a positive-dimensional complex space admits an eigenvector for its endomorphism by the fundamental theorem of algebra. Take this eigenline and induct on the induced endomorphism of its quotient, lifting its invariant flag to the original space. In a basis adapted to the flag, $A$ is upper triangular with diagonal $\lambda_1,\ldots,\lambda_n$, so $\chi_A(t)=\prod_{j=1}^n(t-\lambda_j)$. The operator $A-\lambda_j I$ takes $V_j$ into $V_{j-1}$, since it vanishes on $V_j/V_{j-1}$. Applying the factors in descending index order kills all of $V_n$, proving the theorem.

      Inserting and subtracting $YXZ$ gives $XYZ-YZX=(XY-YX)Z+Y(XZ-ZX)$. Write $C=[B,A]$. Since $CA=AC$, repeated application of the product rule gives, for $j\ge1$,
      $$[B,A^j]=\sum_{s=0}^{j-1}A^s C A^{j-1-s}=jA^{j-1}C.$$
      The constant term commutes as well, so by linearity $[B,\varphi(A)]=\varphi'(A)C$ for all polynomials.

      Let $m_k=2^k-1$. At $k=0$ the stated identity is precisely $f(A)=0$ (take $C^0=I$). Suppose $g(A)C^m=0$ for $g=f^{(k)}$, $m=m_k$. Commuting $B$ with that zero product gives
      $$0=g'(A)C^{m+1}+g(A)[B,C^m].$$
      Multiply on the left by $C^m$. Because $C$ commutes with polynomials in $A$, the second term vanishes by the hypothesis and the first becomes $g'(A)C^{2m+1}$. This proves the next case, since $2m+1=2^{k+1}-1$. No commutation between $B$ and $C$ is required. Taking $f=\chi_A$ and $k=n$ gives $n!C^{2^n-1}=0$. Thus $C$ is nilpotent. The zero-dimensional space is immediate separately.
