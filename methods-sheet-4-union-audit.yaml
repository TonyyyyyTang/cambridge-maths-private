  qx33-b13a97b93020:
    comparison: Axis regularity selects J0, decay selects the vertical exponential,
      and unit weight gives 1/r. The older assertion for arbitrary weights across
      the equatorial plane fails; both the stored answer and auditor provide a decaying-weight
      counterexample.
    fresh_derivation: '# Independent derivation


      For $r=(R^2+z^2)^{1/2}>0$, $g(r)=1/r$ satisfies $g''''+2g''/r=0$, is axisymmetric
      and vanishes at infinity. For an axisymmetric product $A(R)B(z)$ the separated
      equations in either open half-space are

      \[

      A''''+R^{-1}A''+\lambda^2A=0,\qquad B''''-\lambda^2B=0 .

      \]

      The regular radial branch is $J_0(\lambda R)$; the growing exponential is discarded
      at the corresponding end in $z$, yielding $e^{-\lambda|z|}$. Superposition gives

      \[

      I_f(R,z)=\int_0^\infty f(\lambda)e^{-\lambda|z|}J_0(\lambda R)\,d\lambda

      \]

      harmonic on $z>0$ and on $z<0$ if differentiation is justified, for instance
      if $\int_0^\infty(1+\lambda^2)|f(\lambda)|e^{-b\lambda}d\lambda<\infty$ for
      each $b>0$. The axis is regular since the regular modes extend smoothly there.
      Literally arbitrary $f$ can make the integral diverge.


      Requiring equality on $R=0$ and using $J_0(0)=1$ gives $\int_0^\infty f(\lambda)e^{-s\lambda}d\lambda=1/s$
      for $s>0$. The constant weight one does this; equality off the axis still needs
      justification and follows below.


      For a direct proof of the transform, set $s=|z|>0$ and use $J_0(t)=\pi^{-1}\int_0^\pi\cos(t\cos\theta)\,d\theta$
      (equivalently compare the even Taylor coefficients). Absolute integrability
      before interchanging the two integrals follows from $e^{-s\lambda}$. Thus

      \[

      I_1=\frac1\pi\int_0^\pi\frac{s}{s^2+R^2\cos^2\theta}\,d\theta

      =\frac{2s}{\pi}\int_0^\infty \frac{dt}{s^2(1+t^2)+R^2}

      =\frac1{\sqrt{s^2+R^2}},

      \]

      where $t=\tan\theta$ on the half interval. This proves the identity throughout
      both half-spaces and gives the required decay. On $s=0$, $R>0$, ordinary conditional
      convergence follows, for example, from $J_0(v)=\sqrt{2/(\pi v)}\cos(v-\pi/4)+O(v^{-3/2})$
      and Dirichlet''s test. Abel''s theorem identifies the improper integral with
      the limit of its exponentially damped integral, namely $1/R$. The origin is
      excluded.


      Global harmonicity of the arbitrary-weight expression at $z=0$, $R>0$, as suggested
      by this wording, is false. Indeed choose $f=e^{-a\lambda}$, $a>0$. The proved
      transform gives $I_f=[R^2+(a+|z|)^2]^{-1/2}$, which decays at infinity yet has
      normal derivative jump $-2a/(R^2+a^2)^{3/2}$ at the plane. The special weight
      one gives $1/r$ and has no jump away from the origin.

      '
    fresh_sha256: 126c63d62c65641ca45e25f7d80e4312c5fd07d8e40e270eb37e4921fdc9d820
    primary_sha256: 601b2d5e304df88cf161c825a0e67ac6895a3bee5fcc46208ae5b9bced396357
    check_sha256: cb170a30fb8a6bed9b1e4f45bca9dffdd4ad2c65268462cc01cb78cf2a92f2ae
