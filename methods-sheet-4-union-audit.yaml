  q07-d254c1c51b61:
    comparison: Both fix the outward normal and unit positive source convention. Both
      explicitly require the truncating boundary term to vanish on unbounded domains
      and give a zero-trace half-space counterexample without that condition.
    fresh_derivation: '# Independent derivation


      Write $n$ for the outward unit normal. With sufficient regularity of the boundary,
      data and traces, Green''s second identity gives

      \[

      \int_\Omega (u\Delta_x\mathcal G-\mathcal G\Delta u)\,dx

      =\int_{\partial\Omega}(u\,\partial_n\mathcal G-\mathcal G\,\partial_nu)\,dS.

      \]

      The left side is $u(y)$ by the normalization $\Delta_x\mathcal G=\delta_y$.
      On the right $u=f$ and $\mathcal G=0$. Thus the result has a positive sign for
      the stipulated convention.


      For a classical justification, excise a ball of radius $\epsilon$ about $y$.
      The volume term is zero on the punctured domain. The normal to its inner boundary
      points toward $y$, and the fundamental solution has unit flux in the opposite
      direction. Hence the inner contribution of $u\partial_n\mathcal G$ tends to
      $-u(y)$; replacing $u(x)$ by $u(y)$ incurs $O(\epsilon)$ for smooth $u$. The
      term $\mathcal G\partial_nu$ there tends to zero, with size $O(\epsilon)$ for
      $n\ge3$ and $O(\epsilon|\log\epsilon|)$ for $n=2$. In one dimension the same
      unit jump in the first derivative gives the formula directly. Moving the inner
      contribution to the other side gives the stated identity.


      For an unbounded domain there is also a boundary integral over a large truncating
      sphere. One must assume it tends to zero (or impose a solution class ensuring
      that). On the upper half-plane $u(x,y)=y$ is harmonic with zero boundary data
      and a nonzero interior value. The unqualified assertion for an arbitrary unbounded
      domain thus fails.

      '
    fresh_sha256: e2fb3b04b29d839552bd1efdb024f92e1de00708deeebcd1954ede5710e27931
    primary_sha256: 829da766409f932380130d72491dffeeb42f8a78e2b2b7bd9b60bcd53ec47ed9
    check_sha256: ef9e5014e112492799d730d889e9b061505699e39f9c96103f76153cea214246
    check_result: Disk harmonic modes reproduce their interior values; puncture flux
      has sign -1.
