      \[

      K(x,\xi,s)=g_s(x-\xi)-g_s(x+\xi),\qquad

      g_s(r)=(4\pi Ds)^{-1/2}e^{-r^2/(4Ds)},\quad s>0.

      \]

      Propagation of the initial datum and Duhamel''s principle therefore give

      \[

      \theta(x,t)=h(t)+\int_0^\infty K(x,\xi,t)[\Theta(\xi)-h(0)]\,d\xi

      +\int_0^t\!\int_0^\infty K(x,\xi,t-s)[f(\xi,s)-h''(s)]\,d\xi\,ds.

      \]


      An equivalent formula removes $h''$. The $\xi$-integral of $K$ equals $A(x,t)=\operatorname{erf}(x/(2\sqrt{Dt}))$.
      At $x>0$ it has $A(x,0+)=1$ and

      \[

      -\partial_t A(x,t)=B(x,t)=\frac{x}{2\sqrt{\pi D}\,t^{3/2}}e^{-x^2/(4Dt)} .

      \]

      Integrate the $h''$ term by parts. After cancellation the solution is

      \[

      \int_0^\infty K(x,\xi,t)\Theta(\xi)\,d\xi+

      \int_0^t\!\int_0^\infty K(x,\xi,t-s)f(\xi,s)\,d\xi\,ds+

      \int_0^t B(x,t-s)h(s)\,ds .

      \]

      The first formula has trace $h(t)$ since $K(0,\xi,t)=0$; it has initial trace
      $\Theta$ by the Gaussian approximate identity. In the second formula the boundary
      term must be evaluated by $x\downarrow0$, not by pointwise substitution into
      $B$: its mass on $(0,t)$ is $\operatorname{erfc}(x/(2\sqrt{Dt}))\to1$ and its
      mass away from zero tends to zero. For continuous $h$ this gives $h(t)$. Odd
      heat evolution and Duhamel verify the interior PDE, and standard uniqueness
      in the chosen growth class yields the general solution there. If the data disagree
      at the corner, these separate open-edge traces still make sense, but continuity
      at the corner cannot hold.

      '
