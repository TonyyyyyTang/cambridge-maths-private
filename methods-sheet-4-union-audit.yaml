  q11-3f5f1fcd4d51:
    comparison: An impulse initially gives a V/(2c) plateau. The reflected negative
      impulse cancels it on the half-line after the reflected front arrives. Both
      distinguish the unrestricted whole-line displacement.
    fresh_derivation: "# Independent derivation\n\nMeasure transverse displacement\
      \ $u$ relative to the equilibrium string. For constant tension $T$ and linear\
      \ density $\\mu$, set $c=\\sqrt{T/\\mu}>0$. For $t>0$, $u_{tt}=c^2u_{xx}$, with\
      \ zero initial displacement and velocity $g$. Integrating the two characteristic\
      \ waves, or d'Alembert's formula for mollified $g$ followed by a distributional\
      \ limit, gives\n\\[\nu_{\\mathbb R}(x,t)=\\frac1{2c}\\int_{x-ct}^{x+ct}g(s)\\\
      ,ds\n                  =\\frac{V}{2c}H(ct-|x-x_0|).\n\\]\nThus on the full string\
      \ the displacement at a fixed location stays $V/(2c)$ after the direct front\
      \ passes. The initial velocity follows distributionally since, for a smooth\
      \ test function $p$, $\\int_{x_0-ct}^{x_0+ct}p(x)\\,dx/(2ct)\\to p(x_0)$. The\
      \ choice $H(0)=1/2$ corresponds to symmetric mollification; values on wavefronts\
      \ do not affect the weak solution.\n\nOn $x>0$, with $x_0>0$ and the endpoint\
      \ fixed, make the initial data odd. The whole-line velocity becomes $V[\\delta(s-x_0)-\\\
      delta(s+x_0)]$. Its odd solution restricts to\n\\[\nu_+(x,t)=\\frac V{2c}[H(ct-|x-x_0|)-H(ct-x-x_0)],\\\
      qquad x\\ge0.\n\\]\nAt the support of the physical impulse this has the required\
      \ velocity, and the two terms coincide at $x=0$ for every $t$. The solution\
      \ agrees with the free string until the reflected wave arrives at the given\
      \ observer at $t=(x+x_0)/c$. Between direct and reflected arrivals it equals\
      \ $V/(2c)$ and afterward it is zero. Reflection at the fixed end reverses the\
      \ displacement. The first encounter with the endpoint occurs at $t=x_0/c$. Equivalently\
      \ the nonzero interval is $|x_0-ct|<x<x_0+ct$ (excluding the fronts).\n"
    fresh_sha256: 66720102492039ad972da7353755687b49f238340c0c9de7439ecb3629da6746
    primary_sha256: e5761c6240d7de5865f8b0ebd0d9e281cd342887a948d7f2cb328c97183dcab0
    check_sha256: a579c5b168a0b9461589b4439ddb2a82452e3cdb205af8d7b0ede93851e0cb1a
    check_result: Wave equation and distributional initial-data checks passed.
