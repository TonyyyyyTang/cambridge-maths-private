      solution.tex: 829da766409f932380130d72491dffeeb42f8a78e2b2b7bd9b60bcd53ec47ed9
  qx27-7b3c27b658c5:
    comparison: The sine coefficients grow as exp(n²t). Smooth compatible high-frequency
      data establish failure of continuous dependence, and formal series can fail
      to represent a solution.
    fresh_derivation: '# Independent derivation


      For $u=XT$, separation gives $T''/T=-X''''/X=\lambda$ and $X(0)=X(\pi)=0$. Integration
      by parts gives $\lambda\int X^2=\int (X'')^2>0$ for a nonzero real eigenfunction.
      Hence $X$ is a multiple of $\sin(nx)$, with $\sqrt{\lambda}=n$ a positive integer.
      Then $T=e^{n^2t}$ up to a constant. Orthogonality on $(0,\pi)$ fixes the coefficients,
      so the candidate solution is

      \[

      u(x,t)=\sum_{n\ge1}b_n e^{n^2t}\sin(nx),\qquad

      b_n=\frac2\pi\int_0^\pi U(x)\sin(nx)\,dx .

      \]

      This formula is exact for finite sine sums and wherever the series has the required
      convergence. For an $L^2$ solution at positive time the coefficients must be
      square summable even after multiplication by $e^{n^2t}$.


      Fix $t_*>0$. The smooth compatible initial data $U_N=e^{-N^2t_*/2}\sin(Nx)$
      approach zero in the uniform norm and $L^2$ norm (indeed in every fixed finite
      derivative norm). Their exact solutions at $t_*$ have amplitude $e^{N^2t_*/2}$
      and $L^2$ norm $\sqrt{\pi/2}\,e^{N^2t_*/2}$. The zero solution corresponds to
      zero data, so arbitrarily small data perturbations give unbounded changes. Continuous
      dependence fails. Even existence for arbitrary smooth data can fail: coefficients
      $b_n=e^{-n}$ give smooth, compatible data but no square-summable solution coefficients
      at any positive time.

      '
