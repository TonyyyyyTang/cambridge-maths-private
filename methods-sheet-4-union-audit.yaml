  q05-02464f808e97:
    comparison: The positive diffusivity Fourier multiplier contracts the initial-data
      L² norm. The stored argument and auditor also specify a class of forcing for
      existence by Duhamel and boundedness of the time integral.
    fresh_derivation: '# Independent derivation


      Let $\kappa>0$, $g=f_1-f_2$ and $w=u_1-u_2$. The fixed forcing cancels. With
      the Fourier convention $\widehat g(k)=\int e^{-ik\cdot x}g(x)\,dx$, the transformed
      initial-value problem is

      \[

      \partial_t\widehat w=-\kappa |k|^2\widehat w,\qquad

      \widehat w(k,t)=e^{-\kappa |k|^2t}\widehat g(k).

      \]

      Parseval gives $\|w(t)\|_2^2=(2\pi)^{-n}\int e^{-2\kappa|k|^2t}|\widehat g(k)|^2\,dk\le\|g\|_2^2$.
      Thus $C=1$ works for every $t\ge0$. It is optimal at $t=0$ and even at fixed
      $t>0$, by taking a unit-norm transform supported on $|k|<\epsilon$ and letting
      $\epsilon$ tend to zero.


      Write $S(t)$ for this Fourier multiplier. For $f\in L^2$ and, for example, $F\in
      L^1_{\rm loc}([0,\infty);L^2)$, variation of constants gives the mild solution

      \[

      u(t)=S(t)f+\int_0^t S(t-s)F(s)\,ds .

      \]

      The integral exists by the contraction bound. Dominated convergence gives strong
      continuity of $S(t)$; the time integral tends to zero at $t=0$ and is continuous
      by the same bound and dominated convergence. This proves existence with the
      specified initial trace. The difference estimate gives uniqueness and continuous
      dependence in $C([0,T];L^2)$ for fixed forcing. Changing the forcing adds at
      most $\int_0^T\|F_1(s)-F_2(s)\|_2\,ds$. Stronger smoothness assumptions give
      classical solutions. The statement implicitly needs a forward diffusivity and
      an admissible source.

      '
    fresh_sha256: 78bec7764bf1983f467ec104c5c2480f33ead3b759007f7e809ec4a54d873f36
    primary_sha256: c5f48a3683ce1849a9dbe8415004db6be1535f3f09476a55ed79c286fa108162
    check_sha256: 50137a74c365b2b59e04d245a6bc279d9b733fba2fe4b4a6191807d8f6f30e80
    check_result: Forced mode verified; Gaussian data approach the sharp contraction
      constant.
