  q08-4c961b79e82f:
    comparison: The image potential and Fourier multiplier both give the normalized
      Poisson kernel. The four older statements distinguish pointwise vertical decay
      from bounded uniqueness, including a nonzero constant trace in the more extensive
      2018 printing. In the newer printing the stored answer gives the nonzero-mean
      1/y tail, which the auditor also derives.
    fresh_derivation: "# Independent derivation\n\nWrite $u=\\psi$ for the harmonic\
      \ field.\n\n\nWrite the interior observation point as $(x,y)$, the source variable\
      \ as $(\\xi,\\eta)$, and take $\\Delta G=+\\delta$. Reflect the pole across\
      \ the boundary. Since $\\Delta\\log|X|=2\\pi\\delta_0$, the opposite-sign image\
      \ gives\n\\[\nG(\\xi,\\eta;x,y)=\\frac1{4\\pi}\\log\n \\frac{(\\xi-x)^2+(\\\
      eta-y)^2}{(\\xi-x)^2+(\\eta+y)^2}.\n\\]\nIt vanishes at $\\eta=0$ and the reflected\
      \ pole is outside the half-plane. On the boundary, $\\partial_n=-\\partial_\\\
      eta$. Differentiation gives $\\partial_nG=y/\\{\\pi[(\\xi-x)^2+y^2]\\}$. Green's\
      \ identity, with the outer semicircle contribution tending to zero, therefore\
      \ gives $u=P_y*f$, where\n\\[\nP_y(s)=\\frac{y}{\\pi(s^2+y^2)},\\qquad\nu(x,y)=\\\
      int_{\\mathbb R}P_y(x-\\xi)f(\\xi)\\,d\\xi .\n\\]\nFor the convention $-\\Delta\
      \ G=\\delta$, reverse the sign of $G$ and use $-\\partial_nG$ in the representation.\
      \ The kernel has integral one by an arctangent evaluation. Its mass outside\
      \ $|s|<d$ tends to zero for any $d>0$, so convolution recovers bounded boundary\
      \ values at continuity points.\n\nIndependently transform using $\\widehat u(k,y)=\\\
      int e^{-ikx}u(x,y)\\,dx$. The harmonic equation is $\\widehat u_{yy}-k^2\\widehat\
      \ u=0$. In the usual admissible decaying or bounded-transform class, the growing\
      \ mode vanishes for $k\\ne0$, and the boundary trace gives $\\widehat u=\\widehat\
      \ f(k)e^{-|k|y}$. The inverse factor is\n\\[\n\\frac1{2\\pi}\\int_{\\mathbb\
      \ R} e^{iks-|k|y}\\,dk\n=\\frac1\\pi\\Re\\int_0^\\infty e^{-(y-is)k}\\,dk=P_y(s).\n\
      \\]\nThis yields the same convolution. At $k=0$ the transformed ODE allows an\
      \ affine function of $y$; the continuous multiplier has value one there. For\
      \ integrable transforms a single frequency does not alter Fourier inversion.\
      \ A constant spatial mode, if present as an atom, must be handled separately.\n\
      \nFor $a>0$ and the prescribed step, integrate over $[-a,a]$. With principal\
      \ arctangents,\n\\[\nu(x,y)=\\frac{\\psi_0}{\\pi}\\left(\\arctan\\frac{a-x}{y}+\n\
      \                                 \\arctan\\frac{a+x}{y}\\right).\n\\]\nFor\
      \ $\\psi_0>0$ each horizontal profile is even, has a maximum at zero of $2\\\
      psi_0\\arctan(a/y)/\\pi$, and decreases on $x>0$: there the derivative is proportional\
      \ to $y/[(x+a)^2+y^2]-y/[(x-a)^2+y^2]<0$. Small $y$ smooths the two step edges;\
      \ large $y$ gives a broad low hump, asymptotic to $2a\\psi_0y/[\\pi(x^2+y^2)]$\
      \ when $x/y$ stays bounded. Along both edges\n\\[\nu(\\pm a,y)=\\frac{\\psi_0}{\\\
      pi}\\arctan(2a/y),\n\\]\nwhich decreases from $\\psi_0/2$ to zero. The open\
      \ half-plane trace at either jump is the midpoint; the prescribed value at the\
      \ single point does not affect the integral. The signs of all profiles reverse\
      \ for $\\psi_0<0$.\n\nHorizontal sketches of $u/\\psi_0$ at $y/a=0.12$ (1),\
      \ $0.6$ (2) and $2$ (3), with shared pixels marked *.\n\n    1.00 |        \
      \                                           \n    0.91 |                   \
      \ 11111111111                    \n    0.82 |                  11          \
