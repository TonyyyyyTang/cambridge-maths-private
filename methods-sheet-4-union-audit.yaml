  qx32-be45c255879e:
    comparison: The normalized half-space kernel has the required boundary trace.
      Constant data disprove lateral decay under the original hypotheses. Data vanishing
      at infinity give the asserted result.
    fresh_derivation: "# Independent derivation\n\nWrite $X=(x_0,y_0)$, $z=z_0>0$.\
      \ Put $(x,y)=X+zs(\\cos\\alpha,\\sin\\alpha)$ in the printed formula. The area\
      \ element is $z^2s\\,ds\\,d\\alpha$. Thus\n\\[\nu(X,z)=\\frac1{2\\pi}\\int_0^{2\\\
      pi}\\!\\int_0^\\infty\n h(X+zs(\\cos\\alpha,\\sin\\alpha))\\frac{s\\,ds\\,d\\\
      alpha}{(1+s^2)^{3/2}} .\n\\]\nThe weight has mass one because $\\int_0^\\infty\
      \ s(1+s^2)^{-3/2}ds=1$. For fixed $X$ continuity and dominated convergence,\
      \ with bound $\\|h\\|_\\infty$ times the integrable weight, give $u(X,z)\\to\
      \ h(X)$ as $z\\downarrow0$. The same argument permits $X\\to X_*$ simultaneously.\n\
      \nThe lateral boundary condition does **not** follow from boundedness and continuity.\
      \ Taking $h\\equiv1$ yields $u\\equiv1$ for all $X,z$, so the requested decay\
      \ is false. A sufficient additional assumption is $h(X)\\to0$ as $|X|\\to\\\
      infty$. For fixed $z>0$ the integrand then tends to zero for each $s,\\alpha$\
      \ as $|X|\\to\\infty$, and the same dominating function proves the decay. If\
      \ uniformity over all $z>0$ is desired, approximate $h\\in C_0$ uniformly by\
      \ data supported in a disk of radius $M$. The omitted part contributes at most\
      \ its supremum norm. On the disk with $|X|>2M$, the kernel $z/(2\\pi(|X-Y|^2+z^2)^{3/2})$\
      \ is bounded by $1/(2\\pi |X-Y|^2)\\le 2/(\\pi |X|^2)$ uniformly in $z$, so\
      \ the compact part tends uniformly to zero.\n"
    fresh_sha256: e4e6737f1ce295acb7ea6653d42f5efd04d3bf5d10cce3490a68ec290c97d077
