  qx23-758ffe0ce916:
    comparison: Integration by parts gives div(epsilon grad psi)=0 with a constant
      positive permittivity needed for ordinary Laplace. Both distinguish the boundary
      restriction and positive energy variation.
    fresh_derivation: "# Independent derivation\n\nMake any smooth compactly supported\
      \ variation $\\psi_s=\\psi+s\\eta$ in $V$. Such variations also respect a fixed\
      \ Dirichlet boundary potential. The coefficient of $s$ in the energy is\n\\\
      [\n\\delta J=\\int_V\\epsilon\\nabla\\psi\\cdot\\nabla\\eta\\,dV\n        =-\\\
      int_V \\eta\\,\\nabla\\cdot(\\epsilon\\nabla\\psi)\\,dV .\n\\]\nVanishing for\
      \ all $\\eta$ forces $\\nabla\\cdot(\\epsilon\\nabla\\psi)=0$ weakly, and classically\
      \ for sufficiently smooth $\\epsilon,\\psi$. In a homogeneous medium with constant\
      \ $\\epsilon>0$, this is $\\Delta\\psi=0$. For fixed boundary trace the positive\
      \ quadratic remainder $\\frac12s^2\\int_V\\epsilon|\\nabla\\eta|^2dV$ also proves\
      \ minimization. A free boundary would require the additional natural condition\
      \ $\\epsilon\\partial_n\\psi=0$ there.\n\nThe conclusion about Laplace's equation\
      \ requires spatially uniform permittivity (or a special potential for which\
      \ $\\nabla\\epsilon\\cdot\\nabla\\psi=0$). For example on $0<x<1$ take $\\epsilon=1+x$,\
      \ $\\psi=\\log(1+x)$, independent of other coordinates; then $\\epsilon\\psi_x=1$\
      \ but $\\psi_{xx}=-(1+x)^{-2}$. This extremal for its fixed trace is not harmonic.\n"
