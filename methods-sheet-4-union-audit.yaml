  qx20-290f2578d21d:
    comparison: The conserved horizontal optical momentum gives the parabola condition
      and the same square relation for the vertex. Both identify a vertical normal-incidence
      ray when horizontal momentum vanishes.
    fresh_derivation: '# Independent derivation


      Take a nonvertical ray in the $x,y$ plane with $x$ increasing along the chosen
      orientation. Fermat stationarity extremizes travel time. Up to the fixed factor
      $1/c_0$ its integrand is $L=\sqrt{1-ky}\sqrt{1+y''^2}$, positive throughout
      the layer since $kh<1$. Its Beltrami integral is

      \[

      L-y''L_{y''}=\frac{\sqrt{1-ky}}{\sqrt{1+y''^2}}=\sqrt A>0 .

      \]

      The Euler–Lagrange equation, including a point where $y''=0$, is $y''''=-k(1+y''^2)/[2(1-ky)]=-k/(2A)$.
      Integration gives a downward parabola

      \[

      y(x)=y_v-\frac{k}{4A}(x-x_v)^2,\qquad A=1-ky_v

      \]

      (the last identity follows by substitution into the first integral, even if
      the graph only includes a subarc). Rays with zero horizontal slowness have constant
      $x$ and are the exceptional vertical straight rays, which do not join the two
      distinct specified points. In three dimensions horizontal momentum conservation
      confines each nonvertical ray to a vertical plane.


      For zeros of $y$ at $\pm x_0$, the axis of symmetry is their midpoint $x_v=0$,
      and $y_v=y_0$ is the maximum. Substituting $x=x_0$ gives $4(1-ky_0)y_0=kx_0^2$,
      equivalently $(kx_0)^2=4ky_0(1-ky_0)$. The assumed interior turn requires $0<y_0<h$;
      the equation in particular requires $kx_0\le1$.

      '
    fresh_sha256: f59051d094a56f42c269a8b2a1eb48269419e2bd4ff24fc331cc2db8eaaa13d0
