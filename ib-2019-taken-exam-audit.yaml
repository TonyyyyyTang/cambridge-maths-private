  IB/2019/P4/q18C:
    independent_rework: "# P4 / q18C — independent examination rework\n\n## Source\
      \ comparison\n\nThe archived 2019 Paper 4, physical page 10, prints 18C (Fluid\
      \ Dynamics). The introductory equations and prose and all of (a)–(c) match the\
      \ supplied question. I checked the opposite signs of the Coriolis terms, the\
      \ divergence and potential-vorticity signs, the coefficient \\(f^2/(gh)\\),\
      \ both piecewise domains, the condition on \\(v\\) at both infinities, the square\
      \ root over \\(gh\\), and the strict inequality \\(q_1>q_2\\) for the sketches.\
      \ The paper supplies no figure or marks.\n\n## Independent derivation\n\n(a)\
      \ \\(f=2\\Omega\\sin\\lambda>0\\) is the local vertical Coriolis parameter at\
      \ northern latitude \\(\\lambda\\), \\(g\\) is gravitational acceleration, and\
      \ \\(h\\) is the uniform undisturbed depth above a flat impermeable bottom.\
      \ Use a local tangent plane and constant \\(f\\), uniform density, negligible\
      \ viscosity, no external stresses, and hydrostatic pressure under a free surface\
      \ at constant atmospheric pressure. Horizontal scales much longer than the depth\
      \ make vertical acceleration negligible; use the depth-averaged horizontal flow.\
      \ Linearize about rest with \\(|\\eta|\\ll h\\) and small disturbance velocities.\
      \ This omits quadratic advective acceleration and the product \\(\\eta(u,v)\\\
      ) in the depth flux. The horizontal pressure force per unit mass is then \\\
      (-g\\nabla\\eta\\).\n\n(b) Let \\(\\zeta=v_x-u_y\\) and \\(D=u_x+v_y\\). Taking\
      \ \\(x\\)-derivative of the second momentum equation minus \\(y\\)-derivative\
      \ of the first cancels mixed pressure derivatives and gives \\(\\zeta_t=-fD\\\
      ). Continuity gives \\(\\eta_t=-hD\\), hence \\(q_t=\\zeta_t-(f/h)\\eta_t=0\\\
      ) at fixed position. Constancy of \\(f,h\\) enters the cancellation.\n\n(c)\
      \ With no dependence on time or \\(y\\), geostrophic balance gives \\(u=0,\\\
      \ v=(g/f)\\eta'\\). Thus \\(\\zeta=v'=(g/f)\\eta''\\). Substitution into \\\
      (q\\) yields \\(\\eta''-\\eta/R^2=(f/g)q\\), \\(R=\\sqrt{gh}/f\\). On side \\\
      (i\\) a constant particular solution is \\(H_i=-hq_i/f\\). The homogeneous solutions\
      \ are \\(\\exp(\\pm x/R)\\). Since \\(v\\) is proportional to \\(\\eta'\\),\
      \ its decay removes the growing exponential at each end. Write \\(\\eta=H_1+A\
      \ e^{x/R}\\) on the left and \\(H_2+B e^{-x/R}\\) on the right. A step in \\\
      (q\\) has no delta or derivative of delta, so the ODE imposes continuity of\
      \ both \\(\\eta\\) and \\(\\eta'\\) at zero. These give \\(H_1+A=H_2+B\\) and\
      \ \\(A=-B\\), so \\(A=(H_2-H_1)/2=h(q_1-q_2)/(2f)\\). The unique matched fields\
      \ are\n\\[\n\\eta(x)=\\begin{cases}\n-hq_1/f+\\dfrac{h(q_1-q_2)}{2f}e^{x/R},&x\\\
      le0,\\\\\n-hq_2/f-\\dfrac{h(q_1-q_2)}{2f}e^{-x/R},&x\\ge0,\n\\end{cases}\n\\\
      qquad v(x)=\\frac{R(q_1-q_2)}{2}e^{-|x|/R}.\n\\]\nThe two formulas for the height\
      \ agree at zero; a pointwise assignment to \\(q(0)\\) does not change the solution.\
      \ When \\(q_1=q_2\\) they reduce to a constant height and zero velocity.\n\n\
      For \\(q_1>q_2\\), \\(H_1<H_2\\) irrespective of the signs of the \\(q_i\\).\
      \ The height is increasing, convex to the left and concave to the right, with\
      \ a continuous steepest slope at \\(x=0\\) where \\(\\eta=(H_1+H_2)/2\\). The\
      \ velocity is even, positive, has a cusp of height \\(V=R(q_1-q_2)/2\\) at zero,\
      \ and decays on scale \\(R\\) to either side. Qualitative profiles with the\
      \ interface centred are shown below.\n\n~~~text\nheight                    \
      \          velocity\nH2 |                 ______         V |           /\\\n\
      \   |              __/                 |          /  \\\nmid|           __/\
      \                    |        _/    \\_\n   |        __/                   \
      \    |     __/        \\__\nH1 |_______/                        0 |____/   \
      \           \\____\n   +-----------|---------- x          +-----------|-----------\
      \ x\n               0                                  0\n~~~\n\nThe finite\
      \ jump in \\(v'\\) is exactly \\(q_2-q_1\\), since \\(\\eta\\) is continuous.\
      \ This checks both the interface condition and the sign of the jet.\n"
    independent_rework_sha256: 90fa8a050ec92e1e5535c492d28338c663b5cacdc916772be9609b8fa2884d04
