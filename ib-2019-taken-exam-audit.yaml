  IB/2019/P4/q6B:
    independent_rework: '# P4 / q6B — independent examination rework


      ## Source comparison


      Paper 4, physical page 3, printed 6B, Quantum Mechanics. Both lettered parts
      agree with the printed text. I checked the sign of the phase \(+ikx\), the fourth
      root of \(2\alpha/\pi\), the continuity equation, “instantaneous, normalized”
      and the qualifiers on \(\alpha,k\). The page states no domain or boundary conditions
      for (a) and prints no marks.


      ## Independent derivation


      Assume the usual one-dimensional, spinless Schrödinger equation with real scalar
      potential \(V\) and no vector potential. Put \(\rho=\Psi^*\Psi\) and

      \[

      j=\frac{\hbar}{2mi}\big(\Psi^*\partial_x\Psi-\Psi\partial_x\Psi^*\big).

      \]

      Multiply \(i\hbar\Psi_t=-(\hbar^2/2m)\Psi_{xx}+V\Psi\) by \(\Psi^*\) and use
      its conjugate to compute \(\rho_t=(i\hbar/2m)(\Psi^*\Psi_{xx}-\Psi\Psi^*_{xx})=-j_x\).
      The mixed first-derivative terms cancel in the spatial derivative of \(j\).


      For a stationary state \(\Psi=u(x)e^{-iEt/\hbar}\) with real energy, \(\rho_t=0\),
      so \(j\) is constant in \(x\). For a usual bound state on \(\mathbb R\), normalization
      and finite kinetic energy give \(u,u''\in L^2\). Hence \(\int |j|\,dx\le(\hbar/m)\|u\|_2\|u''\|_2<\infty\).
      The sole integrable constant on the line is zero. A no-flux boundary condition
      gives the same conclusion directly. This inference uses the bound-state setting:
      on a periodic ring even a normalized travelling eigenmode can carry constant
      nonzero current. Normalization alone supplies no estimate of \(u''\) for arbitrary
      differentiable functions.


      On the full line a free-particle plane wave \(A e^{i(kx-\hbar k^2t/(2m))}\)
      for \(A\ne0,\ k\ne0\) is stationary in density and has infinite squared norm.
      Its current is \(\hbar k|A|^2/m\).


      At the given instant, \(\partial_x\Psi=(-2\alpha x+ik)\Psi\). Thus

      \[

      \langle p\rangle=\int_{\mathbb R}|\Psi|^2(2i\hbar\alpha x+\hbar k)\,dx=\hbar
      k.

      \]

      The imaginary term integrates to zero by oddness, and the constant integrates
      against the normalized density \((2\alpha/\pi)^{1/2}e^{-2\alpha x^2}\). The
      assumption \(\alpha>0\) ensures integrability; \(k=0\) gives zero.

      '
    independent_rework_sha256: 21cc5a616665313b5abff148d0b820380892e6d8ddc1dad8e8f68792a3c7e190
    comparison: Both proofs derive continuity and use a finite-kinetic-energy domain
      to deduce that a constant bound-state current vanishes on the line. Plane-wave
      current and Gaussian momentum match.
