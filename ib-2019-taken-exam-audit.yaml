  IB/2019/P4/q1F:
    independent_rework: '# P4 / q1F — independent examination rework


      ## Source comparison


      Paper 4, physical page 2, printed 1F, Linear Algebra. Both definitions, all
      sixteen entries, the nonzero real-vector condition and the final three requests
      agree with the page image. The repeated symbols \(aa,bb,cc,dd\) are exactly
      as printed. No marks are shown.


      ## Independent derivation


      For a square matrix an eigenvalue is a scalar \(\lambda\) such that \(Ax=\lambda
      x\) for at least one nonzero \(x\); the eigenspace is the whole kernel of \(A-\lambda
      I\), including zero. Write \(u=(a,b,c,d)^{\mathsf T}\). Multiplication of \(uu^{\mathsf
      T}\) produces the sixteen entries of \(A\), so \(Ax=(u\cdot x)u\). Its image
      lies in \(\mathbb Ru\) and contains \(u\) by applying it to \(u/(u\cdot u)\).
      The assumption \(u\ne0\) makes the denominator strictly positive and the rank
      exactly one.


      The zero eigenspace consists of the three-dimensional hyperplane \(u^\perp\).
      The positive eigenvalue \(a^2+b^2+c^2+d^2\) has eigenline \(\mathbb Ru\); for
      a nonzero eigenvalue any eigenvector lies in the image. The direct sum of this
      line and its perpendicular is all of \(\mathbb R^4\), so these eigenspaces exhaust
      the spectrum and yield an orthogonal eigenbasis. The diagonal matrix in such
      a basis has entries \(\|u\|^2,0,0,0\). This proof allows individual coordinates
      of \(u\) to vanish.

      '
    independent_rework_sha256: 5401088a620229dfc0228196b4d980cf9a7d72ffbc190966f70c74b04d0a1b81
    comparison: The rank-one factorization gives the same nonzero eigenvalue and complementary
      eigenspaces, also with zero individual coordinates.
