  IB/2019/P4/q9H:
    independent_rework: '# P4 / q9H — independent examination rework


      ## Source comparison


      Paper 4, physical page 4, printed 9H, Markov Chains. I checked the definition
      and both lettered parts including their bracketed permissions, the start at
      the origin, the two sums from \(n=0\), and the \(2n\) on the right of (b). All
      agree. No numerical marks appear.


      ## Independent derivation


      Start at \(v\). With \(T_0=0\), let \(T_{j+1}\) be the first visit to \(v\)
      strictly after \(T_j\), or infinity if it does not occur. Recurrence means \(\Pr_v(T_1<\infty)=1\).
      The strong Markov property at each finite \(T_j\) gives the same probability
      for the next return, hence each \(T_j\) is finite almost surely by induction.
      Their countable intersection has probability one, and strict increase gives
      infinitely many visits there. With \(N=\sum_{n\ge0}\mathbf1_{\{X_n=v\}}\), monotone
      convergence yields \(\sum_{n\ge0}p_{vv}(n)=\mathbb E_v N=\infty\). The initial
      visit contributes one.


      At a fixed \(n\), independence of the two walks started at zero gives

      \[

      \Pr(X_n=Y_n)=\sum_{x\in\mathbb Z^2}p_{0x}(n)^2

      =\sum_x p_{0x}(n)p_{x0}(n)=p_{00}(2n)

      \]

      by symmetry and Chapman–Kolmogorov, also true at \(n=0\) by the identity transition.
      Summing these nonnegative probabilities gives \(\mathbb E Z\). Every step flips
      the parity of the sum of coordinates, so \(p_{00}(2n+1)=0\). Therefore the even-time
      sum equals the full return sum of the recurrent walk, infinite by (a). The infinite
      mean is exactly the requested conclusion.

      '
    independent_rework_sha256: 84d9f9215825c461a0b0c53dd55be125b21f24e439c05d44dbbee438554d7b14
    comparison: Both use the return count, symmetry, Chapman–Kolmogorov and parity.
      They infer infinite expected collisions without inferring an almost sure event
      solely from that mean.
