  IB/2019/P4/q5D:
    independent_rework: '# P4 / q5D — independent examination rework


      ## Source comparison


      Paper 4, physical page 3, printed 5D, Methods. The numerator \(-2\epsilon x\),
      denominator \(\pi(\epsilon^2+x^2)^2\), limits of integration, test-function
      conditions and request for a generalized function agree with the source image.
      In particular the print says \(\epsilon\to0\) with no plus superscript or positivity
      stipulation. No marks are printed.


      ## Independent derivation


      Let \(P_a(x)=a/[\pi(a^2+x^2)]\) for \(a>0\). Its integral is one by the arctangent
      antiderivative, and \(g_a=P_a''\). On compactly supported smooth test functions
      (or Schwartz tests) integration by parts gives

      \[

      \langle g_a,\phi\rangle=-\int_{\mathbb R}\frac{\phi''(ay)}{\pi(1+y^2)}\,dy\longrightarrow-\phi''(0).

      \]

      Dominated convergence applies since the derivative of the test is bounded and
      the Cauchy weight is integrable. This is \(\langle\delta'',\phi\rangle\).


      The same limit holds under the printed smoothness and boundedness without needing
      a global bound on \(\phi''\). Subtract \(\phi(0)\) under the original integral
      using oddness of \(g_a\), and set \(x=ay\). Then

      \[

      \langle g_a,\phi\rangle=-\frac2\pi\int_{\mathbb R}

      \frac{y^2}{(1+y^2)^2}

      \frac{\phi(ay)-\phi(0)}{ay}\,dy.

      \]

      The difference quotient extends continuously at zero and stays bounded on the
      whole real line by boundedness of \(\phi\) outside a neighborhood of zero. The
      weight has integral \(\pi/2\) (substitute \(y=\tan s\)). This proves the limit
      by the same theorem.


      For \(\epsilon<0\), \(g_{\epsilon}=-g_{|\epsilon|}\), so the negative-side limit
      is \(-\delta''\). A test such as \(\phi(x)=xe^{-x^2}\) distinguishes the sides.
      Consequently the usual positive-width convention gives \(\delta''\), while the
      literal two-sided limit does not exist. The pointwise zero limit cannot be substituted
      in the integral.

      '
