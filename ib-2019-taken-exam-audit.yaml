  IB/2019/P4/q10F:
    independent_rework: '# P4 / q10F — independent examination rework


      ## Source comparison


      Paper 4, physical page 5, printed 10F, Linear Algebra. The isomorphism, bracketed
      instruction, adjoint with the two orthonormal bases, image identity and least-squares
      paragraphs match the page. I compared the final \(3\times2\) matrix row by row
      and the right-hand side \(1,2,3\). No per-part marks are printed.


      ## Independent derivation


      Over the reals, \(\phi(u)=0\) implies \(0=\phi(u)(u)=\|u\|^2\). Thus the given
      linear map is injective. A finite basis and its dual show \(\dim U=\dim U^*\),
      so it is also onto, including in dimension zero.


      The adjoint is the linear map \(W\to V\) characterized by \(\langle\alpha v,w\rangle_W=\langle
      v,\alpha^*w\rangle_V\). With the finite orthonormal bases specified, the representing
      vector in \(V\) exists uniquely by the isomorphism just proved, applied to the
      functional \(v\mapsto\langle\alpha v,w\rangle_W\). The uniqueness also gives
      linearity in \(w\). The entry in row \(i\), column \(j\) of the adjoint is \(\langle
      e_i,\alpha^*f_j\rangle=\langle\alpha e_i,f_j\rangle=A_{ji}\), giving \(A^{\mathsf
      T}\) over the reals (the conjugate transpose in complex orthonormal coordinates).


      A vector \(w\) annihilates the image orthogonally iff \(\langle v,\alpha^*w\rangle=0\)
      for all \(v\), equivalently \(\alpha^*w=0\). Taking perpendicular complements
      gives the printed image identity since a subspace of the finite-dimensional
      \(W\) is its own double orthogonal complement.


      Put \(r=\alpha v_0-w_0\). For \(v=v_0+th\) the squared residual is \(\|r\|^2+2t\langle
      r,\alpha h\rangle+t^2\|\alpha h\|^2\). A minimum requires vanishing of the linear
      coefficient for every \(h\), and that condition suffices by the nonnegative
      last term. This is precisely \(\alpha^*(\alpha v_0-w_0)=0\), whether or not
      \(\alpha\) has a nontrivial kernel. Orthogonal projection of \(w_0\) onto the
      image ensures existence.


      Here \(A^{\mathsf T}A=\left(\begin{smallmatrix}2&1\\1&2\end{smallmatrix}\right)\)
      and \(A^{\mathsf T}w_0=(3,5)^{\mathsf T}\). Solving gives \(x=1/3,\ y=7/3\),
      unique since the determinant is 3. The residual \((-2/3,2/3,-2/3)\) is perpendicular
      to each column, checking the normal equations.

      '
    independent_rework_sha256: b1ef2162361af5e66141a3a168aa5d73673d9b726f36fcf5f36cabde431d6350
    comparison: Duality, finite-dimensional range orthogonality, normal equations
      and the minimizer (1/3,7/3) match the independent proof.
