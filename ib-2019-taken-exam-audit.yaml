  IB/2019/P3/q12E:
    independent_rework: '# P3 / q12E — independent examination rework


      ## Source comparison


      Paper 3, physical page 6, printed 12E, Analysis II. The question body agrees
      word for word through (a), (b)(i) and (b)(ii), with the same bounds, norms,
      quantifiers and equation. In particular \(\varphi\) is the integral alone and
      the initial datum first enters the deduction. No absolute marks appear.


      ## Independent derivation


      For an open \(D\subset\mathbb R\times\mathbb R^n\), suppose \(F:D\to\mathbb
      R^n\) is continuous and locally Lipschitz in the state, uniformly in time on
      a neighborhood of each point of \(D\). For each \((t_0,y_0)\in D\) there is
      an interval around \(t_0\) supporting a unique local \(C^1\) solution of \(y''=F(t,y),\
      y(t_0)=y_0\). More precisely any two such solutions agree throughout their common
      interval containing \(t_0\). Local existence alone need not give existence on
      an entire prescribed interval.


      On the finite interval \(1\le t\le b\), \(b^{-c}\le t^{-c}\le1\) for \(c\ge0\),
      hence \(b^{-c}\|f\|_\infty\le\|f\|_c\le\|f\|_\infty\). Positivity of the weight
      and the ordinary norm axioms give a norm. Uniform Cauchy sequences converge
      uniformly to continuous functions because \(\mathbb R^n\) is complete. The comparison
      therefore also gives completeness in the weighted norm.


      The integrand is continuous, so \(\varphi(f)\in X\). For \(f,g\in X\), the weighted
      magnitude of the difference of integrals at \(t\) is bounded by

      \[

      M\|f-g\|_c t^{-c}\int_1^t s^c\,ds

      =M\|f-g\|_c\,(t-t^{-c})/(c+1)

      \le Mb\|f-g\|_c/(c+1).

      \]

      Take \(c=Mb\) to obtain a factor strictly below one. Adding the constant function
      \(y_0\) leaves this bound valid for the translated mapping \(T(f)=y_0+\varphi(f)\).
      Banach''s fixed-point theorem supplies exactly one fixed point. The fundamental
      theorem of calculus implies that it solves the ODE and attains the prescribed
      initial value, and integration shows that every solution is a fixed point. Endpoints
      use the one-sided derivative for \(b>1\). The integral formulation on a singleton
      \(b=1\) simply prescribes \(f(1)\).

      '
