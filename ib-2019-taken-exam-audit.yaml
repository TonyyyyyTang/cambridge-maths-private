  IB/2019/P2/q8H:
    independent_rework: '# P2 / q8H — independent examination rework


      ## Source comparison


      Paper 2, physical page 5, printed 8H, Statistics. The three parts and bracketed
      beta-density and mean facts agree in wording, parameters and exponents with
      the printed page. The last expectation has no printed conditioning subscript
      and (c) uses the words “minimizes the quadratic error loss function”. No marks
      appear.


      ## Independent derivation


      Encode a head by one and a tail by zero, so \(s=\sum_{i=1}^n X_i\) counts heads.
      The likelihood of this ordered sample is \(\theta^s(1-\theta)^{n-s}\); observation
      of the count instead introduces a constant binomial coefficient that cancels.
      Bayes'' rule and prior density one on \([0,1]\) give the \(\operatorname{Beta}(s+1,n-s+1)\)
      posterior, with zero density outside that interval. The normalization is \(1/B(s+1,n-s+1)=(n+1)!/[s!(n-s)!]\).
      Both parameters are positive even for an all-heads or all-tails sample.


      For decision \(a\) and true parameter \(\theta\) the quadratic loss is \(L(\theta,a)=(a-\theta)^2\).
      The Bayes decision minimizes the conditional expected loss after observing \(X\).
      Writing \(\mu=\mathbb E[\theta\mid X]\),

      \[

      \mathbb E[(a-\theta)^2\mid X]=(a-\mu)^2+\operatorname{Var}(\theta\mid X).

      \]

      The cross term vanishes by definition of conditional expectation. This yields
      the unique minimizer \(\widehat\theta=\mu=(s+1)/(n+2)\), which lies in the permissible
      action interval. Minimization of the pointwise loss with known \(\theta\) would
      simply yield \(a=\theta\).


      At fixed \(\theta\) the sample count is binomial with mean \(n\theta\), giving
      the sampling expectation \(\mathbb E_\theta[\widehat\theta]=(n\theta+1)/(n+2)\),
      including \(\theta=0,1\). Under the joint uniform-prior model, averaging this
      quantity over the prior gives \(\mathbb E[\widehat\theta]=1/2\); equivalently
      use the tower law. These distinguish the two standard probability laws relevant
      to the unqualified final expectation.

      '
