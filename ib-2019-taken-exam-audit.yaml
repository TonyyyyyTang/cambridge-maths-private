  IB/2019/P1/q2F:
    independent_rework: '# P1 / q2F — independent examination rework


      ## Source comparison


      Paper 1, physical page 2, printed 2F, Complex Analysis or Complex Methods. Both
      sentences, numerator 10, factors \(z+2,z^2+1\), names and strict endpoints of
      both annuli match the supplied fragment. No marks or subpart labels appear.


      ## Independent derivation


      On \(r<|z-a|<R\), a holomorphic \(f\) has the unique representation \(f(z)=\sum_{j\in\mathbb
      Z}c_j(z-a)^j\), convergent absolutely and uniformly on compact subannuli. For
      \(r<s<R\),

      \[

      c_j=\frac1{2\pi i}\oint_{|\zeta-a|=s}\frac{f(\zeta)}{(\zeta-a)^{j+1}}\,d\zeta

      \]

      with positive orientation. Holomorphicity is the relevant hypothesis in asking
      for such a representation of a given function.


      Here

      \[

      f(z)=\frac{2}{z+2}+\frac{4-2z}{1+z^2},

      \]

      since \(2(1+z^2)+(4-2z)(z+2)=10\). The first term is \(\sum_{j\ge0}(-1/2)^j
      z^j\) on both annuli. On \(A_1\) add

      \[

      \sum_{j\ge0}(-1)^j(4z^{2j}-2z^{2j+1}).

      \]

      These coefficients add at like powers, with no negative powers. For instance
      the constant term is \(1+4=5=f(0)\), since the origin is regular. On \(A_2\)
      instead add

      \[

      \sum_{j\ge0}(-1)^j(4z^{-2j-2}-2z^{-2j-1}),

      \]

      using \(1/(1+z^2)=z^{-2}/(1+z^{-2})\). The geometric ratios have absolute value
      less than one on their respective domains. Poles at \(i,-i,-2\) account for
      the limiting circles.

      '
