  IB/2019/P3/q15D:
    independent_rework: '# P3 / q15D — independent examination rework


      ## Source comparison


      Paper 3, physical page 8, printed 15D, Methods. The fragment matches the page
      in its prose, differential equation, Fourier-integral hint (including \(1/(2\pi)\),
      \(-i\) and \(kc\)), initial data and last interpretation request. The bold spatial
      vectors denote the same variables throughout. No absolute marks are printed.


      ## Independent derivation


      In distributions \((Hh)''=Hh''+h(0)\delta\) for smooth \(h\). With \(h(t)=\sin(\alpha
      t)/\alpha\), \(h(0)=0,\ h''(0)=1,\ h''''=-\alpha^2h\). Thus \(\psi''=H\cos(\alpha
      t)\) and \(\psi''''=\delta-\alpha^2\psi\). At \(\alpha=0\) use the continuous
      limit \(h=t\), yielding \((Ht)''''=\delta\).


      For wave speed \(c>0\) and a unit impulse at \((y,s)\), set \(z=x-y,\ \tau=t-s,\
      r=|z|\). Fourier transform in \(z\) using forward factor \(e^{-ik\cdot z}\)
      and inverse measure \(d^3k/(2\pi)^3\). Then \(\widehat G_{\tau\tau}+c^2|k|^2\widehat
      G=\delta(\tau)\). The causal solution is \(H(\tau)\sin(c|k|\tau)/(c|k|)\), with
      its continuous value at \(k=0\). Angular integration of the inverse gives for
      \(r>0\)

      \[

      G=\frac{H(\tau)}{2\pi^2cr}\int_0^\infty\sin(kr)\sin(kc\tau)\,dk

      =\frac{H(\tau)}{4\pi cr}\big[\delta(r-c\tau)-\delta(r+c\tau)\big].

      \]

      The last identity is distributional, from the cosine difference and \(\int_0^\infty\cos(ka)\,dk=\pi\delta(a)\).
      The retarded kernel is \(\delta(\tau-r/c)/(4\pi c^2 r)\). Its definition across
      the vertex is given by integration in \(z\); the radial volume factor \(r^2\)
      makes \(1/r\) locally integrable and the spherical integral at the vertex well
      defined. The spatial Fourier derivation fixes the source normalization and excludes
      an extra point mass. It vanishes before the impulse.


      Extend the forward Cauchy solution by zero for \(t<0\). Differentiating twice
      supplies \(u_t(x,0)\delta(t)+u(x,0)\delta''(t)=f(x)\delta(t)\) at the initial
      surface. Retarded convolution thus gives, for \(t>0\),

      \[

      u(x,t)=\int\frac{\delta(t-|x-y|/c)}{4\pi c^2|x-y|}f(y)\,dy

      =\frac{t}{4\pi}\int_{\mathbb S^2} f(x+ct\omega)\,d\omega.

      \]

      This equals \(t\) times the spherical mean on the sphere of radius \(ct\). For
      smooth \(f\), continuity at \(t=0\) gives \(u(x,0)=0,\ \partial_tu(x,0)=f(x)\).
      Only the spherical wavefront at distance \(ct\) contributes to the value: a
      point impulse propagates at speed \(c\) with no tail inside its cone (the three-dimensional
      Huygens principle).

      '
