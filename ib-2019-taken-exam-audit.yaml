  IB/2019/P4/q7A:
    independent_rework: '# P4 / q7A — independent examination rework


      ## Source comparison


      The archived 2019 Paper 4, physical page 3, prints 7A (Electromagnetism) below
      6B. Both paragraphs match the supplied fragment. I checked the real parts, the
      positive \(i\) in the exponential, the minus sign before \(\omega t\), the ordered
      components \(E(1,i,0)\) and \(k(0,0,1)\), and the request for the Poynting vector
      and its physical significance. The question prints no marks and gives no sign
      convention for the frequency.


      ## Independent derivation


      In vacuum and SI units the source-free Maxwell equations are

      \[

      \nabla\cdot\mathbf E=0,\quad \nabla\cdot\mathbf B=0,\quad

      \nabla\times\mathbf E=-\partial_t\mathbf B,\quad

      \nabla\times\mathbf B=c^{-2}\partial_t\mathbf E,\qquad

      c=(\epsilon_0\mu_0)^{-1/2}.

      \]

      Linearity and the real coefficients allow one to take the real part after solving
      the complex equations. Acting on the exponential sends \(\nabla\) to \(i\mathbf
      k\) and \(\partial_t\) to \(-i\omega\). The resulting equations require \(\mathbf
      k\cdot\mathbf E_0=\mathbf k\cdot\mathbf B_0=0\), \(\mathbf k\times\mathbf E_0=\omega\mathbf
      B_0\), and \(\mathbf k\times\mathbf B_0=-(\omega/c^2)\mathbf E_0\). On a nonzero
      wave take \(\mathbf k\ne0,\ \mathbf E_0\ne0\) and impose \(\mathbf k\cdot\mathbf
      E_0=0\). Crossing with \(\mathbf k\) twice gives \(-|\mathbf k|^2\mathbf E_0\).
      Therefore set \(\omega=\pm c|\mathbf k|\) and \(\mathbf B_0=(\mathbf k\times\mathbf
      E_0)/\omega\). Substitution verifies both curl equations and the remaining divergence
      constraint. At zero wavevector, the zero-frequency fields may be spatially and
      temporally constant; a nonzero frequency at zero wavevector forces both amplitudes
      to vanish.


      For the prescribed amplitudes put \(\varphi=kz-\omega t\). The physical fields
      on either nonzero-frequency branch are

      \[

      \mathbf E=E(\cos\varphi,-\sin\varphi,0),\qquad

      \mathbf B=(kE/\omega)(\sin\varphi,\cos\varphi,0).

      \]

      In fact \(\hat{\mathbf z}\times(1,i,0)=(-i,1,0)\); taking real parts gives the
      signs shown. The transverse vectors rotate at constant magnitude, and \(\mathbf
      E\cdot\mathbf B=0\). Their instantaneous Poynting vector is

      \[

      \mathbf S=\mu_0^{-1}\mathbf E\times\mathbf B

      =\frac{kE^2}{\mu_0\omega}\hat{\mathbf z}.

      \]

      For \(k>0,\ \omega=ck\) it is \(E^2/(\mu_0 c)\,\hat{\mathbf z}\). There is no
      oscillatory factor because \(\cos^2\varphi+\sin^2\varphi=1\); this is also its
      cycle average. It gives electromagnetic energy per unit time per unit area flowing
      in the propagation direction. In particular \(\int \mathbf S\cdot d\mathbf A\)
      is the outward electromagnetic power through an oriented surface. As a dimensional
      and normalization check the wave energy density is \(U=(\epsilon_0|\mathbf E|^2+|\mathbf
      B|^2/\mu_0)/2=\epsilon_0E^2\), so \(|\mathbf S|=cU\).

      '
