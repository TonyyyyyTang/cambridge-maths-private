    independent_rework: '# P1 / q11E — independent examination rework


      ## Source comparison


      Paper 1, physical page 5, printed 11E, Analysis II. I read the question through
      both lettered parts against the page image. The wording and symbols match, including
      the order of the three maps in part (b), the open domains and the argument \(h\).
      The question prints no marks.


      ## Independent derivation


      Differentiability at \(p\) means that there is a linear \(L:\mathbb R^n\to\mathbb
      R^m\) for which \(f(p+h)=f(p)+Lh+u(h)\), with \(u(0)=0\) and \(\|u(h)\|/\|h\|\to0\)
      as nonzero \(h\to0\). Openness gives a ball of allowable increments. Comparing
      two candidate maps along \(h=tv\), dividing by \(t\) and taking the limit proves
      uniqueness, so \(Df(p)=L\).


      If \(g\) is differentiable at \(f(p)\) with derivative \(B\), then \(D(g\circ
      f)(p)=BL\). Put \(k=Lh+u(h)\). In finite dimensions \(L,B\) are bounded, so
      \(\|k\|=O(\|h\|)\) and \(k\to0\). Expanding \(g\), the remainder after subtracting
      \(BLh\) is \(Bu(h)+v(k)\), with \(\|v(k)\|=o(\|k\|)\). Both terms are \(o(\|h\|)\),
      including increments for which \(k=0\), since \(v(0)=0\).


      Use an operator norm. For \(\|h\|<1/2\) the Neumann series yields \(\|(I+h)^{-1}\|\le2\).
      The exact remainder \((I+h)^{-1}-(I-h)=h^2(I+h)^{-1}\) has norm at most \(2\|h\|^2\).
      Thus \(Df(I)h=-h\). For invertible \(A,C\), \((CA)^{-1}C=A^{-1}\) proves the
      stated identity. Factoring \(C+h=C(I+C^{-1}h)\) expresses its inverse as \((I+C^{-1}h)^{-1}C^{-1}\).
      The inner increment and final right multiplication are bounded linear maps.
      Applying the expansion at the identity gives \(Df(C)h=-C^{-1}hC^{-1}\) with
      \(O_C(\|h\|^2)\) remainder throughout a neighborhood of zero. This calculation
      preserves factor order even for noncommuting \(h,C\).

      '
