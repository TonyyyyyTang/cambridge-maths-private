  IB/2019/P1/q6C:
    independent_rework: '# P1 / q6C — independent examination rework


      ## Source comparison


      Paper 1, physical page 3, printed 6C, Numerical Analysis. Both occurrences of
      the degree, all node subscripts, the product range and the signs and indices
      in the recurrence agree with the image. In particular the printed phrase is
      “polynomial of degree \(n\)”. No numbered subparts or marks are given.


      ## Independent derivation


      For distinct nodes \(y_0,\ldots,y_m\) let \(P\) be the polynomial of degree
      at most \(m\) taking values \(f(y_j)\). It exists by the Lagrange sum \(\sum_j
      f(y_j)\prod_{k\ne j}(x-y_k)/(y_j-y_k)\). It is unique since a polynomial of
      degree at most \(m\) with \(m+1\) distinct roots vanishes identically. Define
      \(f[y_0,\ldots,y_m]\) to be the coefficient of \(x^m\) in \(P\); in particular
      \(f[y_0]=f(y_0)\). This definition is symmetric and permits a zero coefficient.


      Let \(P_m\) use nodes \(x_0,\ldots,x_m\). For \(m\ge1\), \(P_m-P_{m-1}\) has
      its first \(m\) nodes as roots and degree at most \(m\), so equals a constant
      times \(\prod_{i=0}^{m-1}(x-x_i)\). The product is monic and \(P_{m-1}\) has
      degree \(<m\), so that constant is \(f[x_0,\ldots,x_m]\). Summing over \(1\le
      m\le n\) from \(P_0=f(x_0)\) gives precisely the stated Newton expansion, also
      valid for \(n=0\). An interpolant can have lower degree: constant data for \(n\ge1\)
      are a counterexample to interpreting the printed degree as always exact.


      For \(m\ge1\), write \(Q\) for the interpolant on \(x_1,\ldots,x_m\), \(P\)
      for the interpolant on \(x_0,\ldots,x_{m-1}\). The candidate

      \[

      T(x)=\big[(x-x_0)Q(x)-(x-x_m)P(x)\big]/(x_m-x_0)

      \]

      has degree at most \(m\). At the two endpoints only the appropriate interpolant
      contributes; at every interior node both terms have the same datum and their
      multipliers differ by \(x_m-x_0\). Thus \(T=P_m\) by uniqueness. Taking the
      \(x^m\) coefficient gives exactly the displayed difference of the divided differences
      divided by \(x_m-x_0\). This denominator is nonzero regardless of node order.
      For \(m=1\) the formula reduces to the ordinary secant slope.

      '
