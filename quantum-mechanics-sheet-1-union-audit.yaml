  derivation: 'Independent rework. Input limited to the eight exact fragments and source locator manifest. Python
    3 random.Random(20261202).sample(sorted(population),4) independently returned q06,q10,q01,qx01 from 18 IDs.


    q06 (e2e8f173ca6b). Treat the listed energy vectors as a complete orthonormal energy basis, as usual (in particular
    the two energies in the time question are distinct). In their first two coordinates the exchange has equations
    (b,a)=lambda(a,b). Thus lambda=+1 and -1 on normalized (chi1 +/- chi2)/sqrt2, respectively; on the closed
    span of the remaining coordinates the eigenvalue is zero. The Hamiltonian mean in either is (E1+E2)/2 because
    H is diagonal. The +1 eigenspace is one dimensional so measurement prepares the plus vector up to phase. Relative
    phase accumulates at the energy splitting; the return amplitude is (exp(-i E1 t/hbar)+exp(-i E2 t/hbar))/2.
    The squared modulus is (1+cos[(E2-E1)t/hbar])/2=cos^2[(E2-E1)t/(2 hbar)]. It is zero at the specified positive
    T, returns to unity at 2T and at t=0; a zero gap gives unit return at all times.


    q10 (7a5d52b3bae6, cc37d30d8c5e). Capital Psi or lower-case psi, V or U equal to zero. On a regular time interval
    with differentiable nonvanishing gamma, choose a continuous square root; for C nonzero, psi_xx/psi=x^2/gamma^2-1/gamma,
    psi_t/psi=(gamma''/2)(x^2/gamma^2-1/gamma). Substitution gives i hbar gamma''=-hbar^2/m, necessary by evaluating
    at x=0 and sufficient identically. C=0 solves trivially but cannot represent a normalized state. gamma=alpha+i
    hbar t/m. Set D=alpha^2+(hbar t/m)^2; Re(1/gamma)=alpha/D. Density is |C|^2/sqrt(D) times exp(-alpha x^2/D),
    with total norm squared |C|^2 sqrt(pi/alpha). Choose C=(alpha/pi)^(1/4) times arbitrary unit phase. The normalized
    density is centered, of variance D/(2 alpha); its peak decreases and width increases for positive t, and its
    integral stays one. It tends to zero pointwise. q10 (9aa5b5c06950): same substitution and evolution, but supplied
    positive prefactor already has the normalizing value. For finite fixed a<=b, integrate that density: P=(erf(b
    sqrt(alpha/D))-erf(a sqrt(alpha/D)))/2. Alternatively 0<=P<=(b-a)sqrt(alpha/(pi D))->0 as t increases. This
    conclusion would not hold for the whole line.


    q01 (6a9f18f26966): one photon transfers energy hc/lambda, so K_max=hc/lambda-W. Subtract two data and get
    hc=1.6 eV/(1/(3e-7m)-1/(5e-7m))=1.2e-6 eV m. Therefore h approximately 4.0e-15 eV s = 6.4e-34 J s. W=4.0-2.1=1.9
    eV from first datum; also 2.4-0.5=1.9 eV, corresponding to about 3.0e-19 J. q01 (fc6416766c36) requests hbar
    by name/symbol; h from the same two observations is 6.4e-34 J s, so hbar=h/(2 pi) approximately 1.02e-34 J
    s (6.37e-16 eV s); E0=W=1.9 eV.


    qx01 (75a30ce6da33, f8408fa04d32): denote the printed chi or psi vectors by u and v. Inner product linear
    in its second slot. Norm squared of alpha u + beta v is |alpha|^2+|beta|^2+2 Re(conj(alpha) beta <u,v>); orthogonality
    gives the iff. For w=u-gamma v, <v,w>=<v,u>-gamma since v has unit norm, hence gamma=<v,u> uniquely, with
    |gamma|<=1 by Cauchy-Schwarz. In the orthogonal decomposition u=w+gamma v, Pythagoras gives ||w||^2=1-|gamma|^2.
    For |gamma|<1 divide w by its positive norm; at equality w=0, so the restriction is necessary. This projection
    order matters for complex vectors.

    '
