    independent_rework: '# Independent rework of IB/2004/P4/q19H


      For a decision \(\delta(X)\), condition its loss on \(X\). The Bayes risk is
      \(\int m(x)\int L(\theta,\delta(x))\pi(\theta\mid x)\,d\theta\,dx\), with \(m\)
      the predictive density. For nonnegative or integrable loss, pointwise minimisation
      of the inner expectation yields a Bayes rule (up to predictive null sets, with
      a measurable minimiser).


      Write \(r=\mu+x>0\). The posterior density is proportional to \(\theta e^{-r\theta}\)
      for \(\theta>0\). Its integral before normalization is \(1/r^2\), so the posterior
      is Gamma with shape 2 and rate \(r\). For squared loss the posterior risk is
      the posterior variance plus \((a-\mathbb E[\theta\mid x])^2\); the minimiser
      is \(2/r\).


      With relative absolute loss the posterior risk is \(r^2\int_0^\infty|\theta-a|e^{-r\theta}\,d\theta\).
      Up to a positive factor, this is ordinary absolute loss for an exponential distribution
      with rate \(r\). For \(a<0\) the risk decreases as \(a\) increases; for \(a\ge0\)
      its derivative divided by \(r\) equals \(2(1-e^{-ra})-1\). The unique minimum
      is its median \(\log(2)/r\).

      '
    main_comparison: Conditioning Bayes risk gives pointwise posterior minimization.
      The posterior is gamma with shape two and rate μ+x. Its mean gives squared-error
      action 2/(μ+x), while inverse-parameter reweighting gives an exponential median
      log(2)/(μ+x).
