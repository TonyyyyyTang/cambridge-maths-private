    independent_rework: '# Independent rework of IB/2004/P2/q11H


      Reversibility in the invariant initial law means that the joint law of \((X_0,\ldots,X_n)\)
      equals that of \((X_n,\ldots,X_0)\) for every \(n\). For \(n=1\) this gives
      detailed balance by evaluating the pair \((i,j)\). Conversely the Markov property
      gives each path probability \(\pi_{i_0}P_{i_0 i_1}\cdots P_{i_{n-1}i_n}\). Replacing
      the first factor pair by \(\pi_{i_1}P_{i_1 i_0}\), then replacing the new pair
      at each subsequent edge by detailed balance, yields \(\pi_{i_n}\prod_{k=1}^n
      P_{i_k i_{k-1}}\). This is the probability of the reversed path. There is no
      division by possibly zero transition probabilities.

      '
    main_comparison: Stationarity with irreducibility gives positive mass to each
      state. Two-time reversal yields detailed balance. Conversely the ratios telescope
      along any finite path and give identical forward and backward path probabilities,
      including paths with zero probability.
