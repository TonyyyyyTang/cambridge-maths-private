      Fréchet differentiability at \(u\) means that some linear \(A:\mathbb R^n\to\mathbb
      R^m\) satisfies \(\|f(u+h)-f(u)-Ah\|/\|h\|\to0\) through nonzero \(h\to0\) with
      \(u+h\in U\). At a point with \(ab\ne0\), take \(\|(h,k)\|<\min(|a|,|b|)\).
      Both coordinates keep their original signs, giving \(g(a+h,b+k)-g(a,b)=\operatorname{sgn}(a)h+\operatorname{sgn}(b)k\)
      exactly. This linear form is the derivative; the error is identically zero near
      the point.

      '
    main_comparison: A ball of radius smaller than both nonzero coordinate magnitudes
      fixes their signs. The exact local increment of the sum of absolute values equals
      a linear functional with no remainder.
