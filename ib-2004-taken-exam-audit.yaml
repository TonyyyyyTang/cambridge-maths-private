    independent_rework: '# Independent rework of IB/2004/P1/q1H


      Write \(e_{r+1}=\sum_{i=1}^r a_i e_i+\sum_{j=r+1}^m b_j f_j\), using the spanning
      hypothesis. At least one \(b_j\) is nonzero, because otherwise the independent
      set of \(r+1\) vectors satisfies a relation with last coefficient 1. Move this
      \(f_j\) to slot \(r+1\). Solving the displayed identity for it shows that every
      old generator belongs to the new span, hence the new list spans.


      Start with the \(m\) vectors \(f_j\) and insert successive \(e_i\) in this manner
      while \(i\le \min(m,n)\). If \(n>m\), after \(m\) steps the first \(m\) vectors
      \(e_i\) span, making \(e_{m+1}\) dependent on them. This contradiction proves
      \(n\le m\), including \(m=0\) by the empty-span convention.

      '
    main_comparison: Independence forces a nonzero coefficient from the unreplaced
      spanning vectors. Solving for that vector preserves spanning after exchange.
      Iterating exhausts any shorter spanning list, contradicting a further independent
      vector.
