    independent_rework: '# Independent rework of IB/2004/P3/q17E


      On a compact subset of \(\mathbb C\setminus\mathbb Z\) choose \(R\) with \(|z|\le
      R\). For \(|n|>2R\) one has \(|z-n|^{-2}\le4/n^2\), giving absolute, locally
      uniform convergence by the Weierstrass test. The terms are holomorphic on the
      stated domain, hence so is their locally uniform sum. Absolute convergence permits
      reindexing \(n\mapsto n-1\) when the argument increases by one.


      For each \(z_0\ne0,1\) take a disc around it omitting both points and a holomorphic
      logarithm there. Its values differ from the specified determination at each
      point by \(2\pi i\) times an integer. Periodicity makes \(f(\log z/(2\pi i))\)
      independent of the choice, even where the specified determination jumps. The
      logarithm divided by \(2\pi i\) cannot lie in \(\mathbb Z\) on this disc, since
      that would give \(z=1\); thus the local composition is analytic.


      Near zero \(f(w)=w^{-2}+H(w)\), where \(H\) is holomorphic by the same convergence
      test with the \(n=0\) term omitted. A holomorphic logarithm near 1 with value
      zero there gives \(w=(z-1)/(2\pi i)+O((z-1)^2)\). Consequently \((z-1)^2g(z)\to(2\pi
      i)^2=-4\pi^2\); the singularity is a double pole.

      '
    main_comparison: A summable inverse-square majorant gives locally uniform convergence
      off the integers. Reindexing proves periodicity, permitting analytic local logarithms
      to agree after composition. The log has a simple zero at one, producing the
      same double-pole coefficient (2πi)².
