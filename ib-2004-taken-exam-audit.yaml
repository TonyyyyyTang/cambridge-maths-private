    independent_rework: '# Independent rework of IB/2004/P3/q19B


      Faraday and Ampère–Maxwell give \(\nabla\times E=-\partial_tB\) and \(\nabla\times
      B=\mu_0 J+\mu_0\epsilon_0\partial_t E\). Thus

      \[

      \frac1{\mu_0}\nabla\cdot(E\times B)

      =\frac1{\mu_0}[B\cdot(\nabla\times E)-E\cdot(\nabla\times B)]

      =-\partial_t\left(\frac{B^2}{2\mu_0}+\frac{\epsilon_0 E^2}{2}\right)-J\cdot
      E.

      \]

      For the travelling wave the divergence equations hold. Equating the sine coefficients
      in the curl equations yields \(kE_0=\omega B_0,\ k B_0=\epsilon_0\mu_0\omega
      E_0\). For a nontrivial positive-frequency wave travelling in \(+z\), \(\omega/k=c=(\mu_0\epsilon_0)^{-1/2}\)
      and \(B_0=E_0/c\). Writing \(C=\cos(kz-\omega t)\), one gets \(W=\epsilon_0
      E_0^2 C^2\) and \(\mathbf S=(E_0 B_0/\mu_0)C^2\hat z=cW\hat z\). This equality
      holds also at nodes. The printed paper calls \(c^2\) the speed; the speed is
      \(c\), whose square is the displayed reciprocal.

      '
    main_comparison: Both Maxwell curl laws fix E0=cB0 and the energy flux has magnitude
      c times energy density, including at a node. The original calls c squared the
      speed. The parameter identity specifies the speed squared, with propagation
      speed c.
