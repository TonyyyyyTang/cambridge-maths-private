    independent_rework: '# Independent rework of IB/2004/P2/q16A


      Define \(g(z)=\int_{[0,z]} f(w)\,dw\). The triangle with vertices \(0,z,z+h\)
      lies in the disc whenever its vertices do, by convexity. The integral on its
      boundary vanishes by Cauchy''s theorem (and by segment cancellation for a degenerate
      triangle). Hence for nonzero sufficiently small \(h\),

      \[

      \frac{g(z+h)-g(z)}h=\int_0^1 f(z+sh)\,ds.

      \]

      Its difference from \(f(z)\) is bounded by \(\sup_{|w-z|\le |h|}|f(w)-f(z)|\),
      tending to zero by continuity. Thus \(g''(z)=f(z)\) at every point and \(g\)
      is analytic there.

      '
    main_comparison: The line segment primitive is well defined in the convex disk.
      Cauchy's theorem on the triangle reduces its difference quotient to a shrinking
      segment average of f, whose limit is f(z).
