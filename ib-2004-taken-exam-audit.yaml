      In three dimensions the isotropic rank-two and rank-three tensors under proper
      rotations are \(a\delta_{ij}\) and \(b\epsilon_{ijk}\), respectively. If invariance
      under every orthogonal transformation is required for an ordinary polar rank-three
      tensor, inversion further forces \(b=0\). In an isotropic material \(\sigma_{ij}=b\epsilon_{ijk}B_k\)
      changes sign on exchanging \(i,j\). The required stress symmetry therefore gives
      \(\sigma_{ij}=0\) for every applied field. A nonzero linear stress of the specified
      type requires anisotropy.

      '
    main_comparison: The only proper-rotation invariant rank-three tensor is a multiple
      of the alternating tensor. Its contraction with a field is antisymmetric in
      its two free indices, while mechanical stress is symmetric, forcing the response
      to vanish.
