    independent_rework: '# Independent rework of IB/2004/P3/q20D


      For scattering let \(k=\sqrt\epsilon>0\), \(K=\sqrt{U-\epsilon}>0\). The real
      potential conserves probability current. In each free region the current is
      \((\hbar k/m)\) times right-moving intensity minus left-moving intensity, so
      \(|a|^2-|c|^2=|d|^2-|b|^2\). The equal exterior wave numbers give the stated
      incoming/outgoing identity.


      Set \(C=\cosh KL,\ S=\sinh KL,\ \lambda=K/(ik)\). Continuity of the wave and
      first derivative at the finite jumps gives

      \[

      a+c=e,\quad ik(a-c)=Kf,\quad d+b=eC+fS,\quad ik(d-b)=K(eS+fC).

      \]

      Subtract the last equation divided by \(ik\) from the preceding one. Substitution
      of \(e=a+c,\ f=(a-c)/\lambda\) gives

      \[

      2b=2Cc-(\lambda+\lambda^{-1})Sc-(\lambda-\lambda^{-1})Sa.

      \]

      Thus \(c=[b+(\lambda-\lambda^{-1})Sa/2]/D\), where \(D=C-(\lambda+\lambda^{-1})S/2\).
      Reflection \(x\mapsto L-x\) interchanges \(a,b\) and \(c,d\) with the given
      boundary phase conventions and leaves the barrier invariant. It gives \(d=[a+(\lambda-\lambda^{-1})Sb/2]/D\).


      With incidence only from the left, \(T\) is transmitted divided by incident
      flux, hence \(T=|d/a|^2=1/|D|^2\). Here \(\lambda=-iK/k\), so

      \[

      |D|^2=C^2+\tfrac14(k/K-K/k)^2S^2

      =1+\frac{(k^2+K^2)^2}{4k^2K^2}S^2.

      \]

      This is positive for every \(L\). As \(KL\to\infty\), \(S^2\sim e^{2KL}/4\)
      and

      \(T\sim16\epsilon(U-\epsilon)e^{-2\sqrt{U-\epsilon}L}/U^2\) for fixed \(0<\epsilon<U\).

      '
    main_comparison: Current conservation requires a real barrier and a propagating
      exterior wave. The four interface equations and reflection about the midpoint
      agree with both scattering amplitudes. At fixed energy between zero and U the
      large-width prefactor is 16 times epsilon times (U minus epsilon) over U squared.
