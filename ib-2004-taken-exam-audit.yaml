auditor_report: '# Blind audit of eighteen 2004 Part IB questions


  I compared the supplied question bodies against rendered images of the cited Faculty
  PDF pages and independently solved each question using those inputs. The 18 questions
  occupy 16 distinct pages. Every sampled question ends on its cited page. None contains
  a source figure. I found 0 question-body transcription discrepancies in 18 comparisons.
  The sample contains no printed question-level marks.


  Each rework records my independent derivation before any comparison with the stored
  solution. An error rate for the stored solutions requires the main agent to compare
  these reworks with them. The sample does not establish whole-course error rates.


