    independent_rework: '# Independent rework of IB/2004/P4/q9H


      Let \(Q=\sum_i x_i^2\). For \(Q>0\), \(\sum(Y_i-bx_i)^2\) has derivative \(2Qb-2\sum
      x_iY_i\) and positive second derivative \(2Q\). Thus \(\hat\beta=\sum x_iY_i/Q\).
      Set \(s^2=(n-1)^{-1}\sum(Y_i-\hat\beta x_i)^2\) for \(n\ge2\). In an orthonormal
      basis whose first direction is \(x/\sqrt Q\), the first coordinate of \(Y\)
      is \(\sqrt Q\,\hat\beta\sim N(\sqrt Q\,\beta,\sigma^2)\). The other \(n-1\)
      coordinates are independent \(N(0,\sigma^2)\) and independent of the first coordinate
      by spherical Gaussian covariance. Their squared sum is the residual sum of squares,
      hence \((n-1)s^2/\sigma^2\sim\chi^2_{n-1}\). For positive \(\sigma^2\) the null
      distribution of \(T=\sqrt Q\,\hat\beta/s\) is Student \(t_{n-1}\). Reject at
      level \(\alpha\) if \(|T|>t_{n-1,1-\alpha/2}\), with two-sided \(p\)-value \(2[1-F_{t_{n-1}}(|T|)]\).
      If all \(x_i=0\), every slope minimizes and the data carry no information about
      it. For \(n=1\) there is no residual degree of freedom for this unknown-variance
      test.

      '
    main_comparison: Projection onto a nonzero design gives the slope and leaves independent
      Gaussian residual coordinates. Their sum of squares supplies the Student denominator
      with n−1 degrees of freedom. A zero design or a single observation invalidates
      the usual two-sided test.
