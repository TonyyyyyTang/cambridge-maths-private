    independent_rework: '# Independent rework of IB/2004/P4/q11E


      In positive dimension the characteristic polynomial over \(\mathbb C\) has a
      root, giving an eigenvector \(u\), which can be normalised. Its eigenvalue \(\lambda\)
      is real since \(\langle\alpha u,u\rangle\) is real by Hermitian symmetry. For
      \(w\perp u\) one has \(\langle\alpha w,u\rangle=\langle w,\alpha u\rangle=0\).
      The orthogonal complement is invariant and its restriction is Hermitian. Induction
      on dimension, starting with dimension zero, supplies an orthonormal eigenbasis
      of the complement. Appending \(u\) proves (i).


      Since \((\alpha\beta)^*=\beta^*\alpha^*=\beta\alpha\), equality to its own adjoint
      is equivalent to commutation.


      For positive-definite \(\alpha\), each eigenvalue equals its positive Rayleigh
      quotient. On the mutually orthogonal eigenspaces \(E_\lambda\) define \(\beta=\sqrt\lambda\,\mathrm{Id}\).
      Its diagonal form shows it is Hermitian, strictly positive on nonzero vectors,
      and squares to \(\alpha\). Any other positive Hermitian root \(\gamma\) commutes
      with \(\alpha=\gamma^2\), so preserves every \(E_\lambda\). Its restriction
      there has an orthonormal eigenbasis by (i), and every eigenvalue is positive
      and has square \(\lambda\). The restriction is therefore \(\sqrt\lambda\,\mathrm{Id}\)
      throughout that eigenspace, proving uniqueness even with repeated eigenvalues.

      '
    main_comparison: An eigenvector exists in positive complex dimension and its orthogonal
      complement is invariant. Induction diagonalizes the Hermitian operator. Reversing
      the adjoint product gives the commutation criterion. Any positive root commutes
      with its square and must equal the scalar positive root on each eigenspace.
