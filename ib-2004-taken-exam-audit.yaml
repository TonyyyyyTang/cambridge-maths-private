      The eigenvectors form an orthonormal basis. The initial state is \(\cos\theta\,\psi_0-\sin\theta\,\psi_1\).
      Each component acquires the phase \(\exp(-iE_jt/\hbar)\). The second coordinate
      of the resulting state is therefore \(\sin\theta\cos\theta(e^{-iE_0t/\hbar}-e^{-iE_1t/\hbar})\).
      Its squared modulus is

      \[

      \sin^2(2\theta)\sin^2\!\left(\frac{(E_1-E_0)t}{2\hbar}\right).

      \]

      It vanishes at \(t=0\) and for degenerate energies.

      '
    main_comparison: Changing from the coordinate basis to the orthonormal energy
      basis and evolving both phases gives a transition probability equal to the product
      of sine squared of twice the mixing angle and sine squared of half the relative
      phase. Degeneracy gives zero.
