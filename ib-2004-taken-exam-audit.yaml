    independent_rework: '# Independent rework of IB/2004/P3/q4F


      Nonnegativity and symmetry follow in both coordinates. The maximum vanishes
      precisely if both coordinate distances vanish, that is, if the two ordered pairs
      coincide. For an intermediate point \(w\), each coordinate distance from \(u\)
      to \(v\) is bounded by the sum of its two distances via \(w\), hence by \(D(u,w)+D(w,v)\).
      Taking the maximum proves the triangle inequality.


      When the two factors are the same metric space, take \((x,y)\) off the diagonal
      and let \(r=d(x,y)/2>0\). If \((z,z)\) lay in its open product ball of radius
      \(r\), then \(d(x,y)\le d(x,z)+d(z,y)<2r\), a contradiction. This proves the
      complement is open. The identification of the two metric spaces matters: if
      only the underlying sets coincide, pull back the usual metric on \(\mathbb R\)
      through the permutation exchanging 0 and 1 in the second factor. Then \((1/n,1/n)\)
      converges to \((0,1)\) in the product, so the conclusion can fail for unrelated
      metrics.

      '
    main_comparison: The maximum of the coordinate distances has the metric axioms.
      At each pair off the diagonal the triangle inequality gives a positive product-ball
      radius excluding every diagonal point. Both factors are identified as the same
      metric space. The fresh rework tests that hypothesis by pulling back the second
      metric under the transposition of zero and one.
