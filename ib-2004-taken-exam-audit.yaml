    independent_rework: '# Independent rework of IB/2004/P2/q9A


      The moments of the measure \(x\,dx\) on \([0,1]\) are \(m_j=1/(j+2)\). For cubic
      exactness the monic node polynomial \(p=x^2+Ax+B\) is orthogonal to \(1,x\),
      because the putative rule vanishes on \(p,xp\). Thus \(1/4+A/3+B/2=0,\ 1/5+A/4+B/3=0\).
      Solving gives \(A=-6/5,\ B=3/10\) and nodes \(r_\pm=(6\pm\sqrt6)/10\). The constant
      and linear moment equations \(w_-+w_+=1/2,\ w_-r_-+w_+r_+=1/3\) give \(w_\pm=1/4\pm\sqrt6/36\).
      The requested rule is \(w_- f(r_-)+w_+f(r_+)\). Every cubic divides by \(p\)
      with linear quotient and at most linear remainder, so the four moment conditions
      suffice. The positive integral of \(p^2\) precludes quartic exactness.

      '
    main_comparison: Orthogonality of the monic two-node polynomial to 1 and x gives
      nodes (6±√6)/10. The constant and linear moments fix weights 1/4±√6/36 with
      matching signs. Division by the nodal polynomial proves cubic exactness.
