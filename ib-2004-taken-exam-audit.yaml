    independent_rework: '# Independent rework of IB/2004/P3/q10C


      Using \(u=\nabla\phi\), unsteady Bernoulli for constant density is \(\partial_t\phi+\frac12|\nabla\phi|^2+p/\rho+\chi=F(t)\)
      in the connected fluid. Take a fixed arclength coordinate increasing from the
      descending to the rising free surface. Incompressibility, constant section and
      the long-tube (one-dimensional) approximation give a common signed velocity
      \(\dot\zeta\), so \(\phi=s\dot\zeta+A(t)\) and the partial derivative at fixed
      \(s\) is \(s\ddot\zeta+A''(t)\). The free surfaces have heights \(h-\zeta\)
      and \(h+\zeta\), equal atmospheric pressures and equal squared speeds. The fluid
      length is \(2h\) in the idealisation neglecting the base bend. Subtracting Bernoulli
      at those surfaces gives \(2h\ddot\zeta+2g\zeta=0\). If a finite bend length
      is retained the exact one-dimensional coefficient is half the total fluid length.

      '
    main_comparison: At equal surface pressures the kinetic terms in unsteady Bernoulli
      cancel. The potential time derivatives must be taken at fixed arclength. Twice
      the equilibrium height represents the liquid length only when the bend length
      is negligible. With a finite bend the oscillator coefficient becomes half the
      actual length.
