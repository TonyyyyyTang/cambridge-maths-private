    blind_derivation: |
      # qx02 · independent rework for 914e74967595

      Question SHA-256: `914e74967595abe5df97d1b030ca40033eba0d1379587fc61cc432c24caf2b66`.

      Originals: unresolved-header-2003-copyright-2004 Q4 p1.

      Let \(\ell=\sqrt{\hbar/(m\omega)}\), \(y=x/\ell\), with \(m,\omega>0\). The dimensionless Hamiltonian \(H/(\hbar\omega)=(-\partial_y^2+y^2)/2\) factors as \(a^\dagger a+\tfrac12\), where \(a=(y+\partial_y)/\sqrt2\) and \(a^\dagger=(y-\partial_y)/\sqrt2\). These act as adjoints on the oscillator eigenfunctions under integration by parts (the normalisable branches decay at both ends). Differentiating \(y f\) gives \([a,a^\dagger]=1\), so \(N=a^\dagger a\) satisfies \([N,a]=-a\), \([N,a^\dagger]=a^\dagger\).

      For any normalised energy eigenfunction, write \(Nf=\lambda f\). Then \(\lambda=\|af\|^2\ge0\). A nonzero lowered state has eigenvalue \(\lambda-1\) and positive squared norm when \(\lambda>0\). If \(\lambda\) were not an integer, repeated lowering would start from a value in \((0,1)\) at the final step and produce a nonzero state of negative eigenvalue, impossible. The bottom solves \(af_0=0\), yielding the unique normalised Gaussian up to phase. Raising from it always gives a nonzero eigenstate, since \(\|a^\dagger f_n\|^2=n+1\). This proves precisely the levels \(E_n=(n+\tfrac12)\hbar\omega,\ n=0,1,\ldots\).

      Let \(F(x)=(\pi\ell^2)^{-1/4}e^{-y^2/2}\). Applying the raising operator with the just-derived normalising factors gives
      \[
      \chi_0=F,\qquad \chi_1=\sqrt2\,yF,\qquad \chi_2=\frac{2y^2-1}{\sqrt2}F.
      \]
      The common Gaussian is even. The prefactors are even, odd, even, respectively; each product involving the odd state and either even state is integrable and odd, so each integral on \(\mathbb R\) vanishes. The remaining pair has inner product
      \[
      \int \chi_2^*\chi_0\,dx=\frac{1}{\sqrt{2\pi}}\int_{-\infty}^{\infty}(2y^2-1)e^{-y^2}dy
      =-\frac1{\sqrt{2\pi}}\big[ye^{-y^2}\big]_{-\infty}^{\infty}=0.
      \]
      Both boundary terms vanish by Gaussian decay. The common choice of phase makes each displayed wave real; individual phase changes do not affect the conclusions.

      Numerical cross-check: direct quadrature of the three-by-three overlap matrix gives identity to \(10^{-40}\). All three differential-equation residuals vanish to this tolerance at \(y=-1,0,2\).
    distinct_statement_outcome: agrees
