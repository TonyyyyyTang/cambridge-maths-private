limitations:
- Four of 19 sheet units were randomly selected. No official answer or full-course error rate follows from this
  sample.
- The older printed −U<E bound in two supporting examples is a dimensionally inconsistent source detail; the edition-specific
  referenced solutions explain it. Modern Q09 uses the usual rectangular barrier interpretation.
- The 2006–07 and canonical qx04 PDF continuations each contain the concluding sentence and source metadata; all
  content is present and legible.
- Six additional-original occurrences have archival question/solution records rather than separately dated editions.
