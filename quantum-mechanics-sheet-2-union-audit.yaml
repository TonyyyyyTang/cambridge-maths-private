      The two amplitudes have a simple pole at \(k=i\kappa\). First multiply the *whole wave* by \(k-i\kappa\). On the left this gives \((k-i\kappa)e^{ikx}+i\kappa e^{-ikx}\), on the right \(ke^{ikx}\). At \(k=i\kappa\) both pieces join to \(i\kappa e^{-\kappa|x|}\). Since \(\int_{\mathbb R} e^{-2\kappa|x|}\,dx=1/\kappa\), a unit vector is
      \[
      f_b(x)=\sqrt{\kappa}\,e^{-\kappa|x|},\qquad
      E_b=-\frac{\hbar^2\kappa^2}{2m}=-\frac{mU^2}{2\hbar^2}.
      \]
      For any negative energy the only square-integrable exterior waves are decaying exponentials. Their common amplitude is forced by continuity and their logarithmic slope by the jump, proving uniqueness up to phase. Positive-energy oscillatory exterior waves supply no \(L^2\) eigenvectors.

      Numerical cross-check: the matching residuals were checked for two real and two nonreal wavenumbers away from the pole. The rescaled pole limit agrees on both half-lines, its probability integrates to one, and the real-wavenumber flux sum equals one.
    distinct_statement_outcome: agrees
