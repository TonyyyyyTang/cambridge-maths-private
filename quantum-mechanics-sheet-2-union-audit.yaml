      # q09 · independent rework for f7a64d81da9e

      Question SHA-256: `f7a64d81da9ecc1985d5b957cf86bee06ef6e3381143ad7c9e5b895714bed56a`.

      Originals: 2015-16 Q5 p1, 2015-16-mirror Q5 p3.

      Take the barrier to have constant height \(H=U=2E\) across its width, as in the rectangular barrier calculation. Only width and maximum height would be given for a general shaped barrier, which would leave its transmission undetermined.


      Let the incident coefficient be one and take \(k>0\). Outside the barrier the potential is zero. Put its faces at \(x=0,a\). The exterior waves are \(e^{ikx}+r e^{-ikx}\) on the left and \(c e^{ik(x-a)}\) on the right. Since the finite potential has no delta at a face, the function and its derivative are continuous. In the interior the equation is \(u''=2m(H-E)u/\hbar^2=k^2u\), where \(H\) denotes the barrier height. Matching at \(a\) fixes the interior solution without any remaining free constants apart from \(c\):
      \[
      u(x)=c\{\cosh(k(x-a))+i\sinh(k(x-a))\}.
      \]
      Write \(C=\cosh(ka)\), \(D=\sinh(ka)\). Matching value and derivative at zero gives \(1+r=c(C-iD)\) and \(i(1-r)=c(-D+iC)\). Addition after dividing the latter by \(i\) yields \(c=1/C\), then \(r=-iD/C\). The transmitted and incident waves have the same group velocity \(\hbar k/m\), so their current ratio is
      \[
      P_{\rm tr}=|c|^2=\operatorname{sech}^2(ka).
      \]
      The ordinary transmitted coefficient relative to \(e^{ikx}\) is \(ce^{-ika}\), which has the same modulus. The reflected fraction \(\tanh^2(ka)\) accounts for the complementary flux. When \(ka\downarrow0\) the fraction transmitted tends to one; at \(a=0\) there is free motion. Exactly \(k=0\) has zero incident flux and only a limiting scattering ratio. For \(ka\to\infty\) the transmitted fraction tends to zero.

      Numerical cross-check: both matching conditions at both faces and the flux sum were tested to \(10^{-40}\) at \((a,k)=(0.125,0.75),(1.7,1.25),(0,2.1)\).
    distinct_statement_outcome: agrees
