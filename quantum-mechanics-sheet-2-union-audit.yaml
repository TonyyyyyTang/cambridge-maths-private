  PDFium at 1.45; visually examined all 24 compiled pages and all 22 live Chrome screenshots. Actual generated TeX
  and private HTML contained complete expected question and solution fragments. Canonical receipts bind source and
  build hashes. Chrome at 1220 CSS pixels expanded all 18 dated solutions and followed the seven edition-specific
