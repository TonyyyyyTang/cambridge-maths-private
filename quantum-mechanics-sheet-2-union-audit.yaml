    blind_derivation_sha256: b6ced106bb04a5926ef465870ab3edd0489bfe61e63a2eacc4c2138853204842
    blind_derivation: |
      # q10 · independent rework for d8be8905b5f9

      Question SHA-256: `d8be8905b5f9b46f88b3067b22e9532ced04c8fa3ca757bafebcbb4d48c76fe7`.

      Originals: 2018-19 Q7 p2, 2019-20 Q7 p2.

      The Sheet 1, Example 9 reference supplies the attractive delta interaction and matching rule for \(\psi\). The two requested scattering amplitudes are computed below with \(f=\psi\).


      For incidence from the left, let the two exterior solutions be \(f(x)=e^{ikx}+r e^{-ikx}\) for \(x<0\), and \(f(x)=t e^{ikx}\) for \(x>0\). Each solves the free equation with \(E=\hbar^2 k^2/(2m)\). For the attractive interaction put \(\kappa=mU/\hbar^2>0\), which has units of inverse length. Continuity gives \(t=1+r\). Integration of the Schrödinger equation across zero gives \(ik(t-1+r)=-2\kappa t\): the delta integrates to \(-U f(0)\) and the energy term tends to zero with the integration interval. Hence \(ik r=-\kappa(1+r)\), so
      \[
      A_{\rm tr}(k)=t=\frac{k}{k-i\kappa},\qquad
      A_{\rm ref}(k)=r=\frac{i\kappa}{k-i\kappa}.
      \]
      The denominator is nonzero for every real \(k>0\). These coefficients multiply waves and are amplitudes. For real \(k>0\) the physical current fractions are \(k^2/(k^2+\kappa^2)\) and \(\kappa^2/(k^2+\kappa^2)\), with sum one and limits \(0,1\) respectively at threshold. A real-\(k\) wave is a continuum generalized eigenfunction, rather than an \(L^2\) vector.

      For complex \(k\) off the pole the same algebra gives a formal solution of the differential and matching equations. For nonreal \(k\) with nonzero real part the energy is nonreal, excluded from the self-adjoint Hamiltonian's spectrum. For pure imaginary \(k\ne0\) the energy is real and negative, but the incident-normalised solution away from the pole grows on at least one half-line. Specifically, in the upper half-plane the unit incident term grows on the left, and in the lower half-plane the transmitted term grows on the right. Such continuations are not physical scattering states or Hilbert-space eigenvectors. At \(k=0\) the displayed unit-incident expression collapses to zero; it does not supply a zero-energy bound state, since the exterior solutions there are affine and a square-integrable one must vanish.

      The two amplitudes have a simple pole at \(k=i\kappa\). First multiply the *whole wave* by \(k-i\kappa\). On the left this gives \((k-i\kappa)e^{ikx}+i\kappa e^{-ikx}\), on the right \(ke^{ikx}\). At \(k=i\kappa\) both pieces join to \(i\kappa e^{-\kappa|x|}\). Since \(\int_{\mathbb R} e^{-2\kappa|x|}\,dx=1/\kappa\), a unit vector is
      \[
      f_b(x)=\sqrt{\kappa}\,e^{-\kappa|x|},\qquad
      E_b=-\frac{\hbar^2\kappa^2}{2m}=-\frac{mU^2}{2\hbar^2}.
      \]
      For any negative energy the only square-integrable exterior waves are decaying exponentials. Their common amplitude is forced by continuity and their logarithmic slope by the jump, proving uniqueness up to phase. Positive-energy oscillatory exterior waves supply no \(L^2\) eigenvectors.

      Numerical cross-check: the matching residuals were checked for two real and two nonreal wavenumbers away from the pole. The rescaled pole limit agrees on both half-lines, its probability integrates to one, and the real-wavenumber flux sum equals one.
    distinct_statement_outcome: agrees
