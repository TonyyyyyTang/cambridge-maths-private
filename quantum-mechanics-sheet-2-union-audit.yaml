    blind_derivation: |
      # qx04 · independent rework for bb2f5f691be9

      Question SHA-256: `bb2f5f691be971a661368ae2e69f6be9db2bf8c0d65d39747ebd081e862e2524`.

      Originals: unresolved-header-2003-copyright-2004 Q8 p2.

      Use the ordered orthonormal energy basis \((\chi_1,\chi_2)\). The map sending \((c_1,c_2)\mapsto(c_2,c_1)\) has eigenvalues satisfying \(s^2=1\); for each sign one obtains the normalised eigenfunction \(\phi_\pm=(\chi_1\pm \chi_2)/\sqrt2\). Its two energy weights are both \(1/2\), so each expectation is \(\mu=(E_1+E_2)/2=E_1+\Delta E/2\).

      The first ideal \(+1\) measurement prepares \(\phi_+\). Under free evolution generated by the system Hamiltonian, the energy components gain respective phases \(e^{-iE_jt/\hbar}\). Projection onto \(\phi_+\) gives the amplitude \(A(t)=(e^{-iE_1t/\hbar}+e^{-iE_2t/\hbar})/2=e^{-i\mu t/\hbar}\cos(\Delta E\,t/(2\hbar))\). Its squared modulus is \(\cos^2(\Delta E\,t/(2\hbar))\), equal to one initially and zero at \(T=\pi\hbar/\Delta E\). The positive gap ensures \(T\) is finite.

      For \(n\) equal intervals, conditional on all previous outcomes being \(+1\), each interval starts in the same \(\phi_+\). For fixed \(T,E_1,E_2\), Taylor expansion at \(t=T/n\) yields
      \[
      A_n=e^{-i\mu T/(n\hbar)}\cos(\pi/(2n))
      =1-\frac{iT\mu}{n\hbar}+O(n^{-2}).
      \]
      The product rule for conditional probabilities gives \(P_n=|A_n|^{2n}=\cos^{2n}(\pi/(2n))\). For positive integer \(n\), Bernoulli’s inequality and \(\sin z\le z\) for \(z\ge0\) imply
      \[
      0\le1-P_n=1-(1-\sin^2(\pi/(2n)))^n\le n\sin^2(\pi/(2n))\le\pi^2/(4n).
      \]
      Thus \(P_n\to1\), even though the single unobserved interval of length \(T\) gives zero return probability. The product counts histories in which every measurement gives \(+1\).

      Numerical cross-check: the direct two-phase amplitude raised through \(n=1,2,10,100,1000\) reproduces the exact product and satisfies the one-sided bound.
