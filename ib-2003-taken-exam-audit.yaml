    independent_rework: '# IB/2003/P2/q1F — independent rework


      Differentiability at \(p=(a,b)\) means there is a linear map \(L:\mathbb R^2\to\mathbb
      R\) with \(f(p+h)-f(p)-Lh=o(\|h\|_2)\) as \(h\to0\). Testing on the coordinate
      axes forces \(L(h,k)=f_x(p)h+f_y(p)k\).


      Take a rectangle about \(p\) contained in the neighbourhood of existence of
      the partials. Split the increment at \((a,b+k)\). The one-dimensional mean value
      theorem along its horizontal and vertical segments gives \(h f_x(a+\theta h,b+k)+k
      f_y(a,b+\eta k)\), with intermediate parameters between zero and one; a zero-length
      segment contributes zero. The theorem applies because the coordinate sections
      are differentiable and hence continuous there. Both intermediate points tend
      to \(p\). By continuity of the partials at \(p\), the error from \(L\) is bounded
      by \((|h|+|k|)o(1)=o(\sqrt{h^2+k^2})\).


      The example is identically zero along each axis and at the origin, so the two
      partial derivatives there both exist and equal zero. Along \((t,t)\), \(t\ne0\),
      its value is \(1/2\). This rules out continuity at the origin and therefore
      differentiability.

      '
    main_comparison: Take horizontal and vertical increments separately and use the
      one-variable mean value theorem in a small rectangle. Continuity of the partials
      at its centre bounds the combined remainder divided by the step length. The
      example has zero axis partials and constant value one half on the punctured
      diagonal.
