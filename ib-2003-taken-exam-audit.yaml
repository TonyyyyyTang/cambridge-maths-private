      (a) Let \(G=e^{-x^2}\). From \(G^{(n)}=(-1)^nH_nG\) and differentiation one
      obtains \(H_{n+1}=2xH_n-H_n''\). With \(H_0=1\), induction gives degree \(n\)
      and leading coefficient \(2^n\). For any polynomial \(P\) of degree \(<n\),

      \[

      \int P H_nG\,dx=(-1)^n\int P G^{(n)}\,dx=\int P^{(n)}G\,dx=0

      \]

      over the whole line. Each integration by parts has zero boundary term since
      a polynomial times a Gaussian tends to zero at both infinities. Taking \(P=H_m\),
      \(m<n\), gives orthogonality, with the reverse index order by symmetry.


      (b) Differentiating \(G''=-2xG\) \(n\) times, Leibniz''s rule gives \(G^{(n+1)}=-2xG^{(n)}-2nG^{(n-1)}\)
      for \(n\ge1\). Divide by \((-1)^{n+1}G\) to obtain \(H_{n+1}=2xH_n-2nH_{n-1}\).
      The initial values are \(H_0=1,H_1=2x\). Comparing with the derivative relation
      in (a) also gives \(H''_n=2nH_{n-1}\).

      '
    main_comparison: Rodrigues differentiation gives the next Hermite polynomial from
      twice x times the current polynomial minus its derivative. Integration by parts
      n times against a lower-degree polynomial gives zero with vanishing Gaussian
      boundary terms. The derivative identity closes the three-term recurrence by
      induction.
