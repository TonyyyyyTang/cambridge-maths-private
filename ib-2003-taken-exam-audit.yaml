    independent_rework: "# IB/2003/P1/q16B — independent rework\n\nThe boundary equations\
      \ give \\(x+y=1\\) at intersection. On the unit circle this yields \\(i,1\\\
      ). Sketch the lens in the unit square by drawing the northeast quadrant of the\
      \ circle centered at \\(0\\) and the southwest quadrant of the circle centered\
      \ at \\(1+i\\), both joining those endpoints. Shade between the arcs, leaving\
      \ their boundaries open. For \\(0<x<1\\) its vertical sections run from \\(1-\\\
      sqrt{1-(x-1)^2}\\) up to \\(\\sqrt{1-x^2}\\).\n\n```\ni  o\n    ##########\n\
      \    #############\n    ################\n     #################\n     ###################\n\
      \      ####################\n       ####################\n        ####################\n\
      \          ###################\n            #################\n            \
      \  ################\n                 #############\n                    ##########\n\
      0                             o\n                              1\n```\n\nThe\
      \ shaded entries indicate the interior. The two open endpoints lie at i and\
      \ 1.\n\nSet \\(w=(z-1)/(z-i)\\). This sends the intersections to \\(0,\\infty\\\
      ), so the two circles become straight lines through \\(0\\). The first circle\
      \ contains \\(-1\\), where \\(w=1-i\\); the second contains \\(2+i\\), where\
      \ \\(w=(1+i)/2\\). A Möbius bijection on the sphere sends each disk onto one\
      \ of the corresponding half-planes. At the common interior test point \\(z=(1+i)/2\\\
      ), \\(w=-1\\). The intersection therefore maps precisely onto \\(3\\pi/4<\\\
      arg w<5\\pi/4\\). Squaring maps this sector bijectively to \\(\\Re W>0\\), doubling\
      \ its angular width to \\(\\pi\\) about angle \\(2\\pi\\); its derivative is\
      \ nonzero inside. Thus \\(W=((z-1)/(z-i))^2\\) works. Compose with \\((W-1)/(W+1)\\\
      ) to map onto the unit disk, since \\(|W-1|<|W+1|\\) exactly for \\(\\Re W>0\\\
      ) and the inverse is \\((1+\\zeta)/(1-\\zeta)\\).\n"
    main_comparison: The two Möbius choices send the lens vertices to zero and infinity
      in opposite order. The interior point (1+i)/2 and the midpoint of each arc select
      a sector of angle pi/2. Squaring is injective there and maps it onto the right
      half-plane. The final fractional-linear map gives the whole disc.
