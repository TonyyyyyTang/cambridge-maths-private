    independent_rework: '# IB/2003/P2/q16B — independent rework


      (a) Choose \(\widehat f(\lambda)=K\int f(x)e^{-i\lambda x}\,dx\), \(K\ne0\)
      constant. For a sufficiently regular decaying \(f\), integrating by parts twice
      gives \(\widehat{f''''}=-\lambda^2\widehat f\); two \(\lambda\)-derivatives
      under the integral give \(\widehat{x^2 f}=-\widehat f''''\). Substitution gives
      \(\widehat f''''-\lambda^2\widehat f=\mu\widehat f\). The identities also hold
      for tempered distributions. Some existence hypothesis is necessary: \(f=e^{x^2/2}\)
      solves the ODE with \(\mu=1\) yet has no ordinary Fourier transform. All functions
      required in (b)–(d) are Schwartz.


      (b) Put \(g=e^{-x^2/2}\). Substituting \(f=pg\) gives \(p''''-2xp''-(1+\mu)p=0\).
      The highest-degree term fixes \(\mu=-(2n+1)\). Writing \(p=\sum a_kx^k\) gives

      \[

      (k+2)(k+1)a_{k+2}+2(n-k)a_k=0.

      \]

      Set \(a_{n+1}=a_{n+2}=0\), choose \(a_n\ne0\), and solve downwards from \(k=n-1\)
      to \(0\); denominators never vanish. This constructs a solution unique up to
      its leading coefficient, including any nonzero constant for \(n=0\).


      (c) Since \(\widehat{x^k g}=i^k\partial_\lambda^k(cg)\) and \(g^{(k)}\) is \(g\)
      times a degree-\(k\) polynomial with leading coefficient \((-1)^k\) (differentiate
      \(Pg\) to get \((P''-\lambda P)g\)), the new polynomial has degree \(n\) and
      leading coefficient \(c(-i)^na_n\). Here \(c\ne0\), as is also seen by evaluating
      at zero.


      (d) By (a) the transformed Gaussian polynomial solves the equation with the
      same \(\mu_n\). By (b) it is proportional to \(p_ng\), with eigenvalue \(c(-i)^n\)
      in this convention.

      '
    main_comparison: The Fourier transform intertwines the oscillator equation in
      the Schwartz or tempered setting. For degree n the leading term enforces eigenvalue
      minus (2n+1) and the recurrence fixes each coefficient up to scale. Gaussian
      differentiation supplies Fourier eigenvalue c times (-i) to the nth power. The
      original ODE alone also admits non-transformable growing solutions.
