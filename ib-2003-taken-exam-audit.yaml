    independent_rework: '# IB/2003/P1/q15C — independent rework


      For smooth velocity use \((u\cdot\nabla)u=\nabla(|u|^2/2)-u\times\omega\). Take
      the curl of Euler''s equation and expand the curl of \(u\times\omega\), using
      \(\nabla\cdot\omega=0=\nabla\cdot u\):

      \[

      D_t\omega=(\omega\cdot\nabla)u+\rho^{-2}\nabla\rho\times\nabla p.

      \]

      For the intended homogeneous fluid the last term vanishes. Incompressibility
      alone does not require spatially constant density.


      The given field is divergence free with spatially uniform curl \(2\Omega(t)e_z\),
      and \(\partial_z u=2\beta e_z\). The stretching equation yields \(2\dot\Omega=4\beta\Omega\),
      giving \(\omega=2\Omega(0)e^{2\beta t}e_z\). If \(\omega_0\) denotes a magnitude,
      take the axial unit vector along the initial vorticity (or assume \(\Omega(0)\ge0\)
      with fixed positive \(e_z\)). Zero initial vorticity stays zero.


      For a marked point, \((r^2)''=2x\dot x+2y\dot y=-2\beta r^2,\ \dot z=2\beta
      z,\ \dot\theta=\Omega(t)\). Each point on the initial unit circle acquires the
      same angular offset, \(a(t)=e^{-\beta t}\) and \(z=e^{2\beta t}=a^{-2}\). Positive
      circulation about \(+e_z\) is \(2\pi a(\Omega a)=2\pi\Omega(0)\). This exemplifies
      Kelvin''s theorem, conserving circulation around a material loop for inviscid
      homogeneous flow with conservative body force, including zero force. Reversing
      orientation reverses the sign.

      '
    main_comparison: Curling Euler gives the homogeneous-fluid stretching law. With
      general density the extra term is the density gradient crossed with the pressure
      gradient divided by density squared. The material circle radius shrinks as exp(-beta
      t), its height is its inverse radius squared, and the signed circulation is
      2 pi Omega(0).
