    independent_rework: '# IB/2003/P1/q6C — independent rework


      For trajectory time \(\tau\), initial condition at \(\tau=s\) gives \(z(\tau)=0,\
      x(\tau)=\tau-s\). Then

      \[

      y(t)=\int_s^t \tau(\tau-s)\,d\tau=\frac{s}{2}(t-s)^2+\frac13(t-s)^3.

      \]

      All three coordinates vanish when \(t=s\), and differentiating at fixed \(s\)
      gives \((1,t(t-s),0)\). Eliminating \(s=t-x\) at fixed observation time yields
      \(z=0,\ y=tx^2/2-x^3/6\). Only releases at or before \(t\) contribute, so \(x\ge0\),
      or \(0\le x\le t\) if release starts at zero.

      '
    main_comparison: Integrating each released particle from its actual release time
      gives x=t−s and z=0. At fixed observation time the locus is y=t x squared/2−x
      cubed/6, restricted to the release interval.
