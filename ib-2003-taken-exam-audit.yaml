      Left and right nondegeneracy make \(B_L:U\to V^*,\ x\mapsto b(x,\cdot)\) and
      \(B_R:V\to U^*,\ y\mapsto b(\cdot,y)\) injective. Finite dimensionality implies
      both \(\dim U\le\dim V\) and the reverse inequality, so both maps are isomorphisms.
      Define \(C_L,C_R\) likewise for \(c\); bilinearity makes them linear. Put \(S=B_L^{-1}C_L\),
      \(T=B_R^{-1}C_R\). Evaluating \(B_L Sx=C_Lx\) on \(y\) and \(B_R Ty=C_Ry\) on
      \(x\) gives the two identities, with uniqueness from injectivity. The zero-dimensional
      case is included.

      '
    main_comparison: Nondegeneracy in both slots gives injections into the opposite
      duals. Finite dimension makes both isomorphisms, so inverting the respective
      pairing maps constructs the two unique endomorphisms.
