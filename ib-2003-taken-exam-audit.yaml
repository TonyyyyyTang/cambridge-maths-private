    independent_rework: '# IB/2003/P3/q19G — independent rework


      (a) Any idempotent \(P\) gives a vector-space direct sum: write \(u=(u-Pu)+Pu\);
      the first term lies in its kernel and the second in its image, on which \(P\)
      acts as identity. The intersection is zero since \(P\) acts as zero there as
      well. When \(P=P^*\), \(\langle x,Py\rangle=\langle Px,y\rangle=0\) for \(x\in\ker
      P\). Thus the sum is orthogonal.


      (b) Normality gives \(\|\phi x\|^2=\langle x,\phi^*\phi x\rangle=\langle x,\phi\phi^*x\rangle=\|\phi^*x\|^2\),
      whence \(\ker\phi=\ker\phi^*\). The adjoint identity gives \((\operatorname{im}\phi)^\perp=\ker\phi^*\).
      Therefore the algebraic decomposition from (a) is orthogonal. In that decomposition
      \(\phi\) is zero on the kernel and identity on the image. Pairing arbitrary
      decomposed vectors shows \(\langle\phi u,v\rangle=\langle u,\phi v\rangle\),
      as both equal the inner product of their image components.


      (c) Finite-dimensional positive definiteness gives \(U=W^\perp\oplus W\). Taking
      the \(W\) component gives a self-adjoint idempotent with image \(W\) by the
      preceding pairing argument. Conversely any such map has kernel \(W^\perp\) by
      (a), and its restrictions to both components are forced. Now \(\tau_2\tau_1=0\)
      iff \(\operatorname{im}\tau_1\subseteq\ker\tau_2\), equivalently \(W_1\subseteq
      W_2^\perp\).


      (d) For the given idempotent set \(K=\ker\phi,\ I=\operatorname{im}\phi\). Give
      \(K\oplus I\) the sum of the restrictions of the original inner product: \([k+i,k''+i'']=\langle
      k,k''\rangle+\langle i,i''\rangle\). This is well defined by unique decomposition,
      bilinear, symmetric and positive definite. Then \(\phi\) takes the \(I\) component
      and is self-adjoint for this new product. Zero and identity projections are
      covered.

      '
    main_comparison: Every idempotent fixes its image and vanishes on its kernel.
      For a normal operator the adjoint has the same kernel, which makes these summands
      perpendicular. The image fixes its orthogonal projector uniquely; any idempotent
      becomes orthogonal for an inner product adapted to the direct sum.
