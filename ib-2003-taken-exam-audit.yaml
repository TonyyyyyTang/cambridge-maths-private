      Take independent normal samples of sizes \(m=6,n=21\), with residual sums of
      squares \(A,B>0\). Maximization over each mean gives its sample mean since the
      residual sum separates into its centered value and the squared mean displacement
      times the sample size. Put \(u=1/\sigma_X^2,v=1/\sigma_Y^2\). The profiled log
      likelihood is

      \[

      \ell=(m\log u+n\log v-Au-Bv)/2+\text{constant}.

      \]

      It is strictly concave, has null maximizer \(u=v=(m+n)/(A+B)\), and unrestricted
      maximizer \(u=m/A,v=n/B\). For the one-sided fit \(u\le v\), the latter is feasible
      exactly when \(r=(A/m)/(B/n)\ge1\). Otherwise the maximum is on the common-precision
      boundary because there is no feasible interior stationary point and the likelihood
      goes to zero at the ends. Taking the closure leaves the alternative supremum
      unchanged.


      For \(r\le1\) the null-to-full maximized likelihood ratio \(\Lambda=1\). For
      \(r>1\), substitution gives

      \[

      \Lambda^2=r^m\left(\frac{m+n}{mr+n}\right)^{m+n}.

      \]

      Its log derivative is \(mn(1-r)/(r(mr+n))<0\). Reject for large \(r\), equivalently
      for large \(F=[A/(m-1)]/[B/(n-1)]\). Under the null, the two residual sums divided
      by the common variance are independent chi-squares of 5 and 20 degrees of freedom
      (normal residual projections of these ranks). Thus \(F\sim F_{5,20}\). Observed
      \(F=6/2=3\) exceeds the supplied 95th percentile 2.71. Reject equal variances
      at 5% in favor of a larger X variance. The threshold is in the strictly varying
      part of the profile.

      '
    main_comparison: The ordered variance model has a boundary optimum if the separate
      MLEs violate the ordering. On the other branch the likelihood ratio decreases
      in the observed ratio. Independent normal residual projections give F(5,20);
      the observed 3 exceeds 2.71.
