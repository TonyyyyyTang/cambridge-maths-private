      Treat the two rows as independent multinomial samples of fixed sizes \(N_i=500\).
      Under the alternative each row has probabilities \(p_{ij}\) with \(\sum_jp_{ij}=1\).
      The null restricts both rows to a common vector \(p_j\). Write \(O_{ij}\) for
      observed counts and \(C_j\) for column totals. The log likelihood up to a constant
      is \(\sum O_{ij}\log p_{ij}\). Lagrange multipliers on the row constraints give
      \(\hat p_{ij}=O_{ij}/N_i\); on the null the pooled counts give \(\hat p_j=C_j/1000\).
      Concavity and positivity of the observed counts give maxima. Null fitted counts
      are \(E_{ij}=N_i\hat p_j\). The null-to-full likelihood ratio gives

      \[

      G^2=2\sum_{ij}O_{ij}\log(O_{ij}/E_{ij}).

      \]

      Large values oppose homogeneity. The regular interior large-sample chi-square
      law has \(2(3-1)-(3-1)=2\) degrees of freedom by the likelihood-ratio theorem.
      For the Pearson form expand \(2(E+d)\log(1+d/E)=2d+d^2/E+O(|d|^3/E^2)\) with
      \(d=O-E\). The linear terms sum to zero and the remainder is \(o_p(1)\) under
      fixed positive cell probabilities as both samples grow proportionally. Hence
      \(X^2=\sum d^2/E\) has the same limiting null law.


      The counted rows are \((103,145,252),(140,136,224)\), yielding common fitted
      row \((121.5,140.5,238)\). The Pearson statistic is \(2(18.5^2/121.5+4.5^2/140.5+14^2/238)=7.56906\).
      The likelihood-ratio statistic gives \(7.59203\). Both exceed 5.99 and fall
      short of 9.21. With two degrees of freedom the upper tail is \(\exp(-x/2)\),
      giving about \(0.0227\) (Pearson) or \(0.0225\) (likelihood ratio). Reject homogeneity
      at 5%; evidence falls short at 1%. All expected counts are large.

      '
    main_comparison: The study fixes the two city totals. Row and pooled multinomial
      maximizers give identical fitted rows of (121.5,140.5,238). The likelihood ratio
      and Pearson values are 7.592 and 7.569 on two degrees of freedom. Both reject
      at 5% and retain at 1% using the original percentile table.
