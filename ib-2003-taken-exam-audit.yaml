      For a densely defined operator the Hermitian pairing identity is \(\langle \phi,A\psi\rangle=\langle
      A\phi,\psi\rangle\) for test states in the domain (inner product conjugate linear
      in the first entry). This proves symmetry; full self-adjointness also requires
      the domain of the adjoint to agree. For suitable wavefunctions on the line with
      sufficient decay and regularity, \(H=-(\hbar^2/2m)d^2/dx^2+V(x)\) has

      \[

      \langle\phi,H\psi\rangle-\langle H\phi,\psi\rangle

      =-\frac{\hbar^2}{2m}[\bar\phi\psi''-\bar\phi''\psi]_{-\infty}^{\infty}=0,

      \]

      using integration by parts twice and the reality of \(V\). This also holds on
      domains with the corresponding boundary cancellation. Reality of the potential
      alone does not prove self-adjointness of an arbitrary domain.


      Use a normalized Schrödinger solution with sufficient moments, derivatives and
      decay to justify the products and differentiation below. For a time-independent
      observable,

      \[

      d\langle A\rangle/dt=(i/\hbar)\langle HA-AH\rangle.

      \]

      This follows by differentiating both factors and substituting \(i\hbar\partial_t\psi=H\psi\).
      On suitable test states \(p=-i\hbar\partial_x\) gives \([p,x]=-i\hbar I\), \([p^2,x]=-2i\hbar
      p\), \([V,x]=0\), \([V,p]=i\hbar V''\) by the product rule, and \([p^2,p]=0\).
      Thus \(d\langle x\rangle/dt=\langle p\rangle/m\) and \(d\langle p\rangle/dt=-\langle
      V''\rangle\).

      '
    main_comparison: The double integration by parts exhibits the exact boundary pairing.
      For an unbounded Hamiltonian, self-adjointness also uses the adjoint domain.
      The position and momentum commutators yield the mean velocity and mean negative
      potential derivative.
