auditor_report: '# Independent blind rework of sampled 2003 Part IB Tripos questions


  The audit covers 15 assigned units on four papers. I read each question-only packet
  and its locator, visually compared its wording, symbols and subparts to a rendering
  of the specified original PDF page, and independently solved all requested parts.
  The three supplied table crops were checked against the original data and hints.
  Every packet matches its source, including the printed anomalies below. Each unit
  has a rework and a source record binding the original, question text, supplied figures
  and rework to their SHA256 digests. Figure keys are filenames under the packet''s
  figures directory.


  The material printed formula defect is in P3/q12D, page 5. The printed solution
  form leaves a mode-dependent denominator outside the sum, contains an extraneous
  slash after the final sine, and omits the factor 1/l required by the stated unit
  delta initial velocity. The rework derives the corrected series from its sine coefficients
  and treats each damping regime.


  In P2/q9A, page 4, the original reads “the statement than an operator”. This wording
  is preserved. Its Hermiticity argument assumes a suitable operator domain and vanishing
  boundary terms. The rework distinguishes symmetry on that domain from full self-adjointness.


  P2/q16B(a), page 7, presupposes an existing Fourier transform. The ODE alone admits
  exp(x²/2), outside the ordinary Fourier-transform setting. The rework specifies
  valid hypotheses for the identities and verifies them for all the requested Gaussian-polynomial
  solutions. In P1/q15C, page 7, the usual stretching law assumes the baroclinic term
  vanishes, as for a homogeneous fluid. A magnitude times an axial unit vector represents
  arbitrary initial rotation if that vector points along the initial vorticity (otherwise
  use the signed axial component). The rework records both details.


  Observed question-transcription discrepancies: 0/15. Canonical solutions, their
  histories, and previous verification evidence were excluded from this blind comparison.
  The canonical-solution error count must be determined by the separate reconciliation
  with the frozen reworks.

  '
main_resolution: The printed damped-string target cannot supply the prescribed delta
  projection without an interval normalization, and its modal denominator must be
  inside the sum. The reworks, nine independent weak projections, and the critical-mode
  limit agree. The oscillator Fourier argument requires transformability, the vorticity
  result requires vanishing baroclinic torque, and the quantum pairing uses an appropriate
  Hamiltonian domain. The city comparison gives 7.5691 on two degrees of freedom.
