      The integral of an absolute value of a continuous function exists and is nonnegative.
      If \(f(x_0)\ne0\), continuity gives a relative neighbourhood of \(x_0\) of positive
      length on which \(|f|\ge |f(x_0)|/2\), including when \(x_0\) is an endpoint.
      Hence the integral vanishes exactly for the zero function. Since \(|af(x)|=|a||f(x)|\)
      and \(|f(x)+g(x)|\le |f(x)|+|g(x)|\), integration gives absolute homogeneity
      and the triangle inequality. Thus it is a norm.


      Here \(\|x^n\|=2\int_0^1 x^n\,dx=2/(n+1)\to0\). Hence \(f_n\) converges in this
      norm to the zero function, which belongs to \(V\), and is Cauchy since \(\|f_m-f_n\|\le2/(m+1)+2/(n+1)\).
      Values at \(\pm1\) do not obstruct norm convergence.

      '
    main_comparison: Continuity makes a nonzero value persist on a set of positive
      length. The integral norm of the nth power on the symmetric interval is exactly
      2/(n+1), establishing both convergence to zero and the Cauchy property regardless
      of the endpoint values.
