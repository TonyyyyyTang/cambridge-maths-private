    independent_rework: '# IB/2003/P1/q14E — independent rework


      (a) The addition map \(U\oplus U''\to U+U''\) is onto. Its kernel is formed
      by the pairs \((w,-w)\), \(w\in U\cap U''\). Rank-nullity gives the stated dimension
      formula.


      (b) Every \((\alpha+\beta)v\) lies in \(\operatorname{im}\alpha+\operatorname{im}\beta\).
      By (a) this containing space has dimension at most the sum of the ranks.


      (c) Apply (b) to \(\alpha=(\alpha+\beta)+(-\beta)\), noting that negation preserves
      rank. Interchange \(\alpha,\beta\) and take the greater of the two signed differences.


      (d) Take \(\alpha\) diagonal with \(-1\) on the first \(r\) positions, zero
      elsewhere, and \(\beta\) diagonal with \(1\) on the first \(s\) positions, zero
      elsewhere. Their sum has its only \(s-r\) nonzero entries in positions \(r+1,\ldots,s\).
      For the second example use diagonal matrices with \(+1\) on the first \(r\)
      and last \(s\) positions respectively, zero elsewhere. Their supports cover
      all positions since \(r+s\ge n\). Their sum has diagonal entries \(1\) or \(2\),
      giving rank \(n\) over the reals. These work also for \(r=s\), \(r+s=n\), or
      \(s=n\).

      '
    main_comparison: The kernel of the addition map identifies with the intersection.
      Image inclusion gives the upper rank bound and applying it to either summand
      gives the absolute-difference lower bound. Opposing diagonal projections and
      overlapping positive diagonal projections respectively attain the two requested
      ranks.
