      original_pdf_sha256: 074e1d64d7da559ab528df312e62d9eec1b58d95cb5fa14794fb23c675964233
      source_page: 7
      question_packet_sha256: 8a9f55b3a40c282c4cfd078b7230c6bf9c653b35c76516b1854f4078493dec1c
      blind_rework_sha256: d1288e21036e12af3063daea157682bbac527ec98ac362671398a70e70fe6258
