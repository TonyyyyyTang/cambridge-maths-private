frozen_rework_text: '# Independent rework, Markov Chains Sheet 1 historical union

  Seed 20261125; Python random.Random(seed).sample(sorted(q01,...,q13,qx01,...,qx13),6)
  gave q01, q11, qx02, qx05, q08, q02. Only the six question.tex fragments were opened
  before writing this document. The random experiment uses fair independent tosses/throws.


  ## q01

  Let mu_t denote the law at time t. For every positive-probability history through
  time t, mutual independence gives P(X_{t+1}=j | history)=mu_{t+1}(j), a function
  of (in fact independent of) X_t. This is the Markov property. On a countable state
  space the precise necessary and sufficient condition for a time-independent kernel
  on feasible events is: whenever x has positive mass at both times s and t, mu_{s+1}=mu_{t+1}.
  Indeed each occurrence of x forces its one transition row to be that law. Conversely
  define the row from any such occurrence and fill unvisited rows arbitrarily. A common
  law for all variables from time 1 onward suffices and is necessary if all inputs
  have a common possible state (e.g. full support). If one fixes the canonical all-rows-equal
  kernels at every time, they coincide exactly when the successive laws from time
  1 onwards coincide. Different initial law allowed. Deterministic strictly increasing
  states give an independent time-homogeneous chain even with differing marginals.
  For arbitrary measurable spaces the conditional kernel criterion is existence of
  K(x,.)=mu_{t+1} for mu_t-almost every x for each t, with equalities interpreted
  in the usual kernel sense.


  ## q11

  Write T for absorption; the four transient states recur along 2,4,8,6,2. Each nonabsorbing
  step is a unique coin outcome of probability 1/2. From 2 or 4 the alternative ends
  at 0, and from 8 or 6 it ends at 10. Thus P(T>n)=2^{-n}, giving almost-sure absorption
  and ET=sum_{n>=0}2^{-n}=2. For k>=0 the success probabilities at 4k+3 and 4k+4 are
  16^{-k}/8 and 16^{-k}/16. These disjoint events give (1/8+1/16)/(1-1/16)=1/5. On
  success the number of complete cycles before the final one has geometric failures
  law (15/16)16^{-k}, hence mean 1/15. Within the final cycle success takes 3 or 4
  throws with conditional probabilities 2/3 and 1/3. Therefore E(T|success)=4/15+(6+4)/3=18/5.
  Endpoints are absorbing. All series converge by geometric bounds.


  ## qx02

  Given the old maximum i, the next maximum is max(i,D), where D is an independent
  fair die. This proves homogeneous Markov. Over n>=1 further throws and for j>=i,
  P(next maximum after n steps <=j | X_t=i)=(j/6)^n; for j<i it is zero. Thus p_ij(n)=0
  for j<i, (i/6)^n on the diagonal, and (j/6)^n-((j-1)/6)^n for j>i. At n=0 the transition
  is identity. At n=1 this gives 0, i/6, 1/6 respectively; row 6 is absorbing and
  all row sums are 1 by telescoping. The first observed maximum is X_1, uniform on
  the six faces.


  ## qx05

  The intended construction requires independence of the starting variable from the
  entire innovation sequence, plus measurable sections G(i,.). Under these hypotheses
  the innovation at t+1 is independent of the history (which is measurable with respect
  to X_0 and innovations 1,...,t). Conditioning on X_t=i gives row P_ij=Leb{u : G(i,u)=j}.
  Each row sums to one because its level sets partition the interval. Mere mutual
  independence of the Y''s as printed does not guarantee this. Example: let Y''s be
  independent uniforms, X_0=1{Y_2<=1/2}; for i=0,1 put G(i,u)=2, and G(2,u)=1{u<=1/2}.
  Then X_1=2 always and X_2=X_0; conditional probability of X_2=1 given X_1 alone
  equals 1/2, versus 1 given X_1=2,X_0=1. This is an actual failure of Markov. For
  any countable homogeneous transition matrix, enumerate the states; subdivide [0,1)
  in each row into consecutive half-open intervals of lengths P_ij; set G to the interval''s
  state and define G(i,1) arbitrarily. Take independent initial state with the required
  law and independent uniform draws. This realizes the entire chain law by multiplying
  conditional probabilities. Simulate by drawing the initial state, and at each step
  sample a fresh pseudouniform and return the first state whose row cumulative probability
  strictly exceeds it. Homogeneity is implicit for fixed G and uniform iid innovations;
  general time-dependent kernels require time-dependent G or store the clock in the
  state. Endpoint 1 is null; zero rows entries correspond to empty intervals.


  ## q08

  Let a_n,b_n,c_n be the probabilities of the three states starting from 1. The row
  updates give a_{n+1}=p c_n and c_{n+1}=b_n/3. Substitution gives 3a_{n+2}+a_{n+1}+p
  a_n=p with a_0=1,a_1=0. A particular constant is L=p/(4+p); a_n-L solves the recurrence
  with characteristic roots (-1 +/- sqrt(1-12p))/6. The two initials and recurrence
  guarantee uniqueness.

  (a) p=1/16. L=1/65, roots -1/12,-1/4, coefficients in that order 18/13 and -2/5.
  Indeed their sum is 64/65 and their weighted sum is -1/65. So a_n=1/65+(18/13)(-1/12)^n-(2/5)(-1/4)^n.

  (b) p=1/6. L=1/25 and roots (-1 +/- i)/6=(sqrt(2)/6)exp(+/- 3pi i/4). Thus a_n=1/25+(sqrt(2)/6)^n
  [(24/25)cos(3pi n/4)+(18/25)sin(3pi n/4)]; coefficients are fixed by n=0,1.

  (c) p=1/12. L=1/49 and root -1/6 is double, so a_n=1/49+(48/49-6n/7)(-1/6)^n. Again
  n=0,1 directly check initial values.


  ## q02

  For binary M_n, M_{n+1}=max(M_n,X_{n+1}); the fresh toss is independent of the entire
  history. Starting from 0 either value on the next step has probability 1/2. Starting
  from 1 the maximum stays 1. Hence the kernel in order (0,1) has rows (1/2,1/2) and
  (0,1). Since M_0=X_0 each start has probability 1/2; after k steps row 0 is (2^{-k},1-2^{-k}),
  row 1 (0,1), also valid at k=0.

  '
