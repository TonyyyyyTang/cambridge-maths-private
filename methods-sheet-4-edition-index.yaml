schedule_comparison: 'Archived 2025–26 schedules (SHA256 58933e1f1ec0985d2ce1ac79fadc70cfe084273aaaeba5a2ebfc22667ca7f033),
  physical p.18 (printed 17): earlier Cartesian tensor and variational calculus exercises
  lie outside the modern Methods list. Derivations of Laplace and wave equations and
  Rayleigh quotients partly overlap Methods through their results. The Bessel transform
  calculation extends the listed PDE and Bessel theory.'
combined_position_policy: One printed number has one ordered occurrence. Earlier classification
  Q3 contains both modern Q2 and Q3; 2016 string Q7 contains both modern Q10 and Q11.
  Subpart matches name both targets without inventing additional numbered questions.
