    independent_rework_sha256: d382404df31dcbbb6302c8373f08ea2f909f73d53199c36ff0949513f26575e1
    independent_rework: |
      Differentiability at x means there is a linear L:R^m→R^r with f(x+h)−f(x)−Lh=o(||h||); uniqueness follows by setting h=tv for each fixed v and taking t→0. Write f′(x)=L. In any submultiplicative matrix norm the cubic expansion gives p′(A)H=A²H+AHA+HA²−3H. The remaining terms AH²+HAH+H²A+H³ have norm at most 3||A||||H||²+||H||³. The derivative depends continuously on A.

      The inverse function theorem says that for a C¹ function between open sets in R^m with f′(a) invertible, some open neighbourhood U of a is mapped bijectively onto an open neighbourhood V of f(a), and the inverse g is C¹ with g′(y)=[f′(g(y))]^{-1}. For the normalised case choose a closed ball of radius R inside the domain on which h(x)=x−f(x) has ||Dh||≤1/2, by continuity. Integration along segments gives Lip(h)≤1/2 there and h(0)=0. For ||y||<R/2, x↦y+h(x) maps that complete ball into itself and is a contraction, so it has a unique fixed point g(y). Its norm is at most 2||y||<R. Fixed points solve f(x)=y. On V=B(0,R/2) the fixed point inequality yields ||g(y)−g(z)||≤2||y−z||. Hence g is a continuous inverse on the open preimage U=B(0,R)∩f^{-1}(V).

      Take A=2I. Then p(2I)=I and p′(2I)H=9H. Identify matrices with R^{n²}; the theorem gives a C¹ inverse branch on some ball about I. There is no global two-sided inverse since p(0)=p(√3 I)=−I. Even if “inverse” is meant as a right inverse, no global continuous branch exists. Indeed take D(t)=diag(t+1,…,t+n), whose entries are distinct. Any real solution of p(X)=D(t) commutes with D(t), and hence is diagonal by the entrywise commutation equations. A continuous right inverse would therefore give a continuous real x(t) satisfying x³−3x−1=t+1 for every t. Necessarily x(t)→±∞ as t→±∞ (the scalar cubic grows without bound with the respective sign). Its image is thus all of R by the intermediate value theorem; a right inverse with full image would force the cubic to be injective, contrary to its values at 0 and √3.
    comparison: Both cubic expansions preserve multiplication order. The contraction maps a closed ball into itself,
      its inverse image neighbourhood is open, and the inverse is Lipschitz. At 2I the derivative is 9 times the identity.
      The two right-inverse arguments use diagonal commutation with simple spectrum to force an impossible continuous
      scalar branch.
    substantive_error: false
    check:
      returncode: 0
      stdout: Noncommuting derivative and all higher coefficients, local Jacobian and global noninjectivity verified.
