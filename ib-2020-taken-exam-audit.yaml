    independent_rework_sha256: 99e219ee69f8f69ee813555c3f80729c47401a9bac912c7f38f3e89abf78e8b9
    independent_rework: |
      (a) For an LMM the order is p if insertion of any sufficiently smooth exact solution in a step produces an unnormalised residual O(h^{p+1}) and order p+1 does not hold in general. Equivalently, the residual vanishes on polynomials through degree p and fails for some polynomial of degree p+1. For a zero-stable scheme this yields O(h^p) global accuracy on bounded time intervals with sufficiently accurate starting values and the usual regularity assumptions.

      (b) With origin at t_{n+1}, regard the step as approximating h∫₀¹ y′(t_{n+1}+sh)ds by a three-point quadrature with nodes −1,0,1 and weights −(α+β),β,1+α. The weights sum to 1 identically, giving order at least 1. First moment 1+2α+β must equal 1/2 for order ≥2; second moment 1−β must equal 1/3 for order ≥3. Explicitness requires α=−1. Except when β=3/2 this gives order exactly 1; that exception is second order since 1−β=−1/2≠1/3. Simultaneously matching the first two moments yields β=2/3, α=−7/12. The third moment equals the first since s³=s at all three nodes, hence equals 1/2 instead of 1/4. The order is exactly 3. Moment conditions follow by Taylor expansion of y′; the first mismatched moment gives a nonzero defect on a polynomial of the appropriate degree.

      (c) The first characteristic polynomial is ρ(z)=z²−z and the second is σ(z)=(1+α)z²+βz−(α+β); ρ(1)=0 and ρ′(1)=1=σ(1), so the scheme is consistent for every pair of coefficients. The roots 0 and 1 meet the root condition (the only unit root is simple), hence zero-stability. The consistency and zero-stability theorem for multistep methods gives convergence for each fixed α,β on fixed bounded intervals with consistent starting data and a regular, Lipschitz-in-y right hand side. For implicit coefficients the step is uniquely solvable for sufficiently small h by contraction when h|1+α|Lip(f)<1.
    comparison: The independent midpoint-node quadrature moments confirm the generic explicit order one, exceptional
      order two at β=3/2, and unique order-three pair (−7/12,2/3). Independently verified the first unmatched term gives
      order exactly three. The unit root is simple and consistency holds for all parameters.
    substantive_error: false
