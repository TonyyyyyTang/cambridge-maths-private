    independent_rework_sha256: e6ea994cd81ff141b91775267bb6026a7f1c60fe4e182e024fa9f79e4abde172
    independent_rework: |
      (a) Translations within the plane and reflection in the xz plane imply that the field generated by the uniform sheet is along y and depends only on z (B is axial, so its x,z components reverse under that reflection). Reflection in z=0 reverses its y component between sides. Choose a rectangular loop in the yz plane of width L along y with oriented normal +e_x. Along its upper side the positive direction is −e_y and on the lower side +e_y. The conduction current through the rectangle is KL, so Ampère gives L(B_y^−−B_y^+)=μ₀KL for symmetric heights. Therefore B^+=−μ₀K e_y/2 and B^−=μ₀K e_y/2 at every height, in the absence of imposed background fields. The jump e_z×(B^+−B^−)=μ₀K e_x=μ₀ K_vector.

      (b) At r>0, E=Q(t)e_r/(4πε₀r²) and J_d=ε₀∂_t E=I e_r/(4πr²). Rotations about z and reflection in meridional planes force the generated axial field to have only an azimuthal component, constant along a latitude circle. For 0<θ<π/2 take the outward northern spherical cap. No conduction current crosses it; its displacement current is (I/(4π))∫₀^{2π}∫₀^θ sin u du dφ=I(1−cosθ)/2. The positively oriented boundary points along +e_φ, so 2πr sinθ B_φ=μ₀ I(1−cosθ)/2. Thus B=[μ₀ I/(4πr)]tan(θ/2)e_φ. The axis limit is zero by continuity, irrespective of the azimuthal basis singularity.
    comparison: Both Ampère loops yield opposite y-fields and the stated normal cross-product jump. The spherical cap
      subtends 2π(1−cosθ); the outward displacement current and positive azimuthal orientation give the printed half-angle
      field and zero on the axis.
    substantive_error: false
    check:
      returncode: 0
      stdout: Sheet circulation, cap flux and local Ampere-Maxwell law verified.
