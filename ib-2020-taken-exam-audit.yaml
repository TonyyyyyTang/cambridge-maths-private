    independent_rework: |
      The circle centred at c=(1+i√3)/2 meets the real line at 0 and 1. Take w=z/(1−z); its inverse is z=w/(1+w). Since Im z=Im w/|1+w|², the lower half-plane condition is Im w<0. Multiplying |z|²−2Re(z conjugate(c))<0 by |1+w|² leaves −2Re(w conjugate(c))<0, since 2Re(c)=1. Thus w runs exactly over the sector −π/6<arg(w)<0; neither the pole of the inverse nor the origin lies in it. The power w↦u=w⁶ maps this sector conformally and bijectively to Im u<0; its inverse selects arg(u)/6 with −π<arg u<0. The Cayley map (u+i)/(u−i) sends this lower half-plane conformally onto the disc (the squared distance to −i is smaller than that to i there). Composition gives [z⁶+i(1−z)⁶]/[z⁶−i(1−z)⁶].
    comparison: Both maps send the lens to the sector with arguments between −π/6 and zero. The sixth power and correctly
      signed lower-half-plane Cayley map agree. The inverse branch covers the entire sector.
