    independent_rework_sha256: 8dcaa6a1f33a27397f5ae0510cf8f3868852c3629a17b07880e8ddaa89929eba
    independent_rework: |
      Put k_n=nπ/a, g_n=(2/a)∫₀ᵃg(v)sin(k_n v)dv. Expand φ=Σu_n(x)sin(k_n y), the Dirichlet sine basis. Each mode obeys u_n″−k_n²u_n=g_n δ₀. On the left decay requires c_- exp(k_n x), on the right c_+ exp(−k_n x). The absence of a δ′ forces continuity, hence c_-=c_+. Integrating across zero, u_n′(0+)−u_n′(0−)=g_n, so c_+=−g_n/(2k_n). Therefore φ=−Σ [g_n/(2k_n)]exp(−k_n|x|)sin(k_n y). These modes satisfy each boundary condition, and the homogeneous matching equation has only zero coefficients. Smooth g with zero endpoint values gives convergence (twice integrating its coefficients by parts suffices); differentiating at the interface is understood distributionally.

      For g=δ_c, g_n=(2/a)sin(k_n c). The on-axis answer is the following kernel with b=0; translation supplies arbitrary b:
      G(x,y;b,c)=−(1/π) Σ_{n≥1} exp(−k_n|x−b|) sin(k_n y)sin(k_n c)/n.
      The series is absolutely convergent for x≠b and gives its distributional extension across the source. For a closed form, set s=π|x−b|/a, u=πy/a, v=πc/a. Using twice the sine product as a cosine difference and Σrⁿcos(nv)/n=−(1/2)log(1−2r cos v+r²) for 0≤r<1 gives G=(1/(4π))log[(cosh s−cos(u−v))/(cosh s−cos(u+v))]. This extends across x=b away from y=c and has the positive-Laplacian singularity (1/(2π))log(distance)+O(1).
    comparison: The sine modes, derivative jump, negative coefficients, distributional point source, horizontal translation
      and logarithmic kernel agree. Checked the positive sign of the fundamental singularity and the Dirichlet conditions.
