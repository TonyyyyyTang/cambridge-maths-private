    independent_rework_sha256: 44175665337966ef4983ac6363c124116020fa5170829fa1813d4df9e1a39713
    independent_rework: |
      A stationary state has time evolution e^{−iEt/ℏ}ψ for an energy eigenstate (possibly within a degenerate eigenspace), by the time-dependent Schrödinger equation. The conjugate phase from the bra cancels this phase in the expectation of a time-independent Q, yielding ⟨ψ,Qψ⟩.

      Inside the well the Hamiltonian acts as −ℏ² d²/(2m dx²) with zero endpoints. Each supplied sine obeys these conditions with eigenvalue E_j=j²π²ℏ²/(2ma²). Orthogonality and normalisation give |c₁|²+|c₂|²=1. Linearity yields coefficients c_j exp(−iE_jt/ℏ) at time t; projection onto each energy therefore has probability |c_j|², and all other energies have probability zero.

      Reflection x↦a−x shows each diagonal position element is a/2. Putting u=πx/a, or using 2 sin s sin 2s=cos s−cos 3s, the off-diagonal element equals a^{-1}∫₀ᵃ x[cos(πx/a)−cos(3πx/a)]dx. Since ∫₀ᵃ x cos(kπx/a)dx=a²[cos(kπ)−1]/(kπ)², the result is −16a/(9π²). Hence ⟨x⟩=a/2−(32a/(9π²))Re(conjugate(c₁)c₂ exp(−iωt)), with angular frequency ω=(E₂−E₁)/ℏ=3π²ℏ/(2ma²). A vanishing coefficient makes the oscillation amplitude zero. Finally 2|c₁c₂|≤|c₁|²+|c₂|²=1 proves the required bound, with equality attainable for equal magnitudes and aligned or opposed time-dependent phases.
    comparison: The eigenstate phases, energies, weights, off-diagonal matrix element −16a/(9π²), conjugation, angular
      frequency and sharp bound agree, including a single occupied level.
