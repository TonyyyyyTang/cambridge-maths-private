    independent_rework_sha256: 786754e0582c6c1dcf0e1c170ddb160b08a403bae714ec34535d4eb7a5b8748f
    independent_rework: |
      (a) The polar components are u_r=Aγr^{γ−1}cos(λθ), u_θ=−Aλr^{γ−1}sin(λθ). Substitution in the divergence gives A(γ²−λ²)r^{γ−2}cos(λθ), so positivity forces γ=λ. No penetration requires u_θ=0 at both faces, hence λ=nπ/α for a positive integer n. The sine has internal simple zeros, with changes of sign, for n≥2. Thus γ=λ=k=π/α>1.

      (b) A streamfunction is ψ=Ar^k sin(kθ), since (u_r,u_θ)=(r^{-1}∂_θψ,−∂_rψ). In the interior its contours have r=r_min[sin(kθ)]^{−1/k}, where r_min>0 is attained on the bisector. The streamlines are symmetric round the bisector. On the upper face they approach from infinity, bend around the vertex and return towards infinity parallel to the lower face, with θ decreasing. Indeed near θ=0, θ is asymptotic to (r_min/r)^k/k, so the perpendicular distance to the face tends to zero (k>1); the upper-face limit is symmetric. Both walls are limiting streamlines. A schematic drawn at α=π/2 uses the exact contours xy=r_min²/2, with y increasing upward; arrows denote flow.

          y
          ↑│ ↓  ↓    ↓
           │ │  │    ╲
           │ │   ╲    ╲____→
           │ ╲    ╲______→
           │  ╲________→
          O└────────────────→ x

      (c) Adding squared components gives |u|²=(Ak)²r^{2k−2}. For steady inviscid irrotational flow of constant density ρ without a body-force potential varying in the plane, Euler’s equation integrates to p+ρ|u|²/2=constant throughout the connected wedge. Thus p(r)=p₀+(ρu₀²/2)[1−(r/r₀)^{2k−2}], independent of θ. Since k>1 the vertex is a stagnation point in the limit and p(vertex)−p₀=ρu₀²/2.
    comparison: The Laplacian, no-penetration and fixed angular sign yield π/α. The streamfunction gives the same contours
      and minimum on the bisector as the canonical streamline ODE. Flow orientation, vertex pressure and all four labelled
      curves in the right-angle sketch agree.
