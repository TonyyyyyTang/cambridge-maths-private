    independent_rework: |
      Similarity means B = S^{-1}AS for an invertible change-of-basis matrix S over the underlying field. For a characteristic polynomial splitting over that field, the Jordan form is a similar block diagonal matrix with Jordan blocks J_k(λ) (λ on the diagonal, ones immediately above and zeros elsewhere). The Jordan theorem gives existence and uniqueness up to block permutation.

      Set N=A−I and M=B−I. The rows of N are (3,6,−15),(1,2,−5),(1,2,−5), so N is the outer product (3,1,1)^T(1,2,−5). Its square vanishes since 3+2−5=0. On the other hand the first entry of M² is (0,−3,3)·(0,−2,−1)=3. If A,B were similar then (B−I)²=S^{-1}(A−I)²S=0, a contradiction. This rules out similarity over either the real or the complex numbers.
    comparison: The rework distinguishes the matrices by (A−I)²=0 and (B−I)²≠0. The canonical ranks 1 and 2 give the
      same obstruction; checked the third-row linear dependence and splitting hypothesis for Jordan form.
    substantive_error: false
    check:
      returncode: 0
      stdout: The ranks at eigenvalue one and the two incompatible Jordan block structures verified.
      script_sha256: 22187f2a7fdf1228592e55aa069509dbb9f95e7e28c9134ea9730f076d9a1404
