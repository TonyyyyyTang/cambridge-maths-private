    independent_rework: |
      Conditional independence given μ makes the posterior density proportional to exp{−[Σ(x_i−μ)²+τ²(μ−θ)²]/2}. Completing the square gives a normal with precision n+τ² and mean m=(Σx_i+τ²θ)/(n+τ²). At θ=0, conditional on the true μ, the bias is −τ²μ/(n+τ²) and the variance is n/(n+τ²)². Their squared-bias-plus-variance sum is (τ⁴μ²+n)/(n+τ²)². If “mean squared error” averages jointly over the specified prior, use Eμ²=τ^{-2} to get 1/(n+τ²). This also equals the conditional posterior expected squared error for every observed sample, since the posterior variance is constant.
    comparison: Posterior precision and mean, conditional bias and variance, fixed-μ MSE and the integrated MSE all agree.
      Both expectations distinguish true μ from the random prior.
