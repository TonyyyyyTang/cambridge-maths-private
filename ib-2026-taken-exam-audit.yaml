  blind_input: Only thirteen question.tex fragments, the printed circuit diagram and original source locators. Full
    proofs were written and hashed in one UTF-8 file before the originals, canonical answers, review notes, check
    results or rendered outputs were opened.
  sampling: One random.Random(20261201) instance; iterate alphabetically sorted course IDs, draw sample(sorted(full_ids),
    ceil(len(full_ids)/5)) independently within each stratum with successive RNG state.
