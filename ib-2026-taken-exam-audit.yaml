initial_issue_descriptions:
  circuit-glyph: Part (a) and part (b) show a calligraphic C, confirmed in the original page image and by its CMSY10
    math glyph; initial question.tex uses ordinary $C$ in both positions. Mathematical interpretation and answer
    unchanged.
  double-list-markers: The browser adds automatic integer markers to the explicit printed subpart labels, e.g. 1.
    (a). Nested subparts are also duplicated. Ordinary unlabeled ordered lists should keep their markers.
  hint-bracket: The closing bracket of the quantum-mechanics hint renders alone beneath its displayed identity in
    both the compiled paper and the HTML page; in the original it closes on the identity line.
blind_exact_utf8_sha256: 2e4db148b925e5f6fe2defabfb7497a8027d21f41253d42b2028cf0d92b3361c
blind_exact_utf8: |
  IB/2026/P1/q1G
  Symmetry, real bilinearity and nonnegativity follow from pointwise multiplication and linearity of integration. If the continuous polynomial has nonzero value anywhere in [0,1], its square is bounded below by a positive constant on a subinterval of positive length, including for a nonzero endpoint value. Thus zero norm gives the zero polynomial by the polynomial identity theorem. The constant 1 has norm one. Subtract its projection from t to get t-1/2, whose squared norm is 1/3-1/2+1/4=1/12. The resulting spanning orthonormal pair is 1, sqrt(12)(t-1/2).

  IB/2026/P1/q3.2C
  sin z is entire, residue zero. Its first-order zero, with derivative 1, gives 1/sin z a simple pole with residue 1, and z/sin z a removable singularity with extension 1 and residue 0. Substitution in the sine power series gives infinitely many negative odd powers of z in sin(1/z), including coefficient 1 of z^-1: essential, residue 1. Multiplication by z leaves infinitely many negative even powers, so essential, residue 0. The reciprocal has poles at 1/(k pi) for all nonzero integers k (simple zeros of the denominator there), accumulating at zero; the singularity at zero is non-isolated, with no residue.

  IB/2026/P1/q8E
  Similarity is change of basis. The Jordan matrix consists of blocks with constant eigenvalue on the diagonal, ones on the superdiagonal, zeros elsewhere, unique up to block permutation counting multiplicity. D decreases total degree so D^5=0 and the sole eigenvalue is zero. Under coordinates u=z-w, v=w, D=d/dv at fixed u, hence its kernel is polynomials in u, necessarily of degree at most two by setting w=0. Conversely 1,u,u² lie in the kernel; there are three blocks. D^4(z²w²)=24, giving a block of length five. The symmetric subspace has such a chain and the antisymmetric invariant subspace has total dimension three (one basis difference per unordered unequal pair of exponents); z²w-zw² has successive derivatives z²-w², 2(z-w), 0, a full chain there. The symmetric and antisymmetric spaces split V over C; the third block has length one. Polynomials of an upper triangular Jordan conjugate are upper triangular with diagonal g(lambda_i), showing the asserted multiplicities. A cyclically shifts the standard basis, so B=aI+bA+cA²+dA³; A has characteristic polynomial t^4-1 (cyclic basis or determinant). The eigenvalues of B are a+b+c+d, a-b+c-d, a-c+i(b-d), a-c-i(b-d), with coincidences counted.

  IB/2026/P1/q13B
  The standard Schrödinger kinetic energy p²/(2m) is the nonrelativistic expansion for positive rest mass; a massless particle has E=c|p| with no such limit. Dirichlet walls require zero values at ±a and zero outside. Positivity of the Dirichlet energy and exclusion of a nonzero constant give E>0. Solving inside gives the sine at k_n=n pi/(2a), E_n=hbar² pi² n²/(8ma²). Integrating in s=x+a from 0 to 2a, the product-to-sum formula integrates to zero for differing integers; the squared sine integrates to a. Thus choose A=1/sqrt(a), up to phase. Prepared state is normalized since its squared sine integrates to a/2 on [0,a]. Its continuous joined halves have a derivative jump at zero; use the quadratic form (hbar²/2m) integral |psi'|², finite since psi lies in H0^1. The derivative on (0,a) is sqrt(2/a)(2pi/a)cos(2pi x/a), zero on (-a,0). Mean energy is 2 hbar² pi²/(ma²), i.e. 16 E_1. Write c_n=sqrt(2) integral_0^1 sin(2pi y)sin(n pi(y+1)/2) dy. Even n=2k give orthogonality of integer sines, only c_4=1/sqrt(2) survives. For odd n the second sine equals sin(n pi/2)cos(n pi y/2); integrating the two sum-frequency sines gives c_n=8 sqrt(2) sin(n pi/2)/[pi(16-n²)]. Consequently 16=8+(128/pi²) sum_odd n²/(n²-16)², and B=16.

  IB/2026/P1/q18H
  T is {0,1,...,infty}-valued with {T<=n} measurable in the history through n. On {T finite}, conditionally on the stopped history the future is the chain restarted at X_T. For first growl, wait means from bark and whine solve b=1+w/2, w=1+2b/3, giving b=9/4. For the first completed growl-whine pair the current last sound tracks its prefix. b=1+(g+w)/2, g=1+2b/3, w=1+2b/3+g/3, hence b=39/4. Finite means in both cases follow from a uniformly positive probability of completing within three moves, iterated in blocks. Augment with level N_b-N_w counting produced sounds after the initial dog bark. Stop on reaching m. Up moves have size one and always end at bark. For one-level ascent conditional on previous sound, the restart equations are beta=1+gamma/2+(omega+beta)/2, gamma=1+(omega+beta)/3, omega=1+gamma/3. A down step requires two ascents, ending the first at bark. The finite candidate is beta=10, gamma=21/4, omega=11/4. To justify finiteness beforehand put F(k,i)=10(m-k-1)+s_i, s=(10,21/4,11/4), for k<m, and 0 at the barrier. The same algebra gives F=1+PF before stopping; it is nonnegative, so optional stopping at bounded T wedge n yields E(T wedge n)<=F at the start. Taking n to infinity gives finite mean and validates first-step and strong-Markov equations for each one-level ascent. Starting at (0,bark) gives 10m outputs (with the dog's initiating sound excluded).

  IB/2026/P2/q10F
  If f is C¹ on an open subset of R^n and Df(x0) invertible, there are open neighborhoods U of x0 and V of f(x0) such that f:U->V is bijective with C¹ inverse and D(f^-1)(y)=Df(f^-1(y))^-1. All zeros are interior by the boundary assumption, and the theorem gives isolating balls by local injectivity. The zero set is closed in the compact closure and hence compact; a cover by isolating balls has a finite subcover. Choose disjoint closed balls centred at the finitely many zeros, lying in the interior. Shrink them by continuity to ensure ||A_k^-1(Df-A_k)||<=1/4 there, A_k=Df(x_k). The complement of open balls in the closure is compact and has strictly positive minimum of ||f|| if nonempty. Choose delta below that minimum, below 1/(4||A_k^-1||), and below r_k/(4||A_k^-1||) for all k. Uniform closeness in the interior extends to the closure by continuity. No zero of g lies on the complement. The map T(x)=x-A_k^-1 g(x) on each closed ball has derivative norm <=1/2, hence Lipschitz constant <=1/2 by the segment formula, and centre displacement <r_k/4. Therefore it maps the closed ball strictly inside and has a unique fixed point by contraction. At that point A_k^-1 Dg differs from I in norm by at most 1/2, giving an invertible straight-line path from I and positive determinant; signs agree. Sum signs for equality. If no zeros use compactness and small uniform perturbation directly (empty domain vacuous). The supplied lemma's smallness bound over the whole ball is unnecessary and cannot just be inferred from small centre displacement.

  IB/2026/P2/q14D
  Separate T''+c²lambda T=0, Theta''+m²Theta=0 by dividing by R Theta T, using 2pi periodicity (m integer, m=0 constant); radial equation becomes -(rR')'+m²R/r=lambda rR. The regular Dirichlet spatial forms have positive eigenvalues by integration of the radial energy (zero energy would force a constant vanishing at r=1). z=sqrt(lambda)r gives z²R''+zR'+(z²-m²)R=0. Frobenius gives (p²-m²)a0=0; choose p=|m| for a regular leading term, logarithmic alternative at zero order is excluded. With negative-index coefficients zero, [(p+k)²-m²]a_k=-a_(k-2) for k>=1; all odd terms vanish. Write coefficient of z^(m+2l) in J_m as (-1)^l/[2^(m+2l) l!(m+l)!]. On z^m J_m differentiating pulls down 2(m+l), giving term-for-term z^m J_(m-1) for m>=1. On z^-m J_m the constant drops out and differentiation gives factor 2l; shift l by one to get -z^-m J_(m+1). At m=0 the first formula uses J_-1=-J_1 and the second gives J'_0=-J_1. Pure radial solution is sum over j=j_0n of J0(jr) (A_n cos(cjt)+B_n sin(cjt)). Project in L²(r dr) and divide by N=J1(j)^2/2: A=<phi,J0>/N and B=<psi,J0>/(cjN). For the data B=0 and A=(2/J1(j)^2) sum_{l>=0} (-j²/4)^l/[(l!)²(2l+2)(2l+3)], by integrating r^(2l+1)(1-r); uniform convergence of the entire power series on the integration interval justifies this explicit value.

  IB/2026/P2/q16D
  For a moving closed loop with material velocity v, emf=int_C (E+v cross B).dl=-d/dt integral_S B.n dS, with boundary orientation by the right-hand rule. Adopt +z normal and positive current along +y on the bar. Flux is LxB; I=-(L/R)(x B'+B x'), and force is I L B in +x. Neglect self field and friction, giving m x''=-(L²/R)(B B'x+B²x'); for B=B0/(1+t) this gives the printed ODE with alpha=L²B0²/(mR). At alpha=1, setting u=1+t and x=u w gives u w''+(2+1/u)w'=0, hence w'=C u^-2 exp(1/u) and x=u(A+B exp(1/u)). At u=1 initial rest gives A=0, initial displacement B=x0/e. Thus x=x0 u exp(1/u-1), velocity=x0 exp(1/u-1)(1-1/u) increases from zero to x0/e as x''=x0 exp(1/u-1)/u³>0 for x0>0. Total mechanical work is m x0²/(2e²) by energy change. Flux B0 L x0 exp(1/u-1) decreases for B0,x0>0; the counterclockwise induced current viewed from +z (toward +y on the bar) reinforces the field. Area increases as the bar accelerates outward, counteracting flux loss.

  IB/2026/P2/q17C
  Odd moments vanish by symmetry, zeroth and second moments agree (2 and 2/3) and fourth gives 2/5-2/9=8/45. Thus L(p)=8c4/45 and degree of precision n=3, even though individual odd higher degrees integrate exactly. For a continuous linear functional on C[a,b] annihilating P_(r-1), Taylor's integral remainder gives L(f)=int_a^b f^(r)(t)K(t) dt, K=L_x[(x-t)_+^(r-1)]/(r-1)!, for f in C^r (integral interchange is valid for this functional). Here K(t)=[(1-t)^4/4-(-s-t)_+³-(s-t)_+³]/6 on [-1,1]. Nonnegativity yields |L|<=||f''''|| int K, and taking x^4/24 gives int K=(8/45)/24=1/135. N=135. Quartic derivative is constant, giving equality for every quartic including either sign of its leading coefficient.

  IB/2026/P2/q5A
  Use u=psi_y, v=-psi_x. Integration gives psi=(alpha+t)y²/2-x+h(t). At fixed t the curves x=C+(alpha+t)y²/2 point upward (v=1); symmetric about y=0 and open to the right when alpha+t>0. At t=0 coefficient alpha/2, at t=1 (alpha+1)/2: the latter reaches larger x at equal |y|. If alpha=0 initially vertical lines. For alpha>0 and t/alpha small the horizontal component is alpha y up to relative error t/alpha (both zero at y=0); streamlines to leading order x=C+alpha y²/2. No positive small-relative-time regime for alpha=0.

  IB/2026/P3/q18H
  For simple densities f,g, reject when g>k f, accept when g<k f, randomizing on equality as necessary for E_f phi=alpha. For a competitor eta of level <=alpha the integral of (phi-eta)(g-kf) is nonnegative pointwise; adding k int (phi-eta) f>=0 proves most powerful, with equivalent choices possible on ties. For the normal model the likelihood ratio to zero is exp(mu sum x_i-n mu²/2), increasing in sum for every mu>0. Reject sqrt(n) Xbar>Phi^-1(1-alpha). Null size equals alpha at mu=0 and is no bigger for mu<0 by stochastic shift. Every composite-level competitor satisfies the simple-null bound and the same NP comparison proves UMP. For a mixture null, any test controlling both f_i automatically controls their mixture by linearity; a mixture-MP test feasible for both is optimal for the composite null. For the open two-tail null, power of the central interval at mu equals q(mu)=Phi(z-mu)-Phi(-z-mu), even and decreasing strictly for mu>0 since q'=phi(z+mu)-phi(z-mu)<0. The size is the supremum q(mu0)=alpha, approached by exterior parameters. Existence and uniqueness of z follow from strict continuous increase from 0 to 1. For any bounded randomized competitor eta, mu->E_mu eta is continuous, for example by L¹-continuity of translates of the Gaussian or dominated convergence on a bounded parameter neighborhood. Thus size control extends to both endpoints. For their equal mixture f*, g0/f*=exp(mu0²/2)/cosh(mu0 x) decreases in |x|, so NP gives the central interval as MP against zero under f*. It is feasible for the entire null and dominates every competitor.

  IB/2026/P4/q14A
  Parameterize an initial C¹ curve (xi(s),eta(s)) with assigned u0(s); require det[(xi',eta'),(a,b)] nonzero there. Under local smoothness, integrate x'=a,y'=b,U'=c(x,y,U) from the curve. The inverse function theorem recovers U as a local graph solving the PDE; these ODEs follow by the chain rule. If a=H_y,b=-H_x, this gives the Hamiltonian pair and dH/dt=H_x H_y-H_y H_x=0. For (2xy,x²-y²) divergence=2y-2y=0. Integrate H_y=2xy giving H=xy²+g(x); then g'=-x² so H=xy²-x³/3. In polar coordinates this is -(r³/3)cos(3theta). Nonzero levels are the curves r=(-3h/cos(3theta))^(1/3) in the three sectors with compatible sign, each asymptotic to its bounding rays; alternating positive and negative sectors, symmetry by rotation through 2pi/3. The zero set consists of x=0 and y=±x/sqrt(3); each ray is an individual characteristic, the origin is a stationary point. Away from the origin the gradient never vanishes so components of level curves are the characteristics. u equals an arbitrary differentiable function F(H) locally there. Globally branches on disconnected level components can use different F; their values and derivatives must yield a C¹ solution where they meet, including continuity through the origin. Along the positive y-axis trajectories point downward, and orientations elsewhere can be read from the original field, e.g. at y=0 upwards.

  IB/2026/P4/q2F
  Let rho_x=|x-x0|. For unequal points rho_x+rho_y>0 since only x0 has zero radius. Symmetry and diagonal zero are immediate. If x,y,z distinct, the route x-z-y adds 2rho_z to d(x,y), while repeated endpoints give equality or a zero left side. Thus a metric, including singleton case. Path-connected means any ordered pair is joined by a continuous [0,1]-path in the subset (usual topology). Concatenate at t=1/2 the segments from x to x0 to y with linear parameterizations; star-shapedness keeps both in Omega. Along each of these segments the fundamental theorem of calculus bounds vector increments by segment length times the sup of ||Df|| there. For x!=y the two segment lengths sum to d(x,y); for x=y the estimate is immediate. If Df vanishes on Omega each segment has zero integral, hence f is constant even if its derivative is nonzero elsewhere.
