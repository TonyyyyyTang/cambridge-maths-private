        five quadratic terms and signs, and the bound n at least 2 to the power d.
    independent_rework: '# IB/2008/P3/q10E


      A quadratic form in characteristic zero is a map \(q(x)=B(x,x)\) associated
      to a symmetric bilinear form, equivalently a homogeneous polynomial of degree
      two (including the zero form). Polarization gives \(B(x,y)=(q(x+y)-q(x)-q(y))/2\).
      If \(q\) vanishes identically there is nothing to diagonalize. Otherwise choose
      \(v\) with \(q(v)\ne0\). Subtracting \(B(x,v)v/q(v)\) from each \(x\) shows
      \(V=kv\oplus v^\perp\), and on this splitting there are no cross terms. Induct
      on dimension, then rescale each nonzero diagonal basis vector to make its coefficient
      \(1\) or \(-1\) over \(\mathbb R\) and \(1\) over \(\mathbb C\) using square
      roots.


      Over the reals the positive and negative diagonal counts \(p,m\) are intrinsic
      by Sylvester''s law of inertia. Rank is \(p+m\) and signature is \(p-m\) (inertia
      pair \((p,m)\)). The given form equals

      \[

      (x_1+x_2+x_3)^2-(2x_1+x_3)^2 .

      \]

      These two linear forms are independent and can be completed to a coordinate
      system. Thus \(p=m=1\), rank 2 and signature 0.


      On any complex space of dimension \(s\), one quadratic form vanishes throughout
      a subspace of dimension at least \(\lfloor s/2\rfloor\). In its diagonal basis,
      pair successive coordinates. In each two-plane spanned by a pair choose a nonzero
      isotropic vector: use a zero-coefficient basis vector if available, or combine
      two unit-coefficient vectors as \(v+i w\). Vectors from distinct pairs are mutually
      orthogonal for its bilinear form. Their span is therefore totally isotropic.
      Restrict the next form to that subspace and repeat. Starting from \(n\ge2^d\),
      after \(j\) steps the common zero subspace has dimension at least \(2^{d-j}\),
      by induction. At \(j=d\) take any nonzero vector in it.

      '
    main_comparison: Escalation resolved by expanding both competing square decompositions.
      Both give rank two and signature zero. For each complex form a totally isotropic
      subspace of at least half the dimension rounded down is obtained by pairing
      diagonal coordinates, also covering zero coefficients. Iterating preserves a
      nonzero common vector when n≥2ᵈ.
