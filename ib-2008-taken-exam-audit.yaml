      which all \(n\ge N\) and every \(t\in[a,b]\) satisfy \(|f_n(t)-f(t)|<\varepsilon\).
      The same \(N\) works over the whole interval.


      Fix \(x\in[a,b]\), choose a single \(N\) with uniform error less than \(\varepsilon/3\),
      and apply continuity of \(f_N\) at \(x\). For \(t\in[a,b]\) sufficiently close
      to \(x\) one has \(|f_N(t)-f_N(x)|<\varepsilon/3\). The triangle inequality
      between \(f(t),f_N(t),f_N(x),f(x)\) gives \(|f(t)-f(x)|<\varepsilon\). This
      uses the relative interval neighbourhood at an endpoint.


      Since the interval is closed, the specified limit \(x\) belongs to it. The triangle
      inequality gives \(|f_n(x_n)-f(x)|\le |f_n(x_n)-f(x_n)|+|f(x_n)-f(x)|\). The
      first term tends to zero by the uniform bound, the second by continuity at \(x\).

      '
