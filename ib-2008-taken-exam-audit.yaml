    independent_rework: '# IB/2008/P4/q9H


      The classes are \(A=\{1,2\}\), \(B=\{3,4\}\) and \(C=\{5,6,7\}\). Only the first
      is open. A return within \(A\) requires an even number of alternating steps
      and two steps suffice, so its period is 2. Survival in \(A\) for \(2k\) steps
      has probability \((1/6)^k\) from either starting state, giving transience. The
      closed finite irreducible classes are recurrent. The deterministic two-cycle
      \(B\) has period 2. State 7 has a self-loop, so the whole irreducible class
      \(C\) has period 1.


      Read from the original page, the outgoing edges to class \(B\) both land in
      3. For each start in \(A\), let \(o_i,e_i\) be the total probabilities of first
      entering \(B\) at odd and even times. Two successive steps staying in \(A\)
      return to the original state with probability \(1/6\). Summing over the possible
      numbers of those pairs gives

      \[

      (o_1,e_1)=\frac{(1/4,(1/2)(1/2))}{1-1/6}=(3/10,3/10),\quad

      (o_2,e_2)=\frac{(1/2,(1/3)(1/4))}{1-1/6}=(3/5,1/10).

      \]

      At odd observation times the limiting masses at 3 and 4 are respectively \(o_i,e_i\);
      at even observation times they are \(e_i,o_i\). This follows from deterministic
      alternation after entry and the vanishing probability of late entry. Thus both
      entries converge from state 1. Their limits fail to exist from state 2.


      The complementary probabilities of reaching \(C\) are \(2/5,3/10\) from 1,2.
      Inside \(C\) the stationary equations give \(\pi_5=\pi_7/2,\ \pi_6=\pi_5\);
      normalization gives \(\pi=(1/4,1/4,1/2)\). Finite irreducible aperiodic convergence
      gives this limiting row from any start inside \(C\). For an outside start, condition
      on first entrance time and state. Entrance by a fixed cutoff is a finite sum
      of convergent terms, and the remaining possible entrance mass tends to zero
      as the cutoff grows. The resulting row restricted to \(C\) is the entrance probability
      times \(\pi\).


      For all 49 pairs the limits in column order 1 through 7 are as follows. A dash
      means the sequence has distinct odd and even limits.


      | Start | 1 | 2 | 3 | 4 | 5 | 6 | 7 |

      |---|---|---|---|---|---|---|---|

      | 1 | 0 | 0 | 3/10 | 3/10 | 1/10 | 1/10 | 1/5 |

      | 2 | 0 | 0 | — | — | 3/40 | 3/40 | 3/20 |

      | 3 | 0 | 0 | — | — | 0 | 0 | 0 |

      | 4 | 0 | 0 | — | — | 0 | 0 | 0 |

      | 5, 6, 7 | 0 | 0 | 0 | 0 | 1/4 | 1/4 | 1/2 |


      From starts 3 and 4, entries within their class alternate between 0 and 1.

      '
