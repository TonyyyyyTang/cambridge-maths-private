        to state general results and the walk on the integers.
    independent_rework: '# IB/2008/P3/q9H


      A state \(i\) is recurrent if, starting there, the first return \(T_i^+=\inf\{n\ge1:X_n=i\}\)
      is finite with probability one. A recurrent chain has all states recurrent.
      At successive returns the strong Markov property restarts the chain in that
      same state, so the chain then visits \(i\) infinitely often almost surely.


      Write \(h_j=P_j(T_0<T_N)\) for the symmetric nearest-neighbour walk on \(0,\ldots,N\),
      with the endpoints absorbing for this calculation. The first hitting time of
      an endpoint is finite almost surely: in every block of \(N\) steps, a run entirely
      to the left has probability \(2^{-N}\) and guarantees exit from the interior.
      Thus \(h_0=1,\ h_N=0\), and first-step conditioning gives \(2h_j=h_{j-1}+h_{j+1}\)
      inside. Constant first differences give \(h_j=1-j/N\). From 1, the probability
      of ever hitting zero is at least \(1-1/N\) for every \(N>1\), hence equals 1.
      Reflection gives the same from \(-1\). Conditioning on the first step from zero
      gives almost sure return. By translation, every integer is recurrent.

      '
    main_comparison: Finite-interval exit from one reaches the remote boundary before
      zero with probability 1/M. Taking M to infinity and conditioning on the first
      step proves recurrence of every translated state.
