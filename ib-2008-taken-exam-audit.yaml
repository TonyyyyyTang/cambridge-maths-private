    independent_rework: '# IB/2008/P3/q15D


      For the real Dirichlet eigenfunctions, integrate \(y_m\mathcal Ly_n-y_n\mathcal
      Ly_m\). The \(q\) terms cancel and integration by parts leaves \([p(y_n y_m''-y_m
      y_n'')]_0^1=0\). It follows that \((\lambda_n-\lambda_m)\int wy_ny_m=0\), proving
      the stated orthogonality including the tautological equal-index case.


      Let \(H=L^2([0,1],w\,dx)\), \(T=w^{-1}\mathcal L\), \(N_n=\int w y_n^2>0\).
      For a nonzero Dirichlet \(y\) in the operator domain with the indicated expansion
      in \(H\), symmetry gives \(\langle y_n,Ty\rangle=\lambda_n\langle y_n,y\rangle=\lambda_n
      a_n N_n\). Taking the inner product of the partial sums of \(y\) with the fixed
      \(Ty\) and then passing to the \(H\)-limit yields \(\int y\mathcal Ly=\sum_n\lambda_n
      a_n^2N_n\), without a termwise differentiation assumption. Similarly \(\int
      wy^2=\sum_n a_n^2N_n\). Each eigenvalue is at least \(\lambda_1\); hence the
      Rayleigh quotient is at least \(\lambda_1\).


      For a sufficiently regular solution, completeness supplies this expansion at
      each time. Differentiating the squared norm gives \(\frac12\partial_t\int wy^2=\int
      wy\,y_t=-\int y\mathcal Ly\le-\lambda_1\int wy^2\). The zero time slice satisfies
      the inequality directly. The quotient does not require \(\lambda_1>0\).

      '
    main_comparison: Integration by parts cancels the endpoint Wronskian. On the operator
      domain the Rayleigh quotient is bounded below by the first eigenvalue, and differentiation
      of the weighted squared norm gives the stated diffusion energy inequality.
