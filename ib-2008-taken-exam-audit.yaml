    independent_rework: '# IB/2008/P4/q19H(i)


      Let \(S_{xx}=\sum(x_i-\bar x)^2\), \(S_{xy}=\sum(x_i-\bar x)(Y_i-\bar Y)\).
      The two regression coefficients are separately identifiable for \(S_{xx}>0\).
      The log likelihood, up to a constant, is

      \[

      -\tfrac n2\log\sigma^2-\frac{\sum(Y_i-a-bx_i)^2}{2\sigma^2}.

      \]

      For fixed \(b\), minimizing the sum of squared residuals over \(a\) gives \(a=\bar
      Y-b\bar x\). Substitution gives a strictly convex quadratic in \(b\) with derivative
      \(2bS_{xx}-2S_{xy}\). Thus \(\hat\beta=S_{xy}/S_{xx}\) and \(\hat\alpha=\bar
      Y-\hat\beta\bar x\). For positive minimized residual sum of squares \(D=\sum(Y_i-\hat\alpha-\hat\beta
      x_i)^2\), differentiating in \(\sigma^2\) shows that the profile likelihood
      increases and then decreases at \(\hat\sigma^2=D/n\). For a perfect fit there
      is no maximum over \(\sigma^2>0\); the likelihood is unbounded toward zero.
      With \(n>2\), a full-rank design, and a nondegenerate Gaussian error vector,
      a perfect fit has probability zero.


      The full-rank design matrix \(X=[\mathbf 1,\mathbf x]\) gives the coefficient
      normal law with mean \((\alpha,\beta)^T\) and covariance \(\sigma^2(X^TX)^{-1}\),
      from the linear estimator \((X^TX)^{-1}X^TY\). In particular the intercept variance
      is \(\sigma^2 c\), \(c=1/n+\bar x^2/S_{xx}\). Orthogonal Gaussian projections
      onto the fitted two-dimensional space and its complement are independent. The
      squared norm of the latter divided by \(\sigma^2\) has distribution \(\chi^2_{n-2}\).
      Consequently \(D/\sigma^2\sim\chi^2_{n-2}\) independently of the estimated coefficients.
      Under \(H_0\), the statistic

      \[

      t=\frac{\hat\alpha}{\sqrt{D/(n-2)}\sqrt{1/n+\bar x^2/S_{xx}}}

      \]

      has Student''s \(t_{n-2}\) law. At level \(\gamma\) reject in either tail when
      \(|t|>t_{n-2,1-\gamma/2}\). This construction needs \(n>2\) and \(S_{xx}>0\).
      If every \(x_i\) is the same, only the single mean \(\alpha+\beta x_1\) is identifiable,
      and this two-coefficient derivation does not apply.

      '
    main_comparison: '# Part (i), general regression


      Both blind derivations and the separate fresh rework give the same normal equations
