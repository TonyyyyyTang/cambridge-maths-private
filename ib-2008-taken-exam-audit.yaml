    independent_rework: '# IB/2008/P4/q13F


      Two norms \(u,v\) are Lipschitz equivalent if positive constants \(m,M\) give
      \(m\,v(z)\le u(z)\le M\,v(z)\) for every vector \(z\). Applying both bounds
      to pairwise differences shows that the two norms have the same Cauchy sequences.
      Applying them to the difference from a candidate limit gives the same convergence
      and limits. Completeness in either norm therefore implies completeness in the
      other.


      Put \(M=\sum_j\|e_j\|\). When \(\|x\|_2=1\), each \(|x_j|\le1\); hence \(\|x\|\le\sum_j|x_j|\|e_j\|\le
      M\). Homogeneity gives \(\|z\|\le M\|z\|_2\) on all vectors, including zero.
      The reverse triangle inequality now gives \(|\|x\|-\|y\||\le M\|x-y\|_2\), proving
      continuity.


      For \(n\ge1\), choose unit vectors approaching the infimum of the norm on the
      Euclidean sphere. By Bolzano–Weierstrass, a bounded sequence has a convergent
      subsequence, whose limit is still a unit vector by continuity of the Euclidean
      norm. The preceding continuity shows the infimum equals the arbitrary norm of
      this nonzero limit, hence \(m>0\). Homogeneity gives \(m\|x\|_2\le\|x\|\), as
      required. The zero-dimensional case is immediate.

      '
    main_comparison: The coordinate upper bound gives Euclidean continuity of any
      norm. Compactness of the unit sphere gives a strictly positive minimum; the
      resulting two-sided bounds preserve both Cauchy sequences and their limits.
