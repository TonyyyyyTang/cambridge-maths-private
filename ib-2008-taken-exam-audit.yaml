    independent_rework: '# IB/2008/P1/q6D


      The real matrix \(LDL^T\) is symmetric. For each nonzero \(x\), \(y=L^Tx\) is
      nonzero because \(L^T\) is invertible (unit diagonal). Hence \(x^TAx=\sum_i
      d_i y_i^2>0\) if all \(d_i>0\).


      For the displayed matrix, compare the first column of \(A\) and then its lower-right
      Schur complement. The first pivot is \(1\), with multipliers \(-1,2\), leaving
      \(\left(\begin{smallmatrix}2&3\\3&-1\end{smallmatrix}\right)\). The next pivot
      is \(2\) and multiplier \(3/2\), leaving \(-1-9/2=-11/2\). Thus

      \[

      L=\begin{pmatrix}1&0&0\\-1&1&0\\2&3/2&1\end{pmatrix},\qquad D=\operatorname{diag}(1,2,-11/2).

      \]

      For instance the reconstructed \((3,2)\) entry is \(-2+3=1\) and the \((3,3)\)
      entry is \(4+9/2-11/2=3\). The example is indefinite: \(x=L^{-T}e_3\) gives
      a negative value while \(x=e_1\) gives 1.

      '
    main_comparison: The printed symmetric matrix has pivots 1,2,−11/2. Direct reconstruction
      gives the requested LDLᵀ, with an indefinite D. The positivity implication in
      the first part remains valid.
