      Incompressibility gives \(u_x+v_y=0\), so locally the one-form \(-v\,dx+u\,dy\)
      is exact. Use the stream function convention \(u=\psi_y,\ v=-\psi_x\). The horizontal
      components of the curl vanish by two-dimensionality; the vertical component
      is \(v_x-u_y=-\psi_{xx}-\psi_{yy}\).


      The stretching term is \(\omega_z\partial_z\mathbf u=0\). Thus the material
      derivative of \(\omega_z\) vanishes, and substitution yields

      \[

      \partial_t\Delta\psi+\psi_y\,\partial_x\Delta\psi-\psi_x\,\partial_y\Delta\psi=0.

      \]

      Here \(\Delta=\partial_{xx}+\partial_{yy}\).

      '
    main_comparison: Incompressibility gives a local stream function, vertical vorticity
      is minus its Laplacian, and the stretching term vanishes. Substitution gives
      material transport of the Laplacian, with matching signs in both derivations.
