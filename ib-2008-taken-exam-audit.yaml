    independent_rework: '# IB/2008/P1/q9E


      Define the row and column ranks as the dimensions of the real spans of the rows
      and columns respectively. The row space is the orthogonal complement of the
      nullspace of \(A\), since \(Ax=0\) asserts orthogonality to every row. It therefore
      has dimension \(n-\dim\ker A\), which is the dimension of the image (column
      space) by rank–nullity. Elementary operations on rows or columns multiply on
      the left or right by an invertible matrix. Left multiplication maps the image
      isomorphically onto the new image, while right multiplication leaves the image
      equal to the original image.


      From the first block matrix subtract \(P\) times the lower block row from the
      upper. Subtract the first block column times \(R\) from the second. These invertible
      triangular operations give \(\left(\begin{smallmatrix}0&-PQR\\Q&0\end{smallmatrix}\right)\),
      and negating the top block row gives the matrix requested. Its column space
      is a direct sum of copies of the images of \(PQR\) and \(Q\), so its rank is
      their rank sum.


      On the original image, projection onto the upper \(n\) coordinates has image
      \(\mathrm{im}(PQ)\), and its kernel contains every vector \((0,QRv)\). Rank–nullity
      for that projection gives the lower bound \(\mathrm{rank}(PQ)+\mathrm{rank}(QR)\)
      on the original rank. Equating ranks proves the inequality.

      '
    main_comparison: Invertible block row and column operations give the rank sum
      rank(Q)+rank(PQR). Projecting the original image onto its top coordinates leaves
      a kernel containing the image of QR, proving the inequality.
