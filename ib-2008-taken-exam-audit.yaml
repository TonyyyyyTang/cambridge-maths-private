auditor_report: '# 2008 IB independent audit


  All 13 complete questions in the supplied random-sample packet were reworked from
  their statements. Page-image comparison covered the complete question body, including
  printed part labels, displayed mathematics, hypotheses and closing requests. No
  question-body transcription discrepancies were identified in the 13 comparisons.
  Each source record binds its original PDF, question packet and independent derivation
  with SHA-256.


  | Paper | Sampled printed questions | Count |

  |---|---|---|

  | 1 | 3C, 6D, 9E | 3 |

  | 2 | 3F, 8B, 19H | 3 |

  | 3 | 9H, 10E, 15D, 16A | 4 |

  | 4 | 7B, 13F, 16A | 3 |


  P1/6D gives an indefinite concrete matrix with negative final pivot. P2/19H requires
  a boundary qualification for zero sample totals. P4/7B uses the usual isolated-source
  potential normalization and decay of the boundary integral. P4/16A states fewer
  hypotheses than pointwise Fourier inversion needs. The individual reworks address
  these issues directly.


  The separate regression review covers exactly P4/19H(i), using only its supplied
  crop. The targeted P4/9H Markov review covers one additional complete question and
  all 49 transition limits. Each has its own evidence directory and neither contributes
  to the 13-question random sample. Previously written solutions and official answers
  were not consulted. An observed solution-error rate requires a subsequent comparison
  against the stored solutions.

  '
main_resolution: The indefinite LDL example has final pivot -11/2. A zero marginal
  total prevents an interior likelihood maximum. The electrostatic surface term requires
  sufficient decay and a fixed potential reference. The periodisation hypotheses fix
  Fourier coefficients but admit a single-point counterexample to pointwise equality.
