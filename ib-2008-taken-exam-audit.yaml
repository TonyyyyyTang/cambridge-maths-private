        factors of one half, field and potential sign, outer decay assumption, and
        shell data.
    independent_rework: '# IB/2008/P4/q7B


      Gauss''s law gives \(\rho=\epsilon_0\nabla\cdot\mathbf E\). Since \(\nabla\phi=-\mathbf
      E\), the product rule gives \(\phi\nabla\cdot\mathbf E=\nabla\cdot(\phi\mathbf
      E)+|\mathbf E|^2\). Integrate over balls and apply the divergence theorem. The
      desired formula follows when \(\int_{S_r}\phi\mathbf E\cdot\mathbf n\,dS\to0\)
      as \(r\to\infty\). This is the usual isolated-source convention \(\phi(\infty)=0\)
      with sufficient decay, e.g. compactly supported charges yield \(\phi=O(1/r)\)
      and \(\mathbf E=O(1/r^2)\). Pointwise vanishing of the field alone does not
      give that surface limit: even for a localized net charge \(Q\), shifting the
      potential by a constant \(c\) changes the surface limit by \(cQ/\epsilon_0\)
      and the original energy by \(cQ/2\).


      For the isolated shell the constant interior potential extends to the surface.
      The exterior solution is radial by rotational invariance and uniqueness of the
      exterior Dirichlet problem with constant boundary potential and zero potential
      at infinity. Flux then gives \(\mathbf E=Q\hat{\mathbf r}/(4\pi\epsilon_0 r^2)\)
      for \(r>R\); the field inside is zero. Integrating its energy density outside
      the shell gives

      \[

      U=\tfrac{\epsilon_0}2\,4\pi\left(\frac{Q}{4\pi\epsilon_0}\right)^2\int_R^\infty
      r^{-2}\,dr=\frac{Q^2}{8\pi\epsilon_0R}.

      \]

      The one-sided surface fields have the standard jump. The surface itself has
      zero volume in the energy integral.

      '
    main_comparison: Gauss and integration by parts give the field energy when the
      surface term tends to zero. The potential reference and isolated-source decay
      enter here. The interior is equipotential and the isolated spherical surface
      has radial exterior field, giving Q²/(8πε₀R).
