    independent_rework: '# IB/2008/P3/q16A


      The probability flux is \(j=(\hbar/2mi)(\psi^*\psi''-\psi\psi''^*)\). A finite
      potential step with constant mass makes both \(\psi\) and \(\psi''\) continuous
      at 0 and at \(a\). Integrating the stationary Schrödinger equation over a shrinking
      interval gives continuity of the derivative, with continuity of the function
      itself needed to exclude a distributional derivative of a delta.


      Let \(k=\sqrt{2mE}/\hbar>0\). The left-hand wave is \(Ae^{ikx}+Be^{-ikx}\) for
      either energy regime. Its flux is \(\hbar k(|A|^2-|B|^2)/m\), as the interference
      terms in \(\psi^*\psi''\) have zero imaginary part. For \(E>V_0\), the right-hand
      wave with no incidence from the right is \(Ce^{iq(x-a)}\), \(q=\sqrt{2m(E-V_0)}/\hbar\),
      giving \(j_R=\hbar q|C|^2/m\). For \(0<E<V_0\) boundedness at positive infinity
      gives \(Ce^{-\kappa(x-a)}\) with \(\kappa=\sqrt{2m(V_0-E)}/\hbar\). Its real
      logarithmic derivative makes \(j_R=0\).


      Define \(R=|j_{\rm reflected}|/j_{\rm incident}=|B/A|^2\) and \(T=j_R/j_{\rm
      incident}\), with \(A\ne0\). In a stationary state of a real potential the continuity
      equation gives constant flux; the matching conditions also preserve it at each
      interface. Hence \(j_{\rm incident}-|j_{\rm reflected}|=j_R\), so \(R+T=1\).
      Above threshold \(T=(q/k)|C/A|^2\); below threshold \(T=0\) and \(R=1\), even
      though the decaying wave can be nonzero.

      '
    main_comparison: Above threshold the ratio of transmitted to incident wave numbers
      multiplies the squared amplitude. The decaying exterior carries zero current
      below threshold. Continuity across the finite steps and constant stationary
      current give R+T=1.
