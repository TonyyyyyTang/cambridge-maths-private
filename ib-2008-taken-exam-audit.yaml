        of the nonnegative integers, PGF, positive parameter domain, mass function,
        estimators, and bias and convergence requests.
    independent_rework: '# IB/2008/P2/q19H


      Put \(c=1-\alpha-\beta>0\). Differentiating the probability generating function
      in \(s\) at \(s=t=1\) gives \(EX=\alpha/c\), and similarly \(EY=\beta/c\). Its
      geometric expansion \(c\sum_{k\ge0}(\alpha s+\beta t)^k\) converges near \((1,1)\).
      Only the term \(k=x+y\) contributes to \(s^xt^y\), with coefficient \(c\binom{x+y}{x}\alpha^x\beta^y\).


      With iid data and \(A=\sum X_i,\ B=\sum Y_i\), the parameter-dependent likelihood
      is \(c^n\alpha^A\beta^B\). For \(A,B>0\), the log scores give \(A/\alpha=B/\beta=n/c\),
      obtaining \((\hat\alpha,\hat\beta)=(A,B)/(n+A+B)\). Strict concavity of \(n\log
      c+A\log\alpha+B\log\beta\) gives the unique maximum. If a total is zero, the
      displayed formulas maximize the likelihood on the closure allowing zero parameters.
      In the stipulated open parameter space a maximum does not exist on those possible
      samples. For example with \(A=0\) reducing \(\alpha>0\) strictly increases the
      likelihood for fixed \(\beta\).


      For the displayed estimators defined on all samples, put \(r=\alpha+\beta\)
      and \(Z=(A+B)/n\). Then \(EZ=r/(1-r)\) and \(Z\) is nonconstant. The function
      \(h(z)=z/(1+z)\) is strictly concave on \([0,\infty)\), so \(E(\hat\alpha+\hat\beta)=Eh(Z)<h(EZ)=r\).
      More specifically, given each pair total \(X_i+Y_i=k\), \(X_i\) is binomial
      \((k,\alpha/r)\) by the joint mass function. Conditional expectation therefore
      yields \(E\hat\alpha=(\alpha/r)Eh(Z)<\alpha\); the same reasoning applies to
      \(\hat\beta\).


      The strong law of large numbers applies to the iid integrable coordinates. Their
      sample means converge almost surely to \((\alpha/c,\beta/c)\). The map \((x,y)\mapsto
      x/(1+x+y)\) is continuous for nonnegative inputs, giving almost sure convergence
      of \(\hat\alpha\) to \(\alpha\). Since both population means are positive, both
      observed totals are positive eventually almost surely.

      '
    main_comparison: The geometric probability generating function gives binomial
      splitting conditional on each total. With positive coordinate totals the likelihood
      has the stated interior maximizer; a zero total gives only a supremum on the
      printed open parameter set. Jensen and the strong law establish bias and consistency
      for the extended formulas.
