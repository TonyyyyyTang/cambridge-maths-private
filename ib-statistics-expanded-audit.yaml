        # 2026 Paper 4, 17H

        **(a)** For nonnegative observations let \(S=\sum_i X_i\). The log likelihood is \(n\log\theta-\theta S\), so its unique maximum on \((0,\infty)\) is \(\hat\theta=n/S\) by differentiation and strict concavity. \(S>0\) almost surely for \(n\ge1\); the zero-sum data would give an unbounded likelihood.

        **(b)** For \(t<\theta\) the exponential mgf is \(\theta/(\theta-t)\) by integrating its density. Independence raises this to the \(n\)-th power for \(S\), identifying \(\Gamma(n,\theta)\) in the shape–rate convention, by uniqueness of mgfs near zero. Likewise the mgf of \(\gamma Y\) is \([\lambda/(\lambda-\gamma t)]^\beta\) for \(t<\lambda/\gamma\), so \(\gamma Y\sim\Gamma(\beta,\lambda/\gamma)\).

        **(c)** By (b), \(\theta S\sim\Gamma(n,1)\), a parameter-free pivot. Define \(q_k(u)\) as the \(u\)-quantile of \(\Gamma(k,1)\). Its continuous strictly increasing cdf gives probability \(1-\alpha\) between \(q_n(\alpha/2)\) and \(q_n(1-\alpha/2)\). Since \(S>0\), dividing both endpoints by \(S\) gives the exact equal-tail interval for \(\theta\), thus \(l=q_n(\alpha/2)/n,\ u=q_n(1-\alpha/2)/n\).

        **(d)** Multiplication by the prior gives posterior kernel \(\theta^{n+\beta-1}e^{-(\lambda+S)\theta}\) on \(\theta>0\). The posterior law is \(\Gamma(k,b)\), \(k=n+\beta,\ b=\lambda+S\), with mean \(\tilde\theta=k/b\).

        **(e)** Conditionally on observations \(b\theta\sim\Gamma(k,1)\), so select \(l'=q_k(\alpha/2)/k,\ u'=q_k(1-\alpha/2)/k\). Then \([l'\tilde\theta,u'\tilde\theta]\) has exactly the stipulated conditional posterior mass. These constants depend only on \(n,\beta,\alpha\); the frequentist constants in (c) do not involve prior parameters. All quantiles are finite and strictly positive for the specified interior \(\alpha\).
