      rework: |
        # 2024 Paper 3, 18H

        **(a)** For \(0<\alpha<1\), reject when \(\sqrt n|\bar X|>\Phi^{-1}(1-\alpha/2)\). The null distribution of \(\sqrt n\bar X\) is standard normal, so the size is exactly \(\alpha\). For observed mean \(x\) the two-sided tail probability is \(p(x)=2[1-\Phi(\sqrt n|x|)]\).

        **(b)** Write \(h_v(t)=(2\pi v)^{-1/2}e^{-t^2/(2v)}\) for a centred normal density of variance \(v>0\). Then \(f(x\mid\mu)=h_{1/n}(x-\mu)\). Under the atom at zero the mean observation has density \(h_{1/n}\); on the normal component it is the sum of independent \(N(0,\tau^2)\) and \(N(0,1/n)\) variates. Consequently \(m(x)=[h_{1/n}(x)+h_{\tau^2+1/n}(x)]/2\).

        **(c)** For a nondegenerate continuous component, only the atom puts probability on \(\mu=0\). Bayes' rule for its mixture weight gives
        \[
        q(x)=\frac{h_{1/n}(x)}{h_{1/n}(x)+h_{\tau^2+1/n}(x)}
        =\left[1+(1+n\tau^2)^{-1/2}
         \exp\!\left(\frac{n^2\tau^2x^2}{2(1+n\tau^2)}\right)\right]^{-1}.
        \]
        If one allowed \(\tau=0\) as a degenerate extension, both components then put all mass on the null and the probability of the null itself is one.

        **(d)(i)** At zero, \(p(0)=1\) and \(q(0)=\sqrt{101}/(1+\sqrt{101})<1\), so by continuity \(p>q\) in a neighbourhood of zero.

        **(d)(ii)** Write \(r=|x|\). For \(n=100,\tau=1\), \(q(x)\sim\sqrt{101}\exp[-(5000/101)r^2]\) as \(r\to\infty\). The given normal tail estimate gives \(p(x)\sim2e^{-50r^2}/(10r\sqrt{2\pi})\). Hence \(p/q\) decays proportionally to \(e^{-(50/101)r^2}/r\), tending to zero. The posterior probability is eventually larger, even though both probabilities tend to zero.
