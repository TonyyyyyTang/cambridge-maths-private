      rework: |
        # 2025 Paper 1, 18H

        **(a)** Treat \(x=(X_i)\) as fixed and assume \(D=x^\top x>0\). Put \(P=xx^\top/D\). Orthogonal decomposition gives \(\|Y-xb\|^2=\|(I-P)Y\|^2+D(b-x^\top Y/D)^2\). Therefore \(\widehat\beta=x^\top Y/D\). At this value the log likelihood is a constant minus \(n\log v/2+\mathrm{RSS}/(2v)\), with \(v=\sigma^2>0\), \(\mathrm{RSS}=\|(I-P)Y\|^2\). Differentiation gives the maximum \(\widehat{\sigma^2}=\mathrm{RSS}/n\) when \(\mathrm{RSS}>0\). The covariance of the linear form \(x^\top Y\) with the residual vector is \(\sigma^2x^\top(I-P)=0\); they are jointly normal, hence independent, so their indicated functions are independent.

        **(b)** From the normal projection onto \(x\), \((\widehat\beta-\beta)\sqrt D/\sigma\sim N(0,1)\). In an orthonormal basis of the \((n-1)\)-dimensional residual space, residuals divided by \(\sigma\) have independent \(N(0,1)\) coordinates. Thus \(\mathrm{RSS}/\sigma^2\sim\chi^2_{n-1}\), independently of \(\widehat\beta\). For \(n\ge2\), \(s^2=\mathrm{RSS}/(n-1)\) studentises the slope to a \(t_{n-1}\) pivot. With \(F_{n-1}\) its cdf, the exact interval is \(\widehat\beta\pm F_{n-1}^{-1}(1-\alpha/2)s/\sqrt D\).

        **(c)** Unbiasedness for every slope requires \(c^\top x=1\). The variance is \(\sigma^2\|c\|^2\) by independence. Cauchy–Schwarz gives \(1=(c^\top x)^2\le\|c\|^2D\), as required. Equality requires proportionality to \(x\), and the constraint fixes \(c_i=X_i/D\).

        **(d)** For \(\|Y\|>0\), interchanging the roles of the two vectors in (a) gives \(\hat b=Y^\top x/\|Y\|^2\). The product is \((x^\top Y)^2/(D\|Y\|^2)\le1\) by Cauchy–Schwarz. Equality holds precisely for collinear nonzero vectors, when both fitted residual vectors vanish and therefore both residual variance estimates equal zero. These zeros are boundary estimates: if the variance parameter space is strictly positive and a fit is exact, the likelihood diverges as the variance tends to zero and there is no interior MLE. With \(n>1\) and positive variance a perfect forward fit has probability zero. If the design vector vanishes its slope is unidentifiable. With \(n=1\) and nonzero design the model is saturated and the \(t\) interval is unavailable.
