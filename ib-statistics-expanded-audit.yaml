      rework: |
        # 2024 Paper 1, 18H

        **(a)** Write \(X_i=\theta+U_i\) for independent \(U_i\) uniform on \((0,1)\). At \(s\), with \(v=s-2\theta\), the convolution density of the sum is the length of \([0,1]\cap[v-1,v]\). This is \(v\) for \(0\le v\le1\), \(2-v\) for \(1\le v\le2\), and zero elsewhere. Thus the plot consists of straight lines joining the three labelled vertices below, with zero tails. Its area is one.

        ~~~text
        density
           1                 /\
                            /  \
                           /    \
           0  ____________/      \____________  s
                         2θ    2θ+2
                            2θ+1
        ~~~

        **(b)** Raising \(\theta\) shifts both observations to the right, so rejection for either test is most likely under the null at \(\theta=0\). Test 1 then has probability .05. For \(1\le C\le2\), the upper tail above \(C\) under zero is a triangle of area \((2-C)^2/2\). Equating this to .05 gives \(C=2-\sqrt{.1}\) (which lies in the assumed interval).

        **(c)** Test 1 has power \(\min(1,\max(0,\theta+.05))\). For Test 2 put \(v=C-2\theta\). Its power is 1 for \(v\le0\), \(1-v^2/2\) for \(0\le v\le1\), \((2-v)^2/2\) for \(1\le v\le2\), and 0 for \(v\ge2\). These expressions agree at their common boundaries, and give .05 at \(\theta=0\).

        **(d)** The powers cross within the alternative. At \(\theta=.05\), Test 1 has power .10 and Test 2 has \((\sqrt{.1}+.1)^2/2\approx.0866\). At \(\theta=.5\), Test 1 has power .55 and Test 2 has \(1-(1-\sqrt{.1})^2/2\approx.7662\). Since both tests have the same size, each is beaten at an allowed alternative and neither is UMP.
