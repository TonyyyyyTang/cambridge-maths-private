      file: 2023-P1-q18H.md
      sha256: ba711d6531eb4a27aaa081d37cdf91fad4a29c4dc8d41b9a8e3bb8f1ab888ad9
      rework: |
        # 2023 Paper 1, 18H

        **(a)** Independence gives the Lebesgue density
        \[
        f_\mu(x)=\frac{1}{2\pi}\exp[-((x_1-\mu)^2+(x_2-\mu)^2)/2],\qquad x\in\mathbb R^2.
        \]

        **(b)** Expand the exponent as \(-\|x\|^2/2+\mu T(x)-\mu^2\). The factorisation criterion proves sufficiency. For any two observations \(x,y\), the likelihood ratio is a fixed positive factor times \(\exp(\mu[T(x)-T(y)])\). With \(\mu\) free on the real line this ratio is constant in \(\mu\) exactly when \(T(x)=T(y)\). The likelihood-ratio characterisation of minimal sufficiency applies to these everywhere-positive densities.

        **(c)** Write \(X_1=\mu+Z\) for standard normal \(Z\). Then \(S-\mu^2=2\mu Z+(Z^2-1)\) has mean zero. The two terms are uncorrelated by symmetry, so its second moment is \(4\mu^2+(3-2+1)=4\mu^2+2\).

        **(d)** The sum \(T\) and difference \(D=X_1-X_2\) are jointly Gaussian, with zero covariance, hence independent. Since \(D\sim N(0,2)\) and \(X_1=(T+D)/2\), the conditional distribution at \(T=t\) is \(N(t/2,1/2)\), with density \(\pi^{-1/2}\exp[-(x-t/2)^2]\) on the whole line. This defines a version for all \(t\).

        **(e)** Rao–Blackwell conditions an integrable estimator on a sufficient statistic and cannot increase squared-error risk. Here \(E[S\mid T]=T^2/4-1/2\), using the conditional variance and squared conditional mean in (d). It is unbiased by iterated expectation. For \(W=T/2=\mu+Z'/\sqrt2\), \(Z'\) standard normal, the new error is \(\sqrt2\mu Z'+((Z')^2-1)/2\). Its second moment is \(2\mu^2+1/2\). The risk decrease \(2\mu^2+3/2\) is positive even at \(\mu=0\).
