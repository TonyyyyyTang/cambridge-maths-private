        # 2026 Paper 1, 6H

        **(a)** Sufficiency means that the conditional law of the full sample given \(T\) has a parameter-free version. If \(T=\min_iX_i\) and \(M=\max_iX_i\), the likelihood is \((1-\theta)^{-n}{\bf1}_{\{\theta\le T\}}{\bf1}_{\{M\le1\}}\). This factors into a function of \(T,\theta\) and a parameter-independent factor; hence \(T\) is sufficient, even though the support varies with \(\theta\).

        **(b)** For a finite-variance estimator \(A\) and sufficient \(T\), Rao–Blackwell gives \(B=E[A\mid T]\) as an estimator whose expression does not need \(\theta\). It has the same mean and no larger variance or mean squared error at every \(\theta\); equality of variances at a parameter value means \(A=B\) almost surely there. These facts follow from iterated expectation and the conditional variance decomposition. More generally conditioning decreases risk under integrable convex loss in the action by conditional Jensen.

        **(c)** The single-observation estimator \(2X_1-1\) has expectation \(\theta\). With probability one the minimum is unique. Given \(T=t\) its index is uniform over the \(n\) labels by symmetry, and the remaining \(n-1\) values are independent uniform on \((t,1)\) conditional on the index and \(T=t\), by the constant joint density on this truncated product. Thus
        \[
        E[2X_1-1\mid T=t]=n^{-1}(2t-1)+(1-n^{-1})t=((n+1)t-1)/n.
        \]
        Alternatively \(T=\theta+(1-\theta)V\), where \(P(V>v)=(1-v)^n\) for \(0\le v\le1\). Integrating this tail gives \(EV=1/(n+1)\), directly verifying that \(\hat\theta=((n+1)T-1)/n\) is unbiased. Its variance, using the stated \(\operatorname{Var} V\), is
        \[
        \frac{(n+1)^2}{n^2}(1-\theta)^2\frac{n}{(n+1)^2(n+2)}=\frac{(1-\theta)^2}{n(n+2)}.
        \]
        By unbiasedness this is its MSE. At \(n=1\) it reduces to \(2X_1-1\), with the same formula.
