      sha256: e78496aef7d3e682a021818a4d760d47adb45e96c4ffa927d27065a8b8b2555d
      rework: |
        # 2024 Paper 4, 17H

        **(a)** A Gaussian log likelihood at fixed positive \(\sigma\) decreases with the residual sum of squares. The intercept score sets the sum of residuals to zero, so \(\hat\alpha=\bar Y-\hat\beta\bar x\). Substitution into the slope score yields \(\hat\beta=\sum_i(x_i-\bar x)(Y_i-\bar Y)/D\), \(D=\sum_i(x_i-\bar x)^2\). For \(D>0\) the two-column design has full rank, thus this least-squares stationary point is the unique maximum.

        **(b)** In the centred design, \(w_i=x_i-\bar x\) have mean zero and \(\sum w_i^2=D\). Its slope formula is identical, so \(\hat\beta'=\hat\beta\).

        **(c)** The centred intercept score is \(\sum_i(Y_i-\alpha'-\beta'w_i)=n(\bar Y-\alpha')=0\), giving \(\hat\alpha'=\bar Y=\hat\alpha+\bar x\hat\beta\). These differ in general; equality occurs when \(\bar x\hat\beta=0\).

        **(d)** The centred errors average to \(N(0,\sigma^2/n)\), and the centred predictor averages to zero. Thus \(\hat\alpha'\sim N(\alpha',\sigma^2/n)\). The interval \(\bar Y\pm\Phi^{-1}(.975)\sigma/\sqrt n\) has .95 coverage.

        **(e)** For \(D>0,n>2\), set \(s^2=\sum_i(Y_i-\bar Y-\hat\beta w_i)^2/(n-2)\). The residual vector is the orthogonal projection of the normal errors onto the design complement. This has dimension \(n-2\), so the normalised squared norm has \(\chi^2_{n-2}\) law. It is independent of the mean error, the latter being a projection on the intercept direction. The pivot \(\sqrt n(\bar Y-\alpha')/s\) therefore has \(t_{n-2}\) law, giving the exact interval \(\bar Y\pm t_{n-2,.975}s/\sqrt n\).

        If \(D=0\), every \(x_i=\bar x\). In the original model only \(\alpha+\beta\bar x\) is identifiable; any slope with the corresponding fitted intercept maximises likelihood. In the centred model the slope is arbitrary and \(\alpha'\) remains identifiable. The interval with unknown variance then uses the intercept-only residual sum of squares and \(n-1\) degrees of freedom for \(n>1\). A saturated design has no residual degrees of freedom for this construction.
