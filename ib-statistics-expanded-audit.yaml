      sha256: 66550e4fa86fb0abda7d32e6c2170441cda24410c9a1dd2adb6629488bcd715d
      rework: |
        # 2023 Paper 3, 18H

        **(a)** A test function \(\phi\in[0,1]\) has level \(\alpha\) when \(\sup_{\Theta_0}E_\theta\phi\le\alpha\); its size is that supremum. It is uniformly most powerful among level-\(\alpha\) tests when \(E_\theta\phi\ge E_\theta\psi\) at every \(\theta\in\Theta_1\) for every other level-\(\alpha\) test \(\psi\).

        **(b)(i)** For a fixed alternative \(h>0\), put \(u=e^x\), \(a=e^{-h}<1\). The ratio \(f_h(x)/f_0(x)=a[(1+u)/(1+au)]^2\) increases strictly in \(u\), since the unsquared fraction has derivative \((1-a)/(1+au)^2>0\). The Neyman–Pearson lemma says that at fixed simple-null size, rejecting the greatest alternative-to-null likelihood ratios maximises power. For \(h=1\) the critical region is thus \(X>c\). The cdf is \(F_\theta(x)=e^{x-\theta}/(1+e^{x-\theta})\), by differentiation and its limit at minus infinity. The null tail \(1/(1+e^c)=\alpha\) gives \(c=\log((1-\alpha)/\alpha)\). The null distribution has no atom at the cutoff.

        **(b)(ii)** For this cutoff the rejection probability at \(\theta\) is \(1/(1+e^{c-\theta})\), increasing in \(\theta\). Its supremum on the composite null occurs at zero and equals \(\alpha\). Every competitor with composite-null level \(\alpha\) is level \(\alpha\) at zero; the same monotone likelihood ratio calculation shows that the displayed test maximises power against each fixed \(h>0\). This proves uniform optimality. For the trivial endpoint levels 0 and 1 use the never- and always-reject tests.
