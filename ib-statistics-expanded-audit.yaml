      rework: |
        # 2024 Paper 2, 6H

        **(i)** Model rolls as independent draws with a common probability vector \(p\) on six faces. The null fixes \(p_j=1/6\) for all \(j\); the alternative allows any probability vector with at least one unequal coordinate.

        **(ii)** If \(N_j\) is the count in category \(j\), Pearson's statistic is \(Q=\sum_{j=1}^6 (N_j-n/6)^2/(n/6)\). Pearson's multinomial goodness-of-fit theorem gives \(Q\Rightarrow\chi^2_5\) under the null as \(n\) increases. All null cell probabilities are positive, and the fixed total gives one linear constraint. No parameters are fitted. Reject at asymptotic level \(\alpha\) if \(Q>F_5^{-1}(1-\alpha)\), with \(F_5\) the indicated chi-square cdf.

        **(iii)** All six expected counts are 15. The observed deviations are \(5,0,-3,2,-6,2\), summing to zero. Their squared sum is \(25+0+9+4+36+4=78\), so \(Q=78/15=5.2\).

        **(iv)** The asymptotic \(p\)-value is \(1-F_5(5.2)=P(\chi^2_5\ge5.2)\). Equivalently 5.2 is the \((1-p)\)-quantile. Either tail convention at the single endpoint agrees for this continuous reference distribution.
