      rework: |
        # 2026 Paper 1, 17H

        Write \(P_0=X_0(X_0^\top X_0)^{-1}X_0^\top,\ Q_0=I-P_0\); full column rank makes \(P_0\) the orthogonal projection onto the span of \(X_0\).

        **(i)** Minimising \(\|Y-X_0b\|^2\) gives \(\hat\beta_0=(X_0^\top X_0)^{-1}X_0^\top Y\), and the residual sum is \(S_0=\|Q_0Y\|^2\). The variance-dependent log likelihood is \(-n\log v/2-S_0/(2v)\) plus a constant. Its maximum is \(\widehat{\sigma^2}=S_0/n\) for \(S_0>0\). At exact fit, zero is the boundary estimate, and no maximum is attained for strictly positive \(v\).

        **(ii)** For full-column-rank \(X\), write \(P=X(X^\top X)^{-1}X^\top,\ S=\|(I-P)Y\|^2\). The \(F\) statistic is \([(S_0-S)/p_1]/[S/(n-p)]\). Under the null the numerator and denominator sums divided by \(\sigma^2\) are squared lengths of standard Gaussian projections onto orthogonal subspaces of dimensions \(p_1\) and \(n-p\). Thus their ratio after division by the degrees of freedom has \(F_{p_1,n-p}\) law; reject for large values. This requires \(p_1\ge1,\ n>p\).

        **(iii)** By construction \(R=Q_0Y\). Under the null \(Q_0X_0\beta_0=0\), so \(R/\sigma=Q_0(\varepsilon/\sigma)\) with \(\varepsilon/\sigma\sim N_n(0,I)\). This yields the stipulated law.

        **(iv)** The scalar \(X_{1j}^\top Q_0 Z/\sqrt n\) is centred Gaussian with variance \(v_j=\|Q_0X_{1j}\|^2/n\le\|X_{1j}\|^2/n=1\), using symmetry, idempotence and contraction of an orthogonal projection. For \(t\ge0\) and \(v_j>0\), its absolute tail is at most \(e^{-t^2/(2v_j)}\le e^{-t^2/2}\). At \(v_j=0\) its strict tail is zero, including at \(t=0\).

        **(v)** Retain the column normalisation of (iv). For \(c=\sqrt{2\log(p_1/\alpha)}>0\), every nondegenerate marginal is continuous at \(c\), and a zero marginal cannot reach it. Thus (iii), (iv) and the union bound give \(P_{H_0}(T\ge c)\le \sum_{j=1}^{p_1}e^{-c^2/2}=\alpha\) for every \(\beta_0\). This requires no independence or full rank of the added columns. If (v) were read without the norm bound, the claim would fail: take a single added column orthogonal to \(X_0\) with norm \(M\sqrt n\). Its statistic then has null law \(M|Z_1|\), so for fixed \(c>0\) its rejection probability approaches one as \(M\to\infty\).

        **(vi)** Use \(U=\max_j|X_{1j}^\top R|/\|R\|\). Substitution of (iii) cancels the common scale \(\sigma\), giving the requested distribution under the null. When \(n>p_0\), \(\|R\|^2/\sigma^2\sim\chi^2_{n-p_0}\) and hence the denominator is nonzero almost surely. One may reject for large \(U\) using an upper quantile, accounting for atoms when columns add no identifiable directions. If \(p_0=n\), \(Q_0=0\) and the printed target is \(0/0\); any common convention would be degenerate. Alternative coefficients whose fitted mean lies in the null subspace are statistically indistinguishable from a null parameter.
