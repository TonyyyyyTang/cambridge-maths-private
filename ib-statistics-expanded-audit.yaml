      rework: |
        # 2025 Paper 4, 17H

        Assume \(m,n\ge1\) and \(0<\alpha<1\). Within-group centred sums of squares cancel from likelihood comparisons. The remaining negative twice log likelihood, up to constants, is \(m(\bar X-\lambda)^2+n(\bar Y-\mu)^2\), with unrestricted minimum zero at the observed means.

        **(a)** Under the joint point null the excess sum is \(A=m\bar X^2+n\bar Y^2\). The standardised means are independent standard normals under this null, so \(A\sim\chi^2_2\) exactly. The GLR rejects for \(A>a=F_2^{-1}(1-\alpha)\).

        **(b)** The common mean minimising the two quadratic terms is \(W=(m\bar X+n\bar Y)/(m+n)\). Substitution into the restricted objective gives \(B=mn(\bar X-\bar Y)^2/(m+n)\). With \(D=(\bar X-\bar Y)/\sqrt{1/m+1/n}\) one has \(B=D^2\) and \(D\sim N(0,1)\) under every common mean. Reject exactly when \(|D|>\Phi^{-1}(1-\alpha/2)\); write \(b=(\Phi^{-1}(1-\alpha/2))^2\).

        **(c)** Put \(H=\sqrt{m+n}\,W\). Direct expansion gives \(A=D^2+H^2\). As an orthogonal linear transformation of \((\sqrt m\bar X,\sqrt n\bar Y)\), \((D,H)\) has identity covariance and an everywhere positive normal density at every \((\lambda,\mu)\). Since for independent standard \(Z_1,Z_2\) one has \(P(Z_1^2+Z_2^2\le t)<P(Z_1^2\le t)\) at each \(t>0\) (positive probability of \(Z_1^2<t<Z_1^2+Z_2^2\)), it follows that \(a>b\). The nonempty open region \(b<D^2<a,\ |H|<\sqrt{a-D^2}\) is rejected by (b) and accepted by (a), and has positive probability under every parameter pair. At the trivial endpoint levels the claimed strict positivity would fail.
