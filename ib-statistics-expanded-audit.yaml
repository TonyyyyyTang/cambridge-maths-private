      sha256: 033b1c2b16b1e6091bfe2185bebbff6ff055cad37dfb814202560eef5cfe421b
      rework: |
        # 2025 Paper 3, 18H

        **(a)** For a discrete family \(f_\theta\), a statistic \(T\) is sufficient if there is a single conditional mass function of \(X\) given \(T=t\) that works for each \(\theta\) whenever \(P_\theta(T=t)>0\). Equivalently \(f_\theta(x)=g_\theta(T(x))h(x)\) with nonnegative factors and common \(h\). For sufficiency implying factorisation choose \(g_\theta(t)=P_\theta(T=t)\) and \(h(x)=P(X=x\mid T=T(x))\) from the common conditional law. Zero-mass fibres also satisfy the product identity, and fibres impossible under all parameters may use any conditional convention. Conversely sum the proposed product over the fibre to obtain \(P_\theta(T=t)=g_\theta(t)\sum_{T(y)=t}h(y)\). When this probability is positive, dividing cancels \(g_\theta\) and gives a parameter-free conditional mass for each \(x\) in the fibre.

        **(b)** For a statistic \(U\) with finite second moment, Rao–Blackwellisation on a sufficient \(T\) is \(V=E_\theta[U\mid T]\). This is an estimator independent of the unknown parameter in its construction by (a). It has the same mean as \(U\) by iterated expectation, and variance at most that of \(U\) by
        \[
        \operatorname{Var}_\theta U=\operatorname{Var}_\theta V+
        E_\theta[\operatorname{Var}_\theta(U\mid T)].
        \]
        Equality holds precisely when \(U=V\) almost surely at that parameter. Hence squared-error risk weakly decreases, including for biased estimators. More generally, for loss convex in the action and suitable integrability, conditional Jensen followed by expectation gives \(E_\theta L(\theta,V)\le E_\theta L(\theta,U)\).

        **(c)** Let \(\lambda=\sqrt q\). The joint mass is \(e^{-n\lambda}\lambda^{\sum x_i}/\prod x_i!\), so \(T=\sum_iX_i\) is sufficient. A Poisson variable has variance and mean \(\lambda\); hence \(E[X_1^2-X_1]=\lambda^2=q\). Under independent equal-rate Poisson sampling, \(T\sim\operatorname{Poisson}(n\lambda)\); dividing joint mass by the mass of \(T=t\) gives multinomial allocation with cell probabilities \(1/n\). In particular \(X_1\mid T=t\sim\operatorname{Bin}(t,1/n)\). Counting ordered pairs of distinct successes yields \(E[X_1(X_1-1)\mid T=t]=t(t-1)/n^2\). Thus this function of \(T\) is unbiased. For \(\lambda>0\), \(T=2\) has positive probability and conditionally \(X_1(X_1-1)\) equals 2 with probability \(1/n^2\) and 0 otherwise. Both probabilities are positive for \(n\ge2\), giving strict variance improvement by (b). If \(q=0\) is admitted, both estimators equal zero almost surely, and no strict improvement at this boundary is possible.
