      sha256: 7797af1cdcab74d504dfd200dd51b537cf5e62cc6b4540e7b145dea142e01c2d
      rework: |
        # 2024 Paper 1, 6H

        **(a)** A statistic \(T\) is sufficient if a conditional distribution of the whole observation given \(T\) can be chosen independently of the parameter. In a dominated model the factorisation criterion says this holds exactly when the density takes the form \(h(x)g_\theta(T(x))\) almost everywhere with nonnegative measurable factors, \(h\) common to all parameter values.

        **(b)** A sufficient \(T\) is minimal sufficient when for every sufficient \(U\) there exists a measurable map \(k\) such that \(T=k(U)\) almost surely.

        **(c)** The single-observation density is \((2\pi)^{-1/2}\sigma^{-1}\exp[-|x|^2/(2\sigma^2)]\) for \(\sigma>0\); it factors through \(|x|\). The ratio at observations \(x,y\) equals \(\exp[-(x^2-y^2)/(2\sigma^2)]\), which is constant in \(\sigma\) exactly when \(|x|=|y|\). The standard likelihood-ratio criterion on this common support proves minimality, including the fibre \(\{0\}\).

        **(d)** In the sample the analogous ratio depends on \(\sum x_i^2-\sum y_i^2\), so \(Q=\sum_i X_i^2\) is minimal sufficient. The proposed \(S=\sum_i |X_i|\) cannot recover \(Q\). To make this assertion almost sure, put \(a_i=|X_i|>0\) almost surely. These have a positive joint density on the positive orthant. The invertible change of variables \(s=\sum a_i,\ a_1,\ldots,a_{n-1}\) (last coordinate \(s-\sum_{i<n} a_i\)) has Jacobian one. Given \(S=s>0\), the conditional density is positive on the simplex interior. There \(Q=\sum a_i^2\) is nonconstant for \(n\ge2\): one may perturb the equal split by adding and subtracting a small amount in two coordinates. By continuity it varies on sets of positive conditional measure. Thus \(Q\) is not a function of \(S\) almost surely and \(S\) is insufficient. For \(n=1\) the preceding part gives the opposite conclusion.
