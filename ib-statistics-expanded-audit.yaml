      sha256: 041ce0989ac2af15d6d303c48cf5127a242a132ec8a55d3a4378a690c57501b9
      rework: |
        # 2023 Paper 4, 17H

        Put \(A_k=\sum_i x_i^k\) for positive integer \(k\) and assume at least one \(x_i>0\). All zero-area observations equal zero almost surely.

        **(a)** Write \(Y_i=\theta x_i+e_i\) with independent mean-zero errors and \(\operatorname{Var}(e_i)=\theta x_i\). Minimising \(\sum_i(Y_i-bx_i)^2\), whose second derivative is \(2A_2>0\), gives \(\hat\theta_L=\sum_i x_iY_i/A_2\). Its mean is \(\theta A_2/A_2=\theta\).

        **(b)** Omitting factors independent of the parameter, the likelihood is \(e^{-A_1\theta}\theta^{S}\), \(S=\sum_iY_i\). If \(S>0\), the log likelihood is strictly concave with maximum \(\hat\theta_M=S/A_1\); if \(S=0\) the maximum is at zero in the closed parameter space. For a strictly positive parameter, this latter case gives only a boundary supremum. Since \(S\sim\mathrm{Poisson}(\theta A_1)\), the usual estimator (including zero) is unbiased.

        **(c)** Independence yields \(\operatorname{Var}(\hat\theta_L)=\theta A_3/A_2^2\) and \(\operatorname{Var}(\hat\theta_M)=\theta/A_1\). By Cauchy–Schwarz on \(x_i^{1/2},x_i^{3/2}\), \(A_2^2\le A_1A_3\); hence the likelihood estimator has no greater variance. For \(\theta>0\) equality requires that all positive \(x_i\) coincide. At \(\theta=0\) both variances vanish. If all areas vanish, the data cannot identify \(\theta\) and the displayed ratios are undefined.

        **(d)** The larger mean at \(\theta=2\) motivates upper-tail rejection. Let \(z=\Phi^{-1}(.95)\). Under \(\theta=1\), \(S\) is Poisson with large mean \(A_1\), so reject if \(\hat\theta_M>1+z/\sqrt{A_1}\). If each positive \(x_i\) is large, the independent counts under the null are approximately \(N(x_i,x_i)\); their indicated weighted linear combination is approximately \(N(1,A_3/A_2^2)\). Reject if \(\hat\theta_L>1+z\sqrt{A_3}/A_2\). The normal thresholds give approximate one-sided size .05.
