        # 2026 Paper 3, 18H

        **(a)(i)** For a simple null \(f\) and alternative \(g\), the Neyman–Pearson lemma gives greatest power among tests of level \(\alpha\) by rejecting where \(g>kf\), accepting where \(g<kf\), and choosing the rejection probability on equality so that null size is exactly \(\alpha\). Continuity of the densities alone need not remove all likelihood-ratio ties.

        **(a)(ii)** For each fixed \(h>0\), the joint alternative-to-null ratio for \(\mu=h\) against \(\mu=0\) is \(\exp(nh\bar X-nh^2/2)\), strictly increasing in \(\bar X\). Neyman–Pearson therefore gives the same most powerful critical region \(\sqrt n\bar X>\Phi^{-1}(1-\alpha)=c\) for each \(h\); its null size is exactly \(\alpha\). Under \(\mu\) its rejection probability is \(1-\Phi(c-\sqrt n\mu)\), increasing in \(\mu\). The supremum for \(\mu\le0\) equals \(\alpha\) at zero. Every test admissible for this larger null is level \(\alpha\) at zero, proving uniform optimality for that null as well.

        **(b)(i)** If \(\psi\) is any competing test of level \(\alpha\) at both \(f_1,f_2\), then \(E_{\pi f_1+(1-\pi)f_2}\psi=\pi E_{f_1}\psi+(1-\pi)E_{f_2}\psi\le\alpha\). By the simple-mixture-null lemma in (a)(i) it cannot have greater power at \(g\) than \(\phi\). The assumed composite-null size makes \(\phi\) an eligible test. The argument includes \(\pi=0,1\).

        **(b)(ii)** Set \(d=\mu_0>0\). For the central region its power is \(b(\mu)=\Phi(z-\mu)-\Phi(-z-\mu)\), an even continuous function. For \(\mu>0\) its derivative is \(\varphi(z+\mu)-\varphi(z-\mu)<0\) since \(|z+\mu|>|z-\mu|\) and the standard normal density decreases in absolute argument. The boundary rejection probability \(b(d)=\alpha\) thus gives the supremum on the *open* null \(|\mu|>d\) by approaching \(d\) from above. The equation determines a unique \(z>0\): its left side increases continuously from zero to one as \(z\) goes from zero to infinity.

        For any competing measurable test \(\psi:\mathbb R\to[0,1]\), its power is continuous in \(\mu\): translated normal densities converge in \(L^1\) as their shifts converge (alternatively, dominate the translates for \(|\mu-a|\le1\) by an integrable Gaussian-tail envelope). Thus its level on the open null imposes \(E_{\pm d}\psi\le\alpha\) at both excluded boundary points. For the equal mixture of these two boundary densities the alternative-to-mixture ratio is
        \[
        \frac{\varphi(x)}{\{\varphi(x-d)+\varphi(x+d)\}/2}
        =\frac{e^{d^2/2}}{\cosh(dx)}.
        \]
        It decreases strictly with \(|x|\). The proposed region \(|x|\le z\) has mixture size \(\alpha\) and by Neyman–Pearson maximises power at \(\mu=0\) among all mixture-level competitors. This includes every test eligible for the original null. Boundaries \(\pm z\) have zero sampling probability.
