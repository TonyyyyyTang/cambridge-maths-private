        # 2025 Paper 1, 6H

        Let \(p_0,p_1\) be the simple-null and simple-alternative densities. The Neyman–Pearson lemma says that a test \(\phi\) rejecting when \(p_1>k p_0\), accepting when \(p_1<k p_0\), and randomising on equality to achieve \(E_0\phi=\alpha\), has greatest power among all tests of level \(\alpha\). Points with \(p_0=0<p_1\) are included for free. For \(0<\alpha<1\), take a null upper-tail quantile \(k\) of \(p_1/p_0\), defined where \(p_0>0\), so \(P_0(R>k)\le\alpha\le P_0(R\ge k)\). Randomise on \(R=k\) by the fraction needed to make up the difference; if there is no atom the deterministic choice suffices.

        For any competitor \(0\le\psi\le1\) with \(E_0\psi\le\alpha\), \((\phi-\psi)(p_1-kp_0)\ge0\) pointwise. Integration gives \(E_1\phi-E_1\psi\ge k(E_0\phi-E_0\psi)\ge0\). If a competitor ties, the nonnegative integrand must vanish almost everywhere, so it agrees with the likelihood-ratio decision off the equality set wherever the densities matter. For \(k>0\) equality also requires full null size.

        Here \(R(x)=(\theta_1/\theta_0)e^{-(\theta_1-\theta_0)|x|}\) decreases strictly in \(|x|\). The critical region uses its smallest absolute values. Under the null \(P_0(|X|\le c)=1-e^{-\theta_0 c}\) for \(c\ge0\), by integrating the two symmetric exponential tails. The requested region is \(|X|\le-\log(1-\alpha)/\theta_0\). Either choice of boundary has the same probability. With common full support the endpoint sizes 0 and 1 are obtained by never and always rejecting, respectively.
