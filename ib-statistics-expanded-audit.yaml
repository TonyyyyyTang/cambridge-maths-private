        # 2026 Paper 2, 6H

        The sample log likelihood differs from \(-n(\mu-\bar X)^2/2\) by a data-only constant, so the unique maximum is \(\hat\mu=\bar X\). Its \(N(\mu,1/n)\) distribution gives mean squared error \(1/n\).

        Multiplication by the prior density adds the exponent term \(-\tau^2\mu^2/2\). Completing the square gives a posterior \(N(n\bar X/(n+\tau^2),\,1/(n+\tau^2))\), whose mean is \(\tilde\mu=n\bar X/(n+\tau^2)\).

        At fixed true \(\mu\), this has bias \(-\tau^2\mu/(n+\tau^2)\) and variance \(n/(n+\tau^2)^2\). The risk comparison is
        \[
        \frac{n+\tau^4\mu^2}{(n+\tau^2)^2}<\frac1n
        \quad\Longleftrightarrow\quad
        n\tau^4\mu^2<2n\tau^2+\tau^4
        \quad\Longleftrightarrow\quad
        \mu^2<2\tau^{-2}+1/n.
        \]
        The factors divided out are positive since \(n\ge1,\tau>0\). Equality of the risks holds exactly at the two threshold values, with shrinkage worse beyond them.
