        # 2025 Paper 2, 6H

        **(a)** The exponential rate likelihood at \(x\ge0\) is \(\theta e^{-\theta x}\). Multiplication by the shape–rate prior \(\theta^{m-1}e^{-\lambda\theta}\) gives posterior kernel \(\theta^{m}e^{-(\lambda+x)\theta}\) on \(\theta>0\). Hence \(\theta\mid X=x\sim\Gamma(k,b)\) with \(k=m+1,\ b=\lambda+x\). Its normalising constant is \(b^k/\Gamma(k)\).

        **(b)** At fixed observed \(x\), posterior squared risk is \(\operatorname{Var}(\theta\mid x)+(a-E[\theta\mid x])^2\). The unique minimiser is the posterior mean \(k/b=(m+1)/(\lambda+X)\), which also minimises integrated risk pointwise in the data.

        **(c)** Write \(M(t)=E(e^{t\theta}\mid x)=(b/(b-t))^k\), obtained by integrating the gamma kernel for \(t<b\). Here \(0<r<\lambda\le b\) guarantees both \(M(r)\) and \(M(-r)\) are finite, even at the support endpoint \(x=0\). The conditional loss expectation is \([e^{-ra}M(r)+e^{ra}M(-r)]/2\). Its second derivative is \(r^2\) times the strictly positive risk. Setting its first derivative to zero gives \(e^{2ra}=M(r)/M(-r)\), hence the unique Bayes action
        \[
        a(X)=\frac{m+1}{2r}\log\!\frac{\lambda+X+r}{\lambda+X-r}.
        \]
        It is positive and tends to the posterior mean as \(r\downarrow0\), by the derivative of the logarithm. Moreover the minimised posterior risk is \([b^2/(b^2-r^2)]^{k/2}\), bounded uniformly for \(b\ge\lambda>r\), so integration over the observations is finite.
