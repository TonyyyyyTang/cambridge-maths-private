      sha256: fa84a0a18b6dd6fa4565d1cb560b99c73f0e5c377a1548df22e9cdc4ce65b3b2
      rework: |
        # 2023 Paper 2, 6H

        **(a)** The log likelihood equals a constant minus \(\sum_i(X_i-\theta)^2/(2\sigma^2)\). The identity \(\sum_i(X_i-\theta)^2=\sum_i(X_i-\bar X)^2+n(\bar X-\theta)^2\) yields the unique maximum \(\hat\theta=\bar X\) for \(n\ge1,\sigma>0\).

        **(b)** With \(z=\Phi^{-1}(.975)\), the interval \([\bar X-z\sigma/\sqrt n,\bar X+z\sigma/\sqrt n]\) has exact coverage .95 for each fixed \(\theta\), by the pivot \(\sqrt n(\bar X-\theta)/\sigma\sim N(0,1)\).

        **(c)** Let \(a=\sigma^2/\nu^2\). The stipulated normal posterior has mean \(m=(n\bar X+a\mu)/(n+a)\) and variance \(\sigma^2/(n+a)\). Its equal-tail .95 credible interval is \([m-z\sigma/\sqrt{n+a},m+z\sigma/\sqrt{n+a}]\); its probability is conditional on the observed data.

        **(d)** The ratio of posterior to sampling half-width is \(\sqrt{n/(n+a)}\to1\). Under sampling at a fixed true \(\theta\), \(\bar X\to\theta\) almost surely, hence \(m-\bar X=a(\mu-\bar X)/(n+a)=O(1/n)\) almost surely. The endpoints therefore agree to first order on the \(n^{-1/2}\) scale, and both intervals shrink to \(\theta\). Fixed positive prior and sampling variances guarantee finite \(a>0\).
