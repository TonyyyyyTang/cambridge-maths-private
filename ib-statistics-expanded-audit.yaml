    | 2023 P1 | 12 | 18H | Unit normal variance, \(T=X_1+X_2\), squared target, fourth moment 3, and all five requests. |
    | 2023 P1 | 3 | 6H | “generalized”, 75 amputations, treatment columns, lived counts 34 and 19, died counts 6 and 16, two-sided “affects”, and final instruction. |
