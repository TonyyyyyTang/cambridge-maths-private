      sha256: e4e19761c52e00f5d939bc50bcc73952e8485696d109e7e29cd1d3d8f623cb28
      rework: |
        # 2023 Paper 1, 6H

        **(a)** For a null parameter space \(\Theta_0\subseteq\Theta\), define \(\Lambda=\sup_{\Theta_0}L/\sup_{\Theta}L\) and \(G=-2\log\Lambda\). Small \(\Lambda\), equivalently large \(G\), is evidence against the null. Wilks' theorem states that under the null, for a regular identifiable model and a smooth nested null of codimension \(r\), \(G\) converges in law to \(\chi^2_r\) as sample size grows. The true parameter must be regular (interior in the relevant coordinates), with nonsingular information and the usual likelihood smoothness and asymptotic assumptions.

        **(b)** Condition on the sizes 40 treated and 35 untreated. Model independent mortality counts as binomials with probabilities \(p_t,p_u\). The two-sided null is \(p_t=p_u\), against \(p_t\ne p_u\). Under the null the fitted probability is the pooled \(22/75\). Under the alternative the fitted probabilities are \(6/40\) and \(16/35\). Writing \(O_{ij}\) for observed counts and \(E_{ij}=(\text{row total})(\text{column total})/75\) for fitted null counts, the log likelihood ratio is \(G=2\sum O_{ij}\log(O_{ij}/E_{ij})\), with a zero contribution for an empty cell. Reject for \(G>\chi^2_{1,1-\alpha}\). The reference law has one degree of freedom since two unconstrained probabilities replace one. For positive common probability strictly below one and both group sizes large this test has asymptotic size \(\alpha\).

        If exact finite-sample size is intended, condition also on the total \(d\) deaths. The treated death count \(K\) then has probability \(\binom{40}{k}\binom{35}{d-k}/\binom{75}{d}\) under the null, independently of the common probability. For each \(d\), order the possible tables by decreasing \(G\) and reject the most extreme mass up to \(\alpha\), randomising on the cutoff to attain \(\alpha\). Use \(G=0\) for the constant tables at \(d=0,75\). This gives unconditional size \(\alpha\) as well. Omitting randomisation yields conditional level at most \(\alpha\).
