    independent_rework: '# Blind rework of IB/2002/P1/q14G


      **(a)** Choosing a basis identifies \(\operatorname{End}(V)\) with all \(n\times
      n\) matrices, with the \(n^2\) matrix units as a basis. Thus \(I,\alpha,\ldots,\alpha^{n^2}\)
      are linearly dependent. A dependence with some nonzero coefficient is precisely
      a nonzero annihilating polynomial. The minimal polynomial is the monic annihilator
      of smallest degree. It exists by well-ordering and scaling a leading coefficient.
      Two such monic polynomials would have a lower-degree annihilating difference,
      so they coincide. Polynomial division of any annihilator by the minimal polynomial
      gives a remainder which annihilates and has smaller degree, hence vanishes.


      **(b)** For an eigenvector \(v\ne0\) with eigenvalue \(\lambda\) one has \(m_\alpha(\alpha)v=m_\alpha(\lambda)v=0\),
      so \(m_\alpha(\lambda)=0\). Conversely take a root in the scalar field and write
      \(m_\alpha=(X-\lambda)q\). Minimality gives \(q(\alpha)\ne0\). Choose \(w\)
      with \(q(\alpha)w\ne0\). This vector is killed by \(\alpha-\lambda I\) and is
      the required eigenvector. Roots over an extension field give eigenvalues of
      the scalar-extended map.


      **(c)** Invariance of \(W\) makes every power of \(\beta\) the restriction of
      the same power of \(\alpha\). Thus \(m_\alpha(\beta)=0\). Divisibility by \(m_\beta\)
      follows from the division argument in (a).


      **(d)** On a three-dimensional space with basis \(e_1,e_2,e_3\), take \(\alpha
      e_2=e_1\), \(\alpha e_1=\alpha e_3=0\), and \(W=\langle e_1,e_2\rangle\). Both
      operators have square zero and are nonzero. A monic linear annihilator would
      make the map scalar, whereas its image of \(e_2\) is \(e_1\). Both minimal polynomials
      are \(X^2\).

      '
    main_comparison: On restriction the original minimal polynomial still annihilates
      the map. Minimality and polynomial division give divisibility, and factoring
      at a root in the base field produces a nonzero eigenvector. Both diagonal examples
      have the two eigenvalues zero and one on the proper invariant subspace.
