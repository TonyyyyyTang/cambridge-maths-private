    independent_rework: '# Blind rework of IB/2002/P4/q16C


      In the usual homogeneous incompressible fluid with conservative body force,
      Euler''s equation is \(D\mathbf u/Dt=-\nabla(p/\rho+\Phi)\). Write \(\mathbf
      u=(u,v,0)\) with \(u,v\) independent of \(z\), and \(\omega=v_x-u_y\), the vertical
      component of vorticity. Apply \(\partial_x\) to the vertical-in-plane momentum
      equation for \(v\) and subtract \(\partial_y\) times the one for \(u\). The
      force drops out as a mixed derivative and the convective terms give

      \[

      \partial_t\omega+u\omega_x+v\omega_y+(u_x+v_y)\omega=0.

      \]

      Incompressibility eliminates the last term, proving \(D\boldsymbol\omega/Dt=0\).
      For general compressible inviscid fluids the last term, and possibly a baroclinic
      pressure term, can survive.


      Write \(J(x,y)=(-y,x)\). A point vortex at \(\mathbf a\) with positive counterclockwise
      circulation \(\kappa\) gives, for \(\mathbf x\ne\mathbf a\),

      \[

      \mathbf u(\mathbf x)=\frac{\kappa}{2\pi}\frac{J(\mathbf x-\mathbf a)}{|\mathbf
      x-\mathbf a|^2}.

      \]

      Its tangential speed times the circle circumference is \(\kappa\) with its sign.
      For \(\mathbf r=\mathbf x_1-\mathbf x_2\), each vortex moves in the nonsingular
      velocity induced by the other:

      \[

      \dot{\mathbf x}_1=\frac{\kappa_2 J\mathbf r}{2\pi|\mathbf r|^2},\qquad

      \dot{\mathbf x}_2=-\frac{\kappa_1 J\mathbf r}{2\pi|\mathbf r|^2}.

      \]

      The weighted sum of these velocities vanishes, proving conservation of \(\mathbf
      q\) even when \(\kappa_1+\kappa_2=0\). Subtraction shows that \(\dot{\mathbf
      r}\) is a multiple of \(J\mathbf r\), so \(d|\mathbf r|^2/dt=2\mathbf r\cdot\dot{\mathbf
      r}=0\). Distinct vortices remain separated.


      For equal strengths \(\kappa\) the two velocities are opposite, so the midpoint
      remains at the origin. The separation is \(2|a|>0\). Then \(\dot{\mathbf x}_1=\Omega
      J\mathbf x_1\) with \(\Omega=\kappa/(4\pi a^2)\), giving \(\mathbf x_1(t)=(a\cos\Omega
      t,a\sin\Omega t)\) and \(\mathbf x_2(t)=-\mathbf x_1(t)\). Negative strength
      reverses rotation and zero strength gives stationary points.

      '
    main_comparison: Curling planar incompressible Euler for uniform density and conservative
      forcing eliminates stretching. The pair equations conserve both signed first
      moment and separation without dividing by total strength. Identical vortices
      rotate with signed angular frequency kappa/(4 pi a squared).
