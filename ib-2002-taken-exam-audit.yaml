auditor_report: '# Part IB 2002 sampled examination rework


  I independently reworked all 15 supplied questions using their statements, cropped
  figures and cited original pages. I compared each question body against the rendered
  page image, including subpart labels, symbols, endpoints, bracketed instructions
  and printed tables. The three supplied table crops match their originals. None of
  these question bodies has printed marks. I found 0 transcription discrepancies in
  15 sampled questions.


  | Paper | Original pages | Reworked questions |

  | --- | --- | --- |

  | 1 | 2, 3, 6, 7 | 1E, 2A, 6C, 12H, 14G |

  | 2 | 2, 3 | 1E, 9D |

  | 3 | 4, 6, 7, 8 | 7F, 13G, 16B, 17F |

  | 4 | 2, 5, 8, 9 | 3H, 11A, 16C, 17B |


  The concrete-block problem gives an unbiased proportion of 0.11 under the stated
  equality of marginal probabilities. The independent-mix interval and independent-block
  interval have different standard errors. The differential equation in Paper 4 question
  11A selects the singular solution x + 1/x. Its original improper integral diverges.
  Paper 4 question 16C uses the standard homogeneous incompressible Euler assumptions.
  Paper 3 question 16B prints a one-way fixed-point implication. The spectral hypothesis
  supplies existence so the implication can be applied. These qualifications are recorded
  in the respective reworks.


  Each source.json binds the statement, supplied figures, full archived original PDF
  and rework by SHA-256. The question-packet digest is the hash of the supplied question.tex
  bytes; the figure map uses the supplied image filenames. The original_pdf field
  is a path reference. All reworks were produced without access to earlier solutions
  or evidence. The comparison of these reworks with existing solutions, and any resulting
  mathematical error rate, belongs to the main reviewer.

  '
main_resolution: The concrete-block and independent-mix designs give different sampling
  intervals despite the same unbiased failure proportion. The singular Euler–Lagrange
  equation has the unique solution x+1/x, whose original improper integral diverges.
  The fixed-point iteration proof first establishes existence from the spectral assumption.
  The point-vortex result uses the incompressible constant-density, conservative-force
  model.
