      **(a) True.** The intersection contains zero. A linear combination of members
      of the intersection lies in each of \(U,W\), hence in the intersection.


      **(b) False.** If \(U=\{0\}\) and \(W=V=\mathbb R\), their union equals \(W\),
      though \(U,W\) are distinct.


      **(c) False.** In \(\mathbb R^2\), let \(W\) and \(X\) be the coordinate axes
      and \(U\) the diagonal line \(y=x\). Since \(W+X=\mathbb R^2\), the left side
      equals \(U\). The two intersections on the right are both zero.


      **(d) True.** Extend a basis of \(U\) to a basis of \(V\), and let \(W\) be
      the span of the additional vectors. Spanning of the full basis gives \(U+W=V\).
      Linear independence gives uniqueness of the basis coefficients and hence \(U\cap
      W=\{0\}\). The construction allows either group of vectors to be empty.

      '
    main_comparison: Closure under linear combination proves (a). Nested subspaces
      disprove (b), the two axes and diagonal disprove (c), and basis extension proves
      (d).
