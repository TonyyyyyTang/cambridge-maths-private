      source_comparison: Compared (a) and (b), the printed fixed-point implication,
        eigenvector assumptions and strict diagonal-dominance sum including its excluded
        diagonal. No item or subpart marks are printed alongside this question.
    independent_rework: '# Blind rework of IB/2002/P3/q16B


      **(a)** The given eigenbasis implies that 1 is not an eigenvalue of \(H\), so
      \(I-H\) is invertible. The vector \(y=(I-H)^{-1}v\) is a fixed point, and the
      one-way consistency assumption now gives \(Ay=b\). Since \(A\) is invertible,
      \(y=x^*\). This establishes the fixed-point identity needed to subtract the
      iteration. Write \(x^0-x^*=\sum_i c_iw_i\); if the eigenbasis is complex, work
      in the complexification. Then

      \[

      x^k-x^*=H^k(x^0-x^*)=\sum_i c_i\lambda_i^k w_i.

      \]

      It tends to zero because each of the finitely many powers tends to zero.


      **(b)** For nonzero diagonal entries, Jacobi evaluates all components simultaneously
      from the previous vector:

      \[

      x_i^{k+1}=\frac{b_i-\sum_{j\ne i}a_{ij}x_j^k}{a_{ii}} .

      \]

      Subtract the corresponding component identity for the solution. Writing \(e^k=x^k-x^*\)
      gives \(|e_i^{k+1}|\le |a_{ii}|^{-1}\sum_{j\ne i}|a_{ij}|\,\|e^k\|_\infty\).
      The displayed dominance hypothesis hence gives \(\|e^k\|_\infty\le\gamma^k\|e^0\|_\infty\to0\).
      If \(\gamma=0\) the first update is already exact.

      '
    main_comparison: Since 1 is outside the spectrum, the fixed-point equation is
      solvable and consistency identifies its unique solution with the original system.
      Eigenbasis expansion yields convergence. The Jacobi infinity-norm bound follows
      row by row and strict diagonal dominance ensures nonsingularity.
