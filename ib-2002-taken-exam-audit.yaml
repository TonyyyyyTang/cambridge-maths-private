      source_comparison: Compared velocity kty, all time labels, 3D starting line
        coordinates and the length and angle requests. No item or subpart marks are
        printed alongside this question.
    independent_rework: '# Blind rework of IB/2002/P1/q6C


      The divergence is \(\partial_x(kty)+\partial_y0+\partial_z0=0\). With the convention
      \(u=\partial_y\psi,\ v=-\partial_x\psi\), take \(\psi=kty^2/2\). At fixed time
      \(t\) the nonzero velocities point along the \(x\)-axis, so each regular streamline
      has \(y=y_0,\ z=z_0\). At \(kty_0=0\) the vector field vanishes there and its
      integral curves through those points are stationary.


      Label a dyed particle by its starting coordinate \(s\in[0,a]\). Its material
      equations are \(y=s,\ z=0,\ \dot x=kts\), whence

      \[

      (x,y,z)=s(kt^2/2,1,0).

      \]

      The material line remains straight and has length \(a\sqrt{1+k^2t^4/4}\). For
      \(a>0\) its direction from the origin makes the angle \(\theta=\operatorname{atan2}(1,kt^2/2)\in(0,\pi)\)
      with the positive \(x\)-axis. Equivalently, \(\cot\theta=kt^2/2\). If the angle
      between unoriented lines is requested, take \(\min(\theta,\pi-\theta)\). The
      angle at \(t=0\) or \(k=0\) is \(\pi/2\). If \(a=0\), the segment has zero length
      and no direction.

      '
    main_comparison: Instantaneous streamlines have fixed transverse coordinates,
      with no direction defined at stagnation. The material dye line instead has horizontal
      displacement proportional to its initial height times t squared. Both its norm
      and oriented angle cover zero and negative shear.
