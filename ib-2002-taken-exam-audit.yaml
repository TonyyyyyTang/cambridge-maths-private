      Extend \(x\) oddly from \((0,L)\) to \((-L,L)\), then with period \(2L\). Orthogonality
      gives, for \(n\ge1\),

      \[

      b_n=\frac2L\int_0^L x\sin(n\pi x/L)\,dx

      =\frac{2L}{n\pi}(-1)^{n+1}.

      \]

      Here the boundary term after integration by parts is \(-L^2\cos(n\pi)/(n\pi)\)
      and the remaining integrated cosine vanishes. The sine series is \(\sum_{n\ge1}b_n\sin(n\pi
      x/L)\). Its sum at \(3L/2\) equals its sum at \(-L/2\), where the odd extension
      is continuous and has value \(-L/2\). The piecewise smooth convergence theorem
      gives the midpoint at a jump such as \(L\), where the sum is zero.


      The cosine extension equals \(|x|\) on \([-L,L]\) and repeats with period \(2L\).
      Its sketch consists of straight line segments successively joining

      \[

      (-2L,0),\quad(-L,L),\quad(0,0),\quad(L,L),\quad(2L,0).

      \]

      Thus at \(3L/2\) its sum is \(L/2\). Both periodic extensions are piecewise
      smooth and the cosine extension is continuous also at the vertices.

      '
    main_comparison: The odd periodic extension at three half-lengths gives −L/2,
      while the even extension gives L/2. Integration by parts fixes the alternating
      signs in the sine series. Both sketches show the even triangular wave.
