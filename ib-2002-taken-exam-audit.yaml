        concrete-test-counts.png: b7d165775052a4d12aef60b77eac14672f67351269616022c5b5fb799faad26b
      source_comparison: Compared the full question and supplied table image, with
        columns 0 through 6 and frequencies 53,32,12,2,1,0,0. The paper specifies
        equal marginal failure probabilities. No item or subpart marks are printed
        alongside this question.
    independent_rework: '# Blind rework of IB/2002/P4/q3H


      Let \(X_i\) be the number of failures in mix \(i\). Linearity of expectation
      gives \(E X_i=6p\) when each block has marginal failure probability \(p\), including
      when blocks of a mix are dependent. Thus the total divided by 600 is unbiased:

      \[

      \widehat p=\frac{32+2(12)+3(2)+4(1)}{600}=\frac{66}{600}=0.11.

      \]


      If the 100 mixes are independent, identically sampled units, use the variation
      of their observed counts, allowing arbitrary dependence within a mix. Here \(\bar
      X=0.66\) and \(\sum_i X_i^2=32+48+18+16=114\), giving \(s_X^2=(114-100(0.66)^2)/99=0.711515\).
      The standard error of \(\bar X/6\) is estimated by \(s_X/(6\sqrt{100})=0.01406\).
      A CLT-based approximate 95% interval is \(0.11\pm1.96(0.01406)\), or \((0.0824,0.1376)\).


      If individual blocks are also mutually independent, \(S=\sum_iX_i\sim\operatorname{Bin}(600,p)\).
      An exact equal-tailed interval can then be obtained by solving \(\Pr_{p_L}(S\ge66)=0.025\)
      and \(\Pr_{p_U}(S\le66)=0.025\). The plug-in normal approximation gives \(0.11\pm1.96\sqrt{0.11(0.89)/600}=(0.0850,0.1350)\).
      Equal marginal failure probabilities alone determine the estimator''s mean but
      leave its sampling variance undetermined. For example, perfectly correlated
      blocks in a mix have \(X_i=6B_i\) and variance \(36p(1-p)\), instead of the
      binomial \(6p(1-p)\).

      '
    main_comparison: There are 66 failures in 600 blocks and common marginal probability
      suffices for unbiasedness. The binomial interval (0.0850,0.1350) needs independence
      of blocks. Independent replicate mixes instead give a cluster-based interval
      of (0.0824,0.1376).
