    independent_rework: '# Blind rework of IB/2002/P2/q1E


      Completeness means every Cauchy sequence converges to a point of the space.
      A sequence \((x_n)\) is Cauchy when for every \(\epsilon>0\) there is \(N\)
      such that \(m,n\ge N\) implies \(d(x_m,x_n)<\epsilon\). Total boundedness means
      that for every \(\epsilon>0\), finitely many open balls of radius \(\epsilon\)
      with centres in the space cover it.


      Use Euclidean distances throughout. The real line is complete and fails total
      boundedness because a finite union of unit balls is bounded. The interval \((0,1)\)
      is totally bounded by a sufficiently fine finite grid with centres inside it.
      The sequence \(1/(n+1)\) is Cauchy but has its real limit outside the interval.


      The continuous map \(x\mapsto e^x\) sends the complete real line onto \((0,\infty)\),
      which also omits the limit of \(1/(n+1)\). The continuous map \(x\mapsto 1/x\)
      sends \((0,1)\) onto \((1,\infty)\), an unbounded metric space, so its image
      fails total boundedness.

      '
    main_comparison: The line and the open unit interval distinguish completeness
      from total boundedness. Exponentiation maps a complete space onto an incomplete
      space, and reciprocation maps a totally bounded domain onto an unbounded interval.
