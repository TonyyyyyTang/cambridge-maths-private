      source_comparison: Compared both parts, sine inequality, positive lambda, arc
        parameter and limits, straight segment endpoints, and the integrand and claimed
        value. No item or subpart marks are printed alongside this question.
    independent_rework: '# Blind rework of IB/2002/P4/q17B


      **(a)** Put \(M_R=\sup_{0\le\theta\le\pi}|f(Re^{i\theta})|\). The limit at infinity
      means \(M_R\to0\). On the arc, \(|e^{i\lambda z}|=e^{-\lambda R\sin\theta}\)
      and \(|dz|=R\,d\theta\). Symmetry about \(\pi/2\) and the given sine bound yield

      \[

      \left|\int_{\Gamma_R}f(z)e^{i\lambda z}\,dz\right|

      \le 2RM_R\int_0^{\pi/2} e^{-2\lambda R\theta/\pi}\,d\theta

      =\frac{\pi M_R}{\lambda}(1-e^{-\lambda R})\longrightarrow0.

      \]


      **(b)** Integrate \(e^{iz}/z\) counterclockwise around the upper half-annulus.
      The integrand is holomorphic on a neighbourhood of this contour and its enclosed
      region since zero is excluded. The straight portions, traversed from \(-R\)
      to \(-r\) and \(r\) to \(R\), sum to \(2i\int_r^R\sin x\,dx/x\) by substituting
      \(x\mapsto-x\) in the negative portion. The outer arc tends to zero by (a) with
      \(f(z)=1/z\) and \(\lambda=1\). The inner arc is clockwise, parameterized by
      \(\theta\) decreasing from \(\pi\) to zero; its integral is \(\int_\pi^0 i e^{ir
      e^{i\theta}}\,d\theta\to-i\pi\), since \(e^{ir e^{i\theta}}\to1\) uniformly.
      Their sum is zero by Cauchy''s theorem. Taking \(R\to\infty\) and \(r\downarrow0\)
      gives \(\int_0^\infty\sin x\,dx/x=\pi/2\). The sine quotient extends continuously
      to zero, and the upper-tail convergence also follows by integration by parts
      with a bounded primitive of \(\sin x\).

      '
    main_comparison: The exponential decay on the upper semicircle and the angular
      sine bound control the outer arc by pi times the supremum over lambda. The clockwise
      indentation contributes minus i pi. The difference of the two real-segment integrals
      gives twice i times the ordinary sine integral.
