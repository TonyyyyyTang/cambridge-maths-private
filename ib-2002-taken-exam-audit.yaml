      source_comparison: Compared (a)–(c), homotopy and strict boundary inequality,
        closed/open disk mapping, conjugate in denominator, exponents and the subtraction
        of a. No item or subpart marks are printed alongside this question.
    independent_rework: '# Blind rework of IB/2002/P3/q13G


      **(a)** Parameterize the simple closed curve with positive orientation. Null
      homotopy in \(D\) gives winding number zero about every point outside \(D\),
      so its Jordan interior lies in \(D\). For \(t\in[0,1]\) put \(h_t=f+tg\). On
      the curve, \(|h_t|\ge |f|-|g|>0\), uniformly by compactness. Hence the loops
      \(h_t(\gamma)\) constitute a homotopy in \(\mathbb C\setminus\{0\}\), and their
      winding numbers about zero agree. By the argument principle the winding number
      for \(h_t\) counts its interior zeros with multiplicity. The counts at \(t=0\)
      and \(t=1\) therefore agree.


      **(b)** On \(|z|=1\) the mapping assumption gives \(|g(z)|<1=|z|\). Apply (a)
      to \(f(z)=z\) and perturbation \(-g\). Both functions are analytic on a neighbourhood
      of the closed disk. Thus \(z-g(z)\) has exactly one zero counting multiplicity
      in the open disk. It is a simple fixed point of \(g\) in the sense that \(z-g(z)\)
      has a simple zero.


      **(c)** Take \(m,n\) to be nonnegative integers as implicit in the zero count.
      Put \(B(z)=(z-a)/(1-\bar a z)\). Its denominator is nonzero on a neighbourhood
      of the closed disk, since for \(a\ne0\) the pole is at \(1/\bar a\) outside;
      for \(a=0\) there is no denominator zero. On \(|z|=1\), direct expansion gives
      \(|z-a|^2=|1-\bar a z|^2\). Thus \(z^m B(z)^n\) has boundary modulus 1, exceeding
      the modulus of the constant perturbation \(-a\). By (a) the perturbed function
      has as many interior zeros as the product. The factors contribute \(m\) zeros
      at 0 and \(n\) at \(a\), counted with multiplicities including coincident roots
      when \(a=0\). The count is \(m+n\).

      '
    main_comparison: Rouché follows from the nonvanishing boundary homotopy and the
      argument principle. The unit disk fixed point has multiplicity one. The finite
      Blaschke product has unit boundary modulus and its zeros at zero and a contribute
      m+n with multiplicity.
