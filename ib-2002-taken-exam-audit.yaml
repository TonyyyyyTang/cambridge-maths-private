      source_comparison: Compared the full text and both supplied table images visually.
        Rows 17,22,11 and 43,78,29, all totals, and the printed 99% quantiles for
        1,2,3,5,6 degrees of freedom agree. No item or subpart marks are printed alongside
        this question.
    independent_rework: '# Blind rework of IB/2002/P1/q12H


      Condition on the stated group sizes \(r_1=50,r_2=150\), and take independent
      individual categorical responses. Write \(n_{ij}\) for the counts and \(c_j=\sum_i
      n_{ij}\). Under the unrestricted model the two rows have probability triples
      \(p_{ij}\), each summing to one. The likelihood is \(C\prod_{i,j}p_{ij}^{n_{ij}}\),
      where \(C\) consists of the multinomial coefficients. Under independence the
      rows share one triple \(p_j\).


      A Lagrange multiplier for each unrestricted row gives \(n_{ij}/p_{ij}=\lambda_i\),
      hence \(\lambda_i=r_i\) and \(\widehat p_{ij}=n_{ij}/r_i\). Under the null the
      equations give \(\widehat p_j=c_j/200\). All counts are positive here and concavity
      of the log likelihood makes these maxima. Consequently the likelihood ratio
      \(\Lambda=\sup_{H_0}L/\sup L\) gives

      \[

      G^2=-2\log\Lambda=2\sum_{i,j}n_{ij}\log(n_{ij}/E_{ij}),

      \qquad E_{ij}=r_i c_j/200 .

      \]

      Use large values as evidence against the null. Under the null the asymptotic
      reference law is \(\chi^2_2\) because four free alternative parameters reduce
      to two under the null. From column totals \((60,100,40)\) the expected rows
      are \((15,25,10)\) and \((45,75,30)\). Substituting observed rows \((17,22,11)\)
      and \((43,78,29)\) gives \(G^2=0.97007955\). The supplied 99th percentile is
      9.21 and the asymptotic \(p\)-value is \(e^{-G^2/2}=0.61567\). Retain the independence
      hypothesis at the 1% level.

      '
    main_comparison: The fixed-row multinomial ratio fits expected rows (15,25,10)
      and (45,75,30). Twice the log likelihood difference gives 0.97008 on two degrees
      of freedom, below the 1 percent upper critical value.
