      source_comparison: Compared signs/order of all three angular momentum operators,
        F=(x+iy)z, and the two requested eigenvalues. No item or subpart marks are
        printed alongside this question.
    independent_rework: '# Blind rework of IB/2002/P2/q9D


      Let \(F=xz+iyz\). The Cartesian momenta are \(P_j=-i\hbar\partial_j\). Set \(D_x=y\partial_z-z\partial_y,\
      D_y=z\partial_x-x\partial_z,\ D_z=x\partial_y-y\partial_x\), so \(L_j=-i\hbar
      D_j\). Then

      \[

      D_zF=ixz-yz=iF,\quad D_xF=xy+i(y^2-z^2),\quad

      D_yF=z^2-x^2-ixy.

      \]

      Applying the same operators a second time gives \(D_z^2F=-F,\ D_x^2F=-xz-4iyz,\
      D_y^2F=-4xz-iyz\). Thus \(L_zF=\hbar F\) and \(\mathbf L^2F=-\hbar^2(D_x^2+D_y^2+D_z^2)F=6\hbar^2
      F\). Equivalently the angular quantum numbers are \(m=1,\ \ell=2\).

      '
    main_comparison: The quadratic harmonic polynomial has Euler degree two. Expansion
      of the angular momentum operators gives L squared eigenvalue six hbar squared,
      and direct azimuthal differentiation gives Lz eigenvalue hbar.
