    independent_rework: '# Blind rework of IB/2002/P1/q1E


      **(a)** Take \(f_n(x)=\min(1,\max(0,nx))\). Truncation to \([0,1]\) is 1-Lipschitz,
      so \(f_n\) is \(n\)-Lipschitz on the entire real line. At any \(x>0\), \(f_n(x)=1\)
      eventually. At \(x\le0\) it is always zero. The pointwise limit jumps from zero
      at 0 to one immediately to its right.


      **(b)** Given \(\epsilon>0\), fix \(N\) with \(\sup_x|f_N(x)-f(x)|<\epsilon/3\).
      Choose \(\delta>0\) for uniform continuity of this one function \(f_N\), at
      tolerance \(\epsilon/3\). For \(|x-y|<\delta\),

      \[

      |f(x)-f(y)|\le |f(x)-f_N(x)|+|f_N(x)-f_N(y)|+|f_N(y)-f(y)|<\epsilon.

      \]

      This proves uniform continuity of the limit and hence continuity. In (a) the
      changing Lipschitz constants are consistent with the different conclusion.

      '
    main_comparison: The clipped linear ramps have finite individual Lipschitz constants
      and converge pointwise to the right step, discontinuous at zero. Uniform convergence
      supplies a single approximation on both arguments and transfers uniform continuity.
