    independent_rework: '# Blind rework of IB/2002/P3/q17F


      Use the Leibniz definition \(\det A=\sum_{\sigma\in S_n}\operatorname{sgn}(\sigma)\prod_{i=1}^n
      a_{i,\sigma(i)}\). Each term uses one entry of each row, so the determinant
      is linear in each row separately. Swapping two rows reindexes the permutations
      by composition with one transposition and reverses their signs. With two identical
      rows the permutation terms pair with equal products and opposite signs, giving
      zero over any field. Adding \(c\) times row \(i\) to distinct row \(j\) thus
      adds \(c\) times a determinant with identical rows, leaving the determinant
      unchanged.


      For the block triangular \(X\), a permutation making a nonzero contribution
      must send all the bottom \(n\) rows to the last \(n\) columns. It then sends
      the top \(n\) rows to the first \(n\) columns. Such permutations are independent
      permutations of the two index sets and their signs multiply since there are
      no cross-block inversions. Summing the factored products gives \(\det X=\det
      A\,\det C\).


      In \(\left(\begin{smallmatrix}B&I\\0&A\end{smallmatrix}\right)\), add \(-a_{ij}\)
      times top row \(j\) to bottom row \(i\) for each \(1\le i,j\le n\), leaving
      the top rows available unchanged. The bottom blocks become \(-AB\) and \(A-A=0\).
      The determinant remains \(\det B\det A\). Exchange the two blocks of columns,
      which consists of the \(n\) swaps of column \(j\) with column \(j+n\); the Leibniz
      formula gives sign \((-1)^n\). The resulting block triangular determinant is
      \(\det I\det(-AB)=(-1)^n\det(AB)\). Cancelling the two sign factors gives \(\det(AB)=\det
      A\det B\), also when either matrix is singular.

      '
    main_comparison: The permutation definition gives alternation and the block triangular
      product. Lower-row additions create the −AB block. The n column swaps give the
      same sign as taking the determinant of −AB, yielding multiplicativity.
