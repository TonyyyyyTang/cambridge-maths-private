    boost-2015.md:
      sha256: ff826d02a49622d11d1e8abc87b3f58c3d6edb9210237ed266db1e4f2b6af2d3
      text: |
        # Independent rework of the free-particle problem

        (i) In Cartesian position coordinates \(p_j=-i\hbar\partial_j\). Acting on \(f=Ae^{i\mathbf k\cdot\mathbf x}\) gives \(p_j f=\hbar k_j f\) for all three \(j\). Thus \(Hf=(\sum_jp_j^2/2m)f=\hbar^2|\mathbf k|^2 f/(2m)\). Take \(A\ne0\), real \(\mathbf k\) and \(m>0\). On all of space these are generalised eigenstates; the case \(\mathbf k=0\) has zero momentum and energy.

        (ii) Put \(\mathbf y=\mathbf x-\mathbf u t\), \(g=e^{i\mathbf k\cdot\mathbf x-i\Omega t}\), \(\Omega=\hbar|\mathbf k|^2/(2m)\). Let \(D=i\hbar\partial_t+(\hbar^2/2m)\Delta\). Using the chain and product rules and dividing by \(g\),
        \[
        D(g\Psi(\mathbf y,t))/g=(D\Psi)(\mathbf y,t)+i\hbar(\hbar\mathbf k/m-\mathbf u)\cdot\nabla\Psi+(\hbar\Omega-\hbar^2|\mathbf k|^2/(2m))\Psi.
        \]
        The first term vanishes by the free equation, the second by the required relation, and the third by the definition of \(\Omega\). This proves the result, including the identity transformation when \(\mathbf u=0\). The manipulation applies to classical solutions, or distributionally by multiplication by a smooth phase and translation.
    hydrogen-radial-2015.md:
      sha256: b35012abd1de4bedcbc1b38b353fe6c28a477e115ce63f08452a72625fcee41d
      text: |
        # Independent rework of the hydrogen exponential

        Write \(b=e^2/(4\pi\epsilon_0)>0\). At \(r>0\), the logarithmic derivative of the proposed radial function is \(-1/a\). Thus
        \[
        H\psi/\psi=-\hbar^2/(2ma^2)+(\hbar^2/(ma)-b)/r.
        \]
        For a nonzero candidate the only way for this to be independent of \(r\) is \(a=\hbar^2/(mb)=a_0>0\), the Bohr radius for a stationary proton. The energy is \(-\hbar^2/(2ma_0^2)=-mb^2/(2\hbar^2)\). The state is finite at zero and decays at infinity. The flux through a small sphere is \(4\pi r^2\psi'(r)\to0\), so the cusp adds no point source.

        The radial norm measure is \(4\pi r^2dr\). Integration by parts gives \(\int_0^\infty r^n e^{-\lambda r}dr=n!/\lambda^{n+1}\) for integer \(n\ge0,\lambda>0\). For \(\lambda=2/a_0\) the norm is \(4\pi|C|^2(2!/\lambda^3)=\pi|C|^2a_0^3\). Consequently \(C=e^{i\theta}/\sqrt{\pi a_0^3}\). Taking the quotient of the third and second moments gives \(\langle r\rangle=3/\lambda=3a_0/2\), one and a half Bohr radii.
