    oscillator-2015.md:
      sha256: 43885e53316956904084730ddc5869821c88e377f8501008bd80a16046f1818f
      text: |
        # Independent rework with potential V

        Use \(b=(\hbar/m\omega)^{1/2}\) and the standard normalized one-dimensional eigenfunctions \(\phi_n(x)=H_n(x/b)e^{-(x/b)^2/2}/(\pi^{1/4}\sqrt{2^n n!b})\), with \(n=0,1,\ldots\). The potential and the kinetic energy both split by coordinate. For the product \(\prod_j\phi_{n_j}(x_j)\) each one-dimensional operator contributes its eigenvalue \(\hbar\omega(n_j+1/2)\). This gives \(E=\hbar\omega(n_1+n_2+n_3+3/2)\). Products form an orthonormal basis of the three-dimensional space since their three factors independently range over complete one-dimensional bases.

        Let \(N=n_1+n_2+n_3\). Splitting \(N\) objects by two dividers gives \(\binom{N+2}{2}\) triples and the same eigenspace dimension for each nonnegative integral \(N\). At \(N=0\) the product is \(G=(\pi b^2)^{-3/4}e^{-r^2/(2b^2)}\), invariant under rotations. Seek a second radial eigenstate as \(P G\), where \(P=r^2+c\). Applying \(H\) by the product rule yields
        \[
        H(PG)/G=\tfrac32\hbar\omega P-\tfrac{\hbar^2}{2m}\Delta P+\hbar\omega\,\mathbf x\cdot\nabla P
        =\tfrac32\hbar\omega P-3\hbar^2/m+2\hbar\omega r^2.
        \]
        For eigenvalue \(7\hbar\omega/2\), the last two terms must equal \(2\hbar\omega P\), hence \(c=-3b^2/2\). This state is nonzero, square-integrable and spherically symmetric.
    oscillator-early.md:
      sha256: 20a7221ccd2adefca6181ec58e52bf0f7c92e50651cdf4b8337806faf30f2c3a
      text: |
        # Independent rework in Cartesian coordinates

        Take \(m,\omega>0\), \(b=\sqrt{\hbar/(m\omega)}\), \(s=x/b\). The one-dimensional Hamiltonian divided by \(\hbar\omega\) is \(a^\dagger a+1/2\), with \(a=(s+\partial_s)/\sqrt2\), \([a,a^\dagger]=1\). The norm identity for successive lowered eigenstates of \(a^\dagger a\) with initial eigenvalue \(\nu\) gives factorial products \(\nu(\nu-1)\cdots(\nu-j+1)\). Positivity requires the lowering chain to terminate at a nonnegative integer \(\nu=n\). The lowest solution of \(a\phi_0=0\) is proportional to \(e^{-s^2/2}\). The normalized Hermite functions are
        \[
        \phi_n(x)=\frac{H_n(x/b)e^{-x^2/(2b^2)}}{\pi^{1/4}\sqrt{b\,2^n n!}}.
        \]
        They are the successive normalized raises of this state.

        In three dimensions the Hamiltonian is a sum of the three commuting one-variable Hamiltonians. Acting on \(\phi_{N_x}(x)\phi_{N_y}(y)\phi_{N_z}(z)\) gives \(E=\hbar\omega(3/2+N_x+N_y+N_z)\). These products form an orthonormal basis by completeness of the Hermite functions on each line. With time included each stationary state acquires \(e^{-iEt/\hbar}\).

        At fixed \(N\), fixing \(N_x=k\) leaves \(N-k+1\) choices for \((N_y,N_z)\). Summing \(k=0,\dots,N\) gives \((N+1)(N+2)/2\), including one ground state. It is \(G=(\pi b^2)^{-3/4}\exp(-r^2/(2b^2))\). At \(N=2\), sum the three product states with two quanta along one axis and divide by \(\sqrt3\). From \(H_2(s)=4s^2-2\) their sum gives \((2r^2/b^2-3)G/\sqrt6\). It is normalized by orthogonality and depends only on \(r\).
    q05.md:
      sha256: 34e70198ef8df509b1299db639602ae8836e18ee718cd0ce070cf4c373da888c
      text: |
        # Independent rework with potential U

        The Cartesian Hamiltonian is \(H=\sum_{j=1}^3[-\hbar^2\partial_j^2/(2m)+m\omega^2 x_j^2/2]\). By the given one-dimensional oscillator result, choose \(b=\sqrt{\hbar/(m\omega)}\) and normalized eigenfunctions \(\phi_n(t)=(2^n n!\sqrt\pi b)^{-1/2}H_n(t/b)e^{-t^2/(2b^2)}\). Then \(F_{\mathbf n}=\phi_{n_1}(x_1)\phi_{n_2}(x_2)\phi_{n_3}(x_3)\) has energy \((n_1+n_2+n_3+3/2)\hbar\omega\), since each summand differentiates only its own factor. Product orthonormality and completeness follow from the one-dimensional basis in each coordinate, giving precisely these levels at nonnegative integer total \(N\).

        The number of triples with total \(N\) is the coefficient of \(z^N\) in \((\sum_{n\ge0}z^n)^3=(1-z)^{-3}\), namely \((N+1)(N+2)/2\). Write \(G=F_{000}=(\pi b^2)^{-3/4}e^{-r^2/(2b^2)}\). It is the unique ground state up to phase and depends only on \(r\). Using \(\phi_2/\phi_0=(2t^2/b^2-1)/\sqrt2\), the normalized state \((F_{200}+F_{020}+F_{002})/\sqrt3\) is \(G(2r^2/b^2-3)/\sqrt6\). Each term has total \(N=2\), and the last expression is invariant under rotations.
    q06.md:
      sha256: e39697f7765b0366f8d23684c3f6cd8722473500c9bf3852ffc0fbb57d580102
      text: |
        # Independent rework of the radial eigenfunction problem

        (a) Applying the chain rule on \(\mathbb R^3\setminus\{0\}\) gives \(\nabla\chi=\chi'\mathbf r/r\). The radial divergence is \(r^{-2}\partial_r(r^2\chi')=\chi''+2\chi'/r=(r\chi)''/r\). Since \(\mathbf p^2=-\hbar^2\Delta\), conjugation of the first derivative by multiplication by \(r\) gives the factorization: \(p_r=-i\hbar r^{-1}\partial_r r=-i\hbar(\partial_r+1/r)\), whose square is \(-\hbar^2r^{-1}\partial_r^2 r\). This statement concerns the differential expressions on radial functions; singular functions at the origin or closed operator domains require separate boundary analysis.

        For the radial measure \(4\pi r^2dr\), the boundary form is \(-4\pi i\hbar[(rf)^*(rg)]_0^\infty\). The usual regular functions with vanishing endpoint products, or the smooth compactly supported core away from zero, therefore give a symmetric (formally Hermitian) momentum. To test self-adjointness transform by \(f\mapsto \sqrt{4\pi}rf\), which sends \(p_r\) to \(P=-i\hbar d/dr\) on the half-line. The closure on \(H_0^1\) requires the reduced function to vanish at the origin. Its adjoint on \(H^1\) also admits nonzero boundary values. The deficiency equations \(P^*u=\pm i\lambda u\), \(\lambda>0\), have respective solutions \(e^{-\lambda r/\hbar}\) and \(e^{+\lambda r/\hbar}\) up to scale. Their square-integrable dimensions are 1 and 0. The radial momentum thus has no self-adjoint extension in this space.

        (b) Set \(g=e^2/(4\pi\epsilon_0)\). For \(\chi=Ce^{-r/a}\), the radial Laplacian divided by \(\chi\) is \(a^{-2}-2/(ar)\). Dividing the Schrödinger equation by the nonzero function gives
        \[
        E=-\hbar^2/(2m_ea^2)+(\hbar^2/(m_ea)-g)/r.
        \]
        The coefficient of \(1/r\) must vanish, giving \(a=\hbar^2/(m_e g)=a_0\) and \(E=-m_e g^2/(2\hbar^2)\). This choice has positive decay length and belongs to the regular hydrogen branch, with \(r\chi\to0\) at zero and no distributional point source because \(r^2\chi'\to0\).

        For \(\lambda=2/a\), successive integration by parts gives \(\int_0^\infty r^k e^{-\lambda r}dr=k!\lambda^{-(k+1)}\). The normalized three-dimensional wavefunction has \(4\pi |C|^2(2!)/\lambda^3=1\), hence \(|C|=(\pi a^3)^{-1/2}\), with arbitrary overall phase. Its mean separation is \(4\pi|C|^2(3!)/\lambda^4=3/\lambda=3a_0/2\), greater than the Bohr radius by one half of that radius.
    radial-2018.md:
      sha256: bcf66061fcc9d6b960f64911c68a00aa952d98592164ed8a48f1ae1efc9d0e64
      text: |
        # Independent rework of the radial wavefunction problem

        (a) For \(r>0\), \(\partial_{x_j}r=x_j/r\), so \(\nabla\psi=\hat{\mathbf r}\psi'\). The divergence of \(\hat{\mathbf r}\) is \(3/r-r^2/r^3=2/r\). Therefore \(\Delta\psi=\psi''+2\psi'/r=(r\psi)''/r\). Writing \(p_r\psi=-i\hbar(r\psi)'/r\) gives \(p_r^2\psi=-\hbar^2(r\psi)''/r=\mathbf p^2\psi\) as differential expressions. The origin requires regular radial boundary conditions. The equality holds, for instance, on smooth radial test functions supported away from zero; it is not a claim that the closed operators have identical domains.

        The radial inner product has measure \(4\pi r^2dr\). Integration by parts gives \(\langle f,p_rg\rangle-\langle p_rf,g\rangle=-4\pi i\hbar[r^2 f^*g]_0^\infty\). Vanishing endpoint terms give Hermiticity in the sense of symmetry. For a precise distinction, \(u=\sqrt{4\pi}r f\) carries the radial Hilbert space unitarily to \(L^2(0,\infty;dr)\). It sends \(p_r\) to \(-i\hbar\,d/dr\). Its closed symmetric realization on \(H_0^1(0,\infty)\) requires \(u(0)=0\), while the adjoint on \(H^1(0,\infty)\) has no endpoint condition. For a positive momentum \(\lambda\), the solutions of \(p_r^*u=\pm i\lambda u\) are \(e^{\mp\lambda r/\hbar}\); only the decaying one is square-integrable. Unequal deficiency indices \((1,0)\) preclude a self-adjoint extension of this radial momentum.

        (b) Let \(b=e^2/(4\pi\epsilon_0)\) and set \(v=r\psi=Cr e^{-r/a}\). Then \(v''=C e^{-r/a}(r/a^2-2/a)\). The equation becomes \(-\hbar^2 v''/(2m_e)-b v/r=Ev\), whose constant coefficient after cancelling the common exponential gives \(\hbar^2/(m_ea)-b=0\), and whose linear coefficient gives \(E=-\hbar^2/(2m_e a^2)\). Thus \(a=\hbar^2/(m_e b)=a_0>0\) and \(E=-m_e b^2/(2\hbar^2)\). The reduced function has \(v(0)=0\) and exponential decay, with regular full wavefunction at the origin. In particular no \(1/r\) singular branch is present.

        With \(J_n=\int_0^\infty r^ne^{-2r/a}dr=n!(a/2)^{n+1}\), normalization gives \(4\pi|C|^2 J_2=1\), or \(C=e^{i\theta}(\pi a^3)^{-1/2}\). The mean distance is \(J_3/J_2=3a/2=3a_0/2\) for the stationary proton.
