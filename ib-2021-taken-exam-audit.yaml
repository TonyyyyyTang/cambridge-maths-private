      Using the printed columns u₁,u₂,u₃,w₁,w₂,w₃ in that order, row reduction gives nonzero rows (1,0,0,5/3,0,−1), (0,1,0,0,0,0), (0,0,1,−2/3,0,−1), (0,0,0,0,1,0). This establishes dim U=3, dim W=3 (columns 4 and 6 independent in pivot rows 1 and 3), and dim(U+W)=4. The dimension formula gives 2; indeed w₁ and w₃ span the intersection.

      Expand the determinant multilinearly in the columns. Every tʳ term takes r columns from B and therefore vanishes when r>k by dependence among these columns. The coefficient of tⁿ is det B, nonzero for k=n. In dimension two choose A=0, B=diag(1,0), yielding determinant identically zero with k=1.
