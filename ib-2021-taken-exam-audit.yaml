    independent_rework: |
      # IB/2021/P4/q7H — independent rework

      Started from 0, the walk returns at time 2n with probability aₙ=binomial(2n,n)/4ⁿ; odd times are impossible. The supplied factorial bounds put aₙ between positive constants times n⁻¹ᐟ². Thus the expected number of visits to 0, including time zero, diverges. If the probability r of a positive-time return were less than one, the strong Markov property at returns would give geometric visit count with mean 1/(1−r). Hence r=1, and all states are recurrent by translation.

      For three independent walks from zero the simultaneous-return probability at 2n is aₙ³=O(n⁻³ᐟ²), summable. The first Borel–Cantelli lemma makes the probability of infinitely many simultaneous visits zero, without any independence in time. This remains true for arbitrary fixed initial positions: incompatible parities preclude simultaneous hits; if a first joint hit occurs the strong Markov property reduces all subsequent visits to the case just treated.
    comparison: The geometric-return argument correctly translates divergence of the one-dimensional Green sum into
      recurrence; divergence of expectations alone would not suffice. Cubing the point probabilities gives summability
      and first Borel–Cantelli. The canonical uniform binomial bound and the rework’s first-joint-hit argument both
      extend to arbitrary fixed starts.
