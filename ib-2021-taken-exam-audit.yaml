    independent_rework: |
      # IB/2021/P4/q14C — independent rework

      For t>0 and D>0 put h=t⁻¹ᐟ² exp(−x²/(4Dt)). Then h_t=h[−1/(2t)+x²/(4Dt²)]=Dh_xx. Its mass by x=2√(Dt)s is 2√(πD). Dividing gives the unit-mass kernel G_t. Against any bounded continuous test function the same substitution yields π⁻¹ᐟ²∫exp(−s²)φ(2√(Dt)s)ds→φ(0) by dominated convergence, proving the delta trace.

      By superposition, convolution of the top hat with G_t is ∫₋₁¹G_t(x−v)dv=[Erf((x+1)/(2√(Dt)))−Erf((x−1)/(2√(Dt)))]/2. It is even and mass 2 for t>0. At t=0 draw a flat height-one segment on [−1,1] with closed top endpoints and height zero outside, open at the lower endpoints. At small positive time round each edge over width of order √(Dt); at x=±1 the limit as t decreases to zero is 1/2. For all positive times there is a smooth symmetric maximum at x=0 of height Erf(1/(2√(Dt))) decreasing with time, strict decrease for x>0 since θₓ=G_t(x+1)−G_t(x−1)<0, positive tails tending to zero. At large time it spreads and flattens, approximately 2G_t on the diffusive spatial scale; the area remains constant. These properties determine the requested sketches.
    comparison: 'Gaussian mass, delta trace and the two-error-function convolution agree; smoothing preserves area
      two and the t↓0 limit is 1/2 at the endpoints. Inspected the actual PNG: a dashed initial box and three symmetric
      curves for Dt=0.02, 0.2, 1 show decreasing central heights and broadening tails. The vertical jump connectors
      are a conventional sketch; the prose explicitly specifies the initial endpoints.'
    substantive_error: false
