    independent_rework: |
      # IB/2021/P2/q14A — independent rework

      Oddness reduces the transform to −2i∫₀¹sin(kx) dx=−2i(1−cos k)/k, with limiting value 0 at k=0. The inverse transform of exp(−λ|k|) is π⁻¹ Re∫₀∞exp[−(λ−ix)k] dk=λ/[π(λ²+x²)], justified by λ>0.

      Extend the bottom data oddly across x=0 to f. In the upper half-plane the transformed equation is û_yy−k²û=0, whose decaying mode has multiplier exp(−|k|y); the zero mode here has zero data. Inversion gives convolution with P_y(s)=y/[π(s²+y²)]. Integrating separately on the two intervals gives u=∫₀¹(P_y(x−v)−P_y(x+v))dv. The difference is (4xy/π)v/{[(x−v)²+y²][(x+v)²+y²]}, as claimed for y>0. Odd symmetry gives u(0,y)=0. Compact support and the kernel bounds give decay along each unbounded direction. P_y is a unit-mass approximate identity, yielding the boundary trace at continuity points. At the jump x=1 the vertical limit is 1/2, although one may assign the printed value 0 on the boundary itself. At (0,0) the two traces differ and there is no continuous extension.

      By linearity and symmetry w=u(x,y)+u(y,x) in the interior. This sum gives both required traces on the open edges away from jumps and decays as stipulated. The assigned values at the isolated jumps and at the corner do not affect the interior; w approaches 1 at the corner, while its prescribed point value there is 0.
    comparison: 'All Fourier constants, the zero frequency, convolution signs and superposition agree. Canonical
      treats the bounded Poisson extension and the bottom jump at x=1 correctly. At the origin the separate boundary
      assignment does not force continuity: u has direction-dependent limits and w tends to 1 although the assigned
      w(0,0) is zero. The canonical statement about open smooth segments accommodates this. No repair required.'
    substantive_error: false
