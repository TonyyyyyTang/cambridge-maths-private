      The advective derivative vanishes for this parallel flow and pressure is constant; Navier–Stokes reduces to u_t=νu_yy. Put Y=y/L₀ and z=(1+i)∆, so f_YY=z²f with no-slip f(±1)=±1. The cosh term vanishes on adding the two wall equations (cosh z≠0 as Re z>0), leaving f=sinh(zY)/sinh z.

      Multiply by the conjugate denominator. Twice its squared modulus is H=cosh(2∆)−cos(2∆)>0. Twice the numerator product is cosh(zY+conj z)−cosh(zY−conj z), via the hyperbolic product identity. Here the two arguments are ∆₊−i∆₋ and −∆₋+i∆₊. Thus Re f=[cosh ∆₊ cos ∆₋−cosh ∆₋ cos ∆₊]/H and −Im f=[sinh ∆₊ sin ∆₋−sinh ∆₋ sin ∆₊]/H. Re(f exp(iωt)) combines these with cos ωt and sin ωt respectively, exactly giving (b). Wall values and the zero at the midpoint follow directly.

      Uniformly for |Y|≤1, f=Y[1+z²(Y²−1)/6+O(∆⁴)], so u/U₀=Y cos ωt+O(∆²). Diffusion across the layer is fast compared with the oscillation time (ωL₀²/ν=2∆²≪1); the leading velocity adjusts to the instantaneous linear Couette profile. This is an additive approximation valid even at phases where cos ωt=0.
    comparison: No-slip and odd wall forcing give the same unique complex amplitude. The product-to-sum expressions
      differ in the sign of the second entire complex argument only, by evenness of cosh. The sine coefficient and
      both wall values agree. The uniform low-frequency absolute approximation remains valid at phases of vanishing
      leading profile.
