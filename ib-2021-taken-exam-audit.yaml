    independent_rework: |
      # IB/2021/P1/q6H — independent rework

      Sufficiency means that the conditional law of the entire sample given T has a version independent of p. Take T=ΣXᵢ. Each binary vector with sum s has probability pˢ(1−p)ⁿ⁻ˢ, so conditional on T=s the vector is uniform on the binomial(n,s) such vectors.

      If S is a square-integrable estimator and T sufficient, R=E[S|T] is a statistic since the conditional law used to compute it is parameter independent. The tower law preserves its expectation and hence unbiasedness if S is unbiased. Orthogonality E[(S−R)(R−ES)]=0 follows by conditioning on T. Thus Var S=Var R+E[(S−R)²], so the improvement is strict unless S=R almost surely. More generally conditional Jensen gives no higher expected convex loss whenever the expectations exist.

      For S=X₁X₂, ES=p². The conditional probability that positions 1,2 are both successes is s(s−1)/(n(n−1)) including s=0,1. On T=2, of positive probability for interior p, it equals 1/binomial(n,2) strictly between 0 and 1 for n≥3. Conditional Bernoulli variance is strictly positive on this event. Thus R has smaller variance for every permitted p.
    comparison: Sufficiency follows from the uniform conditional sample, Rao–Blackwell preserves expectation by
      conditioning and reduces variance by the law of total variance. Exact strictness comes from T=2, which has
      positive probability and nondegenerate conditional law for n≥3 and 0<p<1. Both solutions obtain the same unbiased
      estimator.
    substantive_error: false
    check:
      returncode: 0
      stdout: All binary outcomes through n=7 confirm the conditional estimator, unbiasedness and strict variance
        reduction.
