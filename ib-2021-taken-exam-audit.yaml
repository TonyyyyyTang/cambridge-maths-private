      Let N=A−I. It equals the outer product (−3,3,−1)ᵀ(1,2,3), whose inner contraction is zero. Therefore N²=0 but N≠0. The only eigenvalue is 1, the monic characteristic polynomial is (t−1)³, and the minimal polynomial is (t−1)². The largest Jordan block has size 2, leaving a 1×1 block. The Jordan form is J₂(1)⊕[1].

      For 0≠v∈W_{α,n} pick the least r≥1 with (f−αI)ʳv=0. Then (f−αI)ʳ⁻¹v is a nonzero α-eigenvector. For a relation between the ordinary eigenvectors, applying ∏_{j≠i}(f−αⱼI) leaves the i-th term multiplied by the nonzero scalar ∏_{j≠i}(αᵢ−αⱼ). Each coefficient must vanish. In the generalized case apply ∏_{j≠i}(f−αⱼI)ⁿ. The operators commute and kill every other term. On W_{αᵢ,n}, each factor f−αⱼI is invertible since it equals (αᵢ−αⱼ)I+Nᵢ with Nᵢⁿ=0 there (a finite geometric series gives the inverse). Hence the remaining coefficient vanishes as well. Empty products give the result for a single vector.
    comparison: Rank-one factorisation with zero contraction proves a nonzero square-zero shift, yielding the same
      characteristic and minimal polynomials and Jordan partition. The least annihilating power and the isolating
      polynomials correctly establish the ordinary and generalized independence claims.
