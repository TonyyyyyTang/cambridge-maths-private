      # IB/2021/P4/q4C — independent rework

      For real U the Schrödinger equation and its conjugate imply ∂ₜ|Ψ|²+∂ₓj=0 with j=(ℏ/2mi)(Ψ*Ψₓ−ΨΨₓ*). This follows by the product rule, as the potential terms cancel. For a sufficiently regular state with equal limiting currents, for example Ψ and Ψₓ decaying at both ends, integration yields zero rate of change of the norm. Thus the Born-rule density stays normalized and total probability is conserved.

      Write b=ℏt/m and Q=α²+b²>0. Then |f|=Q⁻¹ᐟ² and Re f=α/Q, yielding |Ψ|²=C²Q⁻¹ᐟ² exp(−αx²/Q). The Gaussian integral is C²√(π/α) at every time. This is independent of the branch of the square root of f and is finite since α>0.
    comparison: Schrödinger continuity, reality of the potential and equal limiting currents are correctly stated.
      The density modulus, positivity of Re f and Gaussian integral give C²√(π/α) for all real times, independent
      of square-root phase.
