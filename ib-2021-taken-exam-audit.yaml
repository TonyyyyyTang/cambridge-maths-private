    independent_rework: |
      # IB/2021/P3/q17B — independent rework

      Distribute j derivatives onto the power and n−j onto the exponential. The product rule yields pₙ=Σ_{j=0}ⁿ (−1)ʲ binomial(n,j)(n+1/2)_{falling j} xⁿ⁻ʲ, first for x>0 and then by polynomial extension at 0. Its high terms are xⁿ−n(n+1/2)xⁿ⁻¹. In particular p₀=1, p₁=x−3/2, p₂=x²−5x+15/4.

      With F=x^{n+1/2}exp(−x), the scalar product with polynomial h is (−1)ⁿ∫hF⁽ⁿ⁾=∫h⁽ⁿ⁾F. All integrations by parts are valid: derivatives F⁽ʲ⁾ for 0≤j<n vanish as O(x^{n+1/2−j}) at zero and decay exponentially times a power at infinity even with polynomial factors. For h=pₘ, m<n, the result is zero; symmetry covers m>n. At m=n it is n!Γ(n+3/2) by monicity.

      Compare the subleading coefficients of the recurrence to obtain αₙ=(n+1)(n+3/2)−n(n+1/2)=2n+3/2. Taking the product with pₙ₋₁ gives βₙ‖pₙ₋₁‖²=⟨pₙ,xpₙ₋₁⟩=‖pₙ‖² since xpₙ₋₁−pₙ has lower degree and is spanned by earlier monic polynomials. The norm ratio and the Gamma recurrence give βₙ=n(n+1/2), valid also for n=1.
    comparison: The Leibniz expansion gives the same first three polynomials and subleading coefficient. Boundary
      terms vanish after every integration by parts, including at the singular-looking origin by polynomial extension.
      The squared norm, and αₙ=2n+3/2, βₙ=n(n+1/2), follow with the correct indices.
