      With the boundary orientation induced by an orientable spanning surface, Stokes gives Φ=∫B·n dS=∮A·dx since B=curl A. A smooth single-valued gauge increment grad χ integrates to χ(end)−χ(start)=0. Static Ampère and the identity curl curl A=grad div A−∆A yield −∆A=μ₀J in Coulomb gauge. In free space select the solution decaying at infinity. The fundamental solution of −∆ is 1/(4π|x|), giving A(x)=μ₀I/(4π)∮_C dx′/|x−x′| off the wire by integrating the stated delta source.

      Insert this field from loop j in the line integral on loop i and divide by Iⱼ. For the separated loops, the symmetric kernel (dx₁·dx₂)/|x₁−x₂| has no singularity, and interchanging the integrals gives L₁₂=L₂₁ equal to μ₀/(4π) times that double integral. With both positive orientations viewed from above, circle azimuths φ and ψ yield numerator ab cos(φ−ψ) dφ dψ, distance √(S−2ab cos(φ−ψ)), S=a²+b²+c². Periodicity reduces the double angular integral to 2π times the single difference-angle integral. Thus L=μ₀ab/(2√S)∫ cos θ/√(1−q cos θ) dθ=(μ₀√S/4)f(q) over 0≤θ≤2π. Since S−2ab=(a−b)²+c²>0 for different loops, 0<q<1. Reversing the reference orientation of one loop changes the signed result.
