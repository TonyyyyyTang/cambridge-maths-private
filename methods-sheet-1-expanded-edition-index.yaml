  before_question:
    qx10:
      heading: Fourier series
    qx12:
      heading: The one-dimensional wave equation
    qx16:
      heading: The Dirac delta function
  questions:
    '1':
      unit: IB/methods/sheet-1/qx10
      pages:
      - 1
      text: question.tex
      question_sha256: 475a7bda36798b9211e742157b63297c59eb090a74d427f44c96fafcbdf0383b
      image_review: One printed exercise joins the quartic series and half-range square extensions. Part
        (ii) compares x and |x| without a factor of two. Later editions split the tasks into q02 and q03.
    '2':
      unit: IB/methods/sheet-1/q04
      pages:
      - 1
      text: variants/2001-02/question.tex
      question_sha256: 65ec3e65a9698189b25e1e12e65d89dd02a9e678e6157b8960b00d91c1ac7d34
      image_review: Asks for the Fourier series on (−π,π) and the sum; no specified summation method.
    '3':
      unit: IB/methods/sheet-1/qx11
      pages:
      - 1
      text: question.tex
      question_sha256: 04406d7283c2f0fce1031e783df0c396f558ba90ed182aaf8947cb2810e42fb4
      image_review: Finite k-fold smoothness, the explicit coefficients of |sin x|, checks against Q1
        and Q2, and a numerical-computation discussion referring to Q5.
      same_edition_references:
        '1': IB/methods/sheet-1/qx10
        '2': IB/methods/sheet-1/q04
        '5': IB/methods/sheet-1/q11
    '4':
      unit: IB/methods/sheet-1/qx08
      pages:
      - 1
      text: variants/2001-02/question.tex
      question_sha256: 83e355a09b1c5c040c23da85baf54f45214bd6d4a82edffbe239b49363a8e226
      image_review: The historical wording says “show that”; the canonical 2015 sheet says “show directly
        that”. The two cutoffs are 9π/(2T).
    '5':
      unit: IB/methods/sheet-1/q11
      pages:
      - 1
      text: variants/2001-02/question.tex
      question_sha256: 842b6de80f1835f9fbbaa789db25c259d095c7a06725ea16e919bc03d3151198
      image_review: Printed extrema exclude m=kN, including the erroneous exclusion of odd multiples of
        N. Keeps the literal bounds N−1 and N+1.
    '6':
      unit: IB/methods/sheet-1/qx12
      pages:
      - 2
      text: question.tex
      question_sha256: e3e5a4d83c2d1a60c2ecfa33886417ebdd75d77e8a653509b0bdd57df93a70cd
      image_review: Fixed string initially at rest in position with parabolic initial velocity; asks for
        modes, both time-dependent energies and the odd sixth-power sum.
    '7':
      unit: IB/methods/sheet-1/qx13
      pages:
      - 2
      text: question.tex
      question_sha256: cc6f73839f1b9898db381ee7e3e5f7b3cc3ed66f971e8bda2effb735b682724b
      image_review: Checks both the resistance −2kμy_t with k=πc/ℓ and the additional spatially and temporally
        sinusoidal force.
    '8':
      unit: IB/methods/sheet-1/qx14
      pages:
      - 2
      text: question.tex
      question_sha256: 24eaa4f2d7e50ef9bb604b9b7638b166fb0995f0892d67c7a1fd531d6bfdc054
      image_review: Equation (*) is the wave equation; the point mass at zero gives a slope jump and the
        incident exponential is exp[iω(t−x/c)].
    '9':
      unit: IB/methods/sheet-1/qx15
      pages:
      - 2
      text: question.tex
      question_sha256: 3f55fd41079b4e756ab894581642b29afea95206d0bbd533ece754bb471c0ff6
      image_review: Refers to equation (*) in Q8; fundamental oscillation crosses zero when the impulse
        λδ(x−ℓ/2) changes velocity.
      same_edition_references:
        (*) in question 8: IB/methods/sheet-1/qx14
    '10':
      unit: IB/methods/sheet-1/qx16
      pages:
      - 2
      text: question.tex
      question_sha256: ce686dbb69b67fc4f4f4c24d8c0a1e43376bd45c6198f6482aa2b6fa9dbdbd5a
      image_review: Checks increasing and decreasing φ, the simple-root extension and the final absolute-value
        integral.
    '11':
      unit: IB/methods/sheet-1/qx17
      pages:
      - 2
      text: question.tex
      question_sha256: 2bc0f4109f5793f33cebe885db68d88b2ce1452de9e540d67a36e1858165ab46
      image_review: Double integral contains δ′(x²+y²−1) and δ(x²−y²); right side is f(1)−f′(1).
    '12':
      unit: IB/methods/sheet-1/qx18
      pages:
      - 2
      text: question.tex
      question_sha256: eb93e5cfa80caebe7d9b72f920a04bc59792417188cf6419a32851ad91517cd5
      image_review: Point impulse, one initial displacement and one initial velocity; also asks for the
        mechanical interpretation.
