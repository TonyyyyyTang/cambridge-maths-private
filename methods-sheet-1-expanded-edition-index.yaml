    qx19:
      heading: Fourier Transforms
      wording_tex: 'As in the lectures, for a function $f(x)$, $\tilde f(k)$ is the Fourier transform
        of $f(x)$, defined as

        \[

        \tilde f(k)=\int_{-\infty}^\infty f(x)e^{-ikx}dx.

        \]'
