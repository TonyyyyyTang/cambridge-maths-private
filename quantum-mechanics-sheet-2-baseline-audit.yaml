    blind_rework_utf8: |
      # Quantum Mechanics, Sheet 2, printed question 2, original page 1

      For the attractive point interaction the stationary equation is −(ℏ²/2m)χ''−Uδ(x)χ(0)=Eχ. Continuity of χ follows because a jump would supply a delta derivative in χ'', for which the equation has no matching term. Integrating between ±ε gives −ℏ²[χ'(ε)−χ'(−ε)]/(2m)−Uχ(0)=E∫_{−ε}^{ε}χ dx. Local boundedness makes the right-hand side tend to zero, so χ'(0+)−χ'(0−)=−(2mU/ℏ²)χ(0).

      For E<0 put κ=√(−2mE)/ℏ. Square integrability on each half-line selects A e^{κx} on the left and B e^{−κx} on the right. Continuity gives A=B=C. The jump is −2κC and a nonzero eigenstate has C≠0, forcing κ=mU/ℏ². Thus E=−mU²/(2ℏ²). Since ∫ e^{−2κ|x|} dx=1/κ, the normalised state is √κ e^{−κ|x|} up to a global phase. These matching conditions fixed all choices except this phase. At E=0 a free solution on either exterior half-line is affine, and for E>0 it is oscillatory; square integrability forces both such exterior pieces to vanish. Thus no additional bound eigenstates occur.
    comparison: Continuity excludes a delta-prime term, the derivative jump fixes kappa=mU/hbar^2, the normalised
      state is sqrt(kappa) exp(-kappa |x|) up to phase, its energy is -m U^2/(2 hbar^2), and no nonnegative-energy
      tail is square-integrable. The canonical answer agrees in each case.
