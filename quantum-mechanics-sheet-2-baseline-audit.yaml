    blind_rework_utf8: |
      # Quantum Mechanics, Sheet 2, printed question 3, original page 1

      Normalisability forces E<0, since neither oscillatory nor affine free-wave solutions outside can be square-integrable unless identically zero; uniqueness from zero value and derivative at the edge then forces the zero solution. Also E>−U: the expectation of H+U is the sum of (ℏ²/2m)∫|χ'|² and U∫_{|x|≥a}|χ|², strictly positive for any nonzero normalised state. Thus k=√(2m(E+U))/ℏ and κ=√(−2mE)/ℏ are both positive.

      Odd parity makes χ(0)=0, so on 0<x<a the function is A sin(kx). On x>a it is B e^{−κ(x−a)}. A finite step allows no jumps in either the function or derivative, hence A sin(ka)=B and A k cos(ka)=−κB. A=0 would give only the zero state. Also sin(ka)=0 would give B=0 and force k cos(ka)=0, impossible. Dividing therefore yields k cot(ka)=−κ<0. Under the proposed bound we have 0<ka<a√(2mU)/ℏ<π/2. Cotangent is positive in this interval, so no odd bound state exists. At the threshold a²U=π²ℏ²/(8m) a negative-energy odd solution is also impossible because the first bound on ka is strict; the limiting zero-energy nondecaying tail is not normalisable.
    comparison: Both derivations give -U<E<0, k cot(ka)=-kappa and 0<ka<pi/2, excluding every odd bound state. Both
      handle the zero-sine case and threshold equality; the strict upper bound on ka follows from E<0 even at equality.
