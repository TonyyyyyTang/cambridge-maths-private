    independent_rework: '# IB 2001 Paper 1, 6G


      Take $z$ to increase downwards, let $\mathbf e_z$ be its unit vector and write
      $p_s$ for the pressure at the surface. Hydrostatic force balance on an infinitesimal
      element gives $\nabla p=\rho g\mathbf e_z$, hence $p(z)=p_s+\rho gz$. If $\mathbf
      n$ points outwards from the immersed body''s volume $V$, the fluid exerts the
      resultant

      \[

      -\int_{\partial V}p\mathbf n\,dS

      =-\int_V\nabla p\,dV=-\rho gV\mathbf e_z.

      \]

      Here $p_s+\rho gz$ extends the fluid pressure through the displaced volume.
      The force points vertically upwards with magnitude $\rho gV$.


      Let $W$ denote the iceberg''s total volume. The immersed volume is $W-V_I$.
      Uniform atmospheric pressure cancels over the complete boundary. The balance
      of seawater buoyancy and weight gives $\rho_w(W-V_I)g=\rho_I Wg$, so

      \[

      W=\frac{\rho_w V_I}{\rho_w-\rho_I}.

      \]

      Positive freeboard and positive iceberg density require $0<\rho_I<\rho_w$ in
      this model.

      '
    main_comparison: Continuing the hydrostatic pressure through the displaced volume
      and integrating its gradient gives upward force rho gV. Substituting the actual
      submerged volume into flotation supplies the total volume and the density inequality.
