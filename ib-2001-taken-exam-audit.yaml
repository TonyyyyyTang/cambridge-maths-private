    independent_rework: '# IB 2001 Paper 4, 15C


      For all but finitely many $y\in\mathbb C$, $C=A+yI$ is invertible since its
      determinant is monic in $y$. Then $CB=C(BC)C^{-1}$, so $\det(xI-CB)=\det(xI-BC)$.
      Both sides are polynomials in $y$ for each $x$; equality extends to $y=0$. This
      proves the characteristic polynomial identity, also for singular $A$. Take $A=E_{11}$
      and $B=E_{21}$ of size two. Then $AB=0$ has minimal polynomial $x$, but $BA=E_{21}$
      has minimal polynomial $x^2$.


      For each $k\ge0$, $B(AB)^k A=(BA)^{k+1}$. By linearity $(BA)p(BA)=Bp(AB)A=0$,
      so the minimal polynomial of $BA$ divides $xp(x)$, by polynomial division. Diagonalizability
      of $AB$ makes $p$ the product of distinct linear factors. In the Jordan form
      of $BA$ every block for a nonzero eigenvalue has size one, and any blocks for
      zero have size at most two. Squaring therefore makes every zero block zero and
      every other block a scalar of size one. Thus $(BA)^2$ is diagonalizable, as
      is $(AB)^2$. The original characteristic polynomial identity gives identical
      multisets of eigenvalues with multiplicity, so squaring produces the same multisets
      again, even when opposite eigenvalues coalesce. The two diagonal forms agree
      up to permutation, proving conjugacy.

      '
    main_comparison: A scalar perturbation proves characteristic-polynomial equality
      including singular factors. The adjoint-order product identity bounds the possible
      zero Jordan blocks by size two for diagonalizable AB. Squaring kills those blocks;
      the two squares are diagonalizable with matching eigenvalue multiplicities.
