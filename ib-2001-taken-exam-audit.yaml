    independent_rework: '# IB 2001 Paper 2, 5E


      Eliminate the first column below the leading $2$ using multipliers $-2,2,-3$.
      The new bottom three rows are $(0,1,2,2),(0,0,-3,2),(0,2,1,7)$. The second-column
      multiplier for the last row is $2$, leaving $(0,0,-3,3)$, and the last multiplier
      is $1$. Storing these multipliers gives

      \[

      L=\begin{pmatrix}1&0&0&0\\-2&1&0&0\\2&0&1&0\\-3&2&1&1\end{pmatrix},

      \quad

      U=\begin{pmatrix}2&-1&3&2\\0&1&2&2\\0&0&-3&2\\0&0&0&1\end{pmatrix}.

      \]

      Forward substitution in $Ly=b$ gives $y=(-2,-2,8,1)^T$. Back substitution in
      $Ux=y$ gives $x=(1,0,-2,1)^T$. Direct multiplication gives the components of
      $Ax$ as $2-6+2=-2$, $-4+8-2=2$, $4-6+6=4$, and $-6+16+1=11$.

      '
    main_comparison: Elimination multipliers reconstruct the two triangular factors.
      Forward substitution gives (−2,−2,8,1), and the solution (1,0,−2,1) satisfies
      the original system.
