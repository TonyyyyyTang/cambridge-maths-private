    independent_rework: '# IB 2001 Paper 1, 3D


      Put $S=\sum_i x_i$ and $Q=\sum_i x_i^2$. The joint Lebesgue density is

      \[

      (2\pi)^{-n/2}\mu^{-n}\exp\{-Q/(2\mu^2)+S/\mu-n/2\}.

      \]

      The Neyman–Fisher factorization criterion for this dominated family states that
      $T$ is sufficient if the joint density factors as $g_\mu(T(x))h(x)$ with nonnegative
      measurable factors and $h$ independent of the parameter. The displayed density
      factors in this way with $T=(S,Q)$ and $h=1$.


      For $Q>0$ the log-likelihood derivative is $(Q-S\mu-n\mu^2)/\mu^3$. The quadratic
      in the numerator has one positive and one negative root. The derivative changes
      from positive to negative at the positive root, hence the unique MLE is

      \[

      \widehat\mu=\frac{\sqrt{S^2+4nQ}-S}{2n}.

      \]

      On the all-zero sample the likelihood is proportional to $\mu^{-n}$ and has
      no maximum on $\mu>0$. This sample has probability zero under every model parameter.

      '
    main_comparison: Sums of observations and their squares suffice by factorization.
      Exactly one positive stationary point exists when the squared sum statistic
      is nonzero. The all-zero sample has no maximizer on the open parameter space.
