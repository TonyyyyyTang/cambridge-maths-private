    independent_rework: '# IB 2001 Paper 3, 17C


      Let $K_j=\ker\alpha^j$ with $K_0=0$. These subspaces increase up to $K_m=V$,
      and $\alpha K_j\subset K_{j-1}$. Begin with a basis of $K_1$ and successively
      extend it to a basis of each $K_j$, placing the newly added vectors last. The
      image of each basis vector is in the span of basis vectors from strictly earlier
      layers. The representing matrix therefore has zeros on and below its diagonal.
      For the first claim this basis ordering also works with arbitrary-dimensional
      layers given basis extension; the exponent bound in the next part concerns finite
      dimension.


      For $n=\dim V<\infty$, the span of the first $i$ basis vectors maps into the
      span of the first $i-1$, so $\alpha^nV=0$. If $V=0$ this remains true since
      the identity is its zero map. Take the $4\times4$ matrix with ones at $(1,2),(2,3),(3,4)$
      and zeros elsewhere. Its cube sends $e_4$ to $e_1$ and its fourth power is zero.


      In a triangularizing basis $I+A$ is upper triangular with every diagonal entry
      one, so its characteristic polynomial is $(t-1)^n$. For the product take $A=E_{12}$
      and $B=E_{21}$ in dimension two. Both square to zero, while

      \[

      (I+A)(I+B)=\begin{pmatrix}2&1\\1&1\end{pmatrix}

      \]

      has characteristic polynomial $t^2-3t+1$. Its trace already rules out two eigenvalues
      equal to one.

      '
    main_comparison: A basis adapted to the kernels of powers puts the nilpotent operator
      in strictly upper triangular form. The size-four chain attains index four. The
      product of the two shifted square-zero matrices has trace three in dimension
      two and cannot have all eigenvalues one.
