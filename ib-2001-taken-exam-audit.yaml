    independent_rework: '# IB 2001 Paper 4, 3D


      Set $Q=\sum_i x_i^2$ and suppose $Q>0$. Differentiating $\sum_i(Y_i-bx_i)^2$
      gives the unique minimum at

      \[

      \widehat\beta=\frac{\sum_i x_iY_i}{Q}.

      \]

      It is a linear combination of independent Gaussian observations, with distribution
      $N(\beta,\sigma^2/Q)$. For $n\ge2$ estimate $\sigma^2$ by $s^2=\sum_i(Y_i-\widehat\beta
      x_i)^2/(n-1)$. The Gaussian error component along $x=(x_i)$ is independent of
      its residual projection perpendicular to $x$, for which the squared length divided
      by $\sigma^2$ is $\chi^2_{n-1}$. Hence under $H_0$,

      \[

      T=\frac{\widehat\beta-\beta_0}{s/\sqrt Q}\ \sim\ t_{n-1}.

      \]

      At level $\alpha$ reject when $|T|>t_{n-1,1-\alpha/2}$. If $Q=0$ every slope
      minimizes the same criterion and the observations carry no information about
      $\beta$. If $n=1$ and $Q>0$ the slope is estimable, but there are no residual
      degrees of freedom for this unknown-variance $t$ test.

      '
    main_comparison: Projection onto the nonzero fixed-design vector identifies the
      slope. Its independent orthogonal residual has n−1 degrees of freedom, giving
      the two-sided Student test for n at least two.
