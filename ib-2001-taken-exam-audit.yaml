    independent_rework: '# IB 2001 Paper 2, 1A


      Let $(X,\rho)$ be a nonempty complete metric space and $f:X\to X$ satisfy $\rho(fu,fv)\le
      q\rho(u,v)$ for every pair, with one constant $0\le q<1$. Then $f$ has a unique
      fixed point and the iterates from every starting point converge to it.


      Take any $u_0$ and put $u_{k+1}=f(u_k)$. The successive distances are at most
      $q^k\rho(u_1,u_0)$, so for $l>k$ the triangle inequality and geometric sum give

      \[

      \rho(u_l,u_k)\le q^k\rho(u_1,u_0)/(1-q).

      \]

      This makes the iterates Cauchy. Completeness gives a limit $u$, and continuity
      of the Lipschitz map gives $f(u)=\lim u_{k+1}=u$. If $v$ is also fixed, $\rho(u,v)\le
      q\rho(u,v)$ forces $u=v$.


      The prescribed distances are symmetric, positive for distinct arguments and
      zero on the diagonal. A triangle with distinct vertices has sides $2,2,1$, satisfying
      all three inequalities. Repeated vertices give immediate inequalities. Also
      $d\le d''\le2d$, so the metrics are Lipschitz equivalent.


      Define $f(x)=z$ and $f(y)=f(z)=y$. The pair $(y,z)$ has equal images. Each pair
      involving $x$ and a different point has its $d''$-distance halved. Thus $1/2$
      is a contraction constant for $d''$. For $(x,y)$ the discrete distance is one
      both before and after applying $f$, ruling out any discrete contraction constant
      less than one.

      '
    main_comparison: The geometric tail bound proves the contraction theorem. In the
      three-point example the map collapses the short edge and halves the other two
      distances, while its discrete Lipschitz constant is one.
