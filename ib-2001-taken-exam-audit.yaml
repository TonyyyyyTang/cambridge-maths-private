auditor_report: '# Independent rework of fourteen Cambridge Part IB questions from
  2001


  I reworked all 14 questions from the supplied blind packets and compared the complete
  question bodies with the stated printed questions on 12 original PDF page images.
  The packet contents and original pages were the only mathematical inputs. The source
  comparison included prose, hypotheses, subscripts, exponents, signs, subparts, punctuation,
  matrix entries and hints. None of the sampled question bodies has an individual
  mark allocation or a figure. Each source record binds the original PDF, question
  text and independently derived answer to its SHA-256 digest.


  | Paper | Printed page and question | Questions checked | Question-body transcription
  discrepancies |

  |---|---|---:|---:|

  | 1 | p. 3, 3D and 6G; p. 7, 15G; p. 8, 16E; p. 9, 18F | 5 | 0 |

  | 2 | p. 2, 1A; p. 3, 5E; p. 4, 7E | 3 | 0 |

  | 3 | p. 2, 1A; p. 7, 17C; p. 8, 19B | 3 | 0 |

  | 4 | p. 2, 2H and 3D; p. 7, 15C | 3 | 0 |


  The observed body-transcription discrepancy count is 0/14. This blind pass did not
  receive stored solutions, so the stored-solution error rate must be established
  by the main agent''s comparison.


  ## Mathematical qualifications for comparison


  - Paper 1, 16E. The printed assumptions establish the Fourier coefficients but cannot
  imply the asserted pointwise equality. A function equal to one at a single point
  and zero elsewhere gives a uniformly convergent periodization and an identically
  zero Fourier transform. The exponential example satisfies the additional regularity,
  and the sum is $\pi\coth\pi$.

  - Paper 1, 18F. The derivative jumps at the centre. The half-well state has a finite
  quadratic-form energy although it is outside the operator domain of the Dirichlet
  Hamiltonian. Both the weak pairing and the spectral energy yield $\hbar^2\pi^2/(2ma^2)$.

  - Paper 1, 3D. The positive-parameter MLE exists except on the probability-zero
  all-zero sample. Paper 1, 15G. The particle expansion holds on fixed bounded time
  intervals.

  - Paper 4, 2H. $P_0''=0$ is not an eigenfunction. Paper 4, 3D. Identifiability requires
  a nonzero design vector, and the usual unknown-variance test needs at least two
  observations.


  ## Independent computational checks


  I verified the Paper 2 LU product and right-hand side with exact integer arithmetic.
  For Paper 1, 15G, numerical period averaging reproduced the Eulerian acceleration.
  Fourth-order Runge–Kutta integration over one period with 2,000 steps gave horizontal
  dye-particle speeds of $0.000200080039$ and $0.0000500050006$ at $\epsilon=0.02$
  and $0.01$, respectively, against leading terms $0.0002$ and $0.00005$. For Paper
  1, 16E the symmetric sum truncated at 100,000 differed from $\pi\coth\pi$ by less
  than $2/100000$. For Paper 1, 18F the spectral energy ratio with 100,000 odd terms
  was $0.9999979736$, and direct overlap quadrature reproduced the coefficients for
  indices 1 through 7 and 9 to within $10^{-8}$. For Paper 4, 2H, 16-point Gauss–Legendre
  quadrature gave absolute weighted inner products below $10^{-12}$ for all distinct
  pairs among indices 1 through 8.

  '
main_resolution: The single-point Poisson summation counterexample preserves the computed
  coefficient identity, and the exponential example gives pi coth(pi). The half-well
  energy is well-defined through its quadratic form despite the derivative jump. We
  checked the zero Legendre derivative exclusion, nonzero regression design, singular-matrix
  conjugacy and the block QR argument. The original-page comma after the half-well
  sine is present in the sampled text.
