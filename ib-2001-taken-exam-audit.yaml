    independent_rework: '# IB 2001 Paper 3, 19B


      Write $J=J_1$. Orthogonality of $J^{-1}TJT^{-1}$, after multiplying its Gram
      matrix equation on the left by $T^t$ and on the right by $T$, becomes $J^t GJ=G$
      for $G=T^tT$, since $J$ is orthogonal. For $G=\left(\begin{smallmatrix}g&h\\h&k\end{smallmatrix}\right)$
      the left side is $\left(\begin{smallmatrix}k&-h\\-h&g\end{smallmatrix}\right)$.
      Thus $h=0$ and $k=g$. If $T=\left(\begin{smallmatrix}a&b\\0&d\end{smallmatrix}\right)$
      with $a,d>0$, the columns are orthogonal with equal length. Therefore $ab=0$,
      $b=0$, and $d=a$. Hence $T=aI$ commutes with $J$.


      For any invertible real square $A$, apply Gram–Schmidt to its ordered columns
      $a_j$. Subtract the projections on the earlier orthonormal $u_i$ and divide
      the remainder by its positive length to obtain $u_j$. The remainder is nonzero
      because the columns are independent. With $B=[u_1,\ldots,u_N]$, set $C=B^t A$.
      Then $B$ is orthogonal, $A=BC$, $C_{ij}=0$ for $i>j$, and $C_{jj}$ is that positive
      length.


      For the stated $2n$-dimensional decomposition (in particular $A$ is invertible),
      $KBC=BCK$ gives $CKC^{-1}=B^{-1}KB$. The right-hand side and $K^{-1}$ are orthogonal,
      so $D=K^{-1}CKC^{-1}$ is orthogonal. With consecutive coordinate pairs as blocks,
      $C$ and $C^{-1}$ are block upper triangular, and $K$ and $K^{-1}$ are block
      diagonal. Hence $D$ is block upper triangular. Its inverse is also block upper
      triangular, while $D^{-1}=D^t$ is block lower triangular. This forces $D$ to
      be block diagonal. Each of its diagonal blocks $E_i$ is orthogonal.


      Multiplication of block upper triangular matrices multiplies their corresponding
      diagonal blocks, and inversion inverts these blocks. Thus

      \[

      E_i=J^{-1}C_iJC_i^{-1},\quad C_i=C_{ii},

      \]

      where $C_i$ is upper triangular with strictly positive diagonal entries. The
      first part gives $C_iJ=JC_i$ and therefore $E_i=I_2$ for every $i$. It follows
      that $D=I$ and $KC=CK$. Finally $KB=KAC^{-1}=AKC^{-1}=AC^{-1}K=BK$.

      '
    main_comparison: Escalation resolved. Orthogonality forces the Gram matrix of
      the two-by-two triangular block to be scalar. Using positive diagonal QR in
      block dimension two makes the orthogonal triangular commutator block diagonal.
      Each diagonal block is identity by the first argument, giving the two required
      commutations.
