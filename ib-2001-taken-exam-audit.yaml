    independent_rework: "# IB 2001 Paper 1, 15G\n\nSet $\\theta=x-t$. The gradient\
      \ of the potential gives $\\mathbf u=(-\\epsilon y\\sin\\theta,\\epsilon\\cos\\\
      theta)$ and $\\nabla\\cdot\\mathbf u=-\\epsilon y\\cos\\theta$. Each velocity\
      \ component at fixed $(x,y)$ integrates to zero over a complete period. The\
      \ material acceleration is $\\partial_t\\mathbf u+(\\mathbf u\\cdot\\nabla)\\\
      mathbf u$, which evaluates to\n\\[\n(\\epsilon y\\cos\\theta+\\epsilon^2(y^2-1)\\\
      sin\\theta\\cos\\theta,\\\n \\epsilon\\sin\\theta+\\epsilon^2y\\sin^2\\theta).\n\
      \\]\nAveraging at fixed $(x,y)$ gives $(0,\\epsilon^2y/2)$.\n\nThe marked particle\
      \ satisfies $\\dot X=-\\epsilon Y\\sin(X-t)$ and $\\dot Y=\\epsilon\\cos(X-t)$,\
      \ with $X(0)=Y(0)=0$. On any fixed bounded time interval $\\dot Y=O(\\epsilon)$\
      \ gives $Y=O(\\epsilon)$, then $\\dot X=O(\\epsilon^2)$ gives $X=O(\\epsilon^2)$.\
      \ Thus $\\dot Y=\\epsilon\\cos t+O(\\epsilon^3)$ and $Y=\\epsilon\\sin t+O(\\\
      epsilon^3)$. Substituting back,\n\\[\n\\dot X=\\epsilon^2\\sin^2t+O(\\epsilon^4),\\\
      qquad\nX=\\epsilon^2(t/2-\\sin(2t)/4)+O(\\epsilon^4).\n\\]\nThe net displacement\
      \ divided by $2\\pi$ is $(\\epsilon^2/2,0)$ through order $\\epsilon^2$. The\
      \ secular term does not justify extrapolating this expansion uniformly to arbitrarily\
      \ long times.\n"
    main_comparison: A fixed-point average of the gradient vanishes, yet the mean
      material acceleration has vertical component epsilon squared times y/2. Following
      the particle from the origin generates horizontal drift epsilon squared/2 over
      its first period.
