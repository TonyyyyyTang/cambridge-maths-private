    independent_rework: '# IB 2001 Paper 4, 2H


      Differentiate the given polynomial identity and put $R_n=P_n''$. Combining the
      two contributions to the first derivative and collecting terms gives

      \[

      (1-x^2)R_n''''-4xR_n''+[n(n+1)-2]R_n=0.

      \]

      Multiplication by $1-x^2$ yields

      \[

      -\big((1-x^2)^2R_n''\big)''=\lambda_n(1-x^2)R_n,

      \qquad \lambda_n=(n-1)(n+2).

      \]

      Thus the weight is $w=1-x^2$ and the leading coefficient is $(1-x^2)^2$. For
      $n\ge1$ the eigenfunctions are nonzero. At $n=0$ the derivative of the constant
      $P_0$ is identically zero and hence does not define an eigenfunction.


      Multiply the $n$ equation by $R_m$, subtract the $m$ equation times $R_n$, and
      integrate on $[-1,1]$. The boundary term $[(1-x^2)^2(R_nR_m''-R_mR_n'')]_{-1}^{1}$
      is zero because both functions and derivatives are polynomials. Consequently
      $(\lambda_n-\lambda_m)\int_{-1}^1(1-x^2)R_nR_m\,dx=0$. Distinct positive indices
      have distinct eigenvalues, so their weighted inner product vanishes. The same
      integral is trivially zero when an index equals zero.

      '
    main_comparison: Multiplying the differentiated Legendre equation by 1−x squared
      puts it into self-adjoint form. Its boundary Wronskian vanishes since the leading
      coefficient vanishes at both ends. The derivative of P0 is zero and is excluded
      as an eigenfunction.
