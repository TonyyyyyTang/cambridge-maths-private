      question_figure_sha256: {}
    independent_rework: '# IB 2001 Paper 2, 7E


      At any $z=x+iy\in V$, complex differentiability means that the limit

      \[

      f''(z)=\lim_{h\to0,\ h\ne0}\frac{f(z+h)-f(z)}{h}

      \]

      exists as a complex number independent of the direction of approach. Since $V$
      is open, all sufficiently short real and imaginary increments remain inside
      $V$. Write $f=u+iv$. For real $h=s$, the real and imaginary parts of the quotient
      tend respectively to $u_x$ and $v_x$, proving their existence and giving $f''=u_x+iv_x$.
      For $h=is$, dividing the changes in $u+iv$ by $is$ instead gives $f''=v_y-iu_y$,
      with both partial derivatives again existing. Thus $u_x=v_y$ and $u_y=-v_x$
      throughout $V$.

      '
    main_comparison: The real and imaginary coordinate difference quotients must have
      the same complex limit, giving the two Cauchy–Riemann equations without assuming
      continuity of the partial derivatives.
