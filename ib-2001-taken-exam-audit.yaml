    independent_rework: "# IB 2001 Paper 1, 18F\n\nThe impenetrable walls give the\
      \ Dirichlet conditions at $\\pm a$. In the interval $H=-(\\hbar^2/2m)d^2/dx^2$.\
      \ Integrating by parts gives nonnegative energy, and zero energy would force\
      \ a constant, hence zero, eigenfunction. For $E>0$ the left boundary selects\
      \ a multiple of $\\sin(k(x+a))$, with $k=\\sqrt{2mE}/\\hbar$. The right boundary\
      \ requires $2ak=n\\pi$, $n=1,2,\\ldots$. Its squared sine integrates to $a$,\
      \ giving the stated normalizations and\n\\[\nE_n=\\frac{\\hbar^2 n^2\\pi^2}{8ma^2}.\n\
      \\]\nThe translated Fourier sine system is complete on the interval. The half-well\
      \ state is normalized since $(2/a)\\int_0^a\\sin^2(\\pi x/a)\\,dx=1$.\n\nIts\
      \ derivative jumps at zero. The state belongs to the Dirichlet energy form domain\
      \ $H^1_0(-a,a)$ but not the operator domain $H^2(-a,a)\\cap H^1_0(-a,a)$. The\
      \ position-space expectation is rigorously\n\\[\n\\frac{\\hbar^2}{2m}\\int_{-a}^a|\\\
      psi'(x)|^2\\,dx\n=\\frac{\\hbar^2}{2m}\\frac{2\\pi^2}{a^3}\\int_0^a\\cos^2(\\\
      pi x/a)\\,dx\n=E_2 .\n\\]\nEquivalently the weak second derivative on the open\
      \ well equals the regular second derivative on each side plus $\\sqrt{2/a}(\\\
      pi/a)\\delta_0$. Its latter contribution paired with $\\psi$ vanishes since\
      \ $\\psi(0)=0$. This explains the printed notation $\\int\\psi H\\psi$.\n\n\
      For even indices $n=2k$, the eigenfunction on the right half is $(-1)^k a^{-1/2}\\\
      sin(k\\pi x/a)$. Sine orthogonality gives $a_2=-1/\\sqrt2$ and all other even\
      \ coefficients zero. For $n=2p+1$, put $u=\\pi x/a$. The overlap coefficient\
      \ is\n\\[\na_n=\\frac{\\sqrt2(-1)^p}{\\pi}\\int_0^\\pi \\sin u\\cos(nu/2)\\\
      ,du\n=\\frac{4\\sqrt2(-1)^p}{\\pi(4-n^2)}.\n\\]\nBy the product-to-sum identity\
      \ the integral is $\\tfrac12[(1+n/2)^{-1}+(1-n/2)^{-1}]=1/(1-n^2/4)$, since\
      \ $\\cos((1\\pm n/2)\\pi)=0$ for odd $n$.\n\nThe spectral expectation is thus\n\
      \\[\n\\sum_n|a_n|^2E_n\n=E_2\\left(\\frac12+\\frac8{\\pi^2}\\sum_{p\\ge0}\n\
      \ \\frac{(2p+1)^2}{[(2p+1)^2-4]^2}\\right).\n\\]\nThe series converges since\
      \ its summand is $O(p^{-2})$. Equality with the form energy and division by\
      \ $E_2$ give the requested identity.\n"
    main_comparison: Escalation resolved. The kink is compatible with the energy form
      but excludes the Hamiltonian operator domain. Integrating the squared first
      derivative gives E2. Direct overlaps give only a2 among even coefficients and
      the same alternating odd coefficients in both solutions. The weighted sum converges
      and gives the printed identity.
