    independent_rework: '# IB 2001 Paper 3, 1A


      A norm $N$ on a real vector space is real-valued and nonnegative, with $N(x)=0$
      exactly for $x=0$. It satisfies $N(tx)=|t|N(x)$ for real $t$ and $N(x+y)\le
      N(x)+N(y)$.


      Let $P,Q$ be norms. If $cP\le Q\le CP$ for constants $0<c\le C$, the metric
      inequalities follow by substituting differences $x-y$. Each metric ball around
      $x$ then contains a ball for the other metric about $x$, so the induced topologies
      coincide. Conversely, if the metric topologies coincide, the $Q$-unit ball is
      a neighborhood of zero for $P$, hence contains the $P$-ball of some radius $r>0$.
      For every $v\ne0$ the vector $rv/(2P(v))$ lies in this latter ball, so $Q(v)<2P(v)/r$.
      Interchanging $P,Q$ gives a converse bound and zero satisfies both inequalities.
      No dimension assumption enters.


      For a real inner product, symmetry and bilinearity give $\|x\pm y\|^2=\|x\|^2\pm2\langle
      x,y\rangle+\|y\|^2$. Adding proves the parallelogram identity. For the maximum
      norm, take $x=(1,0)$ and $y=(0,1)$. Both $x+y$ and $x-y$ have norm one, as do
      $x$ and $y$, so the identity would read $2=4$. This excludes an inducing inner
      product.

      '
    main_comparison: Scaling the open unit ball inclusion yields two-sided bounds
      for arbitrary-dimensional norms. The maximum norm on the two coordinate vectors
      gives 2 and 4 on the opposite sides of the parallelogram law.
