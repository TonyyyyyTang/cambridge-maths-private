    independent_rework: '# IB/2012/P1/q17A


      Take the velocity convention u=grad(phi). A circle of radius r about an isolated
      source carries flux 2 pi r u_r=m per unit length perpendicular to the plane.
      By radial symmetry u_theta=0, so phi=(m/2pi)log(r/r0), with arbitrary reference
      radius r0. Linearity gives phi=(m/2pi)log(r_+ r_-/r0^2), where r_±^2=x^2+(y∓a)^2.
      The domain excludes the singularities and a>0 is understood. The normal velocity
      vanishes at y=0 because the y derivatives cancel by reflection, while the only
      interior singularity in the upper half-plane is the prescribed source. This
      restriction satisfies the stationary impermeable wall condition, with tangential
      slip.

      On the wall u_x=mx/[pi(x^2+a^2)]. The steady irrotational Bernoulli constant
      is the far-field pressure p_inf (velocity decays), giving p=p_inf-rho m^2 x^2/[2
      pi^2 (x^2+a^2)^2]. The outward normal from the upper fluid is -e_y. Its gauge-pressure
      force on the wall per unit out-of-plane length is (rho m^2/2pi^2)e_y times the
      integral of x^2/(x^2+a^2)^2 over the real line. Substitution x=a tan(theta)
      gives (1/a) times the integral of sin^2(theta) from -pi/2 to pi/2, namely pi/(2a).
      The resultant relative to ambient is therefore +rho m^2 e_y/(4 pi a), towards
      the source. Integrating absolute pressure over an infinite wall also includes
      the uniform background load.

      '
    main_comparison: The reflected source imposes zero normal flow. Bernoulli pressure
      and a convergent wall integral give the force relative to ambient pressure,
      rho times flux-strength squared divided by 4 pi a in the stated normal direction.
