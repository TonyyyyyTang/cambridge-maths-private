    independent_rework: '# IB/2012/P1/q7H


      For nested parameter spaces Theta_0 inside Theta the generalized likelihood
      ratio is sup_{Theta_0} L / sup_{Theta} L. Reject H0 for small values, choosing
      the cutoff to control the supremum null rejection probability at the desired
      size. This tests restrictions on unknown parameters, including composite hypotheses
      and nuisance parameters.

      Use the intended independent two-sample model. Let S,T be the respective sums
      (positive almost surely) and lambda,mu>0. The likelihood up to sample-only factors
      is lambda^(2n) mu^(2n) exp(-lambda S-mu T). The two unconstrained maxima are
      2n/S,2n/T; the common-rate maximum is 4n/(S+T). Each follows by setting the
      corresponding log derivative to zero, with negative second derivative. Cancellation
      gives Lambda=[4ST/(S+T)^2]^(2n)=[4R/(1+R)^2]^(2n). The factor is unchanged under
      R -> 1/R, increasing up to 1 and decreasing beyond. Reject for large max(R,1/R).

      Under the null 2lambda S and 2lambda T are independent chi-squares with 4n degrees
      of freedom, so R has the F_(4n,4n) law. By interchange of independent identically
      distributed sums, R and 1/R have the same law. For n=5, c=F_(20,20)^(0.975),
      and one rejects if R>c or R<1/c, otherwise retains H0. Strict inequalities at
      the critical values give exact size .05 by continuity. Cross-sample independence
      is understood in this derivation but is not stated expressly by the two separate
      within-sample iid clauses. If cross-dependence is unrestricted the joint likelihood
      and calibration are undetermined (e.g. Y_i=X_i under H0 gives R=1).

      '
    main_comparison: The reciprocal likelihood ratio yields a two-sided F test with
      equal tail sizes under the common-rate null. The n=5 case uses the upper 0.975
      quantile of F(20,20).
