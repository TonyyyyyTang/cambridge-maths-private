    independent_rework: '# IB/2012/P4/q14A


      Use hat(f)(k)=int exp(-ikx) f(x) dx and inverse with factor 1/(2pi). For integrable
      functions, hat(f*g)=hat(f)hat(g), where (f*g)(x)=int f(x-t)g(t)dt; Fubini and
      translation give this identity. Let g=1 on [-1,1] and 0 outside. Transforming
      Laplace''s equation in x gives u_yy=k^2 u. In the usual bounded Poisson solution
      class retain the decaying branch for k nonzero to obtain u(k,y)=hat(g)(k)exp(-|k|y),
      where hat(g)=2 sin(k)/k with continuous value 2 at zero. A single zero frequency
      does not affect the inverse integral and the mean is conserved for this solution.

      The inverse transform of exp(-|k|y) for y>0 is (1/pi)Re int_0^infty exp[-(y-ix)k]dk=y/[pi(y^2+x^2)].
      Convolving with g gives (y/pi)int_-1^1 dt/[y^2+(x-t)^2]. Integrating via s=(t-x)/y
      yields [arctan((1-x)/y)+arctan((1+x)/y)]/pi. This is harmonic and tends to zero
      as y tends to infinity (bounded by 2/(pi y)); its boundary limits are 1 inside
      and 0 outside except precisely at ±1, where its vertical trace is 1/2. The values
      1 at the two boundary points can be assigned separately; their values have no
      effect on the Poisson integral.

      Taken literally, pointwise decay for each fixed x does not ensure uniqueness
      on the unbounded half-plane. For example Im exp((x+iy)^2)=exp(x^2-y^2) sin(2xy)
      is harmonic, zero on y=0, and decays as y increases for each fixed x, but grows
      rapidly in x. The claimed formula is the bounded Fourier/Poisson solution. One
      cannot in general infer frequency-by-frequency transformed decay from merely
      pointwise physical-space decay.

      '
    main_comparison: The inverse transform of exp(−|k|y) gives the Poisson kernel
      and the same sum of arctangents. At the two jumps the vertical limit is one
      half. A zero-trace harmonic function with fixed-x decay shows why a uniqueness
      claim needs a growth class.
