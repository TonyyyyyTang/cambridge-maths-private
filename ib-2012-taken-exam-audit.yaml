  The printed statistical model in P1/7H relies on the usual independence of the two
  samples for the claimed exact ratio test. In P4/14A the bounded Fourier solution
  takes midpoint vertical limits at the endpoints. Unrestricted growth in x also prevents
  uniqueness from the printed pointwise decay condition alone. The two qualifications
  concern interpretation of the original statements, not changes to their transcription.
  P1/17A distinguishes the finite gauge-pressure resultant from the infinite background
