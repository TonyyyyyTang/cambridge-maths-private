    independent_rework: '# IB/2012/P2/q17C


      Write P chi(x)=chi(-x). The second derivative commutes with reflection and so
      does multiplication by an even potential, on the reflection-invariant physical
      domain. Hence P chi lies in the same eigenspace and equals c chi by nondegeneracy.
      Applying P again gives c^2=1, proving even or odd parity.

      For even states, restrict to x>=0 with derivative zero at 0. The central ODE
      chi''''=kappa^2 chi gives A cosh(kappa x), and the well ODE chi''''=-k^2 chi
      with the hard wall at l2 gives C sin(k(l2-x)). Extend evenly by replacing x
      with |x| and use zero for |x|>=l2. At l1 both chi and chi'' are continuous since
      the jump in V is finite. Set d=l2-l1; the conditions are A cosh(kappa l1)=C
      sin(kd) and A kappa sinh(kappa l1)=-C k cos(kd). The amplitudes are nonzero
      in a nonzero state, and with k,kappa,l1>0 these equations force both sine and
      cosine nonzero. Dividing gives -tan(kd)=(k/kappa)coth(kappa l1). For each allowed
      root take C=A cosh(kappa l1)/sin(kd); A sets the overall normalization/phase.
      The endpoints E=0,U are excluded.

      '
    main_comparison: Both match the wavefunction and its derivative across the interface
      after excluding the hard-wall endpoints. The logarithmic-derivative equation
      relates the trigonometric and hyperbolic factors for 0<E<U.
