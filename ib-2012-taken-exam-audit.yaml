      rows i of m_(i,s(i)). For a contributing permutation of the block matrix, each
      of the final m rows must select a final-block column; their injectivity uses
      all m of those columns. The first n rows must therefore select precisely the
      first n columns. Such a permutation is a pair of independent permutations s,t
      within the consecutive blocks, without cross inversions, so its sign is sgn(s)sgn(t).
      The product in each term separates into an A term and a C term. Summing the
      products proves the claimed factorization even for singular A or C, independently
      of B.

      '
