    independent_rework: '# IB/2012/P2/q16C


      For a source point xi>0 the homogeneous solution vanishing at zero is sinh x,
      and that decaying at infinity is exp(-x). Continuity across xi suggests G=sinh(min(x,xi))
      exp(-max(x,xi)). Its right derivative minus its left derivative at xi equals
      -exp(-xi)(sinh xi+cosh xi)=-1. Thus -G''''+G is precisely a unit delta and the
      end conditions hold. Equivalently G=(exp(-abs(x-xi))-exp(-x-xi))/2. A decaying
      homogeneous solution with zero left boundary is identically zero, so the inverse
      is unique on this domain.

      Integrate G over 0<=xi<=mu. For x<=mu the parts give exp(-x)(cosh x-1)+sinh
      x(exp(-x)-exp(-mu))=1-exp(-x)-exp(-mu)sinh x. For x>=mu the result is (cosh
      mu-1)exp(-x). Both expressions at mu equal exp(-mu)(cosh mu-1)=(1+exp(-2mu)-2exp(-mu))/2.
      The left derivative there is exp(-mu)(1-cosh mu), the right derivative equals
      it. At x=0 the inner expression vanishes; the outer one decays. The forcing
      has a jump, so use the piecewise ODE away from mu with continuous y,y'' across
      it.

      '
    main_comparison: Both half-line Green functions impose the wall value, decay at
      infinity and the unit derivative jump. The response to the step forcing matches
      in value and slope at mu, with a jump in its second derivative.
