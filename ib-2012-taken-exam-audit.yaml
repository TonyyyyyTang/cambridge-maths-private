      (a) implies (b). Given x and epsilon>0, select one N with norm(f-f_N)_inf<epsilon/3.
      Use continuity of f_N at x to bound |f_N(x)-f_N(t)|<epsilon/3 on a relative
      neighbourhood; the triangle inequality gives continuity of f. (a) implies (c)
      since the continuous limit is Riemann integrable and |integral(f_n-f)| <= norm(f_n-f)_inf
      on the unit interval.

      For n>=1 let h_n(x)=2n max(1-|2nx-1|,0), a continuous triangle supported on
      [0,1/n], of height 2n at 1/(2n). It vanishes at x=0 and eventually at any fixed
      positive x, so tends pointwise to 0, a continuous function. Its supremum is
      2n, and its area is one. Thus (b) does not imply (a) or (c).

      For g_n(x)=x^n the pointwise limit is 0 for x<1 and 1 at x=1. That limit has
      integral 0, as does the limit of 1/(n+1), so (c) holds. The limit is discontinuous,
      proving (c) does not imply (b); by the already proved (a) implies (b) it also
      cannot converge uniformly. This proves (c) does not imply (a).

      '
    main_comparison: Uniform convergence gives continuity and convergence of integrals.
      Shrinking triangular spikes separate continuity from integral convergence; x
      to the nth power gives a discontinuous integrable limit.
