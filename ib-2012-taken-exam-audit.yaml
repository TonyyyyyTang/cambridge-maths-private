      For lambda=n(n+1), start with c_0=1 for even n or c_1=1 for odd n, and zero
      opposite parity. Every factor used to reach degree n is nonzero, but the recurrence
      at n terminates the series. For n=0,1,2 this yields constant, x, and a multiple
      of 1-3x^2. Normalize at 1 to get P_0=1, P_1=x, P_2=(3x^2-1)/2.

      For the spherical shell 0<a<b, the inner datum equals P_0 and the outer equals
      P_0+2P_2. Choose the constant monopole 1. For the second mode the radial factor
      is A r^2+B r^(-3). The inner zero requires B=-Aa^5, and the outer value 2 gives
      A=2b^3/(b^5-a^5). Consequently psi=1+[2b^3(r^2-a^5/r^3)/(b^5-a^5)] P_2(cos theta).
      These modes solve Laplace''s equation and meet both data. Uniqueness follows
      by the maximum and minimum principles on the bounded shell for the difference
      of two regular solutions with zero boundary values.

      '
