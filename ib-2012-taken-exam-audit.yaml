    independent_rework: '# IB/2012/P4/q3E


      Represent f(x,y)=sum a_ij x_i y_j where a_ij=f(e_i,e_j). Thus by Cauchy-Schwarz
      |f(h,k)|<=C ||h|| ||k|| with C=(sum a_ij^2)^(1/2). Bilinearity gives f(x+h,y+k)-f(x,y)=f(h,y)+f(x,k)+f(h,k).
      The first two terms define a bounded linear function of (h,k). The last term
      is bounded by (C/2)(||h||^2+||k||^2), hence is little-o of the Euclidean product
      norm. Therefore the Fréchet derivative at any (x,y) is the map (h,k) -> f(h,y)+f(x,k).

      '
    main_comparison: The finite matrix of bilinear coefficients bounds the cross term
      by a multiple of the squared increment norm and identifies the linear derivative
      in both directions.
