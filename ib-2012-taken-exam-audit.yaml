    independent_rework: '# IB/2012/P4/q7B


      Choose an oriented spanning surface S and give its boundary C the right-hand
      orientation. Magnetic flux is Phi=int_S B dot n dS (surface-independent for
      div B=0). The emf is the work done per unit positive charge around C; at rest
      this is the circulation of E. Ohmic resistance R is the proportionality between
      emf and steady/quasistatic current in a purely resistive loop, emf=RI (or dissipated
      power I^2 R). Stokes and Maxwell-Faraday give emf=int_S curl E dot n dS=-int_S
      partial_t B dot n dS=-dPhi/dt for a fixed loop.

      With +z normal, Phi=pi a^2 B tanh t, so I=-(pi a^2 B/R)sech^2 t with anticlockwise
      positive as viewed from +z. For B>0 the flux increases and the current is clockwise.
      The given model neglects self-inductance.

      For a material loop with local velocity v, Lorentz force on its charges supplies
      v cross B as a tangential force per unit charge in addition to E (drift along
      the wire has no tangential magnetic contribution). Moving the loop may alter
      the flux, even when the field is stationary. The flux rule is emf=oint_(C(t))(E+v
      cross B) dot dl = -d/dt int_(S(t)) B dot n dS. A motion preserving flux in a
      steady field has zero resulting emf.

      '
    main_comparison: Faraday induction gives the signed hyperbolic-secant-squared
      current in the purely resistive loop. The moving-loop argument includes the
      magnetic Lorentz force and uses a consistent orientation.
