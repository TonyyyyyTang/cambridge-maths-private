    independent_rework: '# IB/2012/P4/q10F


      Let q(v)=B(v,v) and H={w:B(v,w)=0}. For q(v) nonzero decompose x as t v+(x-t
      v), t=B(v,x)/q(v). The second term is in H and tv is in H only for t=0, proving
      the direct sum, without symmetry.

      Now use symmetry. If dim V>0 and q vanished everywhere, polarization 2B(x,y)=q(x+y)-q(x)-q(y)
      would imply B=0, contradicting nondegeneracy. Pick v with q(v) nonzero. The
      restriction to H in the splitting is nondegenerate: any h in its radical already
      annihilates v by symmetry and hence all of V, so h=0. Induction from dimension
      zero gives an orthogonal basis of H, which extends by v. Each diagonal entry
      in this basis is nonzero.

      For a real quadratic form diagonalized with p positive and q negative squares
      (discard zero coefficients), its signature is p-q. Count signs of B(v_i,v_i)
      in the constructed basis. Rescale diagonal vectors to squared lengths +1 and
      -1. The counts are intrinsic: a positive definite subspace intersects the negative
      and zero coordinate subspace trivially and thus has dimension at most p, attained
      by the positive block; similarly for negative dimension. Here p+q=n.

      An isotropic subspace projects injectively to both the positive and negative
      coordinate blocks, since a vector belonging wholly to one block has nonzero
      square unless zero. Thus its dimension is at most min(p,q). Pair orthonormal
      positive vectors e_i with negative ones f_i for i=1,...,min(p,q); B(e_i+f_i,e_j+f_j)=delta_ij-delta_ij=0.
      They are independent by projection. This attains min(p,q)=(n-|p-q|)/2, including
      definite and zero-dimensional cases. This last part uses the standing symmetry
      assumption.

      '
    main_comparison: The first direct sum follows from a single bilinear projection.
      Orthogonal splitting and the isotropic bound use symmetry. The paired positive/negative
      vectors attain the minimum of the two inertia counts.
