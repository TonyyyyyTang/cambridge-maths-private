    independent_rework: '# IB/2012/P4/q9H


      Write T_i^+=inf{n>=1:X_n=i}. A state is transient when f_i=P_i(T_i^+<infty)<1;
      it is aperiodic when the gcd of {n>=1:p_ii^(n)>0} equals one. Counting visits
      to i from time zero under P_i gives E N_i=sum_(n>=0) p_ii^(n) by monotone convergence.
      By the strong Markov property at successive return times, P(N_i>=k+1)=f_i^k.
      Thus transience is equivalent to finiteness of that sum (value 1/(1-f_i) in
      the transient case).

      For j distinct from i choose lengths r,s of positive probability paths i->j
      and j->i. Let c=p_ij^(r)p_ji^(s)>0. Concatenation gives p_ii^(r+n+s)>=c p_jj^(n).
      Summing over n proves transience of j whenever i is transient. The positive
      lengths r+s and r+n+s are return lengths for i whenever n is one for j. Thus
      d_i, the period at i, divides their difference n and hence divides d_j. Interchanging
      i,j gives equality, proving aperiodicity is shared. Under the last hypothesis
      both lengths are multiples of three, so every such n is also a multiple of three;
      there is no need to assume the period is exactly three. The zero-step identity
      is consistent since 0 is divisible by 3.

      '
    main_comparison: Positive-probability paths in each direction transfer transience
      and the positive return-time gcd. The same concatenation transfers the three-step
      divisibility property.
