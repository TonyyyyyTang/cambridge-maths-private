      # IB 2024 P3 18H, original page 12

      (a) Under the null Z=√n X̄ is standard normal. The equal-tailed level-α test rejects at |Z|≥Φ⁻¹(1−α/2), with rejection probability exactly α by continuity. At observed x the least rejection level is p(x)=2[1−Φ(√n |x|)].

      (b) Given μ, X̄=μ+ε with ε∼N(0,1/n) independent of the prior draw. Thus its conditional density is √(n/(2π))exp[−n(x−μ)²/2]. Write φ_v(x)=(2πv)^{-1/2}exp[−x²/(2v)]. Under the spike its density is φ_{1/n}; under the slab it is φ_{τ²+1/n}, since independent normal variances add. The marginal is m(x)=[φ_{1/n}(x)+φ_{τ²+1/n}(x)]/2.

      (c) For the intended nondegenerate slab τ²>0, its mass at zero is zero, so Bayes' rule gives q(x)=φ_{1/n}(x)/(2m(x)). With K=1+nτ² and z=√n |x|, this is [1+K^{-1/2}exp((1−1/K)z²/2)]⁻¹. If the slab were degenerate at zero then μ=0 almost surely.

      (d) Here K=101. At x=0, p(0)=1 and q(0)=√101/(1+√101)<1, so continuity gives p>q in a neighbourhood. For z→∞ the given tail estimate yields p∼2e^{-z²/2}/(√(2π)z), and q∼√101 exp[−(100/101)z²/2]. Hence q/p∼(√(202π)/2)z exp(z²/202)→∞. The posterior probability is larger for sufficiently large |x|.
