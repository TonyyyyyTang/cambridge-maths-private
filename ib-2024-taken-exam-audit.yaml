      # IB 2024 P3 14B, original page 9

      Set y=T(t)X(x). Separation gives X''=−k²X and T''+T'+k²T=0. The fixed endpoints exclude nonpositive k² (integrating −X''X gives ∫|X'|²); the nontrivial modes are X=sin(kx), k=nπ, n≥1. Define ωₙ=√(k²−1/4). The characteristic time roots are −1/2±iωₙ, so the solution is ∑aₙUₙ(t)sin(nπx) with

      Uₙ(t)=exp(−t/2)[cos(ωₙt)+sin(ωₙt)/(2ωₙ)].

      This choice gives Uₙ(0)=1 and Uₙ'(0)=0 as required. For the tent f, orthogonality gives aₙ=2∫₀¹ f(x)sin(kx) dx. Integration by parts gives (2/k)∫ f'(x)cos(kx)dx; f' is +1 on the left and −1 on the right. Thus aₙ=4sin(nπ/2)/(nπ)², including vanishing even coefficients.

      Using Uₙ'=−e^{−t/2}(k²/ωₙ)sin(ωₙt), Parseval on the orthogonal sine and cosine bases gives

      E(t)=(e^{−t}/4)∑ₙ aₙ²[(k⁴/ωₙ²)sin²(ωₙt)+k²(cos(ωₙt)+sin(ωₙt)/(2ωₙ))²].

      Here ∑k²aₙ²<∞ is the finite initial energy condition (for real displacements). For each partial sum the derivative of its energy is ½∑aₙ²Uₙ'(Uₙ''+k²Uₙ)=−½∑aₙ²(Uₙ')²≤0. Passing the inequality between any two times to the limit proves that the full energy decreases. Each nonzero modal sine has isolated zeros in its velocity, so its energy strictly falls over every interval of positive length, although the instantaneous derivative can vanish, notably at t=0.
