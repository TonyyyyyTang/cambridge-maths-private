    blind_rework_utf8: |
      # IB 2024 P2 8G, original page 5

      (a) The characteristic polynomial is p(t)=det(tI−A), a monic polynomial of degree n. A complex polynomial of positive degree has a zero. One short proof uses |p(z)|→∞ at infinity, so continuity on a large closed disk gives a global minimum at z₀. If p(z₀)≠0, write p(z₀+h)/p(z₀)=1+c hᵏ+O(|h|^{k+1}) with c≠0, k≥1. Choose the argument of h so c hᵏ is negative real. For small |h|>0 the modulus is then strictly less than 1, a contradiction.

      A root gives a nonzero eigenvector by singularity of λI−A. Its line is invariant. The induced operator on the quotient by that line has dimension n−1, so by induction it has a basis with upper-triangular matrix. Lifting that basis after the eigenvector produces a basis of the original space with upper-triangular matrix, since each lifted basis vector maps to a combination of itself and earlier basis elements, modulo the invariant first line. The dimension-one case starts the induction.

      Write λ₁,…,λₙ for the diagonal entries in this triangular basis, and Fⱼ for the first j basis vectors' span. Then (A−λⱼI)Fⱼ⊆F_{j−1}. Applying these factors for j=n down to j=1 kills Fₙ=V, proving that the monic degree-n polynomial ∏ⱼ(t−λⱼ) annihilates A. Among all monic annihilating polynomials choose one of smallest degree, the minimal polynomial. Distinct smallest-degree monic annihilators would have a nonzero difference of smaller degree still annihilating A, which could be rescaled to monic. This proves existence, uniqueness and degree at most n.

      (b) The eigen-equation is f(x+r)=c f(x), c=1+λ. If c=0, all translates vanish and hence f=0. For each real c≠0, prescribe any function g on [0,|r|). The representation x=u+kr with u in this interval and k integral is unique, and f(u+kr)=cᵏg(u) defines all solutions. Taking g to be point indicators at infinitely many distinct representatives gives infinitely many linearly independent eigenfunctions. Thus every real value except −1 is an eigenvalue. Direct expansion gives DᵣDₛf(x)=f(x+r+s)−f(x+r)−f(x+s)+f(x), symmetric in r,s.

      Suppose P is degree n with leading coefficient a≠0 and P=∑ fⱼ with each fⱼ of period rⱼ≠0. The commuting product of all n differences kills every fⱼ hence kills their sum. But the binomial theorem shows Dᵣ reduces the positive degree k of any polynomial by one with new leading coefficient k r times the old one. Thus the product on P equals the nonzero constant n! a ∏rⱼ. For n=0 the sum of zero functions is zero and cannot equal a nonzero constant.
