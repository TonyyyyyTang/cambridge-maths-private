    blind_rework_utf8: |
      # IB 2024 P1 14A, original page 8

      (i) The Coulomb interaction is −κ/r, κ=e²/(4πε₀), in either atom. The heavy stationary source approximation gives precisely the same electron Hamiltonian and angular wavefunctions as hydrogen. For finite masses the separation coordinate has reduced mass μ=mₑm_μ/(mₑ+m_μ), since separating the two kinetic energies gives the centre-of-mass term and relative term p²/(2μ). Thus the Coulomb length and energies have the reduced-mass correction relative to hydrogen, which uses the proton's mass in its own reduced mass. The given approximation uses μ≈mₑ.

      (ii) Substituting an angular eigenstate into the relative Schrödinger equation gives

      −ℏ² [R''+2R'/r−l(l+1)R/r²]/(2μ)−κR/r=ER.

      For R=C rˡ exp(−kr), the bracket divided by R equals k²−2k(l+1)/r. Therefore k=μκ/[ℏ²(l+1)], a=ℏ²/(μκ) and E=−ℏ²k²/(2μ)=−κ/[2a(l+1)²]. The positive k ensures decay and rˡ is regular at the origin.

      (iii) The energy fixes (l+1)²=9, hence l=2 for this specified radial family. The angular probability integrates to 1 and the radial measure includes r². The density is proportional to r⁶exp(−2r/(3a)). With b=2/(3a), the mean separation is (7!/b⁸)/(6!/b⁷)=21a/2. This is independent of the magnetic quantum number, including superpositions within this l-subspace.

      (iv) The magnitude of orbital angular momentum has the sharp value √(l(l+1))ℏ=√6ℏ. The probability of ℏ is zero. A measurement of the component L₃ is a different observable. The hint on the source page begins its list of l at 1, even though the physical spectrum includes 0. This does not affect l=2.
