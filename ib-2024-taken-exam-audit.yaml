      # IB 2024 P1 13B, original page 7

      The two pieces match at ξ. A continuous piecewise smooth G has a delta coefficient [G'] at that point in G'', and no delta in its lower derivatives. The boundary derivatives vanish by the stated conditions. Thus c(ξ)W(ξ)=1 with W=y₁y₂'−y₁'y₂. Substituting the homogeneous equation gives W'=−αW, so W(ξ)=W(x₀)exp(−∫_{x₀}^ξ α). It cannot vanish for an independent pair since equal proportional initial data would give dependent solutions by uniqueness. Hence c=1/W. For α=0, W is constant and the remaining product y₁(min{x,ξ})y₂(max{x,ξ}) is symmetric.

      For β=−1 select y₁=cosh x, y₂=cosh(1−x), obtaining W=−sinh 1. The kernel is −cosh(min{x,ξ})cosh(1−max{x,ξ})/sinh 1. Applying it to the forcing yields

      y(x)=−[cosh(1−x)∫₀ˣ ξ cosh ξ dξ + cosh x ∫ₓ¹ ξ cosh(1−ξ) dξ]/sinh 1.

      Integration by parts gives x sinh x−cosh x+1 for the first integral and x sinh(1−x)+cosh(1−x)−1 for the second. Consequently

      y(x)=−x+[cosh x−cosh(1−x)]/sinh 1.

      Differentiation gives zero at both ends for y' and yields y''−y=x. The homogeneous Neumann kernel is trivial, since its general solution A cosh x+B sinh x gives B=A=0 successively.
