    blind_rework_utf8: |
      # IB 2024 P2 4C, original page 3

      Opposite charge densities can cancel while their signed charge fluxes add. For example, a stationary ionic background neutralises moving electrons and contributes no current itself. In full space a solenoidal field has a vector potential B=curl A (locally always, globally on a contractible domain), making div B=0 automatic. This follows also by the usual closed-form potential construction. The replacement A→A+grad χ preserves B since curl grad χ=0.

      The time-independent continuity equation is div J=0, which follows since Jₓ,Jᵧ depend only on z and J_z=0. An explicit curl gives (−∂zJᵧ,∂zJₓ,0)=λJ. Thus for λ≠0 one may choose

      B=μ₀J/λ,    A=μ₀J/λ².

      These satisfy curl A=B, curl B=μ₀J and div B=0. The magnetic field is specified up to a curl-free, divergence-free added field in the absence of boundary data. The potential of the chosen B has gradient freedom.

      The question only says λ is constant. For λ=0 the current equals J₀ eᵧ. One valid choice is B=μ₀J₀ z eₓ and A=−μ₀J₀ z²eᵧ/2. Their curls give the desired fields directly, with vanishing div B.
