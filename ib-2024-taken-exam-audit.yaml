      # IB 2024 P4 16D, original page 11

      Write ζ=vₓ−uᵧ and D=uₓ+vᵧ. The vertical curl of momentum gives ζ_t+fD=0 while continuity gives η_t=−h₀D. Thus ∂t(ζ−fη/h₀)=0, precisely the vertical component of the asserted vector identity; the other two components vanish. Initial rest at height perturbation η₀ implies ζ=f(η−η₀)/h₀ everywhere. Divergence of momentum gives D_t−fζ=−g∇²η. Eliminating D and ζ produces η_tt−gh₀∇²η+f²η=f²η₀.

      Use translation invariance in y, unbounded x, and decay at infinity. For f≠0 let L=√(gh₀)/|f|. The steady solution solves η−L²η''=η₀. It is even by symmetry and uniqueness (a homogeneous difference decaying at both infinities must vanish). The forcing step is bounded, hence η and η' are continuous even at ±a; jumps would introduce singular sources. The interior form ε+C cosh(x/L) and exterior form B exp[−(|x|−a)/L] match in value and derivative at a. This gives C=−ε exp(−a/L), B=ε exp(−a/L)sinh(a/L). Thus

      |x|≤a: η∞=ε[1−exp(−a/L)cosh(x/L)].

      |x|≥a: η∞=ε sinh(a/L) exp(−|x|/L).

      Steady momentum gives u=0 and v=(g/f)η∞'. Thus for fε>0 the jets run in the +y direction left of the centre and −y to the right, strongest at ±a. They vanish at the centre and decay away at large |x|. Reverse the arrows for fε<0. The interior derivative is −(ε/L)e^{-a/L}sinh(x/L); the exterior derivative is −sgn(x)(ε/L)sinh(a/L)e^{−|x|/L}.

      Plan view, with arrow counts indicating the relative speed:

          y ↑              ↑↑↑             ↓↓↓
                           ↑↑↑             ↓↓↓
                    ↑       ↑       ·       ↓       ↓
          x →   −∞         −a       0       a          +∞

      An equivalent sketch plots v(x) odd, peaking at −a and reaching its negative minimum at +a (for fε>0). With f=0 the top-hat splits into two outward pulses of speed √(gh₀), by the d'Alembert formula and zero initial η_t. The local steady state behind them is η∞=0 and u=v=0 on the unbounded line, as follows by integrating the travelling-wave momentum equation.
