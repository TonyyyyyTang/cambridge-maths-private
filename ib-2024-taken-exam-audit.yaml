    blind_rework_utf8: |
      # IB 2024 P1 10F, original page 6

      (a) Completeness means that each Cauchy sequence converges to a point of the space. A sequence is Cauchy if for every positive ε there is N such that all terms of indices at least N are within ε of one another. A Cauchy sequence in Y is Cauchy for the same metric in X, hence converges in X. Closedness puts its limit in Y, and the subspace metric gives the same convergence.

      (b) Take A={0,2}, B={0} in the real line and r=1. The point of B is in its ball about 0 in A, but 2 is outside the only ball about a point of B.

      The allowed radii have the property that every larger radius is allowed. Consequently every radius strictly larger than their infimum is allowed, irrespective of whether the infimum itself is allowed. Nonnegativity and symmetry follow from the definition, and radius zero works for A=B. If the distance is zero, then for each a in A and each positive integer k there is a point of B within 1/k of a. Thus a belongs to B by closedness. Exchanging the sets gives equality. In the absence of closedness, (0,1) and [0,1] are distinct with distance zero, since each endpoint is approximable within any positive radius.

      For A,B,C and ε>0 put r=d_H(A,B)+ε and s=d_H(B,C)+ε. For any a in A choose b in B with d(a,b)≤r, then c in C with d(b,c)≤s. This gives A⊆E_{r+s}(C). The reverse inclusion into the corresponding expansion follows by choosing from C, B, A in turn. Thus d_H(A,C)≤r+s and letting ε decrease to zero proves the triangle inequality.

      For singletons the admissible radii are precisely those at least d(x,y), proving isometry. Suppose {x_n} converges in the Hausdorff metric to A. For a,b in A, both are within r_n=d_H({x_n},A)+1/n of x_n. Hence d(a,b)≤2r_n→0. Since A is nonempty, it is a singleton. This proves sequential closedness, equivalent to closedness in a metric space (a point in the closure can be approximated to within 1/n). The image is therefore complete when H(X) is complete by (a), and the isometry onto the image carries Cauchy sequences and their limits both ways.
