      # IB 2024 P2 18H, original page 11

      The red count always exceeds the green count by two. Until absorption the green count k jumps to k+1 with probability (k+2)/(2k+2) and to k−1 with probability k/(2k+2). The function s(k)=1/(k+1) is harmonic on k≥1, since the weighted values at k+1,k−1 sum to 2/(2k+2).

      Stop at the first hit of 0 or N, N>m. Exit from the finite set of interior states is almost sure, since from anywhere a string of at most N downward moves reaches 0 with probability bounded below by a positive number depending only on N. The probability of no exit after consecutive blocks of N steps therefore tends to zero. The bounded stopped harmonic process has constant expectation, by iteration and dominated convergence. With π_N the chance to hit 0 first,

      s(m)=π_N s(0)+(1−π_N)s(N),

      so π_N=[1/(m+1)−1/(N+1)]/[1−1/(N+1)]. The events of hitting 0 before N increase with N and exhaust finite-time absorption, since a path reaching 0 in finite time has finite maximum before that time. Letting N→∞ gives termination probability 1/(m+1), including immediate termination when m=0.
