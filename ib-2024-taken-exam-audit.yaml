      # IB 2024 P3 9G, original page 5

      Use the inner product convention linear in the first variable. In any orthonormal basis e₁,…,eₙ define β(y)=∑ⱼ overline(θ(eⱼ,y))eⱼ. For x=∑xⱼeⱼ this gives ⟨x,β(y)⟩=∑xⱼθ(eⱼ,y)=θ(x,y). The conjugated coefficients are linear in y. Any two representatives differ by a vector orthogonal to every x, hence to itself, proving uniqueness. Apply this construction to θ(x,y)=⟨αx,y⟩ to obtain the unique linear adjoint.

      (a) The condition αU⊆U is equivalent to ⟨αu,w⟩=0 for every u in U and w in U⊥, since (U⊥)⊥=U in finite dimension. Replacing the inner product by ⟨u,α*w⟩ gives exactly α*(U⊥)⊆U⊥.

      (b) Write b(x,y)=⟨αx,y⟩. Expanding b(x+y,x+y)=0 gives b(x,y)+b(y,x)=0. Expanding b(x+iy,x+iy)=0 gives −i b(x,y)+i b(y,x)=0. Thus b(x,y)=0 for every pair and taking y=αx implies α=0. In the real Euclidean plane the nonzero rotation (x,y)↦(−y,x) is orthogonal to the input for every input, a counterexample.

      (c) The self-adjoint difference D=α*α−αα* satisfies ⟨Dx,x⟩=‖αx‖²−‖α*x‖². Thus the forward implication is immediate and the converse follows from (b) over the complex numbers. Over the reals it still holds: the symmetric bilinear form ⟨Dx,y⟩ has zero diagonal and evaluation on x+y gives twice ⟨Dx,y⟩=0.

      (d) On a nonzero complex space choose an eigenvector v of unit length, αv=λv (the characteristic polynomial has a root). α−λI is normal since it and its adjoint have commutator equal to that of α and α*. By (c), ‖(α*−overline(λ)I)v‖=‖(α−λI)v‖=0. Thus the line spanned by v is invariant under both α and α*. By (a), its perpendicular complement is invariant under both. The restrictions to this complement are adjoints of each other, and commute, so the restriction of α is normal there. Induction on dimension, adjoining v to an orthonormal eigenbasis on the complement, proves the claim. The zero-dimensional case uses the empty basis.
