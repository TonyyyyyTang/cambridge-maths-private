      # IB 2024 P2 12B, original page 7

      Put F(s)=∫₀^∞ xˢ/(1+x²) dx for −1<s<1. Use zˢ/(1+z²) with 0<arg z<π on the upper semicircle of radius R with a small notch of radius ε at 0. The two semicircular integrals tend to zero like O(R^{s−1}) and O(ε^{s+1}). The positive real axis contributes F(s), the negative axis e^{iπs}F(s) after reversing x↦−x. The pole inside is i with residue e^{iπs/2}/(2i). The residue theorem gives

      (1+e^{iπs})F(s)=πe^{iπs/2}, so F(s)=(π/2)sec(πs/2).

      For |s|≤1/2, the four derivatives under the integral are justified by domination on (0,1) and (1,∞) by constant multiples of (1+|log x|⁴)x^{-1/2} and (1+|log x|⁴)x^{-3/2}, respectively. Inverting the cosine power series gives sec t=1+t²/2+5t⁴/24+O(t⁶). Consequently the requested F⁽⁴⁾(0) is 5π⁵/32. Its second derivative reproduces the supplied π³/8 as a check.
