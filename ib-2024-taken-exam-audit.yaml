      # IB 2024 P2 17D, original page 11

      (a) Apply the method with step h to y'=λy, writing z=hλ. The domain of bounded linear stability consists of z for which every numerical solution remains bounded as the step count grows. For a one-step amplification factor R(z) this is |R(z)|≤1. Under the strict decay convention use |R(z)|<1. A-stability requires coverage of the whole open left half-plane. Forward Euler gives R=1+z, the closed disk |1+z|≤1, missing e.g. −3. Backward Euler gives R=1/(1−z), hence the exterior |1−z|≥1, which includes the left half-plane. The strict variants omit the boundary circles.

      (b) A stiff problem has rapidly damped modes that restrict stable explicit step sizes far more than the accuracy needed to follow slower dynamics, especially once the fast transient has decayed. The matrix has trace −101 and determinant 100, and therefore distinct eigenvalues −100 and −1. Each mode propagates independently in an eigenbasis. The fast mode requires |1−100h|≤1, while the slow mode requires |1−h|≤1, so 0<h≤1/50 suffices for bounded forward Euler steps (strict inequality for decay). At h=1/50 the fast factor is −1. Backward Euler's factors 1/(1+h) and 1/(1+100h) have magnitude below one for every h>0.

      (c) Start both methods at the same current vector v. Let F=(I+hM)v and B=(I−hM)⁻¹v, solving the implicit linear system. Writing u=e^{hM}v, for small h we obtain u−F=(h²/2)M²v+O(h³), and u−B=−(h²/2)M²v+O(h³), by expanding the exponential and inverse. Hence u−B≈(F−B)/2, and u−F≈(B−F)/2. Their common estimated local error norm is η=‖F−B‖/2.

      Use backward Euler's B for the accepted state to retain A-stability on decaying modes. Use the forward value as an estimator only. Reject a trial and recompute both from v at smaller h if η exceeds a local error budget δ. Otherwise advance with B. Since η scales like h², propose h_new=s h (δ/η)^{1/2} with a safety factor 0<s<1 and bounded growth/shrinkage, allowing bounded growth at η=0. Relative and absolute tolerances may be included by scaling components in the norm. Adjust the final step to land at the endpoint. The estimate is asymptotic and controls local error. For a specified total error over [0,T], in a contractive norm one can allocate a local budget proportional to h/T, with a per-unit-step controller; for general systems global accumulation also depends on propagation/amplification.
