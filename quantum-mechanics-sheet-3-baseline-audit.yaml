      # Fresh rework of question 11

      Let \(t_0\) be the time of the finite change. For piecewise smooth strong solutions with locally integrable \(\|H(t)\psi(t)\|\) and an ordinary step in the Hamiltonian, integrate \(i\hbar\partial_t\psi=H(t)\psi\) across the interval \([t_0-\epsilon,t_0+\epsilon]\). The norm of the integral on the right is at most \(\int_{t_0-\epsilon}^{t_0+\epsilon}\|H(t)\psi(t)\|\,dt\), which tends to zero. The two one-sided state vectors must agree. Equivalently, a nonzero jump in the vector would give a delta function in its distributional time derivative, with no corresponding term in this finite switch. Continuity here is in the wavefunction norm. The derivative may jump. This argument does not require the spatial Coulomb Hamiltonian to be bounded. On each side of a switch between two fixed self-adjoint Hamiltonians their unitary propagators are strongly continuous for every state.

      Use the stationary nucleus and electron mass \(m_e\) as in Example 6. For \(\chi\propto e^{-r/a}\), \(\nabla^2\chi=(a^{-2}-2/(ar))\chi\) for \(r>0\). The coefficient of \(1/r\) in \(H\chi/\chi\) is \(\hbar^2/(m_ea)-Ze^2/(4\pi\epsilon_0)\). Thus \(a=a_0/Z\) with \(a_0=4\pi\epsilon_0\hbar^2/(m_e e^2)\), leaving the constant energy \(-\hbar^2/(2m_ea^2)\). There is no origin point mass from the radial Laplacian since the outward derivative flux is \(O(r^2)\) there. Using \(\int_0^\infty r^2 e^{-\lambda r}\,dr=2/\lambda^3\) for \(\lambda>0\), the squared norm is \(4\pi |c|^2 a^{-3}\cdot a^3/4=\pi|c|^2\). Choose \(c=1/\sqrt\pi\) real and positive, up to global phase.

      Immediately after the charge switch the bound electron retains the old ground state. The new ground-state amplitude is the overlap of exponentials with lengths \(a=a_0/Z\) and \(b=a_0/(Z+1)\). In the real phase convention it equals
      \[
       \frac{4}{(ab)^{3/2}}\int_0^\infty r^2e^{-(1/a+1/b)r}\,dr
       =\frac{8(ab)^{3/2}}{(a+b)^3}.
      \]
      The Born probability is
      \[
       P=\frac{64[Z(Z+1)]^3}{(2Z+1)^6}
         =\left(1-\frac{1}{(2Z+1)^2}\right)^3.
      \]
      Evolution with the constant new Hamiltonian multiplies that amplitude by a phase, so the probability holds for a later energy measurement as well. This treats the emitted electron as producing the specified sudden charge change, with the bound electron governed by the resulting one-particle Hamiltonian. For \(Z=1\), \(P=512/729\); for every finite positive \(Z\), \(0<P<1\), and \(P\to1\) as \(Z\to\infty\).
    comparison: Both solutions explicitly bound the time integral through an ordinary finite switch using local norm
      integrability, take the stationary nucleus convention, and find a=a₀/Z and |c|=1/√π. The square of the radial
      overlap gives (1−1/(2Z+1)²)³ and remains constant under later evolution. The independent positivity, large-Z
      and Z=1 checks agree.
