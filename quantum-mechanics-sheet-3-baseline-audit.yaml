    blind_rework_utf8: |
      # Fresh rework of question 5

      Take \(m,\omega>0\) and put \(b=\sqrt{\hbar/(m\omega)}\). On \(L^2(\mathbb R^3)\), the Hamiltonian is \(\sum_{j=1}^3 h_j\), where \(h_j\) is the one-dimensional oscillator in coordinate \(x_j\). Its normalised one-dimensional modes are
      \[
      u_n(x)=(\sqrt{\pi}\,b\,2^n n!)^{-1/2}H_n(x/b)e^{-x^2/(2b^2)},\qquad
      h u_n=\hbar\omega(n+1/2)u_n,\qquad n=0,1,\ldots .
      \]
      Here \(H_n\) denotes the physicists' Hermite polynomial. Hence \(\Psi_{ijk}=u_i(x_1)u_j(x_2)u_k(x_3)\) is an eigenfunction of the sum with energy \(\hbar\omega(i+j+k+3/2)\). The products form a complete orthonormal basis by completeness in each tensor factor. Projecting an eigenfunction onto this basis shows that its expansion has support only on triples with its energy.

      For \(N\ge0\) integral, each \(i=0,\ldots,N\) allows \(N-i+1\) choices for \(j\), with \(k=N-i-j\). The dimension is therefore \((N+1)(N+2)/2\). Other values of \(N\) give no eigenfunctions. In particular, the ground state is unique up to scale and its normalised representative is \(\Psi_{000}=\pi^{-3/4}b^{-3/2}e^{-r^2/(2b^2)}\), invariant under rotations.

      In the six-dimensional \(N=2\) space the normalised vector \((\Psi_{200}+\Psi_{020}+\Psi_{002})/\sqrt3\) equals
      \[
       \frac{2r^2/b^2-3}{\sqrt6}\Psi_{000}.
      \]
      Indeed \(u_2/u_0=(2x^2/b^2-1)/\sqrt2\). This proves its rotation invariance, eigenvalue \(7\hbar\omega/2\) and normalisation. As a check, \(\langle r^2\rangle_{000}=3b^2/2\), so this radial excited state is orthogonal to the ground state.
    comparison: Both solutions give the complete Cartesian product basis, multiplicity (N+1)(N+2)/2, radial Gaussian
      and normalized equal superposition with polynomial (2r²/a²−3)/√6. The three orthonormal summands share N=2.
      The independent check of ground-state orthogonality agrees.
