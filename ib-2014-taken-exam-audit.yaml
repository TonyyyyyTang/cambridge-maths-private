  IB/2014/P1/q5B:
    independent_rework: "# Independent rework\n\nWrite the steady fully developed\
      \ velocity as (u(y),0). The convective acceleration vanishes. The horizontal\
      \ momentum equation is μu″=dp/dx=G. Integrating with no slip u(0)=0, u(h)=U\
      \ gives u(y)=Gy(y−h)/(2μ)+Uy/h.\n\nThe slope Gy/μ−Gh/(2μ)+U/h increases across\
      \ the gap. It is negative somewhere precisely when G>2μU/h², by its value at\
      \ the lower plate and continuity. Per unit width the flux is −Gh³/(12μ)+Uh/2,\
      \ so zero flux requires G=6μU/h².\n\nFor η=y/h the zero-flux curve is u/U=3η²−2η.\
      \ Its minimum is −1/3 at η=1/3, it crosses zero again at η=2/3 and reaches 1\
      \ at η=1. The signed areas cancel. Sketch, with vertical height and horizontal\
      \ velocity:\n\n    y/h\n      1          │                       ●  (1,1)\n\
      \                 │               ╱\n                 │       ╱\n    2/3   \
      \       ●\n             ╱   │\n    1/3  ●       │\n           ╲     │\n    \
      \  0          ●────────────────────────── u/U\n       −1/3      0          \
      \             1\n"
    independent_rework_sha256: 5f34ec7171ea5ff90338cb4fcdf3c12e16504d35193f44576db8a56b6e03b7d5
    comparison: The adverse-gradient condition and the zero-flux profile agree. The
      reworked sketch has the interior minimum at one third of the gap and the interior
      zero at two thirds, matching the independently regenerated plot.
