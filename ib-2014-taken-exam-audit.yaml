  IB/2014/P2/q6A:
    independent_rework: "# Independent rework\n\nOrient C positively as the boundary\
      \ of S, and take the final surface with positive orientation and the initial\
      \ surface with negative orientation in the closed swept boundary. Orient the\
      \ connecting ribbon to match. A material parametrisation of the moving curve\
      \ r(s,t), with s increasing along C, gives on the outward ribbon the area element\
      \ (∂_s r × v) ds dt. Its magnetic flux to first order is δt ∮ B·(dr × v)=−δt\
      \ ∮ B·(v × dr), as in the hint.\n\nFirst freeze the magnetic field at t. Its\
      \ divergence vanishes by Gauss's magnetic law, so its flux on the final surface\
      \ minus the initial flux equals minus the ribbon flux. Restoring the change\
      \ in field contributes δt ∫_S ∂_t B·dS + o(δt) for smooth fields and motion.\
      \ Thus\n\n    dΦ/dt = ∫_S ∂_t B·dS + ∮_C B·(v × dr).\n\nFaraday's differential\
      \ law ∂_t B=−curl E and Stokes's theorem give the first term as −∮ E·dr. The\
      \ cyclic scalar product gives B·(v × dr)=−(v × B)·dr. Summing yields −∮(E+v\
      \ × B)·dr=−ℰ. As a sign check an expanding circular loop in constant upward\
      \ B increases its flux, and v × B is opposite its positive tangent.\n"
    independent_rework_sha256: bf1765c4bc3178548c1b2f0541e96ac13fd6562bdc0d13885e7a125049b72351
    comparison: The fresh audit found a typographic discrepancy in both instances
