  IB/2014/P1/q20H:
    independent_rework: '# Independent rework


      A state is aperiodic if the positive n for which (P^n)_{ii}>0 have gcd 1. It
      is positive recurrent if its first positive return time is almost surely finite
      with finite mean, and ergodic if it is both positive recurrent and aperiodic.


      From i>0 one reaches 0 in i deterministic steps, while a jump from 0 can reach
      any positive j with positive probability. Concatenation gives irreducibility.
      Starting at 0 the next height J≥1 has mass pq^(j−1), and the ensuing descent
      takes exactly J steps. Hence T₀=1+J, with mass pq^(n−2) for n≥2, zero for n<2.
      Its mean is 1+1/p, and positive return probabilities at both 2 and 3 imply period
      1.


      The stationarity equations are π₀=π₁ and π_j−π_{j+1}=π₀pq^(j−1) for j≥1. Summation
      to infinity (π_j→0 for a probability) gives π_j=π₀q^(j−1). Normalising gives
      π₀=p/(1+p) and π_j=pq^(j−1)/(1+p), j≥1. These values also satisfy the equations.


      The mean return time to i in an irreducible positive recurrent chain is 1/π_i,
      here (1+p)/(p q^(i−1)) for i≥1. In an irreducible aperiodic positive recurrent
      countable chain the n-step probability of each state converges to its stationary
      probability. Applied to state 0 this gives the requested complementary limit
      1−π₀=1/(1+p).

      '
    independent_rework_sha256: 9f37f01b87483171ecaaa14980ef6866dae243f7e05cee1b7e5debe94d058510
    comparison: The auditor obtains the positive recurrence time 1+1/p, stationary
      mass p/(1+p) at zero, and geometric masses above it. The aperiodic limit agrees
      with the stored proof.
