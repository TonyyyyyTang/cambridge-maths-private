  IB/2014/P2/q10G:
    independent_rework: '# Independent rework


      Define det A by the sum over σ∈S_n of sgn(σ) times the product of a_{j,σ(j)}
      for all j. It is linear in each row separately as each summand contains only
      one member of that row. Interchanging two rows reindexes the sum by a transposition,
      changing its sign. Repeated rows therefore give zero. It follows that multiplying
      a row by c multiplies the determinant by c, and adding a multiple of a different
      row leaves it fixed. Reindexing by σ⁻¹ shows det(Aᵀ)=det A, hence the identical
      rules hold for columns.


      (i) Any nonzero summand of the block determinant assigns the bottom n rows to
      the last n columns, because their first n entries vanish. Bijectivity then forces
      the first rows to the first n columns. Such permutations correspond to independent
      permutations of the two halves and have the product of their signs. Their sum
      factorises as det A det B, regardless of C or singularity.


      (ii) Let M=[A −B; B A]. On the subspaces U₊={(z,−iz)} and U₋={(z,iz)} the top
      component of M is (A+iB)z and (A−iB)z, respectively, and the bottom component
      is −i or i times the top. These two n-dimensional subspaces intersect only at
      zero and span the full complex space. Thus in the basis from their standard
      coordinate vectors the matrix is block diagonal with diagonal blocks A+iB and
      A−iB. Similarity leaves a determinant invariant (equivalently perform the inverse
      row change to the column change). Apply (i) to get the product, without a commutation
      or invertibility assumption.

      '
    independent_rework_sha256: 9587ce5c261d92a7cfc1f812ccde90afbda1dd45dffa77c4fb4875b1ded6f1bf
    comparison: The block-triangular factorization and the two complex diagonal blocks
      agree. Neither proof requires invertibility or commutation of A and B.
