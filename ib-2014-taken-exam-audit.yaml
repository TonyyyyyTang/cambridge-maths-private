  IB/2014/P1/q9G:
    independent_rework: '# Independent rework


      (i) When x=0 its span is zero. Otherwise let d be the first index for which
      T^d x depends linearly on x,...,T^(d−1)x. This exists with 1≤d≤n by dimension.
      T takes every generator of the first d vectors into their span, using the dependence
      for the last generator. All subsequent iterates therefore also belong to that
      span.


      (ii) In the cyclic case the listed n vectors form a basis e_j=T^(j−1)x. Write
      T^n x=Σ_{j=0}^{n−1} a_j T^j x and p(t)=t^n−Σ a_j t^j. Then p(T)x=0 and p(T)e_j=T^(j−1)p(T)x=0.
      To identify p, the matrix C of T has ones immediately below the diagonal, last
      column (a_0,...,a_{n−1}), and zeros elsewhere. In tI−C add t times row 2, t²
      times row 3, and so on to row 1. The new first row is (0,...,0,p(t)); its last-column
      minor has diagonal −1 and is upper triangular. The cofactor sign (−1)^(1+n)
      cancels (−1)^(n−1). Thus det(tI−C)=p(t).


      (iii) In the extended basis the matrix is block upper triangular with blocks
      [A B; 0 D]. The zeros express invariance, A acts on W and D induces the map
      on V/W. There is no requirement that B vanish.


      (iv) In dimension zero the identity endomorphism is the zero map, and the dimension-one
      case follows from multiplication by a scalar. In positive dimension choose x≠0.
      Its cyclic space W is invariant by (i). If it is all V then (ii) applies. Otherwise
      both W and V/W have smaller dimension. By induction χ_D(T)v maps to zero in
      V/W for every v, so lies in W, where χ_A(T) vanishes. Block triangularity gives
      χ_T=χ_Aχ_D. Consequently χ_T(T)=0 on V.

      '
    independent_rework_sha256: 576ef9b098c9866aab3fc92cf7e132953735b6d993ffeb87ecbf841228505a35
    comparison: Both close the cyclic span at the first dependence and identify the
      cyclic characteristic polynomial without Cayley-Hamilton. The characteristic
      polynomial on the quotient maps all of V into the invariant subspace; its own
      polynomial then kills the result.
