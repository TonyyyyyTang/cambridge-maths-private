  IB/2014/P3/q12F:
    independent_rework: '# Independent rework


      Fix x₀∈(a,b) and ε>0. Uniform convergence gives N such that |f_N−f|<ε/3 everywhere.
      Continuity of f_N at x₀ provides δ>0 such that |f_N(x)−f_N(x₀)|<ε/3 for x in
      the interval within distance δ. Adding the two errors of approximation and the
      middle difference yields |f(x)−f(x₀)|<ε.


      On (0,1), take f_n(x)=x^n. The limit is the continuous zero function at every
      point of the open interval, yet sup_{0<x<1}x^n=1 for each n. This rules out
      the converse even with continuous terms and limit.


      Choose η>0 with [α,β+η]⊂(a,b). The continuous f′ is uniformly continuous on
      this compact interval (Heine–Cantor). For n large enough that 1/n<η, the ordinary
      mean value theorem gives g_n(x)=f′(ξ) for a ξ between x and x+1/n. For any ε
      choose δ for uniform continuity of f′ on the enlarged compact interval. Once
      1/n<min(δ,η), |f′(ξ)−f′(x)|<ε for every x in [α,β], giving uniform convergence.
      Only the eventual tail must be defined throughout that compact interval.

      '
