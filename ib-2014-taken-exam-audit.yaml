  IB/2014/P4/q12F:
    independent_rework: '# Independent rework


      For p=(x₀,y₀), differentiability means there exists a linear L:R²→R with f(p+v)=f(p)+L(v)+o(‖v‖)
      as v→0. Axis increments then identify L(s,t)=sD₁f(p)+tD₂f(p).


      Choose a ball around p contained in U. For sufficiently small (s,t), split the
      difference into a horizontal increment at height y₀+t and a vertical increment
      at x₀. The one-dimensional mean value theorem on those segments gives sD₁f(x₀+ξs,y₀+t)+tD₂f(x₀,y₀+ζt),
      with 0<ξ,ζ<1 (a zero increment contributes zero). Existence of the partial derivatives
      gives the one-variable differentiability needed on these segments. At p the
      two derivatives are continuous, so subtracting sD₁f(p)+tD₂f(p) leaves at most
      (|s|+|t|)o(1)=o(‖(s,t)‖).


      The converse fails. Take f(x,y)=x² sin(1/x) for x≠0 and 0 on the y-axis. It
      is smooth off that axis. On the axis the change in f is bounded by s², making
      its total derivative zero there. For x≠0 the partial D₁f=2x sin(1/x)−cos(1/x)
      equals −1 along x=1/(2πj), although it vanishes on the axis. This supplies a
      differentiable function with a discontinuous partial at the origin (and translations
      give any chosen point).


      For the specified h, smoothness gives differentiability wherever x≠0. At (0,y₀)
      with y₀≠0, the horizontal difference quotient y₀ sin(1/s) has no limit (take
      inverse phases π/2+2πj and 3π/2+2πj). At (0,0), |h(s,t)|≤|st|≤(s²+t²)/2, so
      h is differentiable with zero total derivative. The answer is {x≠0} together
      with {(0,0)}.

      '
    independent_rework_sha256: bdd50247e9d740d7f55dfa87531f58305822481e5b225f4020abb5d747201de1
    comparison: Pathwise one-variable mean-value estimates along two coordinate segments
      give the same derivative. The horizontal quotient fails on the punctured vertical
      axis; at the origin the quadratic bound gives total derivative zero.
