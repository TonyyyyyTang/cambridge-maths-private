  IB/2014/P1/q13B:
    independent_rework: '# Independent rework


      Let Δ=√(a²−b²). On the positively oriented unit circle use z=exp(iθ). The integral
      J of 1/(a+b cos θ) over a full period is the integral of (2/i) dz/(bz²+2az+b).
      The roots are r_±=(−a±Δ)/b. Since r_+=−b/(a+Δ) lies strictly inside the unit
      circle and r_+r_−=1, the sole enclosed residue is (2/i)/(2br_++2a)=1/(iΔ). Hence
      J=2π/Δ.


      For c=cos θ, b²(1−c²)/(a+bc)=a−bc−Δ²/(a+bc). Integration gives the required
      2π(a−Δ)/b².


      For x=cos(θ/2) use θ decreasing from π to 0, and √(1−x²)=sin(θ/2). Reversing
      the limits produces (1/4)∫₀^π sin²θ/(3+cos θ) dθ. Reflection about π doubles
      this integral over the full period, so the answer is (1/8)·2π(3−√8)=π(3−2√2)/4.

      '
    independent_rework_sha256: 3ac0499b9fff490976ea6bc89ba2c611dad200cce769d9692c8f0d13263162ef
    comparison: Both residue calculations select the inner real root. The change of
      half-angle gives the factor one eighth and the same final integral pi*(3-2 sqrt(2))/4.
