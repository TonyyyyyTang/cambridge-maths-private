  IB/2014/P2/q5D:
    independent_rework: "# Independent rework\n\nFor period one use the exponential\
      \ coefficients F_n=∫₀¹x(1−x)e^(−2πinx)dx. F₀=1/6. For n≠0 let w=2πin. Integrating\
      \ by parts gives F_n=w⁻¹∫₀¹(1−2x)e^(−wx)dx because the polynomial vanishes at\
      \ both ends. A second integration by parts gives F_n=2/w², since f′(1)−f′(0)=−2\
      \ and the constant second derivative integrates to zero against that exponential.\
      \ Pairing positive and negative n gives\n\n    f(x)=1/6−Σ_{n≥1} cos(2πnx)/(π²n²).\n\
      \nThe periodic function is continuous and piecewise smooth, so its Fourier series\
      \ has the displayed value everywhere. For the periodic extension of the derivative,\
      \ integration by parts in the coefficient integral gives F_n(f′)=2πin F_n(f),\
      \ including n=0 (the mean derivative is zero), since the boundary values of\
      \ f match. Thus differentiating the individual terms gives the Fourier series\
      \ of the derivative, 2Σ sin(2πnx)/(πn). No claim of uniform convergence of that\
      \ differentiated series at the jump is required. At zero every sine vanishes.\
      \ The one-sided slopes of the periodic extension are −1 on approach from the\
      \ left and +1 on approach from the right. The Fourier midpoint rule gives their\
      \ arithmetic mean, zero.\n"
    independent_rework_sha256: 1059602d07c39d93775d347668b24d9e79e1e00453b64fe46cdf20614e581d6f
    comparison: Both calculate mean 1/6, cosine coefficients -1/(pi n)^2, and the
      termwise derivative sine series. At the periodic join the derivative series
      has midpoint value zero.
