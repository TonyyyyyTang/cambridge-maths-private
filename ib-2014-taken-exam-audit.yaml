  IB/2014/P3/q7D:
    independent_rework: '# Independent rework


      Parameterise characteristics by dx/dt=−y, dy/dt=x. Then du/dt=−yu_x+xu_y=0.
      Starting at (0,s) for s>0 gives (−s sin t,s cos t). Thus u is constant on each
      full circle of radius s and every positive-radius circle meets the data ray
      exactly once as a point. Its assigned value is cos(s²).


      The characteristic at the origin is stationary. Its given value is cos 0=1,
      consistent with the limit from the other circles. The resulting unique classical
      solution on the plane is u(x,y)=cos(x²+y²), a smooth function. Its derivatives
      are −2x sin(x²+y²) and −2y sin(x²+y²), which cancel in the PDE and recover the
      data.

      '
    independent_rework_sha256: 66564fc59b0ace9f19ea2ebd35f751ce0eaa25f3a69f0a1b9f5948eea4504493
    comparison: Both preserve radius squared on each circular characteristic, use
