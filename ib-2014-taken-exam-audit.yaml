  IB/2014/P2/q19C:
    independent_rework: "# Independent rework\n\nLet λ be the true functional minus\
      \ its approximation. Taylor expansion about a gives f(x)=P_k(x)+(1/k!)∫_a^b(x−θ)_+^k\
      \ f^(k+1)(θ)dθ, with the step function interpretation for k=0. Exactness implies\
      \ λ kills every polynomial of degree ≤k (a lower degree polynomial is a difference\
      \ of two of degree k). Provided λ can be applied to the truncated powers for\
      \ almost every θ and interchanged with this integral, the formula in the question\
      \ follows with K(θ)=λ_x[(x−θ)_+^k]. For example a bounded functional on C[a,b]\
      \ suffices for k≥1 by uniform Riemann integration. For the derivative evaluation\
      \ below, the twice differentiated Taylor remainder is an ordinary integral up\
      \ to x, so the interchange can be justified directly even at a kernel jump.\n\
      \nApplying the scheme to 1,x,x² gives c₀+c₁+c₃=0, c₁+3c₃=0, c₁+9c₃=2. The resulting\
      \ weights are 2/3, −1, 1/3. For 0<θ<3,\n\n    K(θ)=2·1_{θ<2} + (1−θ)_+² − (3−θ)²/3.\n\
      \nIndeed, the actual second derivative contributes 2 times the indicator, while\
      \ the 0-node term vanishes. At θ=2 the classical second derivative of the truncated\
      \ power is undefined, and its isolated assigned value does not affect the integral.\
      \ The three branches on (0,1),(1,2),(2,3) are respectively 2θ²/3, 2−(3−θ)²/3\
      \ and −(3−θ)²/3. The first rises convexly from zero to 2/3, the next rises concavely\
      \ to 5/3 from below. A jump of −2 at 2 starts the final increasing, concave\
      \ branch at −1/3, with a horizontal tangent at 3. Sketch (open circles indicate\
      \ one-sided limits):\n\n    K\n     5/3 │                               ·○\n\
      \         │                            ···\n         │                     \
      \    ····\n         │                       ···\n         │                \
      \     ···\n         │                   ···\n         │                  ··\n\
      \         │                ···\n     2/3 │              ··●\n         │    \
      \        ···\n         │          ···\n         │       ····\n       0 │●·······\
      \                                        ●\n         │                     \
      \                 ···········\n         │                                  ·····\n\
      \    −1/3 │                                ○··\n         └────────────────────────────────────────────────\
      \ θ\n          0               1               2               3\n\nHölder's\
      \ inequalities give r=ess sup |K|/2=5/6 and s=∫|K|/2. On (2,3) the negative\
      \ area has magnitude 1/9. The signed area is 4/3, for ∫K/2 times 6 equals λ(x³)=12−[−1+27/3]=4.\
      \ Thus ∫|K|=4/3+2/9=14/9 and s=7/9. To see sharpness, every continuous function\
      \ g on [0,3] is some f‴ by three integrations. For r take nonnegative continuous\
      \ bumps of integral 1 supported immediately to the left of 2, making ∫Kg approach\
      \ 5/3. For s take continuous functions bounded by 1 agreeing with sgn K except\
      \ in successively smaller intervals at 2. Boundedness of K makes the integral\
      \ tend to ∫|K|. Finally for x³ the L¹ norm of f‴ is 18 and its supremum norm\
      \ is 6, so 4≤15 and 4≤14/3 explicitly.\n"
    independent_rework_sha256: 3879b63baa96b3d7fd37d29270a8528e815b7a5ea518b0cfec24e15b30d3cfd7
