  IB/2014/P3/q20H:
    independent_rework: '# Independent rework


      Set N=nk and S=Σx_i, assuming the usual positive number k of trials and sample
      size n≥1. By independence the likelihood is proportional to θ^S(1−θ)^(N−S).
      For 0<S<N its log derivative S/θ−(N−S)/(1−θ) vanishes exactly at S/N; the second
      derivative is strictly negative. When S=0 or N the likelihood is strictly monotone
      and the open interval in the question excludes its supremum point. The conventional
      extended estimate on the closure is 0 or 1 respectively; below write θ̂=S/N
      with that interpretation for boundary data. If zero trials are allowed, k=0
      leaves the likelihood constant and every θ maximises it. The requested strict
      range for c presupposes N>0.


      Statistician 1 uses Beta(α,1). After multiplying by the likelihood and normalising
      one gets Beta(S+α,N−S+1), hence mean m₁=(S+α)/(N+α+1). With c=N/(N+α+1)∈(0,1)
      and prior mean θ̃₁=α/(α+1), c θ̂+(1−c)θ̃₁ gives m₁. The algebra holds for boundary
      data using the extended estimate.


      Statistician 2 uses Beta(1,α), a reflection of the increasing first density.
      The first favours larger probabilities and the second smaller ones. Its posterior
      is Beta(S+1,N−S+α), giving m₂=(S+1)/(N+α+1). The difference m₁−m₂=(α−1)/(N+α+1)
      is positive.


      As α grows, P₁(θ≤t)=t^α decreases to zero for every 0<t<1 and P₂(θ≥t)=(1−t)^α
      decreases to zero. Thus the priors concentrate toward 1 and 0 respectively.
      The data weight c decreases to zero. With D=N+α+1, dm₁/dα=(N−S+1)/D²>0 and dm₂/dα=−(S+1)/D²<0.
      Their respective limits are 1 and 0.

      '
    independent_rework_sha256: b511111426e65c7ef2232130a05c5291b00e7ee87a2cfa819590aaf72e4f282d
    comparison: Both find the same beta posteriors, posterior means and their difference.
      The strictly open parameter space has no likelihood maximizer for the two extreme
      outcomes. The stored answer states the boundary convention.
