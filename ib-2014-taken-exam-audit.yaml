  IB/2014/P1/q15A:
    independent_rework: "# Independent rework\n\n(i) Across (−a,a) the sine squared\
      \ integrates to a, so choose α_n=1/√a up to an arbitrary unit phase. The Hamiltonian\
      \ in the well is −ℏ²∂²_x/(2m); the wave number k_n=nπ/(2a) gives E_n=ℏ²n²π²/(8ma²).\
      \ Each sine vanishes at both walls.\n\n(ii) Choose the prepared wave real with\
      \ positive slope. Its normalising factor is √(3/a³) because ∫₀ᵃx²dx=a³/3. The\
      \ L² expansion in the complete sine basis is ψ=Σ c_n ψ_n, where c_n=√3/a² ∫₀ᵃx\
      \ sin(k_n(x+a))dx. An antiderivative is −x cos(k_n(x+a))/k_n+sin(k_n(x+a))/k_n².\
      \ Therefore\n\n    c_n = √3 [−2(−1)^n/(nπ) − 4 sin(nπ/2)/(nπ)²].\n\nThe expansion\
      \ also gives the stated endpoint convention at both walls, where all basis functions\
      \ vanish. The discontinuity approached from inside the right wall does not affect\
      \ the L² coefficients.\n\n(iii) The strict threshold means n²>8. Completeness\
      \ and the Born rule give P=1−|c₁|²−|c₂|². Here c₁=√3(2/π−4/π²), c₂=−√3/π. Thus\
      \ in increasing order of index the five integers are (1,0,−15,48,−48).\n\n(iv)\
      \ From Parseval multiply Σ|c_n|²=1 by π²/3. For n=2p the contribution is 1/p².\
      \ For n=2p−1, sin(nπ/2)=(−1)^(p−1), so the contribution is 4/(2p−1)² times [1+2(−1)^p/((2p−1)π)]².\
      \ Summing over p≥1 yields A=1, B=4, C=2.\n"
    independent_rework_sha256: cb8f187788248ce51664da2aecb8d03a1b1531565a1d96968e2fc41718a6432b
