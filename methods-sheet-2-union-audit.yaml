  code: "\"\"\"Independent spot checks of the formulas in rework.md, using the standard\
    \ library.\"\"\"\nfrom fractions import Fraction as Q\nfrom math import cos, sin,\
    \ cosh, exp, factorial, pi\nimport cmath\n\ndef simpson(f, lo, hi, n=2400):\n\
    \    dx=(hi-lo)/n\n    return dx/3*(f(lo)+f(hi)+sum((4 if j%2 else 2)*f(lo+dx*j)\
    \ for j in range(1,n)))\n\n# Use exponentials to check the ODE and both initial\
    \ conditions by exact analytic derivatives.\nA,mu,k,H=1.3,.9,2.7,.61\nB=H/(2*mu*k**2)\n\
    C=A*k-B*k\nfor t in (0,.13,.79,1.8):\n    u=(A+C*t)*exp(-k*t)+B*sin(k*t)\n   \
    \ du=(C-k*(A+C*t))*exp(-k*t)+k*B*cos(k*t)\n    ddu=(k*k*(A+C*t)-2*k*C)*exp(-k*t)-k*k*B*sin(k*t)\n\
    \    assert abs(ddu+2*k*du+k*k*u-H/mu*cos(k*t))<1e-13\n    if t==0: assert abs(u-A)+abs(du)<1e-14\n\
    print(\"Damped string: forced ODE and two initial values passed.\")\nfor n in\
    \ range(1,10):\n    c=2*simpson(lambda x:(x*x-x)*sin(n*pi*x),0,1)\n    assert\
    \ abs(c+4*(1-(-1)**n)/(n*pi)**3)<1e-11\nprint(\"Heat equation: nine projection\
    \ coefficients passed by quadrature.\")\n\ndef legendre(n):\n    a=[Q(0) for _\
    \ in range(n+1)]\n    for j in range((n+1)//2,n+1):\n        a[2*j-n]=Q((-1)**(n-j)*factorial(2*j),2**n*factorial(j)*factorial(n-j)*factorial(2*j-n))\n\
    \    return a\n\ndef moment(n):\n    return Q(2,n+1) if n%2==0 else Q(0)\n\ndef\
    \ value(a,x):\n    return sum(c*x**j for j,c in enumerate(a))\n\nfor n in range(1,10):\n\
    \    a=legendre(n); assert sum(a)==1 and a[-1]\n    for m in range(n): assert\
    \ sum(c*moment(j+m) for j,c in enumerate(a))==0\n    assert sum(v*w*moment(i+j)\
    \ for i,v in enumerate(a) for j,w in enumerate(a))==Q(2,2*n+1)\n    above,below=legendre(n+1),legendre(n-1)\n\
    \    for i in range(n+1):\n        assert (i+1)*(above[i+1]-(below[i+1] if i+1<len(below)\
    \ else 0))==(2*n+1)*a[i]\nr,x=.21,.37\nassert abs(sum(float(value(legendre(j),x))*r**j\
    \ for j in range(28))-(1-2*r*x+r*r)**(-.5))<1e-14\nprint(\"Legendre: exact normalized\
    \ polynomials, squared norms, lower moments and derivative recurrence passed n=1..9;\
    \ generating series passed.\")\n# Complex step checks the distribution derivative\
    \ acting on a nonconstant test function.\nfor a in (.21,1.7,-.62):\n    h=1e-10;\
    \ u=1+1j*h\n    result=-(cmath.exp(a*u)/u).imag/h\n    assert abs(result-(1-a)*exp(a))<1e-13\n\
    print(\"Delta derivative: three complex-step actions on exp(a u)/u passed.\")\n\
    \nroots=[]\nfor n in range(1,9):\n    edge=(n+.5)*pi\n    lo,hi=(edge,edge+.5*pi)\
    \ if n%2 else (edge-.5*pi,edge)\n    def f(z): return cos(z)-1/cosh(z)\n    assert\
    \ f(lo)*f(hi)<0\n    for _ in range(55):\n        mid=(lo+hi)/2\n        if f(lo)*f(mid)<=0:\
    \ hi=mid\n        else: lo=mid\n    z=(lo+hi)/2\n    assert abs(f(z))<3e-14 and\
    \ abs(z-edge)<2.1*exp(-edge)\n    roots.append(z)\nprint(\"Clamped beam: eight\
    \ edge-bracket root residuals and shifts passed; first three fourth roots\",*[round(x,9)\
    \ for x in roots[:3]])\n"
