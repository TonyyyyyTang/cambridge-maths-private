  ## Scope and interpretation


  The 2016–17 reference to (i) in the hint is printed even though its immediate labels
  are (a)/(b). The Rodrigues orthogonality statement uses the conventional nonnegative
  integer polynomial degree m. The fourth-order coefficient statement concerns formal
  self-adjointness prior to a choice of boundary domain. These qualifications are
  documented in the independent rework. The comparison with stored answers belongs
