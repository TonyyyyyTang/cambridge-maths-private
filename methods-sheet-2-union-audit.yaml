blind_rework: '# Independent mathematical rework of the Methods Sheet 2 sample


  The input comprised eleven exact question fragments and their original locators.
  This is a blind rework prepared without consulting solutions. Each heading identifies
  every variant to which the derivation applies. The six families contain 11, 3, 9,
  2, 2 and 6 printed occurrences, respectively.


  ## Damped string — qx06-8877b42600f0, bd4e19164b5f, e63ce8d6d4a6, f8028be0969c


  Write d for the printed length (L or ℓ), T for the tension (τ or T), and H for the
  force amplitude (F or F₀). In the small-slope approximation the vertical resultant
  of the two end tensions on [x,x+dx] is T(y_x(x+dx)−y_x(x)) = T y_xx dx + o(dx).
  With mass μ dx and external force density h, the transverse force law is μ y_tt
  = T y_xx − 2k μ y_t + h. Putting T=μc² and initially h=0 gives both displayed rearrangements.
  The fixed endpoints enforce homogeneous Dirichlet data.


  Set S=sin(πx/d) and k=πc/d. In part (i), or (a), y=S u(t) gives u''''+2ku''+k²u=0.
  Its repeated root −k gives u=(a+bt)e^(−kt). Initial displacement and velocity set
  a=A and b=kA. Hence y=A(1+kt)e^(−kt)S. This solves the full initial-boundary problem
  uniquely: the energy of the difference of any two solutions is (1/2)∫(μy_t²+Ty_x²)
  dx, with time derivative −2kμ∫y_t² dx and initial value zero.


  In part (ii), or (b), the same modal equation has right-hand side (H/μ) cos kt.
  Putting u_p=B sin kt cancels the undamped terms and yields 2k²B=H/μ. Thus y_p =
  H/(2μk²) S sin kt; the forced displacement lags the force by a quarter-period. If
  the original displacement and zero velocity are imposed after turning on the forcing,
  the complete amplitude is

  u = [A+(kA−H/(2μk))t]e^(−kt) + H/(2μk²) sin kt.

  Without prescribed initial conditions a homogeneous solution may be added. In mode
  n the characteristic equation is s²+2ks+n²k²=0. The n=1 critical transient is O((1+t)e^(−kt)),
  and every n≥2 modal transient is e^(−kt) times a linear combination of sin and cos
  of k√(n²−1)t. For general finite-energy initial data the transient energy tends
  to zero, since each mode decays and is dominated by its initial energy by dissipation.
  The explicitly given initial data excite only n=1. The limiting motion is periodic,
  in the sense y−y_p→0.


  ## Nonhomogeneous temperature — qx08-f1aedf8d34f2


  Take B=0 from x=0 and A=1 from x=1. Φ=φ−x has homogeneous boundary conditions, initial
  function g=x²−x and Φ_t=κΦ_xx. With a=nπ, the sine coefficient of g is 2∫ g sin(ax)
  dx over [0,1]. The boundary terms vanish upon two integrations by parts since g
  vanishes at the endpoints and sin(ax) vanishes there. The result is −(2/a²)∫g''''
  sin(ax) dx=−4(1−(−1)^n)/a³. For κ>0,

  φ(x,t)=x−(8/π³)Σ_{odd n≥1} exp(−κn²π²t) sin(nπx)/n³.

  The sine expansion of the continuous piecewise smooth odd periodic extension recovers
  g, including the zero endpoint values, and its n^−3 coefficients give uniform convergence
  at t=0. Termwise derivatives are justified on positive-time strips by the Gaussian
  factor. The difference of two solutions with identical data dissipates L² norm by
  integration by parts. The solution tends uniformly to x, with leading correction
  −(8/π³)e^(−κπ²t)sin(πx) and a remainder uniformly O(e^(−9κπ²t)).


  ## Rodrigues’ formula — qx12-3bde27515d8e, 9861f02aef2f, e98bce05fc07


  (a)(i) Let U=(x²−1)^n and q=U^(n)/(2^n n!). Its top term is a_n x^n, where a_n=(2n)!/(2^n(n!)²)>0.
  Thus its degree is exactly n. (ii) In U=(x−1)^n(x+1)^n only the Leibniz term taking
  all n derivatives on (x−1)^n survives at x=1: U^(n)(1)=n!2^n and q(1)=1. (iii) Differentiate
  (x²−1)U''−2nxU=0 a further n+1 times. The three terms left are (x²−1)U^(n+2)+2xU^(n+1)−n(n+1)U^(n)=0.
  Division by the defining constant gives Legendre''s equation.


  (b)(i) For a nonzero polynomial solution of degree j its highest-power coefficient
  gives j(j+1)=n(n+1), hence j=n. Two independent polynomial solutions could be combined
  to cancel the degree n term, a contradiction. The normalisation at 1 therefore identifies
  q=P_n.

  (ii) Every U^(j) for j<n vanishes at both ends. Integrating Rodrigues’ formula against
  P_n by parts n times gives ∫P_n²=(a_n/2^n)∫(1−x²)^n. The substitution x=2t−1 gives
  the last integral as 2·4^n∫₀¹t^n(1−t)^n dt = 2·4^n(n!)²/(2n+1)!, using the integer
  beta integral (equivalently repeated integration by parts). Thus the squared norm
  is 2/(2n+1).

  (iii) For integers 0≤m<n the same integrations by parts applied to x^m give zero
  because its nth derivative vanishes. The usual implied polynomial-degree restriction
  matters: the bare inequality m<n alone would allow m=−1,n=1, giving ∫x^−1P₁(x) dx=2
  over [−1,1], with a removable integrand singularity.


  ## Multipoles — qx16-27fe9938e567


  Write s=|r−k|. For s>0 the radial Laplacian around k is s^−2 ∂s(s²∂s); applied to
  s^−1 it vanishes. For k the unit polar vector, put x=cos θ. The axisymmetric potential
  G=(1−2rx+r²)^−1/2 has Taylor coefficients A_j(x) in r at r=0, polynomial of degree
  at most j by the binomial expansion at zero. For real x in [−1,1] the complex roots
  of the radicand have modulus 1, so the branch at zero is analytic for |r|<1. On
  compact radii this expansion is uniform in x by Cauchy''s estimate on an intermediate
  radius. Substituting into the axisymmetric Laplace equation ∂r(r²G_r)+∂x((1−x²)G_x)=0
  gives [(1−x²)A_j'']''+j(j+1)A_j=0. Coefficient comparison can also be performed
  by differentiating at r=0. On the polar axis G(r,1)=(1−r)^−1, hence A_j(1)=1. Polynomial
  uniqueness as in the previous derivation gives A_j=P_j. The stated derivative formula
  follows from Taylor''s formula.


  For distinct j and k, multiplying the Legendre equations by the opposite polynomial,
  subtracting and integrating by parts gives zero cross integral: (1−x²) annihilates
  the endpoint terms. By uniform convergence one can integrate the square of the generating
  function to obtain Σ r^(2j)∫P_j². The given integral evaluates for 0<r<1 to (1/r)log((1+r)/(1−r))=2Σ_{j≥0}r^(2j)/(2j+1);
  the limit at r=0 is 2. Coefficients identify the norms.


  Finally (1−r²)G_x/r = (1−r²)(1−2rx+r²)^−3/2 = 2rG_r+G, the first quotient having
  its limiting value at zero. Comparison of the r^ℓ coefficients gives P''_{ℓ+1}−P''_{ℓ−1}=(2ℓ+1)P_ℓ
  for ℓ≥1 (P''₀=0). The zeroth coefficient reads P''₁=P₀, without requiring a negative
  polynomial index.


  ## Product of deltas — qx22-9c502912c2df


  Take u=x²+y², v=x²−y². The support lies over (u,v)=(1,0), at four points x=±1/√2,
  y=±1/√2. In each quadrant the absolute Jacobian |∂(u,v)/∂(x,y)|=8|xy|=4√(u²−v²)
  is nonzero near the supporting point. A smooth cutoff equal to one near those points
  permits the local changes of variables, and contributions elsewhere vanish. Summing
  the four branches gives effective integrand f(u)/√(u²−v²) against δ''(u−1)δ(v).
  Setting v=0 gives f(u)/u near u=1; the derivative delta acts by minus the derivative
  there, yielding f(1)−f''(1). This uses sufficient local smoothness of f for the
  stated action (smooth test data suffice).


  ## Fourth-order operator and clamped eigenvalues — qx26-74cfd2f9df63


  For sufficiently smooth real p_j the formal adjoint on compactly supported smooth
  functions is Σ(−D)^j(p_j·). Matching D³ gives 4p₄''−p₃=p₃, so p₃=2p₄''. The D² condition
  follows by differentiation. Matching D gives 4p₄''''''−3p₃''''+2p₂''−p₁=p₁, hence
  p₁=p₂''−p₄''''''. Conversely these identities put the expression into D²(p₄ D²)+D((p₂−p₄'''')D)+p₀,
  formally self-adjoint after integration by parts. A self-adjoint *operator* on an
  interval additionally requires a specified domain with appropriate boundary conditions;
  the coefficient test concerns the formal differential expression.


  For clamped boundaries and nonzero eigenfunction, two integrations by parts give
  λ∫|y|²=∫|y''''|²>0; equality forces an affine clamped function and hence the zero
  function. Write z=λ^(1/4)>0. Satisfying the two conditions at zero gives y=A(cosh
  zx−cos zx)+B(sinh zx−sin zx). The remaining determinant divided by z equals

  (cosh z−cos z)²−(sinh z−sin z)(sinh z+sin z)=2(1−cosh z cos z).

  At a positive root the first coefficient cosh z−cos z is positive, hence the nullspace
  is one-dimensional. z=0 is ruled out by the energy identity.


  For z>0 the equation is cos z=sech z. In each positive cosine lobe centred at 2jπ,
  j≥1, cosh z cos z increases from zero to cosh(2jπ)>1 on the left half. On the right
  half, its logarithmic derivative tanh z−tan z is positive at the centre, decreases
  strictly (sech² z−sec² z<0), and tends to −∞. Thus there is exactly one crossing
  of 1 on either half. On (0,π/2) the logarithmic derivative decreases strictly from
  0, so the product is <1, and negative cosine lobes have no roots. These crossings
  enumerate strictly increasing positive z_n and λ_n=z_n^4. At large j each crossing
  is near its adjacent zero of cosine, since sech z tends to zero. Writing s_n=(n+1/2)π,
  n≥1, the bounded displacement to s_n is O(e^(−s_n)) by |sin(z_n−s_n)|=sech z_n and
  the edge branch. Therefore λ_n=[(n+1/2)π+O(e^(−(n+1/2)π))]^4, in particular λ_n~π^4n^4.

  '
