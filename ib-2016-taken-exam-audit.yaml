  IB/2016/P2/q8H:
    independent_rework: '# IB 2016, Paper 2, 8H


      Under the null the two groups share the same three outcome probabilities. Their
      pooled estimates are \(50/100,20/100,30/100\) for better, same and worse. The
      expected counts in either group of 50 are therefore 25, 10 and 15. The two groups
      have opposite deviations from expectation, and the Pearson statistic is

      \[

      X^2=2\left(\frac{3^2}{25}+\frac{6^2}{10}+\frac{3^2}{15}\right)=9.12.

      \]

      Under the usual independent sampling model, the null reference law is asymptotically
      chi-squared with \((3-1)(2-1)=2\) degrees of freedom. The 1% upper-tail critical
      value is 9.21. The statistic lies below this threshold (asymptotic \(p=e^{-9.12/2}\simeq0.01046\)),
      so the data do not reject a common outcome distribution at the requested level.

      '
    independent_rework_sha256: 21e0afd7eec7cff16bde22d0c2be387047a6df83fd30c292f98d93d142ff3cee
    comparison: All six expected cell counts agree. The two-degree-of-freedom statistic
      9.12 lies below the one-percent critical value; the auditor calculates the same
      approximate tail probability.
