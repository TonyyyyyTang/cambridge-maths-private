  IB/2016/P2/q17B:
    independent_rework: '# IB 2016, Paper 2, 17B


      Use the usual oscillator operator domains, on which the products or matrix elements
      in question are defined. Suppress hats and put \(d=m\omega\).


      (a) Multiplying in the specified order,

      \[

      BA=p^2+d^2x^2+id[x,p]=2mH-d\hbar,\qquad

      AB=p^2+d^2x^2-id[x,p]=2mH+d\hbar.

      \]

      These are the two factorizations.


      (b) Associativity gives \(A(H-\hbar\omega/2)=(H+\hbar\omega/2)A\). Thus \(H(A\phi)=(E-\hbar\omega)A\phi\).
      The lowered vector is an eigenfunction provided it is nonzero. The unqualified
      wording needs this exception: the ground state is annihilated.


      (c) Hermiticity of \(p,x\) and conjugation of the scalar coefficient give

      \(\langle\chi,A\psi\rangle=\langle p\chi,\psi\rangle-id\langle x\chi,\psi\rangle=\langle
      B\chi,\psi\rangle\), with the inner product conjugate-linear in its first argument.
      Writing it as an integral yields the stated equality. Normalisable wavefunctions
      in this formula are understood to belong to the requisite operator domains.


      (d) Therefore \(\|A\phi\|^2=\langle\phi,BA\phi\rangle=2m(E-\hbar\omega/2)\|\phi\|^2\).
      The norm itself is \(\sqrt{2m(E-\hbar\omega/2)}\|\phi\|\).


      (e) Since \(\|\phi\|>0\), the squared norm in (d) forces \(E\ge\hbar\omega/2>0\).


      (f) Apply (b) successively for as long as the resulting vector is nonzero. The
      vectors \(A^j\phi\) then have energies \(E-j\hbar\omega\), so (e) forbids continuing
      indefinitely. There is a last nonzero \(A^n\phi\), \(n\ge0\). Its lowering has
      zero norm, and (d) gives \(E-n\hbar\omega=\hbar\omega/2\). This proves the required
      necessary form.

      '
    independent_rework_sha256: 97a2449e540c3b715b8529ec1a0c3b9cdc8ddbc53148ae608b5c6c9dfa6e85d7
    comparison: The auditor verifies the printed assertion at its source and independently
      states the nonzero condition on a lowered eigenstate. Adjointness, squared norm
      and termination prove the same spectrum.
