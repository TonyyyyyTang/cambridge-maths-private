  IB/2016/P1/q5C:
    independent_rework: '# IB 2016, Paper 1, 5C


      (a) Put \(r^2=x^2+y^2>0\). The horizontal terms in the divergence are \(2Axy/r^4\)
      and \(-2Axy/r^4\), so the divergence is \(U''(z)\). The first two components
      of the curl vanish because the horizontal velocity is independent of \(z\) and
      the vertical velocity depends only on \(z\). The third is

      \[

      A\{(r^2-2x^2)+(r^2-2y^2)\}/r^4=0.

      \]

      Thus every real \(A\) is allowed and \(U\) must be constant on the real line.


      (b) On a piecewise smooth closed curve avoiding the axis, the planar projection
      has a continuous lifted polar angle \(\vartheta\) along the parametrising interval.
      The velocity line element is

      \[

      A\,d\vartheta+U(z)\,dz,\qquad d\vartheta=(x\,dy-y\,dx)/r^2.

      \]

      The vertical contribution is an exact differential and integrates to zero. The
      circulation is \(2\pi A\) times the signed winding number of the projection
      about zero. For a positive single circuit, viewed from the positive \(z\)-axis,
      it is \(2\pi A\), and reversing the circuit reverses the sign.

      '
    independent_rework_sha256: 1313ed040d141ab47f41a19d8d095ae2922dc8d31983a48f1cd73abfbfcff190
    comparison: Both differentiate on the axis-excluded domain and integrate a lifted
      polar angle. The circulation is 2πA times the signed winding number and the
      axial contribution vanishes.
