  IB/2016/P3/q15B:
    independent_rework: '# IB 2016, Paper 3, 15B


      (a) Use \(\widehat h(k)=\int_{\mathbb R}h(x)e^{-ikx}\,dx\), with inversion factor
      \(1/(2\pi)\). Integration by parts gives \(\widehat{h''}=ik\widehat h\) for
      a smooth decaying \(h\), and differentiation under the integral gives \(\widehat{xh}=i\widehat
      h''\) if \(xh\) is integrable. Both apply to this Gaussian. Transforming \(f''=-2a^2xf\)
      gives \(\widehat f''=-(k/(2a^2))\widehat f\). The integral at \(k=0\) is \(\sqrt\pi/a\)
      by evenness and substitution in the supplied integral, so \(\widehat f(k)=(\sqrt\pi/a)e^{-k^2/(4a^2)}\).


      (b) Fourier transformation in \(x\) turns the heat equation into \(\partial_t\widehat\theta=-Dk^2\widehat\theta\),
      giving \(\widehat\theta=e^{-Dtk^2}\widehat g\). From (a) with \(a=1/(2\sqrt{Dt})\),
      the transform of \(K_t(x)=(4\pi Dt)^{-1/2}e^{-x^2/(4Dt)}\) is \(e^{-Dtk^2}\).
      The transform of a convolution is a product, so inversion yields the usual Cauchy
      solution

      \[

      \theta(x,t)=\int_{\mathbb R}K_t(x-y)g(y)\,dy.

      \]

      For \(t>0\) every kernel value is strictly positive. For nonnegative integrable
      initial data positive on a set of positive measure (in particular for continuous
      nonnegative nontrivial compactly supported data), the integral is strictly positive
      for every \(x\). The requested possible propagation therefore holds at every
      positive time, however small.


      (c) Write \(v=|c|>0\). In characteristic coordinates \(\xi=x-vt,\ \eta=x+vt\)
      the equation is \(u_{\xi\eta}=0\), hence \(u=F(\xi)+G(\eta)\). At \(t=0\), \(F+G=\phi,\
      v(G''-F'')=0\). Thus \(F,G\) are each \(\phi/2\) up to opposite additive constants,
      giving

      \[

      u(x,t)=\tfrac12[\phi(x-vt)+\phi(x+vt)].

      \]

      For data supported on \([-\alpha,\alpha]\), the right side vanishes whenever
      \(|x|>\alpha+vt\). For any fixed positive time one can choose such an \(x\).
      If \(c=0\), the equation \(u_{tt}=0\) with zero initial velocity gives \(u=\phi\)
      and the same support conclusion with \(v=0\). Property P fails.

      '
    independent_rework_sha256: dc8c16c867533d3e0691579537ae2bedc0598d252b21db81f932591937577385
    comparison: The independently transformed Gaussian and multiplying heat kernel
      agree. Positive compactly supported heat data spread instantly, while the exact
      d’Alembert translates have finite support at each finite time.
