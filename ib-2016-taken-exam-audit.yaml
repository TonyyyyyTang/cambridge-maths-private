  IB/2016/P1/q13A:
    independent_rework: '# IB 2016, Paper 1, 13A


      (a) On the slit plane the principal square root has positive real part. Conversely,
      squaring any \(u+iv\) with \(u>0\) gives a point off the slit, and its principal
      square root is \(u+iv\). With \(x=u^2-v^2,\ y=2uv\), the condition of lying
      strictly to the left is

      \[

      1-x-y^2/4=(1-u^2)(1+v^2)>0.

      \]

      This is equivalent to \(0<u<1\) under the branch condition. The image is the
      entire open strip.


      (b) In \(0<x<\pi/2\), the variable \(q=e^{iz}=e^{-y}e^{ix}\) runs through the
      whole open first quadrant, exactly once. Set \(s=\tan(z/2)=-i(q-1)/(q+1)\).
      Then \(\Re s=2\Im q/|q+1|^2>0\) and \(|s|=|q-1|/|q+1|<1\). Conversely for \(\Re
      s>0,\, |s|<1\),

      \[

      q=\frac{1+is}{1-is}=\frac{1-|s|^2+2i\Re s}{|1-is|^2}

      \]

      lies in that quadrant. Squaring the open right half of the unit disc gives exactly
      the disc slit along \((-1,0]\), as follows by taking the principal square root
      of every point in the latter.


      (c) Multiplication by \(\pi/2\) carries the strip in (a) onto the strip in (b).
      Thus their composition is the stated map and attains the entire slit disc off
      the negative real axis of the source. The square of the tangent is even, so
      the expression is single-valued across the square-root cut, with agreement also
      at zero. At \(z=-r^2\), \(r\geq0\), its value is \(-\tanh^2(\pi r/4)\), whose
      range is exactly \((-1,0]\). This restores the omitted radius and proves surjectivity
      onto the open unit disc.

      '
    independent_rework_sha256: 6f97a540f89959c2f80b9ac6d0b2d86d439847617aba4f98b8b2b5eab2999ba4
    comparison: The square-root image is exactly the strip; the squaring after the
      half-disc map gives the slit disc. On the original cut the composed map fills
      exactly (−1,0], with a removable root ambiguity at zero.
