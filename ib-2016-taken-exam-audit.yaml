    sha256: 46120feb5a048506ae3dbf50485049c50d8ff8ca0324ed7f6d2b5d9a9131201c
    encoding: utf-8
    text: "(a) In SI, \\(\\nabla\\cdot\\mathbf E=\\rho/\\epsilon_0\\). Integration\
      \ and the divergence theorem give \\(\\oint_{\\partial V}\\mathbf E\\cdot d\\\
      mathbf a=Q_{\\rm enclosed}/\\epsilon_0\\), with outward element. \n(b) Cylindrical\
      \ symmetry, translation and reflection in z imply a radial field constant on\
      \ a coaxial cylinder of radius r. For length h the end caps have zero flux,\
      \ and \\(2\\pi rh E_r=\\mu h/\\epsilon_0\\). Thus \\(\\mathbf E=\\mu\\hat r/(2\\\
      pi\\epsilon_0r)\\) for r>0 and \\(\\phi=-(\\mu/(2\\pi\\epsilon_0))\\log(r/r_*)+C\\\
      ) since \\(\\mathbf E=-\\nabla\\phi\\).\n(c) The earthed metal has \\(\\phi=0\\\
      ) on and inside it and E=0 inside. Immediately outside, the tangential field\
      \ is zero, and the normal field obeys \\(\\mathbf E_{\\rm out}\\cdot\\mathbf\
      \ n=\\sigma/\\epsilon_0\\) with \\(\\mathbf n=-\\hat x\\) pointing from the\
      \ metal into free space.\n(d) Let \\(r_1=\\sqrt{x^2+y^2},\\ r_2=\\sqrt{(x-2d)^2+y^2}\\\
      ), with d>0. The pair has \\(\\phi=\\mu\\log(r_2/r_1)/(2\\pi\\epsilon_0)\\),\
      \ zero on x=d because \\(r_1=r_2\\). Its tangential derivatives vanish there;\
      \ its normal field determines the required surface charge. It has the given\
      \ singularity and decays at transverse infinity, so uniqueness gives the exterior\
      \ field.\n(e) Only the image field acts on the physical line itself. At x=y=0\
      \ it is \\(\\mu\\hat x/(4\\pi\\epsilon_0 d)\\), giving force per length \\(\\\
      mu^2\\hat x/(4\\pi\\epsilon_0d)\\), directed towards the conductor.\n(f) At\
      \ \\((d,y)\\) the y components of the two fields cancel, while \\(E_x=\\mu d/[\\\
      pi\\epsilon_0(d^2+y^2)]\\). Hence \\(\\sigma(y,z)=-\\mu d/[\\pi(d^2+y^2)]\\\
      ), independent of z. Its integral over y equals \\(-\\mu\\) per unit length.\n"
    reason: Preserves exact independent solver output before trimming one trailing
      space in the readable Markdown copy.
