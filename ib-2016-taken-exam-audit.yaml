  IB/2016/P2/q20H:
    independent_rework: '# IB 2016, Paper 2, 20H


      (a) From any state \(i\) of an open class choose a positive-probability finite
      path to a state outside the class, deleting loops so the path never revisits
      \(i\). After leaving along that path, a return to \(i\) would put the outside
      state in the same communicating class. Hence there is a positive chance never
      to return to \(i\), and \(i\) is transient. Conversely, starting in a finite
      closed class, the chain stays in that finite set forever. If each state were
      transient, each would be visited only finitely often almost surely (after the
      first hit, the successive return probabilities have geometric tails). A finite
      intersection of these probability-one events would make the total number of
      visits finite, a contradiction. A nearest-neighbour walk on the integers with
      independent steps \(+1\) with probability \(2/3\) and \(-1\) with probability
      \(1/3\) has one closed communicating class. By the strong law \(X_n/n\to1/3\)
      from every fixed start, so each site has finitely many visits almost surely,
      proving transience.


      (b)(i) From \(d\) the chain stays in \(\{b,d\}\). Write \(p_n=\mathbb P_d(X_n=b)\).
      Then \(p_0=0,\ p_{n+1}=\tfrac14p_n+\tfrac23(1-p_n)\). Subtract its fixed point
      \(8/17\) to get

      \[

      p_n=\frac8{17}\left(1-(-5/12)^n\right).

      \]


      (ii) Starting at \(a\), the first step hits \(c\) with probability \(1/3\),
      stays in \(a\) with probability \(1/3\) or enters \(d\) from which \(c\) is
      inaccessible. Thus \(h=1/3+h/3\), so the requested probability is \(1/2\).


      (iii) Starting at \(b\) the same recurrence as in (i) applies with \(p_0=1\),
      so both starts in the closed class converge to probabilities \(8/17,9/17\) on
      \(b,d\). From either \(a\) or \(c\), the conditional chance of entering the
      closed class on the next step is at least \(1/3\). Its hitting time \(\tau\)
      therefore satisfies \(\mathbb P(\tau>n)\le(2/3)^n\). Condition on \((\tau,X_\tau)\).
      For each finite value of \(\tau\) the subsequent distribution at time \(n\)
      tends to the same limit by the Markov property. Dominated convergence, together
      with the vanishing unabsorbed mass, gives the limit for every initial state.
      In the order \(a,b,c,d\), the four rows of \(\lim_n P^n\) all equal \((0,8/17,0,9/17)\).

      '
    independent_rework_sha256: 74d981490bd6e0f98d69228e57b83f05d2c131c0fee00a69304acd7495c39012
    comparison: The auditor independently derives the 8/17 limiting mass at b, decay
      factor −5/12, hitting probability 1/2, and a geometric upper bound on the chance
      of remaining outside the unique closed class.
