  IB/2016/P4/q7D:
    independent_rework: "# IB 2016, Paper 4, 7D\n\n(a) In charge-free, current-free\
      \ vacuum Gauss's laws give \\(\\nabla\\cdot E=\\nabla\\cdot B=0\\), and the\
      \ curl equations are \\(\\nabla\\times E=-\\partial_t B\\) and \\(\\nabla\\\
      times B=\\epsilon_0\\mu_0\\partial_t E\\). Taking the curl of Faraday's law\
      \ and using \\(\\nabla\\times(\\nabla\\times E)=\\nabla(\\nabla\\cdot E)-\\\
      nabla^2E\\) gives \\(\\epsilon_0\\mu_0 E_{tt}-\\nabla^2E=0\\). Thus \\(c=1/\\\
      sqrt{\\epsilon_0\\mu_0}\\).\n\n(b)(i) The wavevector is \\(k\\hat z\\) for the\
      \ phase convention shown. The electric polarisation is linear along \\(\\mathbf\
      \ e=(1,1,0)/\\sqrt2\\). For a nonzero-amplitude plane wave, substitution gives\
      \ \\(\\omega^2=c^2k^2\\), normally written \\(\\omega=c|k|\\) on choosing positive\
      \ frequency. Keeping signed \\(\\omega\\) and \\(k\\) accommodates either direction\
      \ of propagation.\n\n(ii) For \\(k\\omega\\ne0\\), Faraday's law gives the associated\
      \ travelling magnetic field\n\\[\nB=\\frac{k}{\\omega}\\hat z\\times E\n =\\\
      frac{kE_0}{\\omega\\sqrt2}(-1,1,0)\\cos(kz-\\omega t).\n\\]\nThis also obeys\
      \ Ampère's law by the dispersion relation. The specified electric field fixes\
      \ the time-dependent magnetic field up to a static divergence-free, curl-free\
      \ addition allowed by the vacuum equations.\n\n(iii) The instantaneous flux\
      \ of the wave is \\(E_0^2 k\\hat z\\cos^2(kz-\\omega t)/(\\mu_0\\omega)\\).\
      \ Over a full period the squared cosine averages to \\(1/2\\). A static magnetic\
      \ addition has zero contribution to the average because the electric field averages\
      \ to zero. Thus\n\\[\n\\langle S\\rangle=\\frac{E_0^2k}{2\\mu_0\\omega}\\hat\
      \ z.\n\\]\nIt gives transported electromagnetic energy per unit area per unit\
      \ time, in the direction of propagation, with intensity \\(E_0^2/(2\\mu_0 c)\\\
      ). The exceptional \\(k=\\omega=0\\) describes a constant electric field, with\
      \ no travelling-wave magnetic field or period to infer. A zero amplitude also\
      \ carries no specified wave.\n"
    independent_rework_sha256: cfc525e6c0bb5ae8ff5af0649b2174aca8dd80bdd10f1ab217783d837f50afd2
    comparison: The travelling magnetic field has the same signed k/ω factor, and
      averaging the flux gives E₀²k/(2μ₀ω). Both distinguish the uniform static case.
