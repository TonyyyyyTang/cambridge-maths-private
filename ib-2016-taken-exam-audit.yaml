  IB/2016/P1/q18D:
    independent_rework: '# IB 2016, Paper 1, 18D


      (a) For each sufficiently regular, well-posed initial value problem and fixed
      finite \(T>0\), convergence means \(\max_{0\le nh\le T}\|y_n-y(nh)\|\to0\) as
      \(h\to0\), for starting approximations whose errors tend to zero. The formal
      order is determined by the defect obtained by inserting the exact solution into
      the unscaled method. Order at least \(p\) means a defect \(O(h^{p+1})\) for
      all sufficiently smooth solutions (equivalently, defect divided by \(h\) is
      \(O(h^p)\)). Exact order \(p\) requires that the next order fails in general.
      With zero-stability and order-\(p\) starting approximations the global error
      is \(O(h^p)\).


      (b) Expand each exact \(y(t+lh)\) and \(y''(t+lh)\) about \(t\), substituting
      \(f(t,y(t))=y''(t)\). The unscaled defect through degree \(p\) is

      \[

      \Big(\sum_l\rho_l\Big)y(t)+

      \sum_{k=1}^p\frac{h^k}{k!}\Big(\sum_l l^k\rho_l-k\sum_l l^{k-1}\sigma_l\Big)y^{(k)}(t)+O(h^{p+1}).

      \]

      Thus the displayed moment identities suffice. Conversely, evaluating at \(t=0\)
      with the exact polynomial solutions \(y(t)=1,t,\ldots,t^p\) isolates each indicated
      coefficient. None can be nonzero if the order is at least \(p\).


      (c) For a regular linear multistep formula on a fixed interval, with a sufficiently
      regular right-hand side Lipschitz in \(y\) and convergent starting data, convergence
      for all such problems is equivalent to consistency (order at least 1) and zero-stability.
      The latter is equivalent to every root of \(\rho(\zeta)=\sum_l\rho_l\zeta^l\)
      having modulus at most one and every root on the unit circle being simple.


      (d) The four identities for \(k=0,1,2,3\) give

      \[

      a=-1-\theta,\quad \sigma_0+\sigma_1+\sigma_2=\theta+2,\quad

      \sigma_1+2\sigma_2=(\theta+4)/2,\quad

      \sigma_1+4\sigma_2=(\theta+8)/3.

      \]

      Subtracting and back-substituting gives

      \[

      \sigma_0=(5\theta+4)/12,\quad \sigma_1=2(\theta+2)/3,\quad

      \sigma_2=(4-\theta)/12.

      \]

      Consistency is automatic. The polynomial is \((\zeta-1)(\zeta+1+\theta)\), giving
      \(-2\le\theta\le0\) from the modulus condition. At \(\theta=-2\) the root 1
      is double. At \(\theta=0\) the roots \(1,-1\) are distinct. Hence convergence
      holds exactly for \(-2<\theta\le0\).

      '
    independent_rework_sha256: b136b482a75905a12e11d9eaea8627509996c16e4103a20da603024643541c4c
    comparison: The Taylor conditions give the same three multistep coefficients.
      The root condition excludes θ=−2 and includes the simple root −1 at θ=0.
