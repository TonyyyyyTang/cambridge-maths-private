  IB/2016/P2/q12G:
    independent_rework: '# IB 2016, Paper 2, 12G


      (a) A norm is a real nonnegative function \(N\) satisfying \(N(x)=0\) exactly
      for \(x=0\), \(N(cx)=|c|N(x)\) for real \(c\), and \(N(x+y)\le N(x)+N(y)\).


      (b) By homogeneity the supremum is the maximum of \(\|Ax\|\) on the unit sphere.
      It is finite because in finite dimension this sphere is compact and linear maps
      are continuous (equivalently, bound the finite coordinate matrix directly).
      The supremum is nonnegative and is zero precisely when every \(Ax\) vanishes.
      Absolute homogeneity follows pointwise from that of the vector norm. For a unit
      vector \(x\),

      \(\|(A+C)x\|\le\|Ax\|+\|Cx\|\le\|A\|+\|C\|\), and taking the supremum gives
      the triangle inequality. Since \(\|Ay\|\le\|A\|\|y\|\) also at \(y=0\), \(\|ABx\|\le\|A\|\|B\|\|x\|\)
      proves submultiplicativity.


      (c) The determinant of \(I-X\) is a polynomial in the entries, so \(U\) is the
      inverse image of the open set \(\mathbb R\setminus\{0\}\) under a continuous
      map. When \(\|X\|<1\), a vector with \(Xv=v\) satisfies \(\|v\|\le\|X\|\|v\|\),
      hence \(v=0\). Thus \(I-X\) is injective and, being square, invertible.


      (d) For \(r=\|X\|<1\) the tail after degree \(N\) is bounded in norm by \(r^{N+1}/(1-r)\).
      Completeness of \(M_n\) gives convergence in norm of the partial sums \(S_N\).
      By the geometric identity \((I-X)S_N=I-X^{N+1}\) and continuity of multiplication,
      their limit equals \(f(X)\).


      For \(X\in U\), write \(R=f(X)\). For \(\|RH\|<1\), factor \(I-X-H=(I-X)(I-RH)\).
      The geometric series shows

      \[

      f(X+H)=R+RHR+O_X(\|H\|^2).

      \]

      In particular \(Df(X)[H]=RHR\) in the Fréchet sense, hence \(Df(0)[H]=H\). To
      differentiate this derivative as a map into operators, use \(f(X)=I+X+O(\|X\|^2)\)
      near zero. Uniformly over \(H\) of norm at most one this gives

      \[

      Df(X)[H]=H+XH+HX+O(\|X\|^2\|H\|).

      \]

      Consequently \(D^2 f(0)[K,H]=KH+HK\), a continuous bilinear map. The uniform
      estimate justifies the second Fréchet derivative.

      '
    independent_rework_sha256: 9ef9f81dece437d483bae955b8770a9664b69323feb0d84afed6f0be5214d787
    comparison: The auditor independently factors I−X−H on the correct side and uses
      the Neumann series. Both obtain the symmetric second differential KH+HK from
      an operator-norm remainder.
