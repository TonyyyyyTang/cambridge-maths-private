  IB/2016/P4/q17B:
    independent_rework: "# IB 2016, Paper 4, 17B\n\n(a) For an interior pole \\(r_0\\\
      ), \\(G(\\cdot,r_0)\\) vanishes on the Dirichlet boundary and satisfies \\(\\\
      Delta_r G=\\delta_{r_0}\\) in the sense of distributions. Equivalently it is\
      \ harmonic away from the pole, with \\(G-(2\\pi)^{-1}\\log|r-r_0|\\) extending\
      \ harmonically across it. On an unbounded domain impose the appropriate condition\
      \ at infinity for the Dirichlet problem. Green's second identity with \\(f=\\\
      psi,\\ g=G\\) has left side \\(\\psi(r_0)\\) since \\(\\Delta\\psi=0\\). The\
      \ boundary term involving \\(G\\) vanishes, leaving \\(\\psi(r_0)=\\int_{\\\
      partial\\mathcal D}\\psi\\,\\partial_nG\\,dl\\), with the usual vanishing outer-boundary\
      \ contribution when the domain is unbounded.\n\n(b) Write \\((a,b)=(x_0,y_0)\\\
      ) with \\(a,b>0\\). Put \\(L_{s,t}(x,y)=(2\\pi)^{-1}\\log|(x,y)-(s,t)|\\). The\
      \ image sum\n\\[\nG=L_{a,b}-L_{a,-b}-L_{-a,b}+L_{-a,-b}\n\\]\nhas the prescribed\
      \ unit singularity, with its other poles outside the quadrant. The terms cancel\
      \ in pairs on either axis and the sum decays at infinity. For example, factoring\
      \ out the common distance at large radius cancels the constant log term, and\
      \ the first-order terms cancel by the two reflections.\n\nOn \\(y=0\\) the outward\
      \ derivative is \\(-\\partial_y\\), so\n\\[\n\\partial_nG(t,0)=\\frac b\\pi\\\
      left(\\frac1{(t-a)^2+b^2}-\\frac1{(t+a)^2+b^2}\\right)\n =\\frac{4abt}{\\pi[(t-a)^2+b^2][(t+a)^2+b^2]}.\n\
      \\]\nThe integral in (a) along this ray is precisely \\(F(a,b)\\). Swapping\
      \ the two coordinates gives \\(F(b,a)\\) on the other ray; their sum is the\
      \ required formula.\n\nThe boundary and infinity conditions can also be checked\
      \ directly. Put \\(u=a^2-b^2,\\ v=2ab\\). On the first ray change variables\
      \ to \\(s=t^2\\), on the second to \\(s=-t^2\\). The sum becomes\n\\[\n\\int_{\\\
      mathbb R} \\frac{v}{\\pi[(u-s)^2+v^2]}e^{-|s|}\\,ds.\n\\]\nThis is the upper\
      \ half-plane Poisson integral evaluated at \\((a+ib)^2=u+iv\\). Its kernel has\
      \ total mass one and its mass outside any fixed neighbourhood of \\(u\\) tends\
      \ to zero as \\(v\\downarrow0\\), so it takes the stated continuous boundary\
      \ values, including 1 at the origin. It is harmonic in the upper half-plane\
      \ and composition with the squaring map preserves harmonicity in the open quadrant.\
      \ At \\(|u+iv|\\to\\infty\\), the integral over \\(|s|>M\\) is at most \\(e^{-M}\\\
      ); on \\(|s|\\le M\\) the kernel is \\(O(1/|u+iv|)\\) once \\(|u+iv|>2M\\).\
      \ This proves decay. Uniqueness follows by the maximum principle on quarter\
      \ discs and passage to infinity.\n"
