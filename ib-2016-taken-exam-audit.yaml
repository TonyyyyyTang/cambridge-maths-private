  IB/2016/P3/q10F:
    independent_rework: "# IB 2016, Paper 3, 10F\n\n(i) Let \\(T=\\alpha,\\ A=(T+T^*)/2,\\\
      \ B=(T-T^*)/(2i)\\). Then \\(A,B\\) are self-adjoint and \\(T=A+iB\\). Conversely\
      \ any such decomposition into self-adjoint parts gives \\(T^*=A-iB\\), forcing\
      \ the same expressions for \\(A,B\\). Direct multiplication gives \\(TT^*-T^*T=-2i(AB-BA)\\\
      ), so normality and commutation of these parts are equivalent.\n\n(ii) The zero-dimensional\
      \ assertion is immediate. In positive dimension and over the complex field,\
      \ \\(T\\) has a unit eigenvector \\(v\\) of eigenvalue \\(\\lambda\\). If \\\
      (T\\) is normal, \\(N=T-\\lambda I\\) is normal, so \\(\\|Nw\\|^2=\\|N^*w\\\
      |^2\\) for every \\(w\\). In particular \\(T^*v=\\overline\\lambda v\\). It\
      \ follows by the adjoint identity that \\(v^\\perp\\) is invariant under both\
      \ \\(T\\) and \\(T^*\\), and their restrictions are adjoints and still commute.\
      \ Induction on dimension gives an orthonormal eigenbasis on \\(v^\\perp\\),\
      \ which \\(v\\) completes. Conversely in an orthonormal eigenbasis the matrices\
      \ of \\(T\\) and \\(T^*\\) are diagonal with conjugate corresponding entries\
      \ and commute.\n\n(iii) For a normal \\(T\\) take the basis just constructed.\
      \ With distinct eigenvalues \\(\\lambda_1,\\ldots,\\lambda_s\\), choose the\
      \ interpolation polynomial\n\\[\ng(z)=\\sum_{j=1}^s\\overline{\\lambda_j}\n\
      \       \\prod_{k\\ne j}\\frac{z-\\lambda_k}{\\lambda_j-\\lambda_k}.\n\\]\n\
      It maps each \\(\\lambda_j\\) to its conjugate, so \\(g(T)=T^*\\) on the basis,\
      \ hence on \\(V\\). In zero dimension any polynomial suffices. Conversely every\
      \ polynomial in \\(T\\) commutes with \\(T\\), so \\(T^*=g(T)\\) implies normality.\n"
    independent_rework_sha256: 5058027070d5760750a978414e40e5c7485f3f9b77168730584aed588b6fcb8e
    comparison: Both use Hermitian real and imaginary parts and simultaneous diagonalisation
      of the commuting parts of a normal operator. Interpolation on the distinct eigenvalues
      gives the adjoint as a polynomial.
