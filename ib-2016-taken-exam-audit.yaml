  IB/2016/P3/q12G:
    independent_rework: '# IB 2016, Paper 3, 12G


      (a) Uniform continuity means that for each \(\varepsilon>0\) a single \(\delta>0\)
      works for every \(x,y\in X\): \(d(x,y)<\delta\) implies \(|f(x)-f(y)|<\varepsilon\).
      Lipschitz continuity means there is a finite \(L\ge0\) such that \(|f(x)-f(y)|\le
      Ld(x,y)\) for every pair. Taking \(\delta=\varepsilon/(1+L)\) proves uniform
      continuity. For Cauchy \(x_n\), given \(\varepsilon\) take its uniform \(\delta\).
      All sufficiently late pairs have \(d(x_m,x_n)<\delta\), hence \((f(x_n))\) is
      Cauchy and converges by completeness of \(\mathbb R\).


      (b) If uniform continuity failed, some \(\varepsilon>0\) would admit pairs \(x_n,y_n\)
      with \(d(x_n,y_n)<1/n\) and \(|f(x_n)-f(y_n)|\ge\varepsilon\). A subsequence
      of \(x_n\) converges to \(x\in X\) by sequential compactness. The triangle inequality
      gives convergence of the matching \(y_n\) subsequence to the same \(x\). Continuity
      contradicts the displayed separation. On the compact interval \([0,1]\), \(f(x)=\sqrt{x}\)
      is continuous and its difference quotients with zero are \(1/\sqrt{x}\), unbounded
      as \(x\downarrow0\). Thus Lipschitz continuity need not hold.


      (c) For each \(x\in X\) choose \(y_n\in Y\cap B(x,1/n)\) by density. Any continuous
      extension must satisfy \(f(x)=\lim_n g(y_n)\) by continuity, proving uniqueness.
      If \(g\) is uniformly continuous, existence of this real limit follows from
      (a) applied to the Cauchy sequence \(y_n\). Interleaving two choices approaching
      the same \(x\) gives a third Cauchy sequence, so its image converges and both
      choices yield the same limit. On \(Y\) a constant sequence gives the extension
      property. Given \(\varepsilon>0\), choose \(\delta>0\) for the uniform continuity
      of \(g\) with tolerance \(\varepsilon/2\). For \(d(x,x'')<\delta/3\), the two
      approximating sequences have matched terms within \(\delta/3\) of their respective
      limits eventually, so those terms are within \(\delta\) of one another. Taking
      limits yields \(|f(x)-f(x'')|\le\varepsilon/2<\varepsilon\), establishing uniform
      continuity. The empty space case satisfies these assertions vacuously.

      '
    independent_rework_sha256: b190618739fd731a048b5635a51272f8e8355c364ba12c0b32d1c6cc90337610
    comparison: Uniform continuity gives images of Cauchy sequences convergent in
      the reals. Interleaving two approximating sequences proves independence of choice
      and yields the same unique extension.
