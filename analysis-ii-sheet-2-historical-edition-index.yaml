source_comparison: '# Analysis II Sheet 2 archive comparison


  All 25 academic years from 2002–03 through 2026–27 have an archived public original.
  Two different 2005–06 originals both print the same course title, term, author and
  sheet number. Each has a separate receipt and full transcription. Across 103 published
  PDFs in the two archive branches, 26 print Sheet 2. The other 77 print Sheet 1,
  3 or 4. The candidate ledger includes the observed heading for each.


  ## Sheet boundaries and routing


  - 2004–05 and both 2005–06 originals divide the material after Q12. The Additional
  Questions Q13–20 remain on Sheet 2.

  - 2015–16 and 2018–19 have 14 numbered exercises followed by an unnumbered proof
  of Lebesgue’s Riemann-integrability criterion. The exact versions differ from the
  2026–27 supplement. The 2025–26 unnumbered Weierstrass supplement is a different
  exercise. Only the verified modern anchor assigns these supplements canonical identifiers.

  - The six Michaelmas editions beginning in 2019–20 belonged to the combined Analysis
  and Topology course. They contribute 81 positions. In 2020–21 Q7, Q8 and Q10, and
  in 2021–22 Q8, Q9 and Q13, the subject is general topology, including co-countable
  spaces, the Hausdorff diagonal criterion and separability. The archive retains their
  original merged course and identifies their present subject in the position metadata.
  Mixed questions keep the full original wording.

  - The 2021–22 heading “Some more questions” starts immediately before Q13. The 2024–25
  headings “Exercises”, “Problems” and “OPTIONAL extra problems (not for marking)”
  begin at Q1, Q5 and Q12 respectively. The last section includes Q12 and Q13. In
  2024–25 the term is absent and “updated 27 September 2024” is printed.

  - Some Sheet 2 questions explicitly refer to another sheet. The index gives the
  source hash, physical page and verified target for 2016–17 Q12, 2017–18 Q12 and
  2024–25 Q13(d). These reference targets remain on Sheet 1.


  ## Family and variant evidence


  The concordance links each occurrence to a descriptive group or an existing modern
  ID. Occurrences with identical fragment checksums have identical bytes. Distinct
  fragment checksums can also reflect representation, including optional printed-label
  placement. The exact per-edition files and original page images retain numbering,
  rubrics, hypotheses, notation and local references.


  - Between 2002–03 and 2003–04, Q1 changes its four printed subpart labels from (ii)–(v)
  to (i)–(iv). Both Q11s spell scalar multiplication “mutliplication”.

  - Comparing the 2004–05 main sheet with the 2005–06 main sheet, positions 2, 3,
  8, 10, 11, 16 and 17 have different statement files. Between the two 2005–06 originals
  the sole changed mathematical statement occurs at Q18(ii). The primary original
  gives membership of the sequence x in the conclusion. Variant B gives membership
  of y, the sequence introduced in the hypothesis. Both sources were inspected independently.

  - The set algebra and extremal characterization of closure/interior in 2013–14 Q10
  are a variant of modern q08. The early statement works in Euclidean space and begins
  from the largest-open/smallest-closed definition. By comparison, the composite 2019–20
  Q6 also asks for distinct open/closed ball conclusions from q09. It retains its
  own descriptive family. The 2020–21 and 2021–22 composites add distance-to-a-set
  and separation, and likewise have a separate group.

  - The 2015–16 and 2018–19 opening “Quickies” ask different sets of questions about
  norms, vector integration and completeness. Those composites retain separate descriptive
  keys. Part of the 2019–20 distance exercise matches modern q01(a); the original
  also asks for disjoint open sets separating closed sets. None of these positions
  supplies the whole modern q01. No historical stand-alone equivalent to modern q09
  was found.

  - The 2024–25 Q12 shares the constructive Bernstein-polynomial argument with modern
  q17. Its statement asks first for higher-dimensional approximation, then reduces
  to the one-dimensional problem. Q13’s Arzelà–Ascoli argument is independent. The
  displayed double right arrow in Q2, Q10 and Q12, the printed [b,b] in Q10(b), the
  reversed subscripts in Q12(c) and the left-pointing implication in Q13 are retained
  in the exact fragments.

  - Other descriptive groups lack preassigned unit IDs. The position metadata records
  substantive partial overlaps to avoid treating related proof techniques as the same
  question. Examples include general ultrametric properties versus testing particular
  metrics (q03), and completeness of different sequence spaces (q11).'
source_rendering: All 57 original physical pages inspected. The 385 positions were
  typeset and checked independently against the original page images. The historical
  packet records its source PDF and page raster hashes.
