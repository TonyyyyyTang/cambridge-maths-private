      with $^*$. Unless stated otherwise, the norm on $\mathbb R^n$ may be taken to
      be the Euclidean norm $\|x\|_2=\sqrt{\sum_{i=1}^n x^2}$, and the spaces $\ell_0$
      and $\ell_\infty$ may be assumed to have the sup-norm $\|x\|_\infty=\sup_i|x_i|$.
      ($\ell_0$ denotes the space of real sequences $(x_n)_{n=1}^\infty$ such that
      all but finitely many $x_n$ are zero.) Comments, corrections are welcome at
      any time and may be sent to a.g.kovalev@dpmms.cam.ac.uk.
