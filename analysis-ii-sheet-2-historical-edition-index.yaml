retained_separate:
- families:
  - quickies-equivalent-norms
  - quickies-norms-2015
  decision: keep distinct
  basis: Two of four subparts agree. The remaining parts ask respectively about sequential
    norm equivalence and finite dimension, or equality in the vector integral and
    convergence from a Cauchy subsequence.
- families:
  - closure-interior-balls
  - distance-set-separation
  - closure-separation-balls
  decision: keep distinct
  basis: The first two exist as distinct consecutive questions in 2019–20. The later
    combined problem contains both kinds of arguments and retains the metric balls.
    Preserve three exact units and note the explicit component overlap.
- families:
  - q08
  - q09
  - seven-closure-interior-sets
  decision: keep distinct
  basis: The seven-set maximum and its sharp example are the distinguishing tasks.
    The modern open/closed ball and topology exercises involve different questions.
- families:
  - inequivalent-norms-finite-support
  - uncountably-many-inequivalent-norms
  decision: keep distinct
  basis: Domains are c00 and C[0,1], respectively. The former includes designated
    ℓ1 and uniform norms and a third norm.
- families:
  - q05
  - sine-curve-path-connectedness
  decision: keep distinct
  basis: Q05 uses the full vertical segment for the sine curve. The separate question
    adds only the origin and also asks about the damped sine curve.
- families:
  - finite-linear-maps-continuous
  - norm-from-linear-map
  - bounded-linear-map-norm
  decision: keep distinct
  basis: All three appear separately as consecutive 2006 exercises. Matrix continuity,
    constructing a new norm, and operator norm identities have distinct requested
    proofs.
- families:
  - operator-norm-geometric-series
  - bounded-operators-complete
  - banach-operators-neumann
  decision: keep distinct
  basis: The first two appear as separate 2004–06 questions. The 2016–17 exercise
    combines two conclusions, with general Banach endomorphisms in place of finite
    matrices.
- families:
  - q16
  - sequential-compact-implies-complete
  decision: keep distinct
  basis: The short statement concerns an arbitrary sequentially compact subset of
    a normed space. The modern statement assumes a property of every bounded sequence
    of the entire space and requires finite dimensionality.
- families:
  - complete-ck-and-operators
  - four-completeness-tests
  - q06
  decision: keep distinct
  basis: The 2024 treatment proves completeness of every Cᵏ and continuity of derivative/primitive
    operators. A four-space test tests only the first-derivative case and the uniform
    metric on C¹, alongside L1 and the 2-adic integers. Modern q06 asks about continuous/Riemann
    functions.
- families:
  - complete-ell-infty-and-ell-two
  - linfty-czero-riemann-complete
  - q11
  decision: keep distinct
  basis: Some questions share a completeness proof. Their full prompts require ℓ∞
    and ℓ², ℓ∞ and c0 with possible Riemann questions, or ℓ¹ alone with variants on
    p or the closed unit ball.
- families:
  - general-picard-iteration
  - iterated-contraction-functional-ode
  - weighted-picard
  decision: keep distinct
  basis: '2019–20 prints the first two separately with a cross-reference: ordinary
    Rⁿ initial-value problem versus the functional equation f′(t)=f(t²). The weighted
    exercise has a scalar IVP and constructs an exponentially weighted sup metric.'
- families:
  - q12
  - vector-addition-scalar-product-continuity
  decision: keep distinct
  basis: The historical pointwise “scalar product” here is scalar multiplication of
    a vector by a scalar-valued function, whereas q12 treats the inner product of
    two vector-valued functions.
- families:
  - ell-one-coordinate-boxes
  - hilbert-cube
  decision: keep distinct
  basis: Square-summable sequences with bounds 1/n and absolutely summable sequences
    with two competing 1/n² and 1/n bounds are distinct problems.
- families:
  - cauchy-subsequence
  - subsequences-and-cauchy-bounded
  - subsequence-algebra
  decision: keep distinct
  basis: All contain a fact about subsequences but require respectively a convergent
    subsequence of a Cauchy sequence, boundedness of a Cauchy sequence, or linear
    operations and eventually constant sequences.
- families:
  - q02
  - continuous-to-discrete
  decision: keep distinct
  basis: The historical real/discrete classification instantiates only part of modern
    q02(b); modern also asks about relative intervals and several set/sequence properties.
- families:
  - distance-set-separation
  - disjoint-set-distance
  decision: keep distinct
  basis: The former uses a point-to-set distance function to separate arbitrary closed
    sets by open neighborhoods. The latter tests when the infimum of distances of
    two closed Euclidean sets can vanish.
- families:
  - q01
  - different-norms-different-limits
  decision: keep distinct
  basis: The quickie asks to assign the limit of a prescribed distinct sequence by
    changing a metric. The separate problem constructs actual norms using polynomial
    restrictions and compares named spaces.
- families:
  - sequential-compactness-finite-covers
  - euclidean-heine-borel-cantor
  decision: keep distinct
  basis: General sequentially compact normed subsets and open-cover compactness differ
    from the Euclidean closed-and-bounded and uniform-continuity theorems.
