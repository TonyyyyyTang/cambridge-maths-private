source_quirks:
- 'q11, 2001-02 p1 Q5: printed exclusion m=kN misses actual extrema when m is an odd multiple of N. Correct exclusion m=2kN.'
- 'q11, 2014-15 and 2015-16 p1 Q5: enumeration says n=... where m indexes extrema. In 2014-15 part (ii) shifts from x to θ;
  2015-16 retains an extra closing parenthesis after the numerical peak.'
- 'q11, all early versions through 2022-23 except 2016-17: printed equality to the sine-integral limit is asymptotic, not
  true for finite N. The modern version explicitly uses an approximation sign. Historical open-interval boundary assignments
  differ from the modern half-open convention.'
- 'q09: solution justifiably interprets x^m as a monomial, m a nonnegative integer.'
