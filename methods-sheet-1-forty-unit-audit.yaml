frozen_blind_rework_sha256: efc448db947648802e4e6b579402c7708ec2af9d0d2322e9519ce0c24119ff60
frozen_blind_rework: |
  q09. Write u=(x²-1)^n. Its nth derivative has degree n with leading coefficient (2n)!/n!; the normalization gives l=(2n)!/(2^n(n!)²). At one the factor (x-1)^n forces all n derivatives onto that factor, yielding q(1)=1. Differentiate (x²-1)u'-2nxu=0 n+1 times; the terms give (x²-1)y''+2xy'-n(n+1)y=0, y=u^(n). A polynomial solution with this degree and value is unique (cancel leading terms and use the degree condition d(d+1)=n(n+1)); hence q=P. Integrating Rodrigues by parts n times against a polynomial kills boundary terms since u and its derivatives of orders <n vanish at both ends; x^m for integer 0<=m<n gives zero. Against P the integral is l/2^n times int (1-x²)^n dx = l/2^n * 2^(2n+1)(n!)²/(2n+1)! using t=(1+x)/2 and the beta integral, giving 2/(2n+1).
  qx26. In Plancherel convention the shift f(.+m) transforms to e^(imk)F(k) by translation for integrable test functions and L² density. Thus their Hermitian inner product (linear in first slot) is (2π)^-1 int |F|² exp[-i(n-m)k] dk. All integrals exist by Cauchy-Schwarz and Plancherel. The nonzero differences n-m traverse all nonzero integers, which proves both implications.
  q04. Integration against e^(-inθ) gives c_n=(-1)^n sinh π/[π(1-in)]. Reconstruct sum c_n exp(inθ) symmetrically. At the seam the sum is cosh π, average of the one-sided limits; elsewhere equals e^θ. Parseval gives sinh(2π)/(2π)=(sinh π/π)^2 [1+2 sum_{n>=1} 1/(1+n²)]. Equivalently at -π the paired ±n terms give cosh π=(sinh π/π)[1+2 sum 1/(1+n²)]; both give (π coth π-1)/2. Older real form a_n=2(-1)^n sinh π/[π(1+n²)], b_n=-n a_n.
  qx10. Period-two even quartic consists of arches from 0 at odd joins to 1 at midpoints. Mean 8/15. Four integrations by parts (f' endpoints zero, f'''(1)=24, integral of f'''' cos(nπx)=0) yield a_n=48(-1)^(n+1)/(nπ)^4. Values and derivatives through order two match and third derivative jumps. Absolute uniform approximation error O(N^-3) from coefficients O(n^-4). Odd extension of x² is x|x| on (-π,π), rising from -π² to π² with downward jumps at odd π; seam Fourier value 0. Even extension is parabolas x² on (-π,π) repeated, continuous with kinks at odd π; repeat periods out to ±6π. Integrating twice gives b_n=-2π(-1)^n/n +4[(-1)^n-1]/(π n³), while cosine series is π²/3 +4 sum (-1)^n cos(nx)/n². Differentiating cosine gives the Fourier series of 2x with zero seam midpoint. Formal derivative of sine series is a cosine series whose terms fail even to tend to zero (cos nx cannot tend to zero since cos 2nx=2cos²(nx)-1). Its regular derivative away from jumps is 2|x|; its distributional derivative includes -2π² times the comb at odd multiples of π, accounting for discrepancy, including the constant mode. Usual cosine series of 2|x| is π+4/π sum [(-1)^n-1]cos(nx)/n².
  qx11. Repeated parts drops all boundary terms by periodicity through order k-1. |n|^k |c_n| <= ||f^(k)||_1/(2π); likewise real coefficients, and actually little-o by Riemann-Lebesgue if desired. |sin x| is even and π-periodic; a0=4/π, odd a_n and all b_n zero, a_(2m)=-4/[π(4m²-1)] from product-to-sum on (0,π). Q1 quartic coefficient n^-4 with third derivative jump; its extension C². The even x² extension is continuous, piecewise smooth with derivative jumps, giving n^-2; odd x² extension jumps giving n^-1. Q2 periodic e^x jumps and b_n=O(1/n), a_n=O(n^-2). Decay agrees (continuous derivative theorem only a sufficient bound). Differentiating multiplies modes by n and needs convergence/regularity, e.g. summable differentiated coefficients; integrating divides by n and improves convergence (separate mean and integration constant), valid also by integrating L² convergent partial sums over bounded intervals. Smooth functions permit rapid truncation; jumps cause slow decay and Gibbs oscillations persistent near the jump (Q5), value is the midpoint at the jump under piecewise smoothness.
  qx08. For real f with L²-convergent expansion, orthogonality of finite trigonometric polynomials gives ||S_N||²/T=a0²/2+sum_{n<=N}(a_n²+b_n²) and convergence in norm gives the asserted identity. Square wave odd so b_n=2[1-(-1)^n]/(nπ). The cutoff 4.5π/T retains just odd n=1,3. Output 4/π(sin(πt/T)+sin(3πt/T)/3). Input mean square one, transmitted mean square 8/π² (1+1/9)=80/(9π²).
  q06. Energy identity λ int |y|²=int |y'|² rules out negative eigenvalues and shows zero mode constant. For positive λ use derivative at 0 to remove sine, at L requires sqrt(λ)L=nπ. Eigenfunctions 1, cos(nπx/L) form complete basis by regular self-adjoint Sturm-Liouville theorem (p=w=1, q=0, separated homogeneous Neumann BC). Orthogonality gives mean coefficient (1/L)int f and a_n=(2/L)int f(x)cos(nπx/L)dx. Two integrations by parts, f' endpoint zero, give a_n=-(2/L)(L/(nπ))² int f'' cos; absolute uniform convergence. Completeness identifies the uniform sum with f in L², hence everywhere by continuity.
  q11. Sketch the periodic 0/1 steps, with high level 0 to π, low level π to 2π; mark endpoints as specified in each edition. Mean 1/2; cosine coefficients zero, b_n=(1-(-1)^n)/(πn). At a jump all partial sums equal 1/2. Differentiate first N odd harmonics then 2sin x cos((2j-1)x)=sin(2jx)-sin((2j-2)x) telescopes to S'_N=sin(2Nx)/(π sin x); integrate from 0. At integer π derivative is nonzero by continuous extension 2N(-1)^k/π; at other zeros mπ/(2N) the sign changes; exclude precisely m multiple of 2N. Earliest high peak π/(2N). Set u=2Nt; continuous sinc at zero and uniform convergence of t/sin t near 0 (as interval shrinks) give limit 1/2+Si(π)/π ≈1.08949. Split integral at π/2 and reflect the second half using 1/u+1/(π-u)=π/[u(π-u)]. Using sin u>=u-u³/6 on half gives bound 1/2+(1-π²/6)log 2+5π²/48 >1.08. Error stays at about 8.95% of jump near discontinuities, oscillatory region shrinks, convergence not uniform; midpoint limit and one-sided values distinguished. 2001-02 exclusion of all multiples of N is wrong; m=N must be retained. 2014-15 and 2015-16 index list should read m=..., not n=...; historical displayed equality to limiting integral is asymptotic only. 2014-15 switches x,θ but same variable.
