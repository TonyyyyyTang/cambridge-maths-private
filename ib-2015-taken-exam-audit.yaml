  IB/2015/P3/q4B:
    independent_rework: "# Independent rework — IB/2015/P3/q4B\n\nUse $\\widehat f(k)=\\\
      int_{\\mathbb R}f(x)e^{-ikx}\\,dx$. For $k>0$ close the real segment in the\
      \ lower half-plane, clockwise. There $|e^{-ikz}|\\le1$ and on $|z|=R>1$ the\
      \ arc integral has magnitude at most $\\pi R/(R^2-1)\\to0$. The only enclosed\
      \ pole is $-i$ with residue $e^{-k}/(-2i)$, giving $\\widehat f(k)=\\pi e^{-k}$.\
      \ For $k<0$ close in the upper half-plane, counterclockwise, giving the same\
      \ bound and residue $e^{k}/(2i)$ at $i$. At $k=0$ the real integral is $[\\\
      arctan x]_{-\\infty}^{\\infty}=\\pi$. Together $\\widehat f(k)=\\pi e^{-|k|}$.\n\
      \nSince $f\\to0$ at both ends and $f,f'\\in L^1$, integration by parts gives\
      \ $\\widehat {f'}(k)=ik\\pi e^{-|k|}$. The requested integral is $\\|f'\\|_2^2$,\
      \ and $f'=-2x/(1+x^2)^2$ is square integrable. Parseval with this normalisation\
      \ gives\n$$\n I=\\frac{1}{2\\pi}\\int_{\\mathbb R}\\pi^2 k^2e^{-2|k|}\\,dk\n\
      \ =\\pi\\int_0^\\infty k^2e^{-2k}\\,dk=\\frac{\\pi}{4},\n$$\nwhere two integrations\
      \ by parts give the last integral as $2!/2^3$.\n"
    independent_rework_sha256: f9dfec6e33c886cb3aa223ac7fbaf83d07ad90840dcea4807cd10302c1698095
    comparison: Oppositely oriented contours for the two Fourier half-lines give the
      same transformed Cauchy kernel. The derivative multiplier and Parseval normalization
      reproduce pi/4.
