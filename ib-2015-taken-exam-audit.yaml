  IB/2015/P3/q9H:
    independent_rework: '# Independent rework — IB/2015/P3/q9H


      Write $i\to j$ when $P^r_{ij}>0$ for some $r\ge0$. A communicating class is
      an equivalence class for $i\to j$ and $j\to i$. It is closed when no one-step
      transition from a member leaves the class, which also rules out leaving after
      any number of steps.


      States 1 and 3 reach one another and have no transitions out of $\{1,3\}$, so
      this class is closed. State 2 can move to 4, from which it cannot return. State
      4 can move to 1, from which it cannot return. Thus $\{2\}$ and $\{4\}$ are the
      other classes, both nonclosed.


      Starting in 2, a first departure at step $n$ requires $n-1$ successive self-loops
      and then a transition to 4, each with probability $1/2$ given the preceding
      state. Hence $P(N=n)=2^{-n}$ for $n\ge1$ and $E N=\sum_{j\ge0}P(N>j)=\sum_{j\ge0}2^{-j}=2$.
      From 4 the same geometric waiting mechanism holds before the transition to 1.
      Each waiting time is finite almost surely and the second is independent of the
      first by the Markov property on arrival. From 1 the chain stays forever in $\{1,3\}$.
      At every subsequent step it selects 1 or 3 with probability $1/2$ each independently
      of previous choices, since the two transition rows are identical.

      '
    independent_rework_sha256: b8362a73ba5705c93df9c683bcca66cfacc77aa33e54be808422e606924422b1
    comparison: Both find one closed pair and two transient singletons. The two successive
      independent geometric holding times have mean two; the equal transition rows
      give independent fair choices in the closed pair.
