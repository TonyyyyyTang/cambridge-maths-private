  IB/2015/P4/q8D:
    independent_rework: '# Independent rework — IB/2015/P4/q8D


      For distinct nodes the Lagrange expression is

      $$

      p_n(x)=\sum_{j=0}^n f(x_j)\prod_{\substack{0\le i\le n\\ i\ne j}}\frac{x-x_i}{x_j-x_i}.

      $$

      Each cardinal polynomial is one at its node and zero at the others. Interpolation
      is unique among polynomials of degree at most $n$, by the root count for their
      difference. The actual degree can be smaller for special data.


      Define $f[x_i]=f(x_i)$ and recursively

      $$

      f[x_i,\ldots,x_j]=\frac{f[x_{i+1},\ldots,x_j]-f[x_i,\ldots,x_{j-1}]}{x_j-x_i}\quad
      (j>i).

      $$

      Let $P_{ij}$ interpolate nodes $i$ through $j$, in degree at most $j-i$. Uniqueness
      gives

      $$

      P_{ij}(x)=\frac{(x-x_i)P_{i+1,j}(x)-(x-x_j)P_{i,j-1}(x)}{x_j-x_i}.

      $$

      Indeed the right side is of the required degree and gives the prescribed value
      at both endpoints and each intervening node. Reading its coefficient of $x^{j-i}$
      gives exactly the recursion defining the divided difference, with the constant
      single-node case as base. Therefore that coefficient of $P_{ij}$ is $f[x_i,\ldots,x_j]$,
      even when it vanishes.


      For each $k\ge1$, $P_{0k}-P_{0,k-1}$ vanishes at $x_0,\ldots,x_{k-1}$ and has
      degree at most $k$. Its leading-order coefficient (coefficient of $x^k$) is
      $f[x_0,\ldots,x_k]$. The difference is therefore this number times $\prod_{i=0}^{k-1}(x-x_i)$.
      Summing the differences and using $P_{00}=f(x_0)$ gives the Newton expression.


      When a node is appended, previous Newton coefficients and basis factors are
      unchanged. Only the new divided differences on the added diagonal or column
      of the table and one new term are needed, requiring $O(n)$ further operations
      if the table is retained. Nested multiplication evaluates the precomputed Newton
      form in $O(n)$ operations per point, compared with $O(n^2)$ when all Lagrange
      cardinal products are formed directly. Barycentric Lagrange evaluation can also
      achieve linear time per point after preprocessing.

      '
    independent_rework_sha256: c23c9df25d74623eefce4dc939ad177e5d0ee4884046a1fa99618487b5b2dda2
    comparison: Nodal uniqueness gives the interval interpolation recurrence and hence
      its top coefficient. The resulting Newton increments and evaluation costs agree,
      including degree drops and barycentric evaluation.
