  IB/2015/P4/q18B:
    independent_rework: '# Independent rework — IB/2015/P4/q18B


      (i) Along each streamline of the stated steady inviscid flow, Euler''s equation
      dotted with the velocity gives $\mathbf u\cdot\nabla(p+\rho |\mathbf u|^2/2)=0$.
      The incoming free jet has speed $U$ and ambient pressure $p_a$. The far, thin
      free sheet also discharges at $p_a$, so each incoming streamline has the same
      Bernoulli constant and emerges with speed $U$. This uses the free-jet/sheet
      model with uniform ambient pressure, negligible pressure variation across the
      thin sheet and no surface-tension pressure jump.


      (ii) Use the inclination $\alpha$ between the outward generator and the jet
      axis, as fixed by the printed $\sin\alpha$ formula. At large slant distance
      $r$ the perpendicular distance to the axis is $r\sin\alpha$ to leading order
      in $R/r$. A cut normal to the flow has area $2\pi r\sin\alpha\,d(r)$ to leading
      thin-sheet order. Equating inlet and outlet volume flux gives $AU=U\,2\pi r\sin\alpha\,d(r)$,
      hence $d(r)=A/(2\pi r\sin\alpha)$. For a nondegenerate sheet $\sin\alpha>0$.
      If the phrase “vertex angle” is used for the *full* opening angle, the inclination
      is half of that angle and it is the inclination that belongs in these expressions.


      (iii) The component equations give $\rho u_j\partial_j u_i=-\partial_i p$ and
      $\partial_j u_j=0$. With constant density they imply $\partial_j(\rho u_i u_j+p\delta_{ij})=0$.
      The divergence theorem on a fluid control volume with outward normal $\mathbf
      n$ gives $\int_S(\rho u_i u_j n_j+pn_i)\,dS=0$. A surface running along an impermeable
      solid is taken on the fluid side.


      (iv) Take the inlet direction as $\mathbf e_z$. Use a control volume bounded
      by an inlet section, a far conical sheet cut, stream/free surfaces and the wetted
      sphere. Work in gauge pressure $p-p_a$, permissible because a uniform pressure
      integrates to zero on a closed surface. The inlet and outlet cuts are at ambient
      pressure, and there is no mass flow through the free sides or solid. The incoming
      axial momentum flux in the outward-flux convention is $-\rho AU^2$; the outgoing
      flux is $\rho AU^2\cos\alpha$, as the transverse vectors cancel by axisymmetry.
      Thus the remaining pressure integral on the solid boundary (normal out of the
      fluid and into the solid) equals $\rho AU^2(1-\cos\alpha)\mathbf e_z$. This
      is the fluid force on the sphere relative to ambient pressure, and the dry part
      is at ambient pressure. The net force therefore points downstream, with magnitude
      $\rho AU^2(1-\cos\alpha)$. As checks, a radial sheet gives the whole incident
      axial momentum flux and zero deflection gives zero force in the limiting model.

      '
