  IB/2015/P4/q7A:
    independent_rework: '# Independent rework — IB/2015/P4/q7A


      For magnetostatics Maxwell''s equations give $\nabla\times\mathbf B=\mu_0\mathbf
      J$ and $\nabla\cdot\mathbf B=0$. In all of space introduce $\mathbf B=\nabla\times\mathbf
      A$ and take the allowed Coulomb gauge $\nabla\cdot\mathbf A=0$. Using the double-curl
      identity then gives $-\nabla^2\mathbf A=\mu_0\mathbf J$ componentwise. With
      free-space decay for the field produced by this source, the Green function for
      $-\nabla^2$ is $1/(4\pi|\mathbf r-\mathbf r''|)$, as the kernel is harmonic
      off its pole and the outward flux across a sphere centred there is one for $-\nabla(1/(4\pi
      R))$. Hence

      $$

      \mathbf A(\mathbf r)=\frac{\mu_0}{4\pi}\int_V\frac{\mathbf J(\mathbf r'')}{|\mathbf
      r-\mathbf r''|}\,d^3\mathbf r''.

      $$

      Taking the curl in the unprimed variables differentiates only the scalar kernel.
      Its gradient is $-(\mathbf r-\mathbf r'')/|\mathbf r-\mathbf r''|^3$; interchanging
      the order of the cross product removes the minus sign. Thus

      $$

      \mathbf B(\mathbf r)=\frac{\mu_0}{4\pi}\int_V\frac{\mathbf J(\mathbf r'')\times(\mathbf
      r-\mathbf r'')}{|\mathbf r-\mathbf r''|^3}\,d^3\mathbf r''.

      $$

      For bounded regular currents the kernel in the last integral is locally integrable,
      as its size is $O(R^{-2})$ in three dimensions. Free-space decay selects the
      source field in the absence of any added background solution.

      '
    independent_rework_sha256: 255ced30152effee5c406156450a6ef67156af20bf958ab58bb16e960e18613b
    comparison: The source Poisson kernel has the same sign and normalization. Field-point
      differentiation produces the cross product in the correct order. The rework
      checks decay and local integrability.
