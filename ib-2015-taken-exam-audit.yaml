  IB/2015/P4/q5C:
    independent_rework: '# Independent rework — IB/2015/P4/q5C


      (a) Take the transform convention $\tilde f(k)=\int f(x)e^{-ikx}\,dx$. Given
      $h$, put $g(x)=\overline{h(-x)}$, so substitution $v=-x$ gives $\tilde g(k)=\overline{\tilde
      h(k)}$. The supplied identity at $x=0$ then gives

      $$

      \int f(u)\overline{h(u)}\,du=\frac1{2\pi}\int\tilde f(k)\overline{\tilde h(k)}\,dk.

      $$

      In particular $h=f$ yields Parseval''s norm identity. The argument applies,
      for instance, to Schwartz functions; density and the resulting scaled isometry
      extend it to $L^2$ with transforms in the $L^2$ sense.


      (b) Expand the cosine into its two exponentials and integrate over $[-a,a]$,
      obtaining

      $$

      \tilde f(k)=\frac{\sin((k-1)a)}{k-1}+\frac{\sin((k+1)a)}{k+1}.

      $$

      Both $k=1$ and $k=-1$ give $a+\tfrac12\sin(2a)$ by continuity. Combining terms
      at other $k$ yields

      $$

      \tilde f(k)=\frac{2k\cos a\,\sin(ka)-2\sin a\,\cos(ka)}{k^2-1}.

      $$

      If $\cos a\ne0$, the oscillatory leading term is $2\cos a\,\sin(ka)/k+O(k^{-2})$.
      Its order $1/|k|$ is attained along frequencies with $|\sin(ka)|=1$. The zero
      extension jumps at each endpoint. If $a=\pi/2+j\pi$ for $j=0,1,\ldots$, these
      jumps vanish. The transform is $-2\sin a\,\cos(ka)/k^2+O(k^{-4})$, and attains
      order $|k|^{-2}$ along $|\cos(ka)|=1$. Here the extension is continuous but
      its first derivative has nonzero jumps at the endpoints. The extra inverse power
      follows from cancellation of the endpoint terms at the first integration by
      parts.

      '
    independent_rework_sha256: e6f80ff44666cf3cf346fe7b985f988435d14bd02bc7860733ff460ef4a16847
    comparison: The conjugate-reflected convolution gives the same Parseval identity.
      The two sinc terms have identical removable values and the high-frequency envelope
      loses an additional power precisely when the endpoint jump vanishes.
