  IB/2015/P1/q19H:
    independent_rework: '# Independent rework — IB/2015/P1/q19H


      $S(X)$ is sufficient if, for each attainable $s$, the conditional distribution
      of the full sample given $S=s$ has a version independent of $\theta$. In the
      discrete model the factorisation criterion is that the joint mass has the form
      $g_\theta(S(x))h(x)$, with nonnegative factors and $h$ independent of $\theta$.


      For an unbiased estimator $D$ of $\tau(\theta)$ with finite second moment and
      sufficient $S$, Rao–Blackwell gives an unbiased estimator $D^*=E_\theta[D\mid
      S]$ with variance no larger. Sufficiency allows its conditional mean to be computed
      by the same function of $S$ for all parameters. The tower property gives $E_\theta
      D^*=E_\theta D=\tau(\theta)$. Conditional centring makes $D-D^*$ orthogonal
      to each square-integrable function of $S$, so

      $$

      \operatorname{Var}_\theta D=\operatorname{Var}_\theta D^*+E_\theta[(D-D^*)^2].

      $$

      Equality holds precisely when $D=D^*$ almost surely under that parameter. More
      generally, the same conditioning preserves the mean without unbiasedness and
      Jensen''s inequality gives no larger expected convex loss whenever the risks
      exist.


      Each $X_i$ has the law of the sum of $m$ independent Bernoulli trials, hence
      mean $m\theta$ and variance $m\theta(1-\theta)$. Thus $X_1/m$ is unbiased. The
      joint mass equals $\bigl[\prod_i {m\choose x_i}\bigr]\theta^T(1-\theta)^{nm-T}$
      on the common sample space, proving sufficiency of the sum. Conditional on $T=t$,
      permuting the observations leaves their joint distribution invariant, because
      both the unconditional joint mass and the conditioning event have that symmetry.
      Their conditional expectations are equal and add to $t$, hence each equals $t/n$.
      This argument also applies on attainable events at $\theta=0,1$. Consequently
      $\hat\theta=T/(nm)$. Independence gives $\operatorname{Var}\hat\theta=\theta(1-\theta)/(nm)$,
      compared with $\theta(1-\theta)/m$ for the original estimator. The improvement
      is strict for $n>1$ and $0<\theta<1$.


      Reversing the conditioning yields $E_\theta[T\mid X_1]=X_1+(n-1)m\theta$. For
      $n>1$ this depends on the unknown parameter and cannot be evaluated from the
      observations. Indeed $X_1$ is insufficient because other observations given
      $X_1$ still have the original parameter-dependent law. Even $T$ itself estimates
      $nm\theta$ in expectation. For $n=1$ the reverse conditioning merely returns
      $X_1$, which can be divided by $m$ to recover the initial estimator.

      '
    independent_rework_sha256: 99eb82fe2071656ce6635d5b5ddd6ce14a4319967d2dd0ac8f6cb5c2cda1295d
    comparison: The independent conditional variance decomposition and exchangeability
      proof give T/(nm) with the same variance, including endpoint equality. Reversing
      the conditioning introduces the unknown parameter for n>1.
