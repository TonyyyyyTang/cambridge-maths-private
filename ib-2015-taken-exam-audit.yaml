  IB/2015/P2/q10E:
    independent_rework: "# Independent rework — IB/2015/P2/q10E\n\n(i) $(A+I)v=0$\
      \ implies $Av=-v$. The excluded eigenvalue makes the kernel zero and the square\
      \ matrix invertible. Since $A(A+I)=(A+I)A$, multiplying by $(A+I)^{-1}$ on both\
      \ sides of that identity, on the left and the right, gives the commutation with\
      \ the inverse.\n\n(ii) For real $v$, transposing the scalar $v^TAv$ gives $v^TAv=-v^TAv$,\
      \ so it is zero. If $Av=-v$, this forces $\\|v\\|^2=0$. A complex eigenvector\
      \ for the real eigenvalue $-1$ would have a nonzero real or imaginary part in\
      \ the same real kernel. Hence $-1$ is excluded.\n\n(iii) Write $B=I+A$ and $C=I-A=B^T$.\
      \ Both are invertible and commute as polynomials in $A$. Thus $U=CB^{-1}$ has\
      \ $U^T=C^{-1}B$ and $U^TU=I$. Also $\\det C=\\det B$ by transposition, so $\\\
      det U=1$.\n\n(iv) With $U^TU=I$ and $-1$ excluded, put $A=(I-U)(I+U)^{-1}$.\
      \ It is real, and\n$$\n A^T=(I+U^{-1})^{-1}(I-U^{-1})\n =(I+U)^{-1}(U-I)=-A.\n\
      $$\nHere $I+U^{-1}=U^{-1}(I+U)$ and all factors rational in $U$ commute. Direct\
      \ substitution gives $I+A=2(I+U)^{-1}$ and $I-A=2U(I+U)^{-1}$, hence $(I-A)(I+A)^{-1}=U$.\
      \ This uses only orthogonality and the eigenvalue exclusion for the converse.\n"
    independent_rework_sha256: bafe197f36f8fd1131f78c4e3da6bfbe73553f8c6b41d48a986b5f6e4191f08b
    comparison: The Cayley transform has orthogonal columns and determinant one, including
      for non-invertible skew input. Applying the inverse rational transform to an
      orthogonal matrix without eigenvalue -1 returns a real skew matrix.
