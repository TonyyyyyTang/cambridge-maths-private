    independent_rework: "# Independent rework — IB/2015/P4/q17C\n\nFor a sufficiently\
      \ smooth velocity field solve $X_s=\\alpha(X,Y)$, $Y_s=\\beta(X,Y)$, with $(X,Y)(0,\\\
      sigma)=(x_0(\\sigma),y_0(\\sigma))$. The chain rule gives $d[u(X,Y)]/ds=0$,\
      \ so set $u(X(s,\\sigma),Y(s,\\sigma))=h(\\sigma)$. For a regular noncharacteristic\
      \ initial curve the determinant $\\alpha y'_0-\\beta x'_0$ is nonzero initially.\
      \ The inverse function theorem makes $(s,\\sigma)$ local coordinates, defining\
      \ a single-valued solution; differentiating it along the flow verifies the PDE.\
      \ Data on a characteristic would need to be compatible with constancy and in\
      \ general do not determine neighbouring values.\n\n(i) Label a ray by $\\xi=x(0)$.\
      \ Choose $dt/ds=1$, $dx/dt=u$. Then $du/dt=u_t+uu_x=0$, hence $u=F(\\xi)=e^{-\\\
      xi^2}$ on $x=X(\\xi,t)=\\xi+tF(\\xi)$. The straight rays have $dt/dx=e^{\\xi^2}$,\
      \ steep in the tails and with smallest slope 1 at zero. Rays on the left spread\
      \ apart, while faster rays near zero catch those starting to their right.\n\n\
      (ii) The Jacobian is $J=X_\\xi=1-2t\\xi e^{-\\xi^2}$. For $t>0$ its minimum\
      \ occurs at $\\xi_*=1/\\sqrt2$ because $2\\xi e^{-\\xi^2}$ has derivative $2(1-2\\\
      xi^2)e^{-\\xi^2}$ and a global maximum $\\sqrt{2/e}$ there. Thus $\\min J=1-t\\\
      sqrt{2/e}$. For $0\\le t<t_*=\\sqrt{e/2}$ the map is strictly increasing. At\
      \ $t=t_*$ its derivative first has an isolated zero, although the map remains\
      \ strictly increasing. For $t>t_*$ there are two positive roots of $J=0$ straddling\
      \ $\\xi_*$; $J$ is negative between them and positive outside, giving first\
      \ a local maximum then a local minimum of $X$.\n\nThe printed sentence names\
      \ $\\partial\\tilde x/\\partial\\tilde x_0$ as the function becoming non-monotonic.\
      \ In fact $J_\\xi=2te^{-\\xi^2}(2\\xi^2-1)$ already changes sign for every $t>0$.\
      \ The threshold characterises a change in monotonicity of $X$ itself, as the\
      \ sentence's own description of extrema specifies.\n\nThe solution snapshots\
      \ are the parametric graphs $(x,u)=(\\xi+tF(\\xi),F(\\xi))$. The peak of height\
      \ one moves to $x=t$. The rear slope flattens and the leading slope steepens\
