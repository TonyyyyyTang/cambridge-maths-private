  IB/2015/P1/q11G:
    independent_rework: '# Independent rework — IB/2015/P1/q11G


      Uniform convergence to $f$ means that for each $\epsilon>0$ there is a single
      $N$ such that $|f_n(x)-f(x)|<\epsilon$ for every $n\ge N$ and every $x\in[0,1]$.


      For $x=0$ the first family is zero. At each fixed $x>0$ the logarithm of the
      positive expression is $p\log n+\log x-xn^q\to-\infty$. Thus all $p,q>0$ give
      pointwise limit zero. The derivative in $x$ has the sign of $1-n^q x$, so the
      supremum over the interval is attained at $x=n^{-q}$ and equals $n^{p-q}/e$.
      By the definition above, convergence is uniform exactly for $p<q$. Equality
      gives a constant error and $p>q$ makes its maximum diverge.


      The second family converges to 1 at zero and zero elsewhere. Choosing $x_n=n^{-1/2}>0$
      gives error $e^{-1}$ for every $n$. It fails the uniform criterion.


      Finally the pointwise limit of $x^nf(x)$ is zero for $x<1$ and $f(1)$ at 1.
      If $f(1)\ne0$, take $x_n=e^{-1/n}<1$. Its error is $e^{-1}|f(x_n)|\to e^{-1}|f(1)|>0$
      by continuity. If $f(1)=0$, continuity gives $a\in(0,1)$ such that $|f(x)|<\epsilon/2$
      on $[a,1]$. The continuous function is bounded on the compact interval, say
      by $M$. On $[0,a]$ the error is at most $Ma^n<\epsilon/2$ for all large $n$,
      and on $[a,1]$ it is already $<\epsilon/2$. This proves uniform convergence
      directly.

      '
    independent_rework_sha256: 0c27e251b160c8f179773b73cd9fe49dc9f30820577b326a9900d66de2ed525b
    comparison: The exact supremum is n^(p-q)/e. The moving-point Gaussian counterexample
      and the split-interval proof for x^n f(x) agree, including the endpoint necessity.
