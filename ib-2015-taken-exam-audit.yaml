  IB/2015/P3/q12G:
    independent_rework: '# Independent rework — IB/2015/P3/q12G


      Fréchet differentiability at $x$ means that there is a linear map $A:\mathbb
      R^n\to\mathbb R^m$ with $f(x+h)=f(x)+Ah+r(h)$, where $r(0)=0$ and $\|r(h)\|/\|h\|\to0$.
      The map $A=Df(x)$ is unique, since the difference between two candidates, applied
      to $tv$ and divided by $t$, must tend to zero.


      If $f$ is differentiable at $x$ and $g$ at $y=f(x)$ with $B=Dg(y)$, then $g\circ
      f$ is differentiable at $x$ with derivative $BA$. To prove this, set $k=Ah+r(h)$,
      which tends to zero and is $O(\|h\|)$ by boundedness of linear maps in finite
      dimensions. Write $g(y+k)=g(y)+Bk+s(k)$ with $s(0)=0$ and $s(k)=o(\|k\|)$. The
      composite remainder is $Br(h)+s(k)$. The first term is $o(\|h\|)$; for each
      $\epsilon>0$ the second has norm at most $\epsilon\|k\|$ for all sufficiently
      small $h$, including $k=0$. This makes it $o(\|h\|)$ too.


      The affine map $x\mapsto(x,c-x)$ has derivative the vector $(1,-1)$. Its composite
      with $f$ therefore has derivative $D_1f(x,c-x)-D_2f(x,c-x)$. Under the stated
      equality this vanishes for each $x$ and every fixed $c$. The one-dimensional
      mean value theorem makes the restriction constant on that entire line. Set $h(c)=f(0,c)$,
      differentiable as a composite with an affine map. Taking $c=x+y$ gives $f(x,y)=f(0,x+y)=h(x+y)$.

      '
    independent_rework_sha256: 387b40ce5f7b94665865419d68d49668382cade103c286adf87fde39d9875f31
    comparison: Both control the intermediate increment by O(norm h), including zero
      increments. On each line of constant x+y the derivative vanishes. Either intercept
      therefore gives the same differentiable single-variable function.
