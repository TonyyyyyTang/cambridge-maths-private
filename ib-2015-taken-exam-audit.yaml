  IB/2015/P1/q1E:
    independent_rework: '# Independent rework — IB/2015/P1/q1E


      The containment $\alpha(W)\subseteq\alpha(U)$ gives the upper bound. By rank–nullity
      and $\ker(\alpha|_W)=W\cap\ker\alpha$,

      $$

      r(\alpha|_W)=\dim W-\dim(W\cap\ker\alpha)

      \ge \dim W-\dim\ker\alpha

      =r(\alpha)-\dim U+\dim W.

      $$

      Both behaviours already occur for the first-coordinate projection $\alpha:\mathbb
      R^2\to\mathbb R$. Take $W$ equal to the horizontal axis. The inequalities are
      $1=1>0$. Take $W$ equal to the vertical axis. They become $1>0=0$.

      '
    independent_rework_sha256: 7aa73c616a6d0251a23ddd9d50f210c007fb047383effe774444fcb1a845c190
    comparison: Computing the kernel of the restriction gives the same sharp lower
      bound as basis extension. The two coordinate axes for the first-coordinate projection
      distinguish the two possible strict inequalities.
