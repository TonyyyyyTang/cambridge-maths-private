  IB/2015/P2/q17D:
    independent_rework: '# Independent rework — IB/2015/P2/q17D


      Use the complex $L^2(\mathbb R)$ inner product and smooth rapidly decaying test
      functions. Multiplication by real $x$ can be transferred between the factors
      without conjugation changing it. Integration by parts gives

      $$

      \int \bar f(-i\hbar g'')\,dx

      =[-i\hbar\bar f g]_{-\infty}^{\infty}+\int\overline{-i\hbar f''}g\,dx.

      $$

      The boundary term vanishes. These are the Hermitian identities on a common dense
      domain containing the oscillator states. For self-adjoint realisations one takes
      $\{f:xf\in L^2\}$ for position (with $f\in L^2$) and $H^1(\mathbb R)$ for momentum,
      which the Fourier transform carries into multiplication by the real variable
      $\hbar k$ on its maximal domain.


      Each $|\psi_n|^2$ is even. Consequently the integral of $x|\psi_n|^2$ vanishes.
      Differentiation reverses the parity of $\psi_n$, so $\bar\psi_n\psi_n''$ is
      odd and its integral vanishes as well. Gaussian decay guarantees convergence.


      The uncertainty principle gives $\Delta x\,\Delta p\ge\hbar/2$ for states with
      the required moments on the line, with variances $\langle O^2\rangle-\langle
      O\rangle^2$. Put $a=k/\hbar$. Since $h_0$ is constant, normalisation and an
      irrelevant choice of phase give $\psi_0=(a/\pi)^{1/4}\exp(-ax^2/2)$. The given
      Gaussian integrals yield $\langle x^2\rangle=1/(2a)$. As $\psi_0''=-ax\psi_0$,
      $\langle p^2\rangle=\|\hat p\psi_0\|^2=\hbar^2a^2/(2a)$. Therefore $\Delta x=\sqrt{\hbar/(2k)}$,
      $\Delta p=\sqrt{\hbar k/2}$, and the product is $\hbar/2$.


      In the sudden limit the state at the change is still $\psi_0$. The overlap with
      any odd new eigenfunction vanishes by parity. The new ground state has Gaussian
      parameter $4a$, giving the real overlap

      $$

      \langle\phi_0,\psi_0\rangle

      =(4a^2/\pi^2)^{1/4}\int_{\mathbb R}e^{-5ax^2/2}\,dx

      =(4a^2/\pi^2)^{1/4}\sqrt{2\pi/(5a)}=2/\sqrt{5}.

      $$

      The probability is its squared modulus, $4/5$.

      '
    independent_rework_sha256: 2a62b968fe048c72c6e42ca3d32069c2af394a58c6a1a465eba424c1ea390cf8
    comparison: Hermitian identities, parity, the Gaussian norm, and both fluctuation
      factors agree. The independent normalized overlap is 2/sqrt(5) and gives probability
      4/5.
