      question_sha256: 02972286305ee577443b18c5fb6fdf4fe8cb7be5c6ef6dda6a248e1ea85fba39
      comparison: Independent visual word-for-word comparison against the original
        page raster
      review: Compared both paragraphs around the diagram, including the PDE, base
        data, both closed-ball inequalities, the moving-ball energy, time and space
        inequalities of the cone, and the final uniqueness request. Compared Figure
        1, its number, full caption and final punctuation. The cone apex and its coordinates,
        the base centre, shaded base and time cross-section, arrow labels B_0 and
        B_t, vertical time arrow and ambient-space label all agree with the printed
        figure.
      figure_sha256:
        figures/backwards-lightcone.png: ed73069cdd1629584911a15cd146fbb1765b8c58830d66e869aff15737f7ee75
      discrepancies: []
    text_sha256: 02972286305ee577443b18c5fb6fdf4fe8cb7be5c6ef6dda6a248e1ea85fba39
    independent_rework_sha256: 5293aff79d04dbbc1317df8ae080afd5730ea37f62cf58e355e1773042cda4df
    independent_rework: 'Assume a classical solution smooth up to the initial slice
      and $c>0$. Write $e=(u_t^2+c^2|\nabla u|^2)/2$. The wave equation gives $\partial_t
      e=c^2\operatorname{div}(u_t\nabla u)$. For $0<t<t_0$, the outward normal speed
      of the sphere bounding $B_t$ is $-c$. Differentiating the moving integral and
      using the divergence theorem, with $\nu$ the outward unit normal and $\nabla_T$
      the tangential gradient, gives

      \[

      E''(t)=\int_{\partial B_t}(c^2u_t\partial_\nu u-ce)\,dS

      =-\frac c2\int_{\partial B_t}\big[(u_t-c\partial_\nu u)^2+c^2|\nabla_Tu|^2\big]\,dS\le0.

      \]

      On the base, $u_t=0$ and $\nabla u=0$ in the interior because $u(\cdot,0)$ is
      identically zero there. Hence $E(0)=0$. Since $E$ is nonnegative, it vanishes
      at every time before the vertex. Its continuous nonnegative integrand therefore
      vanishes throughout each open ball and extends to the boundary by continuity.
      For $x\in B_t$, the fixed point $x$ also lies in every $B_s$, $0\le s\le t$.
      Integrating $u_t(x,s)=0$ from time zero gives $u(x,t)=0$. Continuity along $x=x_0$
      also gives zero at the vertex. If $t_0=0$ the assertion is initial data.


      Apply this argument to the difference of two classical solutions whose data
      coincide on $B_0$. They agree throughout the cone and in particular at its vertex.
      If the data coincide everywhere, the vertex is arbitrary and uniqueness holds
      throughout space-time.

      '
