      question_sha256: 6701b8333ba7ed294851675b85256ea414cb2bb4e5abbd68e701cfef76323cd4
      comparison: Independent visual word-for-word comparison against the original
        page raster
      review: Compared the complete single sentence and displayed-in-line convolution.
        The capitalised Heat Kernel, hyphenated semi-group, order of kernel factors,
        subscripts and bold spatial argument agree.
      figure_sha256: {}
      discrepancies: []
    text_sha256: 6701b8333ba7ed294851675b85256ea414cb2bb4e5abbd68e701cfef76323cd4
    independent_rework_sha256: 3fc6d10b3d07ea9086bf84c3ecefba1ad64f20bffe6de0172e8ee3ef7f859725
    independent_rework: 'Let the diffusivity be $\kappa>0$. For $r>0$ the heat kernel
      on $\mathbb R^n$ is

      \[

      K_r(z)=(4\pi\kappa r)^{-n/2}\exp(-|z|^2/(4\kappa r)).

      \]

      Use positive $s,t$. In the defining integral $\int K_t(x-y)K_s(y)\,dy$ both
      factors are integrable Gaussians. Complete the square using

      \[

      \frac{|x-y|^2}{t}+\frac{|y|^2}{s}

      =\frac{t+s}{st}\left|y-\frac{s}{s+t}x\right|^2+\frac{|x|^2}{s+t}.

      \]

      Integration over all $y$ of the shifted Gaussian gives $(4\pi\kappa st/(s+t))^{n/2}$.
      After multiplication by the two kernel prefactors, the convolution is

      \[

      (4\pi\kappa(s+t))^{-n/2}\exp(-|x|^2/(4\kappa(s+t)))=K_{s+t}(x).

      \]

      If time zero is included as a measure-valued kernel, $K_0$ is the unit point
      mass and convolution by it is the identity.

      '
