    text_sha256: 1b8c1e8b79fde23d48c0a5ddb8e51bb7c6cb1a5bf728b535ac2ed5f11d9235cb
    independent_rework_sha256: 6a7c60382779f59858895ee1e814dfcb890fc0575da62e8c65bb7b0240b9bb44
    independent_rework: 'Take transverse displacement from the undisturbed equilibrium
      position and let $c>0$ be the wave speed. Immediately after the impulse the
      data are $u(x,0)=0$ and $u_t(x,0+)=V\delta(x-x_0)$. For smooth initial velocities
      $g$, d''Alembert''s formula gives $u(x,t)=\frac1{2c}\int_{x-ct}^{x+ct}g(y)\,dy$.
      Applying this formula to a smooth unit-mass approximation to the point impulse
      and taking the distributional limit gives

      \[

      u(x,t)=\frac{V}{2c}\big[H(x-x_0+ct)-H(x-x_0-ct)\big],\qquad t>0.

      \]

      Thus the displacement is $V/(2c)$ when $|x-x_0|<ct$ and zero when $|x-x_0|>ct$.
      Values assigned on the two jump lines do not affect the distribution. A symmetric
      approximation assigns $V/(4c)$ on each line. Each translated step solves the
      homogeneous wave equation distributionally. The difference is zero at $t=0$
      and its right time derivative there is $V(\delta_{x_0}+\delta_{x_0})/2=V\delta_{x_0}$,
      verifying the normalization.

      '
