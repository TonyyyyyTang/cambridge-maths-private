  IB/2005/P1/q16H:
    source_review:
      original_pdf: private/raw/tripos/IB/2005/P1.pdf
      original_pdf_sha256: 938c5539323a7176cf5affa7ad7859d4165e5f4a9c7a07e98af1413e0431fede
      source_page: 7
      question_packet_sha256: 070c40bf19c4ac93af0a7399d728af6b306e739600b59bb53a0b7b275623f1dc
      blind_rework_sha256: 627462bd7c5e1932be86094361ac70c8ec7fc73d481e90387052bc3acf5af16e
      transcription_discrepancies: []
    independent_rework: '# IB/2005/P1/q16H independent rework


      For an isolated localized charge distribution take φ→0 at infinity and assume
      finite integrals. Assemble it quasistatically by increasing its density from
      zero to ρ along λρ, 0≤λ≤1. Linearity gives potential λφ at intermediate charge.
      Work to add ρ dλ is dE=dλ∫λφρ d³x, giving E=½∫ρφ d³x. With ∇·E=ρ/ε₀ and ∇φ=−E,
      integration of ∇·(φE) over a large ball gives ∫ρφ=ε₀∫|E|²+ε₀∮φ E·n. The surface
      term tends to zero for localized charge (φ=O(1/r), E=O(1/r²)). This yields the
      field formula with the same factor ½.


      Write Q=4πρR³/3. Rotational symmetry and Gauss'' law on a sphere of radius r
      give E=ρr eᵣ/(3ε₀) inside and Q eᵣ/(4πε₀r²) outside. At the origin take E=0.
      The potential obtained by radial integration is Q/(4πε₀r) outside and ρ(3R²−r²)/(6ε₀)
      inside. At R both potential and radial field agree, consistent with the absence
      of a surface charge.


      Use the charge formula over r≤R: E_stored=(πρ²/(3ε₀))∫₀ᴿ(3R²r²−r⁴)dr=4πρ²R⁵/(15ε₀)=3Q²/(20πε₀R).
      If the nuclear volume scales like Z then R∝Z^{1/3} for a sphere and Q=Ze, so
      the energy scales as Z^{5/3} at the uniform-sphere level of approximation.

      '
    main_comparison: Continuous charge assembly and integration by parts yield the
      identical two energy formulas. Gauss and continuity of potential at the sphere
      give 3Q²/(20πε₀R). Fixed volume per proton then implies the stated five-thirds
      exponent.
