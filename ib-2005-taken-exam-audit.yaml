    independent_rework: '# IB/2005/P2/q18F independent rework


      Let Pₙ be polynomials of degree at most n and take the standard meaning of a
      sequence of orthogonal polynomials, with nonzero Qⱼ of degree j. These give
      an orthogonal basis of Pₙ. For p=∑cⱼQⱼ, residual orthogonality gives cⱼ=(f,Qⱼ)/(Qⱼ,Qⱼ).
      The corresponding p* is the unique minimizer since ||f−p||²=||f−p*||²+||p*−p||².
      Mere mutual orthogonality without the spanning property only projects onto their
      span.


      On substituting x=cos θ the weighted inner product becomes the unweighted integral
      from 0 to π of the corresponding functions of cos θ. Take Tⱼ(cos θ)=cos(jθ);
      these are polynomials of degree j by the cosine recurrence. Their norms squared
      are π for j=0 and π/2 otherwise, with pairwise orthogonality by product-to-sum.
      Here f(cos θ)=sin θ. Thus (f,T₀)=2, odd coefficients vanish by reflection about
      π/2, and for j=2k≥2 integration of sin θ cos(2kθ)=[sin((2k+1)θ)+sin((1−2k)θ)]/2
      gives 2/(1−4k²). Consequently pₙ(x)=2/π−(4/π)∑_{k=1}^{⌊n/2⌋} T₂ₖ(x)/(4k²−1).
      For n=0 or 1 this is constant. For odd n the best polynomial has degree below
      n, consistent with approximation in Pₙ.

      '
    main_comparison: Projection on an orthogonal basis through degree n gives the
      least-squares minimizer. Substitution x=cos θ produces Chebyshev modes with
      constant coefficient 2/π, odd coefficients zero, and even coefficients 4/[π(1−4m²)].
      The degree or spanning assumption is required.
