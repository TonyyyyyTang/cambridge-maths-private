    independent_rework: '# IB/2005/P4/q6G independent rework


      On a common domain for the products, [A,B]=AB−BA. Use pⱼ=−iℏ∂ⱼ so [xᵢ,pⱼ]=iℏδᵢⱼ
      while like coordinates and like momenta commute. Expanding the first commutator
      gives [yp_z,zp_x]=−iℏ yp_x and [−zp_y,−xp_z]=iℏ xp_y. The other two pairings
      vanish. Thus [L_x,L_y]=iℏ(xp_y−yp_x)=iℏL_z, with cyclic variants. For example
      [L²,L_z]=−iℏ(L_xL_y+L_yL_x)+iℏ(L_yL_x+L_xL_y)=0, using [A²,B]=A[A,B]+[A,B]A.
      Cyclic relabelling proves all three statements.


      Each Lⱼ is −iℏ times a rotational derivative, annihilating every radial factor
      h(r) for r>0. Hence L²(h(r)q)=h(r)L²q. For q=x one has L_x x=0, L_y x=−iℏ z
      and L_z x=iℏ y, whence L_y²x=ℏ²x=L_z²x. By rotating the coordinates, L² has
      the same eigenvalue 2ℏ² on y and z. Linearity gives L²ψ=2ℏ²ψ with h=e^{−r} and
      q=x+y+z. The radial factor poses no angular singularity at r=0: on each rotation
      orbit it is constant, the wave function vanishes at the origin, and the equality
      also holds as an L² identity. At infinity the exponential ensures square integrability.

      '
    main_comparison: Canonical brackets give the cyclic angular-momentum algebra and
      cancellation in [L²,Lw]. Angular derivatives annihilate radial factors. On each
      Cartesian coordinate the two nonzero square terms give a total of 2ℏ² times
      the coordinate.
