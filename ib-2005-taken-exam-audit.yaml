  IB/2005/P4/q13B:
    source_review:
      original_pdf: private/raw/tripos/IB/2005/P4.pdf
      original_pdf_sha256: eab2014f59691f0d4ae9611d346acfbc478fb3e61369533042292c1c3ce6ce9f
      source_page: 7
      question_packet_sha256: 9be54245c4dbc409df52acb3e667b0c788d9af2011f86f5d627325d93240dc84
      blind_rework_sha256: ea8be81678c33554e74e89fae6daf64c483def361e730dd9386e98e3bdfda499
