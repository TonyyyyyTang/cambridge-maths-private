      transcription_discrepancies: []
    independent_rework: '# IB/2005/P2/q8E independent rework


      Use the steady Euler momentum equation for an inviscid fluid of constant density,
      with conservative body acceleration −∇Φ (take Φ=0 when body forces are absent).
      In components (u×ω)ᵢ=∑ⱼuⱼ(∂ᵢuⱼ−∂ⱼuᵢ), so (u·∇)u=∇(|u|²/2)−u×ω. Substitution
      of (u·∇)u=−∇p/ρ−∇Φ gives H=p/ρ+|u|²/2+Φ up to a constant. Along a streamline
      with tangent u, dH/ds=∇H·u=0.


      With u=(ψ_y,−ψ_x,0), the scalar vorticity is ω=−Δψ and the cross product (−ωψ_x,−ωψ_y,0)=−ω∇ψ.
      Hence wherever H is a differentiable function of ψ, (H′(ψ)+ω)∇ψ=0. On regular
      streamlines, ∇ψ≠0 and H′(ψ)+ω=0. The equality extends by continuity to limits
      of regular points if H′ and ω are continuous there. A stagnant open patch has
      ∇ψ=0, so cancellation there alone cannot determine H′. Streamwise constancy
      by itself also does not identify different disconnected streamlines of the same
      ψ; the question assumes H=H(ψ).


      Under the bare printed kinematic hypotheses of steadiness and incompressibility
      this generally fails. For example u=(exp(y),1,0) is divergence-free with ω_z=−exp(y),
      and u×ω=(−exp(y),exp(2y),0) has curl with z-component exp(y)≠0. This flow even
      solves the steady viscous equation with unit kinematic viscosity and constant
      pressure. The Euler hypothesis matters.

      '
    main_comparison: The Euler identity requires constant density, inviscid flow and
      conservative forcing. The streamline derivative of the Bernoulli function vanishes.
      The stated streamfunction convention gives u×ω=−ω∇ψ, hence the printed derivative
      relation on regular levels.
