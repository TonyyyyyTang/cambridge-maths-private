  IB/2005/P1/q13F:
    source_review:
      original_pdf: private/raw/tripos/IB/2005/P1.pdf
      original_pdf_sha256: 938c5539323a7176cf5affa7ad7859d4165e5f4a9c7a07e98af1413e0431fede
      source_page: 6
      question_packet_sha256: c902dc469e6e8a7a5e57bce08466f64a84be217534563b8d5bfbd4db5cbaff26
      blind_rework_sha256: e82792c3f4da8f004e5b1afe605e6376d63372d2577589fdec328221cc431dc5
      transcription_discrepancies: []
    independent_rework: '# IB/2005/P1/q13F independent rework


      There are two readings of “to”. A conformal map into the disc comes from T(z)=(z−1)/(z+1).
      This takes finite points off the segment bijectively to C∖((−∞,0]∪{1}). Indeed
      the inverse is z=(1+t)/(1−t), and nonpositive real t corresponds to the deleted
      segment (with the endpoint −1 the pole of T). The value t=1 would require z=∞.
      The principal square root maps this slit plane with 1 removed onto the right
      half-plane with 1 removed. The Cayley map s↦(s−1)/(s+1) maps that domain bijectively
      to the unit disc with 0 removed. All three maps and inverses on their images
      are holomorphic, and their derivatives are nonzero there. Their composition
      gives the requested map into the disc if surjectivity is not intended.


      No conformal equivalence onto the complete disc exists for Ω₀ as printed. The
      circle |z|=2 has winding number one about 0, invariant under all deformations
      staying in Ω₀. It cannot be contracted there, whereas every loop in a disc can
      be contracted by a straight-line homotopy. A biholomorphism would transfer that
      contraction to Ω₀. Adjoining infinity to the source fills the missing point,
      since T(∞)=1 and the resulting map takes ∞ to 0, with a nonzero derivative in
      the coordinate 1/z. Both the original and the packet specify the finite complex
      plane.

      '
    main_comparison: The two explicit maps differ by a rotation. Their common image
      is a punctured disk because the original finite-plane domain omits infinity.
      Either is a conformal map into the disk, and winding about zero rules out a
      bijection onto the full disk. Adjoining infinity fills its missing centre.
