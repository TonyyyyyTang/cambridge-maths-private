    independent_rework: '# IB/2005/P1/q9C independent rework


      Take a basis w₁,…,wₖ for W and extend it to a basis w₁,…,wₖ,vₖ₊₁,…,v_d of V.
      A linear functional on V is uniquely determined by its values on this basis.
      It vanishes on W exactly when its first k values are zero. Its remaining d−k
      values range freely over R, giving a linear isomorphism α(W) ≅ R^{d−k}. This
      includes W=0 and W=V.


      Take W to be the row space of A in Rⁿ, of dimension r (equality of row and column
      ranks if rank is defined by columns). The dot product identifies x∈Rⁿ with the
      covector w↦w·x. Indeed the inverse takes the values of a covector on the standard
      basis as the coordinates of x. Ax=0 precisely when this covector vanishes on
      all rows and therefore on W. Hence the solution space is isomorphic to α(W)
      and any basis gives n−r independent solutions. For r=n this is the empty basis
      of the zero space.

      '
    main_comparison: Extending a basis yields precisely n−dim W free coefficients
      in the annihilator. Applying this to the row span, column vectors represent
      all functionals, giving n−r independent null vectors.
