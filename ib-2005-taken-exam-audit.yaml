    independent_rework: '# IB/2005/P4/q5H independent rework


      Assume a classical solution and c>0, L>0. In coordinates u=ct−x and v=ct+x,
      the wave operator c⁻²∂²_t−∂²_x equals (∂ᵤ+∂ᵥ)²−(−∂ᵤ+∂ᵥ)²=4∂ᵤ∂ᵥ. Thus the u-derivative
      depends only on u, and integration gives y=f(u)+g(v); the converse is immediate.
      This holds globally on the whole characteristic plane and also on the strip
      because the intersections with each characteristic are intervals.


      At x=0, f(s)=−g(s). At L this yields g(s+L)=g(s−L), hence g and f are 2L-periodic
      (the fundamental period can be smaller). These identities are on all real arguments
      for all-time solutions; for forward time use the corresponding boundary identities
      on accessible arguments and extend the travelling profile periodically. In the
      latter case, for −L≤s<0 one can define g(s)=−f(s), with g(s)=g(s+2L) following
      from the L boundary.


      The two derivatives are y_t/c=f′(u)+g′(v) and y_x=−f′(u)+g′(v). On summing their
      squares and halving, the cross terms cancel. Replacing f′ by −g′ and then reflecting
      x↦−x in the first integral yields ∫_{−L}^L g′(ct+x)² dx. This integrates the
      2L-periodic function g′² over one complete period, so its time derivative is
      c[g′(ct+L)²−g′(ct−L)²]=0.

      '
    main_comparison: Characteristic coordinates give two travelling profiles. Fixed
      ends set them opposite and 2L-periodic. In the half-sum of energy squares the
      mixed terms cancel. Reflecting one term puts the entire integral over a period
      of the squared derivative.
