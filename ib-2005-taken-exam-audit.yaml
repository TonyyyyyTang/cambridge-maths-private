auditor_report: '# 2005 Part IB blind sample rework


  I examined all 13 question statements in the supplied sample against the question
  blocks rendered from the original Faculty PDFs. The sample spans P1 (5), P2 (3),
  P3 (2) and P4 (3). I compared words, operators, numbers, conditions and subparts.
  No discrepancies survived comparison (0/13). In particular P1 q13F prints “and,
  finally,” in precisely the position transcribed.


  I derived each answer from the question and source page. The 13 question directories
  contain these derivations and the hashes of the packet, original paper and rework.
  No source figures occurred in this sample. Comparison with stored solutions and
  estimation of their substantive error rate fall to the receiving reviewer, who can
  now consult those solutions.


  ## Points for comparison


  - P1 q13F. The hint overlooks the finite-plane domain’s missing point at infinity.
  The composed conformal map omits 0. Any claim of equivalence to the whole disk needs
  an amended domain. The obstruction is a noncontractible loop around the segment.

  - P2 q8E. Bernoulli’s identity uses the steady Euler equation with conservative
  body acceleration. The printed kinematic hypotheses alone do not imply it. The streamfunction
  derivative relation follows by cancellation only on regular points, with appropriate
  extension to their limits.

  - P2 q18F. The projection formula as a sum up to index n uses the customary degree
  indexing of an orthogonal polynomial sequence. Approximation is in degree at most
  n, since all odd coefficients here are zero.

  - P3 q8D. The usual Student test has n−1 degrees of freedom and requires n≥2 and
  positive population variance.

  - P4 q13B. A vanishing Lipschitz constant or a vanishing upper bound for the magnitude
  of F gives an immediate fixed point, so the reciprocal bounds can be interpreted
  without division by zero.


  I also enumerated all 15 possible swaps for each initial relative seat position
  (P1 q19D), checked the first 12 projection coefficients by quadrature to absolute
  tolerance 10⁻¹² (P2 q18F), and independently integrated the interior and exterior
  field energies symbolically (P1 q16H). Each check agreed with the derivation.

  '
main_resolution: The slit-plane map has a punctured disk as its image and extends
  over infinity to the full disk. A preliminary punctuation concern in the hint was
  resolved by reading the literal question bytes and original print; their punctuation
  agrees. The fluid rotation identity requires the steady Euler hypotheses. The Chebyshev
  projection assumes the polynomial system spans all degrees through n. Independent
  enumeration of seating swaps, quadrature of the first twelve coefficients, and integration
  of sphere field energy agree with the canonical results.
