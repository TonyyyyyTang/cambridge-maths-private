    independent_rework: '# IB/2005/P3/q6E independent rework


      At a regular constrained point ∇g≠0, the implicit-function theorem identifies
      the tangent line as the vectors orthogonal to ∇g. At stationarity, the derivative
      of f in each tangent direction vanishes, so ∇f=λ∇g. Conversely this implies
      zero tangent derivative. Solve these two coordinate equations with g=0, checking
      any singular constraint points or endpoints separately.


      Assume a,b≠0 so the ellipse is defined. Its gradient (2x/a²,2y/b²) never vanishes
      on the ellipse. The multiplier conditions are y=2λx/a² and x=2λy/b²; one coordinate
      zero would force both zero, contrary to the constraint. Multiply the first by
      x and the second by y: xy=2λx²/a²=2λy²/b² with λ nonzero. Thus each of x²/a²
      and y²/b² equals 1/2. There are four stationary points (±|a|/√2,±|b|/√2) with
      signs independently chosen, all satisfying the multiplier equations for λ=a²y/(2x).
      Equal signs yield the maximum |ab|/2 and opposite signs yield the minimum −|ab|/2.
      These are global since 2|xy|/|ab|≤x²/a²+y²/b²=1. For positive semiaxes the values
      are ±ab/2.

      '
    main_comparison: The constraint gradient is nonzero on the ellipse. Rescaling
      to the circle gives four stationary points; the two possible values are ±ab/2.
      The elementary product bound identifies the global extrema.
