    independent_rework: '# IB/2005/P2/q1C independent rework


      Set z=a+ib and w=c+id. Then the matrices are exactly M(z,w) with rows (z,w)
      and (−w̄,z̄). The top row recovers all four real parameters, and the parametrization
      is real-linear, so the real dimension is 4. Direct row-by-column multiplication
      gives M(z,w)M(s,t)=M(zs−w t̄,zt+w s̄), proving closure. Reversing the signs
      of b,c,d gives M(z̄,−w). Substitution in the product formula gives top row (|z|²+|w|²,0)
      and hence the claimed scalar matrix. The reverse product gives the same result
      (replace z,w by z̄,−w). For a nonzero element the real number |z|²+|w|² is strictly
      positive, so the inverse is M(z̄,−w)/(|z|²+|w|²) in Ω. When z=w=0 the norm vanishes
      and the matrix is singular.

      '
    main_comparison: The explicit square and anticommuting products give closure and
      the scalar norm identity. The first row proves real linear independence. Division
      by the positive scalar norm yields the inverse of every nonzero element.
