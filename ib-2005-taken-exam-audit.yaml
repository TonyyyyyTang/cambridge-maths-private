    independent_rework: '# IB/2005/P3/q8D independent rework


      Let S=∑(xᵢ−x̄)² and S₀=∑(xᵢ−μ₀)²=S+n(x̄−μ₀)². For fixed μ the log likelihood
      is −(n/2)log(2πσ²)−∑(xᵢ−μ)²/(2σ²). The maximizer over positive σ² is ∑(xᵢ−μ)²/n
      for positive residual sum, by differentiation and the limits at 0 and ∞. Its
      maximized value decreases with the residual sum, which is minimized over μ at
      x̄. Hence the null-to-full ratio is Λ=(S/S₀)^{n/2}. With s²=S/(n−1) and T=√n(x̄−μ₀)/s,
      this equals (1+T²/(n−1))^{−n/2}. It decreases strictly in |T|, hence rejection
      for small Λ amounts to rejection for large |T|.


      Under H₀ and σ²>0, T∼Student t with n−1 degrees of freedom. For 0<α<1 reject
      for |T|>t_{n−1,1−α/2}; symmetry and continuity give exact size α at every nuisance
      variance. Equivalently compare Λ with (1+t_{n−1,1−α/2}²/(n−1))^{−n/2}. The derivation
      requires n≥2, and S=0 is then a null-probability event under every nondegenerate
      normal distribution. If the unrestricted supremum is taken over μ≠μ₀ only, excluding
      a possible maximizer at μ₀ leaves the same supremum by continuity.

      '
    main_comparison: Profiling both normal likelihoods over variance gives a ratio
      strictly decreasing in the absolute Student statistic. Under the null the statistic
      has n−1 degrees of freedom and yields the exact two-sided size.
