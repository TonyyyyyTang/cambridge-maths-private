    independent_rework: '# IB/2005/P1/q19D independent rework


      Group all positions into two events, O (opposite) and N (otherwise). In O any
      of the six pairs of guests may be swapped, or Lancelot and Guinevere may themselves
      be swapped, to leave O unchanged. Each of the eight other swaps breaks O. In
      N the seat opposite either distinguished diner is occupied by a guest. Swapping
      that guest with the other distinguished diner creates O, giving exactly two
      successful pairs out of the fifteen unordered pairs. The nightly choices are
      independent. If pₙ is the probability of O after n swaps, then p₀=0 and pₙ₊₁=(7pₙ+2(1−pₙ))/15=2/15+pₙ/3.
      The fixed value is 1/5; subtracting it and iterating gives pₙ=(1−3^{−n})/5.
      The first swap gives 2/15 and the limiting value 1/5 agrees with the one opposite
      seat among five other seats.

      '
    main_comparison: Among 15 unordered swaps seven preserve opposition and two create
      it when absent. Both give the same affine recurrence, fixed point 1/5 and multiplier
      1/3, starting with the pair adjacent.
