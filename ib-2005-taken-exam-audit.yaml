    independent_rework: '# IB/2005/P1/q12A independent rework


      The sum of the two component distances is nonnegative, symmetric, and zero exactly
      when both coordinates coincide. Adding their respective triangle inequalities
      through an intermediate pair proves the triangle inequality. Projection onto
      the second coordinate is 1-Lipschitz since the second summand is at most the
      sum.


      Given an infinite sequence (xₙ), suppose every x∈X has a ball containing only
      finitely many sequence indices. By compactness, finitely many such balls cover
      X; their finite union of index sets cannot contain all natural numbers. There
      is thus x for which every ball contains infinitely many indices. Recursively
      choose indices nⱼ>nⱼ₋₁ with d_X(xₙⱼ,x)<1/j. This argument counts repeated terms
      with their multiplicities.


      If y belongs to the closure of π(F), choose yₙ∈π(F) tending to y and xₙ with
      (xₙ,yₙ)∈F. The x-coordinates have a convergent subsequence with limit x∈X, so,
      by the sum metric, the corresponding pairs converge to (x,y). Closedness of
      F gives (x,y)∈F and y∈π(F). An empty image is already closed. For failure with
      X=Y=R take F={(x,y):xy=1}; continuity of multiplication gives closedness, while
      π(F)=R∖{0} contains 1/n and omits its limit.

      '
    main_comparison: The sum metric bounds the projection distance. Finite open covers
      give a convergent subsequence in the compact factor, whose paired lifts converge
      in the closed set. Projecting the closed hyperbola in the noncompact plane gives
      the punctured line.
