    independent_rework: '# IB/2005/P4/q13B independent rework


      Assume positive interval radii and b>0 as usual. Put J=[−b,b], I=[x₀−r,x₀+r].
      Integrating a C¹ solution on the oriented interval from 0 to t gives x(t)=x₀+∫₀ᵗF(s,x(s))ds.
      Conversely, for a continuous I-valued x the integrand is continuous, so the
      integral equation gives the initial value and, by the fundamental theorem of
      calculus, the differential equation with continuous derivative (one-sided derivatives
      at the endpoints).


      Use the sup metric on the space of continuous functions J→I. This is a nonempty
      closed subset of the complete space C(J,R), hence complete. Define (Tx)(t) by
      the right hand side of the integral equation. Since J⊂[−a,a] and |F|≤C, the
      absolute difference |(Tx)(t)−x₀|≤C|t|≤Cb<r; in particular T maps the space into
      itself. For two functions x,y, Lipschitz continuity gives |(Tx)(t)−(Ty)(t)|≤K|t|
      ||x−y||∞, also for negative t by reversing the endpoints. Taking suprema shows
      T is a contraction with constant bK<1. The contraction mapping theorem supplies
      exactly one fixed point; the equivalence above gives exactly one C¹ solution
      with values in I.


      If C=0, F vanishes and the solution is x≡x₀. If K=0 the integrand is independent
      of the space variable, T is constant on the function space, and its value is
      its unique fixed point. One can read the corresponding reciprocal restrictions
      as imposing no bound.

      '
    main_comparison: Both proofs use the closed uniform ball of continuous paths to
      keep the integral operator in its domain. Its Lipschitz factor bK is less than
      one. The fundamental theorem gives the C1 solution and the equivalence checks
      uniqueness, including the zero-bound cases.
