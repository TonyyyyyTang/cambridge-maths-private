      result: agreement after independent derivation
      comparison: Normality gives conjugate adjoint eigenvalues and reducing complements.
        Conjugate imaginary eigenspaces supply the signed real blocks with a real
        kernel complement. Both inner-product conventions lead to the same conclusions.
      frozen_rework_text: '# IB 2022 Paper 1, 8F

        (a) With the inner product linear in its first argument, the adjoint is the
        unique map such that $\langle \alpha u,w\rangle=\langle u,\alpha^*w\rangle$
        for all $u,w$. Its matrix in an orthonormal basis is the conjugate transpose,
        proving existence and uniqueness. If $V$ is nonzero, complex characteristic
        polynomials have a root, so choose a unit $\lambda$-eigenvector $v$. Put $T=\alpha-\lambda
        I$. Since $T$ is normal, $\|T^*v\|^2=\langle TT^*v,v\rangle=\langle T^*Tv,v\rangle=\|Tv\|^2=0$.
        Thus $\alpha^*v=\bar\lambda v$. For each $w\perp v$ the adjoint identities
        give $\alpha w\perp v$ and $\alpha^*w\perp v$. On $v^\perp$ the restrictions
        are adjoints and commute. Induct on dimension to give an orthonormal eigenbasis
        on the complement, then adjoin $v$. The zero space has the empty basis and
        no eigenvector.


        (b) On complexification $A^*=-A$, so $A$ is normal. For every eigenvalue the
        relation in (a) gives $\bar\lambda=-\lambda$. Hence zero is the only possible
        real eigenvalue. If $A$ has a nonzero eigenvalue $i\mu$, $\mu$ real and nonzero,
        take $z=u+iw$ with $u,w$ real. Reality gives a second eigenvector $\bar z$
        for $-i\mu$ orthogonal to $z$ by the normal eigenbasis (distinct eigenspaces
        are orthogonal). Hence $0=z^Tz=\|u\|^2-\|w\|^2+2i\,u\cdot w$. Both real vectors
        have the same nonzero length and are orthogonal. Also $Au=-\mu w$ and $Aw=\mu
        u$. The normalized ordered pair therefore gives the desired block with top
        right $\mu$. Skew symmetry makes the real orthogonal complement of this plane
        invariant. Repeat there. If only zero eigenvalues remain, normal diagonalizability
        makes the restriction zero, and its real orthonormal basis gives zero blocks.
        The matrix with all these vectors as columns is orthogonal.

        '
