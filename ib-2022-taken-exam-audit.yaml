      printed_number: 8F
      auditor_raster_sha256: f7767ece7be687fd96d0a0b9dc9c6ab1a29616ed88f9946616411af923d410b4
    transcription:
      path: tripos/IB/2022/P4/q8F/question.tex
      sha256: 87e80d8d400a64b1ee1e4a65fe1e95c3bad9e27ba064178868d9583b9e0dfdb6
      result: matched original page image
    mathematics:
      frozen_rework: P4-q8F.md
      frozen_rework_sha256: decb92b23983de2e69dd0b178edc2a2bc1325937eb5c84bd4a4a87faa64d8593
      canonical: tripos/IB/2022/P4/q8F/solution.tex
      canonical_sha256: e02d1470916ac65bbe17fd2e25bdb1076d66dfb9af121bc50d5d4934be662e90
      result: agreement after independent derivation
      comparison: The rank-nullity proof and all four rank bounds hold. The canonical
        coordinate construction has the two maximal ranks simultaneously for fields
        of order greater than two. Both reworks identify the one-dimensional binary-field
        obstruction in the unqualified question.
      frozen_rework_text: '# IB 2022 Paper 4, 8F

        The rank is the dimension of the image, the nullity that of the kernel. Extend
        a basis of $\ker\alpha$ to one of $V$. The images of the added vectors span
        $\operatorname{im}\alpha$, and a linear combination of those vectors whose
        image vanishes lies in the span of the kernel basis; basis independence forces
        every coefficient to vanish. Thus $\dim V=r(\alpha)+n(\alpha)$.


        Write $a=r(\alpha), b=r(\beta)$. Image containment gives $r(\alpha+\beta)\le\min(n,a+b)$.
        Applying this upper bound to $\alpha=(\alpha+\beta)-\beta$ and to $\beta=(\alpha+\beta)-\alpha$
        gives the lower bound $|a-b|$. The restriction of $\alpha$ to $\operatorname{im}\beta$
        has image $\operatorname{im}\alpha\beta$ and kernel $\operatorname{im}\beta\cap\ker\alpha$.
        Thus $r(\alpha\beta)=b-\dim(\operatorname{im}\beta\cap\ker\alpha)$ is bounded
        below by $\max(0,b-(n-a))$ and above by $b$; containment in $\operatorname{im}\alpha$
        also gives the upper bound $a$.


        For sharpness write $P_S$ for a diagonal coordinate projection. Let $I$ consist
        of the first $a$ coordinates and $K$ of the first $b$. Taking $\alpha=P_I,\
        \beta=-P_K$ attains the lower sum bound, since nested common coordinates cancel,
        and the upper product bound, since their intersection has size $\min(a,b)$.
        Let $J$ be the last $b$ coordinates, so $|I\cap J|=d=\max(0,a+b-n)$. With
        $\beta=P_J$ the product realizes its lower bound $d$.


        Over the usual real or complex scalar fields, both upper bounds can always
        be attained together. More generally choose a scalar $c$ different from $0$
        and $-1$. Let $\alpha=P_I$ and define $\beta$ on coordinate vectors as follows.
        It vanishes outside $J$, acts by $cI$ on $I\cap J$, and on $j\in J\setminus
        I$ send $e_j$ to $e_j+v_j$. Choose $v_j$ among the span of the $e_i$ for $i\in
        I\setminus J$ so their span has dimension $\min(a-d,b-d)$, e.g. assign distinct
        coordinate vectors up to that number and zero thereafter. The $J$ components
        of the images of the $J$ basis form an invertible diagonal block, so $\beta$
        has rank $b$. The sum on the coordinates $I\cup J$ is triangular after placing
        $I$ first, with nonzero diagonal $1,1+c,1$ on $I\setminus J,I\cap J,J\setminus
        I$. Its rank is $|I\cup J|=\min(n,a+b)$. The image of $\alpha\beta$ is the
        direct sum of the common-coordinate span and the span of the $v_j$, and hence
        has dimension $d+\min(a-d,b-d)=\min(a,b)$. This includes empty index sets.


        The printed question does not specify a scalar field. If it quantifies over
        absolutely all fields, even the individual upper sum bound cannot always be
        attained: $n=a=b=1$ over $\mathbb F_2$ forces both endomorphisms to be the
        identity and their sum zero. The preceding construction works on every field
        with more than two elements.

        '
