      result: agreement after independent derivation
      comparison: Picard iteration proves convergence and uniqueness on a nonempty
        complete space. The cosine interval and the invariant complete square both
        give strict derivative bounds. The supremum-norm bound 2 sin(1/2) is strictly
        below one.
      frozen_rework_text: '# IB 2022 Paper 3, 11G

        A contraction from $(X,d)$ to $(Y,e)$ satisfies $e(Tx,Ty)\le qd(x,y)$ for
        every $x,y$ with a single $0\le q<1$. A contraction of a nonempty complete
        metric space into itself has exactly one fixed point, to which every Picard
        iteration converges. Starting with $x_0$, put $x_{n+1}=Tx_n$. Successive distances
        are at most $q^nd(x_0,x_1)$. The triangle inequality bounds $d(x_n,x_{n+p})$
        by $q^nd(x_0,x_1)/(1-q)$ for $p\ge1$, so completeness gives a limit $x$. Lipschitz
        continuity implies $Tx=\lim Tx_n=x$. Two fixed points would satisfy $d(x,y)\le
        qd(x,y)$ and hence coincide.


        Every real fixed point of cosine lies in $[-1,1]$. Cosine maps that complete
        interval into itself and $|\sin t|\le\sin1<1$ there. The mean value theorem
        and the fixed point theorem give existence and uniqueness on the interval
        and hence on the real line.


        For a differentiable map on an open set containing a segment $[a,b]$ with
        derivative operator norm bounded by $M$ there, the mean value inequality gives
        $\|f(b)-f(a)\|\le M\|b-a\|$. Apply it using the maximum norm on the closed
        square $K=[-1/2,1/2]^2$. Each cosine lies in $[\cos(1/2),1]$, so the first
        component belongs to $[\cos(1/2)-1/2,1/2]$ and the second to $[-(1-\cos(1/2)),1-\cos(1/2)]$,
        both contained in $[-1/2,1/2]$. The derivative rows are $(-\sin x/2,-\sin
        y/2)$ and $(-\sin x,\sin y)$. Their absolute row sums are at most $2\sin(1/2)<1$
        by $\sin t<t$ for positive $t\le 1/2$. Convexity keeps each segment inside
        $K$. This is a contraction on a nonempty complete self-mapped square and provides
        a fixed point for $f$.

        '
