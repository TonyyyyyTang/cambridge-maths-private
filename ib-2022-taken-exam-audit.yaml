      result: agreement after independent derivation
      comparison: Each lower tensor index uses the inverse boost. All six transformed
        field components, wire line charge and negative current direction agree with
        the radial Gauss flux and azimuthal Ampere circulation.
      frozen_rework_text: '# IB 2022 Paper 3, 15D

        (a) $X''^\mu=\Lambda^\mu{}_\nu X^\nu$, giving $t''=\gamma(t-vx/c^2)$, $x''=\gamma(x-vt)$,
        $y''=y$, $z''=z$.


        (b) The displayed $F$ has lower indices. The coordinate transformation gives
        $F''=(\Lambda^{-1})^T F\Lambda^{-1}$; $\Lambda^{-1}$ is the given matrix with
        $v$ reversed. In the $0,1$ block the determinant is one, so $F''_{01}=F_{01}$.
        For $j=2,3$, $F''_{0j}=\gamma(F_{0j}+(v/c)F_{1j})$ and $F''_{1j}=\gamma((v/c)F_{0j}+F_{1j})$.
        Also $F''_{23}=F_{23}$. Reading the six independent components gives

        \[

        E''_x=E_x,\quad E''_y=\gamma(E_y-vB_z),\quad E''_z=\gamma(E_z+vB_y),

        \]

        \[

        B''_x=B_x,\quad B''_y=\gamma(B_y+vE_z/c^2),\quad B''_z=\gamma(B_z-vE_y/c^2).

        \]


        (c) Put the wire on the $x$ axis and let $r$ be the perpendicular distance,
        $\mathbf e_\phi=\mathbf e_x\times\mathbf e_r$. In its rest frame, cylindrical
        and reflection symmetries and Gauss''s law on a length $L$ give $E_r(2\pi
        rL)=\lambda L/\epsilon_0$. Steady stationary charges supply no magnetic field.
        Thus at $r>0$, $\mathbf E=\lambda\mathbf e_r/(2\pi\epsilon_0r)$ and $\mathbf
        B=0$, for fields produced by the isolated wire. For the observer moving in
        $+x$ the transverse distance is unchanged and the result of (b) becomes $\mathbf
        E''=\gamma\lambda\mathbf e_r/(2\pi\epsilon_0r)$ and $\mathbf B''=-\mu_0\gamma
        v\lambda\mathbf e_\phi/(2\pi r)$, since $\mu_0\epsilon_0c^2=1$. Proper line
        elements contract along the wire, giving $\lambda''=\gamma\lambda$ and $I''=-v\lambda''$.
        Gauss''s law for $\lambda''$ and Ampère''s circulation law $2\pi r B''_\phi=\mu_0
        I''$ for the steady moving-frame current reproduce the two fields.

        '
