      canonical_sha256: 1e952197e60940ef6b45abd9fb19f1a2dc547193c925d341452968fd03e0ac3f
      result: agreement after independent derivation
      comparison: The transform differentiation sign, exponential inversion for complex
        positive-real-part width, both strip boundary multipliers and zero Fourier
        mode agree. Inverse widths 2a-y and 2a+y yield the required harmonic function
        and both traces.
      frozen_rework_text: '# IB 2022 Paper 4, 14B

        (a) Under the given convention, $\widetilde{m''}=[m(x)e^{-ikx}]_{-\infty}^\infty+ik\int_{\mathbb
        R} m(x)e^{-ikx}\,dx=ik\tilde m(k)$ by integration by parts and decay (with
        the transforms interpreted wherever they exist).


        (b) Split the inverse integral at zero and substitute $t=-k$ on the negative
        half-line. As $\operatorname{Re}\alpha>0$ the exponentials are integrable
        and the result is

        \[

        -\frac i2\int_0^\infty [e^{-(\alpha-ix)t}-e^{-(\alpha+ix)t}]\,dt=-\frac i2\left[\frac1{\alpha-ix}-\frac1{\alpha+ix}\right]=\frac{x}{x^2+\alpha^2}.

        \]


        (c)(i) Transforming in $x$ gives $\partial_{yy}\tilde u-k^2\tilde u=0$ (Fourier
        differentiation twice). With $s=|k|>0$, its unique solution obeying the endpoint
        conditions is

        \[

        \tilde u=\frac{\sinh(s(a-y))\,\tilde f+\sinh(sy)\,\tilde g}{\sinh(sa)}.

        \]

        Indeed the numerator solves the ODE and the quotient has the required boundary
        values. At $k=0$ take the affine solution $(1-y/a)\tilde f(0)+(y/a)\tilde
        g(0)$.


        (ii) Part (b) gives $\tilde g=-i\pi\operatorname{sgn}(k)(e^{-as}-e^{-3as})$.
        The terms may be understood as Fourier transforms in the improper or distributional
        sense; their difference is integrable as a function of $x$ and odd, with zero
        transform at $k=0$. Substituting and using $e^{-as}-e^{-3as}=2e^{-2as}\sinh(as)$
        gives

        \[

        \tilde u=-i\pi\operatorname{sgn}(k)\left(e^{-(2a-y)s}-e^{-(2a+y)s}\right).

        \]

        This extends to $\tilde u(0,y)=0$. Applying (b) to both positive widths gives

        \[

        u(x,y)=\frac{x}{x^2+(2a-y)^2}-\frac{x}{x^2+(2a+y)^2}.

        \]

        At $y=0$ the terms cancel; at $y=a$ the widths are $a,3a$. Both denominators
        are nonzero throughout the closed strip and the result decays as $|x|\to\infty$.

        '
