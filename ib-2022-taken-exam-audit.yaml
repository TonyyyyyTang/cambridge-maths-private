      result: agreement after independent derivation
      comparison: Polar radial and tangent components give equal and opposite divergence
        terms for positive radius. The stream-function derivatives in the stated orientation
        give d sin(theta)/r plus a constant, including the zero-vector case.
      frozen_rework_text: '# IB 2022 Paper 3, 7C

        Write $D=|\mathbf d|$. In the aligned polar basis $\mathbf x=r\mathbf e_r$
        and $\mathbf d=D(\cos\theta\,\mathbf e_r-\sin\theta\,\mathbf e_\theta)$. Substitution
        gives $u_r=D\cos\theta/r^2$ and $u_\theta=D\sin\theta/r^2$. For $r>0$ the
        divergence is $r^{-1}[-D\cos\theta/r^2+D\cos\theta/r^2]=0$. Use $u_r=r^{-1}\partial_\theta\psi$
        and $u_\theta=-\partial_r\psi$. The first equation gives $\psi=D\sin\theta/r+g(r)$
        and the second $g''=0$. Hence $\psi=D\sin\theta/r+C$, a single-valued function
        on the punctured plane. For $D=0$ the axes are arbitrary and the constant
        stream function suffices.

        '
