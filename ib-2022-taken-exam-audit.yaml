      frozen_rework_text: '# IB 2022 Paper 2, 12A

        (a) The answer is $2\pi i\sum_{\operatorname{Im}z_j>0}\operatorname{Res}_{z=z_j}(P(z)e^{iz}/Q(z))$,
        summed over distinct poles. On an upper semicircle of radius $N$ beyond all
        poles, $|e^{iz}|\le1$ and $|P/Q|\le C/N^2$ uniformly by the leading coefficients
        and degree gap. Its arc integral is bounded by $\pi C/N$. The oriented real
        interval runs left to right and its integral converges absolutely as $N\to\infty$.
        The residue theorem now gives the claim including multiple poles.


        (b) Use $R=z/(1+z^4)$. Put $s=1/\sqrt2$. The simple upper poles are $u=s(1+i)$
        and $w=s(-1+i)$, with squares $i,-i$. Their residues are $e^{iz}/(4z^2)$ evaluated
        at each pole. Their sum is $e^{-s}(-ie^{is}+ie^{-is})/4=e^{-s}\sin(s)/2$.
        Taking the imaginary part of the expression in (a) yields $\pi e^{-1/\sqrt2}\sin(1/\sqrt2)$.

        '
