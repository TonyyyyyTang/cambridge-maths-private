      result: agreement after independent derivation
      comparison: Successive returns give the geometric tail, including the recurrent
        atom at infinity. For a transient chain the first-hit and finite Green-sum
        argument proves the claimed limit for each pair of states.
      frozen_rework_text: '# IB 2022 Paper 4, 7H

        (a) Let $r_i=\mathbb P_i(T_i<\infty)$ and take time zero as visit 1. By the
        strong Markov property at successive finite return times, $\mathbb P_i(V_i\ge
        m)=r_i^{m-1}$, $m\ge1$, starting from $\mathbb P_i(V_i\ge1)=1$. If $r_i<1$,
        subtract successive tails to obtain $\mathbb P_i(V_i=m)=(1-r_i)r_i^{m-1}$,
        a geometric distribution on the positive integers (unit mass at 1 if $r_i=0$).
        If the chain is recurrent, $r_i=1$ and the tails show $V_i=\infty$ almost
        surely. Thus the wording in (a) needs the extended parameter-zero geometric
        convention or a transient-case qualification.


        (b) With transience, $r_j<1$ for each $j$, so $\mathbb E_jV_j=1/(1-r_j)$.
        Let $H_j=\inf\{n\ge0:X_n=j\}$ to include an initial visit. Strong Markov at
        $H_j$ gives $\mathbb E_iV_j=\mathbb P_i(H_j<\infty)\mathbb E_jV_j<\infty$.
        Tonelli gives $\sum_{n\ge0}P^n(i,j)=\mathbb E_iV_j$. Terms of this convergent
        nonnegative series tend to zero, for every $i,j$.

        '
