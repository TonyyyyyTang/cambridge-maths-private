      result: agreement after independent derivation
      comparison: The differentiated plane wave gives real beam momentum and nonnegative
        energy. Current continuity removes x dependence. Interference terms are real
        in the flux calculation, and equal asymptotic speeds justify squared-amplitude
        fractions.
      frozen_rework_text: '# IB 2022 Paper 3, 6B

        (a) For the free Hamiltonian $-\hbar^2\partial_x^2/(2m)$ and momentum $-i\hbar\partial_x$,
        differentiating the plane wave twice and once gives $E=\hbar^2 k^2/(2m)$ and
        $p=\hbar k$. A physical beam has real wave number, positive mass, and nonzero
        amplitude. Thus $E\ge0$, with equality at $k=0$. These are generalized eigenstates
        on the full line. For a formally complex $k$ the differential identities alone
        still hold, without supplying such a free momentum eigenstate.


        (b) $\rho=\psi^*\psi$ and $J=\hbar(\psi^*\partial_x\psi-\psi\partial_x\psi^*)/(2mi)$.
        At fixed real energy $\psi=\phi(x)e^{-iEt/\hbar}$, so $\rho=|\phi|^2$ is time
        independent. Continuity gives $\partial_xJ=0$.


        (c) For $a e^{ikx}+b e^{-ikx}$ the interference terms in $\psi^*\partial_x\psi$
        are real, giving $J=(\hbar k/m)(|a|^2-|b|^2)$. Hence the asymptotic currents
        are $(\hbar k/m)(1-|R|^2)$ on the left and $(\hbar k/m)|T|^2$ on the right.
        They agree by (b). The incoming beam has $k>0$ and division gives $|R|^2+|T|^2=1$.
        The reflected and transmitted flux fractions, here the two squared amplitudes
        because both channels have the same speed, exhaust the incident probability.

        '
