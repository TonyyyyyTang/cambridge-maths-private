      canonical_sha256: c8f3cd17193f878ece04b85db8f7373289e535ea12e8574a536e769d63766174
      result: agreement after independent derivation
      comparison: Quadratic exactness fixes weights (1,-2,1). The left and right Peano
        kernels have opposite signs and norm 1/3. Continuous third derivatives approaching
        their signs prove sharpness without requiring an extremizer.
      frozen_rework_text: '# IB 2022 Paper 1, 17C

        (a) Third derivatives vanish on polynomials of degree at most two, so the
        scheme must be exact on $1,x,x^2$. The equations are $a_{-1}+a_0+a_1=0$, $-a_{-1}+a_1=0$,
        $a_{-1}+a_1=2$. Thus the coefficients are $1,-2,1$.


        (b) Peano''s kernel representation for a linear functional $L$ annihilating
        degree at most $m-1$ says $L(f)=\int_a^b K(t)f^{(m)}(t)\,dt$ with $K(t)=L_x[(x-t)_+^{m-1}/(m-1)!]$,
        under interchange of $L$ with the Taylor-remainder integral, e.g. bounded
        sums of point derivatives through order $m-1$ on $C^{m-1}$ and $f\in C^m$.
        The kernel can be defined up to isolated values at evaluation points. This
        follows by applying $L$ to Taylor''s integral formula, interpreting the last
        derivative of the truncated power almost everywhere under the integral. Here
        $m=3$ and the evaluation includes a second derivative at zero. For $-1<t<0$,
        $K=1+t^2-(1-t)^2/2=(1+t)^2/2$. For $0<t<1$, $K=-(1-t)^2/2$. Thus $|e(f)|\le\|f''''''\|_\infty\int_{-1}^1|K|=\|f''''''\|_\infty/3$.


        (c) Choose continuous third derivatives $f_j''''''(t)=-\tanh(jt)$, integrate
        three times, and take zero initial primitives. These have sup norm at most
        one and converge to $\operatorname{sgn}K$ except at zero and the irrelevant
        endpoints. Dominated convergence gives $e(f_j)\to1/3$, ruling out every smaller
        constant. A continuous third derivative need not attain equality.

        '
