      canonical_sha256: 8b9ed7e8c0288e62a8efa8babb6555c3bc54a2cf53271efb413c26d98f5d60ba
      result: agreement after independent derivation
      comparison: Likelihood factorization and the likelihood-ratio equivalence criterion
        prove minimal sufficiency. The upper binomial rejection tail is UMP, including
        the endpoint pi=1 and possible randomization. The interior one-restriction
        Wilks limit and supremum convention are appropriate.
      frozen_rework_text: '# IB 2022 Paper 4, 17H

        (a) A statistic is sufficient if the conditional distribution of the sample
        given it is independent of the parameters. A minimal sufficient statistic
        is sufficient and a function of every other sufficient statistic (up to null
        sets). Write $q=e^{-\lambda}$, $z=n_0$ and $s=S$. The likelihood is $[\prod_i
        (x_i!)^{-1}][\pi+(1-\pi)q]^z[(1-\pi)q]^{n-z}\lambda^s$. Factorization gives
        sufficiency including $\pi=1$ with evident zero-power conventions. In the
        positive-support subfamily $\pi<1$, the likelihood ratio for two samples is
        a fixed factorial factor times $\lambda^{\Delta s}[1+\pi e^\lambda/(1-\pi)]^{\Delta
        z}$. A parameter-independent ratio must have $\Delta s=0$ by taking $\pi=0$
        and varying $\lambda$. Holding $\lambda$ fixed and varying $\pi<1$ then forces
        $\Delta z=0$. The converse follows by factorization. The likelihood-ratio
        criterion therefore gives minimality already on the subfamily. Every sufficient
        statistic for the full family is sufficient for that subfamily, which gives
        positive probability to every individual sample, proving full-family minimality
        as well.


        (b) For $\lambda=\lambda_0$, $L(1/2)/L(0)=2^{-n}(1+e^{\lambda_0})^{n_0}$.
        Reject for large $n_0$, whose null law is $\operatorname{Bin}(n,e^{-\lambda_0})$.
        For an exact deterministic upper tail of size $\alpha$, take its corresponding
        threshold. In general choose $c$ with $\Pr_0(Z>c)\le\alpha\le\Pr_0(Z\ge c)$
        and reject for $Z>c$, randomizing at $Z=c$ with probability $(\alpha-\Pr_0(Z>c))/\Pr_0(Z=c)$.
        At any $0<\pi<1$, the alternative/null ratio is $(1-\pi)^n[1+\pi e^{\lambda_0}/(1-\pi)]^{n_0}$,
        strictly increasing with $n_0$. Thus the same test is Neyman–Pearson most
        powerful for each alternative. At $\pi=1$ the alternative puts all mass on
        $Z=n$, precisely the binomial outcome assigned highest rejection priority
        by the test. The test is UMP on $0<\pi\le1$.


        (c) At the null $\pi=1/2$, both $\lambda>0$ and $\pi$ are interior, with one
        restriction. The model is smooth near the null, identifiable (ratios of positive
        counts identify $\lambda$; their masses then identify $\pi$), and locally
        nonsingular: positive-count log scores in $\lambda$ vary with $x$ while the
        $\pi$ score is the nonzero constant $-1/(1-\pi)$ there. All relevant score
        moments are finite. Wilks''s theorem gives $W\Rightarrow\chi^2_1$. Reject
        above the $1-\alpha$ quantile for asymptotic size $\alpha$. Strictly, on an
        all-zero finite sample the restricted supremum is approached at $\lambda\downarrow0$
        and is not attained for $\lambda>0$; using suprema gives $W=0$ on that event,
        whose probability under any fixed null $\lambda>0$ vanishes exponentially.

        '
