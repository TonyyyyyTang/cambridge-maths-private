frozen_blind_rework_markdown: '# Independent rework of the Methods Sheet 1 sample


  Sampling frame q01–q12 and qx01–qx09 sorted as strings, random.Random(20261127).sample(frame,
  5), in draw order q02, qx07, q09, q10, q05. I worked from the selected questions
  and archived question pages. The project status and source metadata contain historical
  notes; the qx07 source-variant note itself mentions the rescaling relation to q02.
  I instead computed qx07 directly by distributional differentiation. I had not opened
  any stored solution, check, comparison, or detailed audit before freezing this document.


  ## q02


  Evenness kills all sine coefficients. The constant is the integral from zero to
  one of 1-2x²+x⁴, namely 8/15. The nth cosine coefficient is the integral over [-1,1]
  of f(x)cos(kx), k=nπ. At both ends sin(kx) and f'' vanish. Four integrations by
  parts give minus [f''''''cos(kx)] from -1 to 1 divided by k⁴ plus the integral of
  f''''''''cos(kx) divided by k⁴. The latter vanishes since f''''''''=24. As f''''''(x)=24x
  the coefficient is 48(-1)^(n+1)/(nπ)⁴. The continuous piecewise smooth periodic
  function satisfies pointwise Fourier inversion, including at the joins; absolute
  summability also gives uniform convergence. Sketch symmetric humps at 2j of height
  1, falling to 0 with horizontal tangent at odd integers; the second derivative is
  12x²-4 with matching endpoint value 8. The third derivative jumps from 24 to -24
  at each join, so the extension is C², not three times differentiable there. This
  jump accounts for a nonzero boundary term in the fourth integration and exact n^-4
  order.


  ## qx07


  Write the period circle as [-π,π]. The periodic quartic F, F'' and F'''' have matching
  endpoint traces (0,0,8π²). Inside F''''''=24θ, which drops by 48π at π modulo the
  period. Its distributional derivative is 24 minus a point mass of weight 48π at
  the join. At any nonzero mode, therefore, (in)^4 c_n=-(48π)/(2π) exp(-inπ)=-24(-1)^n.
  The mean is π⁴(1-2/3+1/5)=8π⁴/15. Pair positive and negative frequencies if a real
  sketch is wanted. By Fourier inversion for a periodic continuous, piecewise smooth
  function, equality holds everywhere; the computed fourth-power decay also implies
  uniform absolute convergence. The arches ascend from 0 at (2j-1)π to π⁴ at 2jπ then
  descend to 0 at (2j+1)π, all with horizontal tangents. Inflection at local coordinates
  ±π/√3. There are exactly two continuous derivatives. Cancellations in the real series
  at particular points do not change the exact order of the complex coefficients.


  ## q09


  Let U=(x²-1)^n. U^(n) has leading coefficient (2n)!/n!, hence q_n has degree n and
  leading coefficient A_n=(2n)!/[2^n(n!)²]. Expanding near 1 gives U=(x-1)^n(2+x-1)^n,
  so U^(n)(1)=2^n n! and q_n(1)=1. Differentiate (x²-1)U''-2nxU=0 exactly n+1 times.
  Product rule yields coefficients x²-1, 2x, -n(n+1) on U^(n+2), U^(n+1), U^(n). Thus
  q_n satisfies the standard Legendre equation. Any nonzero polynomial solution has
  degree n: matching its top term of degree s gives s(s+1)=n(n+1). Two solutions must
  then be proportional, because eliminating the leading coefficient otherwise gives
  a nonzero lower-degree solution. Normalization at 1 identifies P_n. Next integrate
  x^m U^(n) by parts n times. Every derivative of U of order <n vanishes at both endpoints,
  so the moment is zero for each nonnegative integral m<n. Since P_n-A_n x^n has degree
  <n, the squared norm reduces to A_n times the nth moment = (A_n/2^n)∫(1-x²)^n dx
  on [-1,1]. Substituting x=2t-1 gives the latter integral 2·4^n B(n+1,n+1)=2·4^n(n!)²/(2n+1)!,
  so the norm is 2/(2n+1). A negative exponent, if allowed by a literal m<n, lies
  outside the polynomial-moment convention and can make the integral divergent.


  ## q10


  For A(r)=J_m(αr), B(r)=J_m(βr), subtract A(rB'')'' from B(rA'')'', or rearrange
  the given ODEs, to obtain (r(AB''-BA''))''=(α²-β²)rAB. At zero the boundary term
  vanishes: for positive integral order m both functions are O(r^m) and derivatives
  O(r^(m-1)); at order zero functions are bounded and derivatives O(r). Negative integral
  order, if desired, follows by J_-m=(-1)^m J_m. Evaluate the remaining boundary term
  at 1 and divide by α²-β² to recover the displayed formula, with numerator βJ_m(α)J''_m(β)-αJ_m(β)J''_m(α).
  If parameters are arbitrary signed reals, α≠β alone fails for β=-α. The formula
  with the quotient applies off α²=β²; for distinct nonnegative parameters the printed
  condition suffices. On distinct positive zeros orthogonality follows. Fix α=j>0
  a zero and let β→j. The quotient is -jJ_m(β)J''_m(j)/(j²-β²), tending to J''_m(j)²/2.
  The integral itself is continuous by boundedness on the compact parameter neighborhood
  times [0,1].


  ## q05


  Write ξ_n=2πn/L. Periodicity kills all boundary terms, giving f-hat_n=(iξ_n)^(-N)
  times the nth Fourier coefficient of f^(N) for n≠0. Its magnitude is at most (L/(2π|n|))^N||f^(N)||∞.
  Choosing integer N>k gives rapid decay. For example take a real function with absolutely
  uniformly convergent expansion Σ_{n∈Z} 2^(-|n|) exp(iξ_n θ); termwise integration
  gives exactly the nonzero indicated coefficients. For the extra part the terms have
  summable sup norms b^-n and integer frequencies a^n, proving continuity and periodicity
  of the limit. Integrating termwise shows the coefficient at k=a^n is b^-n=k^(-log
  b/log a); at other frequencies it is zero. Fix b=2 and choose a sufficiently large
  to beat any proposed positive universal power of decay, as small an exponent as
  desired. There is no uniform positive power bound over all continuous periodic functions
  even allowing the constant to depend on the function. The 2024 question ends after
  (ii).

  '
