  qx10-1ac9532e39f2:
    exact_question_sha256: 1ac9532e39f2dd24fec4b3dbf626463304babf8e2f7243e5dd236de82558e788
    solution_sha256: 093fdae3656d34dc64e8a1f4e501249c16ab1a3ed9585541ffe508efaa4867e2
    independent_rework: "# The suspended cable\n\nFor an autonomous Lagrangian,\n\\\
      [\n\\frac{d}{dx}(f-y'f_{y'})=y'(f_y-d f_{y'}/dx)=0\n\\]\nalong each smooth Euler–Lagrange\
      \ solution. For the cable augment the integrand by a constant times the length\
      \ integrand. In the form \\(f=(y-y_0)\\sqrt{1+y'^2}\\), the first integral becomes\
      \ \\((y-y_0)/\\sqrt{1+y'^2}=c\\). The multiplier is legitimate since an abnormal\
      \ stationary length curve between fixed points would be straight and have length\
      \ \\(2a\\), excluded by \\(L>a\\). The full Euler–Lagrange equation gives \\\
      ((y-y_0)y''=1+y'^2\\); in particular \\(c\\ne0\\) and there is no spurious constant\
      \ solution on a turning interval. It follows that \\((\\operatorname{arsinh}\
      \ y')'=1/c\\), so \\(y-y_0=c\\cosh((x-x_0)/c)\\).\n\nThe equal heights require\
      \ \\(x_0=0\\) by evenness and strict increase of \\(\\cosh\\) on the positive\
      \ axis. Then \\(y_0=b-c\\cosh(a/c)\\). The upward-convex hanging branch has\
      \ \\(c>0\\), and the length gives \\(L=c\\sinh(a/c)\\). Set \\(u=a/c>0\\). The\
      \ function \\(\\sinh u/u\\) increases strictly from 1 to infinity since \\(u\\\
      cosh u-\\sinh u\\) has derivative \\(u\\sinh u>0\\) and value zero at the origin.\
      \ Thus each \\(L/a>1\\) gives exactly one positive \\(c\\).\n\nTo verify the\
      \ minimum and the sign globally, parametrise any competing cable by arclength\
      \ \\(s\\in[-L,L]\\) increasing left to right along the cable. The unit tangent\
      \ satisfies \\(x_s^2+y_s^2=1\\). Integrating by parts gives \\(E=2Lb-\\int_{-L}^L\
      \ s\\,y_s\\,ds\\). For the positive \\(c\\) just found,\n\\[\n s\\,y_s+c\\,x_s\\\
      le\\sqrt{s^2+c^2},\\qquad \\int_{-L}^L x_s\\,ds=2a.\n\\]\nThis bounds the integral\
      \ of \\(s\\,y_s\\) above. Equality holds precisely for tangent \\((x_s,y_s)=(c,s)/\\\
      sqrt{s^2+c^2}\\) almost everywhere. Its horizontal displacement is \\(2c\\,\\\
      operatorname{arsinh}(L/c)=2a\\), and its vertical displacement is zero. Integrating\
      \ yields \\(x=c\\,\\operatorname{arsinh}(s/c)\\), \\(y=y_0+\\sqrt{s^2+c^2}\\\
      ), exactly the curve above.\n\n## Source appearances\n\n- `raw/sheets/IB/methods/2001-02/sheet-3.pdf`,\
      \ physical page 2, printed question 10.\n- `raw/sheets/IB/methods/2003-04/sheet-3.pdf`,\
      \ physical page 2, printed question 10.\n- `raw/sheets/IB/methods/2004-05/sheet-3.pdf`,\
      \ physical page 2, printed question 10.\n"
    independent_rework_sha256: fad3ebcf79883e52beabdd8552215869d97a95f56d64bcacc50511ec9dfe3fdf
    main_comparison: The first integral and constrained hanging branch agree, with
      a unique positive c determined by L=c sinh(a/c). The auditor and paired answer
      verify the global arclength bound, including equality and the endpoint span.
    script_sha256: ee9da854cc248cc965a022f2ce4722bcd9705ef45c9934059b6ffe5a15e39f92
    check_output: ''
    check_exit: 0
  qx14-62aac5eb4dbd:
    exact_question_sha256: 62aac5eb4dbddf70b6e34190eef77737e34db1fbba5cb51317a096c5ca157782
    solution_sha256: 6feca2e2c062b835c4bf6f8743a1b68ca722875d230d40c3600de5637b695019
    independent_rework: '# Derivatives of orthogonal eigenfunctions


      Use self-adjoint boundary conditions for which the stronger individual endpoint
      term \([p y_m'' y_n]_a^b\) vanishes for every pair under consideration. This
      holds with fixed homogeneous Dirichlet or Neumann conditions at each end. Multiplication
      of \(-(p y_m'')''+q y_m=\lambda_m y_m\) by \(y_n\) gives

      \[

      \int_a^b (p y_m''y_n''+q y_my_n)\,dx=\lambda_m\int_a^b y_my_n\,dx+[p y_m''y_n]_a^b
      .

      \]

      Swap the indices and subtract. The symmetry then implies \((\lambda_m-\lambda_n)\int
      y_my_n=0\). For distinct eigenvalues the modes are orthogonal, and for equal
      indices the specified normalization gives unit norm. If an eigenvalue is repeated,
      choose an orthonormal basis inside its eigenspace. Normalization alone would
      not force two arbitrary vectors in the same eigenspace to be orthogonal. Under
      these conditions the answer is \(\lambda_m\delta_{mn}\). For general Robin data
      the boundary terms in the two identities can be equal without either one vanishing,
      so such data require retaining the displayed endpoint term.


      Legendre''s equation has \(p=1-x^2,\ q=0,\ \lambda_m=m(m+1)\). All polynomials
      and their derivatives are finite at both ends, where \(p=0\). The unnormalised
      Legendre polynomials with \(P_m(1)=1\) have \(\int P_mP_n=2\delta_{mn}/(2m+1)\).
      To check the diagonal norm, Rodrigues'' formula gives leading coefficient \(A_m=(2m)!/[2^m(m!)^2]\).
      Integrating the Rodrigues expression for one factor \(m\) times by parts, the
      boundary terms vanish from the order-\(m\) zeros of \((x^2-1)^m\); hence \(\int
      P_m^2=(A_m/2^m)\int_{-1}^1(1-x^2)^m\,dx\). The last integral is \(2^{2m+1}(m!)^2/(2m+1)!\),
      by the substitution \(x=2t-1\) and the integer beta integral. Thus

      \[

      \int_{-1}^1(1-x^2)P_m''P_n''\,dx=\frac{2m(m+1)}{2m+1}\delta_{mn}.

      \]

      This includes degree zero, whose derivative vanishes.


      ## Source appearances


      - `raw/sheets/IB/methods/2006-07/sheet-3.ps`, physical page 1, printed question
      4.

      - `raw/sheets/IB/methods/2007-08/sheet-3.pdf`, physical page 1, printed question
      4.

      '
    independent_rework_sha256: 7414fc831b3057ef49be742459fe82bf36e158abd424258ac617171c320ffd52
    main_comparison: All derive the energy identity by parts with the individual endpoint
      form vanishing. They retain normalization in a repeated eigenspace and recover
      the Legendre value 2m(m+1)/(2m+1) on the diagonal, including degree zero.
    script_sha256: ea961309a8737fe310e1ca742c6c9e1c6eda9c0ba97becc64512381886d2ebae
    check_output: ''
    check_exit: 0
  q04-7862e20b0782:
    exact_question_sha256: 7862e20b07828e5b40e402e342b53684959a9170e3f0fcacd30a83277489401d
    solution_sha256: 8b2ad051061120518fc17864c8a720f547ecc3e9d7935d8c326e2c542412dc84
    independent_rework: "# The Green function with positive second derivative\n\n\
      Let \\(r=\\min(x,\\xi),\\ s=\\max(x,\\xi)\\). On either side of an interior\
      \ impulse, solutions of \\(G''=\\lambda^2G\\) vanishing at the nearer boundary\
      \ are multiples of \\(u(x)=\\sinh(\\lambda x)\\) on the left and \\(v(x)=\\\
      sinh(\\lambda(1-x))\\) on the right, when \\(\\lambda\\ne0\\). Continuity eliminates\
      \ a possible delta derivative. Thus set \\(G=C u(r)v(s)\\). Its slope jump is\n\
      \\[\n C(u(\\xi)v'(\\xi)-u'(\\xi)v(\\xi))=-C\\lambda\\sinh\\lambda.\n\\]\nIntegrating\
      \ the equation across \\(\\xi\\) gives jump \\(+1\\). Hence \\(C=-1/(\\lambda\\\
      sinh\\lambda)\\).\n\nSplitting \\(y=\\int_0^1G(x,\\xi)f(\\xi)\\,d\\xi\\) at\
      \ \\(x\\) gives\n\\[\ny=-\\frac{\\sinh(\\lambda x)\\int_x^1f(\\xi)\\sinh(\\\
      lambda(1-\\xi))\\,d\\xi+\n\\sinh(\\lambda(1-x))\\int_0^xf(\\xi)\\sinh(\\lambda\\\
      xi)\\,d\\xi}{\\lambda\\sinh\\lambda}.\n\\]\nFor continuous \\(f\\) this solution\
      \ has \\(y''-\\lambda^2y=f\\) and both endpoint values zero. If \\(\\lambda=0\\\
      ), either match affine functions directly or use \\(\\sinh z=z+O(z^3)\\) to\
      \ obtain \\(G=-r(1-s)\\), with the same unit derivative jump. For every real\
      \ \\(\\lambda\\) uniqueness follows by multiplying the homogeneous equation\
      \ by the conjugate solution and integrating. The boundary term vanishes, forcing\
      \ \\(\\int_0^1(|y'|^2+\\lambda^2|y|^2)=0\\).\n\nThe formula extends continuously\
      \ to \\(\\xi=0,1\\), with value zero in each case. The unit-jump statement concerns\
      \ an impulse in the open interval. A boundary delta acts as zero on homogeneous\
      \ Dirichlet test functions, and the endpoint extension makes no contribution\
      \ to the forcing integral. A one-sided jump at an endpoint would require a separately\
      \ specified boundary-forcing convention.\n\n## Source appearances\n\n- `raw/sheets/IB/methods/2015-16/all-sheets.pdf`,\
      \ physical page 5, printed question 2.\n- `raw/sheets/IB/methods/2018-19/sheet-3.pdf`,\
      \ physical page 1, printed question 2.\n- `raw/sheets/IB/methods/2020-21/sheet-3.pdf`,\
      \ physical page 1, printed question 2.\n- `raw/sheets/IB/methods/2021-22/sheet-3.pdf`,\
      \ physical page 1, printed question 2.\n- `raw/sheets/IB/methods/2022-23/sheet-3.pdf`,\
      \ physical page 1, printed question 2.\n"
