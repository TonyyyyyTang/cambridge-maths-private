      in the early inclusive formulation require a separate convention.
    script_sha256: 1ef08694af18202cce01547bc7b532372f4494abb40bcc55867d894c8196d343
    check_output: Nonzero and zero-mass Dirichlet kernels and the resonant projection
      checked.
    check_exit: 0
  q04-a9257a7804dd:
    exact_question_sha256: a9257a7804dd730a10dbe49575325e8bca711be5970a8a450a63a2958f5f14c5
    solution_sha256: 6c4339fc6e22ab2b801d877ade50a782039579c29897a8c9716cf5142f67f552
    independent_rework: '# Dirichlet Green function, zero limit and resonance


      For real \(\lambda\ne0\), solve \(Ly=f\) initially from the left. Variation
      of the initial slope gives

      \[

      y(x)=B\sinh(\lambda x)-\int_0^x \sinh(\lambda(x-t))f(t)\,dt/\lambda .

      \]

      The negative sign follows on differentiating the integral twice. Setting \(y(1)=0\)
      determines \(B=\int_0^1\sinh(\lambda(1-t))f(t)\,dt/(\lambda\sinh\lambda)\).
      For \(t<x\), combine the two terms by the addition formula,

      \[

      \sinh(\lambda x)\sinh(\lambda(1-t))-\sinh\lambda\,\sinh(\lambda(x-t))

      =\sinh(\lambda t)\sinh(\lambda(1-x)).

      \]

      Thus, with \(r=\min(x,t)\), \(s=\max(x,t)\), the kernel is \(G=\sinh(\lambda
      r)\sinh(\lambda(1-s))/(\lambda\sinh\lambda)\). Each branch is homogeneous, the
      values match, and its one-sided slopes have difference \(-1\) at the source.
      These properties and its zero boundary values verify \(LG=\delta\). The homogeneous
      initial solution satisfying the left condition is a multiple of \(\sinh(\lambda
      x)\), and the right condition eliminates it.


      Explicitly the result is

      \[

      y=\frac{\sinh(\lambda x)\int_x^1f(t)\sinh(\lambda(1-t))\,dt+

      \sinh(\lambda(1-x))\int_0^x f(t)\sinh(\lambda t)\,dt}{\lambda\sinh\lambda}.

      \]

      As \(\lambda\to0\), \(\sinh z/z\to1\) uniformly over the scaled bounded arguments,
      so \(G\to r(1-s)\) uniformly. This kernel has the Dirichlet boundary values
      and derivative jump \(-1\) for \(-D^2\). Hence its integral supplies the limit
      for integrable \(f\).


      For \(\lambda=i m\pi\), \(m\ge1\), the nonzero homogeneous solution \(\sin(m\pi
      x)\) satisfies both ends. In the initial representation, \(\sinh\lambda=0\),
      so the right condition no longer determines the slope. Instead it requires \(\int_0^1f(t)\sin(m\pi
      t)\,dt=0\), because \(\sin(m\pi(1-t))=(-1)^{m+1}\sin(m\pi t)\). Compatible forcing
      leaves a free sine multiple, and incompatible forcing has no solution.


      ## Source appearances


      - `raw/sheets/IB/methods/2025-26/sheet-3.pdf`, physical page 1, printed question
      4.

      - `raw/sheets/IB/methods/2026-27/sheet-3.pdf`, physical page 1, printed question
      4.

      '
    independent_rework_sha256: 57ce70c307279361da3d3467cf96695945686dc595d94d17752d3bdad2ee4745
    main_comparison: Both kernel signs follow the sign of the leading second derivative
