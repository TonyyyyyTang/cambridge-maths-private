  q06-684b9415948c:
    exact_question_sha256: 684b9415948c259c3f6912bb411fc6909c889f9599ffeaf2791eee6662ae6ab5
    solution_sha256: f928b6c06154d1fc8898927f147c504aaff7f4bca925442c1c8930985feae8ca
    independent_rework: '# The four finite-interval transforms


      Use the angular-frequency transform \(\widehat f(k)=\int_{\mathbb R}f(x)e^{-ikx}\,dx\).
      For \(c>0\) define \(D(s)=\int_{-c}^c e^{-isx}\,dx=2\sin(cs)/s\) when \(s\ne0\),
      and \(D(0)=2c\) by direct integration. Endpoints do not affect this integral.


      1. The truncated constant has transform \(D(k)\).

      2. Multiplication by \(e^{iax}\) replaces \(k\) by \(k-a\). Its transform is
      \(D(k-a)\).

      3. Expanding \(\sin(ax)=(e^{iax}-e^{-iax})/(2i)\) gives \((D(k-a)-D(k+a))/(2i)\).

      4. Expanding \(\cos(ax)=(e^{iax}+e^{-iax})/2\) gives \((D(k-a)+D(k+a))/2\).


      The assigned value of \(D(0)\) covers \(k=0\) and \(k=\pm a\), including coincident
      frequencies at \(a=0\). The sine result is imaginary and odd, and the cosine
      result is real and even. At \(c=0\) the support has measure zero so all transforms
      vanish.


