  qx25-12d830d98581:
    exact_question_sha256: 12d830d98581abd2970a68be85b7a1d7238ac311603faf6ab654b23e987030bc
    solution_sha256: 655082bea347624261776b0c36899d97af945a149504c79b7169e7c13abcf8e4
    independent_rework: '# Inversion at the jump


      With the forward convention \(\widetilde f(k)=\int_{\mathbb R} f(x)e^{-ikx}\,dx\),
      the negative half-line gives zero and the positive half-line gives \(\int_0^\infty
      e^{-(1+ik)x}\,dx=1/(1+ik)=(1-ik)/(1+k^2)\). The single omitted value of \(f(0)\)
      makes no contribution.


      At \(x=0\), invert using a symmetric frequency cutoff. The imaginary part is
      odd, so

      \[

      \frac{1}{2\pi}\int_{-R}^R \frac{1-ik}{1+k^2}\,dk=\frac{\arctan R}{\pi}\longrightarrow\frac12.

      \]

      Absolute convergence fails since \(|\widetilde f|\sim1/|k|\). Separately integrating
      the imaginary part toward each infinity would give divergent logarithms, so
      the symmetric limiting prescription matters.


      More generally the truncated inverse is convolution with \(\sin(Rt)/(\pi t)\),
      an even kernel. At a jump of an integrable, piecewise smooth bounded-variation
      function, Fourier inversion in this sense returns the mean of its left and right
      limits. Here the limits are 0 and 1; changing the value at exactly zero cannot
      change a transform integral. At other \(x\) this \(f\) is continuous and the
      inverse equals \(f(x)\).


      ## Source appearances


      - `raw/sheets/IB/methods/2016-17/sheet-3.pdf`, physical page 2, printed question
      7.

      '
