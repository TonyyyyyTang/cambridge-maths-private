  q04-914c3ed94fc9:
    exact_question_sha256: 914c3ed94fc914de85ef2f7e4f4fe454a03774307f858f8e5b1887b362140bc4
    solution_sha256: 8b2ad051061120518fc17864c8a720f547ecc3e9d7935d8c326e2c542412dc84
    independent_rework: "# Inverting the second derivative minus a constant\n\nFor\
      \ \\(0<\\xi<1\\), let \\(S(z)=\\sinh(\\lambda z)/\\lambda\\) for \\(\\lambda\\\
      ne0\\), and \\(S(z)=z\\) for \\(\\lambda=0\\). Thus \\(S''=\\lambda^2S,\\ S(0)=0,\\\
      \ S'(0)=1\\). For a unit impulse, \\(H(x-\\xi)S(x-\\xi)\\) solves the equation\
      \ on the line, since the function is continuous and its slope jumps by one.\
      \ Add a homogeneous term to fix the right boundary:\n\\[\nG(x,\\xi)=H(x-\\xi)S(x-\\\
      xi)-S(x)S(1-\\xi)/S(1).\n\\]\nFor real \\(\\lambda\\) the denominator is positive.\
      \ The hyperbolic addition formula yields the symmetric expression\n\\[\nG(x,\\\
      xi)=-S(\\min(x,\\xi))S(1-\\max(x,\\xi))/S(1).\n\\]\nFor \\(\\lambda=0\\) this\
      \ is checked directly using \\(S(z)=z\\). Its unit jump, homogeneous branches,\
      \ and vanishing endpoint values verify the kernel.\n\nSuperposition for continuous\
      \ \\(f\\) gives\n\\[\ny(x)=-\\frac{S(x)\\int_x^1 f(\\xi)S(1-\\xi)\\,d\\xi+\n\
      \ S(1-x)\\int_0^x f(\\xi)S(\\xi)\\,d\\xi}{S(1)}.\n\\]\nSubstituting the hyperbolic\
      \ formula gives the requested prefactor \\(-1/(\\lambda\\sinh\\lambda)\\) multiplying\
      \ the two products of hyperbolic sines. The displayed \\(S\\)-form already includes\
      \ the removable zero-parameter limit. A homogeneous solution with zero left\
      \ value is \\(A S(x)\\); its right value forces \\(A=0\\).\n\n## Source appearances\n\
      \n- `raw/sheets/IB/methods/2016-17/sheet-3.pdf`, physical page 1, printed question\
      \ 4.\n"
