  qx07-f54d59ee2aed:
    exact_question_sha256: f54d59ee2aedb1ae76d46b9bac234ce613b446176494947cbafe8d47a4de6f3d
    solution_sha256: f46ca369ba065c2fbb00bfa0a372b5a9d9697dc494d306a9decfafedaafa84c7
    independent_rework: "# Fastest trip between stations at the same height\n\nTake\
      \ \\(x\\) horizontal and \\(y\\) vertically down from the stations, with start\
      \ \\((0,0)\\) and finish \\((l,0)\\). Conservation of energy gives speed \\\
      (\\sqrt{2gy}\\). For any traversable rectifiable path, parametrised absolutely\
      \ continuously and with greatest depth \\(d>0\\), the time is\n\\[\nT=\\int\\\
      frac{\\sqrt{\\dot x^2+\\dot y^2}}{\\sqrt{2gy}}\\,dt.\n\\]\nSet \\(p=(2gd)^{-1/2}\\\
      ), \\(q(y)=\\sqrt{(2gy)^{-1}-p^2}\\). Cauchy–Schwarz gives the pointwise lower\
      \ bound \\(p\\dot x+q(y)|\\dot y|\\) for the integrand. Integrate up to a time\
      \ at which the path attains \\(d\\) and then to the finish. On each leg the\
      \ variation integral for \\(q(y)|\\dot y|\\) bounds the absolute difference\
      \ of a primitive of \\(q\\) at its endpoints. The singularity at zero is integrable;\
      \ truncating \\(q\\) and taking the increasing limit justifies this step. Hence\n\
      \\[\n T\\ \\ge\\ pl+2\\int_0^d q(y)\\,dy\n   =\\frac{l}{\\sqrt{2gd}}+\\pi\\\
      sqrt{\\frac{d}{2g}}\n   \\ \\ge\\sqrt{\\frac{2\\pi l}{g}} .\n\\]\nHere \\(y=d\\\
      sin^2u\\) computes the integral, and equality in the last inequality requires\
      \ \\(d=l/\\pi\\). This lower bound also covers paths that turn back in the horizontal\
      \ direction.\n\nSet \\(r=l/(2\\pi)\\) and take the cycloid \\(x=r(\\theta-\\\
      sin\\theta)\\), \\(y=r(1-\\cos\\theta)\\) for \\(0\\le\\theta\\le2\\pi\\). It\
      \ reaches the stated stations and depth \\(2r=l/\\pi\\). Inside the interval\
      \ \\(ds=2r\\sin(\\theta/2)\\,d\\theta\\), while the speed is \\(2\\sqrt{gr}\\\
      sin(\\theta/2)\\). Thus the traversal time is \\(2\\pi\\sqrt{r/g}=\\sqrt{2\\\
      pi l/g}\\), attaining the bound despite the zero endpoint speeds. The ratio\
      \ \\(dx/dy=\\tan(\\theta/2)\\) tends to zero at both ends, giving the indicated\
      \ vertical tangents.\n\n## Source appearances\n\n- `raw/sheets/IB/methods/2001-02/sheet-3.pdf`,\
      \ physical page 1, printed question 7.\n- `raw/sheets/IB/methods/2003-04/sheet-3.pdf`,\
      \ physical page 1, printed question 7.\n- `raw/sheets/IB/methods/2004-05/sheet-3.pdf`,\
      \ physical page 1, printed question 7.\n"
    independent_rework_sha256: 4378ffc63e36cbaddbefbfbe0627d6e2affe87e7d25134b03a4166187ad28949
    main_comparison: The auditor gave a separate global bound in terms of maximum
      depth, optimized at l/π. The paired proof uses a time-domain Wirtinger bound.
      Both bounds are attained by the same full cycloid and give precisely the printed
      time and vertical tangents.
    script_sha256: 1fb60f1383401dd9c935648cd942d5cb8e4a96134174ffe6afe1e6b01b92a7ff
    check_output: ''
    check_exit: 0
  qx13-85901467296e:
    exact_question_sha256: 85901467296ee396acdeb2c58d1f0e9e10782567b107fb5f30e2cde85ff8507f
    solution_sha256: eaad0c36ef8504b8134e1955e75bef2112a1d61c58659ce83322502eb2362b7b
    independent_rework: '# The Rayleigh quotient and the word “Minimise”


      Work in the regular real setting, with \(p>0\) sufficiently smooth, continuous
      \(q,w\), and positive weighted norm \(M[y]=\int_a^b wy^2>0\) for each candidate.
      Strictly positive \(w\) suffices. Let \(E[y]=\int_a^b(py''^2+qy^2)\) and \(Q=E/M\).
      First take separated homogeneous Dirichlet or Neumann data at each end. Then
      \([py''h]_a^b=0\) for every admissible variation \(h\). For a stationary point
      of \(E\) at fixed \(M=C>0\) a multiplier exists since the derivative of \(M\)
      in direction \(y\) is \(2C\). Stationarity gives

      \[

      0=\tfrac12\delta(E-\lambda M)[h]=[py''h]_a^b+

      \int_a^b (-(py'')''+qy-\lambda wy)h\,dx .

      \]

      Taking compactly supported \(h\) yields the differential equation. Conversely
      a solution with these boundary data annihilates the first variation. Taking
      \(h=y\) gives \(\lambda=E/M\). Since \(\delta Q=(\delta E-Q\delta M)/M\), the
      same calculation proves that stationary quotient values are exactly eigenvalues
      and that each eigenfunction is stationary. Rescaling to \(M=C\) preserves \(Q\),
      so the constrained energy and the quotient have identical minimising directions.


      The printed equivalence with *minimisation* for all eigenfunctions fails. With
      \(p=w=1,\ q=0\), Dirichlet data on \([0,\pi]\), the eigenfunctions \(\sin x,\sin(2x)\)
      have identical positive norm and quotients 1 and 4. Admixing \(\varepsilon\sin
      x\) in \(\sin(2x)\) changes its quotient to \((4+\varepsilon^2)/(1+\varepsilon^2)<4\).
      Thus the second mode does not even locally minimise. Under the regular self-adjoint
      spectral hypotheses expand in normalised eigenfunctions with eigenvalues \(\lambda_1\le\lambda_2\le\cdots\).
      The quotient of a nonzero form-domain vector is \(\sum_j\lambda_j|c_j|^2/\sum_j|c_j|^2\);
      its global minimum is \(\lambda_1\), and adding weighted orthogonality constraints
      against lower modes produces the successive minima. Higher eigenvalues are critical
      values in the unconstrained quotient.


      For general homogeneous Robin data \(p y''=\gamma y\) at one or both ends, self-adjointness
      only cancels the *skew* boundary form. The printed numerator alone retains \([py''h]\).
      At Robin ends use the energy \(E-[\gamma y^2]_a^b\) with the corresponding signed
      contribution only at those ends. Its variation cancels \([py''h]\); testing
      the equation with \(y\) then identifies the corrected quotient. Coupled periodic
      data cancelling the full boundary term also work directly. If the stated weight
      vanishes identically or a candidate has zero weighted norm, the quotient is
      undefined, and no equivalence for that candidate is meaningful.


      ## Source appearances


      - `raw/sheets/IB/methods/2001-02/sheet-3.pdf`, physical page 2, printed question
      13.

      - `raw/sheets/IB/methods/2003-04/sheet-3.pdf`, physical page 2, printed question
      13.

      - `raw/sheets/IB/methods/2004-05/sheet-3.pdf`, physical page 2, printed question
      13.

      '
    independent_rework_sha256: 90a651e52ec0959447f3210b4ef523432818379b2ea605c8caf951fbcc4ec174
    main_comparison: The auditor independently produced two equal-norm Dirichlet eigenfunctions
