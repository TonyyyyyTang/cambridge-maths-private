      positive-norm restriction.
    script_sha256: 476d57a4b7f9a5aed37f33d52eed15fd06c0d756d3d970671984547efe21820f
    check_output: ''
    check_exit: 0
  q12-48c238e5f093:
    exact_question_sha256: 48c238e5f09364c5a9203b5d3de56c5ee575baf55ebe95e9d019dce38b78ac19
    solution_sha256: 972a700f972751af7e7025401ce229bdbaa7c5516e843ea14b8447a6e35ce303
    independent_rework: "# A causal kernel gives Taylor's remainder\n\nFor integer\
      \ \\(n\\ge1\\), set \\(G(t,s)=0\\) when \\(t<s\\), and \\(G(t,s)=(t-s)^{n-1}/(n-1)!\\\
      ) when \\(t>s\\). For \\(n>1\\), derivatives through order \\(n-2\\) match at\
      \ \\(t=s\\), and the order \\(n-1\\) derivative jumps from zero to one. For\
      \ \\(n=1\\) the kernel itself is the unit step. In both cases \\(D_t^n G=\\\
      delta_s\\).\n\nFor continuous \\(f\\) the causal integral is \\(y(t)=\\int_0^t\
      \ (t-s)^{n-1}f(s)\\,ds/(n-1)!\\). Each differentiation through order \\(n-1\\\
      ) lowers the kernel power, giving \\(y^{(n-1)}(t)=\\int_0^t f(s)\\,ds\\), and\
      \ the next derivative gives \\(f(t)\\). All prescribed initial data vanish.\
      \ The difference of two solutions is a polynomial of degree at most \\(n-1\\\
      ) with zero Taylor coefficients at zero, hence vanishes.\n\nFor \\(F\\in C^n\\\
      ), subtract \\(\\sum_{j=0}^{n-1}F^{(j)}(a)(x-a)^j/j!\\) from \\(F(x)\\). The\
      \ difference has the zero initial data at \\(a\\) and \\(n\\)-th derivative\
      \ \\(F^{(n)}\\). Translating the integral gives\n\\[\n F(x)=\\sum_{j=0}^{n-1}\\\
      frac{F^{(j)}(a)(x-a)^j}{j!}+\n \\frac1{(n-1)!}\\int_a^x(x-s)^{n-1} F^{(n)}(s)\\\
      ,ds .\n\\]\nThe formula at \\(x=a\\) is immediate. For \\(x<a\\) use the oriented\
      \ integral, which obeys the same derivative and initial conditions on the other\
      \ side, or apply the positive-time formula to \\(t\\mapsto F(a-t)\\).\n\n##\
      \ Source appearances\n\n- `raw/sheets/IB/methods/2023-24/sheet-3.pdf`, physical\
      \ page 2, printed question 12.\n- `raw/sheets/IB/methods/2025-26/sheet-3.pdf`,\
      \ physical page 2, printed question 12.\n- `raw/sheets/IB/methods/2026-27/sheet-3.pdf`,\
      \ physical page 2, printed question 12.\n"
    independent_rework_sha256: 412804e5457ecec7fbb32ce6f14db6b4b9d6fbc049692cd23e0adccfba8e7bd9
    main_comparison: The causal truncated-power kernel satisfies the jump and all
      zero initial data, including the first-order step case. Translating the convolution
      gives the oriented Taylor integral on either side of the basepoint.
    script_sha256: 6b322ae5232ffee7c48a5266fbbdd480135b1bad81ca877c5547c4b839b8fce5
    check_output: Causal inverse on polynomial forcing and two-sided Taylor remainders
      checked.
    check_exit: 0
  q03-e33c0cce50fb:
    exact_question_sha256: e33c0cce50fbea6dcb277168e8602d6a6beaf226d170e19d90df906648fafbab
    solution_sha256: fe62b9de65e38ec3f166bf790500d4b4380af034b2c3b58033796f099725d9de
    independent_rework: "# A repeated characteristic root with two Dirichlet values\n\
      \nWrite \\(y=e^x u\\). Then \\((D-1)y=e^x u'\\), so \\((D-1)^2y=e^x u''\\),\
      \ with \\(u(0)=u(1)=0\\). To solve \\(u''=h\\), the impulse response for fixed\
      \ \\(0<\\xi<1\\) must be affine on each side, continuous at \\(\\xi\\), vanish\
      \ at the endpoints and have right derivative minus left derivative equal to\
      \ one. Writing \\(r=\\min(x,\\xi)\\), \\(s=\\max(x,\\xi)\\), these conditions\
      \ give \\(K=-r(1-s)\\). Its slopes are \\(\\xi-1\\) on the left and \\(\\xi\\\
      ) on the right.\n\nConsequently the original kernel is \\(G(x,\\xi)=-e^{x-\\\
      xi}r(1-s)\\). The conjugation factors give \\((D_x-1)^2G=e^{x-\\xi}\\delta_\\\
      xi=\\delta_\\xi\\). In particular the exponential is directed from the source\
      \ to the observation point. For continuous \\(f\\) the classical answer is\n\
      \\[\ny(x)=-e^x\\left((1-x)\\int_0^x \\xi e^{-\\xi}f(\\xi)\\,d\\xi+\n x\\int_x^1(1-\\\
      xi)e^{-\\xi}f(\\xi)\\,d\\xi\\right).\n\\]\nThe endpoint values follow term by\
      \ term. The difference between any two solutions is \\(e^x(A+Bx)\\), and the\
      \ endpoint values force \\(A=B=0\\).\n\n## Source appearances\n\n- `raw/sheets/IB/methods/2023-24/sheet-3.pdf`,\
      \ physical page 1, printed question 3.\n- `raw/sheets/IB/methods/2025-26/sheet-3.pdf`,\
      \ physical page 1, printed question 3.\n- `raw/sheets/IB/methods/2026-27/sheet-3.pdf`,\
      \ physical page 1, printed question 3.\n"
    independent_rework_sha256: 728357c136437120e59a5678a7c35939fc257f957985c0b12829909a8ae02e7b
    main_comparison: Conjugating by exp(x) reduces to the Dirichlet second derivative.
      The independently constructed kernel agrees in sign, exponential factor, boundary
      behavior, and its split integral.
    script_sha256: 86ab4fba66a3dfced6143a3cf39e7cb0ff54e461cd32605a623b63669b5c76c0
    check_output: Green integral reproduces exponential times cubic, endpoints and
      unit jump.
    check_exit: 0
