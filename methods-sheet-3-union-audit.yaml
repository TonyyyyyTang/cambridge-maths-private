    exact_question_sha256: 1983d679609eb7567101e6ed687cc551eb7a318f574e7e5795d12a3aa97f9b04
    solution_sha256: 655082bea347624261776b0c36899d97af945a149504c79b7169e7c13abcf8e4
    independent_rework: "# The one-sided exponential\n\nFor real \\(k\\), using \\\
      (e^{-ikx}\\) in the forward integral gives\n\\[\n \\widetilde f(k)=\\left[-\\\
      frac{e^{-(1+ik)x}}{1+ik}\\right]_0^\\infty\n =\\frac{1}{1+ik}=\\frac{1-ik}{1+k^2}.\n\
      \\]\nThe exponential decays at the upper limit even when \\(k=0\\). No choice\
      \ of the function value at the single point \\(x=0\\) changes this transform.\n\
      \nAt the jump take the symmetric Fourier inversion limit with factor \\(1/(2\\\
      pi)\\). For each positive cutoff \\(R\\), the imaginary odd term integrates\
      \ to zero on \\([-R,R]\\), leaving \\(2\\arctan R/(2\\pi)\\). Its limit is \\\
      (1/2\\). The transform is not absolutely integrable, and the two imaginary half-line\
      \ integrals separately diverge. The symmetric prescription produces the midpoint\
      \ of the two one-sided limits \\(f(0-)=0,\\ f(0+)=1\\), as guaranteed by the\
      \ Fourier inversion theorem for piecewise smooth integrable functions of bounded\
      \ variation.\n\n## Source appearances\n\n- `raw/sheets/IB/methods/2015-16/all-sheets.pdf`,\
      \ physical page 6, printed question 8.\n- `raw/sheets/IB/methods/2018-19/sheet-3.pdf`,\
      \ physical page 2, printed question 8.\n- `raw/sheets/IB/methods/2020-21/sheet-3.pdf`,\
      \ physical page 2, printed question 8.\n- `raw/sheets/IB/methods/2021-22/sheet-3.pdf`,\
      \ physical page 2, printed question 8.\n- `raw/sheets/IB/methods/2022-23/sheet-3.pdf`,\
      \ physical page 2, printed question 8.\n"
