    independent_rework: '# Finite support and frequency translation


      Integrate with the convention \(\widetilde f(k)=\int f(x)e^{-ikx}\,dx\). Since
      all four integrals run from \(-c\) to \(c\), write \(S(t)=\sin(ct)/t\) for \(t\ne0\),
      \(S(0)=c\). The odd part of \(e^{-itx}\) integrates to zero, and integrating
      \(\cos(tx)\) over half the interval gives \(S(t)\). The transform of the constant
      window is therefore \(2S(k)\). For the windowed exponential, the integrand is
      \(e^{-i(k-a)x}\), giving \(2S(k-a)\).


      Subtract the windowed exponentials of frequencies \(a\) and \(-a\), then divide
      by \(2i\). This yields the sine transform \([S(k-a)-S(k+a)]/i\). Their half-sum
      yields the cosine transform \(S(k-a)+S(k+a)\). These forms apply at both resonant
      frequencies by the continuous value of \(S\). At \(a=0\) the sine transform
      vanishes and the cosine result is the constant-window transform as required.
      The omission of the two endpoints does not change any integral.


      ## Source appearances


      - `raw/sheets/IB/methods/2018-19/sheet-3.pdf`, physical page 2, printed question
      7.

