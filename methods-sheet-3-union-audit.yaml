  q04-3f833e46f1ea:
    exact_question_sha256: 3f833e46f1ea8681b838646b1e3c40caf9157df3e4719bf2436b9c4359320070
    solution_sha256: 6c4339fc6e22ab2b801d877ade50a782039579c29897a8c9716cf5142f67f552
    independent_rework: '# Dirichlet inverse and the exceptional parameters


      Put \(u(x)=\sinh(\lambda x)\), \(v(x)=\sinh(\lambda(1-x))\). They solve the
      homogeneous equation and vanish at the left and right ends respectively. Write
      the continuous kernel as \(C u(\min(x,\xi))v(\max(x,\xi))\). Its right-minus-left
      derivative is \(C(uv''-u''v)=-C\lambda\sinh\lambda\), by the addition law for
      \(\sinh\). Integrating \(-G''''+\lambda^2G=\delta_\xi\) gives jump \(-1\), hence
      \(C=1/(\lambda\sinh\lambda)\). For real nonzero \(\lambda\) this is finite.
      The boundary conditions and the energy identity \(\int(|y''|^2+\lambda^2|y|^2)=0\)
      give uniqueness in the homogeneous case.


      For continuous \(f\) the superposition of impulses therefore gives

      \[

      y=C\left[u(x)\int_x^1 v(\xi)f(\xi)\,d\xi+v(x)\int_0^x u(\xi)f(\xi)\,d\xi\right].

      \]

      The endpoint values vanish, and application of \(L_x\) returns \(f\). Writing
      \(r=\min(x,\xi)\), \(s=\max(x,\xi)\), the power series of \(\sinh\) gives \(G\to
      r(1-s)\) uniformly on the unit square. The limiting integral solves \(-y''''=f\),
      with the same boundary data, since this limiting kernel has jump \(-1\).


      At \(\lambda=i m\pi\) for positive integer \(m\), the sine \(h(x)=\sin(m\pi
      x)\) is a nonzero homogeneous Dirichlet solution. The Wronskian vanishes, and
      double integration by parts gives the necessary condition \(\int_0^1 fh=0\).
      Indeed, with \(k=m\pi\) the zero-initial-value particular solution is \(-\int_0^x\sin(k(x-t))f(t)\,dt/k\).
      Its value at 1 vanishes exactly under this condition. Then arbitrary multiples
      of \(h\) can be added. Thus the inverse kernel for general data fails at those
      parameters.


      ## Source appearances


      - `raw/sheets/IB/methods/2023-24/sheet-3.pdf`, physical page 1, printed question
      4.

      '
    independent_rework_sha256: a0b198af69be8d4f6afefb5f655c9ae173071451e468999e1b6437e138c7381c
    main_comparison: Both kernel signs follow the sign of the leading second derivative
