      source_finding: The image agrees on all three radii and voltages, the per-unit-length
        quantities and the fixed parameters in the minimization. No absolute marks
        are printed.
    independent_rework: '# IB/2010/P1/q16C — independent rework


      With no volume charge, cylindrical symmetry gives (rΦ′)′=0 in each annulus.
      The boundary values select Φ=V log(r/a)/log(b/a) for a≤r≤b and Φ=V log(c/r)/log(c/b)
      for b≤r≤c. The potential in the central cavity is zero by regularity at the
      axis. The radial field is −Φ′. On the middle conductor, the normals into the
      two gaps are respectively −eᵣ and +eᵣ, so the two surface charges per area are
      ε₀V/[b log(b/a)] and ε₀V/[b log(c/b)]. Multiplying their sum by 2πb gives charge
      per length λ=2πε₀V[1/log(b/a)+1/log(c/b)].


      The two gaps act in parallel. Their summed capacitance per length is C′=2πε₀[1/log(b/a)+1/log(c/b)],
      the proportionality constant between λ and V, and energy per length is U′=C′V²/2
      by integrating the charging work from zero. A uniform dielectric would replace
      ε₀ by its permittivity.


      Writing s=log(c/a)>0 and h=log(b/a) in (0,s), the reciprocal sum is s/[h(s−h)].
      Since h(s−h)=s²/4−(h−s/2)², U′ is minimized at h=s/2, or b=√(ac). The minimum
      is 4πε₀V²/s. Equality is unique for V≠0; at V=0 all choices have zero energy.

      '
    main_comparison: The inner and outer coaxial regions share the imposed voltage
      difference. Positive logarithmic separations have fixed sum, so their reciprocal
      sum and energy are minimized at b=√(ac) for nonzero voltage; zero voltage is
      degenerate.
