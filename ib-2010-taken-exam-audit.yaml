    independent_rework: '# IB/2010/P2/q10F — independent rework


      (i) For ordered bases e and f put P equal to the matrix whose columns are the
      f-basis vectors expressed in e-coordinates. Thus [v]ₑ=P[v]f, where the final
      subscript denotes the f-coordinates. If B represents T in e and A in f, comparison
      on every v gives BP=PA. Conversely any invertible P provides a basis by taking
      its columns in e-coordinates. For T represented by B in e this basis gives precisely
      P⁻¹BP=A.


      (ii) Over ℂ every linear endomorphism admits a basis of Jordan chains. Equivalently
      the matrix is similar to a block diagonal matrix with blocks Jₛ(λ)=λI+Nₛ, where
      Nₛ has ones immediately above the diagonal and zeros elsewhere. The list of
      eigenvalues and block lengths (with multiplicities) is unique up to block permutation.
      In particular the difference of the nullities of (A−λI)ᵏ and (A−λI)ᵏ⁻¹ counts
      the blocks for λ of size at least k, since on a length-s chain the corresponding
      nullity is min(k,s).


      (iii) If A=SJS⁻¹ then Aᵀ is similar to Jᵀ. Reversing the order of the vectors
      in each block, using the blockwise anti-identity permutation, conjugates J to
      Jᵀ. Similarity is transitive, so A and Aᵀ are similar.


      (iv) Invertibility means every λ is nonzero. The inverse block J⁻¹ has eigenvalue
      λ⁻¹. Since J⁻¹−λ⁻¹I=−λ⁻¹J⁻¹Nₛ, and the invertible factor commutes with Nₛ, its
      kth power has the same kernel as Nₛᵏ. Therefore each length-s block contributes
      exactly one length-s block for λ⁻¹, with the usual unit superdiagonal after
      similarity.

      '
    main_comparison: Both use Jordan blocks to identify generalized kernels and similarity
      to the transpose. Inverting a nonsingular block preserves its nilpotency index
      and block size while taking the reciprocal eigenvalue.
