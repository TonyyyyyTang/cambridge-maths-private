      summands (with period n), so αρ=ρα. Take V₂=kerρ. For every x there is a decomposition
      x=ρx+(x−ρx), with first part in V₁ and second in V₂; their intersection is zero
      because ρ fixes V₁. Finally ραx=αρx=0 for x∈V₂, hence α(V₂)⊂V₂. This includes
      V₁=0 or V₁=V.

