      Extend a basis of V₁ to a basis of V and project along the additional vectors
      to obtain π:V→V₁ that fixes V₁ pointwise. Because αⁿ=I, α is invertible, and
      V₁ is stable under α⁻¹=αⁿ⁻¹ as well as under α.


      Let ρ=(1/n)Σᵢ₌₀ⁿ⁻¹ αⁱπα⁻ⁱ. Each term maps into V₁ and fixes it pointwise. Thus
