    independent_rework: '# IB/2010/P3/q19C — independent rework


      For m>n the full factorization is A=Q [R;0], with Q an orthogonal m×m matrix
      and R an n×n upper triangular matrix. Equivalently A=Q₁R with Q₁ the first n
      columns of Q. For Qᵀb=(c,d), orthogonality gives ‖Ax−b‖²=‖Rx−c‖²+‖d‖². With
      full column rank R is invertible, so solve Rx=c by backward substitution, giving
      residual norm ‖d‖. For rank-deficient A one can apply column-pivoted QR to isolate
      an invertible leading block of dimension rank(A) and solve its equations with
      free coordinates, retaining the remaining residual components.


      For a nonzero v a Householder reflection is H=I−2vvᵀ/(vᵀv), which fixes the
      hyperplane perpendicular to v and negates v. The rank-one projector P=vvᵀ/(vᵀv)
      satisfies P²=P=Pᵀ, hence HᵀH=(I−2P)²=I.


      The first two matrix columns already need no reduction. In the last three rows
      the third column is w=(2,1,−2), with norm 3. Choose v=w−3e₁=(−1,1,−2). Its squared
      norm is 6 and vᵀw=3, so Hw=w−v=(3,0,0). For the last three entries of b, vᵀ(3,1,−1)=0,
      so Hb_tail=b_tail. Applying diag(I₂,H) produces the upper triangle with rows
      (2,4,7),(0,3,−1),(0,0,3); the transformed right-hand side is (9,−7,3,1,−1).
      Back substitution gives x₃=1, x₂=−2 and x₁=5. The transformed residual has entries
      (0,0,0,−1,1), so the minimum norm is √2. Direct multiplication gives the original
      residual (0,0,−1,0,−1), orthogonal to all columns.

      '
    main_comparison: The Householder reflector makes the final three rows of the third
      column triangular and fixes the corresponding perpendicular right-hand-side
      tail. The minimizing vector is (5,−2,1) with residual norm √2.
