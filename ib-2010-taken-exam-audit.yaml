      equation for t>s with G(s+,s)=0 and ∂ₜG(s+,s)=1/A(s). Continuity removes a delta
      derivative; integration through t=s gives the stated derivative jump. Then x(t)=∫₀ᵗG(t,s)f(s)ds
      has the two zero initial conditions and Lx=f by superposition (with the usual
      regularity and A nonzero).


      Here G(t,s)=(t−s)1{t≥s}. Consequently x(t)=a∫₀ᵐ(t−s)ds=a(tm−m²/2), m=min(t,T).
      This is at²/2 for t≤T and aTt−aT²/2 for t>T. Both x and its velocity agree at
      T; afterwards the velocity stays aT. This is a particle initially at rest driven
      by a constant force ma for duration T and left in force-free motion thereafter.

      '
