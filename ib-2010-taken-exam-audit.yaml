auditor_report: '# Fresh blind rework of the 2010 Part IB examination sample


  I independently reworked each of the 13 supplied questions using its statement and
  original PDF locator. I compared the words, symbols, conditions and subparts with
  the rendered original question images, including the operators, signs, inequalities
  and matrix entries. No transcription discrepancies were identified in these 13 questions.
  The comparison of these mathematical derivations with the repository solutions is
  a separate step for the coordinating agent.


  | Question | PDF page | Printed label | Transcription discrepancies |

  | --- | ---: | --- | ---: |

  | IB/2010/P1/q16C | 6 | 16C | 0 |

  | IB/2010/P1/q20E | 9 | 20E | 0 |

  | IB/2010/P1/q5B | 3 | 5B | 0 |

  | IB/2010/P2/q10F | 5 | 10F | 0 |

  | IB/2010/P2/q17D | 8 | 17D | 0 |

  | IB/2010/P2/q4H | 2 | 4H | 0 |

  | IB/2010/P2/q5A | 3 | 5A | 0 |

  | IB/2010/P3/q10F | 6 | 10F | 0 |

  | IB/2010/P3/q15A | 8 | 15A | 0 |

  | IB/2010/P3/q19C | 11 | 19C | 0 |

  | IB/2010/P3/q20E | 11 | 20E | 0 |

  | IB/2010/P3/q2G | 2 | 2G | 0 |

  | IB/2010/P3/q4A | 3 | 4A | 0 |


  The printed restriction in P3/15A(d) allows opposite nonzero parameters unless the
  parameters are nonnegative. Division requires unequal squares. For the strict bound-state
  problem in P2/17D the critical depth is an unattained infimum. For P1/16C the geometric
  mean is a minimizer for all fixed potentials, with uniqueness when the applied potential
  is nonzero. P1/20E distinguishes a stationary probability normalized on the communicating
  class from a mixture over closed classes.


  The per-question records bind each question.tex packet and rework.md to the SHA256
  of the archived PDF. The inventory hashes all 27 evidence files.

  '
main_resolution: The capacitor minimum is unique only at nonzero voltage. The bound-state
  depth threshold is an unattained infimum. The origin flux vanishes for bounded Bessel
  solutions and opposite nonzero parameters require the removable limit. The Markov
  cycle occupation count is 1/k. The audited derivations agree with these qualifications.
