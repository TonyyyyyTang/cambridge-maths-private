    independent_rework: '# IB/2010/P2/q17D — independent rework


      The infinite wall sets ψ(0)=0. The oscillatory solution in 0≤x≤a is A sin(kx),
      whereas for x>a square integrability selects B exp(−c(x−a)). Continuity of ψ
      and ψ′ at the finite jump gives B=A sin(ka) and k cos(ka)=−c sin(ka). Sin(ka)=0
      would force both sine and cosine to vanish for a nonzero state, so division
      yields c+k cot(ka)=0.


      Let z=ka and R=a√(2mV₀)/ℏ. An admissible root satisfies 0<z<R, with ca=√(R²−z²)=−z
      cot z>0. The first positive branch on which the right side is positive is π/2<z<π,
      followed by translates through multiples of π. Thus R>π/2 is necessary. On the
      first branch the right side increases from zero to infinity (its derivative
      is −cot z+z csc²z>0). The semicircle is decreasing, positive at the left endpoint
      and either reaches zero at R<π or is overtaken before π. This gives a root for
      every R>π/2. The critical depth is π²ℏ²/(8ma²), an infimum under the strict
      bound-state hypothesis. At equality the exterior solution at zero decay is not
      normalizable.


      Take A real, positive without loss of global phase and ψ=0 for x<0. Normalization
      gives A⁻²=a/2−sin(2ka)/(4k)+sin²(ka)/(2c)=(a+1/c)/2. For the last equality use
      cos(ka)=−(c/k)sin(ka) and sin²(ka)=k²/(k²+c²). The normalized wave function
      is the two pieces above with A=√[2/(a+1/c)], B=A sin(ka).


      The first moment is A²[∫₀ᵃ x sin²(kx)dx+sin²(ka)∫ₐ^∞ x exp(−2c(x−a))dx]. The
      supplied identity and tan(ka)=−k/c give ⟨x⟩=(a+1/c)/2. This exceeds a precisely
      when ca<1. For wells just above threshold the first bound state has π/2<z<R↓π/2,
      giving ca→0; the long exterior tail allows ⟨x⟩ to exceed a. Equality occurs
      at ca=1 and the expectation lies inside for ca>1.

      '
    main_comparison: The matching equation −t cot t = sqrt(K²−t²) has a positive first-branch
      root exactly when K>π/2. Both exclude the nondecaying threshold state and obtain
      the same normalization and mean (a+1/c)/2.
