      source_finding: The three coordinates of f, derivative request, theorem qualification
        and final three factors match the page.
    independent_rework: '# IB/2010/P3/q2G — independent rework


      All three coordinates are polynomial and hence continuously differentiable on
      ℝ³. The derivative is the linear map given in standard coordinates by the matrix
      with rows (1,1,1), (y+z,x+z,x+y), (yz,xz,xy). Subtract the first column from
      the second and third. Removing the common factors x−y and x−z from those columns
      leaves lower entries (1,z) and (1,y), so the determinant is (x−y)(x−z)(y−z).
      This differs by a minus sign from the printed product and has exactly the same
      zeros.


      The inverse function theorem says that for a C¹ map on an open set of ℝⁿ with
      invertible derivative at p, there are open neighborhoods of p and of f(p) between
      which the restriction is a bijection with C¹ inverse. Here the full space is
      open, and the determinant is nonzero for distinct coordinates. This proves the
      claim. At a repeated coordinate, swapping those two coordinates in a sufficiently
      small perturbation with distinct values gives two different nearby points with
      identical image by symmetry. Hence no neighborhood there gives injectivity.

      '
    main_comparison: The Jacobian determinant is nonzero for distinct coordinates,
      so the inverse theorem applies there. At repeated coordinates arbitrarily close
      transposed triples have the same image and exclude local injectivity.
