    independent_rework: '# IB/2010/P1/q5B — independent rework


      With velocity defined by the gradient of the potential, a particle has velocity
      (e⁻ᵗ,eᵗ). At time zero the streamlines therefore have slope one. They are y=x+C,
      oriented northeast.


      For a particle starting at the origin at time zero, integration gives x=1−e⁻ᵗ,
      y=eᵗ−1. Eliminating time gives y=x/(1−x), x<1. The forward part has 0≤x<1 and
      increases towards the vertical asymptote x=1. Extending to negative times gives
      the same branch approaching y=−1 as x→−∞.


      For a particle released at time s<0, integration from s to zero gives x=e⁻ˢ−1
      and y=1−eˢ. Thus y=x/(1+x), x>0, approaching (0,0) for s↑0 and the horizontal
      asymptote y=1 for s→−∞. Include (0,0) if release at the observation time is
      included. A sketch can be drawn with all three represented curves tangent to
      y=x at the origin, taking the streamline C=0. The forward pathline bends above
      that diagonal through (1/2,1), and the streakline bends below it through (1,1/2);
      the other streamlines are parallel translates.

      '
    main_comparison: The trajectory through the origin and the instantaneous release
      locus use different starting times. Both give y=x/(1−x) for the path and y=x/(1+x)
      for the streak at zero, with their printed time ranges and the distinct streamline
      family.
