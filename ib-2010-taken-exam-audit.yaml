    independent_rework: '# IB/2010/P3/q20E — independent rework


      Write S=ΣXᵢ. Under the stated rate parameterization ℓ(θ)=n log θ−θS+constant.
      Its second derivative is −n/θ², and for S>0 the unique maximizer is θ̂=n/S.
      S>0 holds almost surely. The Laplace transform of S is [θ/(θ+t)]ⁿ by independence,
      so n/θ̂=S is Gamma(shape n, rate θ). Scaling gives θ/θ̂=θS/n ∼ Gamma(n,n).


      Write Gₛ for the CDF of the unit-rate Gamma(s,1). Since θS∼Gamma(n,1), the event
      θ≤C θ̂ has probability Gₙ(nC). For 0<α<1 its unique required constant is C=Gₙ⁻¹(1−α)/n.
      The interval is [0,Gₙ⁻¹(1−α) θ̂/n].


      The prior density times the likelihood has kernel θⁿ⁺ᵏ⁻¹ exp[−(λ+S)θ], so θ|X∼Gamma(n+k,λ+S).
      Conditional squared-error risk is Var(θ|X)+(a−E[θ|X])². It is minimized by θ̂_B=(n+k)/(λ+S).
      Since (λ+S)θ|X∼Gamma(n+k,1), P(θ≤C_B θ̂_B|X)=Gₙ₊ₖ((n+k)C_B). Thus C_B=Gₙ₊ₖ⁻¹(1−α)/(n+k),
      independent of the observations.

      '
    main_comparison: Scaling the sufficient sum gives the Gamma(n,n) pivot for the
      exponential rate. Both posterior calculations give Gamma(n+k,λ+S); the analogous
      posterior pivot is Gamma(n+k,n+k).
