      source_finding: The differentiability hypothesis, powers and real coefficient
        condition, labels and the analytic-function request agree.
    independent_rework: '# IB/2010/P3/q4A — independent rework


      (a) Suppose f=u+iv is complex differentiable throughout an open set. Holomorphic
      functions there are analytic, so their real and imaginary parts are smooth.
      The Cauchy–Riemann equations give uₓ=vᵧ and uᵧ=−vₓ. Differentiating, Δu=vᵧₓ−vₓᵧ=0
      and Δv=−uᵧₓ+uₓᵧ=0 by equality of mixed partials. Differentiability solely at
      one individual point would not imply this open-set conclusion.


      (b) Matching the two coefficients in Δu=(6a+2c)x+(2b+6d)y yields c=−3a, b=−3d.
      Thus all solutions are a(x³−3xy²)+d(y³−3x²y), with a,d arbitrary real.


      (c) Since z³=(x³−3xy²)+i(3x²y−y³), the real part of (a+i d)z³ yields exactly
      u. An arbitrary purely imaginary additive constant leaves this real part unchanged.

      '
    main_comparison: On an open analytic domain the mixed partials commute and give
      harmonic real and imaginary parts. The coefficient conditions c=−3a, b=−3d give
      (a+id)z³ up to an imaginary constant.
