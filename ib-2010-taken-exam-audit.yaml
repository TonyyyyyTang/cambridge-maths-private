      positivity of the eigenvalues and the Wronskian sign. The eigenvalues are the
      squared positive Bessel zeros. The divided expression requires α²≠β²; for β=−α≠0
      the integral is finite and the continuous value is (J₀(α)²+J₀′(α)²)/2.
