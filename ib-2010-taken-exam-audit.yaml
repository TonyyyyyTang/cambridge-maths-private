    independent_rework: '# IB/2010/P2/q4H — independent rework


      For nonzero rational r let v(r) be the exponent of 3 in its numerator minus
      that in its denominator in reduced form. This integer is unique by prime factorization.
      Put v(0)=+∞ and |r|₃=3⁻ᵛ⁽ʳ⁾ with |0|₃=0. Then d₃(x,y)=|x−y|₃ vanishes exactly
      on the diagonal, is real nonnegative and is symmetric because v(−r)=v(r).


      For rationals r,s with finite valuations let h=min(v(r),v(s)). Both 3⁻ʰr and
      3⁻ʰs have reduced denominator prime to 3. So does their sum (unless zero, which
      has infinite valuation). Consequently v(r+s)≥h. The case of a zero summand is
      immediate. Applying this to r=x−y and s=y−z gives d₃(x,z)≤max(d₃(x,y),d₃(y,z)),
      which implies the triangle inequality.


      The distances d₃(3ⁿ,0)=3⁻ⁿ→0 and d₃(3⁻ⁿ,0)=3ⁿ→∞ establish the requested limits.
      The first sequence fails to converge to zero in the usual metric, the second
      does converge to zero there. Continuity would preserve convergence to zero;
      these sequences witness failure at zero in each direction. Translation gives
      the same failure at every rational point.

      '
    main_comparison: The valuation of a sum gives the ultrametric inequality, including
      cancellation. The sequences 3^n and 3^(−n) separate ordinary and 3-adic convergence
      and disprove continuity in each direction.
