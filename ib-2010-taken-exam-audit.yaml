    independent_rework: '# IB/2010/P1/q20E — independent rework


      (a) Put Tᵢ=inf{n≥1:Xₙ=i}. Positive recurrence means EᵢTᵢ<∞ (in particular return
      occurs almost surely). For an irreducible countable discrete-time chain, a stationary
      probability exists exactly when the chain is positive recurrent and is then
      unique, with πᵢ=1/EᵢTᵢ. Periodicity does not affect this statement. For a general
      chain normalize on the closed positive recurrent class C; a stationary law giving
      it positive mass has πᵢ=π(C)/EᵢTᵢ. Class mass can be zero.


      (b) Communication means mutual reachability by paths of positive probability,
      allowing a zero-step path to the starting state. The equivalence classes are
      communicating classes. Let i≠j communicate. There is a positive-probability
      finite path from i to j which avoids i after departure until it reaches j (erase
      loops). Call the probability of hitting j in an i-to-i excursion p>0. Excursions
      are iid by strong Markov and their lengths L have finite mean μ. The expected
      time through the end of the first successful excursion is Σₙ₌₁^∞ E[Lₙ 1{first
      n−1 excursions failed}]=Σ μ(1−p)ⁿ⁻¹=μ/p. Hence EᵢHⱼ≤μ/p for Hⱼ the first hit
      of j. On success, the remainder of the excursion after hitting j has conditional
      mean EⱼHᵢ by strong Markov. Thus p EⱼHᵢ≤μ. Starting from j, a route to i followed
      by a return to j bounds the first positive return time from above. Its mean
      is finite by the two estimates. Hence j is positive recurrent.


      (c) From every pad one can jump to 1 then ascend to any target, so the chain
      is irreducible. The balance equations are πⱼ=Σᵢ≥max(1,j−1) πᵢ/(i+1). Thus π₁=π₂,
      and for j≥2, πⱼ−πⱼ₊₁=πⱼ₋₁/j. Induction yields πⱼ=π₁/(j−1)!; normalization gives
      π₁=e⁻¹. Substitution verifies the infinite equations: πᵢ/(i+1)=e⁻¹(1/i!−1/(i+1)!),
      which telescopes to the required mass including j=1. The chain therefore has
      the displayed stationary probability and is positive recurrent.


      (d) The return-time theorem gives EₖTₖ=e(k−1)!. The expected occupation counts
      νⱼ per regeneration cycle [0,Tₖ) sum to EₖTₖ. They form an invariant measure
      because shifting the counting interval to [1,Tₖ] exchanges two visits to k;
      the one-step conditional expectation gives νP=ν. Dividing by EₖTₖ yields the
      unique stationary probability. In particular Eₖ[number of visits to k+1]=πₖ₊₁/πₖ=1/k.

      '
    main_comparison: Summing the telescoping stationary balance gives π_k=e^(−1)/(k−1)!.
      The mean return time is e(k−1)!, and the ratio of excursion occupation counts
      gives 1/k expected visits to the next state.
