- Write on one side of the paper only and begin each answer on a separate sheet.
- Write legibly; otherwise, you place yourself at a grave disadvantage.
- Tie up your answers in separate bundles labelled A, B, ..., H according to the examiner letter affixed to
  each question, including in the same bundle questions from Sections I and II with the same examiner letter.
- Attach a completed gold cover sheet to each bundle.
- You must also complete a green master cover sheet listing all the questions you have attempted.
- Every cover sheet must bear your examination number and desk number.
- 'Stationery requirements: Gold cover sheets, Green master cover sheet. Special requirements: None.'
- You may not start to read the questions printed on the subsequent pages until instructed to do so by the
  Invigilator.
