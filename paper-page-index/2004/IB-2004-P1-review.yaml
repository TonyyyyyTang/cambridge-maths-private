cover:
- Before you begin read these instructions carefully.
- Each question in Section II carries twice the credit of each question in Section
  I.
- You should attempt at most four questions from Section I and at most six questions
  from Section II.
- Additional credit will be given to substantially complete answers.
- Write on one side of the paper only and begin each answer on a separate sheet.
- Write legibly; otherwise, you place yourself at a grave disadvantage.
- 'At the end of the examination:'
- Tie up your answers in separate bundles labelled A, B, ..., H according to the code
  letter affixed to each question, including in the same bundle questions from Sections
  I and II with the same code letter.
- Attach a completed gold cover sheet to each bundle; write the code letter in the
  box marked ‘EXAMINER LETTER’ on the cover sheet.
- You must also complete a green master cover sheet listing all the questions you
  have attempted.
- Every cover sheet must bear your candidate number and desk number.
- You may not start to read the questions printed on the subsequent pages until instructed
  to do so by the Invigilator.
