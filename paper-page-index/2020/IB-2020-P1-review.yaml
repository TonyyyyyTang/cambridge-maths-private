cover:
- Before you begin read these instructions carefully
- Candidates are required to comply with the Code of Conduct for Part IB Online Examinations. This is a closed-book
  examination.
- You must begin each answer on a separate sheet.
- Answers must be handwritten (unless you have an approved adjustment).
- You should ensure that your answers are legible; otherwise you place yourself at a significant disadvantage.
  You are advised to write on one side of the paper only.
- Candidates have THREE HOURS to complete the examination
- The examination paper is divided into two sections.
- 'At the end of the examination:'
- Separate your answers to each question. Make sure that the question number, e.g. 7D, and your Blind Grade
  ID, e.g. 1234A, are written clearly on the first page of each answer.
- Scan each answer into a separate PDF file.
- Name each PDF file by the relevant question number, for example 7D.pdf for question number 7D.
- Complete the PDF cover sheet to show all the questions you have attempted.
- Sign the PDF declaration that you have complied with the Code of Conduct.
- Upload the PDF for each answer, together with your PDF declaration and coversheet, to Moodle and submit.
- If these administrative tasks take you more than 45 minutes then email your Tutor explaining why.
