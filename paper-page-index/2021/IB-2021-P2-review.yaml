cover:
- Write on one side of the paper only and begin each answer on a separate sheet.
- Write legibly; otherwise you place yourself at a grave disadvantage.
- Separate your answers to each question.
- Complete a gold cover sheet for each question that you have attempted, and place it at the front of your
  answer to that question.
- Complete a green master cover sheet listing all the questions that you have attempted.
- Every cover sheet must also show your Blind Grade Number and desk number.
- Tie up your answers and cover sheets into a single bundle, with the master cover sheet on the top, and then
  the cover sheet and answer for each question, in the numerical order of the questions.
- 'Stationery: Gold cover sheets; Green master cover sheet.'
- You may not start to read the questions printed on the subsequent pages until instructed to do so by the
  Invigilator.
