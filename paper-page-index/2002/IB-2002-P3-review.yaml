cover:
- Before you begin read these instructions carefully.
- Each question in Section II carries twice the credit of each question in Section
  I.
- Candidates may attempt at most four questions from Section I and at most six questions
  from Section II.
- Complete answers are preferred to fragments.
- Write on one side of the paper only and begin each answer on a separate sheet.
- Write legibly; otherwise, you place yourself at a grave disadvantage.
- 'At the end of the examination:'
- Answers must be tied up in separate bundles, marked A, B, ..., H according to the
  letter affixed to each question, and a blue cover sheet must be attached to each
  bundle.
- A green master cover sheet listing all the questions attempted must be completed.
- It is essential that every cover sheet bear the candidate’s examination number and
  desk number.
