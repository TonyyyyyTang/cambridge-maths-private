independent_whitespace_originals:
  b1bbf53bbfb38185e3491cf4484d4e1c1252bbcbe2cf1ee76be9f8af52c310c2:
    published_evidence: qx24/history/verified-2018-19-587be09e3949/independent-solution.md
    frozen_utf8_json: '"Use $\\widehat f(k)=\\int f(x)e^{-ikx}dx$. For $g(x)=e^{-n^2x^2}$
      with $n$ real and nonzero, $g''=-2n^2xg$. Integration by parts gives $\\widehat{g''}=ik\\widehat
      g$ and differentiation under the integral gives $\\widehat{xg}=i\\partial_k\\widehat
      g$; both operations are justified by Gaussian decay. Hence $\\widehat g''=-(k/(2n^2))\\widehat
      g$. The Gaussian integral gives $\\widehat g(0)=\\sqrt\\pi/|n|$, so translation
      by a real $\\mu$ yields\n$$\n \\widehat f(k)=\\frac{\\sqrt\\pi}{|n|}\\exp[-k^2/(4n^2)]e^{-ik\\mu}.\n$$\nFor
      the approximate identity take $n>0$. Then $\\delta_n=n e^{-n^2x^2}/\\sqrt\\pi$
      has area one and $\\widehat\\delta_n(k)=e^{-k^2/(4n^2)}$. Both sketches are
      even bells decreasing strictly for positive argument with horizontal asymptotes
      at zero. The following peak and one-e-fold points set the horizontal and vertical
      scales for a sketch:\n \n| curve | value at centre | left, right one-e-fold
      abscissas | small positive $n$ | large positive $n$ |\n| --- | --- | --- | ---
      | --- |\n| $\\delta_n(x)$ | $n/\\sqrt\\pi$ | $-1/n,1/n$ | low and broad | high
      and narrow |\n| $\\widehat\\delta_n(k)$ | $1$ | $-2n,2n$ | narrow bell | broad
      bell |\n \nFor example, these sketches use $s$ for $n=1/2$, $L$ for $n=2$ and
      an asterisk for overlap (independent vertical scales).\n\n```text\nphysical
      space, x\n |                        L\n |                       L L\n |\n |                      L   L\n
      |                     L     L\n |                    sssssssss\n |           sssssssssL       Lsssssssss\n
      |***********LLLLLLLLL         LLLLLLLLL***********\n +-------------------------------------------------\n  -4                     0                       4\n\nfrequency
      space, k\n |                     LLL*LLL\n |                   LL  s s  LL\n
      |                 LL           LL\n |               LL     s   s     LL\n |            LLL      s     s      LLL\n
      |          LL                         LL\n |     LLLLL          s       s          LLLLL\n
      |*****sssssssssssssss         sssssssssssssss*****\n +-------------------------------------------------\n  -8                     0                       8\n```\n\nAs
      $n\\to+\\infty$, for any smooth compactly supported $\\varphi$ the substitution
      $u=nx$ gives $\\int\\delta_n\\varphi=\\pi^{-1/2}\\int e^{-u^2}\\varphi(u/n)du\\to\\varphi(0)$
      by dominated convergence. Thus $\\delta_n\\to\\delta$ distributionally, while
      its transform tends to one at every fixed $k$. In physical space the pointwise
      limit is zero away from zero and the peaks diverge. As $n\\downarrow0$ the physical
      curve tends to zero locally while its mass spreads out. The transform tends
      to zero away from $k=0$, keeping its unit central value. If negative $n$ are
      admitted with the printed signed prefactor, the area and transform acquire the
      factor $\\operatorname{sgn}(n)$ relative to $|n|$. At $n=0$ the unscaled Gaussian
      becomes constant and has only a distributional transform $2\\pi\\delta(k)$;
      $\\delta_0(x)=0$ pointwise under its printed definition.\n"'
  5ac0a95f807bd4ae1fd1c2b723ff3ab6b0f7ba82ae31a9544118936c67f26e01:
    published_evidence: q11/history/verified-2015-16-3eb8c801513d/independent-solution.md
    frozen_utf8_json: '"Assume $f$ is at least $C^1$ near $1$, as required for pairing
      with the derivative of a delta. Insert a smooth radial cutoff equal to one near
      the unit circle and supported in an annulus about it. The factor $\\delta''(x^2+y^2-1)$
      localizes there. This also avoids defining $\\delta(x^2-y^2)$ by itself at its
      critical point $(0,0)$, so the given condition at zero suffices and plays no
      role after localization. The two level sets meet transversely at the four points
      with $x^2=y^2=1/2$.\n \nIn polar coordinates $r>0$, $x^2-y^2=r^2\\cos 2\\theta$
      and $dx\\,dy=r\\,dr\\,d\\theta$. At fixed $r$, the four zeros of $\\cos 2\\theta$
      on one revolution are simple with derivative of absolute value $2$. Thus the
      angular integral of $\\delta(r^2\\cos2\\theta)$ is $2/r^2$. Setting $u=r^2$,
      the resulting radial pairing is\n$$\n 2\\int_0^\\infty f(r^2)\\delta''(r^2-1)\\frac{dr}{r}\n   =\\int_0^\\infty
      \\frac{f(u)}u\\delta''(u-1)\\,du\n   =-\\left.\\frac{d}{du}\\frac{f(u)}u\\right|_{1}\n   =
      f(1)-f''(1).\n$$\nThe cutoff has derivative zero there.\n"'
