  IB/2011/P3/q18D:
    source_review:
      original_pdf: private/raw/tripos/IB/2011/P3.pdf
      original_pdf_sha256: cf36aed82e894934c7ae49da762ea9433f5826b77d06c163a08ac286dd1afdbe
      source_page: 8
      question_packet_sha256: a68d437dbcf80d0e9308287aec4e3b8bdd9eaeddf7662db1d0c8cd1855b6631e
      blind_rework_sha256: 151ccf9db032b792a51fb59585c8a3a3a405d7e72e992f23eeaf29b1d379580e
      transcription_discrepancies: []
      printed_label: 18D
      source_finding: Printed 18D, Fluid Dynamics, p. 8. Compared both radius formulas
        and all conditions, the slowly varying thickness, fractional exponent, factor
        1/4, dimensionless definitions and final conditions.
    independent_rework: '# IB/2011/P3/q18D — independent rework


      Use steady, incompressible, inviscid quasi-one-dimensional flow and neglect
      changes of elevation. Conservation of volume flux is $\pi(r-h)^2u=\pi r_0^2V$.
      For positive radius and positive inlet speed this gives $r-h=r_0 v^{-1/2}$.
      Bernoulli gives $p-p_0=\rho(V^2-u^2)/2$, so $r/r_0=1+(k/4)(1-v^2)$. Subtract
      to get $H=F(v)=1-v^{-1/2}+(k/4)(1-v^2)$, $v>0$, $k>0$.


      $F''(v)=(v^{-3/2}-kv)/2$ and $F''''(v)=-3v^{-5/2}/4-k/2<0$. The graph rises
      from $-\infty$ at $0^+$, peaks once at $v_c=k^{-2/5}$, then falls to $-\infty$
      at infinity. Its value at $1$ is zero and its height at the peak is $H_c=1+k/4-5k^{1/5}/4$.
      Thus $H_m\le H_c$ is necessary. For $k\ne1$, $F(1)=0$ is away from the peak
      and there is a second positive zero on the opposite branch. For $k=1$ the peak
      touches the axis at $1$ and a nonnegative wall must have zero thickness throughout.


      Since $H=0$ at entry and exit and $v_{\rm in}=1$, slower exit requires the second
      zero to be on the lower-speed side, i.e. $v_c<1$ or $k>1$. It also requires
      changing branches, possible in a continuous profile only where the two roots
      coalesce, i.e. $H_m=H_c$. For a single smooth nondegenerate wall maximum at
      this height, follow the high-speed branch from $v=1$ to $v_c$ on the way up,
      then the low-speed branch down to the smaller zero, giving $v_{\rm out}<1$.
      At the maximum $H_c-H$ is quadratic in position, while $H_c-F$ is quadratic
      in $v-v_c$ with positive coefficient. Taking opposite signs on the two sides
      permits a finite common derivative and hence a smooth crossing for the usual
      smooth profile. With multiple contacts at the critical height the exit branch
      is the lower one when the net number of switches is odd. If $H_m<H_c$ the branches
      stay disjoint and the exit speed must equal $V$.

      '
    main_comparison: Escalation resolved by expanding the wall relation with positive
      internal radius, differentiating twice and checking both branches. Strict concavity
      gives vc=k^(−2/5) and Hc=1+k/4−5k^(1/5)/4. A slower exit requires k>1, reaching
      the critical maximum, then switching to the low-speed branch; touching the maximum
      permits the switch but does not force it. Both independent sketches and the
      numerical root test confirm this ordering, including the degenerate k=1 case.
    delivery:
      source_pdf: private/raw/tripos/IB/2011/P3.pdf
