      printed_label: 16D
      source_finding: Printed 16D, Electromagnetism, p. 9. Compared all four instructions,
        the order and signs of the wire charges, the offset, the fixed product and
        both requested sketches.
    independent_rework: '# IB/2011/P1/q16D — independent rework


      In vacuum in SI units, $\nabla\cdot \mathbf E=\rho/\epsilon_0$. Integrating
      over a volume and applying the divergence theorem gives outward flux $\oint_{\partial
      V}\mathbf E\cdot d\mathbf S=Q_{\rm enc}/\epsilon_0$. The line-charge formula
      follows also by taking thin charged cylinders to their limit. Translational,
      rotational and reflection symmetries leave only a cylindrical radial component
      $E_r(r)$; the flux through the caps vanishes and the curved surface contributes
      $2\pi r L E_r=\lambda L/\epsilon_0$. Hence $\Phi(r)-\Phi(r_*)=-\lambda\log(r/r_*)/(2\pi\epsilon_0)$,
      taking $r_*>0$. A single infinite line cannot use infinity as potential zero.


      Let $s=x^2+y^2$ and $s_d=x^2+(y-d)^2$. Superposition with zero reference at
      infinity for the pair gives $\Phi_d=\lambda\log(s_d/s)/(4\pi\epsilon_0)$ off
      both axes of charge. For fixed $s>0$, $\log(s_d/s)=-2yd/s+O(d^2)$. Set $A=p/(2\pi\epsilon_0)$,
      so $\Phi=-Ay/s$. Differentiation gives $\mathbf E=A(-2xy,x^2-y^2,0)/s^2$ in
      Cartesian coordinates.


      An exact sketch in any transverse plane can be drawn as follows. For constant
      $\Phi=c\ne0$, draw $x^2+(y+A/(2c))^2=(A/(2c))^2$; the zero level is the horizontal
      axis. For field lines draw $(x-a)^2+y^2=a^2$ for all $a\ne0$, together with
      the vertical axis. Indeed $x/s$ is constant along $\mathbf E$, as its gradient
      dotted with the field vanishes. Both families omit the singular origin; circles
      within each family touch there and the families intersect orthogonally elsewhere.
      With $p>0$, arrows cross the horizontal axis upward on either side, run clockwise
      around left-hand circles and counterclockwise around right-hand circles, and
      point downward along the vertical axis. Potential is negative above the horizontal
      axis. Reverse signs and arrows for $p<0$; $p=0$ gives zero field and constant
      potential.

      '
    main_comparison: The logarithmic potentials cancel their arbitrary reference at
      infinity for the neutral pair. Expanding at fixed nonzero transverse position
      gives −py/(2πε₀r²), the corresponding signed field, and two orthogonal circular
      families with consistent arrows.
