    independent_rework: '# IB/2011/P1/q19H — independent rework


      A statistic $T=T(X)$ is sufficient if conditional laws of the whole sample given
      $T$ have a version independent of $\theta$ (on conditioning events of positive
      probability). The discrete factorisation criterion is that the joint mass equals
      $g_\theta(T(x))h(x)$ for nonnegative factors with $h$ parameter independent,
      including zeros of the mass.


      For an integrable estimator $U$ and sufficient $T$, $U^*=\mathbb E_\theta[U\mid
      T]$ is a statistic independent of the unknown parameter in its construction.
      The tower law gives its original expectation; in particular unbiasedness is
      preserved. For square-integrable $U$, the total variance identity follows by
      expanding $U-\mathbb EU=(U-U^*)+(U^*-\mathbb EU)$: the cross term has expectation
      zero after conditioning. Thus $\operatorname{Var}U-\operatorname{Var}U^*=\mathbb
      E\,\operatorname{Var}(U\mid T)\ge0$, with equality exactly if $U=U^*$ almost
      surely. For a general convex loss in the estimate (whenever expectations exist),
      conditional Jensen gives the corresponding risk inequality.


      Put $\mu=-\log\theta>0$. The sample has product mass $e^{-n\mu}\mu^{\sum x_i}/\prod_i
      x_i!$ on nonnegative integer vectors, so $T=\sum_i X_i$ is sufficient. The zero
      indicator $U$ has mean $e^{-\mu}=\theta$. Given $T=t$, the joint mass is $t!/(n^t\prod
      x_i!)$ on vectors summing to $t$. This is a multinomial law with equal cell
      probabilities, so $U^*=(1-1/n)^T$ (use $0^0=1$). When $n>1$, the event $T=1$
      has positive probability and on it $U$ is Bernoulli with success probability
      $1-1/n$ strictly between zero and one. Thus the variance inequality is strict.
      Directly, $\mathbb E[(U^*)^2]=\exp[n\mu((1-1/n)^2-1)]=\theta^{2-1/n}<\theta$
      for $n>1$.


      At $n=1$ conditioning returns $U$. Indeed any unbiased estimator $h(X_1)$ must
      satisfy $\sum_{x\ge0}h(x)\mu^x/x!=1$ for all $\mu>0$; integrability makes this
      power series absolutely convergent for all positive $\mu$. Coefficient uniqueness
      forces $h(0)=1$ and $h(x)=0$ for $x>0$. The strict request presupposes at least
      two observations.

      '
    main_comparison: Poisson conditioning on the sufficient sum gives (1−1/n)^T. Conditional
      variance gives strict improvement for n≥2. For n=1 the observation equals T
      and the complete Poisson family precludes a strictly better unbiased function.
