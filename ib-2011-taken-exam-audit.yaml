      printed_label: 13A
      source_finding: Printed 13A, Complex Analysis or Complex Methods, p. 6. Compared
        the square, orientation, integrand, both infinite sums, factors, three subparts
        and full italicised hint.
    independent_rework: '# IB/2011/P2/q13A — independent rework


      Write $R=(2N+1/2)\pi$. For sufficiently large $N$ the square includes $-\pi
      a$ and the poles $n\pi$ for $-2N\le n\le2N$. The noninteger assumption keeps
      the two pole locations separate. At $n\pi$ the residue is $1/(\pi^3(n+a)^4)$.
      At $-\pi a$ the coefficient of $(z+\pi a)^{-1}$ is $\pi(\cot)''''''(-\pi a)/6$
      by Taylor expansion. This remains valid if the numerator has a zero there. Using
      $c=\csc^2 z$ gives $(\cot)''=-c$, $(\cot)''''=2c\cot z$ and $(\cot)''''''=4c-6c^2$.


      By the residue theorem the sum of these residues equals $I/(2\pi i)$. Taking
      $N\to\infty$ (the series is absolutely convergent by comparison to $|n|^{-4}$)
      gives $\sum_{n\in\mathbb Z}(n+a)^{-4}=\pi^4(c^2-2c/3)$ with $c=\csc^2(\pi a)$.
      This is the required factored expression. At $a=1/2$ the sum is $\pi^4/3$.


      On each vertical edge $\cot(\pm R+iy)=-i\tanh y$ and hence has modulus at most
      one. On each horizontal edge $|\cot(x+iy)|^2=(\cos^2 x+\sinh^2 y)/(\sin^2 x+\sinh^2
      y)$ bounds the squared modulus by $\coth^2 R$. Everywhere on the boundary $|z+\pi
      a|\ge R-\pi|a|$. The length is $8R$, so $|I|\le8\pi R\coth R/(R-\pi|a|)^4=O(R^{-3})$
      for large $R$. This argument also allows fixed complex $a$.

      '
    main_comparison: Both evaluate the shifted fourth-order residue and bound cotangent
      uniformly on the expanding squares, giving O(L^(−3)) for the integral. The half-integer
      series sums to π⁴/3.
