      question_packet_sha256: a0f14915ed1e102849745de2b64989e61a4c152d52187583fe2f62d3d96a9dd4
      blind_rework_sha256: f0706d05a4bcbff385642739f984d32aa4abd94677cff2e65a4b7892f723d482
      transcription_discrepancies: []
      printed_label: 3E
      source_finding: Printed 3E, Analysis II, p. 2. Checked domain and codomain,
        exponent condition, both absolute values, and both requests.
    independent_rework: '# IB/2011/P2/q3E — independent rework


      Differentiability at $p$ means there exists a linear functional $A$ with $f(p+h)-f(p)-A(h)=o(\|h\|)$
      as $h\to0$. Every point on $x=y$ fails: varying only $y$ changes the second
      term by $|h_y|$ and leaves the first fixed, giving incompatible one-sided slopes.


      Away from the diagonal put $\sigma=\operatorname{sgn}(x-y)$. Then the second
      term is locally affine with derivative $\sigma(h_x-h_y)$. The first is smooth
      at every $x\ne0$, with derivative $a|x|^{a-1}\operatorname{sgn}(x)h_x$. At $x=0$
      it has derivative zero for $a>1$ by the bound $|h_x|^a/\|h\|\le\|h\|^{a-1}$.
      For $a=1$ the one-dimensional slopes have opposite signs, and for $0<a<1$ the
      absolute difference quotient diverges along the horizontal line. Subtracting
      the affine term preserves differentiability. Thus precisely $x\ne y$ and either
      $a>1$ or $x\ne0$ are required.

      '
    main_comparison: The vertical cusp excludes all diagonal points. At x=0 off the
      diagonal, the first term has a Fréchet derivative precisely when a>1. Both give
      the same two domains, including the borderline a=1.
