      source_finding: Printed 10G, Linear Algebra, p. 5. Checked complex scalar field,
        indices beginning at zero, conjugation on g, integration interval, second
        derivative, and the three parts.
    independent_rework: '# IB/2011/P2/q10G — independent rework


      Integration and conjugation give linearity in the first argument, conjugate-linearity
      in the second and conjugate symmetry. The diagonal integral is $\int|f|^2\ge0$;
      if zero, continuity forces $f=0$ on the integration interval, since a nonzero
      value persists on a subinterval of positive measure. Periodicity then gives
      zero on all of $\mathbb R$.


      The second derivative is linear and maps each generating sine or cosine to $-k^2$
      times itself, so acts on $V$. Integration by parts twice gives $\langle f'''',g\rangle-\langle
      f,g''''\rangle=[f''\bar g-f\bar g'']_0^{2\pi}=0$ by periodicity of functions
      and their first derivatives. This proves self-adjointness in finite dimensions.


      Use $u_k=e^{ikx}/\sqrt{2\pi}$ for integer $-(n-1)\le k\le n-1$. Euler''s identities
      show these belong to and span $V$ (at zero there is just the constant). The
      integral of $e^{i(k-j)x}/(2\pi)$ over one period equals $\delta_{kj}$, and $\Delta
      u_k=-k^2 u_k$. For $n=1$ the constant alone has eigenvalue zero.

      '
    main_comparison: Twice integrating by parts cancels the periodic endpoints. The
      frequencies from −(n−1) to n−1 give an orthonormal exponential eigenbasis, with
      eigenvalues −j².
