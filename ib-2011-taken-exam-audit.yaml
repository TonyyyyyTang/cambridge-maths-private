      transcription_discrepancies: []
      printed_label: 5A
      source_finding: Printed 5A, Methods, p. 3. Checked both derivatives and coefficients,
        endpoint inequalities, non-negative integer condition and all requests.
    independent_rework: '# IB/2011/P2/q5A — independent rework


      In $L^2[-1,1]$ with weight one put $p=1-x^2$ and $Ly=-(py'')''$. Then $Ly=n(n+1)y$.
      Green''s identity gives $\langle Lu,v\rangle-\langle u,Lv\rangle=[p(u\overline{v''}-u''\bar
      v)]_{-1}^{1}$ with first argument linear. The regular Legendre polynomials and
      their derivatives are finite at both ends, so the boundary expression vanishes.
      Singular logarithmic solutions would require an endpoint condition; the differential
      expression alone does not specify a self-adjoint operator.


      An explicit regular self-adjoint realisation is obtained by closing the action
      on polynomials. For each $j$, $Lx^j=j(j+1)x^j-j(j-1)x^{j-2}$ (last term absent
      for $j=0,1$). Thus the triangular polynomial action has a monic eigenpolynomial
      of each degree $j$, since $j(j+1)$ differs from all lower diagonal entries.
      The boundary identity makes eigenpolynomials of distinct degrees orthogonal:
      $(m(m+1)-n(n+1))\int_{-1}^1P_mP_n=0$. Normalising these gives a complete orthonormal
      system, since they span all polynomials and polynomials are dense in $L^2[-1,1]$.
      In coefficient space the closure is multiplication by the real sequence $\lambda_n=n(n+1)$
      on $\sum\lambda_n^2|c_n|^2<\infty$ (truncate to finite sequences in graph norm).
      Its adjoint has the same domain and action by testing individual basis vectors
      and applying Parseval. This proves actual self-adjointness.


      For the convention $P_n(1)=1$ one has $\int_{-1}^{1}P_mP_n\,dx=2\delta_{mn}/(2n+1)$.
      Indeed Rodrigues'' formula gives leading coefficient $(2n)!/(2^n(n!)^2)$, and
      $n$ integrations by parts (boundary terms vanish by the order-$n$ endpoint zeros)
      yield $\int P_n^2=(2n)!/(2^{2n}(n!)^2)\int_{-1}^1(1-x^2)^n dx=2/(2n+1)$ by $u=(1+x)/2$
      and the beta integral. For $n=0$ the norm squared is 2. Rescaling changes the
      norm but preserves orthogonality.

      '
    main_comparison: Both use the Legendre operator on the maximal domain with zero
      endpoint fluxes. The L² derivative bound controls the endpoint limits, Green’s
      identity and independent endpoint tests identify the adjoint domain, and Rodrigues’
      normalization gives 2/(2n+1).
