        bounds, indices, monicity, signs and parity wording to the page image.
    independent_rework: '# IB/2011/P1/q6B — independent rework


      Write $h_j=\langle p_j,p_j\rangle>0$. The monic polynomials of consecutive degrees
      form a basis through each degree. Consequently $xp_n=p_{n+1}+\sum_{j=0}^n c_jp_j$
      and $c_jh_j=\langle p_n,xp_j\rangle$ by symmetry of multiplication by $x$. For
      $j<n-1$, $xp_j$ lies in the span of lower degrees than $n$, so $c_j=0$. For
      $n\ge1$, $xp_{n-1}-p_n$ has degree at most $n-1$, whence $c_{n-1}=h_n/h_{n-1}$.
      Thus the given recurrence holds with $\beta_n=h_n/h_{n-1}$ and $\alpha_n=\langle
      xp_n,p_n\rangle/h_n$. The starting values are $p_0=1$, $p_1=x-\alpha_0$, omitting
      the lower term.


      If $w$ is even, $q_n(x)=(-1)^np_n(-x)$ is monic of degree $n$. A change of variable
      shows it is orthogonal to every polynomial of degree less than $n$, since reflection
      preserves that space. Both $q_n$ and $p_n$ are orthogonal to their difference,
      whose degree is less than $n$; hence its norm vanishes. Positive definiteness
      gives $q_n=p_n$ (including $n=0$), proving parity.

      '
    main_comparison: Monicity fixes the leading recurrence coefficient. Orthogonality
      eliminates all but two lower terms, and their inner products give the norm ratio.
      Reflection and uniqueness establish parity for even weight.
