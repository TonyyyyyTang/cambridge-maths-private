    independent_rework: '# IB/2011/P3/q7A — independent rework


      For example, when $h,\widetilde h\in L^1(\mathbb R)$, Fourier inversion gives
      $h(x)=(2\pi)^{-1}\int_{\mathbb R}\widetilde h(k)e^{ikx}\,dk$ at points of continuity
      (and almost everywhere). If $f,g\in L^1$, set $(f*g)(x)=\int_{\mathbb R}f(t)g(x-t)\,dt$
      wherever it exists. By Fubini, changing variables $x=t+u$ in the transform gives
      $\widetilde{f*g}=\widetilde f\,\widetilde g$.


      For $f=e^{-|x|}$, splitting at zero gives $\widetilde f=(1-ik)^{-1}+(1+ik)^{-1}=2/(1+k^2)$.
      Therefore $\widetilde{f*f}=4/(1+k^2)^2$, an integrable function. The convolution
      is continuous (translate the bounded continuous factor under the integrable
      one and apply dominated convergence). Inversion gives $(f*f)(x)=\frac2\pi\int_{\mathbb
      R}\frac{e^{ikx}}{(1+k^2)^2}\,dk$ for every real $x$. A direct check at $x=0$
      gives $\int e^{-2|t|}\,dt=1$ and the same answer since $\int_{\mathbb R}(1+k^2)^{-2}\,dk=\pi/2$.

      '
    main_comparison: With inverse factor 1/(2π), the Fourier transform of exp(−|x|)
      is 2/(1+k²). Its square is integrable and inversion of the continuous convolution
      gives the stated kernel.
