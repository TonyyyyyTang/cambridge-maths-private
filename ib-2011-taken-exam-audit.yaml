      printed_label: 10G
      source_finding: Printed 10G, Linear Algebra, p. 5. Compared the order of the
        compositions, placement of t, strict inequality, invertibility and diagonalisation
        hypotheses, and both powers in part (ii).
    independent_rework: '# IB/2011/P4/q10G — independent rework


      For $w\in E_\lambda(f)$ the commutation relation gives $f(g^jw)=t^j\lambda g^jw$
      by induction for $j\ge0$. Invertibility forces every eigenvalue $\lambda$ to
      be nonzero. If $g^nw\ne0$, then all the vectors $w,gw,\dots,g^nw$ are nonzero.
      Their eigenvalues $\lambda,t\lambda,\dots,t^n\lambda$ are distinct since $t>1$,
      so these $n+1$ vectors would be linearly independent in dimension $n$. Therefore
      $g^n$ vanishes on all eigenspaces, and they span $V$ by diagonalisability. For
      the zero-dimensional space $g=0$ already.


      Under the extra assumption, $v,gv,\dots,g^{n-1}v$ are all nonzero. They are
      eigenvectors with eigenvalues $1,t,\dots,t^{n-1}$ and hence are independent,
      forming a basis. Thus the diagonal form is $\operatorname{diag}(1,t,\ldots,t^{n-1})$
      up to permutation. When $n=1$ this gives just $1$ and the nilpotent $g$ is zero.

      '
    main_comparison: The commuting relation forces distinct nonzero eigenvectors along
      each nonzero chain because t^kλ are distinct. Dimension cuts chains off by length
      n and a maximal specified chain is a basis.
