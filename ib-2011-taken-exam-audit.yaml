      printed_label: 20H
      source_finding: Printed 20H, Markov Chains, p. 11. Compared the four parts,
        the two transition cases, the order of the matrix and inner-product factors,
        and the closing notation.
    independent_rework: '# IB/2011/P1/q20H — independent rework


      An invariant distribution is a nonnegative row vector $\pi$ of sum one with
      $\sum_i\pi_i p_{ij}=\pi_j$ for every $j$. Detailed balance requires $\pi_i p_{ij}=\pi_j
      p_{ji}$ for every pair. Summing that identity over $i$ gives invariance since
      the rows of $P$ sum to one.


      On the given undirected graph set $Z=\sum_iD_i$ and $\pi_i=D_i/Z$. Wherever
      the given transition law is defined, each vertex has a neighbour. Every directed
      traversal of an undirected edge then has equilibrium flux $1/Z$ in either direction;
      a nonedge has flux zero in both directions. This probability vector therefore
      satisfies detailed balance, and is the unique invariant distribution by finite
      irreducibility. The displayed walk is undefined at an isolated singleton without
      a loop; if assigned a holding transition instead, detailed balance there holds
      trivially.


      On expanding the two inner products, the coefficient of $x_i y_j$ on the left
      is $\pi_i p_{ij}$ and on the right it is $\pi_j p_{ji}$. Pairwise equality therefore
      suffices for equality for all vectors. Conversely $x=e_i$ and $y=e_j$ recover
      precisely these coefficients, proving necessity even on the diagonal.

      '
    main_comparison: Both find the invariant measure proportional to degree. Expansion
      against coordinate vectors proves equivalence of detailed balance and self-adjointness
      in the stationary inner product.
