      Take smooth compactly supported wavefunctions initially and $\langle \phi,\psi\rangle=\int\bar\phi\psi\,d^3x$.
      Put $b_{ik}=\epsilon_{ijk}x_j$. Its divergence is $\epsilon_{ijk}\delta_{jk}=0$.
      Integration by parts therefore gives $\int\bar\phi(-i\hbar b_{ik}\partial_k\psi)=\int\overline{(-i\hbar
      b_{ik}\partial_k\phi)}\,\psi$. This proves Hermiticity on that core and for
      states with the same vanishing boundary form. The physical self-adjoint component
      is the generator of strongly continuous unitary rotations about axis $i$ (Lebesgue
      measure is rotation invariant).


      For a normalised state of finite angular quadratic energy, $\langle\mathbf L^2\rangle-\langle
      L_3^2\rangle=\|L_1\psi\|^2+\|L_2\psi\|^2\ge0$. Equality requires both generators
      to annihilate the state. Such a vector is invariant under both one-parameter
      rotation groups by the generator equation, hence under their products, which
      generate all spatial rotations. Since rotations act transitively on spheres
      centred at zero, the wavefunction depends only on radius, up to almost-everywhere
      equivalence. Conversely all angular generators annihilate a radial state. For
      smooth states the same conclusion follows using $[L_1,L_2]=i\hbar L_3$.


      The common spherical harmonics have eigenvalues $\hbar^2\ell(\ell+1)$ and $\hbar^2m^2$
      respectively, for $\ell=0,1,\ldots$ and $|m|\le\ell$. Their difference is at
      least $\hbar^2\ell$, strictly positive at $\ell>0$. The $\ell=0$ harmonic is
      constant in angle. Orthogonal expansion gives the same inequality and equality
      condition for superpositions with arbitrary radial coefficients.

      '
    main_comparison: Positivity of the squared angular generators forces the individual
      tangential derivatives to vanish in the equality case. The commutator supplies
      the third derivative, and the spherical spectrum confirms equality only for
      l=0.
