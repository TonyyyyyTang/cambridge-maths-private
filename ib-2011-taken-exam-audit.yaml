      original_pdf_sha256: 96a404f6a80123a85eb4a8e6b5719b6d511aef9413c4841a923119fd4c28c98a
      source_page: 9
      question_packet_sha256: 9a0774589a71b055be532d2ca4a80d2db9bbae457c8e55de8470ef3c000b40ba
      blind_rework_sha256: 3785731eb8d99ca289802c126c0e01961e89902ee0af46167248f2c8a9073dcb
