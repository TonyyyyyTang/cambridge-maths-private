auditor_report: '# Fresh blind audit of the 2011 Part IB sample


  All 13 supplied questions were independently reworked and compared visually against
  their archived original page images. Paper coverage was 4 questions on Paper 1,
  5 on Paper 2, 2 on Paper 3 and 2 on Paper 4. I checked the printed label, wording,
  subparts, symbols and hypotheses for each. None of the 13 showed a transcription
  or printed-label discrepancy (0/13). No question had a printed mark allocation.


  The independent reworks and their source records appear under each paper and question.
  Each question packet checksum is the SHA-256 of the supplied question.tex bytes.
  No stored solution or earlier solver''s conclusions were consulted. The observed
  solution-discrepancy rate requires comparison with the stored answers by the main
  agent. This sample covers the specified annual examination selection; it does not
  establish any individual course audit rate.


  Part (v) of P1/19H requires n>1 for a strict improvement. At n=1 no other unbiased
  estimator can improve on the zero indicator. P2/5A distinguishes the formal Green
  identity from the domain of a self-adjoint operator. P3/18D requires the thickness
  to reach its critical value before a continuous flow can leave on the other branch.

  '
main_resolution: The strict Rao–Blackwell improvement needs n>1. The Legendre flux
  conditions specify the self-adjoint domain. The slower elastic-tube outlet requires
  reaching the critical section and emerging on the opposite speed branch.
