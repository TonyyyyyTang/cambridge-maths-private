    independent_rework: '# IB/2011/P4/q3E — independent rework


      Let $(f_n)$ be Cauchy for the supremum distance. Since $|f_n(x)-f_m(x)|\le d(f_n,f_m)$,
      the scalar sequence at each $x$ is Cauchy in the complete real line; set $f(x)=\lim_m
      f_m(x)$. Given $\epsilon>0$, take $N$ with $d(f_n,f_m)<\epsilon/2$ for every
      $m,n\ge N$. Letting $m\to\infty$ gives $|f_n(x)-f(x)|\le\epsilon/2$ simultaneously
      for all $x$, hence uniform convergence. Choosing, for example, $\epsilon=2$
      gives $|f(x)|\le\sup|f_N|+1$ for all $x$. Thus $f$ belongs to $B[0,1]$ and the
      convergence is in its metric.


      If continuous $f_n$ converge in $d$ to $f\in B[0,1]$, choose $N$ with $d(f_N,f)<\epsilon/3$.
      At each fixed $x_0$ continuity of $f_N$ supplies $\delta>0$ so $|f_N(x)-f_N(x_0)|<\epsilon/3$
      for $x$ in the interval with $|x-x_0|<\delta$. The triangle inequality and the
      two uniform error bounds give $|f(x)-f(x_0)|<\epsilon$, including at the endpoints
      in the relative topology. Hence $f$ is continuous. Sequential closedness is
      equivalent to closedness in a metric space.

      '
    main_comparison: Pointwise completeness of the reals and the common supremum bound
      yield a bounded uniform limit. An epsilon/3 estimate makes the continuous subspace
      closed.
