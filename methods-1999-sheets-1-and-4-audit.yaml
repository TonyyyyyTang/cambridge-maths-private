blind_rework: '# Independent audit of six Methods questions


  Only the supplied statements and physical locators, original PostScript and its
  rendered images were used to derive the answers. No existing answer was opened.
  See `evidence.json` for the original and statement SHA-256 digests and the physical
  page for each rework. The source-image review used Ghostscript 10.07.0, A4 fixed
  media and 165 dpi. The higher-resolution 550 dpi render of sheet 1 p. 1 confirmed
  the trailing comma in the Parseval identity. Physical pages 1 and 2 were inspected
  on sheet 1, and physical page 2 on sheet 4. Question numbers are recorded by locator.
  Across the six statements I checked headings, sentences, formulae, signs, indices,
  limits, conditions, numerical constants and subparts against the images. The source
  uses typographical underlining on titles as well as italics. No assessed question
  carries a printed mark allocation.


  ## Sheet 1, printed Q4, physical p. 1


  For real square-integrable f, take the norm squared to be the integral of the square
  divided by T. Each nonconstant basis function has norm 1, the constant 1 has squared
  norm 2, and different basis functions are orthogonal by integrating the product-to-sum
  formulae over a complete period. Thus the squared norm of the Nth Fourier partial
  sum is a0²/2 plus the sum of a_n²+b_n² through N. In the mean-square limit the norms
  converge to the norm of f, proving the identity. If the printed convergence assumption
  is taken as pointwise convergence of the Fourier series and convergence of the square
  sum, orthogonality makes the partial sums Cauchy in L². A subsequence converges
  almost everywhere to the L² limit, which consequently equals f almost everywhere.


  Oddness removes the constant and the cosine terms. Integrating the sine over (0,T)
  gives b_n = 2(1−(−1)^n)/(nπ). Only n=1,3 have nonzero coefficient below 9/2. With
  unit transmission of the retained modes, the output is (4/π)[sin(πt/T)+sin(3πt/T)/3].
  Its mean-square power is one half the sum of the two retained squared amplitudes,
  or 80/(9π²). The input has mean square 1 and the transmitted fraction is 80/(9π²),
  about 0.900633. Values assigned at jump points do not change the power or coefficients.


  The original has cutoff (9/2)π/T twice, the constant-term halves in both formulae,
  and an incident square wave with positive sign for positive t. All match the statement.


  ## Sheet 1, printed Q10, physical p. 2


  Assume φ is continuously differentiable near each simple interior zero r and f is
  continuous there (for the distribution identity, take smooth test functions). Choose
  a neighborhood in which φ can serve as a coordinate, y=φ(x). The transformed test
  function at y=0 is f(r)/|φ′(r)|, since reversal of the limits for the decreasing
  map supplies the minus sign. Away from the zero the pulled-back delta has no support.
  Thus for one zero the integral is f(c)/|φ′(c)| in either monotonicity case. Separate
  the zero neighborhoods to obtain the sum of the corresponding contributions, including
  in the case of locally finitely many simple zeros on compact test-function support.
  Endpoint zeros would need a convention. Monotonicity alone permits φ(x)=x³, for
  which this pullback argument fails.


  For a real nonzero a, the two simple roots of x²−a² are ±|a|, with slope magnitudes
  2|a|. Each carries weight |a|/(2|a|)=1/2. The integral is 1. At a=0 the root is
  double and δ(x²) is undefined by the usual simple-zero pullback. For instance, replacing
  δ by a mollifier ρ_ε gives 2∫₀^∞ x ρ_ε(x²)dx = ∫₀^∞ρ_ε(u)du; this depends on the
  regularisation, although the symmetric choice yields half. The natural continuation
  of the simple-root result as a→0 is 1 and differs from this symmetric regularisation
  at a=0.


  The original says monotone increasing for the first formula, says “provided the
  zeros are simple” for the generalisation and leaves the last a unrestricted. The
  packet preserves all three features; the qualifications belong in the solution.


  ## Sheet 1, printed Q12, physical p. 2


  Take m>0. On each side of t₀ the acceleration vanishes, so the motion is affine.
  Integrating the differential equation across t₀ gives the velocity increment I/m.
  A position jump would introduce a delta derivative in the acceleration, absent on
  the right, so position is continuous. Hence x(t)=Vt+(I/m)max(t−t₀,0). Its distributional
  second derivative is (I/m)δ(t−t₀); its value and right velocity at zero meet the
  specified data since t₀>0. The difference of two solutions has zero second derivative
  and zero initial data, hence vanishes. This is an otherwise free point mass with
  signed initial velocity V along the line, receiving a point impulse of signed momentum
  I at t₀. The before/after velocities are the data at the impulse, where a classical
  two-sided velocity need not exist.


  Initial velocity V, positive impulse time and the delta argument t−t₀ match the
  original.


  ## Sheet 4, printed Q9, physical p. 2


  Write x=r n with n a unit vector. The radial factor left by either integrand after
  multiplication by r²dr is exp(−γr²)dr. Each angular monomial is bounded by 1; the
  integrals therefore converge absolutely as r tends to zero and infinity for γ>0.
  The off-diagonal products n_i n_j integrate to zero upon reflection of an axis.
  Permutations make the three diagonal integrals equal and their sum is the area 4π
  because Σ n_i²=1. Each component of the rank-two integral is consequently (4π/3)δ_ij
  times √π/(2√γ), i.e. 2π^(3/2)δ_ij/(3√γ). Inversion n↦−n preserves area and reverses
  the rank-three product, giving zero in every component of (ii).


  Both negative powers, the Gaussian sign and the components of the integrands match.
  The printed comma following (i)''s dV matches the packet.


  ## Sheet 4, printed Q12, physical p. 2


  Use Cartesian coordinates and differentiable fields. The vector cross product identity
  in components gives ((curl H)×B)_i = μ(H_k ∂_k H_i − H_k ∂_i H_k). To see the sign,
  use ε_ijk ε_jlm = δ_im δ_kl − δ_il δ_km. Independently differentiating the proposed
  stress gives μH_k∂_kH_i+μH_i∂_kH_k−μH_m∂_iH_m. The middle term vanishes by ∂_kB_k=0
  with constant μ; this uses μ∂_kH_k=0 without dividing by μ and also covers zero
  permeability formally. The remaining terms coincide with J×B.


  The current is curl H, the multiplication order is J×B, the derivative is with respect
  to x_k and the isotropic stress has the minus sign and factor 1/2. All match the
  original.


  ## Sheet 4, printed Q14, physical p. 2


  The gradient has rows (x₂²,2x₁x₂,0), (0,x₃²,2x₂x₃), (2x₃x₁,0,x₁²). At (2,3,0) the
  rows are (9,12,0), (0,0,0), (0,0,4). Separate the symmetric and antisymmetric parts
  by adding and subtracting the transpose and halving. The symmetric e has rows (9,6,0),
  (6,0,0), (0,0,4). The antisymmetric remainder has entries A₁₂=6, A₂₁=−6, others
  zero. This is ε_ijk ω_j for ω=(0,0,−6), since ε₁₃₂=−1. Thus ∂_k u_i=e_ik+ε_ijk ω_j.
  Multiplying e by (1,−2,0), (2,1,0) and (0,0,1) gives respectively (−3,6,0), (24,12,0)
  and (0,0,4). The eigenvalues in printed order are −3, 12 and 4, and these mutually
  perpendicular vectors give the printed unit principal directions after normalisation.


  The index order ε_ijk ω_j, point, components and all three directions match the
  image, including the comma following the third direction.


  ## Findings and verification


  Confirmed transcription errors: 0/6. I initially flagged the commas after dV in
  sheet 4 Q9 and after (0,0,1) in sheet 4 Q14 as missing from the supplied statements.
  On checking the literal lines in both files against the image I found that both
  commas were already present. Both preliminary flags are withdrawn; no edits are
  called for. Sheet 1 Q10 contains an implicit mathematical restriction originating
  in the printed source. The original also omits a simple-root assumption in the monotone
  paragraph.


  Executable independent checks for all six reworks are in `check.py`; `check-results.txt`
  records the successful run. These check the answers derived above. Comparison against
  the project''s stored answers is reserved for the coordinator after this packet
  is frozen.

  '
independent_check:
  source: "#!/usr/bin/env python3\n\"\"\"Independent tests for the six printed questions,\
    \ using the Python standard library.\"\"\"\nfrom fractions import Fraction as\
    \ F\nfrom itertools import product\nfrom math import cos, sin, exp, pi, sqrt,\
    \ fsum, isclose\n\n\ndef near(actual, expected, tol=1e-8):\n    assert isclose(actual,\
    \ expected, rel_tol=tol, abs_tol=tol), (actual, expected)\n\n\ndef integral(f,\
    \ a, b, n=2048):\n    step = (b - a) / n\n    return step * (f(a) + f(b) + fsum(\n\
    \        (4 if j % 2 else 2) * f(a + j * step) for j in range(1, n)\n    )) /\
    \ 3\n\n\ndef parseval():\n    # Work in phase = pi*t/T. Split at jumps to avoid\
    \ sampling ambiguous endpoints.\n    for n in range(1, 9):\n        b = (integral(lambda\
    \ t: sin(n*t), 0, pi)\n             - integral(lambda t: sin(n*t), -pi, 0)) /\
    \ pi\n        near(b, 4/(pi*n) if n % 2 else 0)\n    power = integral(lambda t:\
    \ (4/pi*(sin(t)+sin(3*t)/3))**2, -pi, pi)/(2*pi)\n    near(power, 80/(9*pi*pi))\n\
    \    f = lambda t: 1.3 + 2*sin(2*t) - 3*cos(t)\n    near(integral(lambda t: f(t)**2,\
    \ -pi, pi)/pi, 2*1.3**2 + 4 + 9)\n    return f'computed power fraction {power:.12f}'\n\
    \n\ndef delta():\n    eps = 0.018\n    moll = lambda y: exp(-(y/eps)**2)/(sqrt(pi)*eps)\n\
    \    test = lambda x: 1+x+x*x\n    # Compare a regularised original x-integral\
    \ against the exact two-root sum.\n    for a in (0.7, -1.5):\n        rho = abs(a)\n\
    \        estimate = integral(lambda x: test(x)*moll(x*x-a*a), -2, 2, 8192)\n \
    \       near(estimate, (test(rho)+test(-rho))/(2*rho), 0.0004)\n        near(integral(lambda\
    \ x: abs(x)*moll(x*x-a*a), -2, 2, 8192), 1)\n    # Decreasing single-root change\
    \ of variables.\n    near(integral(lambda x: test(x)*moll(2-3*x), 0, 2), test(2/3)/3,\
    \ 2e-5)\n    return 'two simple roots, decreasing change of variable, and both\
    \ signs of a passed'\n\n\ndef impulse():\n    m, I, t0, V, T = 3, -5, 1, 2, 3\n\
    \    pos = lambda t: V*t + I/m*max(t-t0, 0)\n    phi = lambda t: t**3*(T-t)**3\n\
    \    phi2 = lambda t: 6*T**3*t - 36*T**2*t**2 + 60*T*t**3 - 30*t**4\n    val =\
    \ m * (integral(lambda t: pos(t)*phi2(t), 0, t0)\n               + integral(lambda\
    \ t: pos(t)*phi2(t), t0, T))\n    near(val, I*phi(t0))\n    near(pos(0), 0)\n\
    \    near(pos(0.05)/0.05, V)\n    return f'weak impulse identity gave {val:.9f}'\n\
    \n\ndef isotropic():\n    # Approximate angle by equally spaced azimuths and midpoint\
    \ u = cos(theta).\n    dirs = []\n    for j in range(96):\n        u = -1+(j+0.5)*2/96\n\
    \        for k in range(24):\n            v = 2*pi*k/24\n            dirs.append((sqrt(1-u*u)*cos(v),\
    \ sqrt(1-u*u)*sin(v), u))\n    for gamma in (0.3, 2.5):\n        radial = integral(lambda\
    \ r: exp(-gamma*r*r), 0, 9/sqrt(gamma))\n        def angular(indices):\n     \
    \       import math\n            return 4*pi*fsum(math.prod(d[i] for i in indices)\
    \ for d in dirs)/len(dirs)\n        for i,j in product(range(3), repeat=2):\n\
    \            near(radial*angular((i,j)), 2*pi**1.5/(3*sqrt(gamma))*(i==j), 0.00015)\n\
    \        for ijk in product(range(3), repeat=3):\n            near(radial*angular(ijk),\
    \ 0)\n    return '9 even and 27 odd components integrated at each of two positive\
    \ gamma'\n\n\ndef electrodynamics():\n    def field(p):\n        x,y,z = p\n \
    \       return [y*y+z, z*z+2*x, x*x+3*y]\n    for p in [(1.,-0.5,2.), (-1.,2.,0.3)]:\n\
    \        x,y,z = p\n        h = field(p)\n        curl = [3-2*z, 1-2*x, 2-2*y]\n\
    \        for mu in (0., 1.7):\n            def stress(v, i, k):\n            \
    \    b = field(v)\n                return mu*(b[i]*b[k] - 0.5*(i==k)*sum(q*q for\
    \ q in b))\n            for i in range(3):\n                div = 0\n        \
    \        for k in range(3):\n                    q, r = list(p), list(p)\n   \
    \                 d = 1e-5\n                    q[k] += d\n                  \
    \  r[k] -= d\n                    div += (stress(q,i,k)-stress(r,i,k))/(2*d)\n\
    \                j,k = (i+1)%3, (i+2)%3\n                near(div, mu*(curl[j]*h[k]-curl[k]*h[j]),\
    \ 2e-8)\n    return 'numerical stress divergence matched the curl cross B on polynomial\
    \ fields'\n\n\ndef decomposition():\n    def velocity(p):\n        x,y,z = p\n\
    \        return [x*y*y, y*z*z, z*x*x]\n    a = [[0]*3 for _ in range(3)]\n   \
    \ for k in range(3):\n        p = [2,3,0]\n        q, r = p.copy(), p.copy()\n\
    \        q[k] += F(1,10)\n        r[k] -= F(1,10)\n        for i in range(3):\n\
    \            a[i][k] = (velocity(q)[i]-velocity(r)[i]) / F(1,5)\n    s = [[(a[i][k]+a[k][i])/2\
    \ for k in range(3)] for i in range(3)]\n    for v, lam in [([1,-2,0],-3),([2,1,0],12),([0,0,1],4)]:\n\
    \        assert [sum(s[i][k]*v[k] for k in range(3)) for i in range(3)] == [lam*x\
    \ for x in v]\n    omega = [(a[2][1]-a[1][2])/2, (a[0][2]-a[2][0])/2, (a[1][0]-a[0][1])/2]\n\
    \    assert omega == [0,0,-6]\n    return 'exact central differences, three eigenpairs,\
    \ and signed axial vector passed'\n\n\nif __name__ == '__main__':\n    for tag,\
    \ test_fn in [('1/4', parseval), ('1/10', delta), ('1/12', impulse),\n       \
    \                  ('4/9', isotropic), ('4/12', electrodynamics), ('4/14', decomposition)]:\n\
    \        print(tag, test_fn())\n"
  sha256: 7567450412bff8b04a42d46b6cba821e028633c2367d72b92cdedf4278a7377f
