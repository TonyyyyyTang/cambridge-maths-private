    independent_solution: '# Independent rework — IB/2013/P3/q16B


      Take \(i\hbar\psi_t=-(\hbar^2/2m)\Delta\psi+U\psi\). Conjugate and substitute
      both time derivatives into \(\partial_t\rho=\psi^*\psi_t+\psi_t^*\psi\), \(\rho=|\psi|^2\).
      Since \(\psi^*\Delta\psi-\psi\Delta\psi^*=\nabla\cdot(\psi^*\nabla\psi-\psi\nabla\psi^*)\),
      one gets

      \[

      \partial_t\rho+\nabla\cdot\mathbf j=(2/\hbar)\rho\,{\rm Im}\,U,\qquad

      \mathbf j=\frac{\hbar}{2mi}(\psi^*\nabla\psi-\psi\nabla\psi^*).

      \]

      A real scalar potential gives local probability conservation even if it is time-dependent.


      With \(U=U(\mathbf x)\), integrate over a ball of radius \(R\). The divergence
      term becomes the outward surface flux. Assume sufficient integrability and decay
      to differentiate under the volume integral and to make the flux tend to zero
      as \(R\to\infty\) (as for a rapidly decaying state). Then \(N(t)=\int|\psi|^2\)
      satisfies \(N''(t)=(2/\hbar)\int\rho\,{\rm Im}\,U\). Here \(N(0)=1\). The Taylor
      coefficient is \(N''(0)=(2/\hbar)\int\rho_0\,{\rm Im}\,U\), giving the requested
      expansion \(1+(2t/\hbar)\int\rho_0\,{\rm Im}\,U+\cdots\). If the imaginary part
      is everywhere negative and the state has nonzero norm, this derivative is strictly
      negative, so the total probability decreases. The identity alone imposes no
      universal exponential rate or limit zero for a merely pointwise negative imaginary
      part.

      '
    fresh_sha256: e2f47b27595bc8722227c2c3d0601629b2ab0302e06f98a12394b54c18ab8fb5
    main_comparison: A complex potential contributes 2 Im(U) times the density divided
      by hbar to the continuity equation. Vanishing flux at infinity makes its integral
      the norm derivative. Strict negativity implies monotone loss for a nonzero state
      without fixing a decay rate.
