    independent_solution: '# Independent rework — IB/2013/P2/q20H


      (i) From \(i\), the event of hitting \(j\) at a strictly positive time and then
      hitting \(i\) at a later time entails a return. By the strong Markov property
      its probability is \(f_{ij}f_{ji}\), including the case \(i=j\). If \(N\) counts
      all visits to \(i\) including time zero, repeated strong Markov at returns gives
      \(P_i(N\ge r)=f_{ii}^{r-1}\), \(r\ge1\), with the first term one. Summing visit
      indicators and separately summing tails gives the two expressions for \(E_iN\)
      by monotone convergence.


      (ii) Transform \((x,y)\) to \((x+y,x-y)\). Each one-step increment in these
      coordinates is a uniform pair of independent signs. Thus the probability of
      returning at \(2m\) is \(b_m^2\) with \(b_m=4^{-m}{2m\choose m}\), while odd-time
      return is impossible. For \(m\ge2\), \(b_m^2>1/(4m)\). The divergent return
      sum forces \(f_{ii}=1\) by (i); translation invariance covers every state. At
      \(m=1\), the printed strict lower bound has equality, immaterial to divergence.
      By irreducibility a recurrent walk hits the origin from any start, and repeats
      this infinitely often (each return to the start offers a fixed positive chance
      to follow a path to the origin before another return).


      (iii) With two active walks, the joint walk on the accessible parity class has
      origin return probabilities \(b_m^4<1/m^2\) at times \(2m\) and zero at odd
      times. Its return probability \(r\) is strictly less than one by (i). Invariance
      under translation and simultaneous reflection makes the origin-to-start and
      start-to-origin hitting probabilities equal, say \(p\): reflection in the midpoint
      interchanges the joint states and preserves the increment law. By (i), \(p^2\le
      r<1\). Also \(p>0\): both can walk straight to the origin in 100 steps.


      For the sleepy schedule let \(A_i\) be the event that the princess visits the
      origin during block \(i\). Independently of her, the monster''s skeleton \(Y\)
      visits the origin infinitely often. Conditional on \(Y\), its visiting blocks
      \(i_j\) with \(Y_{i_j+1}=0\) form a fixed infinite sequence. For each \(m\),
      \(P_X(\bigcup_{j\ge m} A_{i_j})\ge1/2\) by the printed marginal condition, so
      \(P_X(A_{i_j}\ {\rm infinitely\ often})\ge1/2\) by continuity from above. This
      limsup event is invariant under every finite permutation of the i.i.d. princess
      increments: all positions beyond the permuted segment agree, so all sufficiently
      late blocks agree. By the Hewitt–Savage zero–one law its probability is one.
      For completeness the zero–one argument approximates such an event \(D\) in probability
      within \(\varepsilon\) by a first-\(m\)-increment event \(B\); swapping those
      \(m\) increments with the next \(m\) produces an independent copy \(B''\) still
      within \(\varepsilon\) of \(D\). Thus \(P(B)^2=P(B\cap B'')\) differs from \(P(D)\)
      by at most \(2\varepsilon\); passing to zero yields \(P(D)^2=P(D)\). Removing
      conditioning gives capture with probability one. No independence of the princess''s
      successive block events is required. Such deterministic blocks can be chosen
      recursively by recurrence and continuity from below.

      '
    fresh_sha256: ea61aefeb43a9d9874aec5e3378ddd55ba3ab307cc07901a9882d1e3ffad9d5c
    main_comparison: Both establish recurrence by the divergent even-time central-binomial
      sum. Active capture has strictly positive probability bounded by 1/49. Conditional
