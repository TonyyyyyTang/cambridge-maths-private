    independent_solution: '# Independent rework — IB/2013/P2/q10E


      Linear dependence means there are finitely many distinct vectors from the set
      and coefficients, at least one nonzero, whose linear combination vanishes. For
      \(n+1\) vectors in dimension-coordinate space \(\mathbb R^n\) use induction
      on \(n\). In \(\mathbb R^0\) a single vector is zero. If every last coordinate
      vanishes, apply the induction hypothesis to any \(n\) of the vectors in the
      first \(n-1\) coordinates. Otherwise move a vector \(v_0\) with nonzero last
      coordinate to the front and set \(w_j=v_j-(v_{j,n}/v_{0,n})v_0\), \(1\le j\le
      n\). These \(n\) vectors have zero last coordinate, so there is a nontrivial
      relation among them by induction. Substitution retains the nonzero coefficient
      of at least one \(v_j,\ j\ge1\). The same argument works over any field.


      Coordinates in a specified \(n\)-element basis identify \(V\) linearly and bijectively
      with scalar \(n\)-space. Every other basis is independent, so it has at most
      \(n\) elements (even an infinite one would have \(n+1\) distinct elements).
      If it has \(m\), reverse the two coordinate descriptions to deduce \(n\le m\).
      This includes the zero space. Finally the functions \(b_j(x)=\max(0,1-2|x-j|)\),
      \(j=1,2,\ldots\), are bounded continuous and satisfy \(b_j(k)=\delta_{jk}\)
      for positive integers \(k\). Evaluating a finite linear relation at each centre
      makes every coefficient vanish. Hence this space cannot have a finite basis.

      '
    fresh_sha256: 670883c2c2a4b55553ecd4fbb8ad2db9164143020c10cc2f68ae1886274ca1ef
    main_comparison: Pivot elimination reduces the dependence assertion by one dimension.
      Interchanging bases gives equality of their sizes. Evaluating bounded triangular
      bump functions at their distinct centres proves infinite independence.
