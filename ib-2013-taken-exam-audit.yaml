    independent_solution: '# Independent rework — IB/2013/P1/q19H


      Put \(B=(X^TX)^{-1}X^T,\ H=XB\). Then \(\hat\theta=\theta+B\epsilon,\ \hat\epsilon=(I-H)\epsilon\).
      Since \(H\) is an orthogonal projection, the two laws are \(N_p(\theta,\sigma^2(X^TX)^{-1})\)
      and the possibly singular \(N_n(0,\sigma^2(I-H))\); their cross-covariance is
      \(\sigma^2 B(I-H)=0\). Joint Gaussianity also gives independence.


      Order trees \(11,12,21,22\). Both designs have intercept columns \((1,1,0,0)^T,(0,0,1,1)^T\),
      with respective third columns \((0,1,2,3)^T\) and \((0,2,3,1)^T\). Row centring
      removes the intercepts. The least-squares slope is \(\sum(x_{ij}-\bar x_i)y_{ij}/S,\
      S=\sum(x_{ij}-\bar x_i)^2\), by differentiating the residual sum after fitting
      the intercepts. Its variance is \(\sigma^2/S\), giving \(\sigma^2\) for I and
      \(\sigma^2/4\) for II.


      In II both within-row slopes are \(100\) and the fitted row intercepts are \(100,300\).
      The total forecast at zero fertilizer is \(2(100+300)=800\). For a future total
      \(T\), the difference from \(l^T\hat\theta,\ l=(2,2,0)^T\), has variance \(\sigma^2[4+l^T(X^TX)^{-1}l]\)
      including four independent future observations. Since \(l^T\hat\theta=2\bar
      y_1+2\bar y_2-6\hat\beta\) and the centred slope is uncorrelated with both row
      means, its variance is \((4+36/4)\sigma^2=13\sigma^2\). Thus the usual two-sided
      95% interval is \(800\pm t_{1,0.975}\sqrt{17}\,s\), \(s^2={\rm RSS}/(4-3)\).
      The scalar residual component is normal and independent of the prediction error
      by orthogonal projection and future independence, giving the \(t_1\) pivot almost
      surely. Here all residuals are exactly zero, so the interval formula evaluates
      to \([800,800]\). Under a positive-variance continuous model this dataset belongs
      to a null event; the pivot itself has zero denominator here and unconditional
      coverage does not give conditional certainty.

      '
    fresh_sha256: 3c513a8de61181de6b910a3f74d286a560314c297ac68881639a9fb9f99688b1
    main_comparison: The common-slope design gives relative slope variances four to
      one. The independent forecast and estimation variance sum to 17 sigma squared.
      The data give an exact fitted total of 800 and zero RSS, hence plug-in endpoints
      [800,800] on a probability-zero observation for positive Gaussian variance.
