    independent_solution: '# Independent rework — IB/2013/P1/q13E


      Let \(p(z)=a\prod_{j=1}^{2m}(z-r_j)\), listing multiplicities. On \(|z|>R\),
      each \(1-r_j/z\) lies in the disk \(|w-1|<1\), which has a single-valued holomorphic
      logarithm. Choose \(b^2=a\). Then \(bz^m\exp(\tfrac12\sum_j\log(1-r_j/z))\)
      is holomorphic and squares to \(p\); this covers nonzero constants as well.
      For \(z^4-z\), on \(|z|>1\) take \(z^2(1-z^{-3})^{1/2}\) with the root positive
      near 1. Its binomial series converges uniformly on \(|z|=2\), starting \(z^2-\tfrac12z^{-1}+O(z^{-4})\)
      with later exponents \(2-3j,\ j\ge2\). Termwise integration anticlockwise gives
      \(-\pi i\). The other branch gives \(+\pi i\), since the quotient of two branches
      maps the connected exterior into \(\{1,-1\}\).

      '
    fresh_sha256: 457d64ac6c533bcaf90c0acb0d9baffc8c81b6835dd03a4032db575a92462f31
    main_comparison: On the exterior, factoring a polynomial of even degree into its
      leading monomial times a function near one gives an analytic square root there.
      Both find coefficient -1/2 of the reciprocal power, hence integral -pi i and
      the opposite sign on the other branch.
