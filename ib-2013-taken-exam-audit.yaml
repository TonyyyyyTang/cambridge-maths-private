    independent_solution: '# Independent rework — IB/2013/P1/q1E


      Write \(A^{(i,j)}\) for the result of deleting row \(i\) and column \(j\). Put
      \(C_{ij}=(-1)^{i+j}\det A^{(i,j)}\); the adjugate is \(C^T\) (the empty minor
      has determinant one). The \(ij\) entry of \(AC^T\) expands a determinant along
      row \(j\), replacing that row by row \(i\). It gives \(\det A\) for \(i=j\)
      and zero otherwise because two rows coincide. The column version gives \(C^TA=(\det
      A)I\). Hence \(A^{-1}=C^T/\det A\) when the determinant is nonzero. Integer
      entries yield integer cofactors, so determinant \(1\) or \(-1\) suffices. Conversely
      an integral inverse gives two integers \(\det A,\det(A^{-1})\) whose product
      is one, forcing both to be units. For singular \(A\) there is no inverse.

      '
