    independent_solution: "# Independent rework — IB/2013/P4/q5C\n\nLet \\(c,L>0\\\
      ) and use characteristic variables \\(\\xi=ct-x,\\eta=ct+x\\). The left hand\
      \ side becomes \\(4y_{\\xi\\eta}\\). Integration on the characteristic domain\
      \ gives \\(y=f(\\xi)+g(\\eta)\\) (constant of integration absorbed into either\
      \ profile); differentiation verifies the converse. For \\(s=ct>0\\), the two\
      \ ends imply \\(g(s)=-f(s)\\) and \\(g(s+L)=-f(s-L)\\). Consequently \\(f(u+2L)=f(u)\\\
      ) for \\(u>-L\\), hence \\(g\\) is \\(2L\\)-periodic on its sampled domain \\\
      (u>0\\). These determine globally \\(2L\\)-periodic extensions with \\(g=-f\\\
      ). A choice of arbitrary profile values outside the sampled domains is not forced\
      \ by the positive-time boundary conditions. \n\nLet \\(H=(f')^2\\) for the periodic\
      \ representative. Compute \\(c^{-1}y_t=f'(ct-x)+g'(ct+x)\\) and \\(y_x=-f'(ct-x)+g'(ct+x)\\\
      ). Squaring cancels the cross terms, so\n\\[\nE(t)=\\int_0^L[H(ct-x)+H(ct+x)]\\\
      ,dx=\\int_{ct-L}^{ct+L} H(s)\\,ds .\n\\]\nThis integral covers a full period\
      \ and is independent of \\(t\\). Smoothness up to the boundaries suffices for\
      \ all differentiations.\n"
    fresh_sha256: 5842985b3b53c55ff5f8a36e0e53a0141365e6f6447cd974fc3a19b63e5e7e25
    main_comparison: The wave equation factors in characteristic coordinates. Reflection
      at the two ends implies period 2L on the arguments reached at positive time,
      with global periodic extensions available. The energy reduces to the squared
      profile derivative integrated over one period.
