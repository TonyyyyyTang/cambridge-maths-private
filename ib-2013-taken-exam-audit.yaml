    independent_solution: '# Independent rework — IB/2013/P4/q3F


      If \(F\) is differentiable at \(a\) and \(G\) is differentiable at \(F(a)\),
      then \(G\circ F\) is differentiable at \(a\) with \(D(G\circ F)_a=DG_{F(a)}\circ
      DF_a\). Indeed, put \(A=DF_a,\ B=DG_{F(a)},\ k=F(a+h)-F(a)=Ah+r(h)\) where \(r(h)=o(|h|)\).
      The increment of \(G\) is \(Bk+s(k)\) where \(s(k)=o(|k|)\) and \(s(0)=0\).
      As \(|k|\le(\|A\|+1)|h|\) for small \(h\), the full remainder \(Br(h)+s(k)\)
      is \(o(|h|)\), also when \(k=0\). This proves the assertion. Now \(H(y)=y\cdot
      y\) has derivative \(DH_y(v)=2y\cdot v\). Since \(H(F(x))=1\) everywhere, \(F(x)\cdot
      DF_x(v)=0\) for every \(v\). The image of \(DF_x\) lies in the one-dimensional
      perpendicular to the nonzero unit vector \(F(x)\in\mathbb R^2\), so its determinant
      is zero.

      '
    fresh_sha256: 30a52cb16ccb360282e25c07ffd979147cdd3d4d54568235574e586ae42171d3
    main_comparison: The two differentiability remainders give the chain rule, including
      increments for which the interior difference vanishes. Both columns lie in the
      orthogonal complement of the nonzero circle vector, so the determinant is zero.
