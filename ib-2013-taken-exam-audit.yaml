    independent_solution: '# Independent rework — IB/2013/P4/q18A


      For \(\mathbf v=\nabla\phi\), incompressibility means \(\Delta\phi=0\). Orient
      the polar axis along the sphere velocity. Impermeability gives \(\phi_r(a,\theta)=U\cos\theta\);
      far away \(\nabla\phi\to0\). In the separated ansatz choose \(g=\cos\theta\)
      to fit the boundary data. Since \((\sin\theta\,g'')''=-2\sin\theta\,g\), the
      radial equation is \((r^2f'')''-2f=0\), hence \(f=Ar+B/r^2\). The far field
      sets \(A=0\) and the sphere condition sets \(B=-Ua^3/2\). In the usual zero-at-infinity
      gauge, \(\phi=-Ua^3\cos\theta/(2r^2)\). Uniqueness within decaying exterior
      potentials follows by applying Green''s identity to the difference: its inner
      flux vanishes and its surface term at infinity vanishes for the decaying exterior
      harmonic expansion, forcing its gradient to vanish. The velocity is

      \[

      \mathbf v=(Ua^3/r^3)\big(\cos\theta\,\mathbf e_r+\tfrac12\sin\theta\,\mathbf
      e_\theta\big).

      \]

      With fluid density \(\rho\), integrate the speed squared. The radial integral
      is \(\int_a^\infty r^{-4}dr=1/(3a^3)\); the angular integral of \(\cos^2\theta+\tfrac14\sin^2\theta\)
      is \(4\pi(1/3+1/6)=2\pi\). Thus \(T_f=(\rho/2)U^2a^6\,2\pi/(3a^3)=\pi\rho a^3U^2/3=kMU^2/4\)
      using the displaced mass \(4\pi\rho a^3/3=kM\). After descent by \(h\), gravity
      and buoyancy release energy \((1-k)Mgh\). Equating this to \(MU^2/2+kMU^2/4\)
      gives \(U=\sqrt{4(1-k)gh/(2+k)}\). The mass cancels. The \(k\downarrow0\) limit
      recovers \(\sqrt{2gh}\).

      '
