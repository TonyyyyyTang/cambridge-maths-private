    independent_solution: '# Independent rework — IB/2013/P3/q19C


      Test \(1,x,x^2\). Exactness gives \(a_0+a_1+a_2=0,\ a_1+2a_2=1,\ a_1+4a_2=0\),
      hence \((a_0,a_1,a_2)=(-3/2,2,-1/2)\). Apply the Peano kernel theorem on \([0,2]\)
      to \(e\), which annihilates all quadratics and is continuous on \(C^3\). Then
      \(e(f)=\int_0^2 K(t)f''''''(t)\,dt\), where \(K(t)=e_x((x-t)_+^2/2)\). At zero
      the test function and its derivative vanish for \(t\ge0\); hence \(K(t)=(2-t)^2/4-(1-t)_+^2\).
      On \([0,1]\) this is \(t-3t^2/4\ge0\), and on \([1,2]\) it is \((2-t)^2/4\ge0\).
      Thus the best bound is at most \(\int K=1/4+1/12=1/3\). In fact \(f=x^3/6\)
      gives \(f''''''=1\) and \(e(f)=1/3\), proving sharpness.

      '
    fresh_sha256: 8c3ffb3afeb7b41e32adab44cebdbf962b699cd95b080ee3f6ce8e788abc8543
    main_comparison: The two kernels differ by the conventional factor of two for
      the truncated square. Their integrated nonnegative weights both give 1/3 and
      the cubic x^3/6 attains the bound.
