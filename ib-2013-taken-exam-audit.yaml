    independent_solution: '# Independent rework — IB/2013/P1/q16D


      Treat the carriers as independent classical particles moving with acceleration
      \(e\mathbf E/m\) between instantaneous independent collisions against a fixed
      ion background. A collision resets the drift to zero on average. With constant
      collision rate \(1/\tau\), survival for \(dt\) has probability \(1-dt/\tau+o(dt)\).
      Writing \(\mathbf w=\langle\mathbf v\rangle\), take the ensemble mean after
      \(dt\): \(\mathbf w(t+dt)=(1-dt/\tau)(\mathbf w(t)+e\mathbf E\,dt/m)+o(dt)\).
      The equation is \(\dot{\mathbf w}=-\mathbf w/\tau+e\mathbf E/m\). Here \(e\)
      is signed. With the given time dependence, \((1/\tau-i\omega)\mathbf w=e\mathbf
      E/m\). Multiplication by \(ne\) gives \(\mathbf J=\sigma\mathbf E,\ \sigma=ne^2\tau/[m(1-i\omega\tau)]\).


      Charge neutrality gives \(\nabla\cdot\mathbf E=0\); Faraday and Ampère–Maxwell
      give \(\nabla\times\nabla\times\mathbf E=-\mu_0\partial_t(\mathbf J+\epsilon_0\partial_t\mathbf
      E)\). The double curl is \(-\nabla^2\mathbf E\). Thus \(k^2=\omega^2/c^2+i\mu_0\omega\sigma=(\omega^2/c^2)(1+i\sigma/(\omega\epsilon_0))\),
      with \(c^{-2}=\mu_0\epsilon_0\). For a complex propagation vector the analytic
      continuation of \(k^2\) is \(\mathbf k\cdot\mathbf k\), without conjugation.
      In a chosen propagation direction use \(\exp(ikz-i\omega t)\). Exactly,

      \[

      \epsilon_r=1-\frac{\omega_p^2}{\omega(\omega+i/\tau)}.

      \]

      For \(\omega>0,\tau<\infty\) this has strictly positive imaginary part, so the
      half-space solution has \({\rm Im}\,k>0\) and amplitude \(e^{-({\rm Im}\,k)z}\).
      In the collisionless limit for fixed \(0<\omega<\omega_p\), \(\epsilon_r\to1-\omega_p^2/\omega^2<0\),
      giving the leading evanescent attenuation \(e^{-z\sqrt{\omega_p^2-\omega^2}/c}\).
      Close to cutoff the small dissipative term may matter.

      '
    fresh_sha256: cdd7be7ccafec88494a1181f96efea24d725498cfd8ddc6e7fd2e9c20befc75f
    main_comparison: Both derive the complex dielectric function from the electron-current
      response. The transverse dispersion uses the bilinear square of the complex
      wavevector and the attenuating branch has positive imaginary part in z>0. The
      collisionless cutoff approximation and full response are distinguished.
