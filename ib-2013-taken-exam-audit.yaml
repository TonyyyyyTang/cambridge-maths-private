    independent_solution: '# Independent rework — IB/2013/P2/q5B


      Start characteristics at \((1,\eta,\eta)\) at \(s=0\). The characteristic system
      \(x''=x,\ y''=x+y,\ u''=1\) yields \(x=e^s,\ (e^{-s}y)''=1,\ u=\eta+s\). Consequently
      \(y=e^s(\eta+s)\) and \(u=y/x\) on the half-plane \(x>0\) swept out by the initial
      line. Directly \(x(-y/x^2)+(x+y)/x=1\) and \(u(1,y)=y\). The formula also solves
      the PDE for \(x<0\), where the given data do not determine it. At the origin
      the PDE itself would read \(0=1\).

      '
