  IB/2018/P1/q1E:
    independent_rework: "# IB/2018/P1/q1E — independent rework\n\nIf T is linear with\
      \ finite-dimensional domain E, then dim E = dim ker T + dim im T. Indeed, extend\
      \ a basis of ker T to a basis of E. The images of the new basis vectors form\
      \ a basis of im T.\n\nPut A = im α and K = ker β, subspaces of the finite-dimensional\
      \ space W. The restriction of β to A has image im(βα) and kernel A ∩ K. Applying\
      \ rank–nullity to this restriction gives the first identity. Likewise, for C\
      \ = im(αγ) ⊆ A, the restriction of β to C has image im(βαγ) and kernel C ∩ K.\
      \ Since C ∩ K ⊆ A ∩ K,\n  \n  dim C − dim im(βαγ) = dim(C ∩ K) ≤ dim(A ∩ K)\
      \ = dim A − dim im(βα).\n\nTransposing terms gives exactly the claimed inequality.\
      \ All dimensions used in the subtraction are finite even if U, V or X is infinite-dimensional.\n"
    independent_rework_sha256: 3eb8b980294bc52f6363650009e403371f50ffa0cf9c0ddad082f5b085021471
    comparison: The restrictions of beta have nested kernels given by intersection
      with its original kernel; all dimensions used are finite. The rank identity
      and inequality agree.
