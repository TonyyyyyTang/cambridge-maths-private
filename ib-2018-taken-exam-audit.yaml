    independent_rework: "# IB/2018/P3/q16B — independent rework\n\nThe expectation\
      \ is the probability-weighted mean of measurement outcomes for identically prepared\
      \ states, observable as the limiting average of independent repetitions. Take\
      \ self-adjoint observables on a common domain for the products used, and a normalized\
      \ ψ with finite second moments. The squared norm in the question is\n\n  ⟨Q²⟩\
      \ + iλ⟨[Q,P]⟩ + λ²⟨P²⟩ ≥ 0.\n\nThe middle coefficient is real since the expectation\
      \ of a commutator of self-adjoint operators is imaginary. If ⟨P²⟩>0, a nonpositive\
      \ discriminant gives |⟨[Q,P]⟩|² ≤ 4⟨P²⟩⟨Q²⟩. If ⟨P²⟩=0 then Pψ=0, both terms\
      \ in the expected commutator vanish, and the inequality also holds. Apply the\
      \ result with Q−⟨Q⟩I and P−⟨P⟩I. Their commutator is unchanged and their second\
      \ moments are the variances. Taking nonnegative square roots proves the stated\
      \ uncertainty relation.\n\nFor the oscillator, on its eigenstates [x,p]=iℏ I\
      \ follows from the product rule for p=−iℏ d/dx. For any normalized energy eigenstate,\
      \ positivity and AM–GM give\n\n  E = ⟨p²⟩/(2m) + mω²⟨x²⟩/2 ≥ ω√(⟨p²⟩⟨x²⟩) ≥\
      \ ℏω/2,\n\nwith m>0 and ω the positive frequency. The second inequality uses\
      \ the first commutator bound directly.\n"
    independent_rework_sha256: 5c95298c90ed760e0c8863292b2c0aa9dd2bf3692c6f98a59b48fd1fb5b16ee9
    comparison: Both centre the operators to recover the variance inequality and apply
      the uncentred bound with AM–GM for the oscillator energy.
