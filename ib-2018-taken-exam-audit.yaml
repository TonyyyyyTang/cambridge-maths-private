  IB/2018/P3/q15A:
    independent_rework: '# IB/2018/P3/q15A — independent rework


      Use distributions on smooth, compactly supported test functions φ. In (a), changing
      variables y=αx, including reversal of the limits for α<0, pairs δ(αx) with φ
      to give |α|⁻¹φ(0). Thus δ(αx)=δ(x)/|α|.


      (b) By distributional differentiation, ⟨xδ′,φ⟩=−(xφ(x))′|₀=−φ(0). Hence xδ′=−δ.
      (c) Iterating differentiation gives ⟨δ⁽ᵐ⁾,f⟩=(−1)ᵐ f⁽ᵐ⁾(0).


      (d) With y=nx the pairing becomes ∫φ(y/n)/[π(1+y²)]dy. It converges to φ(0)
      by dominated convergence and the antiderivative of (1+y²)⁻¹. The convergence
      is distributional.


      (e)(i) Let H_n(x)=n exp(−n²x²). With y=nx and by dominated convergence, H_n
      → √π δ. Its derivative is −2n³x exp(−n²x²). Pairing with −φ′ gives convergence
      of derivatives, hence the requested limit is −(√π/2)δ′.


      (ii) After integrating in k the function is sin(nx)/(πx), continued at zero.
      To justify its distributional limit, fix any d>0. Subtract φ(0) times the indicator
      of [−d,d] from φ(x) in the sine integral. The difference divided by x is integrable:
      it is bounded near zero by differentiability and compactly supported. The Riemann–Lebesgue
      lemma makes this difference tend to zero. The remaining integral is (φ(0)/π)∫_{−nd}^{nd}
      sin y/y dy → φ(0) by the given identity. Thus the limit is δ.


      (f) The odd imaginary part integrates to zero on [−n,n] and the even real part
      is twice the integral in (e)(ii). Including the factor 1/(2π) gives δ once again.

      '
    independent_rework_sha256: b10b7603f86016bc101b8eb68d5ebed423cd8d05b55ea9d3b6db6b5ac2750e79
    comparison: The unit delta normalisations, the derivative sign and coefficient
