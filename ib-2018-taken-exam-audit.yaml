  IB/2018/P4/q9H:
    independent_rework: '# IB/2018/P4/q9H — independent rework


      (a) A probability row vector π is invariant if πP=π, meaning the law after one
      step from that initial law remains π. A finite irreducible chain has a unique
      invariant probability distribution.


      (b) Detailed balance requires πᵢpᵢⱼ=πⱼpⱼᵢ for every pair i,j. Summing over i
      gives (πP)ⱼ=πⱼ Σᵢ pⱼᵢ=πⱼ, since the jth row is a probability distribution. This
      proves invariance.


      (c) With C=ΣₖDₖ, take πᵢ=Dᵢ/C. This is a probability distribution and every
      edge has forward and reverse equilibrium flow 1/C. A pair of nonadjacent vertices
      has zero flow in each direction. Detailed balance proves invariance and connectedness
      gives irreducibility and uniqueness. The transition rule presumes positive degrees;
      the isolated single-vertex graph would need a separately stipulated holding
      probability to define its walk.

      '
