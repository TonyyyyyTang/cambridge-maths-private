  IB/2018/P2/q6C:
    independent_rework: "# IB/2018/P2/q6C — independent rework\n\nFor the magnetostatic\
      \ field of an isolated steady current in free space, Maxwell's equations reduce\
      \ to div B=0 and curl B=μ₀j. Choose a vector potential B=curl A with div A=0.\
      \ The curl of curl identity then gives −ΔA=μ₀j. The decaying free-space solution\
      \ follows componentwise from −Δ_r (1/(4π|r−r′|))=δ(r−r′):\n\n  A(r) = (μ₀/4π)\
      \ ∫_V j(r′)/|r−r′| d³r′.\n\nTaking curl with respect to r differentiates only\
      \ the kernel. Its gradient is −(r−r′)/|r−r′|³. Taking its cross product with\
      \ j(r′) reverses both the order and the sign, yielding\n\n  B(r) = (μ₀/4π) ∫_V\
      \ j(r′) × (r−r′)/|r−r′|³ d³r′.\n\nThe kernel's gradient singularity is locally\
      \ integrable in three dimensions for a bounded current density. The free-space\
      \ condition selects the field generated by the current. A separately imposed\
      \ uniform magnetic field can otherwise be added, and time-dependent vacuum waves\
      \ would also require additional initial or boundary data.\n"
    independent_rework_sha256: 5532016ffaa962ec4cecb6b4b38c533e495eb56eca87899b017f704a3defeac6
    comparison: Both impose the free-space magnetostatic field condition and obtain
      Biot–Savart with the same kernel sign and order after differentiating the scalar
      Green kernel.
