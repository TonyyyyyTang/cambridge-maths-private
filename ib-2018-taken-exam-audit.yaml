  IB/2018/P4/q17C:
    independent_rework: "# IB/2018/P4/q17C — independent rework\n\nFix the evaluation\
      \ point x in the interior and use y for the integration point x₀. Apply the\
      \ stated identity on Ω with a closed radius-ε disk centred at x removed, taking\
      \ G(y)=log|y−x|/(2π). It is harmonic on the punctured domain, so the volume\
      \ integral equals ∫Gρ. The outward normal of the punctured domain on the small\
      \ circle points towards x; hence ∂ₙG=−1/(2πε). The inner integral ∫u ∂ₙG tends\
      \ to −u(x) by continuity. The term ∫G ∂ₙu tends to zero, bounded by O(ε|log\
      \ ε|). The omitted volume term tends to zero as the logarithm is locally integrable\
      \ and ρ is bounded near x. Rearrangement gives\n\n  u(x) = −∫_Ω G(y)ρ(y) d²y\
      \ + ∮_∂Ω (u∂ₙG−G∂ₙu) ds,\n\nwhere every derivative is in y.\n\nFor the disc\
      \ and a fixed pole x of modulus 0<r<1, place its image at x*=x/r² outside the\
      \ disc. Use the modified Green function\n\n  G_D(y;x) = [log|y−x|−log(r|y−x*|)]/(2π).\n\
      \nThe subtracted potential is harmonic throughout the disc, and the distance\
      \ identity makes G_D vanish on the boundary. For r=0 use log|y|/(2π). The punctured-disc\
      \ representation with ρ=0 therefore gives u(x)=∮u(y)∂ₙG_D ds. Write x=r(cos\
      \ θ,sin θ), y=R(cos φ,sin φ), c=cos(θ−φ) and D=1+r²−2rc. The outward normal\
      \ derivative at R=1 of the first log is (1−rc)/D, and that of the second is\
      \ (r²−rc)/D. Thus\n\n  ∂ₙG_D = (1−r²)/(2πD).\n\nOn the unit circle ds=dφ. A\
      \ unit periodic delta at α evaluates this smooth kernel at φ=α, giving u(r,θ)=(1−r²)/[2π(1+r²−2r\
      \ cos(θ−α))]. The formula includes r=0. The distributional boundary interpretation\
      \ follows by approximating the point mass by smooth unit masses; equivalently,\
      \ the positive kernel has total mass one (constant harmonic boundary data in\
      \ the representation), and its mass outside any fixed arc around α tends to\
      \ zero as r↑1.\n"
    independent_rework_sha256: 46c7b4f7246e74825f24e8d51311ba1d2cb5b48baf30e9df7c3ca4dbf65077fe
    comparison: Orientation of the puncture boundary, image point inversion, normal
      derivative and unit angular mass agree. The answer at the disk centre matches
      the limiting formula.
