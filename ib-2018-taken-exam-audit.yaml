  IB/2018/P3/q20H:
    independent_rework: '# IB/2018/P3/q20H — independent rework


      Let O be the observed 2×2 table, with row totals r=(a+b,c+d), column totals
      c_*=(a+c,b+d), and grand total N. Test equal recovery probability in the two
      treatment groups, equivalently independence in the joint table. With independent
      observations and positive margins, the fitted counts under the null are Eᵢⱼ=rᵢc_*ⱼ/N.
      Pearson''s statistic is X²=Σ(Oᵢⱼ−Eᵢⱼ)²/Eᵢⱼ. Reject for large values compared
      with the upper tail of χ²₁, using an appropriate significance level, provided
      the expected counts support the approximation.


      Indeed, in the full multinomial model the four fitted probabilities are Oᵢⱼ/N;
      in the independence model the row and column probabilities maximize their separate
      terms in the likelihood at the sample margins divided by N. Twice the log of
      the ratio of maximized alternative to null likelihood is G²=2Σ Oᵢⱼ log(Oᵢⱼ/Eᵢⱼ).
      With Dᵢⱼ=Oᵢⱼ−Eᵢⱼ, the expansion in D/E has leading terms 2D+D²/E. The linear
      terms sum to zero. Under an interior null with cell probabilities fixed and
      positive, D=O_p(√N), E of order N, so the total remainder tends to zero in probability.
      Wilks'' theorem gives χ²₁ because the full model has three free probabilities
      and the null two. Conditioning on fixed treatment group sizes yields the same
      calculation with two binomial samples and one degree of freedom.


      The four discrepancies Dᵢⱼ equal (ad−bc)/N times the sign matrix with rows (+,−)
      and (−,+). Hence X²=(ad−bc)²/N times (1/r₁+1/r₂)(1/c_*₁+1/c_*₂), giving N(ad−bc)²/(r₁r₂c_*₁c_*₂).


      For the given table the expected counts are (48.75,11.25) and (16.25,3.75).
      X²=80/117≈0.684, giving a nominal one-degree-of-freedom tail probability about
      0.408. There is little evidence of a difference. An expectation of 3.75 makes
      the asymptotic approximation questionable. For instance, a conditional exact
      test fixes the margins and gives the treated recovery count K probability C(65,k)C(15,20−k)/C(80,20).
      Summing all probabilities no greater than that of the observed k=15 gives two-sided
      p≈0.509. Neither test establishes equality of recovery probabilities, and random
      selection of patients alone does not establish random assignment of treatment.

      '
    independent_rework_sha256: e818cd803aee334611433124f41eb84ebd5598e0c5dd7f7e07cada27a3b6ec9d
    comparison: Both calculate the same fitted counts, one degree of freedom and Pearson
      statistic 80/117. The auditor independently obtains the same asymptotic p-value
      and identifies the small fitted cell and conditional exact alternative.
