  IB/2018/P2/q7D:
    independent_rework: "# IB/2018/P2/q7D — independent rework\n\nWrite g>0 for the\
      \ magnitude of the downward acceleration. In the homogeneous layer of depth\
      \ h measured from z=0, the vertical equation reads p_z=−ρg. From p(h)=p₀ obtain\
      \ p=p₀+ρg(h−z). The horizontal equations are fv=g h_x and fu=−g h_y. Thus u_h=(g/f)(−h_y,h_x),\
      \ which is independent of z and has zero dot product with ∇h. A regular height\
      \ contour consequently follows the horizontal velocity, with critical points\
      \ corresponding to stagnation.\n\nConnect the two specified locations by any\
      \ oriented horizontal curve parametrised by arclength s, and select its left\
      \ normal (−y′,x′). The depth-integrated flux through this vertical curtain is\n\
      \n  Q = ∫h u_h·(−y′,x′) ds = (g/f)∫ h dh\n    = (g/(2f))[(h₀+Δh)²−h₀²].\n\n\
      Thus the leading signed volume flux is g h₀ Δh/f; the opposite orientation reverses\
      \ it. Its magnitude is |g h₀ Δh/f| to this order. Dimensions are [g]=L T⁻²,\
      \ [h₀]=[Δh]=L, [f]=T⁻¹ and [Q]=L³ T⁻¹. This calculation uses nonzero constant\
      \ f and a homogeneous fluid, the usual interpretation of this layer model.\n"
    independent_rework_sha256: 9e6fb8df131dcb83d6cec15714f1705ecccfce8b61a38cf96be73cf4f699d8f9
    comparison: The oriented flux agrees, including the leading term, quadratic correction,
