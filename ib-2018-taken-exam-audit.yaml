  IB/2018/P1/q6D:
    independent_rework: "# IB/2018/P1/q6D — independent rework\n\nUse exact increment\
      \ minus trapezoidal increment for the sign of the local defect. Substitution\
      \ of the exact y with y′=f into the method and Taylor expansion at t gives\n\
      \n  R = y(t+h)−y(t)−h(y′(t)+y′(t+h))/2 = −h³ y‴(t)/12 + O(h⁴).\n\nIt suffices\
      \ that the derivatives used be bounded on the interval. For a finite time interval\
      \ and f uniformly Lipschitz in y with constant L on a tube around the solution,\
      \ the stepwise error e_n satisfies, for small h,\n\n  (1−hL/2)|e_{n+1}| ≤ (1+hL/2)|e_n|\
      \ + C h³.\n\nThe local implicit update exists uniquely near the true trajectory\
      \ by contraction for hL/2<1. For exact initial data, iteration over at most\
      \ T/h uniform steps bounds |e_n| by C' h², since ((1+hL/2)/(1−hL/2))^{T/h} stays\
      \ bounded. For variable steps the same argument uses H=max h_n, Σh_n³≤T H² and\
      \ a product bounded by exp(CLT).\n\nFor sharpness take f(t,y)=t² and y(0)=0.\
      \ The stepwise integral is t²h+th²+h³/3, and the trapezoidal increment is t²h+th²+h³/2.\
      \ Thus the local defect is exactly −h³/6 at every step. The computed value on\
      \ a uniform mesh exceeds the exact one at T by Th²/6, so the general order is\
      \ precisely k=2. The opposite local-error convention reverses A's sign.\n"
    independent_rework_sha256: facb04153dc7a01015b87c3ef7bae6ce43c3921155a879275da526b2289cdb41
    comparison: For exact increment minus numerical increment the leading term is
      −h³ y‴/12. The sharpness examples use y′=t² and y′=3t² respectively, giving
      proportional cubic defects and the same global order two.
