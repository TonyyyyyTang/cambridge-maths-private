  IB/2018/P2/q10E:
    independent_rework: '# IB/2018/P2/q10E — independent rework


      View X as a map from F^m to F^n. Let r be its rank. Choose a basis w₁,…,wᵣ of
      its image, elements vᵢ mapping to wᵢ, and finish the v-list with a basis of
      ker X. This gives a domain basis, since a linear relation maps to one among
      independent wᵢ and every image is in their span. Extend the w-list to a codomain
      basis. With basis matrices P and Q made of the respective columns, Q⁻¹XP has
      an identity in its first r rows and columns and zeros elsewhere. The dimensional
      limits follow from rank–nullity. This includes r=0 and full rank.


      In the Leibniz sum for the block matrix, a nonzero term must assign each bottom
      row to a right-block column. They are equal in number, so every top row must
      be assigned to a left-block column. Such a block-preserving permutation has
      sign equal to the product of its two signs. Summing gives det B det C.


      If AX=XB, then X intertwines B and A. For X≠0 its image W is nonzero and A-invariant.
      Its kernel K is B-invariant, and X induces a linear isomorphism F^m/K → W conjugating
      the induced action of B to A restricted to W. Over ℂ the common positive-dimensional
      endomorphism has an eigenvalue λ. In a basis starting with a basis of W, A is
      upper block triangular with A|W a diagonal block. Similarly a basis starting
      with a basis of K gives the induced quotient map as a diagonal block of B. Apply
      the block determinant identity to λI−A and λI−B to see both determinants vanish.
      This contradicts disjoint spectra. Thus the kernel of L is zero and L is injective.

      '
