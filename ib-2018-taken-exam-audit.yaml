  IB/2018/P4/q14A:
    independent_rework: "# IB/2018/P4/q14A — independent rework\n\n(a) For s>0 real,\
      \ put t=bz² with b=|a|/(2√s). Then dt/√t=2√b dz and st+a²/(4t)=c²(z²+1/z²),\
      \ where c²=|a|√s/2=sb. The supplied formula gives\n\n  ∫₀^∞ exp(−st−a²/(4t))\
      \ dt/√(πt)\n  = (2√b/√π)(√π/(2c)) exp(−2c²) = exp(−|a|√s)/√s.\n\nHere c>0. Absolute\
      \ convergence and holomorphic dependence on s extend this to Re s>0 with the\
      \ principal square root. The case a=0 follows either from the Gaussian integral\
      \ or by dominated convergence for s>0.\n\n(b) Write U(x,s) for the time Laplace\
      \ transform of the bounded solution. One integration by parts in t gives (s−∂ₓ²)U=f.\
      \ For real s>0 the decaying fundamental solution on the line is G_s(z)=exp(−√s\
      \ |z|)/(2√s). Away from zero it solves the homogeneous equation; the jump G_s′(0+)−G_s′(0−)=−1\
      \ supplies a unit point source for s−∂². For bounded f the convolution G_s*f\
      \ is bounded. It is the unique bounded solution, since both coefficients in\
      \ an everywhere bounded homogeneous combination of exp(±√s x) must vanish. By\
      \ (a) the inverse transform of G_s(z) is\n\n  K(|z|,t)=exp(−z²/(4t))/√(4πt).\n\
      \nThus u(x,t)=∫ K(|x−ξ|,t) f(ξ) dξ. For bounded data the Gaussian kernel has\
      \ integral one; absolute integration against exp(−st)|f| justifies interchange\
      \ in the transform. The kernel solves the heat equation at t>0 by differentiation,\
      \ and is an approximate identity as t↓0. Consequently it recovers f pointwise\
      \ at every continuity point, and everywhere for bounded continuous initial data.\n"
    independent_rework_sha256: 01fa22791ba36403443473366fdf7ce1ed7112c7086bbc0eaf10a825773400d3
    comparison: Both obtain the exponentially decaying resolvent with the derivative
      jump −1, recover the Gaussian kernel, and specify how its convolution attains
      the initial data.
