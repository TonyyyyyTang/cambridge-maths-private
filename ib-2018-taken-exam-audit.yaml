  IB/2018/P3/q12F:
    independent_rework: '# IB/2018/P3/q12F — independent rework


      (a) Uniform convergence means that for each ε>0 there is N such that for every
      n≥N and every x∈A we have |f_n(x)−f(x)|<ε. Uniform continuity means that for
      every ε>0 there is δ>0 such that any x,y∈A at distance <δ have |f(x)−f(y)|<ε.


      (b)(i) True. Choose δ from uniform continuity and N with 1/N<δ. For every n≥N
      the two arguments are distance 1/n<δ, independently of x.


      (ii) False. The identity f(x)=x is uniformly continuous on ℝ. For x=n, the absolute
      difference between (x+1/n)² and x² is 2+1/n² for all n.


      (c) Define C_n={x∈A : g_n(x)≥δ}. Each C_n is nonempty by hypothesis and closed
      by continuity. The C_n are nested. Because A is closed and bounded in finite-dimensional
      Euclidean space it is compact. Nested nonempty closed subsets therefore have
      nonempty intersection (otherwise their complements would admit a finite subcover).
      Any point x₀ in the intersection satisfies g_n(x₀)≥δ for all n. This decreasing,
      lower-bounded, real sequence has a limit at least δ.


      For the deduction set g_n=f_n−f. These functions are continuous, decrease pointwise
      to zero and are nonnegative. If convergence were not uniform, there would be
      ε>0 and points x with g_n(x)≥ε for arbitrarily large n. For any fixed m choose
      such n≥m, giving g_m(x)≥ε. Applying the first assertion with δ=ε now gives a
      point with limiting difference at least ε, contradicting pointwise convergence.
      If A is empty, uniform convergence is vacuous.

      '
    independent_rework_sha256: d6e6827216e876088f0c43546c88da8d1fe263ecc29210936b92524625e1078a
    comparison: Both identify the translated-square counterexample and use nonempty
      nested superlevel sets on a compact space to deduce uniform convergence.
