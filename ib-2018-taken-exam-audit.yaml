  IB/2018/P1/q11F:
    independent_rework: '# IB/2018/P1/q11F — independent rework


      (a) Differentiability at a point a of U means the existence of a linear map
      Df(a) such that f(a+h) = f(a) + Df(a)h + o(‖h‖) as h tends to zero. This condition
      at every point is differentiability on U. For C¹ one also requires that a ↦
      Df(a) be continuous in operator norm. The inequality ‖f(a+h)−f(a)‖ ≤ ‖Df(a)‖‖h‖
      + o(‖h‖) gives continuity. The inverse function theorem says that for C¹ f on
      open U, if Df(a) is invertible there are open neighbourhoods V ⊆ U of a and
      W of f(a) such that f restricts to a bijection V → W with C¹ inverse, whose
      derivative at f(b) is (Df(b))⁻¹ for every b ∈ V.


      (b) For distinct a,b in U, let h=b−a. Convexity places the compact segment a+th
      (0≤t≤1) in U. Continuity of Df gives m = max ‖Df(a+th)−I‖ < 1 there. Integrating
      the derivative of f(a+th)−(a+th) yields ‖f(b)−f(a)−h‖ ≤ m‖h‖, hence ‖f(b)−f(a)‖
      ≥ (1−m)‖h‖ > 0. Also Df(a)v=0 implies ‖v‖ ≤ ‖I−Df(a)‖‖v‖, so the kernel is zero
      and the endomorphism is invertible. The open sets W from (a) cover f(U).


      The identity on any proper open ball already gives a proper image. Even for
      U = ℝⁿ, the map f(x)=(arctan x₁,x₂,…,xₙ) has ‖Df(x)−I‖=x₁²/(1+x₁²)<1, and its
      image has first coordinate only in (−π/2,π/2).


      (c) The matrix Df−I has rows (2x−1,−2y) and (2y,2x−1). Its transpose times itself
      is ((2x−1)²+4y²)I. Thus the pointwise condition holds exactly on the open disc
      (x−1/2)²+y²<1/4. Every boundary point has norm exactly 1, showing maximality.

      '
    independent_rework_sha256: ecbdc041ee1253cd4bb8fe5e8e140b4b92c5efab493fa409b158a55397150111
    comparison: The auditor independently bounds the derivative along a compact segment,
      obtains a proper open image, and identifies the same maximal open disk and its
      excluded boundary.
