  frozen_rework_sha256: a2bfaa399ce8bc1c1382a3ead2337daca910253d7e104e1a957e6a68b4b89700
  frozen_rework_utf8: |
    Independent derivations. Seed 20261203, one Python Random instance advanced through sorted course keys; sample(sorted(population), ceil(N/5)) per course. Output IDs exactly match supplied 12 locators in order. Only supplied questions and graph, source locators, and original paper (notably P1 p4) available to solver before freeze.

    P2 q2G. (i) Pointwise sign(x), with value zero at zero. A uniform limit of continuous functions is continuous, so convergence on R fails. (ii) Sine has derivative bounded by one, so the supremum discrepancy from sin x is at most 1/n. (iii) Limit L=e^x/cosh(ax); error is (exp(1/n)-1)L. For |a|>=1 and x>=0 we have L<=2 exp((1-|a|)x)<=2; for x<=0, L<=1. For |a|<1, cosh(ax)<=exp(|a|x) for x>=0, giving L>=exp((1-|a|)x) -> infinity. Thus uniform exactly for |a|>=1. (iv) For each x the mean value theorem gives f_n(x)=4h'(c), |c-x|<1/n, hence the supremum error from 4h'(x) tends to zero by uniform continuity.

    P1 q12.2A. (a) d=f'(z0) is nonzero by strict hypothesis. For distinct z,w, integrate f' along w+t(z-w) in the convex disc. This gives (f(z)-f(w))/(d(z-w)) as the average of f'/d whose real part is strictly positive (all values lie in open disc centre 1 radius 1). Thus images differ. (b) Harmonic means C^2 with u_xx+u_yy=0. The plane is simply connected, so -u_y dx+u_x dy is closed and exact and supplies harmonic conjugate v. For u>=0, exp(-u-iv) is bounded and entire, hence constant by Liouville, so its modulus exp(-u) and u are constant. For the logarithmic bound use F=exp(u+iv), entire and zero-free. On radius R>=1, |F|<=e^b R^a. Cauchy estimates on Taylor coefficients at zero show coefficients of integer degree k>a vanish (take R->infty). A zero-free complex polynomial is constant, so u=log|F| is constant. No use of log 0 is needed.

    P2 q16B. Curls are 2b1 e_z and b2(-x,-y,2z); each has vanishing divergence and curl, as required in static source-free space with zero E. Put A=pi r^2 and K=2b2 A. Upward fluxes 2b1 A and Kz. Take clockwise seen from above as positive current. The uniform field has zero net force (integral dl=0); for B2 the vertical part likewise cancels around the circle, and the inward radial field -b2 r e_r and clockwise dl give dF_z=-I b2 r^2 dtheta with theta here a positive traversed angle. Thus F_z=-KI. Clockwise induced emf is time derivative of upward external flux; neglecting inductance at R>0 yields I1=0 and I2=K zdot/R. Hence m zddot=-mg in case 1, z=z0-gt^2/2. Case 2 m zddot=-mg-(K^2/R)zdot. For K nonzero put tau=mR/K^2; v=-g tau(1-e^(-t/tau)), z=z0-g tau[t-tau(1-e^(-t/tau))]. As t->infty linear fall; I^2R=K^2 v^2/R=-mgv at terminal speed. K=0 restores free fall. In an ideal superconducting loop the total flux is conserved; a finite self-inductance L matters. With initial current zero, clockwise I=K(z-z0)/L. Case 1 still free fall. Case 2 m zddot=-mg-K^2(z-z0)/L, undamped oscillations about z0-mgL/K^2, no Joule dissipation, zero-gradient exception as above.

    P3 q16D. Initially zero vorticity stays zero in inviscid constant-density fluid under conservative body forces by Kelvin circulation; a simply connected wedge has u=grad(phi), divergence-free gives Laplace. Impermeability at the instantaneous sides gives u_theta(r,+alpha)=-Omega r and u_theta(r,-alpha)=+Omega r, i.e. f'(+/-alpha)= -/+Omega; tangential fluid motion free. Substitution gives f''+4f=0. Symmetric solution f=Omega cos(2theta)/(2 sin(2alpha)), regular at hinge (sin(2alpha) nonzero). Generally B sin2theta homogeneous allowed if cos2alpha=0; initial rest and reflection symmetry exclude this asymmetric flow. If sin(2alpha)=0, the prescribed opposite angular velocities cannot be fitted by this ansatz unless Omega=0. Put c=Omega/sin2alpha. u_r=c r cos2theta, u_theta=-c r sin2theta. With u_r=psi_theta/r, u_theta=-psi_r one gets psi=c r^2 sin(2theta)/2=cxy. Sketch: x positive along bisector; u=(cx,-cy), separatrices the x and y axes where present; in the upper/lower wedge draw the hyperbolas y=h/x and y=-h/x, cropped at moving plates, arrows right towards the horizontal bisector for c>0. Outflux per unit depth integral R u_r dtheta = cR^2 sin2alpha = Omega R^2, consistent with shrinking sector area.

    P2 q8F. J_m(alpha)=alpha I+N, with N ones immediately above diagonal and zeros elsewhere. Since N^2=0 for m=2, expansion of p(alpha+X) mod X^2 gives p(alpha)I+p'(alpha)N. Jordan normal form is a block diagonal matrix of these blocks similar to A, unique up to order. For any fixed lambda, blocks with different eigenvalue are invertible after subtraction; for eigenvalue lambda each block of size m contributes 1 to nullity and min(2,m) to square-nullity. Nesting of kernels gives equality precisely without blocks of size >1 at lambda. Thus the all-lambda condition is exactly diagonalizability. Reversing a block's coordinate order transposes it: take block-diagonal reversal matrix S=S^T=S^-1 to obtain J^T=SJS. If A=PJP^-1 then A^T=P^-T J^T P^T, similar to J. Finally C=PSP^T and D=P^-T S J P^-1. C invertible symmetric; SJ symmetric since J^T S=SJ, and CD=A. No complex conjugation is involved.

    P4 q8F. With the usual convention of representing a quadratic form by its symmetric matrix, polarization gives b(x,y)=(Q(x+y)-Q(x)-Q(y))/2. Existence follows from the definition as diagonal of a bilinear form by symmetrization, and uniqueness by expansion. PSD means b(x,x)>=0 for all x, PD means >0 for every nonzero x. Finite-dimensional real symmetric forms admit a basis with diagonal entries 1 (p), -1 (q), and 0 (r), by real symmetric diagonalization and rescaling. Sylvester's law says the three counts are intrinsic: a positive definite subspace intersects the span of the negative and zero axes trivially, hence has dimension <=p, attained by the positive coordinate span. Apply to -b for q, then r=dim-p-q. Polarization on E yields E subset E-perp; nondegeneracy identifies V with its dual, so dim E-perp=dim annihilator(E)=2n-k; hence k<=n. l^2 has matrix ll^T and rank one and signature +1 if l nonzero, both zero if l=0. The coefficientwise product with ss^T is tt^T for t_i=l_i s_i, likewise rank and signature one if t nonzero, zero otherwise (including disjoint supports). Every PSD form is a sum of squares of real linear forms by diagonalization; coefficientwise product distributes and each pair gives another square, hence PSD. Without the symmetric-representative convention, the question's operation on forms is ambiguous: skew coefficients change representations (e.g. two copies of a real two-by-two nonzero skew matrix represent zero, but entrywise square gives a nonzero indefinite quadratic form).

    P1 q19H. Reversibility with stationary law pi means pi_i p_ij=pi_j p_ji; multiplying these relations along any finite path shows reversal symmetry in equilibrium. For an undirected finite connected graph with edges, pi_i=d_i/(2|E|) yields the condition directly. The given A-B, B-C, B-D, C-D, C-E, D-E, E-F make 7 edges and deg A=1, so mean strictly positive return time =1/pi_A=14 by the finite irreducible recurrence formula, valid also for periodic chains. Let h denote the chance of hitting A before F with absorbing endpoints, h_A=1,h_F=0, and symmetry h_C=h_D=c. Write h_B=b,h_E=e. 3b=1+2c,3c=b+c+e,3e=2c gives c=1/2,b=2/3,e=1/3. From A first step B, so success 2/3. For g_i=E_i[T 1_success], T time to either endpoint, g endpoints zero and g_i=h_i+sum p_ij g_j by first-step conditioning. Then g_B=2/3+2g_C/3,g_E=1/3+2g_C/3,2g_C=3/2+g_B+g_E, hence g_C=15/4,g_B=19/6. Add the initial step: 1+g_B/h_B=23/4.

    P3 q5D. For integrable f,g, integral of |f(u)g(x-u)| over (u,x) equals product of norms, allowing interchange in transform of h=f*g. Substitute t=x-u to factor as fhat ghat. When the latter is integrable apply inversion at continuity points of h (or use suitable smooth rapidly decaying input), giving the specified 1/(2pi). For interval indicator fhat=2sin k/k (limit 2 at zero), square is integrable. h(x)=(2-|x|)_+, continuous; at zero h(0)=2=(1/(2pi))4 times requested integral. Result pi.

    P2 q3B. Roots r1,r2 of alpha r^2+beta r+gamma. For t<tau set G=0. For s=t-tau>=0, distinct roots give (exp(r1 s)-exp(r2 s))/(alpha(r1-r2)), repeated root r gives s exp(rs)/alpha. G continuous at tau, derivative jumps by 1/alpha and homogeneous elsewhere. The causal convolution from a to t satisfies both initial conditions and equation. For a=0 use G=sin(omega s)/omega, interpreted as s when omega=0, convolving against sin(lambda tau). With omega nonzero and lambda^2!=omega^2 obtain [sin(lambda t)-(lambda/omega)sin(omega t)]/(omega^2-lambda^2) by integrating/particular solution adjusted for zero data. At lambda=+/-omega apply the limit: sign(lambda/omega)[sin(omega t)-omega t cos(omega t)]/(2 omega^2). For omega=0,lambda!=0 result t/lambda-sin(lambda t)/lambda^2; lambda=0 response identically zero.

    P1 q5A. Dahlquist: consistency and zero stability iff convergence for regular linear multistep approximations to suitably Lipschitz well-posed IVPs and convergent starting values. Standard root criterion all roots of rho at most one in modulus and unit-modulus roots simple, with no common-factor cancellation of parasitic modes for arbitrary starting perturbations. rho=(s-1)(s^2+(2alpha-2)s+1); sigma=alpha(s^2-s) as the original examination page explicitly prints a difference on the RHS. Necessary first-order condition rho'(1)=sigma(1) becomes 2alpha=0. Actually test y=t, f=1: residual 2alpha h, directly contradicting given order assertion unless alpha=0. At alpha=0 rho=(s-1)^3, violates zero stability; even exact starting data for y=t^3 produce a global quadratic extrapolant failing at fixed T. Hence no convergent parameter as written and no convergence order. The separate root condition alone holds for 0<alpha<2 (conjugate unit roots separated from 1); outside the closed interval one root has modulus >1 and at 2 a repeated -1 occurs. Using the supplied order premise formally would yield 0<alpha<2, implied at least order two, but it cannot describe the displayed recurrence. For the plausible RHS sum, not asserted as an erratum, residual on t^3 at t_n=0 would be [27+7(2alpha-3)-15alpha]h^3=(6-alpha)h^3 so convergence exactly order two on that interval.

    P1 q14C. Put c=m/hbar^2 and q^2=c/a-kappa^2. Energy of a nonzero normalizable eigenfunction is strictly greater than -1/(2a) by integrating kinetic energy plus potential and using that zero derivative would give a constant; decaying exterior also requires E<0. Even interior solution proportional to cos(qx); exterior even decaying proportional to cos(qa) exp(-kappa(|x|-a)). Continuity of derivative imposes q tan(qa)=kappa, with cos(qa) nonzero because zero value and slope outside would force triviality. Define t=qa and s=sqrt(ca). On (0,min(s,pi/2)) the equation is t tan t=sqrt(s^2-t^2); left strictly increases from zero, right decreases from s, and the endpoint crossed (finite positive LHS if s<pi/2, otherwise diverges). Thus an even bound state for every a>0. For s<pi/2 no other interval possible and coefficients determined up to scale; an odd state would need -q cot(qa)=kappa, impossible for 0<t<pi/2 if one asks for uniqueness across both parities. As a->0, t<=s->0 and kappa=(c-a kappa^2)tan(t)/t. Hence kappa bounded and tends to c. E0=-m/(2 hbar^2). V_a tends to -delta in distributions (normalized shrinking interval). psi0=sqrt(c)exp(-c|x|) has norm one, derivative jump -2c psi0(0), cancelling the delta potential in the equation; off zero it has energy E0.

    P4 q17H. Assume 0<alpha<1. Twice the log unrestricted-to-null likelihood ratio equals the difference of minimized sums of squares. In (a) free MLEs Xbar,Ybar improve the null fits by S=m Xbar^2+n Ybar^2. Independent standardized means are standard Gaussian under the joint null, so reject S>F_2^-1(1-alpha). In (b) common-mean MLE (m Xbar+n Ybar)/(m+n), gain D^2=(Xbar-Ybar)^2/(1/m+1/n), by expansion. Reject |D|>Phi^-1(1-alpha/2), D standard normal under equality for any common mean. In (c) define U=(m Xbar+n Ybar)/sqrt(m+n); then S=D^2+U^2, and (D,U) is an orthogonal transform of standardized sample means with joint density strictly positive on the plane for every true mean. Write a=F_2^-1(1-alpha), b=F_1^-1(1-alpha). Have a>b strictly since at each finite t>0 adding an independent squared standard normal strictly reduces the CDF of a squared standard normal. Therefore choose sqrt(b)<D<sqrt(a) and U near zero in an open rectangle small enough to lie inside the disk; it has positive probability for all true means.
