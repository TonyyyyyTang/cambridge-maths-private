    proofs and both figure sources were read. Checks run independently. Pre-repair copies of four complete
    collection PDFs, 12 question pages and their local assets were captured. All 17 relevant compiled PDF pages
    examined as rasters. Headless Chrome loaded all 12 actual copied pages at 1220 by 940 with the generated
    app.js and KaTeX. DOM counts and full-page screenshots inspected.
