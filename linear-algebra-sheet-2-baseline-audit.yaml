- id: IB/linear-algebra/sheet-2/q08
  source_page: 1
  source_printed_question: 8
  derivation_sha256: 6c33c2c8e1db77270b7b270561448bf1d8241aec86a8a48bc532f80b68972d4f
  independent_rework: Expand tr(AB) as sum_{i=1}^n sum_{j=1}^m A_{ij}B_{ji}. Distributivity shows
    linearity in B for each A and in A for each B. Thus Phi(A)=tau_A is a linear map into the prescribed
    dual. For any linear functional ell on the m-by-n matrices define the n-by-m matrix L(ell)_{ij}=ell(E_{ji}).
    Substituting E_{ji} into the trace gives A_{ij}, so L(Phi(A))=A. Expanding B in the canonical
    matrix units and applying linearity yields Phi(L(ell))(B)=ell(B), proving the opposite composition.
    The argument works in every characteristic, and empty index sets give the zero-space isomorphism.
  transcription: p1 q8 matches all wording, rectangular dimensions, indexed functional, parentheses,
    field and terminal dual.
  source_page_image_sha256: 5b4125c27813ec94d0978d6ad01e9e93d2fbd5508b4dd402bef30cdf722b22c6
  comparison: In all three derivations a_{ij} is the trace pairing against E_{ji}. Matrix-unit evaluations
    supply a unique representative of any linear form over every field.
