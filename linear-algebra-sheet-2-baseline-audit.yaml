- id: IB/linear-algebra/sheet-2/q12
  source_page: 2
  source_printed_question: 12
  derivation_sha256: 284fc717cbbee29871ae87ab9aa6a1ff970214c8d6f5b8b8fecbab657a775e72
  independent_rework: If g=sum c_i f_i, its value vanishes wherever every f_i vanishes. Conversely
    let T:V -> F^n send x to (f_1(x),...,f_n(x)). For u=T(x) in U=im(T), set L(u)=g(x). If T(x)=T(y),
    then x-y is in the common kernel and hence in ker(g), so L is well-defined. It is linear by linearity
    of T and g. Extend a basis of U to one of F^n, extending L by zero on the added vectors. This
    extension H on F^n has H(z)=sum H(e_i)z_i. Therefore g(x)=H(Tx)=sum H(e_i) f_i(x). No restriction
    on the dimension of V was used, since only F^n required finite basis extension. Equality of the
    kernels is allowed; 'subset' in the question denotes inclusion. This also covers all f_i=0, zero
    V or g, and the vacuous finite list.
  transcription: p2 q12 matches all wording, indices, field-dual notation, kernel inclusion, and
    infinite-dimensional follow-up.
  source_page_image_sha256: 34959afa5a913322458396caed410b8c55e2a01751311d3a013d036330a52072
  comparison: All three proofs factor g through the image of the joint evaluation map and extend
    a functional in the finite-dimensional codomain. Infinite-dimensional V and the empty family
    are included.
