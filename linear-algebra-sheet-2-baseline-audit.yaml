  independent_rework: Begin with (A|I). Exchange rows 2 and 3, then replace row 2 by row 2 plus row
    3. On the left the rows are now (1,-1,0), (0,3,0), (0,0,1). The right rows are e1, e3+e2, e2.
    Divide row 2 by 3 (over the reals) and add the resulting row to row 1. The left is the identity.
    The elementary transformations are each invertible, so their product is A^{-1}. Its rows are
    (1,1/3,1/3), (0,1/3,1/3), (0,1,0). Multiplication on a vector (x,y,z) gives (x+(y+z)/3,(y+z)/3,y),
    and applying A recovers (x,y,z).
  transcription: p1 q1 agrees in all text, punctuation and nine signed matrix entries, with the printed
    label supplied by locator.
