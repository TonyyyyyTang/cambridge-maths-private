  notes:
    q15: Normalized products satisfy detailed balance also at each boundary.
    q04: Return-cycle calculation covers finite/infinite J, null and positive recurrence,
      transient upper states and J=0.
    qx08: The canonical answer correctly resolves the source’s overly strong strict
      inequality by pairwise cost comparison and the uniform equality case.
    qx09: The generating function for the chain at completion epochs gives a geometric
      law. Monotone domination establishes convergence of means, and the box-time
      chain is recurrent.
    q01: The positive-probability shortest path avoids the starting state and precludes
      a return.
