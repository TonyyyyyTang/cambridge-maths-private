blind_qx08_supplement:
  sha256: 217ba3f0a95655ce67ec90c7c91ab41f956bf332612d43b4af5f36e9900fdf6a
  markdown: "# Independent rework of qx08\n\nWrite a, b, c for the selection probabilities\
    \ of books i, j, k in a permutation. The hypotheses inherited from the other statement\
    \ are independent choices over days, strictly positive probabilities, and a +\
    \ b + c = 1. All sums over shelf arrangements run over the six permutations of\
    \ three distinct books. A day's choice is independent of the current order.\n\n\
    ## Transposition equilibrium\n\nFrom ijk the chain remains there with probability\
    \ a, moves to jik with probability b and moves to ikj with probability c. Write\
    \ w(ijk) = a²b and Z = ∑ w over the six orders. For the first adjacent swap, the\
    \ two unnormalised equilibrium flows are (a²b)b and (b²a)a. For the second swap\
    \ the flows are (a²b)c and (a²c)b. Each pair is equal. These account for every\
    \ transition between distinct orders, so π(ijk) = w(ijk)/Z satisfies detailed\
    \ balance and is invariant. The adjacent swaps generate all permutations and have\
    \ positive probability, so the finite chain is irreducible and the invariant distribution\
    \ unique. Each order has a positive self-transition, so convergence also holds\
    \ from every initial order.\n\n## Pairwise comparison\n\nUnder move-to-front,\
    \ a choice of i or j determines which of the two precedes the other, and a choice\
    \ of k preserves their order. Stationarity gives p = a + cp for the probability\
    \ p that i precedes j. Thus p = a/(a+b). At equilibrium the contribution of the\
    \ pair {i,j} to expected retrieval position beyond 1 is b p + a(1-p) = 2ab/(a+b).\
    \ This follows by counting a unit for each book that precedes the requested book.\n\
    \nFor transposition let A and B be the unnormalised masses of the orders in which\
    \ i precedes j and j precedes i, respectively. Listing ijk, ikj, kij and then\
    \ jik, jki, kji gives\n\n    A = a²b + a²c + c²a,     B = b²a + b²c + c²b,   \
    \  A+B = Z.\n\nThen bA − aB = abc(a−b), hence A/B > a/b when a>b. More generally,\
    \ the transposition probability t = A/Z satisfies\n\n    t − a/(a+b) = abc(a−b)/[Z(a+b)].\n\
    \nThe reduction in expected cost contributed by this unordered pair is\n\n   \
    \ [b p + a(1−p)] − [b t + a(1−t)]\n      = (a−b)(t−p) = abc(a−b)²/[Z(a+b)].\n\n\
    Summing over the three unordered pairs proves\n\n    C_move-to-front − C_transposition\n\
    \       = (α₁α₂α₃/Z) ∑_{i<j} (αᵢ−αⱼ)²/(αᵢ+αⱼ).\n\nEvery denominator and the prefactor\
    \ are positive. Thus transposition has strictly lower stationary cost exactly\
    \ when the three probabilities are not all equal. Ties in a single pair give zero\
    \ reduction for that pair. At α₁ = α₂ = α₃ = 1/3 the costs are both 2, since the\
    \ new request is uniform independently of the current shelf. Consequently the\
    \ printed universal claim “smaller” must mean “no larger”, with the strictness\
    \ condition above.\n\n## Endpoints if the probability domain is enlarged\n\nZero\
    \ probabilities lie outside the referenced question. With exactly two positive\
    \ probabilities the unrequested book eventually occupies the last position under\
    \ either rule. For transposition, its position can only move right and, until\
    \ last, has at least the smaller positive selection probability of advancing each\
    \ day. For move-to-front, once both positive-probability books have been chosen\
    \ they precede it. The two rules then coincide on the front two books, giving\
    \ equal stationary costs. With only one positive probability its book eventually\
    \ reaches the front under both rules and the limiting retrieval cost is 1. In\
    \ that degenerate case the relative order of the other two is conserved, there\
    \ are two absorbing arrangements, and Z is zero.\n"
  comparison: The explicit positive prefactor times the sum of squared pairwise differences
    recovers the canonical cost inequality and the precise equality condition. The
    discussion outside the stated domain does not change that result.
