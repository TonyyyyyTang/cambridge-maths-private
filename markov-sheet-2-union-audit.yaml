  script before freezing the five derivations. A preliminary lookup displayed transcription
  source notes, including the qx08 note disclosing equality at uniform probabilities.
  Four reworks were fully blind to any solution-relevant note. The qx08 algebra was
  derived independently, but the boundary observation is identified as pre-exposed.
  An additional clean-context solver received only qx08 and its referenced printed
  question, and froze the supplement before any comparison. The explicit pairwise
  saving abc(a-b)^2/[Z(a+b)] agrees with the stored solution, independently covering
  the equality case. The supplemental derivation counts toward the original selected
  unit and adds no statistical observation.
frozen_rework_markdown: '# Markov Chains sheet 2 — independent rework


  Seed 20261128, random.Random(seed).sample(sorted(all 25 stable question directory
  names), 5) yielded q15, q04, qx08, qx09, q01 in that order. I used the five statements,
  the move-to-front assumptions in the 2012 printed Question 9, and images of their
  printed sources. The source locator lookup also displayed the qx08 transcription-verification
  note flagging equality for uniform probabilities before freezing. I did not open
  any candidate solution, prior comparison, check, or old audit. The following calculations
  use the statements directly.


  ## q15


  Put w_0=1, w_{i+1}=w_i lambda_i/mu_{i+1}. These are positive and summable on the
  finite interval. With pi_i=w_i/sum_j w_j the forward equilibrium mass flow pi_i
  lambda_i equals the reverse pi_{i+1} mu_{i+1}. All nonadjacent flows vanish and
  self-loops match themselves, including both endpoints. Summing detailed balance
  over the origin of an edge yields stationarity. Multiplication of detailed balance
  along any finite positive-probability path shows equal forward and reversed path
  probabilities when the initial law is pi. Zero-probability paths agree in both directions.
  The chain is irreducible, so this is the unique equilibrium.


  ## q04


  Let p=1-r and D have distribution a. Each positive level is left downwards after
  a geometric(p) number of steps almost surely. From zero, accessibility includes
  every level up to J, since hitting a height at least i has probability A_i=P(D>=i)>0.
  Thus C={i:A_i>0} (including 0) is irreducible, closed and recurrent. Indeed, each
  zero excursion is finite a.s.; its length is one first step and the time to make
  D downward moves. Thus m_0=1+E[D]/p, in extended expectations. For finite E[D],
  excursions between zero visits contain on average A_i/p visits to i>0, and one visit
  to 0 (include the left endpoint and exclude the right). The normalized excursion
  occupation measure is stationary; by the reciprocal-frequency/mean-return theorem,
  m_i=(p+E[D])/A_i for i in C, i>0. Infinite E[D] makes zero null recurrent, and irreducibility
  gives infinite mean returns throughout C. This includes J=infinity with either finite
  or infinite E[D] and J=0 with m_0=1. If J<infinity every state i>J forms a transient
  singleton class: after its first downward move it is never reachable again; its
  one-step probability of returning is r, the total eventual return probability is
  r, and its unconditional mean return time is infinite. All recurrent periods are
  one, since any positive state has a self-loop (and if C={0}, it too has one).


  ## qx08


  Write a,b,c for the positive probabilities of the three named books i,j,k (sum 1).
  The candidate permutation weight w(x,y,z)=alpha_x^2 alpha_y balances both possible
  adjacent swaps: exchange x,y with rates alpha_y outward, alpha_x back, whose weighted
  flows both equal alpha_x^2 alpha_y^2. Exchange y,z with rates alpha_z outward, alpha_y
  back and common weighted flow alpha_x^2 alpha_y alpha_z. Normalizing on the six
  permutations gives the reversible equilibrium of this finite irreducible chain.
  Among the six weights, total mass numerator for i before j is A=a^2(b+c)+c^2 a;
  for j before i it is B=b^2(a+c)+c^2 b. Hence bA-aB=abc(a-b), so A/(A+B)>a/(a+b)
  when a>b and equality when a=b. For move-to-front the more recently chosen of the
  two precedes the other, so the equilibrium probability i precedes j is a/(a+b) (the
  most recent occurrence of either has this chance of being i). For that unordered
  pair retrieval cost above one is a+(b-a)P(i precedes j); the move-to-front value
  is 2ab/(a+b). Pairwise transposition saves strictly when a!=b and has the same contribution
  when a=b, by symmetry. Summing, the transposition rule costs strictly less unless
  all three probabilities are 1/3, in which case each cost is 2; thus the literal
  universal strict inequality in the print does not hold. The displayed index i≠j≠k
  must range over permutations as stipulated.


  ## qx09


  Start with counts (0,0,0), strip complete sets, and sort remaining counts. At 2h
  leftovers the counts are (h,h,0); at 2h+1 they are (h+1,h,0). The least-two rule
  preserves these forms, choosing arbitrarily at ties. At 0 or 1 the leftover count
  increases by one deterministically. At any x>=2 it moves to x+1 when a held prize
  is obtained and to x-2 when the missing label is obtained and one set completes,
  each with probability 1/2. This box-time chain is irreducible: take rises to reach
  any desired high state, from even x take descents to zero, from odd x>=1 first rise
  then descend. Conditional drift is -1/2 outside {0,1} and finite inside. Foster''s
  drift criterion with V(x)=x proves positive recurrence. The box-time period is 3
  because both jumps equal 1 mod 3 and a three-step return exists at 0.


  To get the law exactly at completion epochs, write Y_n for the leftovers when the
  nth set completes, Y_0=0. Starting from j, first climb deterministically to max(j,2),
  then count the extra up-steps before the next downward step. Their number G satisfies
  P(G=k)=2^{-(k+1)}, k>=0, independently in successive cycles. Therefore Y_{n+1}=(Y_n-2)^++G_{n+1}.
  This completion chain is irreducible (zero geometric draws move every j down to
  0, from which every k is possible in one transition) and aperiodic (P(0,0)>0). A
  geometric stationary distribution on k>=0 has masses (1-t)t^k, where t=(sqrt(5)-1)/2
  solves t^2+t=1. Indeed E[s^((Y-2)^+)]=1-t^2+t^2(1-t)/(1-ts) and E[s^G]=1/(2-s).
  Their product simplifies to (1-t)/(1-ts) using t^2+t=1. Thus Y_n converges in law
  to this geometric equilibrium. Couple Y_0=0 and an independently sampled stationary
  Y*_0 using the same G increments. Monotonicity gives Y_n<=Y*_n for all n; the stationary
  geometric tails ensure uniform integrability. Hence E[Y_N] tends to t/(1-t)=(1+sqrt(5))/2.
  Raw box times and completion epochs have distinct laws.


  ## q01


  For any j different from the absorbing s, take a shortest positive-probability path
  from j to s. It has no revisit to j before arrival; otherwise deletion through that
  revisit gives a shorter positive path. Its strictly positive path probability is
  a lower bound for the probability of never returning to j, since s traps the chain.
  Thus each j other than s has return probability strictly below one and is transient.
  Almost-sure absorption is unnecessary.

  '
