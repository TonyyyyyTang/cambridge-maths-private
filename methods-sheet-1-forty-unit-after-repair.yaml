math_comparison:
  q04: Three repaired exact historical texts. Correct complex and paired real coefficients (negative sine factor),
    symmetric jump average cosh(pi) and summation by evaluating at a seam. Existing 2015-16 and modern answers still
    match their respective prompts.
  qx08: The real finite-power interpretation gives the finite partial sum identity by orthogonality and its limit
    by L2 convergence. Correct odd Fourier coefficients, two passband harmonics and transmitted fraction 80/(9π²).
  q11: Six repaired texts. Coefficients, integral with removable singularities, simple stationary points, finite-height
    correction, 1.08949 limit, persistent overshoot and corresponding undershoot all agree. In 2001-02 the answer
    explains the counterexample m=N; in 2014-15 it corrects the enumerating index to m and explicitly defines a
    consistent x,N notation. These and the 2015-16 version distinguish the exact finite height from the strictly
    smaller limiting height. Historical sharp-jump plots show open endpoints while the actual N=8 sum crosses 1/2.
    Modern half-open assignments remain explicit in the modern plot; 2015-16 and 2016-17 historical plots distinguish
    unspecified endpoint values from Fourier midpoints.
  untouched: Hashes of the other 11 exact-text answers and all 58 question texts match the prior audit. Verified
    inclusion under the expected printed numbers; re-executed their scripts including canonical q09, qx26, qx10,
    qx11, q06.
