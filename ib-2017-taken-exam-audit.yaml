  IB/2017/P1/q11G:
    independent_rework: '# IB 2017 P1 q11G — independent rework


      Uniform continuity means that for each $\epsilon>0$ there exists $\delta>0$
      such that $d(x,y)<\delta$ implies $|f(x)-f(y)|<\epsilon$ for all $x,y$. On a
      closed finite interval $[a,b]$, suppose this fails. Choose $x_n,y_n$ with $|x_n-y_n|<1/n$
      and $|f(x_n)-f(y_n)|\ge\epsilon$ for a fixed $\epsilon>0$. By compactness, a
      subsequence of $x_n$ converges to $x$ in the interval, and the corresponding
      $y_n$ converge to the same $x$. Continuity contradicts the output gap. A singleton
      is included. Compactness matters if ''closed interval'' is extended to rays.


      Lipschitz means that some finite $L\ge0$ satisfies $|f(x)-f(y)|\le Ld(x,y)$
      for all pairs. Taking $\delta=\epsilon/(1+L)$ gives uniform continuity.


      (i) False. For the bounded continuous $f(x)=\sin(x^2)$ take $x_n=\sqrt{2\pi
      n}$ and $y_n=\sqrt{2\pi n+\pi/2}$. Their difference in absolute value is $(\pi/2)/(x_n+y_n)\to0$
      while the images differ by one.


      (ii) True. The mean value theorem gives the Lipschitz inequality with $L=\sup|f''|$.


      (iii) True. Clamp each $x$ to $p_n(x)=\min(n,\max(-n,x))$. This is 1-Lipschitz.
      The restriction of $f$ to $[-n,n]$ is uniformly continuous, so $f\circ p_n$
      is uniformly continuous on $\mathbb R$ and equals $f(x)$ when $n\ge|x|$.

      '
    independent_rework_sha256: 51efe208bc871dd370af69e9a071f1d5a44067d9234bd7cd8497aaca236a14f4
    comparison: Compactness of a finite closed interval, the counterexample sin(x²),
      the mean value theorem and saturation outside [−n,n] independently give the
      same conclusions.
