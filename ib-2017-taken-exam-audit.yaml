  IB/2017/P1/q1F:
    independent_rework: '# IB 2017 P1 q1F — independent rework


      Let $u_1,\ldots,u_r$ be independent and $v_1,\ldots,v_s$ span the same ambient
      space. Then $r\le s$ and one can replace $r$ distinct members of the latter
      list by the former list and still span. Indeed suppose the first $j$ replacements
      have been made. If $j<r$, expand $u_{j+1}$ in the current spanning list. Independence
      forces a nonzero coefficient on an unreplaced $v$. Solve the expansion for that
      $v$ and exchange it for $u_{j+1}$, preserving the span. If the original $v$''s
      were exhausted before all the replacements, the next $u$ would already be a
      linear combination of earlier ones. This proves both assertions, including empty
      lists.


      Comparison with the coordinate basis bounds the size of any independent set
      by $n$ (otherwise take $n+1$ elements), and bounds the size of every finite
      spanning set below by $n$. Thus an independent spanning set has size $n$. If
      an independent $n$-element set failed to span, adjoining an outside vector would
      contradict the first bound. If a spanning $n$-element set were dependent, deleting
      one vector having a nonzero coefficient in a dependence would contradict the
      second bound. These arguments include $n=0$.


      The coordinate columns relative to $(e_1,e_2)$ have determinant $\lambda^2-1$.
      They form a basis precisely for $\lambda\in\mathbb R\setminus\{-1,1\}$.

      '
