  IB/2017/P3/q17C:
    independent_rework: '# IB 2017 P3 q17C — independent rework


      (i) Let the smaller charge be at $u$, larger at $v$, and write $s=|q_u|/|q_v|<1$.
      With potential zero at infinity, cancellation is equivalent to $|x-u|=s|x-v|$.
      Squaring and completing the square gives centre $c=(u-s^2v)/(1-s^2)$ and radius
      $R=s|u-v|/(1-s^2)$. As $|c-u|=sR<R$ and $|c-v|=R/s>R$, only the smaller charge
      is inside.


      (ii) Write $p=|\mathbf p|>a$. In the exterior domain the potential solves $\Delta
      V=-(q/\epsilon_0)\delta_{\mathbf p}$, vanishes on the grounded sphere, and tends
      to zero at infinity. Equivalently it is harmonic off the source and has Coulomb
      singular part $q/(4\pi\epsilon_0|x-\mathbf p|)$. Put $\mathbf p''=a^2\mathbf
      p/p^2$ and $q''=-aq/p$. For any $|x|=a$, squaring shows $|x-\mathbf p''|=(a/p)|x-\mathbf
      p|$. Hence $V=(4\pi\epsilon_0)^{-1}(q/|x-\mathbf p|+q''/|x-\mathbf p''|)$ has
      all required properties; $|\mathbf p''|<a$ so the second term creates no exterior
      singularity. Uniqueness follows by applying the maximum principle to the difference
      (regular at $\mathbf p$) in bounded annuli, then letting the outer radius diverge.
      Thus the exterior electric field equals minus the gradient of this image potential.


      The force on $q$ uses only the regular image field. The separation is $p-a^2/p$
      and the sign is attractive. Its magnitude is $q^2ap/[4\pi\epsilon_0(p^2-a^2)^2]$
      and its direction is radially inward, $-\mathbf p/p$.

      '
    independent_rework_sha256: d0962e8e97562c1891257fafb76a669f8e8057559d41f0d2f9d0ffdac2092c1c
    comparison: The audit independently derives the centre and radius of the zero-potential
      sphere, identifies its enclosed charge, and verifies image inversion, uniqueness
      and the inward force.
