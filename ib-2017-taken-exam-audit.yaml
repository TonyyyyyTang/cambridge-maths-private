  IB/2017/P2/q8H:
    independent_rework: '# IB 2017 P2 q8H — independent rework


      (a) A confidence interval is an interval-valued statistic $I(X)$ whose sampling
      coverage $P_\theta\{\theta\in I(X)\}$ is $\gamma$ for every parameter value
      (at least $\gamma$ for a conservative procedure).


      (b) $\sqrt n(\bar X-\mu)$ is standard normal by independence. The central interval
      of probability .95 has endpoints $\pm\Phi^{-1}(.975)$, so inversion gives $\bar
      X\pm\Phi^{-1}(.975)/\sqrt n$, approximately $\bar X\pm1.96/\sqrt n$.


      (c) Put $L=\min(U_1,U_2)$ and $H=\max(U_1,U_2)$. Each observation falls independently
      above or below $\theta$ with equal probability, and the probability that exactly
      one lies on each side is $1/2$. Thus $[L,H]$ has exact 50% coverage. For the
      given data this reports $[10,11.5]$. Every compatible $\theta$ must lie in the
      intersection of the two support constraints, $[H-1,L+1]=[10.5,11]$. This entire
      shorter interval can be reported as a certain support bound.


      If a conditional 50% interval is wanted, set $M=(L+H)/2$, $D=H-L$. The order
      statistics have constant joint density on $\theta-1<L<H<\theta+1$. In $(M,D)$
      coordinates the Jacobian is constant, so conditional on $D=d<2$, $M-\theta$
      is uniform on $[-(1-d/2),1-d/2]$. Its central half therefore gives $M\pm(1-D/2)/2$,
      here $[10.625,10.875]$. This is a pre-specified procedure with exact conditional
      and unconditional coverage.

      '
    independent_rework_sha256: 47497533ab7c66fbddccb06645f0b9572c58b5e210015b662868edf1d2414b49
    comparison: 'All three constructions agree: an interval from order statistics
      with half coverage, the certain support interval [10.5,11], and the central
      conditionally exact half-coverage interval [10.625,10.875].'
