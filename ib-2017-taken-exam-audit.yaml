  IB/2017/P4/q12G:
    independent_rework: '# IB 2017 P4 q12G — independent rework


      At $a\in U$, differentiability means that a linear map $A:\mathbb R^m\to\mathbb
      R^n$ satisfies $f(a+h)=f(a)+Ah+o(\|h\|)$ as $h\to0$. Differentiability on $U$
      means this holds at every $a$.


      In the planar scalar case, work inside a ball about $a=(x,y)$ lying in $U$.
      For small $h=(s,t)$ first increment the first coordinate and then the second.
      The one-variable mean value theorem gives

      \[

      f(x+s,y+t)-f(x,y)

      =s f_x(x+\alpha s,y)+t f_y(x+s,y+\beta t)

      \]

      for intermediate $\alpha,\beta\in(0,1)$ (omit a term for a zero increment).
      Continuity of the partials makes the difference from $sf_x(a)+tf_y(a)$ equal
      to $o(1)(|s|+|t|)=o(\|h\|)$. This proves differentiability.


      The given quotient is smooth off $(0,0)$ since its denominator is positive there.
      On the axes $f(x,0)=x$ and $f(0,y)=2y^2$, so any derivative at the origin must
      send $(s,t)$ to $s$. Along $(t,t)$, $f(t,t)=t/2+t^2$. For $t\downarrow0$ the
      residual divided by $\sqrt2t$ tends to $-1/(2\sqrt2)$, excluding differentiability
      at that point.

      '
    independent_rework_sha256: 37acd6dc143a2798a862bedbe6b4e871a4eef119f9757c58144dd4b90870569b
    comparison: The coordinate axes force the derivative to be (s,t)↦s, while the
      diagonal remainder has absolute ratio tending to 1/(2√2). Both proofs justify
      the positive result from continuous partial derivatives.
