  IB/2017/P1/q18C:
    independent_rework: "# IB 2017 P1 q18C — independent rework\n\nWrite $F=f(y_n)$,\
      \ $D=f'(y_n)$, $B=f''(y_n)$ and $c=a_2+a_3$. Taylor expansion at the old state\
      \ gives\n\\[\nk_2=F+ha_1DF+\\tfrac12h^2a_1^2B[F,F]+O(h^3),\n\\quad k_3=F+hcDF+h^2\\\
      {a_3a_1D(DF)+\\tfrac12c^2 B[F,F]\\}+O(h^3).\n\\]\nThe exact solution started\
      \ at this state has increment\n$hF+\\tfrac12 h^2DF+\\tfrac16h^3(B[F,F]+D(DF))+O(h^4)$\n\
      by differentiating the differential equation. Matching the coefficient of each\
      \ term gives sufficient conditions\n\\[\n b_1+b_2+b_3=1,\\quad b_2a_1+b_3c=\\\
      tfrac12,\\quad\n b_2a_1^2+b_3c^2=\\tfrac13,\\quad b_3a_3a_1=\\tfrac16 .\n\\\
      ]\nFor a sufficiently smooth $f$, the local defect is $O(h^4)$. On a fixed time\
      \ interval in a neighbourhood of the exact trajectory with bounded derivatives,\
      \ the explicit step is Lipschitz with factor $1+O(h)$, so the propagated error\
      \ is $O(h^3)$.\n\nFor the linear test $f(y)=\\lambda y$, writing $z=h\\lambda$,\
      \ a three-stage explicit step has stability polynomial of degree at most three,\
      \ and matching through third order fixes it to $R(z)=1+z+z^2/2+z^3/6$. Substitution\
      \ gives $R(-5/2)=-47/48$, whose modulus is strictly below one.\n"
    independent_rework_sha256: be0944871394872ecf7c494591c620414c71f12377a4fc90002032745d891ec6
    comparison: The two distinct third-order differential terms give all four order
      conditions. Both compute −47/48 for the degree-three stability polynomial at
      −5/2.
