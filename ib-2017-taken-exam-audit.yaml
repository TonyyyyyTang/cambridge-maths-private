  IB/2017/P1/q13A:
    independent_rework: '# IB 2017 P1 q13A — independent rework


      (a) Close the contour above by the radius-$R$ semicircle centred at $-ic$. For
      fixed $\lambda$ above the line it encloses $\lambda$ eventually. On the arc
      $|z|$ and $|z-\lambda|$ are of order $R$ and the integrand is $o(R^{-2})$ uniformly.
      The arc integral vanishes in the limit, and the line integral converges absolutely
      in the tails. Cauchy''s formula now gives $F(\lambda)=f(\lambda)$ throughout
      the required half-plane.


      (b) Put $A=\operatorname{Res}_{z=\alpha_+}g(z)$. Close $C_1$ and $C_2$ separately
      above. Both semicircles are in the allowed decay region and the same estimate
      applies. For $\operatorname{Im}\lambda>-c$, $\lambda\ne\alpha_+$, the two residues
      give

      \[

      H(\lambda)=g(\lambda)+A/(\alpha_+-\lambda).

      \]

      Subtracting its principal part leaves $g$ regular at $\alpha_+$. At that very
      parameter the integrand has Laurent coefficient of $(z-\alpha_+)^{-1}$ equal
      to the constant Laurent coefficient of $g$ at $\alpha_+$, so the original integral
      takes precisely the continued value. This proves (i).


      For $\operatorname{Im}\lambda<c$ the only pole above $C_2$ is $\alpha_+$, and
      the prefactor includes a minus sign, giving $J(\lambda)=A/(\lambda-\alpha_+)$
      throughout this lower half-plane, including $\lambda=\alpha_-$. This proves
      (ii) without a decay assumption in the far lower half-plane. Adding the two
      formulas proves (iii) in the open strip.

      '
    independent_rework_sha256: 946bf36c6d6a960279da330abe81ceb35bf25e219f910f50bf4d3bae40651c54
    comparison: The upper closures use exactly the allowed decay half-plane. The auditor
      also treats the coincident upper pole by the constant Laurent coefficient and
      verifies the decomposition on the open strip.
