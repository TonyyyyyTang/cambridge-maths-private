  IB/2017/P4/q18D:
    independent_rework: "# IB 2017 P4 q18D — independent rework\n\nLet $D=u_x+v_y$\
      \ and $W=v_x-u_y$. Taking the vertical curl of momentum gives $W_t+fD=0$, as\
      \ the curl of a gradient vanishes. Continuity gives $\\eta_t=-h_0D$. Hence $(W-f\\\
      eta/h_0)_t=0$, which is exactly $\\mathbf Q_t=0$ since all vorticity is vertical.\
      \ Taking the horizontal divergence instead gives $D_t-fW=-g\\Delta\\eta$. Differentiating\
      \ continuity and eliminating $D_t$, then writing $W=Q_z+f\\eta/h_0$, gives\n\
      \\[\n \\eta_{tt}-gh_0\\Delta\\eta+f^2\\eta=-h_0 fQ_z=-h_0\\mathbf f\\cdot\\\
      mathbf Q .\n\\]\n\nPut $c=\\sqrt{gh_0}$. At $\\mathbf Q=0$ the plane wave gives\
      \ $\\omega=\\pm\\sqrt{f^2+c^2k^2}$. Both branches are even in $k$, with horizontal\
      \ tangents at $(0,\\pm|f|)$ for nonzero rotation; their asymptotes are the lines\
      \ $\\omega=\\pm ck$. A schematic for $f\\ne0$ is\n\n```\n         ω\n    \\\
      \    ↑    /\n     \\___•___/     +|f|\n---------+--------→ k\n     /‾‾‾•‾‾‾\\\
      \     −|f|\n    /    |    \\\n```\n\nWith the stated positive sign of $\\omega\
      \ t$, signed crest velocity is $-\\omega/k$ and packet speed is $-d\\omega/dk$.\
      \ In magnitude $v_p=\\sqrt{c^2+(f\\lambda/(2\\pi))^2}$ and $v_g=c^2|k|/\\sqrt{f^2+c^2k^2}$,\
      \ with wavelength $\\lambda=2\\pi/|k|$. At long wavelengths crests move faster,\
      \ whereas packets propagate more slowly. As $k\\to0$, the waves approach inertial\
      \ oscillations with frequency $|f|$, divergent phase speed and vanishing group\
      \ speed. Rotation strongly affects long waves: the ratio $v_g/v_p=c^2k^2/(f^2+c^2k^2)$\
      \ becomes small. For short waves it approaches one, with both speeds tending\
      \ to $c$ and weak dispersion. Setting $f=0$ gives nondispersive gravity waves.\n"
