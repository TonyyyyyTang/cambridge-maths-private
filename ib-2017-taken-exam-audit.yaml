  IB/2017/P2/q16A:
    independent_rework: "# IB 2017 P2 q16A — independent rework\n\nWith $\\phi=R(r)\\\
      Theta(\\theta)Z(z)$, periodicity gives $\\Theta''=-m^2\\Theta$ with $m=0,1,\\\
      ldots$ and the sine and cosine modes (constant alone when $m=0$). Put $Z''=sZ$.\
      \ The radial equation is $r^2R''+rR'+(sr^2-m^2)R=0$. For $s=k^2>0$ the axial\
      \ pair is $e^{\\pm kz}$ and radial pair $J_m(kr),Y_m(kr)$. For $s=-k^2<0$ the\
      \ axial pair is $\\sin kz,\\cos kz$ and the radial pair $I_m(kr),K_m(kr)$. At\
      \ $s=0$ the axial pair is $1,z$ and the radial pair is $r^{\\pm m}$ for $m>0$,\
      \ or $1,\\log r$ for $m=0$. Superpose products of those factors over $m$ and\
      \ the relevant separation spectrum, summing or integrating with coefficients\
      \ determined by boundary data. Regularity on an included axis excludes the singular\
      \ factors.\n\nA bounded particular solution matching the side values is\n\\\
      [\n e^{-4z}\\left(\\frac{J_1(4r)}{J_1(4)}\\cos\\theta+\n              \\frac{J_2(4r)}{J_2(4)}\\\
      sin2\\theta\\right)\n +2e^{-z}\\frac{J_2(r)}{J_2(1)}\\sin2\\theta .\n\\]\nEach\
      \ radial equation has the separated parameter dictated by the exponential, and\
      \ the angular harmonics and exponential decay give a regular bounded field.\
      \ The side condition follows by putting $r=1$. The three denominators are about\
      \ $-0.06604,0.36413,0.11490$, respectively, using $J_m(x)=\\sum_{\\ell\\ge0}(-1)^\\\
      ell(x/2)^{2\\ell+m}/(\\ell!(m+\\ell)!)$ (the decreasing alternating tail bounds\
      \ the truncation error).\n\nThe printed conditions leave the base $z=0$ free.\
      \ For example every multiple of $e^{-jz}J_0(jr)$, where $j$ is the first positive\
      \ zero of $J_0$, can be added. This is regular at the axis, bounded, and zero\
      \ on the entire side. Thus the particular solution is one of infinitely many\
      \ even under decay at infinity.\n"
    independent_rework_sha256: 7ef53245fd65ec2be07b7d21eab46c0276089b028d250cb08479e91271ed2223
    comparison: All three separation regimes agree. Alternating Bessel series bound
      the three denominators away from zero; the same zero-side decaying mode shows
      that the unspecified base permits infinitely many bounded solutions.
