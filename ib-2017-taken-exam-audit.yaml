  IB/2017/P2/q17B:
    independent_rework: "# IB 2017 P2 q17B — independent rework\n\n(a) Rescaling $-\\\
      hbar^2\\psi''/(2m)+m\\omega^2x^2\\psi/2=E\\psi$ gives $\\psi_{\\xi\\xi}+(2E/(\\\
      hbar\\omega)-\\xi^2)\\psi=0$. Factoring out $e^{-\\xi^2/2}$ leaves\n\\[\n f''-2\\\
      xi f'+(2E/(\\hbar\\omega)-1)f=0.\n\\]\nUnder the supplied polynomial assumption\
      \ let the degree be $n$. The leading term forces $2E/(\\hbar\\omega)-1=2n$.\
      \ Conversely, at that energy the coefficients obey $(k+2)(k+1)a_{k+2}=2(k-n)a_k$.\
      \ Start with nonzero $a_0$ for even $n$ or nonzero $a_1$ for odd $n$, and set\
      \ the other parity to zero. The series terminates exactly at degree $n$, and\
      \ the Gaussian factor makes every such wavefunction square-integrable. Hence\
      \ $E_n=(n+\\frac12)\\hbar\\omega$ for all nonnegative integers $n$.\n\n(b)(i)\
      \ Set $d=qE$. The new potential equals $(x-d)^2/2-d^2/2$. Translation preserves\
      \ the oscillator spectrum, so the new energies are $(n+\\frac12)\\hbar-d^2/2$.\n\
      \n(ii) The finite sudden change of potential leaves the wavefunction at the\
      \ switching instant equal to the old ground state, up to phase. Its overlap\
      \ with the translated ground state is\n\\[\n (\\pi\\hbar)^{-1/2}\\int_{\\mathbb\
      \ R}\n e^{-[x^2+(x-d)^2]/(2\\hbar)}\\,dx\n =e^{-d^2/(4\\hbar)},\n\\]\nsince\
      \ $x^2+(x-d)^2=2(x-d/2)^2+d^2/2$. Its squared modulus is $e^{-q^2 E^2/(2\\hbar)}$.\n"
    independent_rework_sha256: 0eaa5e3757478a6b5eeffe4b83a5b1793819626bac0dbf39f3536e4c4a4a3c81
    comparison: The polynomial recurrence and Gaussian factor yield all allowed oscillator
      energies. Translating the well and integrating the sudden-change overlap give
      the same probability exp(−q²E²/(2ℏ)).
