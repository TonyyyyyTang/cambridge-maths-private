  IB/2017/P1/q9F:
    independent_rework: '# IB 2017 P1 q9F — independent rework


      (i) Can be false. Take $\alpha:\mathbb R^2\to\mathbb R$, $\alpha(x,y)=x$. Every
      composition $\beta\alpha$ kills $(0,1)$, while the identity fixes it.


      (ii) Always true. Lift a basis $v_i$ of $V$ to $u_i\in U$ with $\alpha u_i=v_i$.
      Linearly extending $\beta v_i=u_i$ gives $\alpha\beta=I_V$.


      (iii) Always true. The restriction to $W=\operatorname{im}\beta$ is surjective
      by (ii). If $\alpha\beta v=0$ then $v=0$, proving injectivity on $W$.


      (iv) Can be false. For $\alpha(x,y)=x+y$, take the two coordinate lines. Their
      direct sum is the plane but both images equal $\mathbb R$, so have nontrivial
      intersection.


      (v) Can be false. For $\alpha(x,y)=x$ take $X$ to be the first coordinate line
      and $Y=0$. The images give the direct sum $\mathbb R\oplus0$ but the sum in
      the domain misses $(0,1)$.

      '
