  IB/2017/P2/q20H:
    independent_rework: '# IB 2017 P2 q20H — independent rework


      Write $S_k=Y_1+\cdots+Y_k$, with $S_0=0$. The chain records the time remaining
      until the next renewal, including the present time if it is a renewal. At a
      positive state $j$ its next state is $j-1$ with certainty. At a renewal time
      $n=S_k$ the past chain up to $n$ is determined by gaps through $Y_k$; condition
      on the possible value $k$ and on those gaps. The next gap $Y_{k+1}$ has the
      original law independently, so the next state is distributed as $Y_1-1$ regardless
      of that past. This gives the Markov property and the row $P(0,j)=P(Y_1=j+1)$
      for $j\ge0$, with the countdown rows just described.


      The first positive return from zero is the first gap $Y_1$, including a one-step
      return when $Y_1=1$. Thus its mean is $\mu$.


      On $C=\{j\ge0:P(Y_1>j)>0\}$ every state reaches zero, and zero reaches each
      state by sampling a sufficiently large gap and counting down (zero itself is
      a renewal). This is a closed irreducible countable class and is positive recurrent
      since the mean return time at zero is finite. The period is the gcd of the support
      of $Y_1$: first returns have those lengths and every return is a sum of such
      lengths. The stipulated gcd is one. The convergence theorem for an irreducible,
      aperiodic, positive recurrent countable chain states that $P^n(i,j)\to\pi_j$,
      where $\pi$ is the unique invariant probability and $\pi_j=1/E_j T_j^+$. Here
      $X_0=0$, giving the requested limit $1/\mu$, including the deterministic unit-gap
      case.

      '
    independent_rework_sha256: ed16176ca97b2de5ddc0de61f5cda1351b029ce9ee2f65f07871e73dc069d77b
    comparison: The accessible countdown class, mean return μ and gcd period agree.
      The auditor explicitly proves independence of the next gap by conditioning on
      the index of the current renewal.
