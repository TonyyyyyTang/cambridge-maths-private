  IB/2017/P4/q17B:
    independent_rework: "# IB 2017 P4 q17B — independent rework\n\n(a)(i) Write $L=\\\
      partial_t-K\\partial_{xx}$ with $K>0$. The free-space heat kernel $F$ satisfies\
      \ $LF=0$ for $t>0$ and $F(\\cdot,t)\\to\\delta_0$ as $t\\downarrow0$ in distributions.\
      \ It decays at spatial infinity and has unit mass. The causal Green function\
      \ satisfies $L_{x,t}G=\\delta(x-y)\\delta(t-\\tau)$, vanishes for $t<\\tau$\
      \ and decays at spatial infinity; equivalently it solves the homogeneous equation\
      \ after a jump with trace $\\delta_y$ at $\\tau^+$.\n\n(ii) Start a fresh homogeneous\
      \ solution at time $\\tau$ with initial profile $h(\\cdot,\\tau)$. At $t>\\\
      tau$ it is $u_\\tau(x,t)=\\int F(x-y,t-\\tau)h(y,\\tau)\\,dy$. The specified\
      \ Heaviside factor in $G$ gives $\\phi(x,t)=\\int_0^t u_\\tau(x,t)\\,d\\tau$:\
      \ each infinitesimal input subsequently diffuses freely. This has zero initial\
      \ data, and applying $L$ gives the endpoint contribution $u_t(x,t)=h(x,t)$,\
      \ all interior terms vanishing. Here the subscript of $u_\\tau$ labels a starting\
      \ time.\n\n(b) Evenly reflect the data across $x_1=0$; symmetry enforces a zero\
      \ normal temperature derivative. At the origin, the original and reflected annular\
      \ wedges contribute equally. Their combined angular measure is $\\pi$, so\n\\\
      [\n T(0,t)=\\frac{\\pi T_0}{4\\pi Kt}\\int_1^2 r e^{-r^2/(4Kt)}\\,dr\n     \
      \  =\\frac{T_0}{2}\\big(e^{-1/(4Kt)}-e^{-1/(Kt)}\\big).\n\\]\nSet $u=e^{-1/(4Kt)}$,\
      \ which increases from $0$ to $1$. The factor $u-u^4$ vanishes at both endpoints,\
      \ increases up to $u=4^{-1/3}$ and decreases thereafter by differentiation.\
      \ The unique maximum occurs at $t=3/(4K\\log 4)=3/(8K\\log 2)$.\n"
    independent_rework_sha256: c716313b59c55ba25fa029b127ecad363aa525e5ec1e5fadec6fc1995c03a1c7
    comparison: The causal heat trace and Duhamel formula agree. The reflected sectors
      jointly subtend π and independent one-variable maximisations give the same time
      3/(8K log 2).
