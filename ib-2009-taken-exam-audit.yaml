      source_finding: The four row labels, both column headings and eight counts match
        the printed table. The two chi-square references have three and four degrees
        of freedom respectively, with the printed cutoffs preserved. No individual
        mark allocation is printed.
      printed_label: 8H
      figure_sha256:
        figures/third-child-counts.png: c5806cf51cac8382e391206b7ddaae90c3846f9f1d52b80fd4f8f18e307df20e
    independent_rework: '# Independence test with fixed row totals


      Rows \(GG,GB,BG,BB\) each contain 50 families. Their boy counts are \(16,28,25,31\),
      giving a column total of 100, and the girl counts are \(34,22,25,19\), also
      totaling 100. Under the null of a common third-child boy probability \(p\) across
      the four row groups, the pooled estimate is \(100/200=1/2\). Each row therefore
      has fitted counts \(25,25\).


      With independent sampled families the Pearson statistic for the \(4\times2\)
      table is

      \[

      X^2=2(9^2+3^2+0^2+6^2)/25=10.08 .

      \]

      There are four unrestricted proportions and one fitted common proportion, giving
      \(4-1=3\) asymptotic degrees of freedom. The value 10.08 exceeds 7.8147. Reject
      the independence hypothesis at the 5% level for the population represented by
      this sampling design.

      '
    main_comparison: Conditioning on four fixed row totals gives expected counts of
      25 in every cell. The homogeneity test gives 10.08 on three degrees of freedom
      and rejects at five percent.
