    independent_rework: '# Banach fixed point theorem


      Let \(X\) be a nonempty complete metric space, and \(T:X\to X\) satisfy \(d(Tu,Tv)\le
      c\,d(u,v)\) with a fixed \(0\le c<1\). Then \(T\) has exactly one fixed point,
      and iteration from any point converges to it.


      Choose \(x_0\in X\) and put \(x_{n+1}=Tx_n\). Induction gives \(d(x_n,x_{n+1})\le
      c^n d(x_0,x_1)\). Summation bounds \(d(x_n,x_m)\le c^n d(x_0,x_1)/(1-c)\) for
      \(m>n\). The sequence is Cauchy, and completeness gives a limit \(p\in X\).
      The Lipschitz inequality gives continuity, so \(Tp=\lim Tx_n=\lim x_{n+1}=p\).
      For fixed points \(p,q\), \(d(p,q)\le c\,d(p,q)\) forces equality of the points.


      On \(\mathbb R\) the derivative of \(T=f\circ f\) is \(e^{-x}\exp(-e^{-x})\).
      Setting \(y=e^{-x}>0\), the derivative is \(ye^{-y}\), maximized at \(y=1\)
      with value \(1/e\) by elementary differentiation. The mean value theorem therefore
      gives the global contraction constant \(1/e\) on the complete space \(\mathbb
      R\). If \(p=Tp\) is its unique fixed point, then \(T(f(p))=f(T(p))=f(p)\). Uniqueness
      gives \(f(p)=p\). Every fixed point of \(f\) is fixed by \(T\), so \(p\) is
      the unique real solution.

      '
    main_comparison: The second iterate of exp(−x) on the complete real line has derivative
      bounded in magnitude by 1/e. The first iterate maps the unique fixed point of
      the second to itself.
