      printed_label: 7B
    independent_rework: '# Spectral probabilities and mean energy


      With the \(L^2\) inner product \(\langle u,v\rangle=\int\overline u v\,dx\),
      Hermiticity implies \(E_n\langle\psi_m,\psi_n\rangle=E_m\langle\psi_m,\psi_n\rangle\)
      (the eigenvalues are real). For \(m\ne n\) the eigenvalues are distinct and
      hence the inner product vanishes. For \(m=n\) normalization gives 1.


      Write \(c_n=2^{-(n+1)/2}\). Time evolution multiplies each eigenstate by its
      stationary phase, giving the norm-convergent expansion

      \[

      \Psi(x,t)=\sum_{n=0}^\infty c_n e^{-iE_n t/\hbar}\psi_n(x).

      \]

      For each partial sum the squared norm equals the sum of its squared coefficients
      by orthonormality. The squared tails tend to zero and \(\sum_{n\ge0}2^{-(n+1)}=1\);
      the limit therefore has unit norm. The probability of energy \(E_m\) is the
      squared norm of its spectral component, \(2^{-(m+1)}\), independent of time.
      The first moment of this distribution is

      \[

      \langle E\rangle=\sum_{n=0}^\infty E_n\,2^{-(n+1)},

      \]

      which is time-independent whenever finite. More generally \(E_n\ge E_0\), so
      the extended mean always exists; the expression can be \(+\infty\) under the
      printed hypotheses (for example the strictly increasing sequence \(E_n=2^n\)).
      No bound on the growth of \(E_n\) is given. The spectral argument does not assume
      \(\Psi\) belongs to the operator domain of an unbounded \(H\).

      '
    main_comparison: Energy-dependent phases leave the geometric probabilities 2^(−n−1)
      unchanged. The mean requires summability of the weighted energies, and their
      ordering alone does not imply it. The given state is normalized in Hilbert space
      regardless.
