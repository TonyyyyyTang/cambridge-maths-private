      transcription_discrepancies: []
      source_finding: The prose, including the printed single word “statespace”, agrees.
        The example figure places A at file 2, rank 5 with all nine starred destinations,
        and the walk starts separately at the bottom left corner. Independence of
        the random choice is understood conditional on the current square; reversibility
        is with respect to the invariant law. No individual mark allocation is printed.
      printed_label: 9H
      figure_sha256:
        figures/bishop-moves.png: 83224a446f2688a93840b453258cd29ba69240d68d7e104be3c8069854cde371
    independent_rework: '# Bishop walk on the corner''s colour


      Use coordinates \(1\le i,j\le8\), starting at \((1,1)\). Each diagonal move
      preserves \(i+j\bmod2\), so only the 32 squares with even sum are available.
      Conversely any such square connects along a diagonal to \((k,k)\), \(k=(i+j)/2\),
      and thence to \((1,1)\), suppressing any step of length zero. Thus the state
      graph is connected.


      Let \(d(i,j)\) be the number of other squares on the two diagonals through \((i,j)\).
      Their lengths are \(8-|i-j|\) and \(8-|i+j-9|\), so \(d(i,j)=14-|i-j|-|i+j-9|\).
      By the move rule the probability of any neighboring square, conditional on the
      history, is \(1/d(i,j)\); this proves the Markov property. Write \(D\) for the
      sum of the degrees on the reachable colour. Weights \(\pi(s)=d(s)/D\) then satisfy
      \(\pi(s)P(s,t)=1/D=\pi(t)P(t,s)\) on any edge, and zero in both directions on
      a nonedge. Detailed balance implies invariance and reversibility with respect
      to \(\pi\); finite irreducibility gives uniqueness. A deterministic initial
      corner need not have stationary path marginals.


      In one diagonal direction the whole board has two diagonals of each length 1
      through 7 and one of length 8. Each length \(k\) contributes \(k(k-1)\) directed
      transitions. This gives \(2\sum_{k=1}^7 k(k-1)+8\cdot7=280\) for one direction
      and 560 for both. Reflection \(i\mapsto9-i\) interchanges the colours and preserves
      bishop adjacency. Hence \(D=280\), fixing the normalization explicitly. The
      corner has degree 7 and invariant mass \(7/280=1/40\). By the mean recurrence
      time formula for an irreducible finite chain, starting at the corner gives expected
      positive first return time 40 moves.

      '
    main_comparison: The accessible bishop graph is connected on one colour and the
      invariant measure is proportional to the vertex degree. The total degree is
      280 and the corner degree is seven, giving mean return time 40.
