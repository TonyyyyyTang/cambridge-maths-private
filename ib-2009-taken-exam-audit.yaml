      question_packet_sha256: 1a525ea664471a33cccdef656330c075a50b9a765a282bf535f79d76c31b3711
      blind_rework_sha256: f337cbdab091de8feffc10fe49fb657043215563008fde2b6da5e8d11eb567f9
      transcription_discrepancies: []
      source_finding: All three labelled subparts agree, including zero initial velocity,
        ignoring gravity, signs and image/real charge locations. No individual mark
        allocation is printed.
      printed_label: 16A
    independent_rework: '# Earthed plane and fall time


      In electrostatic equilibrium the electric field is zero inside an ideal conductor.
      A thin rectangular loop straddling the plane has zero circulation of \(\mathbf
      E\) and vanishing end contributions as its height tends to zero. Thus the tangential
      component is continuous and both tangential components just above the plane
      vanish. Earthing fixes the potential there at zero.


      With \(r_\pm=\sqrt{x^2+y^2+(z\mp d)^2}\) the potential in the upper half-space
      is

      \[

      \phi=\frac{q}{4\pi\epsilon_0}(r_+^{-1}-r_-^{-1}).

      \]

      It vanishes on the plane because \(r_+=r_-\) there, so its tangential derivatives
      vanish too. It has the prescribed charge singularity and decays at infinity.
      Uniqueness for the grounded Dirichlet problem gives the exterior potential of
      the real conductor.


      In the electrostatic image-force approximation the force at each height \(z>0\)
      is the attraction to the instantaneous image \(2z\) away. Omitting the charge''s
      own field gives \(m\ddot z=-K/z^2\), \(K=q^2/(16\pi\epsilon_0)\). Symmetry and
      zero transverse initial velocity keep the motion vertical. Multiply by \(\dot
      z\) and apply \(z(0)=d,\dot z(0)=0\) to get \(\tfrac12 m\dot z^2=K(1/z-1/d)\).
      On the downward trajectory the first hitting time is

      \[

      T=\sqrt{\frac{md^3}{2K}}\int_0^1\sqrt{\frac{u}{1-u}}\,du

      =\frac{\pi}{2}\sqrt{\frac{8\pi\epsilon_0 m d^3}{q^2}} .

      \]

      Here \(u=\sin^2\theta\) evaluates the integral as \(\int_0^{\pi/2}2\sin^2\theta\,d\theta\).
      This assumes \(q\ne0,\ m,d>0\); an uncharged particle released at rest would
      remain at height \(d\).

      '
    main_comparison: With the grounded plane modeled by an instantaneous image charge,
      the electrostatic force uses separation 2z. Integrating the inverse-square equation
      from rest gives (π/2)√(md³/(2K)), with K=q²/(16πε₀).
