      blind_rework_sha256: 6b2de03df8c0e5c01d6e25053771066316942fdb19ac08b7be6596ee07df92f9
      transcription_discrepancies: []
      source_finding: The open interval, the half constant coefficient, both powers
        of minus one and the final pi-squared over twelve agree. No individual mark
        allocation is printed.
      printed_label: 5B
    independent_rework: '# Half-range expansions


      The odd \(2\pi\)-periodic extension of \(x\) on \((0,\pi)\) is piecewise smooth
      and continuous on \((-\pi,\pi)\). The Fourier convergence theorem gives its
      sine series there. Integration by parts yields

      \[

      b_n=\frac2\pi\int_0^\pi x\sin(nx)\,dx=\frac{2(-1)^{n-1}}n,\qquad

      x=2\sum_{n\ge1}\frac{(-1)^{n-1}}{n}\sin(nx).

      \]

      For any \(b<\pi,\ b>0\), partial sums of \((-1)^{n-1}e^{int}\) are uniformly
      bounded on \([0,b]\) by \(2/\min_{0\le t\le b}|1+e^{it}|\), by the geometric
      formula. Dirichlet''s test gives uniform convergence of the sine series there
      (its value at zero is zero). Thus for \(0<x<\pi\) we may integrate termwise
      from 0 to \(x\), giving

      \[

      x^2=4\sum_{n\ge1}\frac{(-1)^{n-1}}{n^2}(1-\cos nx).

      \]

      Absolute convergence allows separation: \(a_n=4(-1)^n/n^2\) for \(n\ge1\) and
      \(a_0=8\sum_{n\ge1}(-1)^{n-1}/n^2\). The cosine expansion is uniformly absolutely
      convergent, hence integrable termwise on \([0,\pi]\); each nonconstant cosine
      integrates to zero. Therefore

      \(a_0=(2/\pi)\int_0^\pi x^2dx=2\pi^2/3\), and the alternating reciprocal-square
      sum is \(\pi^2/12\).

      '
    main_comparison: The sine coefficients are 2(−1)^(n−1)/n. Integration is justified
      by L² convergence on a bounded interval; averaging the resulting absolutely
      convergent cosine series gives the alternating reciprocal-square sum π²/12.
