      printed_label: 11E
    independent_rework: '# Moving secants for a dyadic tent series


      Let \(d(t)=\operatorname{dist}(t,\mathbb Z)\). The triangle inequality gives
      \(|d(t)-d(s)|\le |t-s|\); also \(0\le d\le1/2\). The positive series defining
      \(f\) thus has finite sum. Each of its first \(N\) summands is 1-Lipschitz.
      The difference of its two tails at any \(x,y\) has magnitude at most \(2^{-N-1}\),
      since both tails lie in \([0,2^{-N-1}]\). Consequently \(|f(x)-f(y)|\le N|x-y|+2^{-N-1}\).
      Choosing \(N\) large and then \(|x-y|<\epsilon/(2N)\) proves continuity directly.


      Differentiability at \(x\) gives \(g(t)=g(x)+L(t-x)+r(t)\), with \(r(x)=0\)
      and \(|r(t)|\le\epsilon |t-x|\) for nearby \(t\). For any sufficiently large
      \(n\), the error of the straddling secant from \(L\) is bounded by

      \[

      \epsilon (|v_n-x|+|u_n-x|)/(v_n-u_n)=\epsilon.

      \]

      This includes an endpoint equal to \(x\).


      Use the intervals \([u_n,v_n]=[2^{-n}\lfloor 2^n x\rfloor,u_n+2^{-n}]\), always
      choosing the right interval at a dyadic \(x\). They nest, straddle \(x\) and
      shrink to it. At both endpoints terms of index \(k\ge n\) vanish. Every term
      with \(1\le k<n\) is affine on the interval: all its slope changes are in \(2^{-(k+1)}\mathbb
      Z\), which is contained in the level-\(n\) grid. Its slope there is \(+1\) or
      \(-1\). Passing to the chosen half at level \(n+1\) preserves all these slopes
      and adds precisely the slope \(+1\) or \(-1\) of term \(n\). Thus consecutive
      secant slopes differ in absolute value by 1 and cannot converge. The secant
      criterion precludes a finite derivative at every \(x\).


      The original prints “denominator \(2^{-n}\)”. The endpoints have mesh \(2^{-n}\)
      and may be written with integer denominator \(2^n\); the proof uses the permitted
      “otherwise” route.

      '
    main_comparison: Escalation resolved by bounding the tail directly and checking
      dyadic endpoints. On nested mesh intervals each added summand changes the secant
      slope by exactly one in absolute value, including right-hand intervals at dyadic
      points. This contradicts secant convergence under differentiability and uses
      the alternative proof allowed by the wording.
