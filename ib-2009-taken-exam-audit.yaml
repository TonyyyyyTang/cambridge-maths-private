      question_packet_sha256: b4cff347bcbbeccc474ddbde910177416ffbaf863320dec0a43eac5d3188cea9
      blind_rework_sha256: 126ee0c33400009aef13c6c7dd7b7a1904070876a45e82c42d2995d6eac2df50
      transcription_discrepancies: []
      source_finding: The area inequality, pressure reference, momentum direction
        and squared area-ratio factor agree. The displayed result uses the usual steady,
        equal-elevation, lossless approximation. No individual mark allocation is
        printed.
      printed_label: 8D
    independent_rework: '# Nozzle pressure and holding force


      Take the positive axis along the stream and use gauge pressures. With steady
      incompressible flow, the mean speeds at the two uniform sections are \(u_i=Q/A_i\).
      Applying Bernoulli at equal elevation, with negligible losses and uniform inlet/outlet
      velocities, gives

      \[

      p_0=\tfrac12\rho(u_1^2-u_0^2)=\tfrac12\rho Q^2(A_1^{-2}-A_0^{-2})

      \]

      since the free jet has \(p_1=0\).


      Let \(W\) be the signed force the nozzle wall exerts on the enclosed fluid.
      The steady control-volume balance gives \(p_0 A_0+W=\rho Q(u_1-u_0)\); the outlet
      pressure has zero gauge value. Using \(Q=A_0u_0\) gives

      \(W=-\tfrac12\rho A_0(u_1-u_0)^2\).

      The fluid therefore pushes the nozzle downstream, and the fireman exerts an
      upstream force of magnitude

      \[

      F=\frac{\rho A_0}{2}(u_1-u_0)^2

      =\frac{\rho Q^2}{2A_0}\left(\frac{A_0}{A_1}-1\right)^2 .

      \]

      The pressure difference and holding force both vanish in the limiting case of
      equal areas.

      '
    main_comparison: The fluid momentum balance and Bernoulli pressure give an upstream
      force exerted by the wall on the water. The holding force on the nozzle has
