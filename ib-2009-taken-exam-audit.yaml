      source_finding: All five numbered claims agree, including the complex-field
        qualifications in (1), (2), (3), (5), the power n on both products in (3),
        and the W_c and W_(c+1) subscripts in (5). No individual mark allocation is
        printed.
      printed_label: 10G
    independent_rework: '# Five questions about endomorphisms


      1. True for \(n\ge1\). Choose a complex eigenvalue \(\lambda\) of \(A\), and
      its nonzero eigenspace \(U\). For \(u\in U\), \(ABu=BAu=\lambda Bu\), so \(B\)
      preserves \(U\). A complex endomorphism of a nonzero finite-dimensional space
      has an eigenvector; one for \(B|_U\) works for both matrices.


      2. False. \(A=I_n,\ B=2I_n\) commute and have respective spectra \(\{1\}\) and
      \(\{2\}\).


      3. True. \((BA)^{n+1}=B(AB)^n A=0\), so \(BA\) is nilpotent. All its eigenvalues
      are zero and its degree-\(n\) characteristic polynomial is \(t^n\). Cayley–Hamilton
      gives \((BA)^n=0\).


      4. False. Take the identity on a two-dimensional space. Its \(1\)-eigenspace
      has dimension two, but its minimal polynomial is \(t-1\) and the root has multiplicity
      one.


      5. True. In complex Jordan form the multiplicity of \(\lambda\) in the minimal
      polynomial is the greatest size of a block for \(\lambda\): a block \(J_s(\lambda)\)
      has minimal polynomial \((t-\lambda)^s\) since its superdiagonal shift has nilpotency
      index \(s\), and block minima combine by least common multiple. On the sum of
      all \(\lambda\)-blocks, both powers \(c,c+1\) of \(T-\lambda I\) vanish. On
      any block of another eigenvalue, \(T-\lambda I\) is invertible (upper triangular
      with nonzero diagonal), so both kernels there are zero. The two kernels therefore
      coincide on the entire space.

      '
    main_comparison: The five truth values are true, false, true, false, true. In
      the last item applying the residual polynomial to a vector in the eigenspace
      multiplies it by the nonzero scalar q(λ), forcing kernel stabilization at c.
