      question_packet_sha256: 76f34682a6419236950154a73ebe356cdf1db4dcb3baea5ba3eb5d0dc6d2d4c4
      blind_rework_sha256: 2e15c3f9d78dcabcadbd17733d10b48c772a5c0a7d7296c6b0ab0af359615134
      transcription_discrepancies: []
      source_finding: The two columns of partial derivatives, their evaluation points
        and the full curve equation agree. No individual mark allocation is printed.
      printed_label: 5B
    independent_rework: '# Stationarity on a level curve


      Assume \(f,g\) are continuously differentiable. At a regular point of \(g=0\),
      a local tangent to the level curve is perpendicular to \(\nabla g\). At a constrained
      stationary point the directional derivative of \(f\) along that tangent vanishes,
      hence \(\nabla f=\lambda\nabla g\). Solve this system with the constraint to
      locate candidates; examine points with \(\nabla g=0\) separately. In the plane
      parallelism gives \(f_xg_y-f_yg_x=0\), exactly the printed determinant. At a
      singular point the determinant vanishes automatically.


      Maximize \(f=x^2+y^2\) with \(g=x^2+y^2+xy-4\). The constraint gradient vanishes
      only at \((0,0)\), off the curve. Its determinant condition is \(2x(2y+x)-2y(2x+y)=2(x^2-y^2)=0\).
      For \(y=x\) one obtains \(x^2=4/3\) and \(f=8/3\); for \(y=-x\) one gets \(x^2=4\)
      and \(f=8\). The curve is closed and bounded since \(x^2+y^2+xy\ge(x^2+y^2)/2\).
      The global maximum distance is therefore \(2\sqrt2\), attained at \((2,-2),(-2,2)\).

      '
    main_comparison: The regular constraint gives parallel gradients, with singular
      points checked separately. The squared-distance upper bound is 8 and equality
      requires y=−x, giving precisely (2,−2) and (−2,2).
