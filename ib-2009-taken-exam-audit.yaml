      printed_label: 3D
    independent_rework: '# Complex differentiability and the harmonic conjugate


      Write the complex derivative at an interior point first with a real increment
      \(h\), then with increment \(ih\), \(h\in\mathbb R\). From the former \(f''=u_x+iv_x\);
      from the latter \(f''=(u_y+iv_y)/i=v_y-iu_y\). Both limits exist by complex
      differentiability. Equating components gives \(u_x=v_y,\ u_y=-v_x\).


      For the given real part, \(v_y=-e^{-x}\cos y,\ v_x=e^{-x}\sin y\). The candidate
      \(v_0=-e^{-x}\sin y\) has precisely these derivatives. Thus \(v-v_0\) is locally
      constant and constant on the connected domain \(D\). For a real constant \(C\),

      \[

      v=-e^{-x}\sin y+C,\qquad f(z)=e^{-z}+iC.

      \]

      The real and imaginary parts agree by Euler''s formula.

      '
    main_comparison: Real and imaginary increments give the same Cauchy–Riemann pair.
      The required function is exp(−z)+iC on each connected component.
