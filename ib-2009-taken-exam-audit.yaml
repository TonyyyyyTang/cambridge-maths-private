      transcription_discrepancies: []
      source_finding: Both requests, the field, dimension eight and the two multiplicities
        of the polynomial agree. No individual mark allocation is printed.
      printed_label: 1G
    independent_rework: '# Minimal polynomial and an example


      Put \(d=\dim V\). The \(d^2+1\) endomorphisms \(I,T,\ldots,T^{d^2}\) are linearly
      dependent in \(\operatorname{End}(V)\), of dimension \(d^2\). A nontrivial dependence
      gives a nonzero polynomial \(p\) with \(p(T)=0\). Among such polynomials choose
      one of smallest degree and normalize it to be monic. This is the minimal polynomial.
      Two distinct monic candidates of the same least degree would differ by a nonzero
      annihilator of smaller degree; hence it is unique. Polynomial division also
      shows it divides every annihilator. For the zero vector space the monic polynomial
      \(1\) annihilates the unique endomorphism.


      On \(\mathbb C^8\) take the block diagonal matrix with Jordan blocks \(J_2(0),J_3(1),J_3(1)\),
      writing \(J_s(a)=aI_s+N_s\), where \(N_s\) has ones immediately above the diagonal
      and other entries zero. Each block has minimal polynomial \((t-a)^s\): powers
      \(N_s^k\), \(0\le k<s\), have distinct nonzero diagonals and \(N_s^s=0\). A
      polynomial kills the direct sum precisely when it kills every block, so the
      least monic choice is their least common multiple \(t^2(t-1)^3\).

      '
    main_comparison: 'Finite-dimensional dependence supplies an annihilator and monic
      minimality gives uniqueness. The different eight-dimensional examples are both
      valid: the two longest blocks have lengths 2 at zero and 3 at one, and the other
      blocks do not change the least common multiple.'
