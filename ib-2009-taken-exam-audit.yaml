      transcription_discrepancies: []
      source_finding: Jacobi update, spectral radius inequality, matrix brackets and
        all nine entries agree, including the two unequal lower-left coefficients.
        No individual mark allocation is printed.
      printed_label: 6C
    independent_rework: '# Jacobi error propagation


      Invertibility of \(A\) gives one solution \(x\); substituting it into the iteration
      gives the same \(x\) at each step. Subtract that identity to get \(e_n=H e_{n-1}=H^ne_0\)
      for \(e_n=x_n-x\). All real starting errors are possible. Convergence for all
      of them implies columnwise convergence \(H^n\to0\), by taking coordinate vectors,
      and hence convergence on complex vectors as well. A nonzero complex eigenvector
      of eigenvalue \(\lambda\) then gives \(\lambda^n v\to0\), requiring \(|\lambda|<1\).


      Conversely take a complex Jordan form for \(H\). Each block \(J=\lambda I+N\)
      with \(N^s=0\) has for \(n\ge s\)

      \[

      J^n=\sum_{k=0}^{s-1}\binom nk\lambda^{n-k}N^k.

      \]

      For \(0<|\lambda|<1\) exponential decay dominates each polynomial factor; a
      zero-eigenvalue block vanishes for \(n\ge s\). Conjugation by a fixed invertible
      matrix preserves entrywise convergence to zero. This proves the equivalence
      without a diagonalizability assumption.


      In this case \(H\) has rows \((0,0,\mu),(\mu/3,0,\mu/3),(\mu,0,0)\). Expanding
      \(\det(tI-H)\) along column two gives \(t(t^2-\mu^2)\). Therefore \(\rho(H)=|\mu|\),
      and the answer is \(-1<\mu<1\). At the excluded endpoints \(A\) is singular
      (its determinant is \(12(1-\mu^2)\)); \(\mu=0\) gives a one-step iteration.

      '
    main_comparison: Convergence for all initial errors is equivalent to the decay
      of every complex Jordan block. The iteration matrix has characteristic polynomial
      t(t²−μ²), giving exactly −1<μ<1.
