auditor_report: '# Fresh blind rework of 13 Cambridge Part IB questions, 2009


  I independently solved the 13 supplied questions, using the question-only packet
  and the archived exam pages identified by its locators. I compared each statement
  to the rendered original page, including mathematical symbols, qualifications, labels,
  subparts, and both supplied figures. None of the 13 questions carries an individual
  mark allocation. I found **0 transcription discrepancies in 13 questions**. Existing
  solutions and reviews were outside the blind inputs, so a solution comparison and
  its observed error rate belong to the integrating reviewer.


  | Paper and label | PDF page | Independent result |

  |---|---:|---|

  | P1 3D | 2 | The analytic function is exp(−z) + iC for real C. |

  | P1 6C | 4 | Jacobi converges from every start exactly for −1 < μ < 1. |

  | P1 11E | 6 | Continuity follows from the uniform tail bound. Successive nested
  dyadic secant slopes differ by exactly one in magnitude. |

  | P1 16A | 10 | The tangential field vanishes. The instantaneous image force gives
  fall time (π/2)√(8πε₀md³/q²) for nonzero charge. |

  | P2 3E | 2 | The second iterate is a contraction on the entire real line with constant
  1/e. Its fixed point is fixed by the first iterate. |

  | P2 5B | 3 | The cosine coefficients are 4(−1)ⁿ/n² for n ≥ 1 and the alternating
  sum is π²/12. |

  | P2 8D | 4 | The gauge pressure is ρ(u₁²−u₀²)/2. The holding force is upstream,
  with magnitude ρA₀(u₁−u₀)²/2. |

  | P3 7B | 3 | Energy probabilities are 2⁻⁽ᵐ⁺¹⁾ and the corresponding weighted energy
  mean is time-independent, possibly infinite. |

  | P3 8H | 4 | Pearson statistic 10.08 on three degrees of freedom exceeds 7.8147.
  Reject at 5%. |

  | P3 10G | 5 | The five answers are true, false, true, false, true. |

  | P4 1G | 2 | Jordan block sizes 2, 3, 3 with eigenvalues 0, 1, 1 give the required
  example. |

  | P4 5B | 3 | Maximum distance 2√2, attained at (2,−2) and (−2,2). |

  | P4 9H | 5 | On the 32 reachable squares the invariant mass is degree/280. The
  mean first return time is 40. |


  P1 11E prints “denominator 2⁻ⁿ”. Its dyadic intervals have width 2⁻ⁿ and endpoints
  expressible with integer denominator 2ⁿ. The transcription correctly preserves the
  original exponent. P3 7B assumes an increasing spectrum with lower bound E₀. It
  omits any upper growth bound needed to guarantee a finite weighted mean. P4 9H fixes
  a particular initial state. The conventional reversibility assertion is detailed
  balance for the transition kernel with respect to its stationary measure.


  For each question, the packet hash in source.json covers the exact bytes of question.tex;
  any diagram has its own hash. The source PDF, printed label and first page identify
  the physical evidence. Each rework hash covers rework.md. SHA256SUMS covers this
  report and the 26 question-level evidence files.

  '
main_resolution: The shrinking dyadic intervals give successive slopes differing by
  one. Geometric spectral probabilities need not give a finite mean energy without
  a growth bound. Detailed balance gives reversibility with respect to the degree-weighted
  invariant law; the corner return time is 40 moves. The independence statistic is
  10.08 on three degrees of freedom.
