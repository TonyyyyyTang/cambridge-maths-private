  september_capture_review: Original A4 PostScript prints Michaelmas term 1999, Dr
    E.P.S. Shellard, and the sheet identifiers on C10a, C10b and C10d. The US Letter
    PDF counterparts omit the teaching header. The September 2000 C10c PDF has no
    visible term or lecturer, and the page break clips the beginning of the exercise
    preceding question 9. The subsequent sheet III original has different questions.
    The linked contemporary DAMTP directory is consistent with publication by April
    2000. Retrieval dates, checksums and edition evidence are recorded below and in
    the manifest.
