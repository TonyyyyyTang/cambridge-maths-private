frozen_blind_rework_markdown: '# Frozen blind rework of Michaelmas 2025 Markov Chains
  Sheet 2


  Population q01–q16, sample in draw order q16, q08, q01, q10. I read just the selected
  question fragments and both original printed pages before recording these derivations.
  None of the four questions cross-references Sheet 1. I did not consult stored answers,
  checks, review notes or previous working.


  ## q16 — cycle criterion (original p. 2)


  Positive recurrence and irreducibility yield a unique invariant probability π with
  π_i>0 at every state. If the chain is reversible in equilibrium, detailed balance
  holds (apply reversal to the two-time distribution). On multiplying around a closed
  path, the π factors on the two sides have the same positive product and cancel;
  zero transition probabilities cause no problem. Conversely fix states i,j and m≥1.
  Apply the cycle identity to a starting edge i→j followed by an arbitrary m-step
  walk j→i. Sum over the intervening states; reversal bijects these walks with m-step
  walks i→j. Nonnegative sums can be grouped without additional hypotheses. This gives
  p_ij (P^m)_ji = p_ji (P^m)_ij. The convergence theorem for irreducible aperiodic
  positive recurrent chains gives (P^m)_ji→π_i and (P^m)_ij→π_j, hence detailed balance.
  For each finite path x0,…,xk multiply π_x0 by the product of its transition probabilities
  and telescope detailed balance, obtaining the equilibrium probability of the reverse
  path. This proves reversibility even when particular paths have probability zero.
  The one-state chain and repeated states cause no exceptional case. Aperiodicity
  was used only for the ordinary transition limits; Cesàro limits suffice without
  it.


  ## q08 — four-dimensional simple walk (original p. 1)


  Start at the origin by translation. Its first three coordinates remain fixed on
  each fourth-coordinate move (probability 1/4), and otherwise move uniformly among
  six neighbours. At the successive times when one of these three coordinates changes
  the embedded chain is the ordinary 3D simple symmetric walk (memoryless independent
  increments). Each holding block has geometric(3/4) length including the first occupation,
  finite almost surely. Countably many holding blocks are all finite almost surely.
  Since the 3D walk is transient, the embedded chain visits the origin only finitely
  often almost surely. The projected chain therefore has only finitely many origin
  epochs and every four-dimensional origin epoch is among those. This proves origin
  transience, and translation gives every state. Equivalently the projected Green
  function is (4/3) times its 3D embedded Green function.


  ## q01 — absorbing state (original p. 1)


  For j≠s, accessibility gives a finite path of positive probability from j to s.
  Choose one of minimal length, so there are no intermediate returns to j (or earlier
  visits to s). Its event has positive probability. Once it happens, absorption prevents
  every subsequent visit to j. Thus the chance of ever returning after time zero is
  strictly less than one, precisely transience. The proof works for each j and relies
  only on positive probability of some finite path; almost sure absorption is unnecessary.
  With s the only state the assertion is vacuous.


  ## q10 — Ehrenfest process (original p. 1)


  Let Z_n count A''s molecules after n choices. Given the complete history, including
  the labels of the present molecules, a uniformly chosen molecule comes from A with
  probability k/N and from B with probability (N−k)/N when Z_n=k. These conditional
  probabilities depend only on k, so conditioning on the count history still gives
  the Markov property, with jumps k→k−1 or k→k+1 and all other probabilities zero.
  At 0 and N the inward jump is forced. N≥1 is implicit in the choice of one molecule.
  On the hypercube of N labelled molecules a uniform law on arrangements is preserved,
  since flipping a fixed coordinate is a bijection and its equal-weight random mixture
  preserves uniformity. Its push-forward is π_k=2^{-N} binom(N,k). Alternatively π_k(N−k)=π_{k+1}(k+1)
  verifies detailed balance along every edge. All states communicate by consecutive
  up/down jumps, hence uniqueness. This includes N=1 (alternation). Period two does
  not prevent stationarity.

  '
